<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>月巴快跑 · 全力冲刺</title>
<style>
  :root{
    /* 浅色基底（specs/arcade-run/plan.md 第五节，取贪吃蛇简约版变量） */
    --bg:#f0ede8; --board:#fafaf7; --card:#ffffff;
    --ink:#3a3a3a; --ink2:#8c8c8c; --line:#e0dcd5;
    --tomato:#ff3b30; --glow:#ff6b5e; --leaf:#4fd8a8; --sprint:#ff9500;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);}
  body{font-family:"SF Mono","Cascadia Mono",Consolas,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:manipulation;overscroll-behavior:none;}
  /* 纸面点状纹理（纯 CSS，零图片；借 memory.html 手法，色随浅色基底） */
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(58,58,58,.05) 1px,transparent 1px);
    background-size:8px 8px;}
  #stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));}
  #wrap{display:flex;flex-direction:column;gap:8px;width:min(96vw,460px);height:100%;max-height:820px;}

  /* 切角面板（借 snake.html / memory.html 手法：外层墨线 + 内层纸面） */
  .panel{background:var(--ink);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);padding:2px;}
  .panel>.pin{background:var(--board);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

  /* ---------- 顶部 HUD（借 memory.html 同构：品牌 + 数据片 + 按钮） ---------- */
  #topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;flex:0 0 auto;height:36px;padding:0 2px;}
  .brand{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:900;letter-spacing:2px;white-space:nowrap;}
  .brand .bpre{font-style:normal;color:var(--tomato);}
  .stats{display:flex;align-items:stretch;gap:4px;margin-left:auto;flex:0 0 auto;}
  .stat{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:2px 7px;background:var(--card);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);}
  .stat span{font-size:8px;font-weight:800;letter-spacing:1.2px;color:var(--ink2);}
  .stat b{font-size:13px;line-height:1;text-align:right;font-variant-numeric:tabular-nums;}
  .stat b em{font-style:normal;color:var(--ink2);font-size:10px;}
  #hudBtns{display:flex;gap:4px;flex:0 0 auto;}
  .hudbtn{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:var(--card);border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:900;color:var(--ink);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  .hudbtn:active{transform:translate(1px,1px);}
  body.narrow .brand .bpre{display:none;}
  body.narrow .stat{padding:2px 5px;}
  body.narrow .stat span{letter-spacing:.4px;}

  /* ---------- 冲刺倒计时：金番茄触发时排空，平时为空（scaleX 驱动） ---------- */
  #sprintRow{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:14px;padding:0 2px;}
  #sprintRow span{font-size:8px;font-weight:800;letter-spacing:1.2px;color:var(--ink2);}
  #sprintBar{flex:1 1 auto;height:6px;background:var(--card);position:relative;overflow:hidden;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%);}
  #sprintFill{position:absolute;top:0;left:0;bottom:0;width:100%;background:var(--sprint);
    transform:scaleX(0);transform-origin:left center;}

  /* ---------- 跑道 ---------- */
  #trackPanel{flex:1 1 auto;min-height:0;}
  #trackPanel .pin{position:relative;}
  #cv{display:block;width:100%;height:100%;touch-action:none;}

  /* ---------- 台词气泡（幸存者范式：头像 + 气泡，淡入自动消失） ---------- */
  #talk{position:absolute;left:10px;bottom:12px;z-index:3;display:flex;align-items:flex-end;gap:6px;
    opacity:0;transform:translateY(6px);transition:opacity .22s ease,transform .22s ease;pointer-events:none;}
  #talk.show{opacity:1;transform:translateY(0);}
  #talkAvatar{flex:0 0 36px;width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--card);border:2px solid var(--ink);}
  #talkAvatar img{width:100%;height:100%;object-fit:cover;display:block;}
  #talkFb{display:none;width:100%;height:100%;align-items:center;justify-content:center;
    font-weight:900;font-size:15px;color:var(--board);background:var(--fbc,#c96a73);}
  #talkBubble{position:relative;max-width:200px;background:var(--card);border:2px solid var(--ink);
    padding:4px 8px;font-size:10px;font-weight:800;line-height:1.45;color:var(--ink);text-align:left;}
  #talkBubble::after{content:'';position:absolute;left:-6px;bottom:8px;width:8px;height:8px;
    background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);}
  @media (pointer:coarse){ #talk{bottom:64px;} }   /* 让开 dpad */

  /* ---------- 触屏方向键（仅粗指针设备显示；贪吃蛇 dpad 兜底同款思路） ---------- */
  #dpad{display:none;flex:0 0 auto;gap:8px;}
  #dpad .btn{flex:1 1 0;width:auto;}
  @media (pointer:coarse){ #dpad{display:flex;} }

  /* ---------- 暂停 / 结算遮罩 ---------- */
  .ov{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    background:rgba(58,58,58,.55);}
  .ov.show{display:flex;}
  .ovcard{width:min(78vw,260px);text-align:center;padding:2px;}
  .ovcard .pin{padding:16px 12px;gap:10px;align-items:center;position:relative;}
  .ovcard h3{font-size:15px;letter-spacing:4px;}
  .ovcard p{font-size:10px;color:var(--ink2);}
  .rows{width:100%;display:flex;flex-direction:column;gap:4px;}
  .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:800;}
  .row em{font-style:normal;color:var(--ink2);}
  .btn{width:100%;height:32px;display:flex;align-items:center;justify-content:center;gap:3px;
    background:var(--card);border:2px solid var(--ink);color:var(--ink);cursor:pointer;font:inherit;
    font-size:11px;font-weight:800;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);}
  .btn:active{transform:translate(1px,1px);}
  .btn.on{background:var(--ink);color:var(--board);}

  /* ---------- 破纪录彩纸（低功耗 / reduced-motion 关闭） ---------- */
  #confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  #confetti i{position:absolute;top:-14px;width:7px;height:11px;animation:cfall linear forwards;}
  @keyframes cfall{to{transform:translateY(320px) rotate(560deg);}}

  /* ---------- 成就解锁提示条 ---------- */
  #achToast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top));z-index:20;
    transform:translate(-50%,-10px);opacity:0;pointer-events:none;
    background:var(--ink);color:var(--board);font-size:11px;font-weight:800;letter-spacing:1px;
    padding:7px 14px;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
    transition:opacity .22s ease,transform .22s ease;white-space:nowrap;max-width:92vw;
    overflow:hidden;text-overflow:ellipsis;}
  #achToast.show{opacity:1;transform:translate(-50%,0);}

  @media (prefers-reduced-motion:reduce){
    .hudbtn:active,.btn:active{transform:none;}
    #talk{transition:none;}
    #confetti i{animation:none;display:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">

    <!-- 顶部 HUD：左品牌 / 中距离·番茄·最佳 / 右静音·低功耗·暂停 -->
    <header id="topbar">
      <b class="brand"><i class="bpre">RUN·</i>月巴快跑</b>
      <div class="stats">
        <div class="stat"><span>DIST</span><b id="stDist">0<em>m</em></b></div>
        <div class="stat"><span>TOMATO</span><b id="stTomato">0</b></div>
        <div class="stat" id="stComboWrap" style="display:none"><span>COMBO</span><b id="stCombo">×0</b></div>
        <div class="stat" id="stTimeWrap" style="display:none"><span>TIME</span><b id="stTime">60s</b></div>
        <div class="stat" id="stBestWrap"><span>BEST</span><b id="stBest">--</b></div>
      </div>
      <div id="hudBtns">
        <button class="hudbtn" id="btnMute" type="button" aria-label="静音">🔊</button>
        <button class="hudbtn" id="btnLow" type="button" aria-label="低功耗">🌙</button>
        <button class="hudbtn" id="btnPause" type="button" aria-label="暂停">❚❚</button>
      </div>
    </header>

    <!-- 冲刺倒计时：金番茄触发冲刺时排空，平时为空 -->
    <div id="sprintRow"><span>SPRINT</span><div id="sprintBar"><i id="sprintFill"></i></div></div>

    <!-- 跑道（伪 3D 透视）：三车道 + 障碍（木箱 / 长条栅栏 / 南瓜）+ 两层番茄 + 金番茄道具 + 台词气泡 -->
    <main id="trackPanel" class="panel">
      <div class="pin">
        <canvas id="cv"></canvas>
        <div id="talk" aria-live="polite">
          <div id="talkAvatar"><img id="talkImg" alt="吃茄月巴"><div id="talkFb">茄</div></div>
          <div id="talkBubble"><span id="talkText"></span></div>
        </div>
      </div>
    </main>

    <!-- 触屏方向键：左滑右滑上滑之外的实体按键兜底（粗指针设备显示） -->
    <footer id="dpad" aria-label="方向键">
      <button class="btn" type="button" data-act="left">◀</button>
      <button class="btn" type="button" data-act="jump">▲</button>
      <button class="btn" type="button" data-act="slide">▼</button>
      <button class="btn" type="button" data-act="right">▶</button>
    </footer>

  </div>
</div>

<!-- 暂停遮罩（暂停即冻结游戏时钟，障碍番茄与冲刺计时一并停住） -->
<div class="ov" id="pauseOv">
  <div class="ovcard panel"><div class="pin">
    <h3>暂停中</h3>
    <p>月巴在田垄上喘口气……</p>
    <button class="btn on" id="btnResume" type="button">▶ 继续冲刺</button>
    <button class="btn" id="btnRestart" type="button">↻ 重新开始</button>
    <button class="btn" id="btnFinish" type="button">■ 结束本局</button>
    <button class="btn" id="btnMode" type="button">⇄ 换模式</button>
    <div style="display:flex;gap:8px;width:100%">
      <button class="btn" id="btnAch" type="button" style="flex:1">🏅 成就</button>
      <button class="btn" id="btnSkin" type="button" style="flex:1">🎨 皮肤</button>
    </div>
  </div></div>
</div>

<!-- 成就墙 -->
<div class="ov" id="achOv">
  <div class="ovcard panel"><div class="pin">
    <h3>成就</h3>
    <div id="achList" style="width:100%;max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:4px"></div>
    <button class="btn on" id="btnAchClose" type="button">关闭</button>
  </div></div>
</div>

<!-- 皮肤 -->
<div class="ov" id="skinOv">
  <div class="ovcard panel"><div class="pin">
    <h3>皮肤</h3>
    <p>解锁后切换外观，赛道内即时生效</p>
    <div id="skinList" style="width:100%;display:flex;flex-direction:column;gap:6px"></div>
    <button class="btn" id="btnSkinClose" type="button">关闭</button>
  </div></div>
</div>

<!-- 成就解锁提示条 -->
<div id="achToast" aria-live="polite"></div>

<!-- 模式选择（首次进入显示；暂停菜单可随时换） -->
<div class="ov" id="modeOv">
  <div class="ovcard panel"><div class="pin">
    <h3>选择模式</h3>
    <p id="modeNote">今天 · 每日修正</p>
    <button class="btn" type="button" data-mode="endless">🏃 无尽冲刺</button>
    <button class="btn" type="button" data-mode="timed">⏱ 限时 60s</button>
    <button class="btn" type="button" data-mode="purist">🎯 无道具竞速</button>
    <button class="btn" type="button" data-mode="daily">📅 每日挑战</button>
  </div></div>
</div>

<!-- 结算层：撞障碍 / 结束本局进入；破纪录有彩纸演出 -->
<div class="ov" id="resultOv">
  <div class="ovcard panel"><div class="pin">
    <h3>结算</h3>
    <p id="resTag">全力冲刺，下次更快！</p>
    <div class="rows">
      <div class="row"><em>距离</em><b id="resDist">0 m</b></div>
      <div class="row"><em>番茄</em><b id="resTomato">0</b></div>
      <div class="row"><em>最高连击</em><b id="resCombo">0</b></div>
      <div class="row"><em>历史排名</em><b id="resRank">--</b></div>
      <div class="row"><em>总分</em><b id="resScore">0</b></div>
      <div class="row"><em>最高分</em><b id="resBest">0</b></div>
    </div>
    <button class="btn on" id="btnAgain" type="button">↻ 再冲一局</button>
  </div></div>
</div>

/* mulberry32：每日种子随机源 */
function mulberry32(a){
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=(t+Math.imul(t^t>>>7,61|t))^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function hexLerp(a,b,t){
  const A=parseInt(a.slice(1),16), B=parseInt(b.slice(1),16);
  const ch=function(sh){ return Math.round(((A>>sh)&255)+(((B>>sh)&255)-((A>>sh)&255))*t); };
  return 'rgb('+ch(16)+','+ch(8)+','+ch(0)+')';
}
function themeNow(){
  const d=distPx/PX_PER_M;

  const prev=THEMES[(idx+THEMES.length-1)%THEMES.length], cur=THEMES[idx];
  const t=into/THEME_TRANS;
  return { sky0:hexLerp(prev.sky0,cur.sky0,t), sky1:hexLerp(prev.sky1,cur.sky1,t),
    field0:hexLerp(prev.field0,cur.field0,t), field1:hexLerp(prev.field1,cur.field1,t),
    road0:hexLerp(prev.road0,cur.road0,t), road1:hexLerp(prev.road1,cur.road1,t),

}

/* ---------- 伪 3D 投影 ---------- */
function horizonY(){ return H*HORIZON_PCT; }
function roadBottom(){ return H*ROAD_BOTTOM_PCT; }
function projP(z){ return 1/(1+Math.max(-Z0*0.55,z)/Z0); }   /* 近处 1，远处 → 0 */
function projY(z){ return horizonY()+(roadBottom()-horizonY())*projP(z); }
function laneXAt(u,p){ return W/2+(u-1)*W*LANE_W_PCT*p; }    /* 车道单位(0..2)+深度 → 屏幕 x */
function laneX(u){ return laneXAt(u,1); }
function laneW(){ return W/3; }                              /* 近处基准车道宽（绘制用） */
function playerR(){ return Math.min(W*0.099,34); }

/* ---------- 速度与难度 ---------- */
function speedMult(){ return Math.min(SPEED_CAP,1+TIER_STEP*Math.floor(distPx/PX_PER_M/TIER_DIST)); }
function curSpeed(){
  let m=speedMult()*boostMul;
  if(gNow<sprintUntil) m*=SPRINT_MULT;
  if(gNow<chiliUntil) m*=CHILI_MULT;      /* 辣椒短时提速 */
  if(gNow<slowUntil) m*=SLOW_MULT;        /* 秒表全场减速 */
  m*=dailySpeedMul;                        /* 每日修正：速度 +10% */
  return BASE_SPEED*m;
}
function diffLevel(){ return Math.min(1,distPx/(1200*PX_PER_M)); }  /* 0..1，1200m 拉满 */
function sprinting(){ return gNow<sprintUntil; }

/* ---------- 输入：切道（速度连续的二阶弹簧，近似临界阻尼） ---------- */
function steer(d){
  if(state!=='running') return;
  const to=Math.max(0,Math.min(LANES-1,lane+d));
  if(to===lane) return;
  lane=to;                       /* 只改目标车道，弹簧带着当前惯性平滑过去 */
}
function stepPx(dt){
  const target=lane;
  if(px===target&&vx===0) return;
  const dtS=Math.min(dt,50)/1000;
  const c=2*Math.sqrt(LANE_K)*LANE_ZETA;     /* 阻尼系数 */
  vx+=((target-px)*LANE_K-vx*c)*dtS;         /* 半隐式欧拉 */
  px+=vx*dtS;
  if(Math.abs(target-px)<0.004&&Math.abs(vx)<0.02){ px=target; vx=0; }   /* 收敛收尾 */
}

/* ---------- 输入：跳跃（固定抛物线 + 缓冲 + 预输入） ---------- */
function tryJump(fromBuffer){
  if(state!=='running') return;
  if(air){ jumpBufT0=gNow; return; }                       /* 空中预输入：落地即跳 */
  if(!fromBuffer&&gNow-landCoolT0<LAND_COOL_MS) return;    /* 落地缓冲（预输入豁免） */
  if(slide){ slide=false; slideCoolT0=gNow; }              /* 滑铲中起跳：立即取消滑铲 */
  air=true; airT0=gNow;
  SFX.jump();
}
function trySlide(){
  if(state!=='running') return;
  if(air||slide) return;                                   /* 空中/已滑铲时无效 */
  if(gNow-slideCoolT0<SLIDE_COOL_MS) return;               /* 冷却 */
  slide=true; slideT0=gNow;
  SFX.slide();
}
function airHeight(){
  if(!air) return 0;
  const f=(gNow-airT0)/JUMP_MS;
  return 4*JUMP_H*f*(1-f);
}

/* ---------- 障碍生成（硬规则：单行 ≤2 道，三道永不全封死） ---------- */
function planRow(diff){
  const p2=0.25+0.30*diff;                 /* 双障碍行概率随难度上调 */
  if(rng()<p2){
    const ls=[0,1,2];
    ls.splice((rng()*3)|0,1);              /* 随机空出一道 */
    return ls;
  }
  return [(rng()*3)|0];
}
function pickObType(){
  const r=rng();
  if(distPx<150*PX_PER_M) return r<0.4?'fence':'box';   /* 前 150m 渐进引入 */
  return r<0.42?'box':(r<0.72?'fence':'pumpkin');       /* 横杆由 maybeSpawn 整行决定 */
}
function spawnGap(){
  const v=curSpeed();
  let g=v*(1.0-0.35*diffLevel());          /* 行距 = 反应时间 × 速度 */
  if(lastRowFence) g*=(1.3-0.3*diffLevel()); /* 低速期栅栏行后加长，防连续双跳 */
  if(dailyMod&&dailyMod.gapMul) g*=dailyMod.gapMul;   /* 每日：密集障碍 */
  return g;
}
function maybeSpawn(){
  while(distPx>=nextSpawnAt){
    const ls=planRow(diffLevel());
    lastRowFence=false;
    /* 横杆行（300m 后解锁，整行只用横杆）：同行不混「必须跳」与「必须滑」 */
    const rowBar=(distPx>=300*PX_PER_M)&&(rng()<0.12+0.10*diffLevel());
    for(let i=0;i<ls.length;i++){
      const type=rowBar?'bar':pickObType();
      if(type==='fence') lastRowFence=true;
      obstacles.push({lane:ls[i],type:type,z:Z_SPAWN});
    }
    const gap=spawnGap();
    spawnTomatoString(ls,gap);
    spawnItem(ls);
    nextSpawnAt+=gap;
  }
}
/* 番茄串：填进本行安全车道——直线顺路 / 折线引导变道；28% 整串悬空（第二层） */
function spawnTomatoString(obLanes,gap){
  if(rng()>0.75) return;                               /* 留 1/4 呼吸行 */
  const free=[0,1,2].filter(function(l){ return obLanes.indexOf(l)<0; });
  if(!free.length) return;
  let n=3+(rng()<0.5?1:0)+(rng()<0.25?1:0);           /* 3~5 颗 */
  n=Math.min(n,Math.floor((gap-170)/TOMO_STEP));
  if(n<2) return;
  const z0=Z_SPAWN-90;
  const air=rng()<TOMO_AIR_CHANCE;                     /* 第二层：整串悬空，要跳起来吃 */
  const sid=sidSeq++;                                  /* 串编号：连击按同一串统计 */
  if(free.length>=2&&rng()<0.4){                       /* 折线串：两条安全道来回 */
    const a=free[(rng()*free.length)|0];
    const b=free.filter(function(l){ return l!==a; })[(rng()*(free.length-1))|0];
    for(let i=0;i<n;i++) tomos.push({lane:(i%4<2)?a:b,u:(i%4<2)?a:b,z:z0-i*TOMO_STEP,air:air,sid:sid,idx:i});
  }else{
    const a=free[(rng()*free.length)|0];
    for(let i=0;i<n;i++) tomos.push({lane:a,u:a,z:z0-i*TOMO_STEP,air:air,sid:sid,idx:i});
  }
}
function tickObstacles(ds){
  for(let i=obstacles.length-1;i>=0;i--){
    const ob=obstacles[i];
    const pz=ob.z;
    ob.z-=ds;
    if(!ob.nm&&pz>0&&ob.z<=0) nearMissCheck(ob);   /* 越过玩家平面瞬间判定擦边 */
    if(ob.z<Z_DESPAWN) obstacles.splice(i,1);
  }
}
/* 擦边闪避：判定窗外 0.16 车道内掠过（未跳、未滑）→ 惊险分 */
function nearMissCheck(ob){
  ob.nm=true;
  if(state!=='running'||crashed||air||slide) return;
  const d=Math.abs(px-ob.lane), tol=obLaneTol(ob);
  if(d>tol&&d<tol+NEAR_MARGIN){
    nearMissScore+=NEAR_SCORE;
    nearRun++;
    if(nearRun>=5) unlock('near5');
    burst(laneX(px),roadBottom()-airHeight(),['#ffffff','#ffd27d'],6);
    SFX.near();
    talk('near');
  }
}
function obLaneTol(ob){
  if(ob.type==='bar') return 0.5;
  return ob.type==='fence'?0.52:(ob.type==='box'?0.38:0.42);
}

/* ---------- 番茄：拾取 → 只加分与计数（不加速） ---------- */
function tickTomos(ds,dt){
  const h=airHeight();
  for(let i=tomos.length-1;i>=0;i--){
    const t=tomos[i];
    t.z-=ds;
    /* 漏吃：番茄越过玩家判定区（z<-40）后视为断了当前串的连击 */
    if(t.z<-40&&!t.missed){
      t.missed=true;
      if(t.sid!=null&&t.sid===comboSid){ comboSid=null; comboCnt=0; comboFlag=false; }
    }
    if(t.z<Z_DESPAWN){ tomos.splice(i,1); continue; }
    /* 磁铁：前方相邻车道内的番茄向玩家吸附 */
    if(gNow<magnetUntil&&t.z>-40&&t.z<MAGNET_Z&&Math.abs(t.u-px)<MAGNET_R){
      t.u+=(px-t.u)*Math.min(1,MAGNET_PULL*dt/1000);
    }
    const near=Math.abs(t.z)<Z_TOMO;
    const laneOk=Math.abs(px-t.u)<0.42;
    const heightOk=t.air?(Math.abs(h-TOMO_AIR_H)<24):(h<36);   /* 二层需跳到半空以上 */
    if(near&&laneOk&&heightOk){
      tomos.splice(i,1);
      tomato++;                                  /* 普通番茄：+50 分（结算时计），无加速/充能 */
      /* 串内连击：同一串连续吃；吃满 5 颗进入连击（前 5 颗各 +10，之后每颗 +10） */
      if(t.sid!=null){
        if(t.sid===comboSid){ comboCnt++; }
        else { comboSid=t.sid; comboCnt=1; comboFlag=false; }
        if(comboCnt===COMBO_MIN&&!comboFlag){
          comboFlag=true; comboScore+=COMBO_MIN*COMBO_BONUS;
          SFX.combo(); talk('combo5');
        }else if(comboFlag&&comboCnt>COMBO_MIN){ comboScore+=COMBO_BONUS; }
        if(comboCnt>comboMax) comboMax=comboCnt;
        if(comboCnt>=10) unlock('combo10');
      }
      const p=projP(t.z);
      burst(laneXAt(t.u,p),projY(t.z)-(t.air?TOMO_AIR_H*p:0),[C.tomato,C.glow,'#ffffff'],currentSkin().key==='juicy'?8:6);
      SFX.tomato();
      $('#stTomato').textContent=tomato+'';
      if(tomato===1) talk('first');
      if(tomato===10&&!mile.m10){ mile.m10=1; talk('m10'); }
      if(tomato===20&&!mile.m20){ mile.m20=1; talk('m20'); }
      if(tomato===30&&!mile.m30){ mile.m30=1; talk('m30'); }
    }
  }
}
/* 全力冲刺：由道具触发（金番茄） */
function startSprint(){
  sprintUntil=gNow+SPRINT_MS;
  graceUntil=sprintUntil+SPRINT_GRACE_MS;
  sprintsRun++;
  sprintSmash=0;
  burst(laneX(px),roadBottom()-airHeight(),[C.sprint,C.glow,'#ffd27d'],14);  /* 起爆星 */
  SFX.sprint();
  if(sprintsRun===3&&!mile.s3){ mile.s3=1; talk('s3'); }
}
function sprintMeter(){            /* 冲刺倒计时（平时为空） */
  return sprinting()?(sprintUntil-gNow)/SPRINT_MS:0;
}

/* ---------- 道具系统（5 种；新道具加一行表项 + 池子权重 + 绘制函数即可） ---------- */
const ITEM_TIPS={
  gold:'金番茄：立即全力冲刺 5 秒！',
  chili:'辣椒：2 秒内提速 35%！',
  magnet:'磁铁：8 秒内把附近番茄吸过来！',
  shield:'护盾：抵挡一次撞击！',
  watch:'秒表：3 秒内全场变慢，好躲！'
};
const ITEMS={
  gold:{name:'金番茄',score:200,burst:['#ffd75e','#ffb020','#ffffff'],
    draw:function(x,y,s){ drawGolden(x,y,s); },
    onEat:function(){ startSprint(); }},            /* 立即全力冲刺 */
  chili:{name:'辣椒',score:120,burst:['#ff4d2e','#ff9d6e','#ffffff'],
    draw:function(x,y,s){ drawChili(x,y,s); },
    onEat:function(){ chiliUntil=gNow+CHILI_MS; }}, /* 短时提速 ×1.35 */
  magnet:{name:'磁铁',score:100,burst:['#e25050','#9fb8d8','#ffffff'],
    draw:function(x,y,s){ drawMagnet(x,y,s); },
    onEat:function(){ magnetUntil=gNow+MAGNET_MS; }},/* 8s 吸附番茄/道具 */
  shield:{name:'护盾',score:80,burst:['#bfe0f2','#7fb8d8','#ffffff'],
    draw:function(x,y,s){ drawShield(x,y,s); },

    draw:function(x,y,s){ drawWatch(x,y,s); },
    onEat:function(){ slowUntil=gNow+SLOW_MS; }}    /* 3s 全场减速 */
};
const ITEM_POOL=[{kind:'gold',w:1.0},{kind:'chili',w:2.0},{kind:'magnet',w:1.5},{kind:'shield',w:1.0},{kind:'watch',w:0.8}];
function pickItemKind(){                    /* 权重池；金茄权重可被每日修正放大 */
  const wOf=function(e){ return e.w*(e.kind==='gold'?goldWeightMul:1); };
  let total=0;
  for(let i=0;i<ITEM_POOL.length;i++) total+=wOf(ITEM_POOL[i]);
  let r=rng()*total;
  for(let i=0;i<ITEM_POOL.length;i++){ r-=wOf(ITEM_POOL[i]); if(r<=0) return ITEM_POOL[i].kind; }
  return ITEM_POOL[0].kind;
}
/* 瞬时提速接口：留给未来道具调用（普通番茄不调用） */
function addBoost(d){ boostMul=Math.min(BOOST_CAP,boostMul+d); }
/* 道具生成：必落在本行安全车道；间隔 140~220m（种类多、数量不多） */
function spawnItem(obLanes){
  if(MODES[MODE].noItems||(dailyMod&&dailyMod.noItems)) return;   /* 无道具模式 / 每日修正 */
  if(distPx<nextItemAt) return;
  const free=[0,1,2].filter(function(l){ return obLanes.indexOf(l)<0; });
  if(!free.length) return;
  const lane2=free[(rng()*free.length)|0];
  items.push({kind:pickItemKind(),lane:lane2,u:lane2,z:Z_SPAWN-150});
  const gapMul=(dailyMod&&dailyMod.itemGapMul)?dailyMod.itemGapMul:1;   /* 每日：全道具 */
  nextItemAt=distPx+(ITEM_GAP_MIN+rng()*(ITEM_GAP_MAX-ITEM_GAP_MIN))*gapMul;
}
function tickItems(ds,dt){
  const h=airHeight();
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.z-=ds;
    if(it.z<Z_DESPAWN){ items.splice(i,1); continue; }
    /* 磁铁：前方相邻车道内的道具向玩家吸附 */
    if(gNow<magnetUntil&&it.z>-40&&it.z<MAGNET_Z&&Math.abs(it.u-px)<MAGNET_R){
      it.u+=(px-it.u)*Math.min(1,MAGNET_PULL*dt/1000);
    }
    if(Math.abs(it.z)<Z_ITEM&&Math.abs(px-it.u)<0.42&&h<36){
      items.splice(i,1);
      const def=ITEMS[it.kind];
      if(!def) continue;                        /* 表里没有的 kind 静默跳过（前向兼容） */
      itemScore+=def.score||0;
      const p=projP(it.z);
      burst(laneXAt(it.u,p),projY(it.z),def.burst||['#ffd75e','#ffb020','#ffffff'],12);
      const sfxFn=SFX[it.kind]; if(sfxFn) sfxFn(); else SFX.gold();
      if(!SAVE.settings.seenItems[it.kind]){          /* 首次拾取：说明一次 */
        SAVE.settings.seenItems[it.kind]=1; persist();
        talkSay('🍅 '+ITEM_TIPS[it.kind]);
      }else talk(it.kind);
      def.onEat();
    }
  }
}

/* ---------- 粒子（池上限；低功耗 / reduced-motion 关闭） ---------- */
function burst(x,y,colors,n){
  if(SAVE.settings.lowPower||REDUCED||parts.length>PART_MAX-1) return;
  for(let i=0;i<n&&parts.length<PART_MAX;i++){
    const a=Math.random()*Math.PI*2, v=60+Math.random()*140;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,t0:gNow,
      life:380+Math.random()*220,color:colors[(Math.random()*colors.length)|0],r:2+Math.random()*2.5});
  }
}
function tickParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    if(gNow-p.t0>p.life){ parts.splice(i,1); continue; }
    p.x+=p.vx*dt/1000; p.y+=p.vy*dt/1000; p.vy+=260*dt/1000;   /* 轻重力 */
  }
}

/* ---------- 碰撞（腾空免碰撞；冲刺/宽限期撞箱即碎） ---------- */
function checkHit(){
  const smashing=sprinting()||gNow<graceUntil;
  for(let i=obstacles.length-1;i>=0;i--){
    const ob=obstacles[i];
    if(Math.abs(ob.z)>=Z_HIT) continue;
    if(Math.abs(px-ob.lane)>=obLaneTol(ob)) continue;
    /* 横杆只能滑过（跳起来反而撞上）；其余障碍跳过即可 */
    const pass=(ob.type==='bar')?slide:air;
    if(pass&&ob.type==='bar'&&slide) unlock('barSlide');   /* 首次滑铲穿过横杆 */
    if(smashing){
      obstacles.splice(i,1);
      const p=projP(0);
      if(sprinting()){
        smashes++; sprintSmash++;
        if(sprintSmash>=5) unlock('smash5');
        burst(laneXAt(ob.lane,p),projY(0),
          ob.type==='box'?[C.crate,C.crateIn,C.sprint]:
          ob.type==='fence'?[C.fence,C.fenceIn,C.sprint]:
          ob.type==='bar'?[C.crate,C.crateIn,C.sprint]:[C.pump,C.pumpIn,C.leaf],10);
        SFX.smash();
      }else burst(laneXAt(ob.lane,p),projY(0),[C.crateIn,C.fenceIn,C.pumpIn],6);  /* 宽限期碎箱不计分 */
    }else if(!pass){
      if(shieldOn){                              /* 护盾：抵挡一次碰撞 */
        shieldOn=false; invulnUntil=gNow+SHIELD_INVULN_MS;
        burst(laneXAt(ob.lane,projP(0)),projY(0),['#bfe0f2','#7fb8d8','#ffffff'],14);
        SFX.shield();
        talk('shieldBreak');
      }else if(gNow<invulnUntil){
        /* 无敌窗内直接穿过 */
      }else if(MODES[MODE].timed){               /* 限时模式：撞到扣 5 秒，不结束 */
        timeLeft-=5000; invulnUntil=gNow+800;
        burst(laneX(px),roadBottom()-airHeight(),['#ff6b5e','#ffd27d'],8);
        SFX.crash(); talk('timedHit');
        if(timeLeft<=0){ timeLeft=0; $('#stTime').textContent='0s'; finishRun('timeup'); return; }
      }else{
        crash(); return;
      }
    }
  }
}
function crash(){
  crashed=true;
  lastReason='crash';
  SFX.crash();
  talk('crash');
  finishRun('crash');
}

/* ---------- 场景绘制（伪 3D · 田园跑道） ---------- */
function drawScene(){
  const hy=horizonY(), rb=roadBottom();
  ctx.clearRect(0,0,W,H);
  const TH=themeNow();
  drawSky(hy,TH);
  drawRoad(hy,rb,TH);       /* 田野底色、路面、田垄带、路缘双杆、篱笆桩、车道虚线 */
  drawFieldProps(hy);
  drawFlags(hy);            /* 里程小旗 */
  /* 物体：按 z 从远到近绘制（画家算法） */
  const vis=[];
  for(let i=0;i<obstacles.length;i++) vis.push({z:obstacles[i].z,kind:'ob',o:obstacles[i]});
  for(let i=0;i<tomos.length;i++) vis.push({z:tomos[i].z,kind:'tm',o:tomos[i]});
  for(let i=0;i<items.length;i++) vis.push({z:items[i].z,kind:'it',o:items[i]});
  vis.sort(function(a,b){ return b.z-a.z; });
  for(let i=0;i<vis.length;i++){
    const v=vis[i], p=projP(v.z);
    if(p<0.02) continue;
    const u=(v.o.u!=null)?v.o.u:v.o.lane;      /* 番茄/道具可被磁铁拉离原车道 */
    const x=laneXAt(u,p), y=projY(v.z);
    if(v.kind==='ob') drawObstacleAt(v.o,x,y,p);
    else if(v.kind==='tm') drawTomatoAt(v.o,x,y,p);
    else{ const def=ITEMS[v.o.kind]; if(def&&def.draw) def.draw(x,y,p); }   /* 道具绘制走表 */
  }
  drawTrail();
  drawYueba();
  drawParts();
  /* 轻暗角：聚焦中心 */
  const vg=ctx.createRadialGradient(W/2,H*0.62,W*0.25,W/2,H*0.62,W*0.85);
  vg.addColorStop(0,'rgba(90,75,55,0)');
  vg.addColorStop(1,'rgba(90,75,55,.07)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(dusk){                                    /* 每日修正：黄昏版 */
    ctx.fillStyle='rgba(92,74,110,.10)';
    ctx.fillRect(0,0,W,H);
  }
  drawSprintTint();
}
/* 天空：渐变 + 淡日 + 纸云 + 远山两层 */
function drawSky(hy,TH){
  const g=ctx.createLinearGradient(0,0,0,hy);
  g.addColorStop(0,TH.sky0); g.addColorStop(1,TH.sky1);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,hy+1);
  const sx=W*0.74, sy=hy*0.40, sr=Math.max(26,hy*0.75);
  const sun=ctx.createRadialGradient(sx,sy,2,sx,sy,sr);
  sun.addColorStop(0,'rgba(255,212,138,.50)');
  sun.addColorStop(.38,'rgba(255,212,138,.16)');
  sun.addColorStop(1,'rgba(255,212,138,0)');
  ctx.fillStyle=sun; ctx.fillRect(sx-sr,sy-sr,sr*2,sr*2);
  ctx.fillStyle='rgba(255,255,255,.55)';
  cloudBlob(W*0.20,hy*0.36,Math.max(14,W*0.034));
  cloudBlob(W*0.46,hy*0.58,Math.max(9,W*0.022));
  drawHills(hy,1.0,'rgba(214,224,203,.95)');
  drawHills(hy,0.6,'rgba(228,235,220,.95)');
  /* 地平线薄雾：让远山与路面自然过渡 */
  const haze=ctx.createLinearGradient(0,hy-16,0,hy+26);
  haze.addColorStop(0,'rgba(255,255,255,0)');
  haze.addColorStop(.55,'rgba(255,255,255,.38)');
  haze.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=haze; ctx.fillRect(0,hy-16,W,42);
}
function cloudBlob(x,y,r){
  ctx.beginPath();
  ctx.ellipse(x,y,r,r*0.55,0,0,Math.PI*2);
  ctx.ellipse(x+r*0.85,y+r*0.06,r*0.68,r*0.4,0,0,Math.PI*2);
  ctx.ellipse(x-r*0.8,y+r*0.1,r*0.58,r*0.36,0,0,Math.PI*2);
  ctx.fill();
}
function drawHills(hy,scale,color){
  const amp=6*scale;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(0,hy+2);
  for(let x=0;x<=W;x+=14){
    const k=x/W;
    const y=hy-4-Math.sin(k*Math.PI*2.1+1.7)*amp-Math.sin(k*Math.PI*0.8)*amp*1.5;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,hy+2); ctx.closePath(); ctx.fill();
}
/* 路面：田野渐变 + 梯形路面（透视延长到屏幕底）+ 田垄带 + 路缘双杆 + 篱笆桩 + 车道虚线 */
function drawRoad(hy,rb,TH){
  const halfW=W*ROAD_HALF_PCT;
  const halfAtH=halfW*(H-hy)/(rb-hy);
  /* 田野底色（比路面深一档，拉开层次） */
  const fg=ctx.createLinearGradient(0,hy,0,H);
  fg.addColorStop(0,TH.field0); fg.addColorStop(1,TH.field1);
  ctx.fillStyle=fg; ctx.fillRect(0,hy,W,H-hy);
  /* 田野横垄：与路面田垄同节奏的浅带（先画，路面会盖住中间） */
  const offF=distPx%RUNG_SPACING;
  ctx.fillStyle=TH.band;
  for(let k=0;k<60;k++){
    if(k%2===0) continue;
    const z1=k*RUNG_SPACING-offF, z2=z1+RUNG_SPACING;
    const y1=Math.min(projY(z1),H+4), y2=Math.min(projY(z2),H+4);
    if(y2>=y1||y1<hy+1) continue;              /* 远处 y 更小：y2 是上沿 */
    ctx.globalAlpha=0.12*Math.min(1,(y1-hy)/(H*0.16));
    ctx.fillRect(0,y2,W,y1-y2);
  }
  ctx.globalAlpha=1;
  /* 路面（暖土色 → 近处提亮） */
  const rg=ctx.createLinearGradient(0,hy,0,H);
  rg.addColorStop(0,TH.road0); rg.addColorStop(1,TH.road1);
  ctx.beginPath();
  ctx.moveTo(W/2-halfAtH,H); ctx.lineTo(W/2,hy); ctx.lineTo(W/2+halfAtH,H); ctx.closePath();
  ctx.fillStyle=rg; ctx.fill();
      /* 田垄色带：交替色阶 + 垄沟边线，透视间距，随速度下滚 */
  const off=distPx%RUNG_SPACING;
  for(let k=0;k<60;k++){
    if(k%2===0) continue;                     /* 交替带 */
    const z1=k*RUNG_SPACING-off, z2=z1+RUNG_SPACING;
    const y1=Math.min(projY(z1),H+4), y2=Math.min(projY(z2),H+4);
    if(y2>=y1||y1<hy+1) continue;              /* 远处 y 更小：y2 是上沿 */
    const hw1=halfW*projP(z1), hw2=halfW*projP(z2);
    const a=0.35*Math.min(1,(y1-hy)/(H*0.16));
    ctx.globalAlpha=a;
    ctx.fillStyle=TH.rung;
    ctx.beginPath();
    ctx.moveTo(W/2-hw1,y1); ctx.lineTo(W/2+hw1,y1);
    ctx.lineTo(W/2+hw2,y2); ctx.lineTo(W/2-hw2,y2);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha=Math.min(1,a*0.5);
    ctx.strokeStyle='#cbb68e'; ctx.lineWidth=1.2;     /* 垄沟边线 */
    ctx.beginPath(); ctx.moveTo(W/2-hw1,y1); ctx.lineTo(W/2+hw1,y1); ctx.stroke();
  }
  ctx.globalAlpha=1;
  /* 路缘草带：路两侧的绿边（近宽远窄的楔形） */
  for(let s=-1;s<=1;s+=2){
    ctx.fillStyle='rgba(158,182,138,.40)';
    ctx.beginPath();
    ctx.moveTo(W/2,hy);
    ctx.lineTo(W/2+s*halfAtH,H);
    ctx.lineTo(W/2+s*(halfAtH+14),H);
    ctx.closePath(); ctx.fill();
  }
  /* 路缘双杆（篱笆横杆） */
  ctx.strokeStyle='rgba(96,78,56,.45)'; ctx.lineWidth=4;
  for(let s=-1;s<=1;s+=2){
    ctx.beginPath(); ctx.moveTo(W/2,hy); ctx.lineTo(W/2+s*halfAtH,H); ctx.stroke();
  }
  ctx.strokeStyle='rgba(96,78,56,.20)'; ctx.lineWidth=2;
  for(let s=-1;s<=1;s+=2){
    ctx.beginPath(); ctx.moveTo(W/2,hy); ctx.lineTo(W/2+s*halfAtH*0.985,H); ctx.stroke();
  }
  /* 篱笆桩：等距世界位置，近大远小（颜色不带 alpha，只靠 globalAlpha） */
  const postGap=140, poff=distPx%postGap;
  ctx.fillStyle='#5f4e3a';
  for(let k=0;k<46;k++){
    const z=k*postGap-poff;
    if(z>Z_SPAWN) break;
    const y=projY(z);
    if(y<hy+3||y>H+6) continue;
    const p=projP(z);
    const hgt=18*p*p+2, wpx=Math.max(1,3.2*p);
    ctx.globalAlpha=Math.min(.62,.10+.52*p);
    for(let s=-1;s<=1;s+=2){
      const x=W/2+s*(halfW*p+wpx*2);
      ctx.fillRect(x-wpx/2,y-hgt,wpx,hgt);
    }
  }
  ctx.globalAlpha=1;
  /* 车道分隔虚线：画在车道分界（u=0.5/1.5）向消失点收束 */
  const kk=(H-hy)/(rb-hy);
  ctx.strokeStyle='rgba(150,138,118,.55)'; ctx.lineWidth=2;
  ctx.setLineDash([14,18]);
  ctx.lineDashOffset=-(distPx*0.6)%32;
  for(let i=1;i<LANES;i++){
    const xb=W/2+(i-1.5)*W*LANE_W_PCT*kk;
    ctx.beginPath(); ctx.moveTo(W/2,hy); ctx.lineTo(xb,H); ctx.stroke();
  }
  ctx.setLineDash([]);
}
/* 田边点缀：草簇 / 小番茄苗 / 野花（双排，等距世界位置，近大远小） */
function drawFieldProps(hy){
  const halfW=W*ROAD_HALF_PCT;
  const gap=190, off=distPx%gap;
  for(let k=0;k<40;k++){
    const z=k*gap-off;
    if(z>Z_SPAWN) break;
    const y=projY(z);
    if(y<hy+4||y>H-2) continue;
    const p=projP(z);
    if(p<0.04) continue;
    const side=(k%2)?1:-1;
    const inset=16+((k*37)%24);
    const x=W/2+side*(halfW*p+inset*p);
    ctx.globalAlpha=Math.min(.95,.15+.8*p);
    if(k%5===2) drawTomatoPlant(x,y,p);
    else if(k%6===3) drawFlowers(x,y,p,k);
    else drawGrass(x,y,p);
    /* 第二排：更靠外的浅色草，补田野纵深 */
    const inset2=64+((k*53)%46);
    const x2=W/2+side*(halfW*p+inset2*p);
    ctx.globalAlpha=Math.min(.55,.08+.45*p);
    drawGrass(x2,y,p*0.85);
  }
  ctx.globalAlpha=1;
}
function drawFlowers(x,y,p,k){
  const cols=['#f7d774','#f2a6b8','#fffaf0'];
  for(let i=0;i<3;i++){
    ctx.fillStyle=cols[(i+((k*13)|0))%3];
    ctx.beginPath();
    ctx.arc(x+(i-1)*5*p, y-(5+(i%2)*3)*p, Math.max(1,1.6*p), 0, Math.PI*2);
    ctx.fill();
  }
}
function drawGrass(x,y,p){
  ctx.strokeStyle='#b9c9a9'; ctx.lineWidth=Math.max(1,1.4*p);
  ctx.beginPath();
  for(let i=-1;i<=1;i++){
    ctx.moveTo(x,y); ctx.lineTo(x+i*4*p, y-(10+Math.abs(i)*-2+2)*p);
  }
  ctx.stroke();
}
/* 里程小旗：每 600 世界单位一面，交替左右——给路面节奏与配色落点 */
function drawFlags(hy){
  const gap=600, off=distPx%gap;
  const halfW=W*ROAD_HALF_PCT;
  for(let k=0;k<6;k++){
    const z=k*gap-off;
    if(z>Z_SPAWN) break;
    const y=projY(z);
    if(y<hy+6||y>H) continue;
    const p=projP(z);
    const side=(k%2)?1:-1;
    const x=W/2+side*(halfW*p+10*p);
    ctx.globalAlpha=Math.min(.95,.2+.75*p);
    ctx.strokeStyle='#7a6448'; ctx.lineWidth=Math.max(1,2*p);
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-22*p); ctx.stroke();
    ctx.fillStyle=C.tomato;
    ctx.beginPath();
    ctx.moveTo(x,y-22*p);
    ctx.lineTo(x+side*12*p,y-17*p);
    ctx.lineTo(x,y-12*p);
    ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawTomatoPlant(x,y,p){
  ctx.strokeStyle='#9fb98c'; ctx.lineWidth=Math.max(1,1.5*p);
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-13*p); ctx.stroke();
  ctx.fillStyle='#b9c9a9';
  ctx.beginPath(); ctx.ellipse(x-3*p,y-10*p,3.5*p,1.8*p,-0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+3*p,y-12*p,3.5*p,1.8*p,0.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=C.tomato;
  ctx.beginPath(); ctx.arc(x-1*p,y-6*p,1.8*p,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+2*p,y-9*p,1.6*p,0,Math.PI*2); ctx.fill();
}
/* 软阴影（径向渐变） */
function softShadow(x,y,rx,ry,alpha){
  const R=Math.max(6,rx);
  ctx.save(); ctx.translate(x,y); ctx.scale(1,Math.max(.15,ry/R));
  const g=ctx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0,'rgba(58,58,58,'+alpha+')');
  g.addColorStop(.65,'rgba(58,58,58,'+(alpha*.45)+')');
  g.addColorStop(1,'rgba(58,58,58,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
/* ---------- 物体绘制：统一 (x,y,scale) 画在原点 ---------- */
function drawObstacleAt(ob,x,y,s){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  /* 接地软阴影 */
  softShadow(0,22,26,8,0.22);
  ctx.strokeStyle=C.ink; ctx.lineWidth=2;
  if(ob.type==='box'){
    const h=OB_SIZE/2;
    ctx.fillStyle=C.crate;
    ctx.fillRect(-h,-h,OB_SIZE,OB_SIZE); ctx.strokeRect(-h,-h,OB_SIZE,OB_SIZE);
    ctx.strokeStyle=C.crateIn; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(-h+4,-h+4); ctx.lineTo(h-4,h-4);
    ctx.moveTo(h-4,-h+4); ctx.lineTo(-h+4,h-4);
    ctx.moveTo(-h+4,0); ctx.lineTo(h-4,0);
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2;   /* 顶棱高光 */
    ctx.beginPath(); ctx.moveTo(-h+2,-h+2); ctx.lineTo(h-2,-h+2); ctx.stroke();
  }else if(ob.type==='fence'){
    const w=laneW()*0.92, y0=-FENCE_H/2;
    ctx.fillStyle=C.fence;
    ctx.fillRect(-w/2,y0,w,FENCE_H); ctx.strokeRect(-w/2,y0,w,FENCE_H);
    ctx.strokeStyle=C.fenceIn; ctx.lineWidth=1.5;
    ctx.beginPath();
    for(let px2=-w/2+14;px2<w/2-6;px2+=14){ ctx.moveTo(px2,y0+2); ctx.lineTo(px2,y0+FENCE_H-2); }
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2;   /* 顶棱高光 */
    ctx.beginPath(); ctx.moveTo(-w/2+2,y0+2); ctx.lineTo(w/2-2,y0+2); ctx.stroke();
  }else if(ob.type==='bar'){
    /* 藤架横杆：横梁离地 34px（跳不过、只能滑），两侧立柱 */
    const w=laneW()*0.92, clear=34, beamH=10;
    ctx.fillStyle='#d8c7a6';                                 /* 立柱 */
    ctx.fillRect(-w/2,0,5,-clear-beamH); ctx.strokeRect(-w/2,0,5,-clear-beamH);
    ctx.fillRect(w/2-5,0,5,-clear-beamH); ctx.strokeRect(w/2-5,0,5,-clear-beamH);
    ctx.fillStyle='#e5d6b8';                                 /* 横梁 */
    ctx.fillRect(-w/2,-clear-beamH,w,beamH); ctx.strokeRect(-w/2,-clear-beamH,w,beamH);
    ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2; /* 顶棱高光 */
    ctx.beginPath(); ctx.moveTo(-w/2+2,-clear-beamH+2); ctx.lineTo(w/2-2,-clear-beamH+2); ctx.stroke();
    ctx.strokeStyle='rgba(96,78,56,.25)'; ctx.lineWidth=1.5;  /* 藤蔓点饰 */
    ctx.beginPath();
    for(let px2=-w/2+12;px2<w/2-8;px2+=22){ ctx.moveTo(px2,-clear-beamH+1); ctx.lineTo(px2+5,-clear-beamH+beamH-1); }
    ctx.stroke();
  }else{
    const r=PUMPKIN_W/2;
    ctx.fillStyle=C.stem;                                   /* 瓜蒂 */
    ctx.fillRect(-3,-r-6,6,9); ctx.strokeRect(-3,-r-6,6,9);
    ctx.fillStyle=C.leaf;
    ctx.beginPath(); ctx.ellipse(7,-r-3,6,3,0.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=C.pump;                                   /* 瓜体 */
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle=C.pumpIn; ctx.lineWidth=1.5;            /* 瓜棱 */
    ctx.beginPath(); ctx.ellipse(-9,0,r*0.45,r*0.85,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(9,0,r*0.45,r*0.85,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.45)'; ctx.lineWidth=2; /* 左上高光 */
    ctx.beginPath(); ctx.arc(0,0,r*0.82,Math.PI*1.05,Math.PI*1.45); ctx.stroke();
  }
  ctx.restore();
}
function drawTomatoAt(t,x,gy,s){
  ctx.save(); ctx.translate(x,gy); ctx.scale(s,s);
  const r=TOMO_R;
  if(t.air){                                             /* 地面软阴影：提示悬空高度 */
    softShadow(0,2,r*0.85,r*0.30,0.24);
    ctx.translate(0,-TOMO_AIR_H);                        /* 第二层：抬高悬空 */
  }
  ctx.strokeStyle='rgba(255,107,94,.35)'; ctx.lineWidth=2;   /* 微光圈 */
  ctx.beginPath(); ctx.arc(0,0,r+3,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle=C.tomato; ctx.strokeStyle=C.ink; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(0,1,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle=C.leaf;                                   /* 叶 */
  ctx.beginPath(); ctx.ellipse(-3,-r+2,4,2.2,-0.6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3,-r+2,4,2.2,0.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';                  /* 高光 */
  ctx.beginPath(); ctx.arc(-r*0.35,-r*0.3,r*0.22,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
/* 金番茄（脉冲光晕，吸引注意） */

/* 辣椒（短时提速道具） */

function drawParts(){

function drawTrail(){

/* 月巴：伪 3D 下按车道位置摆放，跳跃抬升 + 影子缩小分离 */
function drawYueba(){
  const cx=laneX(px), r=playerR();
  const h=airHeight();
  const bob=(air||REDUCED||SAVE.settings.lowPower)?0:Math.sin(gNow/180)*3;
  const ground=roadBottom();
  const cy=ground-h+bob;
  const lean=Math.max(-0.2,Math.min(0.2,vx*0.03));      /* 侧倾跟随横向速度：起步/收尾自然归零 */
  /* 影子：随跳跃高度缩小（透视分离感）；滑铲时拉宽贴地 */
  softShadow(cx,ground+r*0.35,r*1.02*(slide?1.28:1)*(1-0.45*h/JUMP_H),r*0.30,0.26);
  ctx.save();
  /* 冲刺末 1s + 渐出宽限：闪烁预警 */
  const blink=(sprinting()&&sprintUntil-gNow<1000)||(gNow>=sprintUntil&&gNow<graceUntil);
  if(blink&&!REDUCED) ctx.globalAlpha=0.5+0.5*Math.abs(Math.sin(gNow/90));
  if(slide){                                     /* 滑铲：压低贴地、横向拉宽 */
    ctx.translate(cx,ground-r*0.22);
    ctx.scale(1.18,SLIDE_SQUASH);
  }else{
    ctx.translate(cx,cy); ctx.rotate(lean);
  }
  /* 身体 + 耳朵 */
  ctx.fillStyle=C.body; ctx.strokeStyle=C.ink; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(-r*0.55,-r*0.72,r*0.22,r*0.3,-0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(r*0.55,-r*0.72,r*0.22,r*0.3,0.4,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,0,r,r*0.88,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  /* 眼睛（摔倒变 ×）+ 嘴 */
  ctx.strokeStyle=C.ink; ctx.lineWidth=1.8;
  if(crashed){
    ctx.beginPath();
    ctx.moveTo(-r*0.42,-r*0.2); ctx.lineTo(-r*0.22,-r*0.02);
    ctx.moveTo(-r*0.22,-r*0.2); ctx.lineTo(-r*0.42,-r*0.02);
    ctx.moveTo(r*0.22,-r*0.2);  ctx.lineTo(r*0.42,-r*0.02);
    ctx.moveTo(r*0.42,-r*0.2);  ctx.lineTo(r*0.22,-r*0.02);
    ctx.stroke();
  }else{
    ctx.fillStyle=C.ink;
    ctx.beginPath(); ctx.arc(-r*0.32,-r*0.12,r*0.09,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.32,-r*0.12,r*0.09,0,Math.PI*2); ctx.fill();
  }
  ctx.strokeStyle=C.ink; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(0,r*0.18,r*0.16,crashed?0.7*Math.PI:0.15*Math.PI,crashed?0.3*Math.PI:0.85*Math.PI); ctx.stroke();
  ctx.restore();
  /* 护盾气泡 */
  if(shieldOn){
    ctx.fillStyle='rgba(191,224,242,.16)'; ctx.strokeStyle='rgba(127,184,216,.85)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy-2,r*1.3,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy-2,r*1.03,Math.PI*1.12,Math.PI*1.42); ctx.stroke();
  }
  /* 状态小图标（辣椒/磁铁/护盾/秒表），剩 0.8s 闪烁 */
  const icons=[];
  if(gNow<chiliUntil) icons.push(['chili',chiliUntil]);
  if(gNow<magnetUntil) icons.push(['magnet',magnetUntil]);
  if(shieldOn) icons.push(['shield',Infinity]);
  if(gNow<slowUntil) icons.push(['watch',slowUntil]);
  for(let i=0;i<icons.length;i++){
    const rem=icons[i][1]-gNow;
    const fade=rem<800?0.45+0.55*Math.abs(Math.sin(gNow/80)):1;
    const bx=cx+(i-(icons.length-1)/2)*20, by=cy-r*1.5;
    ctx.globalAlpha=fade;
    if(icons[i][0]==='chili') drawChili(bx,by,0.62);
    else if(icons[i][0]==='magnet') drawMagnet(bx,by,0.62);
    else if(icons[i][0]==='shield') drawShield(bx,by,0.62);
    else drawWatch(bx,by,0.62);
    ctx.globalAlpha=1;
  }
}

/* ---------- 主循环（gNow 只在这里推进；暂停/结算态停帧：常驻零 rAF） ---------- */
function tick(dt){
  if(state!=='running') return;
  gNow+=dt;
  if(MODES[MODE].timed){                        /* 限时模式：倒计时 */
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; $('#stTime').textContent='0s'; finishRun('timeup'); return; }
    $('#stTime').textContent=Math.ceil(timeLeft/1000)+'s';
  }
  const ds=curSpeed()*dt/1000;
  distPx+=ds;
  if(boostMul>1) boostMul=1+(boostMul-1)*Math.exp(-dt/BOOST_TAU);   /* 提速衰减回基线 */
  if(!sprinting()&&!SAVE.settings.lowPower) trail.length=0;
  stepPx(dt);
  if(air&&gNow-airT0>=JUMP_MS){                 /* 落地：先处理缓冲预输入，再查碰撞 */
    air=false; landCoolT0=gNow;
    burst(laneX(px),roadBottom()-2,['rgba(150,140,125,.55)','rgba(200,190,175,.5)'],5);  /* 落地扬尘 */
    if(gNow-jumpBufT0<=JUMP_BUF_MS) tryJump(true);  /* 预输入落地即跳，豁免冷却 */
  }
  if(slide&&gNow-slideT0>=SLIDE_MS){ slide=false; slideCoolT0=gNow; }   /* 滑铲结束 */
  if(slide&&gNow-lastSlideDust>90){             /* 滑铲扬尘 */
    lastSlideDust=gNow;
    burst(laneX(px),roadBottom()-2,['rgba(160,150,135,.5)','rgba(200,190,175,.45)'],3);
  }
  tickObstacles(ds);
  tickTomos(ds,dt);
  tickItems(ds,dt);
  tickParts(dt);
  maybeSpawn();
  if(sprinting()&&!SAVE.settings.lowPower) trail.push({x:laneX(px),y:roadBottom()-airHeight(),t:gNow});
  if(trail.length>24) trail.shift();
  const dm=distPx/PX_PER_M;                     /* 里程小成就 */
  if(!mile.m500&&dm>=500){ mile.m500=1; talk('m500'); }
  if(!mile.m1000&&dm>=1000){ mile.m1000=1; talk('m1000'); }
  checkHit();
  if(state!=='running') return;                 /* 本帧撞了就直接停在结算帧 */
  drawScene();
  $('#stDist').innerHTML=Math.floor(dm)+'<em>m</em>';
  if(comboCnt!==hudCombo){                     /* 连击角标：≥2 才显示 */
    hudCombo=comboCnt;
    if(comboCnt>=2){ $('#stCombo').textContent='×'+comboCnt; $('#stComboWrap').style.display=''; }
    else $('#stComboWrap').style.display='none';
  }
  $('#sprintFill').style.transform='scaleX('+sprintMeter().toFixed(3)+')';
}
function frame(t){
  const dt=Math.min(50,t-lastT); lastT=t;
  tick(dt);
  raf=requestAnimationFrame(frame);
}
function startLoop(){ if(!raf){ lastT=performance.now(); raf=requestAnimationFrame(frame); } }
function stopLoop(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }

/* ---------- 暂停 / 结算 / 重开 ---------- */
function setPaused(p){
  if(p&&state==='running'){ state='paused'; $('#pauseOv').classList.add('show'); stopLoop(); }
  else if(!p&&state==='paused'){ state='running'; $('#pauseOv').classList.remove('show'); startLoop(); }
}

  distPx=0; tomato=0; gNow=0;

  boostMul=1; sprintUntil=0; graceUntil=0; smashes=0; sprintsRun=0;

  comboSid=null; comboCnt=0; comboFlag=false; comboMax=0; comboScore=0; nearMissScore=0;
  sprintSmash=0; nearRun=0;

  $('#sprintFill').style.transform='scaleX(0)';

  const cf=$('#confetti'); if(cf) cf.remove();
  state='running'; startLoop();
  if(MODE==='daily'&&dailyMod) talkSay('今日挑战：'+dailyMod.label+' · 连续 '+(DAILY.streak||0)+' 天');
  /* 首局教学：只出现一次（存 tutorialDone），压过每日提示 */

function finishRun(reason){
  if(state==='over') return;
  lastReason=reason||'quit';
  stopLoop(); $('#pauseOv').classList.remove('show');
  state='over';
  const dist=Math.floor(distPx/PX_PER_M);
  const score=Math.round(dist+tomato*50*tomatoMult+itemScore+smashes*SMASH_SCORE+comboScore+nearMissScore); /* 计分口径 plan.md 3.2 */
  SAVE.totals.runs++; SAVE.totals.dist+=dist; SAVE.totals.tomato+=tomato; SAVE.totals.sprints+=sprintsRun;
  SAVE.totals.nearMiss=(SAVE.totals.nearMiss||0)+(nearMissScore/NEAR_SCORE);
  SAVE.totals.comboMax=Math.max(SAVE.totals.comboMax||0,comboMax);
  /* 成就判定（本局 / 累计 / 每日） */
  if(dist>=500) unlock('dist500');
  if(dist>=1000) unlock('dist1000');
  if(dist>=1500) unlock('dist1500');
  if(dist>=2000) unlock('dist2000');
  if(SAVE.totals.tomato>=100) unlock('tomato100');
  if(SAVE.totals.tomato>=500) unlock('tomato500');
  if(SAVE.totals.tomato>=2000) unlock('tomato2000');
  if(sprintsRun>=3) unlock('sprint3run');
  if(SAVE.totals.sprints>=20) unlock('sprint20all');
  if(MODE==='purist'&&dist>=1000) unlock('purist1000');
  if(MODE==='daily'){
    if((DAILY.streak||0)>=3) unlock('daily3');
    if((DAILY.streak||0)>=7) unlock('daily7');
  }
  applySkin();                       /* 本次成绩可能解锁皮肤 */
  /* 模式最佳（每日挑战用独立存档） */
  const cfg=MODES[MODE], isDaily=(MODE==='daily'), today=dailyTodayStr();
  const prevBest=isDaily?((DAILY.date===today)?(DAILY.best||0):0):((SAVE[cfg.bestKey]&&SAVE[cfg.bestKey].score)||0);
  const isRecord=score>prevBest;
  if(!isDaily&&isRecord) SAVE[cfg.bestKey]={dist:dist,tomato:tomato,score:score};
  if(isDaily){
    if(DAILY.date===today){
      if(score>(DAILY.best||0)) DAILY.best=score;
    }else{
      const y=new Date(); y.setDate(y.getDate()-1);
      DAILY.streak=(DAILY.date===dateStr(y))?(DAILY.streak||0)+1:1;
      DAILY.date=today; DAILY.best=score;
    }
    persistDaily();
  }
  /* 本机 Top5 榜单 */
  const entry={score:score,dist:dist,tomato:tomato,mode:MODE,date:today};
  SAVE.board.push(entry);
  SAVE.board.sort(function(a,b){ return b.score-a.score; });
  SAVE.board=SAVE.board.slice(0,5);
  const rankIdx=SAVE.board.indexOf(entry);
  $('#resRank').textContent=rankIdx>=0?('第 '+(rankIdx+1)+' 名'):'未入榜';
  persist(); refreshBest();
  if(isRecord){
    $('#resTag').textContent=isDaily?('今日最佳！'+dailyMod.label):'新纪录！月巴吃茄心满意足～';
    lastWasRecord=!isDaily;
    confetti();
  }else{
    $('#resTag').textContent=lastReason==='timeup'?'时间到！再来一局？':
      (lastReason==='quit'?'全力冲刺，下次更快！':'月巴摔了个屁股蹲儿……再来！');
  }
  $('#resDist').textContent=dist+' m';
  $('#resTomato').textContent=tomato+'';
  $('#resCombo').textContent=comboMax+'';
  $('#resScore').textContent=score+'';
  $('#resBest').textContent=Math.max(prevBest,score)+'';
  $('#resultOv').classList.add('show');
}

/* ---------- 音效（WebAudio 全合成，零素材；muted 静音） ---------- */
let AC=null;
function audio(){
  if(SAVE.settings.muted) return null;
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol,delay){
  const ac=audio(); if(!ac) return;
  const t=ac.currentTime+(delay||0);
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f0,t);
  if(f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol||0.12,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function noiseBurst(dur,vol,freq){
  const ac=audio(); if(!ac) return;
  const n=Math.floor(ac.sampleRate*dur), buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=ac.createBufferSource(); s.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
  const g=ac.createGain(); g.gain.value=vol||0.1;
  s.connect(f); f.connect(g); g.connect(ac.destination);
  s.start();
}

window.addEventListener('keydown',function(e){
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){
    if(state==='running') setPaused(true); else if(state==='paused') setPaused(false);
    return;
  }
  if(e.key==='Enter'){ if(state==='over') restart(); return; }
  if(state!=='running') return;
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){ steer(-1); }
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){ steer(1); }
  else if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'||e.key===' '){ tryJump(); e.preventDefault(); }
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){ trySlide(); e.preventDefault(); }
});
/* 触屏：左右滑切道、上滑跳、轻点也跳（dpad 是实体兜底） */
let touchStart=null;
cv.addEventListener('touchstart',function(e){
  const t=e.changedTouches[0];
  touchStart={x:t.clientX,y:t.clientY};
},{passive:true});
cv.addEventListener('touchend',function(e){
  if(!touchStart) return;
  const t=e.changedTouches[0];
  handleSwipe(t.clientX-touchStart.x,t.clientY-touchStart.y);
  touchStart=null;
},{passive:true});
function handleSwipe(dx,dy){
  if(state!=='running') return;
  const AX=36;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>AX){ steer(dx>0?1:-1); }
  else if(dy<-AX){ tryJump(); }
  else if(dy>AX){ trySlide(); }
  else if(Math.abs(dx)<=AX&&Math.abs(dy)<=AX){ tryJump(); }  /* 轻点=跳 */
}
document.querySelectorAll('#dpad .btn').forEach(function(b){
  b.addEventListener('click',function(){
    const act=b.getAttribute('data-act');
    if(act==='left') steer(-1);
    else if(act==='right') steer(1);
    else if(act==='slide') trySlide();
    else tryJump();
  });
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&state==='running') setPaused(true); /* 切后台自动暂停 */
});
