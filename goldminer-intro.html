<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#031019">
<title>黄金矿工 · 番茄矿井</title>
<style>
  :root{
    --cy:#46e6f2;
    --cy2:#b0f9ff;
    --dim:#7fa7b7;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;overflow:hidden;background:#031019;color:#ddf6fb;
    font-family:"SF Mono","Cascadia Mono",Consolas,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
  }
  body.closing{pointer-events:none;}

  #cv{position:fixed;inset:0;display:block;width:100%;height:100%;
    transition:opacity .45s ease,transform .45s ease;}
  body.closing #cv{opacity:0;transform:scale(1.045);}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(128% 92% at 50% 32%,rgba(0,0,0,0) 40%,rgba(0,0,0,.42) 76%,rgba(0,0,0,.8) 100%);}
  body.closing .vignette{opacity:0;transition:opacity .4s ease;}

  /* ---------------- UI：与游戏本体同族的深青 HUD ---------------- */
  .ui{position:fixed;inset:0;pointer-events:none;transition:opacity .32s ease;
    animation:uiIn .9s cubic-bezier(.2,.7,.2,1) both;}
  @keyframes uiIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  body.closing .ui{opacity:0;}

  /* 底部按钮区：宽度/字号与数织导入页的 hero 按钮同比例 */
  .foot{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(16px + env(safe-area-inset-bottom));
    width:min(340px,86vw);
    display:flex;flex-direction:column;align-items:center;gap:7px;}

  .go{
    pointer-events:auto;position:relative;display:block;width:100%;box-sizing:border-box;
    padding:13px 0;border:1px solid rgba(99,234,247,.85);cursor:pointer;outline:none;border-radius:2px;
    font-family:inherit;font-size:12px;font-weight:900;
    letter-spacing:.2em;text-indent:.2em;color:#eafeff;
    background:
      linear-gradient(180deg,rgba(70,230,242,.26),rgba(24,140,164,.34)),
      linear-gradient(180deg,rgba(8,34,46,.96),rgba(3,14,21,.98));
    box-shadow:0 0 26px rgba(70,230,242,.2),inset 0 0 22px rgba(70,230,242,.12),
      0 12px 30px rgba(0,0,0,.55);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
    transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
  }
  .go::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;
    background:linear-gradient(180deg,var(--cy2),var(--cy));
    box-shadow:0 0 12px rgba(70,230,242,.8);}
  .go::after{content:'';position:absolute;right:12px;top:50%;width:5px;height:5px;margin-top:-3px;
    border-top:1px solid rgba(176,249,255,.9);border-right:1px solid rgba(176,249,255,.9);
    transform:rotate(45deg);}
  .go:hover{background:
      linear-gradient(180deg,rgba(70,230,242,.34),rgba(24,140,164,.44)),
      linear-gradient(180deg,rgba(8,34,46,.96),rgba(3,14,21,.98));
    box-shadow:0 0 34px rgba(70,230,242,.3),inset 0 0 22px rgba(70,230,242,.18),
      0 12px 30px rgba(0,0,0,.55);}
  .go:active{transform:scale(.98);}
  .go:focus-visible{outline:2px solid rgba(176,249,255,.8);outline-offset:4px;}

  .tip{font-size:9px;font-weight:700;letter-spacing:2.6px;text-indent:2.6px;
    color:rgba(127,167,183,.78);text-shadow:0 0 10px rgba(0,0,0,.9);}

  /* 独立打开时，关闭后的落点 */
  .after{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s ease .1s;}
  body.done .after{display:flex;opacity:1;}
  .after .at{font-size:clamp(18px,3vw,26px);font-weight:900;letter-spacing:.34em;text-indent:.34em;
    color:var(--cy2);text-shadow:0 0 20px rgba(70,230,242,.5),0 0 46px rgba(70,230,242,.22);}
  .after .as{font-size:10px;letter-spacing:.18em;color:var(--dim);}

  @media (max-height:560px){
    .foot{bottom:calc(12px + env(safe-area-inset-bottom));gap:5px;}
    .tip{display:none;}
  }
  @media (prefers-reduced-motion:reduce){
    .ui{animation:none;}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vignette"></div>

<div class="ui">
  <div class="foot">
    <button id="enter" class="go" type="button">开始挖矿</button>
    <div class="tip">进入矿洞 · 钩走属于你的番茄</div>
  </div>
</div>

<div class="after">
  <div class="at">矿洞已开启</div>
  <div class="as">开场页已关闭 · 刷新页面可再次进入</div>
</div>

<script>
(function(){
'use strict';

/* ================= 像素番茄精灵（与游戏同款色板） ================= */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', {alpha:false});
const enterBtn = document.getElementById('enter');

const PAL = {
  edge:'#2a0b0c', deep:'#5f1719', shadow:'#8d2622', base:'#c0352b',
  light:'#e05244', high:'#ff8672', spec:'#ffd3bd', rim:'#69c3d2'
};
const PAL_GOLD = {
  edge:'#4a2a05', deep:'#7a4e08', shadow:'#b17c12', base:'#e3a81f',
  light:'#ffcb44', high:'#ffe98f', spec:'#fffbe0', rim:'#ffe6a0'
};
const TINY = [], BIG = [], TINY_G = [], BIG_G = [];

function bake(small, variant, pal){
  const P = pal || PAL;
  const SW = small ? 15 : 26;
  const SH = small ? 16 : 30;
  const cx = SW * 0.5;
  const cy = small ? 8.8 : 16.5;
  const rx = small ? 6.1 : 11;
  const ry = small ? 5.3 : 10.2;
  const c = document.createElement('canvas');
  c.width = SW; c.height = SH;
  const g = c.getContext('2d');
  const bands = [P.deep, P.shadow, P.base, P.light, P.high, P.spec];
  const cuts = [0.24, 0.40, 0.56, 0.72, 0.86];

  for(let py = 0; py < SH; py++){
    for(let px = 0; px < SW; px++){
      const nx = (px + 0.5 - cx) / rx;
      const ny = (py + 0.5 - cy) / ry;
      const d = Math.sqrt(nx*nx + ny*ny);
      if(d > 1) continue;
      if(d > 0.9){
        g.fillStyle = ((nx*0.45 + ny*0.9) > 0.22) ? P.rim : P.edge;
        g.fillRect(px, py, 1, 1);
        continue;
      }
      let B = 1 - 0.52 * Math.sqrt((nx+0.52)*(nx+0.52) + (ny+0.58)*(ny+0.58));
      if(d > 0.84) B -= 0.10;
      const nz = Math.sin(px*12.9898 + py*78.233 + variant*7.13) * 43758.5453;
      B += ((nz - Math.floor(nz)) - 0.5) * 0.04;
      let bi = 0;
      while(bi < cuts.length && B > cuts[bi]) bi++;
      g.fillStyle = bands[bi];
      g.fillRect(px, py, 1, 1);
    }
  }

  g.fillStyle = P.spec;
  g.fillRect(Math.round(cx - 4*(rx/11)), Math.round(cy - 5.5*(ry/10.2)), 1, 1);

  // 五片像素绿萼（黄金番茄用金色萼片）
  const hubX = cx, hubY = cy - ry*0.97;
  const baseA = -Math.PI/2 + variant*0.13;
  const off = small ? 1.5 : 2.3;
  const lu = small ? 1.5 : 2.3;
  const lv = small ? 0.75 : 1.15;
  const hubR2 = small ? 1.4 : 2.1;
  const leafDark = P === PAL_GOLD ? '#7a5308' : '#0e3a29';
  const leafMid = P === PAL_GOLD ? '#c79a2a' : '#2f9469';
  const leafHot = P === PAL_GOLD ? '#ffe08a' : '#54c08c';
  const leafDeep = P === PAL_GOLD ? '#6b4708' : '#1c6b4d';
  for(let py = 0; py < SH; py++){
    for(let px = 0; px < SW; px++){
      const dx = px + 0.5 - hubX, dy = py + 0.5 - hubY;
      let q = -1;
      if(dx*dx + dy*dy <= hubR2) q = 0;
      else{
        for(let i = 0; i < 5; i++){
          const a = baseA + i*Math.PI*2/5;
          const ca = Math.cos(a), sa = Math.sin(a);
          const ox = ca*off, oy = sa*off;
          const u = ((dx-ox)*ca + (dy-oy)*sa) / lu;
          const v = (-(dx-ox)*sa + (dy-oy)*ca) / lv;
          const e = u*u + v*v;
          if(e <= 1 && (q < 0 || e < q)) q = e;
        }
      }
      if(q < 0) continue;
      let col;
      if(q > 0.62) col = leafDark;
      else if(q > 0) col = leafMid;
      else col = leafDeep;
      if(q > 0 && q <= 0.62 && (-0.5*dx - 0.72*dy) > 0) col = leafHot;
      g.fillStyle = col;
      g.fillRect(px, py, 1, 1);
    }
  }

  const sx = Math.round(cx);
  const sy = Math.max(0, Math.round(hubY - (small ? 2.6 : 2.7)));
  g.fillStyle = P === PAL_GOLD ? '#8a5d0a' : '#123d2c';
  g.fillRect(sx - (small ? 0 : 1), sy, small ? 1 : 2, small ? 2 : 4);
  g.fillStyle = P === PAL_GOLD ? '#ffe79a' : '#3f9a70';
  g.fillRect(sx - (small ? 0 : 1), sy, 1, small ? 2 : 4);

  return {c:c, cx:cx, cy:cy, rx:rx};
}
for(let v = 0; v < 4; v++){
  TINY.push(bake(true, v, PAL)); BIG.push(bake(false, v, PAL));
  TINY_G.push(bake(true, v, PAL_GOLD)); BIG_G.push(bake(false, v, PAL_GOLD));
}

/* 星星的柔光底片：一次烘焙，逐帧缩放绘制 */
const GLOW = (function(){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(255,244,190,.95)');
  rg.addColorStop(0.20, 'rgba(255,216,112,.5)');
  rg.addColorStop(0.52, 'rgba(255,190,70,.14)');
  rg.addColorStop(1, 'rgba(255,170,50,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, 64, 64);
  return c;
})();

/* 番茄柔光也预烘焙成贴图，避免每帧 createRadialGradient */
function bakeGlow(c0, c1, c2){
  const c = document.createElement('canvas');
  c.width = 96; c.height = 96;
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(48, 48, 0, 48, 48, 48);
  rg.addColorStop(0, c0);
  rg.addColorStop(0.42, c1);
  rg.addColorStop(1, c2);
  g.fillStyle = rg;
  g.fillRect(0, 0, 96, 96);
  return c;
}
const GLOW_RED = bakeGlow('rgba(255,190,112,.22)', 'rgba(255,124,58,.075)', 'rgba(255,90,40,0)');
const GLOW_GOLD = bakeGlow('rgba(255,232,140,.34)', 'rgba(255,196,72,.13)', 'rgba(255,176,40,0)');

/* ================= 场景数据 ================= */
let VW = 0, VH = 0, DPR = 1;
const stars = [], chains = [], dust = [], ripples = [], sparks = [];
let bgGrad = null, hazeGrad = null, bgLayer = null, endLimit = 0;
let last = 0, clock = 0, closed = false, raf = 0, readySent = false, resizeT = 0;
let rngState = 1;

function srand(n){ rngState = (n || 1) >>> 0; }
function rnd(){ rngState = (rngState * 1664525 + 1013904223) >>> 0; return rngState / 4294967296; }
function rr(a, b){ return a + (b - a) * rnd(); }
function ri(a, b){ return Math.floor(a + (b - a + 1) * rnd()); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

const ptr = {x:-9999, y:-9999, down:false};
let lastPoke = 0;

/* ================= 生成构图 ================= */
/* 5x7 像素字：4099 */
const DIGITS = {
  '4':['00010','00110','01010','10010','11111','00010','00010'],
  '0':['01110','10001','10011','10101','11001','10001','01110'],
  '9':['01110','10001','10001','01111','00001','00001','01110']
};
const DIGIT_TEXT = '4099';

function build(){
  VW = Math.max(1, window.innerWidth);
  VH = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);

  cv.width = Math.round(VW * DPR);
  cv.height = Math.round(VH * DPR);
  cv.style.width = VW + 'px';
  cv.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;

  bgGrad = ctx.createLinearGradient(0, 0, 0, VH);
  bgGrad.addColorStop(0, '#0a2530');
  bgGrad.addColorStop(0.34, '#061a23');
  bgGrad.addColorStop(0.7, '#03121a');
  bgGrad.addColorStop(1, '#01090e');

  hazeGrad = ctx.createRadialGradient(VW*0.5, VH*0.62, Math.max(8, VH*0.02),
                                      VW*0.5, VH*0.62, Math.max(VW, VH)*0.62);
  hazeGrad.addColorStop(0, 'rgba(255,150,70,.10)');
  hazeGrad.addColorStop(0.46, 'rgba(255,120,50,.035)');
  hazeGrad.addColorStop(1, 'rgba(255,100,40,0)');

  /* 背景（渐变 + 暖雾）烘焙成一层，逐帧只做一次 drawImage */
  bgLayer = document.createElement('canvas');
  bgLayer.width = cv.width;
  bgLayer.height = cv.height;
  const bgc = bgLayer.getContext('2d');
  bgc.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgc.fillStyle = bgGrad;
  bgc.fillRect(0, 0, VW, VH);
  bgc.fillStyle = hazeGrad;
  bgc.fillRect(0, 0, VW, VH);

  srand((Date.now() & 0x7fffffff) ^ 0x9e3779b9);
  stars.length = 0; chains.length = 0; dust.length = 0;
  ripples.length = 0; sparks.length = 0;

  const short = VH < 560;
  const narrow = VW < 560;

  /* 1. 星星像素字 4099：窄屏用更大的横向占比，比例随视口统一缩放 */
  const cell = clamp(7, Math.min(VW * (narrow ? 0.88 : 0.60) / 23,
                                 VH * (narrow ? 0.26 : 0.30) / 7), narrow ? 22 : 26);
  const gw = 5, gap = 1;
  const cols = DIGIT_TEXT.length * gw + (DIGIT_TEXT.length - 1) * gap;
  const ox = (VW - cols * cell) * 0.5;
  const oy = VH * (short ? 0.07 : 0.10);
  const bh = 7 * cell;

  for(let i = 0; i < DIGIT_TEXT.length; i++){
    const bmp = DIGITS[DIGIT_TEXT[i]];
    for(let ry = 0; ry < 7; ry++){
      for(let cxi = 0; cxi < 5; cxi++){
        if(bmp[ry][cxi] !== '1') continue;
        const gx = i * (gw + gap) + cxi;
        stars.push({
          x: ox + (gx + 0.5) * cell,
          y: oy + (ry + 0.5) * cell,
          r: cell * rr(0.19, 0.215),
          ph: rr(0, 6.283), spd: rr(1.15, 2.5), base: 1, lo: 0.62
        });
      }
    }
  }
  /* 零散背景星：只在上半部，衬托像素字 */
  const nBg = Math.round(clamp(16, VW / 40, 44));
  for(let k = 0; k < nBg; k++){
    stars.push({
      x: rr(VW*0.02, VW*0.98), y: rr(VH*0.02, VH*0.46),
      r: cell * rr(0.05, 0.14),
      ph: rr(0, 6.283), spd: rr(0.6, 1.8), base: rr(0.24, 0.6), lo: 0.16, bg: true
    });
  }

  /* 2. 吊链：从星光下方垂下 */
  const anchorY = oy + bh + cell * 1.25;
  endLimit = VH * (short ? 0.74 : (narrow ? 0.78 : 0.76));
  const maxW = Math.min(VW * 0.92, 1100);
  const x0 = (VW - maxW) * 0.5;
  const room = Math.max(40, endLimit - anchorY);
  const rs = narrow ? 0.82 : 1;   // 窄屏整体收一档番茄尺寸

  function addChain(ax, ay, L, r){
    chains.push({
      ax:ax, ay:ay, L:L, r:r, v:ri(0,3),
      theta:rr(-0.05, 0.05), omega:0, cd:0,
      ph:rr(0, 6.283), spd:rr(0.3, 0.62), amp:rr(0.035, 0.07),
      k:rr(0.5, 0.95), damp:rr(1.1, 1.5),
      gold:false, pop:0
    });
  }

  const hero = [
    {f:0.40, fr:0.84, r:(short ? 22 : 30) * rs},
    {f:0.545, fr:0.93, r:(short ? 30 : 40) * rs},
    {f:0.68, fr:0.88, r:(short ? 19 : 25) * rs}
  ];
  for(let i = 0; i < hero.length; i++){
    const hh = hero[i];
    const ax = x0 + maxW * hh.f + rr(-6, 6);
    addChain(ax, anchorY, clamp(hh.fr * endLimit - anchorY, cell*5, room), hh.r);
  }

  const nChain = Math.round(clamp(13, VW / 66, 24));
  for(let k = 0; k < nChain; k++){
    const f = clamp((k + 0.5) / nChain + rr(-0.018, 0.018), 0.02, 0.98);
    if(Math.abs(f - 0.40) < 0.045 || Math.abs(f - 0.545) < 0.045 || Math.abs(f - 0.68) < 0.045) continue;
    const ax = x0 + maxW * f + rr(-cell*0.5, cell*0.5);
    const L = rr(room * 0.24, room * rr(0.55, 0.95));
    /* 窄屏多留中等个头的番茄，避免满屏只剩看不清的碎点 */
    const q = rnd();
    let r;
    if(q < (narrow ? 0.30 : 0.46)) r = rr(2.8, 5.4);
    else if(q < (narrow ? 0.66 : 0.78)) r = rr(5.8, 9.6);
    else if(q < 0.92) r = rr(10.5, 15.5);
    else r = rr(17, 22);
    addChain(ax, anchorY + rr(-3, 3), L, r * rs);
  }
  chains.sort(function(a, b){ return a.r - b.r; });

  /* 3. 矿尘 */
  for(let k = 0; k < 24; k++){
    dust.push({
      x:rr(0, VW), y:rr(0, VH), r:rr(0.6, 1.6),
      ph:rr(0, 6.283), spd:rr(0.04, 0.14), al:rr(0.05, 0.18)
    });
  }
}

/* ================= 物理 ================= */
function stepChains(dt, t){
  for(let i = 0; i < chains.length; i++){
    const c = chains[i];
    const L = c.L;
    const target = c.amp * Math.sin(t*c.spd + c.ph);
    const acc = -(1500 / L) * Math.sin(c.theta) - c.damp * c.omega + c.k * (target - c.theta);

    c.omega = clamp(c.omega + acc*dt, -3.0, 3.0);
    c.theta += c.omega * dt;
    if(c.theta > 0.78){ c.theta = 0.78; c.omega *= -0.28; }
    if(c.theta < -0.78){ c.theta = -0.78; c.omega *= -0.28; }
    if(c.cd > 0) c.cd -= dt;
    if(c.pop > 0) c.pop = Math.max(0, c.pop - dt*2.2);
  }
}

function stepSparks(dt){
  for(let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i];
    s.age += dt;
    if(s.age >= s.life){ sparks.splice(i, 1); continue; }
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += 150 * dt;
    s.vx *= (1 - 1.6*dt);
    s.vy *= (1 - 0.6*dt);
  }
}

function burst(x, y, r){
  const n = 14 + Math.round(r * 0.25);
  for(let i = 0; i < n; i++){
    const a = rr(0, 6.283), sp = rr(50, 190);
    sparks.push({
      x:x + Math.cos(a)*r*0.4, y:y + Math.sin(a)*r*0.4,
      vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 30,
      r:rr(1.2, 2.6), life:rr(0.45, 0.9), age:0
    });
  }
}

/* 命中吊着的番茄（从最上层往下找） */
function chainAt(x, y){
  for(let i = chains.length - 1; i >= 0; i--){
    const c = chains[i];
    const ex = c.ax + Math.sin(c.theta) * c.L;
    const ey = c.ay + Math.cos(c.theta) * c.L;
    const cx = ex + Math.sin(c.theta) * c.r * 0.92;
    const cy = ey + Math.cos(c.theta) * c.r * 0.92;
    const R = Math.max(16, c.r * 1.35);
    if((x-cx)*(x-cx) + (y-cy)*(y-cy) < R*R) return {c:c, cx:cx, cy:cy};
  }
  return null;
}

/* 碰一下 → 给一记冲量；之后不再跟随指针，靠阻尼自己摆回去 */
function pokeAt(h, x, power){
  const c = h.c;
  if(c.cd > 0) return;
  const dir = (x - h.cx) >= 0 ? 1 : -1;
  const p = clamp(power / (0.55 + c.r * 0.12), 0.35, 1.8);
  c.omega = clamp(c.omega + dir * 1.15 * p, -3.0, 3.0);
  c.cd = 0.22;
}

/* ================= 绘制 ================= */
function drawHanging(x, y, r, v, theta, gold, pop){
  const sp = (gold ? (r < 9.5 ? TINY_G : BIG_G) : (r < 9.5 ? TINY : BIG))[v & 3];
  const s = (r / sp.rx) * (1 + pop * 0.22);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(theta);
  ctx.drawImage(sp.c, -sp.cx*s, r*0.92 - sp.cy*s, sp.c.width*s, sp.c.height*s);
  ctx.restore();
}

function drawRope(ax, ay, ex, ey, r){
  const g = ctx.createLinearGradient(ax, ay, ex, ey);
  g.addColorStop(0, 'rgba(255,214,136,0)');
  g.addColorStop(0.16, 'rgba(255,214,136,.5)');
  g.addColorStop(0.7, 'rgba(255,190,100,.36)');
  g.addColorStop(1, 'rgba(255,170,74,.3)');
  ctx.save();
  ctx.strokeStyle = g;
  ctx.lineWidth = r >= 10 ? 1.4 : 1.1;
  ctx.lineCap = 'round';
  ctx.setLineDash([2.5, 3.6]);
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ex, ey);
  ctx.stroke();
  ctx.restore();
}

function drawGlow(x, y, r, mult, gold){
  const R = r * 2.1;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, mult);
  ctx.drawImage(gold ? GLOW_GOLD : GLOW_RED, x - R, y - R, R*2, R*2);
  ctx.restore();
}

function starCross(x, y, r, a){
  const w = Math.max(1, Math.round(r*0.5));
  const L = Math.round(r*1.45);
  ctx.globalAlpha = a;
  ctx.fillStyle = '#ffe9a8';
  ctx.fillRect(x - w*0.5, y - L, w, L*2);
  ctx.fillRect(x - L, y - w*0.5, L*2, w);
  ctx.fillStyle = '#fffbe6';
  ctx.fillRect(x - w*0.5, y - w*0.5, w, w);
  ctx.globalAlpha = 1;
}

function draw(t){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bgLayer, 0, 0, VW, VH);

  // 矿尘
  for(let i = 0; i < dust.length; i++){
    const p = dust[i];
    const y = p.y - (t*VH*0.012*p.spd + t*4) % VH;
    const yy = y < -10 ? y + VH : y;
    ctx.fillStyle = 'rgba(255,206,140,' + p.al + ')';
    ctx.beginPath();
    ctx.arc(p.x, yy, p.r, 0, 6.283);
    ctx.fill();
  }

  // 星星：先柔光（可缩放平滑），再十字亮芯（像素锐利）
  const tws = [];
  for(let i = 0; i < stars.length; i++){
    const s = stars[i];
    const tw = 0.5 + 0.5 * Math.sin(t*s.spd + s.ph);
    const a = (s.lo + (1 - s.lo)*tw) * s.base;
    tws.push({s:s, a:a, tw:tw});
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingEnabled = true;
  for(let i = 0; i < tws.length; i++){
    const o = tws[i], s = o.s;
    if(s.bg) continue;   // 背景碎星只画十字，省掉一层大范围柔光
    const R = s.r * (2.1 + o.tw*0.7);
    ctx.globalAlpha = o.a * 0.5;
    ctx.drawImage(GLOW, s.x - R, s.y - R, R*2, R*2);
  }
  ctx.restore();
  ctx.imageSmoothingEnabled = false;
  for(let i = 0; i < tws.length; i++){
    const o = tws[i], s = o.s;
    starCross(s.x, s.y, s.r * (0.92 + o.tw*0.13), o.a);
  }

  // 吊绳
  for(let i = 0; i < chains.length; i++){
    const c = chains[i];
    const ex = c.ax + Math.sin(c.theta) * c.L;
    const ey = c.ay + Math.cos(c.theta) * c.L;
    drawRope(c.ax, c.ay, ex, ey, c.r);
  }

  // 吊着的番茄
  for(let i = 0; i < chains.length; i++){
    const c = chains[i];
    const ex = c.ax + Math.sin(c.theta) * c.L;
    const ey = c.ay + Math.cos(c.theta) * c.L;
    const cx2 = ex + Math.sin(c.theta) * c.r * 0.92;
    const cy2 = ey + Math.cos(c.theta) * c.r * 0.92;

    if(c.r >= 7.5 || c.gold){
      const flick = 0.85 + Math.sin(t*2.1 + c.ph*3)*0.18 + Math.min(0.5, Math.abs(c.omega)*0.3)
        + (c.gold ? 0.35 : 0);
      drawGlow(cx2, cy2, c.r, flick, c.gold);
    }
    ctx.fillStyle = c.gold ? 'rgba(255,236,150,.95)' : 'rgba(255,214,140,.85)';
    ctx.beginPath();
    ctx.arc(ex, ey, Math.max(1, c.r*0.09), 0, 6.283);
    ctx.fill();
    drawHanging(ex, ey, c.r, c.v, c.theta*0.75, c.gold, c.pop);

    // 黄金番茄：环绕的星芒
    if(c.gold){
      const sR = c.r * 1.28;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.imageSmoothingEnabled = true;
      for(let k = 0; k < 3; k++){
        const a2 = t*0.55 + k*2.094 + c.ph;
        const px = cx2 + Math.cos(a2) * sR;
        const py = cy2 + Math.sin(a2) * sR * 0.92;
        const sr = Math.max(2, c.r*0.22);
        const tw = 0.45 + 0.55*(0.5 + 0.5*Math.sin(t*3.1 + k*2 + c.ph));
        const R2 = sr * 3.2;
        ctx.globalAlpha = tw * 0.6;
        ctx.drawImage(GLOW, px - R2, py - R2, R2*2, R2*2);
      }
      ctx.restore();
      ctx.imageSmoothingEnabled = false;
      for(let k = 0; k < 3; k++){
        const a2 = t*0.55 + k*2.094 + c.ph;
        const px = cx2 + Math.cos(a2) * sR;
        const py = cy2 + Math.sin(a2) * sR * 0.92;
        const tw = 0.45 + 0.55*(0.5 + 0.5*Math.sin(t*3.1 + k*2 + c.ph));
        starCross(px, py, Math.max(1.6, c.r*0.19), tw);
      }
    }
  }

  // 金色碎屑
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let i = 0; i < sparks.length; i++){
    const s = sparks[i];
    const k = 1 - s.age / s.life;
    ctx.globalAlpha = k;
    ctx.fillStyle = '#ffe38a';
    const w = Math.max(1, s.r * (0.6 + k));
    ctx.fillRect(s.x - w*0.5, s.y - w*0.5, w, w);
  }
  ctx.restore();
  ctx.globalAlpha = 1;

  // 触碰涟漪
  for(let i = 0; i < ripples.length; i++){
    const r = ripples[i];
    const k = r.age / 0.55;
    if(k > 1) continue;
    ctx.strokeStyle = 'rgba(255,214,120,' + ((1-k)*0.45).toFixed(3) + ')';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.arc(r.x, r.y, 8 + k*64, 0, 6.283);
    ctx.stroke();
  }
}

/* ================= 指针：碰到才晃，不跟随 ================= */
cv.addEventListener('pointerdown', function(e){
  ptr.down = true;
  ptr.x = e.clientX;
  ptr.y = e.clientY;

  const h = chainAt(ptr.x, ptr.y);
  if(h){
    pokeAt(h, ptr.x, 1.3);
    if(!h.c.gold){
      h.c.gold = true;
      h.c.pop = 1;
      burst(h.cx, h.cy, h.c.r);
    }
    ripples.push({x:h.cx, y:h.cy, age:0});
    if(ripples.length > 3) ripples.shift();
  }
  if(e.cancelable) e.preventDefault();
}, {passive:false});

/* 划过时只给一下轻推，之后靠阻尼摆回去 */
window.addEventListener('pointermove', function(e){
  if(e.pointerType === 'touch' && !ptr.down) return;
  ptr.x = e.clientX;
  ptr.y = e.clientY;
  const now = performance.now();
  if(now - lastPoke < 90) return;
  const h = chainAt(ptr.x, ptr.y);
  if(h){
    pokeAt(h, ptr.x, 0.75);
    lastPoke = now;
  }
});

function endPointer(){ ptr.down = false; }
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
window.addEventListener('blur', function(){ ptr.down = false; });

/* ================= 关闭 ================= */
function closeIntro(){
  if(closed) return;
  closed = true;
  document.body.classList.add('closing');
  setTimeout(function(){
    if(window.parent && window.parent !== window){
      try{ window.parent.postMessage({type:'goldminer-intro-done'}, '*'); }catch(err){}
    }else{
      document.body.classList.add('done');
    }
  }, 430);
  setTimeout(function(){
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
  }, 780);
}

enterBtn.addEventListener('click', closeIntro);
window.addEventListener('keydown', function(e){
  if(e.key === 'Escape' || e.key === 'Enter') closeIntro();
});

/* 父页接口：goldminer-intro-close 强制关闭（父页兜底按钮 / 主动移除前调用） */
window.addEventListener('message', function(e){
  if(e.source !== window.parent) return;
  const d = e.data || {};
  if(d.type === 'goldminer-intro-close') closeIntro();
});

/* 页面被卸载（父页移除 iframe）时立即停掉动画循环 */
window.addEventListener('pagehide', function(){
  closed = true;
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
});

/* ================= 主循环 ================= */
function notifyReady(){
  if(window.parent && window.parent !== window){
    try{ window.parent.postMessage({type:'goldminer-intro-ready'}, '*'); }catch(err){}
  }
}

function frame(now){
  raf = requestAnimationFrame(frame);
  if(!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;
  if(dt < 0) dt = 0;
  clock += dt;

  stepChains(dt, clock);
  stepSparks(dt);

  for(let i = ripples.length - 1; i >= 0; i--){
    ripples[i].age += dt;
    if(ripples[i].age > 0.62) ripples.splice(i, 1);
  }

  draw(clock);

  if(!readySent){
    readySent = true;
    setTimeout(notifyReady, 60);
  }
}

window.addEventListener('resize', function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){ build(); last = 0; }, 160);
});
window.addEventListener('orientationchange', function(){
  clearTimeout(resizeT);
  resizeT = setTimeout(function(){ build(); last = 0; }, 260);
});

build();
raf = requestAnimationFrame(frame);
})();
</script>
