function buildCrowd(){
  const seed = (((SV.group && SV.group.seed) || 1) ^ (G.stage * 7919) ^ (G.round * 131)) >>> 0;
  const rng = mulberry32(seed);
  const skip = {};
  if(G.playerDef) skip[G.playerDef.id] = 1;
  if(G.stageDef) skip[G.stageDef.id] = 1;
  if(G.bossDef) skip[G.bossDef.id] = 1;
  const used = {};
  const base = (G.audience || []).filter(function(d){ used[d.id] = 1; return !skip[d.id]; });
  const rest = shuffle(POOL.filter(function(d){ return !skip[d.id] && !used[d.id]; }).slice(), rng);
  const total = SV.settings.lowPower ? 8 : 14;
  const defs = base.concat(rest).slice(0, total);
  const list = [];
  for(let i=0; i<defs.length; i++){
    const far = (i % 2 === 1);
    const t = (i + 0.5) / defs.length;
    list.push({
      def: defs[i],
      x: clamp(152 + t * (W - 304) + (rng() - 0.5) * 30, 146, 812),
      row: far ? 1 : 0,
      y: GROUND_Y - (far ? 56 : 12) + (rng() - 0.5) * 10,
      h: Math.round((far ? 62 : 92) * (0.86 + rng() * 0.28)),
      alpha: 1,
      face: rng() < 0.5 ? 1 : -1,
      ph: rng() * Math.PI * 2,
      wx: 0, wy: 0, mv: null,
      rest: 120 + Math.floor(rng() * 420),
      say: null, sayT: 0,
      next: 40 + Math.floor(rng() * 260)
    });
  }
  G.crowd = list;
}
function updateCrowd(){
  const list = G.crowd;
  if(!list || !list.length) return;
  const lines = CROWD_SAY[LANG] || CROWD_SAY.zh;
  const idleMin = SV.settings.lowPower ? 720 : 300;
  for(let i=0; i<list.length; i++){
    const c = list[i];
    // 偶尔走动：前后左右四向，移动一小段后长时间站着
    if(c.mv){
      c.mv.t--;
      c.wx = clamp(c.wx + c.mv.dx / c.mv.dur, -30, 30);
      c.wy = clamp(c.wy + c.mv.dy / c.mv.dur, -16, 16);
      if(c.mv.t <= 0){ c.mv = null; c.rest = idleMin + Math.floor(Math.random() * 420); }
    } else if(--c.rest <= 0){
      const dir = (Math.random() * 4) | 0;
      const step = 10 + Math.random() * 16;
      const dx = dir === 0 ? -step : (dir === 1 ? step : 0);
      const dy = dir === 2 ? -9 : (dir === 3 ? 9 : 0);
      const dur = 34 + Math.floor(Math.random() * 26);
      c.mv = { dx:dx, dy:dy, t:dur, dur:dur };
      if(dx) c.face = dx > 0 ? 1 : -1;
    }
    // 说话
    if(c.sayT > 0){
      c.sayT--;
      if(c.sayT <= 0) c.say = null;
      continue;
    }
    if(--c.next > 0) continue;
    c.next = 100 + Math.floor(Math.random() * 260);
    if(Math.random() < 0.45){
      c.say = lines[(Math.random() * lines.length) | 0];
      c.sayT = 80 + Math.floor(Math.random() * 40);
    }
  }
}
function crowdReact(n){
  const list = G.crowd;
  if(!list || !list.length) return;
  const lines = CROWD_SAY[LANG] || CROWD_SAY.zh;
  let tries = 0;
  while(n > 0 && tries < 40){
    tries++;
    const c = list[(Math.random() * list.length) | 0];
    if(c.sayT > 0) continue;
    c.say = lines[(Math.random() * lines.length) | 0];
    c.sayT = 70;
    n--;
  }
}
function drawCrowd(){
  const list = G.crowd;
  if(!list || !list.length) return;
  CTX.save();
  for(let row = 1; row >= 0; row--){
    for(let i=0; i<list.length; i++){
      const c = list[i];
      if(c.row !== row) continue;
      const e = ensureSprite(c.def);
      /* 后排（更远）才柔焦，前排保持清晰像素 */
      const far = c.row === 1;
      const src = far ? (e.soft || e.cv) : (e.dim || e.cv);
      if(!src) continue;
      const w = c.h * (src.width / src.height);
      const bob = Math.sin(G.bgT * (c.mv ? 0.14 : 0.03) + c.ph) * (c.mv ? 1.8 : 1.4);
      CTX.globalAlpha = c.alpha;
      CTX.imageSmoothingEnabled = far;
      CTX.save();
      CTX.translate(c.x + c.wx, c.y + c.wy + bob);
      CTX.scale(c.face, 1);
      CTX.drawImage(src, -w/2, -c.h, w, c.h);
      CTX.restore();
    }
  }
  // 台词气泡（不做压暗，只靠后排柔焦区分远近）
  CTX.imageSmoothingEnabled = false;
  for(let i=0; i<list.length; i++){
    if(list[i].say) drawBubble(list[i]);
  }
  CTX.restore();
}
function drawBubble(c){
  const a = Math.min(1, c.sayT / 16) * (c.row ? 0.62 : 0.9);
  const size = c.row ? 9 : 11;
  const px = c.x + (c.wx || 0), py = c.y + (c.wy || 0);
  CTX.save();
  CTX.globalAlpha = a;
  CTX.font = '900 ' + size + 'px "SF Mono",Consolas,monospace';
  const tw = CTX.measureText(c.say).width;
  const bw = Math.ceil(tw + 10), bh = size + 6;
  const x = px - bw/2, y = py - c.h - bh - 8;
  CTX.fillStyle = 'rgba(11,7,9,.86)';
  bubblePath(x, y, bw, bh, 3); CTX.fill();
  CTX.strokeStyle = 'rgba(246,201,143,.45)';
  CTX.lineWidth = 1;
  bubblePath(x + .5, y + .5, bw - 1, bh - 1, 3); CTX.stroke();
  CTX.beginPath();
  CTX.moveTo(px - 3, y + bh); CTX.lineTo(px + 3, y + bh); CTX.lineTo(px, y + bh + 4);
  CTX.closePath(); CTX.fill();
  CTX.fillStyle = PAL.cream;
  CTX.textAlign = 'center';
  CTX.fillText(c.say, px, y + bh - 3);
  CTX.restore();
}
function bubblePath(x, y, w, h, r){
  CTX.beginPath();
  CTX.moveTo(x + r, y);
  CTX.arcTo(x + w, y, x + w, y + h, r);
  CTX.arcTo(x + w, y + h, x, y + h, r);
  CTX.arcTo(x, y + h, x, y, r);
  CTX.arcTo(x, y, x + w, y, r);
  CTX.closePath();
}

/* ---------- 绘制：角色 ---------- */
function drawShadow(f){
  if(!f) return;
  const h = f.drawH;
  const w = Math.max(46, h*0.62);
  CTX.save();
  CTX.fillStyle = 'rgba(11,7,9,.5)';
  CTX.beginPath();
  CTX.ellipse(f.x, GROUND_Y+3, w*0.5, 9, 0, 0, Math.PI*2);
  CTX.fill();
  CTX.fillStyle = 'rgba(217,164,65,.10)';
  CTX.beginPath();
  CTX.ellipse(f.x, GROUND_Y+3, w*0.28, 5, 0, 0, Math.PI*2);
  CTX.fill();
  CTX.restore();
}

/* 攻击姿态：蓄力回拉 → 出招前冲 → 收招回弹 */
function attackPose(f){
  const a = f && f.attack;
  if(!a) return null;
  const sp = a.spec;
  const hf = sp.hitFrames[0] || 1;
  const last = sp.hitFrames[sp.hitFrames.length - 1] || 1;
  const end = Math.max(hf + 4, last + (sp.recovery || 12));
  const windEnd = Math.max(2, hf - 2);
  let wind = 0, thrust = 0;
  if(a.t <= windEnd){
    wind = a.t / windEnd;
  } else if(a.t <= hf + 2){
    wind = Math.max(0, 1 - (a.t - windEnd) / 2.4);
    thrust = 1;
  } else {
    const rt = clamp((a.t - (hf + 2)) / Math.max(4, end - (hf + 2)), 0, 1);
    thrust = Math.pow(1 - rt, 2.2);
  }
  return { wind, thrust, super:!!sp.super, heavy:a.type === 'heavy', melee:sp.kind === 'melee' };
}

function drawFighter(f){
  if(!f) return;
  const e = f.sprite || ensureSprite(f.def);
  const src = e.cv;
  if(!src) return;
  const h = f.drawH;
  const ar = src.width / src.height;
  const w = h*ar;
  const bob = (f.onGround && (f.state === 'idle')) ? Math.sin(f.bobT*1.8)*2 : 0;
  const pose = attackPose(f);

  /* Q弹：常驻挤压回弹 × 呼吸起伏 × 出招拉伸 */
  let sx = f.sqx, sy = f.sqy;
  if(f.state === 'idle'){
    const br = Math.sin(f.bobT*1.8);
    sx *= 1 - br*0.008; sy *= 1 + br*0.012;
  }
  let lean = 0, ext = 0;
  if(pose){
    const k = pose.super ? 1.7 : (pose.heavy ? 1.45 : 1);
    const body = pose.melee ? 1 : 0.5;
    lean = -0.06*pose.wind + 0.11*pose.thrust*k;
    ext = -7*pose.wind + 20*pose.thrust*k*body;
    sx *= 1 - 0.11*pose.wind + 0.16*pose.thrust*k*body;
    sy *= 1 + 0.13*pose.wind - 0.11*pose.thrust*k*body;
  }
  lean += f.tilt;

  if(f.isBoss){
    const gl = CTX.createRadialGradient(f.x, f.y-h*0.5, 6, f.x, f.y-h*0.5, h*0.85);
    gl.addColorStop(0, 'rgba(217,164,65,.22)');
    gl.addColorStop(.6, 'rgba(217,164,65,.07)');
    gl.addColorStop(1, 'rgba(217,164,65,0)');
    CTX.fillStyle = gl;
    CTX.beginPath(); CTX.arc(f.x, f.y-h*0.5, h*0.85, 0, Math.PI*2); CTX.fill();
    const rot = G.bgT*0.03;
    CTX.save();
    CTX.translate(f.x, f.y - 6);
    CTX.rotate(rot);
    CTX.strokeStyle = 'rgba(217,164,65,.35)';
    CTX.lineWidth = 2;
    CTX.beginPath(); CTX.ellipse(0, 0, w*0.72, 12, 0, 0, Math.PI*2); CTX.stroke();
    CTX.restore();
  }

  CTX.save();
  CTX.translate(f.x, f.y - 3 + bob);
  CTX.scale(f.facing, 1);
  CTX.translate(ext, 0);
  CTX.rotate(lean);
  CTX.scale(sx, sy);
  CTX.imageSmoothingEnabled = false;
  /* 厉害番茄超必杀前摇：蓝色居合蓄光 */
  if(pose && pose.super && pose.wind > 0.2 && f.def && f.def.hero){
    const gw = h*0.92;
    const gl = CTX.createRadialGradient(0, -h*0.5, 4, 0, -h*0.5, gw);
    gl.addColorStop(0, 'rgba(120,215,255,' + (0.34*pose.wind) + ')');
    gl.addColorStop(.55, 'rgba(64,160,255,' + (0.16*pose.wind) + ')');
    gl.addColorStop(1, 'rgba(64,160,255,0)');
    CTX.globalCompositeOperation = 'lighter';
    CTX.fillStyle = gl;
    CTX.beginPath(); CTX.arc(0, -h*0.5, gw, 0, Math.PI*2); CTX.fill();
    CTX.globalCompositeOperation = 'source-over';
  }
  if(f.state === 'ko'){
    CTX.rotate(0.85);
    CTX.globalAlpha = 0.9;
  }
  /* 重击残影：按体型放大拖影距离，避免宽体角色把拖影完全盖住 */
  if(pose && pose.thrust > 0.35 && pose.heavy && pose.melee && f.state !== 'ko'){
    CTX.globalAlpha = 0.34 * pose.thrust;
    CTX.drawImage(src, -w/2 - w*0.20*pose.thrust, -h, w, h);
    CTX.globalAlpha = 0.17 * pose.thrust;
    CTX.drawImage(src, -w/2 - w*0.40*pose.thrust, -h, w, h);
    CTX.globalAlpha = 0.08 * pose.thrust;
    CTX.drawImage(src, -w/2 - w*0.62*pose.thrust, -h, w, h);
    CTX.globalAlpha = 1;
    /* 速度线：宽体角色也能一眼看出冲刺 */
    CTX.save();
    CTX.fillStyle = PAL.gold;
    for(let i = 0; i < 3; i++){
      const len = w*(0.30 + i*0.14) * pose.thrust;
      CTX.globalAlpha = (0.52 - i*0.13) * pose.thrust;
      CTX.fillRect(-w/2 - len, -h*(0.26 + i*0.24), len, Math.max(2, h*0.022));
    }
    CTX.restore();
  }
  if(e.rim){
    /* 重击蓄力时描边亮起，给对手一个可读的前摇信号 */
    const hw = (pose && pose.heavy) ? pose.wind : 0;
    CTX.save();
    CTX.globalCompositeOperation = 'lighter';
    CTX.globalAlpha = (f.isBoss ? 0.34 : 0.22) + hw*0.6;
    CTX.drawImage(e.rim, -w/2 - 2, -h - 2, w, h);
    CTX.restore();
  }
  CTX.drawImage(src, -w/2, -h, w, h);
  if(f.flash > 0 && e.white){
    CTX.globalAlpha = Math.min(0.85, f.flash/9);
    CTX.drawImage(e.white, -w/2, -h, w, h);
  }
  if(f.state === 'block'){
    CTX.strokeStyle = 'rgba(246,201,143,.8)';
    CTX.lineWidth = 3;
    CTX.beginPath();
    CTX.arc(w*0.22, -h*0.5, h*0.42, -1.1, 1.1);
    CTX.stroke();
  }
  CTX.restore();

  /* 连击数字：命中瞬间 Q 弹放大 */
  if(f.combo >= 2 && f.comboT > 0 && f.state !== 'ko'){
    const hitAge = 110 - f.comboT;
    const pop = 1 + Math.max(0, 1 - hitAge/9) * 0.62;
    const cy = f.y - h - 54;
    CTX.save();
    CTX.globalAlpha = Math.min(1, f.comboT/22);
    CTX.translate(f.x, cy);
    CTX.scale(pop, pop);
    CTX.textAlign = 'center';
    CTX.font = '900 30px "SF Mono",Consolas,monospace';
    CTX.lineWidth = 7;
    CTX.strokeStyle = 'rgba(11,7,9,.92)';
    CTX.strokeText(String(f.combo), 0, 0);
    CTX.fillStyle = f.combo >= 5 ? PAL.tomato2 : PAL.hi;
    CTX.fillText(String(f.combo), 0, 0);
    CTX.font = '900 10px "SF Mono",Consolas,monospace';
    CTX.lineWidth = 4;
    CTX.strokeText(T('comboTag'), 0, 14);
    CTX.fillStyle = PAL.gold;
    CTX.fillText(T('comboTag'), 0, 14);
    CTX.restore();
  }

  if(f.guard < f.guardMax){
    const gw = Math.max(w, 44)*0.9;
    const gy = f.y - h - 14;
    CTX.fillStyle = 'rgba(11,7,9,.7)';
    CTX.fillRect(f.x-gw/2, gy, gw, 4);
    CTX.fillStyle = f.guard <= 0 ? PAL.tomato2 : 'rgba(246,201,143,.8)';
    CTX.fillRect(f.x-gw/2, gy, gw*(f.guard/f.guardMax), 4);
  }
  if(f.meter >= 100){
    CTX.fillStyle = PAL.gold;
    CTX.font = '900 10px "SF Mono",Consolas,monospace';
    CTX.textAlign = 'center';
    CTX.fillText(T('superReady'), f.x, f.y - h - 22 + Math.sin(G.bgT*0.2)*2);
  }
}

/* ---------- 绘制：投射物 / 特效 ---------- */
function drawShots(){
  for(const s of G.shots){
    if(s.tomato){
      CTX.save();
      CTX.translate(s.x, s.y);
      if(s.blue){
        /* 蓝焰番茄：蓝色火球 + 白芯 + 拖尾余焰 */
        CTX.globalCompositeOperation = 'lighter';
        const fl = 4 + Math.sin(G.bgT*0.6)*2;
        CTX.fillStyle = 'rgba(63,169,255,0.30)';
        CTX.beginPath(); CTX.arc(0, 0, s.r + fl + 5, 0, Math.PI*2); CTX.fill();
        CTX.fillStyle = '#2f7fff';
        CTX.beginPath(); CTX.arc(0, 0, s.r, 0, Math.PI*2); CTX.fill();
        CTX.fillStyle = '#7fe0ff';
        CTX.beginPath(); CTX.arc(-2, -2, s.r*0.62, 0, Math.PI*2); CTX.fill();
        CTX.fillStyle = '#eaf9ff';
        CTX.beginPath(); CTX.arc(-3, -3, s.r*0.30, 0, Math.PI*2); CTX.fill();
        /* 向后的火焰舌 */
        const dir = s.vx > 0 ? -1 : 1;
        for(let k=0;k<3;k++){
          const len = s.r*(1.4 + k*0.8);
          CTX.fillStyle = k ? 'rgba(63,169,255,0.50)' : 'rgba(180,235,255,0.68)';
          CTX.beginPath();
          CTX.moveTo(dir*s.r*0.6, -s.r*0.6);
          CTX.quadraticCurveTo(dir*(s.r*0.6+len*0.7), -s.r*0.1 + Math.sin(G.bgT*0.8+k)*4, dir*s.r*0.6, s.r*0.6);
          CTX.lineTo(dir*s.r*0.2, s.r*0.2);
          CTX.lineTo(dir*s.r*0.2, -s.r*0.2);
          CTX.closePath(); CTX.fill();
        }
      } else {
        CTX.rotate(G.bgT*0.25);
        CTX.fillStyle = PAL.tomato;
        CTX.beginPath(); CTX.arc(0, 0, s.r, 0, Math.PI*2); CTX.fill();
        CTX.fillStyle = PAL.tomato2;
        CTX.beginPath(); CTX.arc(-3, -3, s.r*0.45, 0, Math.PI*2); CTX.fill();
        CTX.fillStyle = '#4f7a3a';
        CTX.fillRect(-2, -s.r-2, 4, 5);
      }
      CTX.restore();
    } else {
      CTX.fillStyle = PAL.gold;
      CTX.beginPath(); CTX.arc(s.x, s.y, s.r, 0, Math.PI*2); CTX.fill();
      CTX.fillStyle = PAL.hi;
      CTX.beginPath(); CTX.arc(s.x-1, s.y-1, s.r*0.45, 0, Math.PI*2); CTX.fill();
    }
  }
}

/* 冲击星：命中瞬间的漫画式炸点 */
function drawBurst(b){
  const age = b.max - b.life;
  const grow = Math.min(1, age/2.2);
  const fade = clamp(b.life/b.max, 0, 1);
  const sc = 0.5 + grow*0.85 + (1 - fade)*0.55;
  const R = b.r * sc;
  const a = Math.pow(fade, 1.5);
  CTX.save();
  CTX.translate(b.x, b.y);
  CTX.rotate(b.rot);
  CTX.globalCompositeOperation = 'lighter';
  CTX.globalAlpha = a * 0.92;
  CTX.fillStyle = b.color;
  CTX.beginPath();
  const spikes = 9;
  for(let i=0; i<spikes*2; i++){
    const ang = (i/(spikes*2))*Math.PI*2;
    const rr = (i%2 === 0) ? R : R*0.42;
    const px = Math.cos(ang)*rr, py = Math.sin(ang)*rr;
    if(i === 0) CTX.moveTo(px, py); else CTX.lineTo(px, py);
  }
  CTX.closePath(); CTX.fill();
  CTX.globalAlpha = a;
  CTX.fillStyle = PAL.hi;
  CTX.beginPath(); CTX.arc(0, 0, R*0.3, 0, Math.PI*2); CTX.fill();
  CTX.globalAlpha = a * 0.75;
  CTX.strokeStyle = b.color;
  CTX.lineWidth = 2 + (1-fade)*2;
  CTX.beginPath();
  for(let i=0; i<7; i++){
    const ang = i*(Math.PI*2/7);
    const r0 = R*1.05, r1 = R*(1.4 + (1-fade)*0.9);
    CTX.moveTo(Math.cos(ang)*r0, Math.sin(ang)*r0);
    CTX.lineTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
  }
  CTX.stroke();
  CTX.restore();
}

function drawFx(){
  for(const d of G.dust){
    CTX.globalAlpha = (d.life/d.max)*0.5;
    CTX.fillStyle = d.color;
    CTX.fillRect(d.x, d.y, d.size, d.size);
  }
  CTX.globalAlpha = 1;
  for(const p of G.fxP){
    const a = p.life/p.max;
    CTX.globalAlpha = a;
    CTX.fillStyle = p.color;
    CTX.fillRect(p.x, p.y, p.size, p.size);
    CTX.globalAlpha = a*0.35;
    CTX.fillRect(p.x-p.size, p.y-p.size, p.size*3, p.size*3);
  }
  CTX.globalAlpha = 1;
  for(const r of G.rings){
    const a = r.life/r.max;
    CTX.globalAlpha = a*0.9;
    CTX.strokeStyle = r.color;
    CTX.lineWidth = 2 + a*4;
    CTX.beginPath(); CTX.arc(r.x, r.y, r.r, 0, Math.PI*2); CTX.stroke();
  }
  CTX.globalAlpha = 1;
  /* 斩击月牙：外圈蓝光 + 青白刀芯，叠加发光 */
  for(const s of G.slashes){
    const p = clamp(s.t/s.max, 0, 1);
    const a = p < 0.24 ? (p/0.24) : (1 - (p - 0.24)/0.76);
    const rad = s.r * (0.82 + p*0.5);
    const half = s.wide ? 1.5 : (s.big ? 1.38 : 1.05);
    CTX.save();
    CTX.translate(s.x, s.y);
    CTX.scale(s.dir, 1);
    CTX.rotate(s.big ? -0.34 : -0.16);
    CTX.globalCompositeOperation = 'lighter';
    CTX.lineCap = 'round';
    if(s.big){
      /* 大居合：填充成一把厚月牙刀身，而不是细圆环 */
      CTX.beginPath();
      CTX.arc(0, 0, rad, -half, half);
      CTX.arc(0, 0, rad*0.50, half, -half, true);
      CTX.closePath();
      CTX.fillStyle = 'rgba(64,160,255,' + (0.28*a) + ')';
      CTX.fill();
      CTX.strokeStyle = 'rgba(150,225,255,' + (0.60*a) + ')';
      CTX.lineWidth = 2;
      CTX.stroke();
    }
    CTX.strokeStyle = 'rgba(48,140,255,' + (0.55*a) + ')';
    CTX.lineWidth = (s.big ? 24 : 14) * (0.75 + 0.5*(1 - p));
    CTX.beginPath(); CTX.arc(0, 0, rad, -half, half); CTX.stroke();
    CTX.strokeStyle = 'rgba(140,220,255,' + (0.92*a) + ')';
    CTX.lineWidth = s.big ? 9 : 5;
    CTX.beginPath(); CTX.arc(0, 0, rad, -half*0.95, half*0.95); CTX.stroke();
    CTX.strokeStyle = 'rgba(244,253,255,' + (0.95*a) + ')';
    CTX.lineWidth = s.big ? 3 : 2;
    CTX.beginPath(); CTX.arc(0, 0, rad*0.985, -half*0.88, half*0.88); CTX.stroke();
    CTX.restore();
  }
  CTX.globalAlpha = 1;
  for(const b of G.bursts) drawBurst(b);
  CTX.globalAlpha = 1;
  for(const f of G.floats){
    const a = Math.min(1, f.life/22);
    CTX.globalAlpha = a;
    CTX.font = '900 ' + f.size + 'px "SF Mono",Consolas,monospace';
    CTX.textAlign = 'center';
    CTX.lineWidth = 4;
    CTX.strokeStyle = 'rgba(11,7,9,.9)';
    CTX.strokeText(f.text, f.x, f.y);
    CTX.fillStyle = f.color;
    CTX.fillText(f.text, f.x, f.y);
  }
  CTX.globalAlpha = 1;
}

/* ---------- 绘制：HUD ---------- */
function hpBar(x, y, w, h, pct, flip, color, ghostPct){
  pct = clamp(pct, 0, 1);
  ghostPct = clamp(ghostPct == null ? pct : ghostPct, 0, 1);
  CTX.fillStyle = 'rgba(11,7,9,.82)';
  CTX.fillRect(x-3, y-3, w+6, h+6);
  CTX.fillStyle = 'rgba(61,29,24,.9)';
  CTX.fillRect(x, y, w, h);
  /* 掉血残影：落后的那一段先留白光，再慢慢被吃掉 */
  if(ghostPct > pct + 0.001){
    const gw = w*ghostPct;
    const gx = flip ? x+w-gw : x;
    const gg = CTX.createLinearGradient(0, y, 0, y+h);
    gg.addColorStop(0, 'rgba(255,240,207,.95)');
    gg.addColorStop(1, 'rgba(255,160,120,.45)');
    CTX.fillStyle = gg;
    CTX.fillRect(gx, y, gw, h);
    CTX.fillStyle = 'rgba(255,255,255,.8)';
    CTX.fillRect(flip ? gx : gx+gw-2, y, 2, h);
  }
  const fw = Math.max(0, w*pct);
  const g = CTX.createLinearGradient(0, y, 0, y+h);
  g.addColorStop(0, color);
  g.addColorStop(.55, color);
  g.addColorStop(1, 'rgba(11,7,9,.55)');
  CTX.fillStyle = g;
  CTX.fillRect(flip ? x+w-fw : x, y, fw, h);
  CTX.fillStyle = 'rgba(255,240,207,.22)';
  CTX.fillRect(flip ? x+w-fw : x, y, fw, 2);
  CTX.strokeStyle = 'rgba(217,164,65,.55)';
  CTX.lineWidth = 1;
  CTX.strokeRect(x+.5, y+.5, w-1, h-1);
  CTX.fillStyle = 'rgba(0,0,0,.28)';
  for(let i=1; i<10; i++) CTX.fillRect(x + w*i/10, y, 1, h);
}

function drawHUD(){
  if(!G.player || !G.foe) return;
  const p = G.player, f = G.foe;   /* 玩家在右，对手在左 */
  const bw = 330, bh = 20, y = 26;

  hpBar(36, y, bw, bh, f.hp/f.maxHp, false, PAL.tomato2, f.hpShow/f.maxHp);
  hpBar(W-36-bw, y, bw, bh, p.hp/p.maxHp, true, PAL.cream, p.hpShow/p.maxHp);

  CTX.textAlign = 'left';
  CTX.font = '900 14px "SF Mono",Consolas,monospace';
  CTX.fillStyle = PAL.hi;
  const fName = defName(f.def), pName = defName(p.def);
  const fNameW = CTX.measureText(fName).width;
  CTX.fillText(fName, 36, y+bh+18);
  CTX.font = '900 11px "SF Mono",Consolas,monospace';
  CTX.fillStyle = f.isBoss ? PAL.gold : PAL.teal;
  CTX.fillText(f.isBoss ? T('bossTag') : T(ARCH[f.arch].label), 36 + fNameW + 8, y+bh+17);

  CTX.textAlign = 'right';
  CTX.font = '900 14px "SF Mono",Consolas,monospace';
  CTX.fillStyle = PAL.hi;
  const pNameW = CTX.measureText(pName).width;
  CTX.fillText(pName, W-36, y+bh+18);
  CTX.font = '900 11px "SF Mono",Consolas,monospace';
  CTX.fillStyle = PAL.gold;
  CTX.fillText(T(ARCH[p.arch].label), W-36-pNameW-8, y+bh+17);

  // 计时
  const secs = Math.ceil(Math.max(0, G.timer)/60);
  const low = secs <= 10;
  CTX.textAlign = 'center';
  CTX.font = '900 40px "SF Mono",Consolas,monospace';
  CTX.fillStyle = low ? PAL.tomato2 : PAL.hi;
  CTX.strokeStyle = 'rgba(11,7,9,.9)';
  CTX.lineWidth = 6;
  CTX.strokeText(String(secs).padStart(2,'0'), W/2, y+bh+16);
  CTX.fillText(String(secs).padStart(2,'0'), W/2, y+bh+16);

  CTX.font = '900 9px "SF Mono",Consolas,monospace';
  CTX.fillStyle = 'rgba(246,201,143,.7)';
  CTX.fillText('STAGE ' + G.stage + ' / 7', W/2, y+bh+30);

  // 回合点（左对手 / 右玩家）
  for(let i=0; i<2; i++){
    CTX.fillStyle = i < G.eWins ? PAL.tomato2 : 'rgba(246,201,143,.18)';
    CTX.beginPath(); CTX.arc(W/2 - 46 - i*14, y+8, 5, 0, Math.PI*2); CTX.fill();
    CTX.fillStyle = i < G.pWins ? PAL.gold : 'rgba(246,201,143,.18)';
    CTX.beginPath(); CTX.arc(W/2 + 46 + i*14, y+8, 5, 0, Math.PI*2); CTX.fill();
  }

  // 超必杀槽
  const mw = bw, my = y+bh+24;
  CTX.fillStyle = 'rgba(11,7,9,.75)';
  CTX.fillRect(36, my, mw, 6);
  CTX.fillRect(W-36-mw, my, mw, 6);
  CTX.fillStyle = f.meter >= 100 ? PAL.gold : 'rgba(237,91,53,.5)';
  CTX.fillRect(36, my, mw*(f.meter/100), 6);
  CTX.fillStyle = p.meter >= 100 ? PAL.gold : 'rgba(217,164,65,.55)';
  CTX.fillRect(W-36-mw*(p.meter/100), my, mw*(p.meter/100), 6);

  // 番茄（跟着玩家在右侧）
  const tc = p.tomatoes;
  for(let i=0; i<p.tomatoMax; i++){
    const tx = W-44 - i*16, ty = my+18;
    CTX.fillStyle = i < tc ? PAL.tomato : 'rgba(194,58,37,.22)';
    CTX.beginPath(); CTX.arc(tx, ty, 5, 0, Math.PI*2); CTX.fill();
  }

  CTX.textAlign = 'left';
  CTX.font = '900 11px "SF Mono",Consolas,monospace';
  CTX.fillStyle = PAL.gold;
  CTX.fillText(T('scoreLb') + ' ' + G.score, IMMERSIVE ? 118 : 36, H-18);
  if(G.continues > 0){

    CTX.fillText(T('continueLeft', { n:G.continues }), W - (padShift ? 190 : (IMMERSIVE ? 118 : 36)), H-18);
  }
}

function drawBanner(){
  const b = G.banner;
  const t = b.t;
  const dur = b.kind === 'result' ? 100 : (b.kind === 'super' ? 52 : 74);
  if(t > dur){ G.banner = null; return; }
  const inn = Math.min(1, t/9);
  const out = t > dur-16 ? 1 - (t-(dur-16))/16 : 1;
  const a = Math.max(0, Math.min(inn, out));
  const pop = 1 + (1-inn)*0.55;
  CTX.save();
  CTX.globalAlpha = a;
  CTX.translate(W/2, H*0.44);
  CTX.scale(pop, pop);
  CTX.textAlign = 'center';
  const col = b.kind === 'fight' ? PAL.hi : (b.kind === 'super' ? '#8fe4ff' : (b.kind === 'round' ? PAL.gold : PAL.cream));
  const fs = b.kind === 'super' ? 46 : 56;
  CTX.font = '900 ' + fs + 'px "SF Mono",Consolas,monospace';
  CTX.lineWidth = 10;
  CTX.strokeStyle = 'rgba(11,7,9,.92)';
  CTX.strokeText(b.text, 0, 0);
  CTX.fillStyle = col;
  CTX.fillText(b.text, 0, 0);
  if(b.sub){
    CTX.font = '900 20px "SF Mono",Consolas,monospace';
    CTX.lineWidth = 6;
    CTX.strokeText(b.sub, 0, 42);
    CTX.fillStyle = b.kind === 'super' ? '#4fc3ff' : PAL.tomato2;
    CTX.fillText(b.sub, 0, 42);
  }
  CTX.restore();
}

function render(){
  const ctx = CTX;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const sh = G.shake > 0.4 ? G.shake : 0;
  const sway = Math.sin(G.shakePh) * sh;
  const sx = G.shakeDX * sway, sy = G.shakeDY * sway;
  ctx.save();
  if(G.zoom > 0.0006){
    const z = 1 + G.zoom;
    ctx.translate(G.zoomAt.x, G.zoomAt.y);
    ctx.scale(z, z);
    ctx.translate(-G.zoomAt.x, -G.zoomAt.y);
  }
  ctx.translate(sx, sy);
  drawStage();
  if(G.player && G.foe && G.state !== 'title' && G.state !== 'select' && G.state !== 'clear'){
    drawShadow(G.foe);
    drawShadow(G.player);
    drawFighter(G.foe);
    drawFighter(G.player);
    drawShots();
    drawFx();
  } else {
    drawFx();
  }
  ctx.restore();
  if(G.player && G.foe && G.state !== 'title' && G.state !== 'select' && G.state !== 'clear') drawHUD();
  if(G.banner) drawBanner();
  drawVignette();
  if(G.flashBlue > 0){
    ctx.fillStyle = 'rgba(80,170,255,' + Math.min(0.42, G.flashBlue/18) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if(G.flashWhite > 0){
    ctx.fillStyle = 'rgba(255,240,207,' + Math.min(0.5, G.flashWhite/16) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if(G.debug) drawDebug();
}

function drawSpriteTo(cv, d){
  if(!cv || !d) return;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  const e = ensureSprite(d);
  const src = e.cv;
  if(!src) return;
  g.imageSmoothingEnabled = false;
  const s = Math.min(cv.width*0.86/src.width, cv.height*0.86/src.height);
  const w = src.width*s, h = src.height*s;
  g.drawImage(src, (cv.width-w)/2, (cv.height-h)/2, w, h);
}

/* 出战页的 HD-2D 立绘：拉取去掉 .th 的原图，平滑绘制并叠一层暖色柔光 */
const HDSPR = new Map();
function hdSprite(d){
  let h = HDSPR.get(d.id);
  if(h) return h;
  h = { img:new Image(), ok:false, w:0, h:0 };
  HDSPR.set(d.id, h);
  const url = (d.img || '').replace(/\.th\.(png|webp|gif|jpg)$/i, '.$1');
  if(!d.img || url === d.img){ h.fail = true; return h; }
  h.img.onload = function(){
    h.ok = true; h.w = h.img.naturalWidth || h.img.width; h.h = h.img.naturalHeight || h.img.height;
    paintCards();
  };
  h.img.onerror = function(){ h.fail = true; };
  h.img.src = url;
  return h;
}

function drawSpriteHD(cv, d){
  if(!cv || !d) return;
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  const e = ensureSprite(d);
  const hd = hdSprite(d);
  const src = (hd.ok && hd.img) || e.img || e.cv;
  if(!src) return;
  const fullW = hd.ok ? hd.w : (e.img ? e.imgW : e.cv.width);
  const fullH = hd.ok ? hd.h : (e.img ? e.imgH : e.cv.height);
  /* 只有还在用原图时才需要裁切，e.cv 已经裁好了 */
  const cr = (src !== e.cv) ? d.crop : null;
  const sx = cr ? Math.round(fullW*cr[0]) : 0;
  const sy = cr ? Math.round(fullH*cr[1]) : 0;
  const sw = cr ? Math.max(1, Math.round(fullW*(cr[2]-cr[0]))) : fullW;
  const sh = cr ? Math.max(1, Math.round(fullH*(cr[3]-cr[1]))) : fullH;
  const s = Math.min(cv.width*0.84/sw, cv.height*0.84/sh);
  const w = sw*s, h = sh*s;
  const cx = cv.width/2, cy = cv.height*0.52;
  const R = Math.max(w, h)*0.58;
  const gl = g.createRadialGradient(cx, cy, R*0.12, cx, cy, R);
  gl.addColorStop(0, 'rgba(246,201,143,.22)');
  gl.addColorStop(.55, 'rgba(217,164,65,.10)');
  gl.addColorStop(1, 'rgba(217,164,65,0)');
  g.fillStyle = gl;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI*2); g.fill();
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, sx, sy, sw, sh, cx - w/2, cy - h/2, w, h);
}

function act(type){
  if(G.paused || G.state !== 'fight' || !G.player || G.intro > 0) return;
  const p = G.player;
  if(p.state === 'ko') return;
  if(type === 'light' || type === 'heavy' || type === 'super' || type === 'tomato'){
    startAttack(p, type);
  } else if(type === 'jump'){
    doJump(p);
  } else if(type === 'dash'){
    doDash(p, p.facing);
  } else if(type === 'block'){
    INPUT.down = true;
  }
}
function handleHold(){
  const p = G.player;
  if(!p || G.state !== 'fight' || G.paused) return;
  if(INPUT.down && p.onGround && p.state !== 'block' && !p.attack && p.stun <= 0 && p.state !== 'ko'){
    startBlock(p, 999);
  }
  if(!INPUT.down && p.state === 'block') p.state = 'idle';
}

function bindUI(){
  $('btnStart').addEventListener('click', function(){ ensureAudio(); SFX.start(); startRun(); });
  $('btnHelp').addEventListener('click', openHelp);
  $('btnHelpTop').addEventListener('click', openHelp);
  $('btnHelpClose').addEventListener('click', closeHelp);
  $('btnAch').addEventListener('click', function(){ openOverlay('scrAch'); renderAch(); SFX.click(); });
  $('btnAchTop').addEventListener('click', function(){ openOverlay('scrAch'); renderAch(); SFX.click(); });
  $('btnAchClose').addEventListener('click', function(){ closeOverlay('scrAch'); SFX.back(); });
  $('btnMute').addEventListener('click', toggleMute);
  $('btnLow').addEventListener('click', toggleLow);
  $('btnPad').addEventListener('click', togglePad);
  $('btnPMute').addEventListener('click', toggleMute);
  $('btnPLow').addEventListener('click', toggleLow);
  $('btnPPad').addEventListener('click', togglePad);
  $('btnSelBack').addEventListener('click', function(){
    G.state = 'title'; showScreen('title'); renderTitle(); SFX.back();
  });
  $('btnFight').addEventListener('click', function(){ selectFighter(G.previewId); });
  $('btnContinue').addEventListener('click', function(){ continueRun(); });
  $('btnChange').addEventListener('click', function(){ changeAfterLoss(); });
  $('btnGiveUp').addEventListener('click', function(){ SFX.back(); giveUp(); });
  $('btnNextGroup').addEventListener('click', function(){ SFX.click(); nextGroup(); });
  $('btnResume').addEventListener('click', function(){ togglePause(false); });
  $('btnQuit').addEventListener('click', function(){ G.paused = false; giveUp(); });
  $('btnPauseTop').addEventListener('click', function(){ togglePause(true); });

  document.addEventListener('keydown', function(e){
    const k = e.key.toLowerCase();
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].indexOf(k) >= 0) e.preventDefault();
    if(e.repeat) return;
    if(G.state === 'pause') { return; }
    if(k === 'escape'){
      if($('scrAch').classList.contains('on')){ closeOverlay('scrAch'); return; }
      if($('scrHelp').classList.contains('on')){ closeHelp(); return; }
      if(G.paused) togglePause(false); else togglePause(true);
      return;
    }
    if(G.state === 'vs'){ INPUT.confirm = true; return; }
    if(G.state === 'select'){ if(k === 'enter') selectFighter(G.previewId); return; }
    if(G.state === 'buff' || G.state === 'end' || G.state === 'clear' || G.state === 'title') return;
    if(G.paused) return;
    ensureAudio();
    if(k === 'a' || k === 'arrowleft') INPUT.left = true;
    else if(k === 'd' || k === 'arrowright') INPUT.right = true;
    else if(k === 'w' || k === 'arrowup' || k === ' ') act('jump');
    else if(k === 's' || k === 'arrowdown') act('block');
    else if(k === 'shift') act('dash');
    else if(k === 'j') act('light');
    else if(k === 'k') act('heavy');
    else if(k === 'l') act('tomato');
    else if(k === 'enter') act('super');
  });
  document.addEventListener('keyup', function(e){
    const k = e.key.toLowerCase();
    if(k === 'a' || k === 'arrowleft') INPUT.left = false;
    else if(k === 'd' || k === 'arrowright') INPUT.right = false;
    else if(k === 's' || k === 'arrowdown') INPUT.down = false;
  });

  document.querySelectorAll('#pad .pbtn').forEach(function(btn){
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      btn.classList.add('act');
      ensureAudio();
      act(btn.dataset.act);
      if(btn.dataset.act === 'block'){
        btn.addEventListener('pointerup', release, { once:true });
        btn.addEventListener('pointercancel', release, { once:true });
      }
      function release(){ btn.classList.remove('act'); if(btn.dataset.act === 'block') INPUT.down = false; }
    });
    btn.addEventListener('pointerup', function(){ btn.classList.remove('act'); });
    btn.addEventListener('pointercancel', function(){ btn.classList.remove('act'); });
  });

  bindStick();
  window.addEventListener('resize', fit);
  document.addEventListener('visibilitychange', function(){
    if(document.hidden && (G.state === 'fight' || G.state === 'roundEnd') && !G.paused) togglePause(true);
  });
}

function bindStick(){
  const stick = $('stick'), knob = $('knob');
  if(!stick) return;
  let pid = null, ox = 0, oy = 0, lastTap = 0, lastDir = 0;
  function setKnob(dx, dy){
    const max = 34;
    const d = Math.sqrt(dx*dx + dy*dy);
    if(d > max){ dx = dx/d*max; dy = dy/d*max; }
    knob.style.transform = 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px))';
  }
  function reset(){
    pid = null; INPUT.touchAxis = 0; INPUT.down = false;
    setKnob(0, 0);
  }
  stick.addEventListener('pointerdown', function(e){
    e.preventDefault();
    pid = e.pointerId;
    try{ stick.setPointerCapture(pid); }catch(err){}
    const r = stick.getBoundingClientRect();
    ox = r.left + r.width/2; oy = r.top + r.height/2;
    const dx = e.clientX - ox, dy = e.clientY - oy;
    setKnob(dx, dy);
    INPUT.touchAxis = clamp(dx/42, -1, 1);
    if(dy < -26) act('jump');
    else if(dy > 26) act('block');
    if(Math.abs(dx) > 26){
      const dir = dx > 0 ? 1 : -1;
      const now = nowMs();
      if(now - lastTap < 260 && dir === lastDir) act('dash');
      lastTap = now; lastDir = dir;
    }
  });
  stick.addEventListener('pointermove', function(e){
    if(pid !== e.pointerId) return;
    e.preventDefault();
    const dx = e.clientX - ox, dy = e.clientY - oy;
    setKnob(dx, dy);
    INPUT.touchAxis = clamp(dx/42, -1, 1);
    if(dy > 26 && !INPUT.down) act('block');
    if(dy < -26) INPUT.down = false;
  });
  stick.addEventListener('pointerup', reset);
  stick.addEventListener('pointercancel', reset);
  stick.addEventListener('pointerleave', function(e){ if(pid === e.pointerId && e.buttons === 0) reset(); });
}

/* ================= 自适应 ================= */
let IMMERSIVE = false;
function fit(){
  const frame = $('frame');
  if(!frame) return;
  const vw = window.innerWidth, vh = window.innerHeight;
  const touch = padMode() === 'touch';
  /* 手机横屏：不再给技能键预留高度，画面按整屏铺满，按键浮在画面之上 */
  IMMERSIVE = touch && vw > vh && vh <= 620;
  document.body.classList.toggle('immersive', IMMERSIVE);
  const mobile = vw < 860;
  const reservedH = IMMERSIVE ? 0 : (34 + (touch ? 152 : 30) + 26);
  const availW = Math.max(200, vw - (IMMERSIVE ? 0 : (mobile ? 12 : 28)));
  let safeY = 0;
  if(IMMERSIVE){
    const cs = getComputedStyle(document.documentElement);
    safeY = (parseFloat(cs.getPropertyValue('--safe-t')) || 0) + (parseFloat(cs.getPropertyValue('--safe-b')) || 0);
  }
  const availH = Math.max(160, vh - reservedH - safeY);
  let s = Math.min(availW/960, availH/540);
  s = clamp(s, 0.3, 1.6);
  frame.style.width = Math.round(960*s) + 'px';
  frame.style.height = Math.round(540*s) + 'px';
  /* 手机横屏的画面比例会拉高 UI 尺寸，界面层单独限一个上限，避免面板撑出屏幕 */
  const u = IMMERSIVE ? Math.min(s, 0.58) : s;
  document.documentElement.style.setProperty('--u', u.toFixed(3));
  updatePad();
}

function padMode(){
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  const touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  return (coarse || (touch && window.innerWidth < 860)) ? 'touch' : 'desk';
}

function updatePad(){
  const pad = $('pad');
  if(!pad) return;
  const mode = padMode();
  pad.classList.toggle('desk', mode === 'desk');
  const on = (mode === 'touch') ? true : (!!SV.settings.pad && G.state === 'fight' && !G.paused);
  pad.classList.toggle('on', on);
  placePad();
}

function placePad(){
  const pad = $('pad'), frame = $('frame');
  if(!pad || !frame) return;
  if(!pad.classList.contains('desk')){
    pad.style.right = ''; pad.style.bottom = '';
    return;
  }
  const r = frame.getBoundingClientRect();
  pad.style.right = Math.max(4, Math.round(window.innerWidth - r.right + 8)) + 'px';
  pad.style.bottom = Math.max(4, Math.round(window.innerHeight - r.bottom + 8)) + 'px';
}

function updatePadState(){
  const p = G.player;
  const sup = $('padSuper');
  if(sup) sup.classList.toggle('ready', !!(p && p.meter >= 100 && G.state === 'fight'));
}

/* ================= 主循环 ================= */
let lastTs = 0, acc = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastTs) lastTs = ts;
  let dt = ts - lastTs;
  lastTs = ts;
  if(dt > 200) dt = 200;
  if(!dt) dt = 16.7;
  G.fps = Math.round(1000/dt);
  if(document.hidden) return;
  acc += dt;
  const step = 1000/60;
  let guard = 0;
  while(acc >= step && guard < 5){
    acc -= step; guard++;
    if(!G.paused){
      handleHold();
      updateWorld();
      INPUT.confirm = false;
    }
  }
  if(acc > step*5) acc = 0;
  render();
  updatePadState();
}

function init(){
  if(location.hash.indexOf('debug') >= 0) G.debug = true;
  ensureGroup();
  preloadDefs(groupDefs().concat(HEROES));
  applyStaticText();
  renderSelect();
  showScreen('title');
  syncAudioSettings();
  bindUI();
  fit();
  if(G.debug) $('dbg').style.display = 'block';
  requestAnimationFrame(loop);
}

init();
</script>
