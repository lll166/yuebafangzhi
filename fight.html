<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0709">
<title>巴巴博弈 · 像素街机格斗</title>
<style>
  :root{
    --ink:#0b0709; --brown:#1a1013; --darkred:#3d1d18; --brick:#7a2a1f;
    --tomato:#c23a25; --tomato2:#ed5b35; --cream:#f6c98f; --hi:#fff0cf;
    --brass:#8a6a3b; --gold:#d9a441; --warm:#5a5a52; --cold:#2f3b34; --teal:#7fb0a0;
    --u:1; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--hi);}
  body{font-family:"SF Mono","Cascadia Mono",Consolas,"Courier New",system-ui,"PingFang SC","Microsoft YaHei",monospace;
    touch-action:none;overscroll-behavior:none;}
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 82% at 50% 8%,transparent 40%,rgba(0,0,0,.66) 100%);}
  #stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    padding:calc(6px + env(safe-area-inset-top)) 8px calc(6px + var(--safe-b));}
  #wrap{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:1180px;}

  /* ---------- 顶部菜单栏 · HD-2D 像素 ---------- */
  #topbar{position:relative;width:100%;height:34px;flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 5px;
    border:2px solid #6b4a28;
    background:
      repeating-linear-gradient(90deg,rgba(246,201,143,.05) 0 2px,transparent 2px 4px),
      repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,#211518 0%,#150e10 55%,#0d080a 100%);
    box-shadow:
      inset 0 0 0 1px #0b0709,
      inset 0 2px 0 rgba(246,201,143,.14),
      inset 0 -2px 0 rgba(0,0,0,.6),
      2px 2px 0 #120b0d,
      4px 4px 0 rgba(0,0,0,.35),
      0 8px 20px rgba(0,0,0,.5);}
  #topbar::before{content:'';position:absolute;inset:2px;pointer-events:none;opacity:.65;
    background:
      linear-gradient(var(--gold),var(--gold)) left top/4px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left top/1px 4px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top/4px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top/1px 4px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left bottom/4px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left bottom/1px 4px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom/4px 1px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom/1px 4px no-repeat;}
  .brand{position:relative;display:flex;align-items:center;font-size:13px;font-weight:900;letter-spacing:3px;white-space:nowrap;color:var(--cream);
    text-shadow:2px 2px 0 #0b0709,3px 3px 0 rgba(61,29,24,.85);}
  .brand::before{content:'';display:inline-block;width:9px;height:12px;margin:0 6px 0 3px;vertical-align:-1px;
    background:
      linear-gradient(var(--gold),var(--gold)) 3px 0/3px 3px no-repeat,
      linear-gradient(#c23a25,#c23a25) 0 3px/3px 3px no-repeat,
      linear-gradient(var(--tomato2),var(--tomato2)) 3px 3px/3px 3px no-repeat,
      linear-gradient(#8f2a1c,#8f2a1c) 6px 3px/3px 3px no-repeat,
      linear-gradient(#c23a25,#c23a25) 0 6px/3px 3px no-repeat,
      linear-gradient(var(--cream),var(--cream)) 3px 6px/3px 3px no-repeat,
      linear-gradient(var(--tomato2),var(--tomato2)) 6px 6px/3px 3px no-repeat,
      linear-gradient(var(--brick),var(--brick)) 3px 9px/3px 3px no-repeat;}
  .brand span{color:var(--tomato2);text-shadow:2px 2px 0 #6e1c12,3px 3px 0 #0b0709;}
  .topstats{display:flex;gap:4px;margin-left:auto;}
  .tstat{position:relative;display:flex;align-items:baseline;gap:4px;padding:2px 7px 2px 8px;
    border:2px solid #4a3320;background:#0f0a0c;
    box-shadow:inset 0 0 0 1px #0b0709,inset 0 2px 0 rgba(246,201,143,.08),2px 2px 0 #0b0709;}
  .tstat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);
    box-shadow:0 0 6px rgba(217,164,65,.5);}
  .tstat span{font-size:8px;font-weight:800;letter-spacing:1px;color:#a08d6b;}
  .tstat b{font-size:13px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;
    text-shadow:1px 1px 0 #0b0709,2px 2px 0 rgba(0,0,0,.55);}
  .icobtn{position:relative;width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-family:inherit;font-size:12px;font-weight:900;line-height:1;color:var(--cream);cursor:pointer;
    border:2px solid #6b4a28;background:#1a1013;
    box-shadow:inset 2px 2px 0 rgba(246,201,143,.16),inset -2px -2px 0 rgba(0,0,0,.6),2px 2px 0 #0b0709;}
  .icobtn:hover{border-color:var(--gold);background:#241619;color:var(--gold);}
  .icobtn:active{transform:translate(2px,2px);box-shadow:inset 2px 2px 0 rgba(0,0,0,.55);}

  /* ---------- 街机框 ---------- */
  #frame{position:relative;flex:0 0 auto;width:960px;height:540px;overflow:hidden;background:#0b0709;
    border:2px solid #6b4a28;border-radius:4px;
    box-shadow:0 0 0 1px #2a1a0e,0 0 34px rgba(237,91,53,.12),0 18px 50px rgba(0,0,0,.7),inset 0 0 60px rgba(0,0,0,.5);}
  #cv{display:block;width:100%;height:100%;background:#0b0709;}
  #frame .scan{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:.16;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px);}
  body.noscan #frame .scan{display:none;}
  #frame .glow{position:absolute;inset:0;z-index:6;pointer-events:none;mix-blend-mode:screen;opacity:.16;
    background:radial-gradient(60% 46% at 50% 34%,rgba(246,201,143,.35),transparent 70%);}
  #frame .corner{position:absolute;inset:5px;z-index:7;pointer-events:none;opacity:.6;
    background:
      linear-gradient(var(--gold),var(--gold)) left top/14px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left top/2px 14px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top/14px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top/2px 14px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left bottom/14px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left bottom/2px 14px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom/14px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom/2px 14px no-repeat;}

  /* ---------- 界面层 ---------- */
  #ui{position:absolute;inset:0;z-index:10;pointer-events:none;}
  .scr{position:absolute;inset:0;z-index:11;display:none;align-items:center;justify-content:center;
    padding:calc(var(--u)*18px);pointer-events:auto;overflow-y:auto;overscroll-behavior:contain;}
  .scr.on{display:flex;}
  .scr > *{margin:auto;}   /* 内容超高时从顶部开始滚动，而不是上下同时被裁掉 */
  .scr.dim{background:radial-gradient(90% 72% at 50% 42%,rgba(26,16,19,.72),rgba(11,7,9,.92));
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
  .panel{position:relative;width:min(100%,calc(var(--u)*620px));padding:calc(var(--u)*18px) calc(var(--u)*18px) calc(var(--u)*14px);
    background:linear-gradient(180deg,rgba(26,16,19,.96),rgba(11,7,9,.98));
    border:2px solid #6b4a28;border-radius:3px;
    box-shadow:0 18px 50px rgba(0,0,0,.7),inset 0 0 40px rgba(217,164,65,.05);}
  .panel.wide{width:min(100%,calc(var(--u)*760px));}
  .panel::before{content:'';position:absolute;inset:5px;pointer-events:none;opacity:.5;
    background:
      linear-gradient(var(--gold),var(--gold)) left top/11px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left top/2px 11px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top/11px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right top/2px 11px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left bottom/11px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) left bottom/2px 11px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom/11px 2px no-repeat,
      linear-gradient(var(--gold),var(--gold)) right bottom/2px 11px no-repeat;}
  .center{text-align:center;}

  /* ---------- 标题 ---------- */
  #scrTitle{align-items:center;justify-content:center;
    background:radial-gradient(70% 60% at 50% 48%,rgba(11,7,9,.32),rgba(11,7,9,.82));}
  .titleWrap{width:min(100%,calc(var(--u)*560px));text-align:center;padding:calc(var(--u)*8px);}
  .kicker{font-size:max(8px,calc(var(--u)*10px));font-weight:900;letter-spacing:calc(var(--u)*4px);color:var(--brass);}
  .logo{margin:calc(var(--u)*6px) 0 calc(var(--u)*2px);font-size:max(34px,calc(var(--u)*68px));line-height:1;
    font-weight:900;letter-spacing:calc(var(--u)*6px);color:var(--hi);
    text-shadow:0 calc(var(--u)*4px) 0 #7a2a1f,0 0 calc(var(--u)*30px) rgba(237,91,53,.55),0 0 calc(var(--u)*70px) rgba(237,91,53,.25);}
  .logo em{font-style:normal;color:var(--tomato2);}
  .tomatoline{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*10px);
    font-size:max(9px,calc(var(--u)*13px));letter-spacing:calc(var(--u)*2px);color:var(--cream);}
  .tomatoline .dot{width:5px;height:5px;background:var(--tomato2);box-shadow:0 0 8px var(--tomato2);}
  .gpill{display:inline-flex;align-items:center;gap:calc(var(--u)*8px);margin:calc(var(--u)*14px) 0 calc(var(--u)*12px);
    padding:calc(var(--u)*5px) calc(var(--u)*12px);border:1px solid rgba(217,164,65,.45);
    background:rgba(26,16,19,.75);font-size:max(9px,calc(var(--u)*12px));font-weight:800;letter-spacing:calc(var(--u)*1px);color:var(--cream);}
  .gpill i{width:1px;height:10px;background:rgba(217,164,65,.4);}
  .trow{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*6px);flex-wrap:wrap;margin-top:calc(var(--u)*9px);}

  /* ---------- 按钮 ---------- */
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:max(32px,calc(var(--u)*36px));padding:0 calc(var(--u)*16px);
    font-family:inherit;font-size:max(10px,calc(var(--u)*13px));font-weight:900;letter-spacing:calc(var(--u)*1.5px);
    color:var(--cream);cursor:pointer;border:2px solid #6b4a28;border-radius:2px;
    background:linear-gradient(180deg,rgba(45,28,24,.98),rgba(26,16,19,.98));
    box-shadow:0 3px 0 #2a1a0e,0 6px 14px rgba(0,0,0,.45);}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2a1a0e,0 3px 8px rgba(0,0,0,.5);}
  .btn.primary{background:linear-gradient(180deg,var(--tomato2),var(--tomato));border-color:#ffd0a8;
    color:#1a0906;text-shadow:none;box-shadow:0 3px 0 #6e1c12,0 8px 22px rgba(237,91,53,.35);}
  .btn.gold{background:linear-gradient(180deg,#f0c063,#c08a2e);border-color:#ffe2a0;color:#241505;
    box-shadow:0 3px 0 #6b4a18,0 8px 22px rgba(217,164,65,.3);}
  .btn.ghost{background:rgba(11,7,9,.6);border-color:rgba(138,106,59,.55);color:var(--cream);font-weight:800;
    box-shadow:none;min-height:max(28px,calc(var(--u)*30px));}
  .btn.ghost.on{border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.12);}
  .btn.sm{min-height:28px;padding:0 10px;font-size:10px;letter-spacing:1px;}
  .btn.big{width:100%;min-height:max(42px,calc(var(--u)*52px));font-size:max(13px,calc(var(--u)*19px));letter-spacing:calc(var(--u)*4px);}
  .tiny{font-size:max(8px,calc(var(--u)*10px));color:#a08d6b;letter-spacing:1px;line-height:1.6;margin-top:calc(var(--u)*8px);}

  /* ---------- 选角 ---------- */
  #scrSelect{background:radial-gradient(80% 70% at 50% 46%,rgba(26,16,19,.86),rgba(11,7,9,.96));}
  .selWrap{width:min(100%,calc(var(--u)*820px));display:flex;flex-direction:column;gap:calc(var(--u)*8px);}
  .selHead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;}
  .selHead h2{font-size:max(16px,calc(var(--u)*26px));letter-spacing:calc(var(--u)*2px);color:var(--hi);margin-top:calc(var(--u)*3px);}
  .selGrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:calc(var(--u)*6px);}
  .card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:calc(var(--u)*5px) 2px calc(var(--u)*4px);
    border:2px solid rgba(138,106,59,.45);border-radius:2px;cursor:pointer;
    background:linear-gradient(180deg,rgba(26,16,19,.94),rgba(11,7,9,.97));transition:transform .1s,border-color .1s,box-shadow .1s;}
  .card:hover{border-color:rgba(217,164,65,.8);}
  .card.on{border-color:var(--tomato2);box-shadow:0 0 0 2px rgba(237,91,53,.35),0 0 18px rgba(237,91,53,.35);transform:translateY(calc(var(--u)*-2px));}
  .card canvas{width:100%;max-width:96px;height:auto;aspect-ratio:1/1;display:block;image-rendering:pixelated;}
  .card .cn{font-size:max(8px,calc(var(--u)*10px));font-weight:800;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .card .ca{font-size:max(7px,calc(var(--u)*8px));letter-spacing:1px;color:#a08d6b;}
  .card .fix{position:absolute;top:2px;right:2px;font-size:7px;font-weight:900;color:#1a0906;background:var(--gold);padding:1px 3px;letter-spacing:0;}
  .connect{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(11,7,9,.55);font-size:9px;color:var(--cream);}
  .selFoot{display:flex;align-items:stretch;gap:calc(var(--u)*8px);}
  .detail{flex:1;min-width:0;display:flex;align-items:center;gap:calc(var(--u)*8px);
    padding:calc(var(--u)*6px);border:1px solid rgba(138,106,59,.4);background:rgba(11,7,9,.62);}
  .detail canvas{width:clamp(48px,calc(var(--u)*64px),88px);height:auto;aspect-ratio:1/1;flex:0 0 auto;image-rendering:pixelated;}
  .dinfo{min-width:0;flex:1;}
  .dname{font-size:max(11px,calc(var(--u)*15px));font-weight:900;color:var(--hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .darch{font-size:max(8px,calc(var(--u)*9px));letter-spacing:1px;color:var(--gold);margin:1px 0 3px;}
  .bars{display:flex;flex-direction:column;gap:2px;}
  .bar{display:flex;align-items:center;gap:4px;font-size:max(7px,calc(var(--u)*8px));color:#a08d6b;}
  .bar i{flex:1;height:5px;background:rgba(90,90,82,.35);position:relative;overflow:hidden;}
  .bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--tomato2);}
  .bar.sp i b{background:var(--teal);}
  .bar.po i b{background:var(--gold);}
  .sig{font-size:max(7px,calc(var(--u)*8px));color:var(--cream);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #btnFight{flex:0 0 auto;min-width:calc(var(--u)*120px);}

  /* ---------- VS ---------- */
  #scrVs{background:radial-gradient(70% 60% at 50% 50%,rgba(61,29,24,.5),rgba(11,7,9,.95));}
  .vsWrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*10px);position:relative;}
  .vsSide{width:34%;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4px);}
  .vsSide canvas{width:calc(var(--u)*185px);max-width:100%;height:auto;aspect-ratio:1/1;image-rendering:auto;
    filter:drop-shadow(0 calc(var(--u)*6px) calc(var(--u)*12px) rgba(0,0,0,.5));}
  .vsSide .vn{font-size:max(11px,calc(var(--u)*16px));font-weight:900;color:var(--hi);text-align:center;}
  .vsSide .va{font-size:max(8px,calc(var(--u)*9px));letter-spacing:1px;color:var(--gold);}
  .vsMid{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4px);}
  .vsWord{font-size:max(30px,calc(var(--u)*64px));font-weight:900;letter-spacing:2px;color:var(--tomato2);
    text-shadow:0 0 calc(var(--u)*24px) rgba(237,91,53,.7),0 4px 0 #6e1c12;animation:vsPulse .6s steps(2,end) infinite;}
  @keyframes vsPulse{50%{transform:scale(1.06)}}
  .vsStage{font-size:max(9px,calc(var(--u)*12px));letter-spacing:calc(var(--u)*2px);color:var(--cream);text-align:center;}
  .vsL{animation:vsInL .5s cubic-bezier(.2,.9,.3,1.2) both;}
  .vsR{animation:vsInR .5s cubic-bezier(.2,.9,.3,1.2) both;}
  @keyframes vsInL{from{transform:translateX(-60px);opacity:0}to{transform:none;opacity:1}}
  @keyframes vsInR{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}

  /* ---------- 增益 ---------- */
  #scrBuff{background:radial-gradient(80% 70% at 50% 46%,rgba(26,16,19,.9),rgba(11,7,9,.97));}
  .buffRow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*8px);margin-top:calc(var(--u)*10px);}
  .buffCard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:calc(var(--u)*12px) calc(var(--u)*8px);
    border:2px solid rgba(138,106,59,.45);background:linear-gradient(180deg,rgba(26,16,19,.95),rgba(11,7,9,.98));
    cursor:pointer;transition:transform .1s,border-color .1s;}
  .buffCard:hover{border-color:var(--gold);transform:translateY(-2px);}
  .buffIcon{font-size:max(18px,calc(var(--u)*28px));line-height:1;}
  .buffName{font-size:max(10px,calc(var(--u)*13px));font-weight:900;color:var(--cream);letter-spacing:1px;}
  .buffDesc{font-size:max(8px,calc(var(--u)*9px));color:#a08d6b;line-height:1.45;text-align:center;}
  .buffPicked{font-size:9px;color:var(--teal);margin-top:4px;}

  /* ---------- 结算 / 通关 ---------- */
  .endStats{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*16px);margin:calc(var(--u)*10px) 0;}
  .endStats div{display:flex;flex-direction:column;gap:1px;}
  .endStats span{font-size:max(7px,calc(var(--u)*8px));letter-spacing:1px;color:#a08d6b;}
  .endStats b{font-size:max(15px,calc(var(--u)*22px));color:var(--gold);font-variant-numeric:tabular-nums;}
  .nextRow{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*6px);margin:calc(var(--u)*10px) 0;}
  .nextRow canvas{width:calc(var(--u)*54px);height:calc(var(--u)*54px);image-rendering:pixelated;filter:brightness(.25) contrast(1.2);}

  /* ---------- 成就 ---------- */
  #scrAch{background:rgba(11,7,9,.84);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);}
  .achWrap{width:min(100%,calc(var(--u)*560px));max-height:calc(100% - 10px);display:flex;flex-direction:column;
    background:linear-gradient(180deg,rgba(26,16,19,.98),rgba(11,7,9,.99));border:2px solid #6b4a28;border-radius:3px;}
  .achHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:calc(var(--u)*10px) calc(var(--u)*12px) calc(var(--u)*8px);border-bottom:1px solid rgba(138,106,59,.3);}
  .achHead h2{font-size:max(13px,calc(var(--u)*18px));letter-spacing:2px;color:var(--hi);margin-top:3px;}
  .achHead b{font-size:max(9px,calc(var(--u)*10px));color:var(--gold);margin-left:6px;letter-spacing:1px;}
  .achList{overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--u)*8px) calc(var(--u)*12px) calc(var(--u)*12px);
    display:flex;flex-direction:column;gap:4px;}
  .achItem{display:flex;align-items:center;gap:calc(var(--u)*8px);padding:calc(var(--u)*6px) calc(var(--u)*7px);
    border:1px solid rgba(138,106,59,.22);background:rgba(11,7,9,.5);}
  .achItem .ai{width:calc(var(--u)*26px);height:calc(var(--u)*26px);flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--u)*14px);border:1px solid rgba(138,106,59,.35);background:rgba(26,16,19,.8);filter:grayscale(1) opacity(.45);}

const SPR = new Map();
let artTotal = 0, artDone = 0;
function makeCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
/* 低分辨率缩略 + 平滑放大 ⇒ 柔焦，只用于后排（更远）的观众 */
function makeSoft(src, w, h){
  const k = 0.22;
  const sw = Math.max(6, Math.round(w*k)), sh = Math.max(6, Math.round(h*k));
  const c = makeCanvas(sw, sh), g = c.getContext('2d');
  g.imageSmoothingEnabled = true;
  g.drawImage(src, 0, 0, sw, sh);
  return c;
}
/* 观众专用：整体略微压暗（约 30%），保持原色相 */
const CROWD_DIM = 'rgba(24,14,12,.30)';
function shadeCopy(src, color){
  const c = makeCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  return c;
}
function ensureSprite(def){
  let e = SPR.get(def.id);
  if(e) return e;
  e = { def, cv:null, rim:null, white:null, w:0, h:0, ok:false, failed:false };
  SPR.set(def.id, e);
  const H0 = tierOf(def);
  buildFallback(e, def, H0);
  const img = new Image();
  img.onload = function(){
    try{
      e.img = img; e.imgW = img.naturalWidth || img.width; e.imgH = img.naturalHeight || img.height;
      /* crop：先按比例裁掉外部图片边缘的留白，再统一缩放到同一高度 */
      const cr = def.crop;
      const sx = cr ? Math.round(e.imgW*cr[0]) : 0;
      const sy = cr ? Math.round(e.imgH*cr[1]) : 0;
      const sw = cr ? Math.max(1, Math.round(e.imgW*(cr[2]-cr[0]))) : e.imgW;
      const sh = cr ? Math.max(1, Math.round(e.imgH*(cr[3]-cr[1]))) : e.imgH;
      const ar = sw/sh;
      let h = H0, w = Math.max(12, Math.round(h*ar));
      if(w > 168){ w = 168; h = Math.max(24, Math.round(w/ar)); }
      const c = makeCanvas(w,h), g = c.getContext('2d');
      g.imageSmoothingEnabled = true;
      g.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      e.cv = c; e.w = w; e.h = h; e.ok = true;
      const r = makeCanvas(w,h), rg = r.getContext('2d');
      rg.drawImage(c,0,0); rg.globalCompositeOperation='source-in'; rg.fillStyle='#f6c98f'; rg.fillRect(0,0,w,h);
      e.rim = r;
      const wc = makeCanvas(w,h), wg = wc.getContext('2d');
      wg.drawImage(c,0,0); wg.globalCompositeOperation='source-in'; wg.fillStyle='#fff0cf'; wg.fillRect(0,0,w,h);
      e.white = wc;
      e.dim = shadeCopy(c, CROWD_DIM);
      e.soft = makeSoft(e.dim, w, h);
      paintCards();
    }catch(err){ e.failed = true; paintCards(); }
    artDone++;
    updateLoadingText();
  };
  img.onerror = function(){ e.failed = true; artDone++; updateLoadingText(); paintCards(); };
  img.src = def.img;
  return e;
}
function buildFallback(e, def, Hs){
  const w = Hs, h = Hs;
  const c = makeCanvas(w,h), g = c.getContext('2d');
  const col = def.color || '#c9b2e8';
  const ink = '#0b0709';
  const cx = w/2, cy = h*0.56;
  g.lineJoin='round';
  g.strokeStyle = ink; g.lineWidth = Math.max(2, w*0.035); g.fillStyle = col;
  const shape = def.shape || 'round';
  function blob(rx, ry, sq){
    g.beginPath();
    g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
    g.fill(); g.stroke();
    return {rx,ry};
  }
  if(shape==='wide' || shape==='squish' || shape==='big'){
    blob(w*0.44, h*(shape==='big'?0.34:0.27), 1);
  } else if(shape==='tall'){
    g.beginPath(); g.roundRect(cx-w*0.22, h*0.12, w*0.44, h*0.72, w*0.18); g.fill(); g.stroke();
  } else if(shape==='cube'){
    g.beginPath(); g.roundRect(cx-w*0.28, h*0.24, w*0.56, h*0.56, w*0.1); g.fill(); g.stroke();
  } else if(shape==='heart'){
    g.beginPath();
    g.moveTo(cx, cy+h*0.22);
    g.bezierCurveTo(cx-w*0.46, cy-h*0.12, cx-w*0.18, cy-h*0.34, cx, cy-h*0.08);
    g.bezierCurveTo(cx+w*0.18, cy-h*0.34, cx+w*0.46, cy-h*0.12, cx, cy+h*0.22);
    g.closePath(); g.fill(); g.stroke();
  } else if(shape==='star'){
    g.beginPath();
    for(let i=0;i<10;i++){
      const a = -Math.PI/2 + i*Math.PI/5;
      const r = i%2? w*0.18 : w*0.34;
      const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
      i? g.lineTo(x,y) : g.moveTo(x,y);
    }
    g.closePath(); g.fill(); g.stroke();
  } else if(shape==='spike'){
    g.beginPath();
    for(let i=0;i<16;i++){
      const a = i*Math.PI/8;
      const r = i%2? w*0.26 : w*0.36;
      const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
      i? g.lineTo(x,y) : g.moveTo(x,y);
    }
    g.closePath(); g.fill(); g.stroke();
  } else if(shape==='drop'){
    g.beginPath();
    g.moveTo(cx, h*0.14);
    g.bezierCurveTo(cx+w*0.42, h*0.5, cx+w*0.28, h*0.82, cx, h*0.82);
    g.bezierCurveTo(cx-w*0.28, h*0.82, cx-w*0.42, h*0.5, cx, h*0.14);
    g.closePath(); g.fill(); g.stroke();
  } else if(shape==='moon'){
    g.beginPath(); g.arc(cx+w*0.04, cy, w*0.34, 0, Math.PI*2); g.fill(); g.stroke();
    g.fillStyle = '#0b0709'; g.beginPath(); g.arc(cx+w*0.16, cy-h*0.06, w*0.29, 0, Math.PI*2); g.fill();
    g.fillStyle = col; g.beginPath(); g.arc(cx+w*0.1, cy+h*0.02, w*0.27, 0, Math.PI*2); g.fill();
  } else if(shape==='ghost'){
    g.beginPath();
    g.moveTo(cx-w*0.3, cy+h*0.3);
    g.lineTo(cx-w*0.3, cy-h*0.1);
    g.quadraticCurveTo(cx, cy-h*0.38, cx+w*0.3, cy-h*0.1);
    g.lineTo(cx+w*0.3, cy+h*0.3);
    g.lineTo(cx+w*0.15, cy+h*0.18);
    g.lineTo(cx, cy+h*0.3);
    g.lineTo(cx-w*0.15, cy+h*0.18);
    g.closePath(); g.fill(); g.stroke();
  } else if(shape==='rainbow'){
    g.lineWidth = w*0.1;
    for(let i=0;i<4;i++){
      g.strokeStyle = ['#ed5b35','#d9a441','#7fb0a0','#c9b2e8'][i];
      g.beginPath(); g.arc(cx, cy+h*0.16, w*(0.3-i*0.055), Math.PI, 0); g.stroke();
    }
    g.strokeStyle = ink; g.lineWidth = 2;
  } else if(shape==='bean'){
    g.beginPath(); g.ellipse(cx, cy, w*0.38, w*0.24, -0.4, 0, Math.PI*2); g.fill(); g.stroke();
  } else {
    blob(w*0.34, h*0.3, 1);
  }
  // 眼睛
  g.fillStyle = ink;
  g.beginPath(); g.arc(cx-w*0.11, cy-h*0.03, w*0.035, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+w*0.11, cy-h*0.03, w*0.035, 0, Math.PI*2); g.fill();
  g.fillStyle = '#fff0cf';
  g.beginPath(); g.arc(cx-w*0.1, cy-h*0.045, w*0.012, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(cx+w*0.12, cy-h*0.045, w*0.012, 0, Math.PI*2); g.fill();
  e.cv = c; e.w = w; e.h = h; e.ok = false;
  e.dim = shadeCopy(c, CROWD_DIM);
  e.soft = makeSoft(e.dim, w, h);
}

const AU = { ctx:null, master:null, muted:false, bgmTimer:null, bgmStep:0 };
function ensureAudio(){
  if(AU.ctx){ if(AU.ctx.state==='suspended'){ try{ AU.ctx.resume(); }catch(e){} } return AU.ctx; }
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AU.ctx = new C();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = 0.5;
    AU.master.connect(AU.ctx.destination);
  }catch(e){ return null; }
  return AU.ctx;
}
function tone(f, dur, type, vol, to, delay){
  const c = AU.ctx; if(!c || AU.muted) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(Math.max(20,f), t0);
  if(to) o.frequency.exponentialRampToValueAtTime(Math.max(20,to), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.12), t0+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(AU.master); o.start(t0); o.stop(t0+dur+0.03);
}
function noiseBurst(dur, vol, freq, delay){
  const c = AU.ctx; if(!c || AU.muted) return;
  const t0 = c.currentTime + (delay||0);
  const len = Math.max(1, Math.floor(c.sampleRate*dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type='bandpass'; f.frequency.value = freq||1200; f.Q.value=0.9;
  const g = c.createGain();
  g.gain.setValueAtTime(vol||0.14, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  src.connect(f); f.connect(g); g.connect(AU.master);
  src.start(t0);
}

const BGM = { timer:null, step:0, on:false };
const BGM_LEAD = [0,7,0,3,0,5,7,0, 0,7,0,3,5,3,0,-1];
const BGM_BASS = [0,0,5,5,3,3,7,7, 0,0,5,5,3,7,3,7];
function bgmStart(){
  if(BGM.on) return;
  if(!AU.ctx || AU.muted || !SV.settings.bgm || SV.settings.lowPower) return;
  BGM.on = true; BGM.step = 0;
  BGM.timer = setInterval(function(){
    if(!BGM.on || !AU.ctx || AU.muted) return;
    const s = BGM.step++ % 16;
    const lead = BGM_LEAD[s], bass = BGM_BASS[s];
    if(lead >= 0) tone(220*Math.pow(2,lead/12), .12, 'square', .045, null, 0);
    if(bass >= 0 && s%2===0) tone(110*Math.pow(2,bass/12), .2, 'triangle', .06, null, 0);
    if(s%4===0) noiseBurst(.04,.02,2400);
    /* 分层：残血紧张层 / Boss 压迫层 */
    const lowHp = !!(G.player && G.player.maxHp > 0 && (G.player.hp / G.player.maxHp) < 0.32);
    if(lowHp && s%2===1) noiseBurst(.03,.016,3200);
    if(lowHp && s%8===4) tone(392,.1,'square',.03,470);
    if(G.stage === 7 && s%8===0) tone(55,.5,'sawtooth',.05,40);
    if(G.stage === 7 && s%4===2) tone(440*Math.pow(2,(lead<0?0:lead)/12), .09,'square',.028);
  }, 140);
}

}

/* ================= 抽组 ================= */
function newGroup(seed){
  const s = (seed != null) ? (seed >>> 0) : ((Date.now() ^ (SV.cycle * 2654435761)) >>> 0);
  const rng = mulberry32(s);
  const buckets = { power:[], speed:[], balance:[], wave:[] };
  for(const d of POOL) buckets[archOf(d.id)].push(d);
  for(const k in buckets) shuffle(buckets[k], rng);
  const picked = [], used = new Set();
  let bigCount = 0;
  const isHuge = d => (d.size >= 2.5);
  function take(d){
    if(!d || used.has(d.id)) return false;
    if(isHuge(d) && bigCount >= 2) return false;
    picked.push(d.id); used.add(d.id);
    if(isHuge(d)) bigCount++;
    return true;
  }
  for(const a of ARCHS){
    let n = 0;
    for(const d of buckets[a]){
      if(n >= 2) break;
      if(take(d)) n++;
    }
  }
  const rest = shuffle(POOL.slice(), rng);
  for(const d of rest){
    if(picked.length >= 10) break;
    take(d);
  }
  shuffle(picked, rng);
  SV.group = { seed:s, ids:picked, createdAt:Date.now(), cleared:false };
  saveNow();
  return SV.group;
}
function ensureGroup(force){
  if(force || !SV.group || !sanitizeGroup(SV.group)) newGroup(force ? undefined : (SV.group && SV.group.seed));
  return SV.group;
}
function groupDefs(){ return ensureGroup().ids.map(defById).filter(Boolean); }
function groupArchCount(defs){
  const c = {power:0,speed:0,balance:0,wave:0};
  for(const d of defs) c[archOf(d.id)]++;
  return c;
}

/* 关卡难度系数：前段平缓给新手喘息，第 4 关后明显抬升，第 7 关由 Boss 系数接管 */
const STAGE_K = [1, 1.08, 1.18, 1.32, 1.50, 1.70, 1.90];
function makeFighter(def, isBoss, isPlayer){
  const st = statsOf(def);
  const b = G.buffs || {};
  const stageK = isPlayer ? 1 : (isBoss ? 1.90 : STAGE_K[clamp(G.stage, 1, 7) - 1]);
  const maxHp = Math.round(st.hp * stageK) + (isPlayer ? G.bonusHp : 0);
  /* 后期对手步伐也变快：第 4 关起每关 +3%，越到后面越难被风筝 */
  const spdK = isPlayer ? 1 : (1 + (G.stage >= 4 ? (G.stage - 3) * 0.03 : 0));
  const speed = st.speed * spdK * (isPlayer && b.speed ? (1 + 0.12*b.speed) : 1);
  const atk = st.atk * (isPlayer ? 1 : (isBoss ? 1.40 : 1 + (stageK - 1) * 0.60));
  const guardMax = 100 + (isPlayer && b.guard ? 30*b.guard : 0);
  const tomatoMax = 3 + (isPlayer && b.tomato ? b.tomato : 0);
  const drawH = Math.round(tierOf(def) * CHAR_K * (isBoss ? 1.06 : 1) * clamp(1 + (def.size - 1) * 0.05, 0.95, 1.10) * (def.scale || 1));
  const f = {
    def, isBoss, isPlayer, arch:archOf(def.id), sprite:ensureSprite(def),
    x: isPlayer ? 660 : 300, y: GROUND_Y, vx:0, vy:0, onGround:true,
    facing: isPlayer ? -1 : 1,
    maxHp, hp:maxHp, hpShow:maxHp, hpGhostT:0, atk, speed, reach:st.reach,
    drawH, bw: Math.round(drawH*0.52), bh: Math.round(drawH*0.90),
    state:'idle', attack:null, stun:0, invuln:0, flash:0, blockT:0, perfectT:0,
    meter:0, tomatoMax, tomatoes:tomatoMax, tomatoT:0,
    guard:guardMax, guardMax, guardDelay:0,
    combo:0, comboT:0, hitTaken:0, roundDamage:0,
    dashT:0, dashCd:0, walkT:0, bobT: Math.random()*10,
    sqx:1, sqy:1, sqVX:0, sqVY:0, tilt:0, tiltV:0,
    ai:null, aoe:null, koT:0, buffHeavy: (isPlayer && b.heavy) ? (1 + 0.2*b.heavy) : 1,
    meterMul: (isPlayer && b.meter) ? (1 + 0.25*b.meter) : 1,
    lifesteal: !!(isPlayer && b.lifesteal)
  };
  if(!isPlayer){
    const lvl = clamp(G.stage - 1, 0, 6);
    f.ai = {
      think: 16, dir:0, cd: 24,
      /* 后期反应更快、出手更主动、更爱格挡；第 7 关接近满值 */
      react: Math.round((0.34 - lvl*0.032) * 60),
      aggr: 0.36 + lvl*0.09,
      blockRate: 0.16 + lvl*0.055,
      aoeCd: 300
    };
  }
  return f;
}

/* 番茄系专属刀术：轻击双连斩、重击按流派分化、投掷蓝焰番茄、超必杀「苍焰终击」 */
function heroSpec(f, type){
  const r = f.reach;
  if(type === 'light'){
    /* 力量型起手更慢、收招更久 */
    if(f.arch === 'power') return { kind:'melee', hitFrames:[7,11], recovery:11, dmg:4.2, reach:r*1.05, h:214, kb:48, stun:11, hitstop:3, meter:4, sfx:'light', slash:'light' };
    if(f.arch === 'wave') return { kind:'melee', hitFrames:[5,9], recovery:9, dmg:3.0, reach:r*1.05, h:214, kb:36, stun:9, hitstop:2, meter:4, sfx:'light', slash:'light' };
    return { kind:'melee', hitFrames:[5,9], recovery:9, dmg:3.2, reach:r*1.05, h:214, kb:38, stun:9, hitstop:2, meter:4, sfx:'light', slash:'light' };
  }
  if(type === 'heavy'){
    if(f.arch === 'power') return { kind:'melee', hitFrames:[19,23], recovery:23, dmg:11, reach:r*1.55, h:268, kb:220, stun:26, hitstop:9, meter:10, lunge:240, armor:true, heavy:true, sfx:'heavy', slash:'wide' };
    if(f.arch === 'wave') return { kind:'proj', hitFrames:[14], recovery:18, dmg:5.2, count:3, kb:96, hitstop:6, meter:8, heavy:true, sfx:'coin' };
    return { kind:'melee', hitFrames:[14,18], recovery:18, dmg:7.5, reach:r*1.7, h:268, kb:168, stun:22, hitstop:7, meter:9, lunge:250, heavy:true, sfx:'heavy', slash:'wide' };
  }
  if(type === 'tomato'){
    return { kind:'proj', hitFrames:[10], recovery:12, dmg:9, count:1, tomato:true, blue:true, kb:120, hitstop:4, meter:7, sfx:'tomato' };
  }
  return { kind:'melee', hitFrames:[14,20,26,32], recovery:30, dmg:8.5, reach:380, h:360, kb:330, stun:30, hitstop:8, meter:0, lunge:420, super:true, sfx:'slash', slash:'super' };
}
function attackSpec(f, type){
  const r = f.reach;
  if(f.def && f.def.hero) return heroSpec(f, type);
  if(type === 'light'){
    return { kind:'melee', hitFrames:[6], recovery:10, dmg:5, reach:r*0.95, h:216, kb:54, stun:12, hitstop:3, meter:6, sfx:'light' };
  }
  if(type === 'heavy'){
    if(f.arch === 'power') return { kind:'melee', hitFrames:[15], recovery:19, dmg:13, reach:r*1.4, h:258, kb:192, stun:24, hitstop:8, meter:10, lunge:280, armor:true, heavy:true, sfx:'heavy' };
    if(f.arch === 'speed') return { kind:'melee', hitFrames:[10,14], recovery:12, dmg:6, reach:r*1.1, h:193, kb:70, stun:14, hitstop:6, meter:8, lunge:190, heavy:true, sfx:'heavy' };
    if(f.arch === 'balance') return { kind:'melee', hitFrames:[13], recovery:17, dmg:11, reach:r*1.55, h:258, kb:147, stun:20, hitstop:8, meter:9, heavy:true, sfx:'heavy' };
    return { kind:'proj', hitFrames:[13], recovery:17, dmg:5, count:3, kb:96, hitstop:6, meter:8, heavy:true, sfx:'coin' };
  }
  if(type === 'tomato'){
    return { kind:'proj', hitFrames:[10], recovery:13, dmg:8, count:1, tomato:true, kb:115, hitstop:3, meter:7, sfx:'tomato' };
  }
  return { kind:'melee', hitFrames:[18,25,32,39], recovery:28, dmg:7, reach:364, h:359, kb:368, stun:34, hitstop:7, meter:0, super:true, sfx:'super' };
}

function canAct(f){ return f && f.state !== 'ko' && f.stun <= 0 && !f.attack && !f.aoe; }
/* 连段取消：命中后 8 帧内可接轻击（轻击起手还能接重击） */
function canCancel(f, type){
  const a = f && f.attack;
  if(!a || a.spec.super || !a.hits) return false;
  const last = a.spec.hitFrames[a.spec.hitFrames.length-1] || 1;
  if(a.t <= last || a.t > last + 8) return false;
  return type === 'light' || (a.type === 'light' && type === 'heavy');
}

function startAttack(f, type){
  if(!canAct(f) && !canCancel(f, type)) return false;
  if(type === 'tomato' && f.tomatoes <= 0) return false;
  if(type === 'super' && f.meter < 100) return false;
  const spec = attackSpec(f, type);
  f.attack = { type, spec, t:0, hits:0, chained: !!(f.attack) };
  f.state = 'attack';
  f.vx = 0;
  if(type === 'tomato') f.tomatoes--;
  if(type === 'super') f.meter = 0;
  /* 厉害番茄的招牌超必杀：出招瞬间打出招式名 */
  if(type === 'super' && f.def && f.def.hero && !G.endWinner){
    G.banner = { text: T('superName'), sub: T('help_super'), t: 0, kind: 'super' };
  }
  if(spec.sfx && SFX[spec.sfx]) SFX[spec.sfx]();
  return true;
}
function startBlock(f, frames){
  if(!canAct(f)) return;
  f.state = 'block'; f.blockT = frames || 24; f.perfectT = 6;
}
function doJump(f){
  if(!canAct(f) || !f.onGround) return;
  f.vy = JUMP_V; f.onGround = false; f.state = 'jump';
  if(f.isPlayer) SFX.jump();
}
function doDash(f, dir){
  if(!canAct(f) || f.dashCd > 0) return;
  f.dashT = 12; f.dashCd = 26;
  f.vx = 620 * dir;
  f.invuln = Math.max(f.invuln, 3);
  if(f.isPlayer) SFX.dash();
}
function startAoe(f){
  if(!canAct(f) || !f.isBoss) return;
  f.aoe = { t:0, done:false };
  f.state = 'aoe'; f.vx = 0;
}

/* ================= 受击 ================= */
function overlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

function applyHit(a, b, rawDmg, spec, opts){
  opts = opts || {};
  if(!a || !b || b.state === 'ko' || b.invuln > 0) return false;
  const facingEach = (b.facing > 0 && a.x > b.x) || (b.facing < 0 && a.x < b.x);
  const blocking = b.state === 'block' && facingEach && !opts.unblockable;
  let dmg = rawDmg;
  let counter = false;
  if(!blocking){
    a.combo = (a.comboT > 0 ? a.combo : 0) + 1;
    a.comboT = 110;
    const dec = [1,.85,.7,.55][Math.min(a.combo-1,3)];
    dmg *= dec;
    if(a.combo > G.comboMax) G.comboMax = a.combo;
    if(G.comboMax >= 10) bumpAch('combo_10', G.comboMax);
    if(!opts.noCounter && !spec.super && b.attack && b.attack.t < (b.attack.spec.hitFrames[0] || 1)){
      dmg *= 1.2; counter = true;
    }
  }
  if(blocking){
    /* 完美格挡：按下格挡 6 帧内被击中 ⇒ 不掉槽、无削减伤害，并把对手弹开 */
    if(b.isPlayer && (b.perfectT || 0) > 0 && !spec.super){
      b.perfectT = 0;
      b.guardDelay = 0;
      b.blockT = 14;
      b.stun = Math.max(b.stun, 2);
      b.meter = Math.min(100, b.meter + 8);
      a.stun = Math.max(a.stun, 12);
      a.attack = null; a.aoe = null; a.state = 'idle';
      a.vx = -(spec.kb || 40) * 0.7 * a.facing;
      spark(b.x - a.facing*26, b.y - b.drawH*0.62, PAL.gold, 14);
      addRing(b.x - a.facing*26, b.y - b.drawH*0.62, 46, PAL.gold);
      impactBurst(b.x - a.facing*26, b.y - b.drawH*0.62, 44, PAL.gold, 2);
      sqKick(b, 0.03, -0.02, 0.09);
      sqKick(a, 0.10, -0.08, -0.12);
      punchZoom({ x:b.x - a.facing*26, y:b.y - b.drawH*0.62 }, 0.022);
      pushFloat(b.x, b.y - b.drawH*1.2, T('pgreat'), PAL.gold, 21);
      G.hitstop = Math.max(G.hitstop, 5);
      shakeKick(a.facing, -0.25, 5);
      SFX.block();
      return true;
    }
    const chip = dmg * 0.25;
    b.hp = Math.max(0, b.hp - chip);
    b.hpGhostT = 16;
    b.guard -= rawDmg * 2.6;
    b.guardDelay = 60;
    b.stun = Math.max(b.stun, 6);
    b.blockT = 6;
    b.vx = (spec.kb || 40) * 0.4 * a.facing;
    b.invuln = 4;
    sqKick(b, -0.05, 0.045, -0.05);
    sqKick(a, 0.02, -0.015, 0);
    impactBurst(b.x - a.facing*22, b.y - b.drawH*0.62, 18, '#f6c98f', 1);
    spark(b.x - a.facing*26, b.y - b.drawH*0.62, '#f6c98f', 5);
    addRing(b.x - a.facing*26, b.y - b.drawH*0.62, 24, '#f6c98f');
    pushFloat(b.x, b.y - b.drawH*1.14, T('block'), '#f6c98f', 15);
    SFX.block();
    if(b.guard <= 0){
      b.guard = 0; b.stun = 72; b.state = 'idle'; b.blockT = 0; b.attack = null;
      b.flash = 8; shakeKick(a.facing, -0.3, 6);
      sqKick(b, -0.16, 0.13, -0.15);
      sqKick(a, 0.05, -0.04, 0.05);
      impactBurst(b.x, b.y - b.drawH*0.7, 48, '#ed5b35', 2);
      punchZoom({ x:b.x, y:b.y - b.drawH*0.7 }, 0.028);
      pushFloat(b.x, b.y - b.drawH*1.26, T('blockBreak'), '#ed5b35', 20);
      addRing(b.x, b.y - b.drawH*0.76, 52, '#ed5b35');
      SFX.guardBreak();
    }
  } else {
    b.hp = Math.max(0, b.hp - dmg);
    b.hpGhostT = 16;
    b.stun = spec.stun || 12;
    b.invuln = 10;
    b.flash = 8;
    b.state = 'hit';
    b.vx = (spec.kb || 40) * a.facing * (counter ? 1.25 : 1);
    if(b.onGround){ b.vy = -120; b.onGround = false; }
    b.hitTaken += dmg;
    if(b.isPlayer){ G.roundDamage += dmg; G.player.roundDamage += dmg; }
    if(a.isPlayer) G.dmgDealt += dmg;
    spark(b.x, b.y - b.drawH*0.68, '#ed5b35', counter ? 12 : 7);
    addRing(b.x, b.y - b.drawH*0.68, counter ? 56 : 36, counter ? '#fff0cf' : '#ed5b35');
    const k = clamp(dmg / 8, 0.6, 2.1) * (counter ? 1.2 : 1);
    sqKick(b, -0.10*k, 0.085*k, -0.11*k);
    sqKick(a, 0.035*k, -0.03*k, 0.02*k);
    const ix = b.x - a.facing*14, iy = b.y - b.drawH*0.66;
    impactBurst(ix, iy, 22 + dmg*2.0 + (spec.super ? 26 : 0) + (spec.heavy ? 16 : 0),
      spec.slash ? (spec.super ? '#d7f6ff' : '#9fe6ff') : (spec.super ? PAL.hi : (spec.heavy ? PAL.gold : (counter ? PAL.hi : PAL.tomato2))),
      spec.super ? 3 : (spec.heavy || counter ? 2 : 1));
    if(spec.heavy) addRing(ix, iy, 86, spec.slash ? '#4fc3ff' : PAL.gold);
    /* 刀术命中：蓝焰炸开 + 更强的蓝色闪光 */
    if(spec.slash){
      flameP(ix, iy, '#6fd8ff', spec.super ? 12 : 6, a.facing);
      flameP(ix, iy, '#3fa9ff', spec.super ? 6 : 3, a.facing);
      addRing(ix, iy, spec.super ? 96 : 58, '#7fe0ff');
      if(spec.super) G.flashBlue = Math.max(G.flashBlue, 9);
    }
    punchZoom({ x:ix, y:iy }, spec.super ? 0.05 : (spec.heavy ? 0.042 : (dmg >= 10 ? 0.026 : 0.012)));
    if((spec.super && !spec.slash) || (spec.heavy && spec.kind === 'melee')) G.flashWhite = Math.max(G.flashWhite, 3);
    pushFloat(b.x + (Math.random()*20-10), b.y - b.drawH*1.18, String(Math.max(1, Math.round(dmg))), spec.heavy ? '#ffe6a8' : '#fff0cf', counter ? 22 : 18);
    if(counter) pushFloat(b.x, b.y - b.drawH*1.40, T('counter'), '#d9a441', 18);
    shakeKick(a.facing, -0.35, spec.super ? 12 : (spec.heavy ? 10 : 3));
    G.hitstop = Math.max(G.hitstop, spec.hitstop || 3);
    if(spec.sfx && SFX[spec.sfx]) SFX[spec.sfx]();
    if(a.lifesteal) a.hp = Math.min(a.maxHp, a.hp + 1.5);
  }
  a.meter = Math.min(100, a.meter + (spec.meter || 5) * a.meterMul);
  b.meter = Math.min(100, b.meter + dmg * 0.45 * (b.meterMul || 1));
  if(spec.super || spec.heavy || dmg >= 10) crowdReact(spec.super ? 3 : 1);
  if(b.hp <= 0) koFighter(b, a);
  return true;
}

function koFighter(f, by){
  f.state = 'ko'; f.attack = null; f.stun = 0; f.hp = 0; f.koT = 0;
  f.vx = 260 * (by && by.facing ? by.facing : f.facing);
  f.vy = -420; f.onGround = false;
  G.hitstop = Math.max(G.hitstop, 20);
  shakeKick(by && by.facing ? by.facing : f.facing, -0.45, 16);
  G.slowT = 42;
  G.flashWhite = 8;
  SFX.ko();
  spark(f.x, f.y - f.drawH*0.74, '#ed5b35', 26);
  addRing(f.x, f.y - f.drawH*0.74, 104, '#ed5b35');
  impactBurst(f.x, f.y - f.drawH*0.7, 96, '#fff0cf', 3);
  sqKick(f, -0.22, 0.18, 0.24);
  punchZoom({ x:f.x, y:f.y - f.drawH*0.7 }, 0.06);
  crowdReact(4);
}

/* ================= 投射物 ================= */
function spawnShots(f, spec){
  const n = spec.count || 1;
  for(let i=0;i<n;i++){
    const isTomato = !!spec.tomato;
    const y0 = f.y - f.drawH*0.78 + (n>1 ? (i-1)*14 : 0);
    const vy0 = isTomato ? -150 : (i-(n-1)/2)*56;
    G.shots.push({
      x: f.x + f.facing*f.drawH*0.34, y: y0,
      vx: f.facing * (isTomato ? 460 : 580),
      vy: vy0, g: isTomato ? 900 : 340,
      dmg: spec.dmg * f.atk, spec, owner:f, life:150, tomato:isTomato, blue:!!spec.blue, r:isTomato?15:8
    });
  }
}

function updateShots(dt){
  for(let i=G.shots.length-1;i>=0;i--){
    const s = G.shots[i];
    s.x += s.vx/60; s.y += s.vy/60; s.vy += s.g/60;
    s.life--;
    const sc = s.blue ? (Math.random() < 0.5 ? '#7fe0ff' : '#3fa9ff') : '#ed5b35';
    if(s.tomato && Math.random() < 0.35) dustP(s.x, s.y, sc, 1, 0.6);
    if(s.blue && Math.random() < 0.5) flameP(s.x - Math.sign(s.vx)*s.r, s.y, '#3fa9ff', 1, 0);
    if(s.life <= 0 || s.x < -40 || s.x > W+40 || s.y > GROUND_Y+10){
      if(s.tomato && s.life <= 0) dustP(s.x, s.y, sc, 4, 1);
      G.shots.splice(i,1); continue;
    }
    const target = s.owner.isPlayer ? G.foe : G.player;
    if(!target || target.state === 'ko' || target.invuln > 0) continue;
    const hb = { x: target.x-target.bw/2, w:target.bw, y: target.y-target.bh, h:target.bh };
    if(overlap({x:s.x-8,y:s.y-8,w:16,h:16}, hb)){
      applyHit(s.owner, target, s.dmg, s.spec, { noCounter:true });
      dustP(s.x, s.y, s.blue ? '#7fe0ff' : (s.tomato ? '#ed5b35' : '#d9a441'), 10, 1.2);
      if(s.blue) flameP(s.x, s.y, '#3fa9ff', 8, s.vx > 0 ? 1 : -1);
      if(s.tomato) SFX.tomato();
      G.shots.splice(i,1);
    }
  }
}

/* ================= AI ================= */
function fighterDist(a,b){ return Math.abs(a.x - b.x); }

function updateAI(f, foe){
  if(!f.ai || f.state === 'ko' || f.stun > 0) return;
  if(f.state === 'block'){ f.blockT--; if(f.blockT <= 0) f.state = 'idle'; return; }
  if(f.attack || f.aoe) return;
  const ai = f.ai;
  const dist = fighterDist(f, foe);
  const toward = (foe.x >= f.x) ? 1 : -1;
  if(ai.cd > 0) ai.cd--;
  if(f.meter >= 100 && dist < 380 && Math.random() < 0.02 + G.stage*0.004){
    startAttack(f, 'super'); ai.think = 60; ai.dir = 0; return;
  }
  if(foe.attack && foe.attack.t <= (foe.attack.spec.hitFrames[0] || 1) && dist < 190 && f.onGround && Math.random() < ai.blockRate * 0.42){
    startBlock(f, 20); return;
  }
  // 远距离突进贴近（越靠后的关卡越常用）
  if(dist > 230 && dist < 430 && f.onGround && ai.cd <= 0 && Math.random() < 0.012 + G.stage * 0.004){
    doDash(f, toward); ai.cd = 40; return;
  }
  if(f.isBoss && f.hp < f.maxHp * 0.42 && ai.aoeCd > 0) ai.aoeCd--;
  if(f.isBoss && f.hp < f.maxHp * 0.42 && ai.aoeCd <= 0 && dist < 580 && f.onGround && Math.random() < 0.03){
    startAoe(f); ai.aoeCd = 420; ai.dir = 0; return;
  }
  if(--ai.think > 0) return;
  ai.think = ai.react + Math.random()*16;
  ai.dir = 0;
  if(ai.cd > 0 && dist < 300){ f.state = 'idle'; return; }
  if(dist < 250){
    const r = Math.random();
    if(r < 0.30 + ai.aggr*0.18){ if(startAttack(f,'light')) ai.cd = 8 + Math.random()*10; }
    else if(r < 0.50 + ai.aggr*0.2){ if(startAttack(f,'heavy')) ai.cd = 18 + Math.random()*18; }
    else if(r < 0.68){ ai.dir = -toward; }
    else if(r < 0.84){ startBlock(f, 20 + Math.random()*16); }
    else doJump(f);
  } else if(dist < 500){
    const r = Math.random();
    if(f.arch === 'wave' && r < 0.32){ if(startAttack(f,'tomato')) ai.cd = 26; }
    else if(r < 0.52 + ai.aggr*0.16){ ai.dir = toward; }
    else if(r < 0.72){ if(startAttack(f,'heavy')) ai.cd = 24; }
    else if(r < 0.87){ doJump(f); }
    else startBlock(f, 18);
  } else {
    const r = Math.random();
    if(f.arch === 'wave' && r < 0.4){ if(startAttack(f,'tomato')) ai.cd = 28; }
    else if(r < 0.9){ ai.dir = toward; }
    else doJump(f);
  }
}

/* ================= 更新角色 ================= */
function updateFighter(f, foe){
  f.bobT += 0.05;
  if(f.flash > 0) f.flash--;
  if(f.invuln > 0) f.invuln--;
  if(f.comboT > 0){ f.comboT--; if(f.comboT === 0) f.combo = 0; }
  if(f.dashCd > 0) f.dashCd--;
  if(f.dashT > 0) f.dashT--;
  if(f.state !== 'block') f.perfectT = 0;
  else if(f.perfectT > 0) f.perfectT--;
  if(f.guardDelay > 0) f.guardDelay--;
  else if(f.guard < f.guardMax){
    const regen = f.isPlayer && G.buffs.guard ? 0.9*(1+0.5*G.buffs.guard) : 0.9;
    f.guard = Math.min(f.guardMax, f.guard + regen);
  }
  if(f.tomatoes < f.tomatoMax){
    f.tomatoT += f.isPlayer && G.buffs.tomato ? 1.25 : 1;
    if(f.tomatoT >= 190){ f.tomatoT = 0; f.tomatoes++; }
  }
  if(f.state === 'ko'){
    f.koT++;
    f.x += f.vx/60; f.vx *= 0.94;
    if(!f.onGround){ f.vy += GRAV/60; f.y += f.vy/60; if(f.y >= GROUND_Y){ f.y = GROUND_Y; f.vy = 0; f.onGround = true; } }
    f.x = clamp(f.x, WALL_L, WALL_R);
    return;
  }
  if(f.stun > 0){
    f.stun--;
    f.x += f.vx/60; f.vx *= 0.9;
    f.x = clamp(f.x, WALL_L, WALL_R);
    if(!f.onGround){ f.vy += GRAV/60; f.y += f.vy/60; if(f.y >= GROUND_Y){ f.y = GROUND_Y; f.vy = 0; f.onGround = true; } }
    if(f.stun === 0){ f.state = 'idle'; f.vx = 0; }
    return;
  }
  if(f.aoe){
    f.aoe.t++;
    f.x += f.vx/60;
    if(f.aoe.t === 44 && !f.aoe.done){
      f.aoe.done = true;
      shakeKick(f.facing, -0.4, 12);
      addRing(f.x, f.y - 40, 160, '#d9a441');
      addRing(f.x, f.y - 40, 90, '#ed5b35');
      spark(f.x, f.y - 20, '#ed5b35', 20);
      impactBurst(f.x, f.y - 40, 88, PAL.gold, 2);
      punchZoom({ x:f.x, y:f.y - 40 }, 0.032);
      dustP(f.x, GROUND_Y, '#8a6a3b', 8, 1.2);
      SFX.heavy();
      const t = f.isPlayer ? G.foe : G.player;
      if(t && t.onGround && Math.abs(t.x - f.x) < 400 && t.invuln <= 0){
        applyHit(f, t, 11, { kb:150, stun:24, hitstop:5, meter:5, unblockable:true }, { unblockable:true, noCounter:true });
      }
    }
    if(f.aoe.t >= 72){ f.aoe = null; f.state = 'idle'; }
    return;
  }
  if(f.attack){
    const a = f.attack, sp = a.spec;
    a.t++;
    if(sp.lunge && a.t === (sp.hitFrames[0] || 1) - 2) f.vx = sp.lunge * f.facing;
    if(sp.kind === 'melee'){
      for(const hf of sp.hitFrames){
        if(a.t === hf){
          /* 厉害番茄的刀术：挥空也出刀光，让斩击看得见 */
          if(sp.slash) slashFx(f, sp, { big: !!sp.super });
          if(foe && foe.state !== 'ko'){
            const reach = sp.reach || f.reach;
            const box = { x: f.facing > 0 ? f.x + 18 : f.x - 18 - reach, w: reach, y: f.y - sp.h, h: sp.h };
            const hb = { x: foe.x - foe.bw/2, w: foe.bw, y: foe.y - foe.bh, h: foe.bh };
            if(overlap(box, hb)){
              const dmg = sp.dmg * f.atk * (sp.super ? 1 : 1) * (a.type === 'heavy' ? f.buffHeavy : 1);
              applyHit(f, foe, dmg, sp, {});
              a.hits++;
            }
          }
        }
      }
    } else if(sp.kind === 'proj'){
      for(const hf of sp.hitFrames){
        if(a.t === hf) spawnShots(f, sp);
      }
    }
    if(a.t > (sp.hitFrames[sp.hitFrames.length-1] || 1)) f.vx *= 0.82;
    if(a.t >= sp.recovery + (sp.hitFrames[sp.hitFrames.length-1] || 1)){
      f.attack = null; f.state = 'idle'; f.vx = 0;
    }
    f.x += f.vx/60;
    f.x = clamp(f.x, WALL_L, WALL_R);
    return;
  }
  if(f.state === 'block'){
    f.blockT--;
    if(!f.isPlayer) { /* AI 自行结束 */ }
    else if(f.blockT <= 0 && !INPUT.down) f.state = 'idle';
    f.x += f.vx/60; f.vx *= 0.8;
    f.x = clamp(f.x, WALL_L, WALL_R);
    return;
  }
  if(f.state === 'hit'){
    f.state = 'idle';
  }
  // 移动
  let dir = 0;
  if(f.isPlayer){
    dir = (INPUT.right?1:0) - (INPUT.left?1:0);
    if(INPUT.touchAxis) dir = INPUT.touchAxis > 0.25 ? 1 : (INPUT.touchAxis < -0.25 ? -1 : 0);
  } else if(f.ai){
    dir = f.ai.dir || 0;
  }
  if(f.dashT > 0){
    f.vx *= 0.96;
    f.x += f.vx/60;
  } else if(f.onGround){
    f.vx = dir * f.speed;
    f.x += f.vx/60;
    const moving = dir !== 0;
    f.state = moving ? 'walk' : 'idle';
    if(moving){
      f.walkT += 0.18;
      if(Math.random() < 0.04 && f.walkT > 1) dustP(f.x - dir*14, f.y - 2, '#8a6a3b', 1, 0.5);
    }
  } else {
    f.x += f.vx/60;
  }
  // 跳跃 / 重力
  if(!f.onGround){
    f.vy += GRAV/60;
    f.y += f.vy/60;
    if(f.y >= GROUND_Y){
      const hard = f.vy > 620;
      f.y = GROUND_Y; f.vy = 0; f.onGround = true;
      if(f.state === 'jump') f.state = 'idle';
      if(hard){
        dustP(f.x, GROUND_Y, '#8a6a3b', 5, 1);
        sqKick(f, 0.055, -0.06, 0);
        shakeKick(f.facing, -1, 2);
      }
    }
  }
  // 朝向对手
  if(foe && foe.state !== 'ko' && !f.attack && f.state !== 'block'){
    f.facing = foe.x >= f.x ? 1 : -1;
  }
  f.x = clamp(f.x, WALL_L, WALL_R);
}

/* ================= 流程 ================= */
function resetRun(){
  G.stage = 1; G.continues = 2; G.buffs = {}; G.bonusHp = 0;
  G.score = 0; G.usedContinue = 0; G.dmgDealt = 0; G.comboMax = 0;
  G.scoredDmg = 0; G.carryHp = null; G.runFinished = false;
  G.playerDef = null; G.stageDef = null; G.opponents = []; G.audience = []; G.bossDef = null;
  G.pWins = 0; G.eWins = 0; G.round = 1; G.vsT = 0;
  G.endWinner = null; G.endDelay = 0; G.roundEndT = 0; G.endInfo = null;
  G.player = null; G.foe = null;
  G.shots.length = 0; G.fxP.length = 0; G.rings.length = 0; G.floats.length = 0; G.dust.length = 0;
  G.bursts.length = 0; G.slashes.length = 0; G.zoom = 0;
  G.banner = null; G.hitstop = 0; G.shake = 0; G.slowT = 0; G.flashWhite = 0; G.flashBlue = 0; G.intro = 0; G.buffOffer = [];
  G.crowd = [];
}

function startRun(){
  ensureGroup();
  resetRun();
  const defs = groupDefs();
  preloadDefs(defs.concat(HEROES));
  G.selectedId = null;
  G.previewId = TOMATO.id;
  G.state = 'select';
  showScreen('select');
  renderSelect();
}

function selectFighter(id){
  const d = defById(id);
  if(!d) return;
  if(!isHeroId(id) && !SV.group.ids.includes(id)) return;
  G.selectedId = id; G.playerDef = d;
  SV.usedFighters[id] = 1;
  const n = Object.keys(SV.usedFighters).length;
  bumpAch('five_fighters', n);
  SFX.click();
  saveNow();
  buildOpponents();
  G.stage = 1;
  startStage(1);
}

function buildOpponents(){
  const ids = SV.group.ids.filter(id => id !== G.selectedId);
  const defs = ids.map(defById).filter(Boolean).sort((a,b) => a.v - b.v);
  G.opponents = defs.slice(0, 6);
  const rest = defs.slice(6);
  G.bossDef = rest.length ? rest[rest.length-1] : defs[defs.length-1];
  G.audience = rest.length > 1 ? rest.slice(0, rest.length-1) : [];
}

function startStage(n){
  G.stage = clamp(n, 1, 7);
  G.stageDef = (G.stage === 7) ? G.bossDef : G.opponents[G.stage-1];
  G.pWins = 0; G.eWins = 0; G.round = 1;
  G.timer = 0; G.sudden = false; G.intro = 0;
  G.endWinner = null; G.endDelay = 0; G.roundEndT = 0;
  G.shots.length = 0; G.hitstop = 0;
  G.state = 'vs'; G.vsT = 0;
  showScreen('vs');
  renderVs();
  if(G.stageDef) ensureSprite(G.stageDef);
  buildCrowd();
}

function beginRound(){
  if(!G.stageDef) return;
  G.player = makeFighter(G.playerDef, false, true);
  G.foe = makeFighter(G.stageDef, G.stage === 7, false);
  if(G.round === 1 && G.carryHp != null){
    G.player.hp = clamp(G.carryHp, 1, G.player.maxHp);
    G.player.hpShow = G.player.hp;
  }
  G.shots.length = 0; G.slashes.length = 0;
  G.bursts.length = 0; G.zoom = 0;
  G.slowT = 0; G.hitstop = 0; G.shake = 0;
  G.timer = 3600; G.sudden = false;
  G.roundDamage = 0;
  G.endWinner = null; G.endDelay = 0; G.roundEndT = 0;
  G.intro = 96;
  G.banner = { text: T('roundWord', { n: G.round }), sub: '', t: 0, kind: 'round' };
  G.state = 'fight';
  INPUT.confirm = false;
  showScreen(null);
  bgmStart();
}

function timeUp(){
  const p = G.player, f = G.foe;
  if(!p || !f) return;
  const pr = p.hp / p.maxHp, fr = f.hp / f.maxHp;
  if(!G.sudden && Math.abs(pr - fr) < 0.01){
    G.sudden = true; G.timer = 900;
    G.banner = { text: T('timeup'), sub: T('sudden'), t: 0, kind: 'result' };
    SFX.block();
    return;
  }
  G.banner = { text: T('timeup'), sub: '', t: 0, kind: 'result' };
  resolveRound(pr >= fr ? 'player' : 'foe');
}

function resolveRound(winner){
  G.endWinner = null; G.endDelay = 0;
  if(winner === 'player'){
    G.pWins++;
    if(G.roundDamage <= 0) bumpAch('perfect', achGet('perfect') + 1);
  } else {
    G.eWins++;
  }
  G.banner = {
    text: winner === 'player' ? T('win') : T('lose'),
    sub: (G.pWins >= 2 || G.eWins >= 2) ? '' : T('roundWord', { n: G.round }),
    t: 0, kind: 'result'
  };
  G.state = 'roundEnd';
  G.roundEndT = 110;
  G.hitstop = Math.max(G.hitstop, 18);
  updatePad();
  if(winner === 'player') SFX.win(); else SFX.lose();
}

function stageWin(){
  const final = G.stage >= 7;
  const gained = Math.max(0, G.dmgDealt - (G.scoredDmg || 0));
  G.scoredDmg = G.dmgDealt;
  G.score += 500 + Math.round(gained * 3) + (final ? 1500 : 0);
  bumpAch('first_win', achGet('first_win') + 1);
  SV.records.wins = (SV.records.wins || 0) + 1;
  if(final) bumpAch('boss_ko', 1);
  SV.fighterWins[G.selectedId] = (SV.fighterWins[G.selectedId] || 0) + 1;
  SV.records.bestScore = Math.max(SV.records.bestScore || 0, G.score);
  bumpAch('score_5000', G.score);
  /* 过关回血：越往后回得越少，逼玩家在后期更精打细算 */
  G.carryHp = Math.min(G.player.maxHp, G.player.hp + G.player.maxHp * (0.30 - (G.stage - 1) * 0.02));
  saveNow();
  if(final){ groupClear(); return; }
  G.buffOffer = rollBuffs();
  G.state = 'buff';
  showScreen('buff');
  renderBuff();
}

function rollBuffs(){
  const keys = ['tomato','heavy','speed','guard','hp','meter','lifesteal'];
  const rng = mulberry32((Date.now() ^ (G.stage * 7919) ^ (SV.cycle * 104729)) >>> 0);
  return shuffle(keys.slice(), rng).slice(0, 3);
}

function chooseBuff(id){
  if(!G.buffOffer.includes(id)) return;
  G.buffs[id] = (G.buffs[id] || 0) + 1;
  if(id === 'hp'){ G.bonusHp += 15; if(G.carryHp != null) G.carryHp += 30; }
  SFX.buff();
  G.buffOffer = [];
  startStage(G.stage + 1);
}

function stageLose(){
  SFX.lose();
  G.state = 'end';
  G.endInfo = { canContinue: G.continues > 0, cleared: false };
  showScreen('end');
  renderEnd();
}

function continueRun(){
  if(G.continues <= 0) return;
  G.continues--; G.usedContinue++;
  G.carryHp = null;
  SFX.start();
  startStage(G.stage);
}

function finishRun(won){
  if(G.runFinished) return;
  G.runFinished = true;
  SV.records.games = (SV.records.games || 0) + 1;
  if(!won) SV.records.losses = (SV.records.losses || 0) + 1;
  pushScore();
  saveNow();
}

function changeAfterLoss(){
  finishRun(false);
  SFX.click();
  bgmStop();
  startRun();
}

function giveUp(){
  finishRun();
  G.player = null; G.foe = null; G.banner = null;
  G.state = 'title';
  showScreen('title');
  renderTitle();
  bgmStop();
}

function pushScore(){
  const arr = SV.records.top5 || [];
  arr.push({ score: G.score, stage: G.stage, fighter: G.selectedId, date: Date.now() });
  arr.sort((a,b) => b.score - a.score);
  SV.records.top5 = arr.slice(0, 5);
  SV.records.bestScore = Math.max(SV.records.bestScore || 0, G.score);
}

function groupClear(){
  bumpAch('clear_1', achGet('clear_1') + 1);
  if(G.selectedId === TOMATO.id) bumpAch('tomato_clear', 1);
  if(G.usedContinue === 0) bumpAch('no_continue', 1);
  SV.records.clears = (SV.records.clears || 0) + 1;
  bumpAch('cycle_5', SV.records.clears);
  SV.groupHistory.push({ ids: SV.group.ids.slice(), cycle: SV.cycle, at: Date.now() });
  SV.groupHistory = SV.groupHistory.slice(-20);
  SV.cycle++;
  G.clearOld = SV.group.ids.slice();
  newGroup();
  G.clearNewDefs = SV.group.ids.map(defById).filter(Boolean);
  preloadDefs(G.clearNewDefs);
  finishRun(true);
  G.state = 'clear';
  showScreen('clear');
  renderClear();
  SFX.win();
  bgmStop();
}

function nextGroup(){
  startRun();
}

/* 镜头：跟随两人中点，越靠边越偏，用来做分层视差 */
function updateCam(){
  const a = G.player, b = G.foe;
  let target = 0;
  if(a && b && a.state !== 'ko' && b.state !== 'ko') target = clamp(((a.x + b.x) / 2 - W/2) * 0.055, -18, 18);
  G.camX = (G.camX || 0) + (target - (G.camX || 0)) * 0.06;
}

/* ================= 世界更新 ================= */
function updateWorld(){
  G.bgT++;
  updateCrowd();
  updateCam();
  if(G.state === 'vs'){
    G.vsT++;
    if(G.vsT > 120 || INPUT.confirm) beginRound();
    updateFx();
    return;
  }
  if(G.state === 'roundEnd'){
    if(G.hitstop > 0) G.hitstop--;
    if(G.player) updateFighter(G.player, G.foe);
    if(G.foe) updateFighter(G.foe, G.player);
    updateShots();
    updateFx();
    G.roundEndT--;
    if(G.roundEndT <= 0){
      if(G.pWins >= 2) stageWin();
      else if(G.eWins >= 2) stageLose();
      else { G.round++; beginRound(); }
    }
    return;
  }
  if(G.state !== 'fight'){ updateFx(); return; }

  if(G.intro > 0){
    G.intro--;
    if(G.intro === 40){
      G.banner = { text: 'FIGHT!', sub: '', t: 0, kind: 'fight' };
      SFX.start();
    }
    updateFx();
    return;
  }
  if(G.hitstop > 0){ G.hitstop--; updateFx(); return; }

  /* KO 慢动作：隔帧推进世界（半速），让终结一击有戏剧感 */
  if(G.slowT > 0){
    G.slowT--;
    if(G.slowT & 1) return;
  }

  if(G.endWinner){
    G.endDelay--;
    updateFighter(G.player, G.foe);
    updateFighter(G.foe, G.player);
    updateShots();
    updateFx();
    if(G.endDelay <= 0) resolveRound(G.endWinner);
    return;
  }

  G.timer--;
  if(G.timer <= 0){ G.timer = 0; timeUp(); }

  updateFighter(G.player, G.foe);
  updateFighter(G.foe, G.player);
  updateAI(G.foe, G.player);
  updateShots();
  updateFx();

  if(G.player.state === 'ko' || G.foe.state === 'ko'){
    G.endWinner = (G.player.state === 'ko') ? 'foe' : 'player';
    G.endDelay = 96;
  }
}

/* ================= HD-2D 渲染 ================= */
const PAL = {
  ink:'#0b0709', brown:'#1a1013', darkred:'#3d1d18', brick:'#7a2a1f',
  tomato:'#c23a25', tomato2:'#ed5b35', cream:'#f6c98f', hi:'#fff0cf',
  brass:'#8a6a3b', gold:'#d9a441', warm:'#5a5a52', cold:'#2f3b34', teal:'#7fb0a0'
};
const CV = $('cv'), CTX = CV.getContext('2d');

/* ---------- 舞台：三层视差 + 主题轮换 ----------
   每层左右各多烘 40px，镜头平移时不会露出边缘。 */
const LAYER_M = 40, LW = W + LAYER_M * 2;
const SCENE = { far:null, mid:null, floor:null };
let sceneReady = false, sceneTheme = -1;

const THEMES = [
  { /* 0 番茄集市 */
    sky:['#100b0c','#1f1416','#33201b'],
    arch:['rgba(246,201,143,.28)','rgba(122,42,31,.34)'],
    pillar:['#2a1714','#5a3225','#3a201a','#140d0c'],
    banner:['#7a2a1f','#3d1d18'],
    lantern:['#c23a25','#ed5b35'],
    floor:['#3d251d','#261613','#110b0a'],
    beam:'246,201,143', pulse:'237,91,53'
  },
  { /* 1 夜雨霓虹 */
    sky:['#080d16','#101c2a','#182a38'],
    arch:['rgba(120,200,230,.24)','rgba(38,80,120,.34)'],
    pillar:['#0d1622','#25415a','#16283a','#080f16'],
    banner:['#1d4a63','#123043'],
    lantern:['#4a86c8','#7fd0e8'],
    floor:['#11222e','#0b1620','#050a0e'],
    beam:'150,220,240', pulse:'90,190,220'
  },
  { /* 2 雪夜木台 */
    sky:['#0c0d12','#1b1f29','#2b3240'],
    arch:['rgba(226,240,255,.22)','rgba(90,110,140,.30)'],
    pillar:['#1a1d24','#3c4557','#262c38','#0d1015'],
    banner:['#4a5568','#2b3340'],
    lantern:['#7fa8c8','#c8e4f0'],
    floor:['#2a303c','#1a1f28','#0a0d12'],
    beam:'220,238,255', pulse:'140,190,230'
  },
  { /* 3 金库（Boss） */
    sky:['#0f0c08','#221a0f','#3a2c14'],
    arch:['rgba(255,220,140,.30)','rgba(140,100,30,.32)'],
    pillar:['#241a0d','#5a4520','#3a2c15','#120d07'],
    banner:['#8a6a1f','#4a3812'],
    lantern:['#d9a441','#f0c063'],
    floor:['#3a2c15','#241a0d','#100b06'],

  }

function stageThemeIdx(){
  const map = [0,0,1,1,2,2,3];
  return map[clamp(G.stage, 1, 7) - 1];
}
function ensureScene(){
  const idx = stageThemeIdx();
  if(sceneReady && sceneTheme === idx) return;
  buildScene(idx);
  sceneTheme = idx;
  sceneReady = true;
}

function buildScene(idx){
  const th = THEMES[clamp(idx, 0, THEMES.length-1)];
  const ox = LAYER_M, wid = LW;

  /* --- 远层：天空 / 墙面竖纹 / 拱门光 --- */
  const far = makeCanvas(wid, H), f = far.getContext('2d');
  const sky = f.createLinearGradient(0, 0, 0, GROUND_Y);
  sky.addColorStop(0, th.sky[0]); sky.addColorStop(.45, th.sky[1]); sky.addColorStop(1, th.sky[2]);
  f.fillStyle = sky; f.fillRect(0, 0, wid, GROUND_Y);
  for(let i=0; i<12; i++){
    f.fillStyle = 'rgba(0,0,0,.18)';
    f.fillRect(ox + i*120-20, 0, 2, GROUND_Y);
  }
  for(let i=0; i<9; i++){
    f.fillStyle = 'rgba(255,240,207,.025)';
    f.fillRect(ox + 30+i*138, 0, 62, GROUND_Y);
  }
  const ax = ox + W/2, ay = GROUND_Y-110;
  const arch = f.createRadialGradient(ax, ay, 12, ax, ay, 300);
  arch.addColorStop(0, th.arch[0]);
  arch.addColorStop(.45, th.arch[1]);
  arch.addColorStop(1, 'rgba(26,16,19,0)');
  f.fillStyle = arch;
  f.beginPath(); f.arc(ax, ay, 300, Math.PI, 0); f.fill();

  /* --- 中层：柱子 / 挂旗 / 灯笼 --- */
  const mid = makeCanvas(wid, H), m = mid.getContext('2d');
  [120, 840].forEach(function(px){
    const x = ox + px;
    const p = m.createLinearGradient(x-26, 0, x+26, 0);
    p.addColorStop(0, th.pillar[0]); p.addColorStop(.4, th.pillar[1]);
    p.addColorStop(.72, th.pillar[2]); p.addColorStop(1, th.pillar[3]);
    m.fillStyle = p; m.fillRect(x-26, 34, 52, GROUND_Y-34);
    m.fillStyle = 'rgba(217,164,65,.26)'; m.fillRect(x-26, 34, 3, GROUND_Y-34);
    m.fillStyle = 'rgba(0,0,0,.35)'; m.fillRect(x+20, 34, 6, GROUND_Y-34);
  });
  for(let i=0; i<5; i++){
    const bx = ox + 252 + i*114;
    m.fillStyle = i%2 ? th.banner[0] : th.banner[1];
    m.fillRect(bx, 62, 26, 148);
    m.fillStyle = 'rgba(217,164,65,.46)';
    m.fillRect(bx, 62, 26, 3); m.fillRect(bx+11, 65, 4, 142);
  }
  [302, 480, 658].forEach(function(lx){
    const x = ox + lx, ly = 110;
    const gl = m.createRadialGradient(x, ly, 2, x, ly, 70);
    gl.addColorStop(0, 'rgba(237,91,53,.5)');
    gl.addColorStop(1, 'rgba(237,91,53,0)');
    m.fillStyle = gl; m.beginPath(); m.arc(x, ly, 70, 0, Math.PI*2); m.fill();
    m.fillStyle = th.lantern[0]; m.beginPath(); m.ellipse(x, ly, 20, 26, 0, 0, Math.PI*2); m.fill();
    m.fillStyle = th.lantern[1]; m.beginPath(); m.ellipse(x-5, ly-4, 8, 12, 0, 0, Math.PI*2); m.fill();
    m.strokeStyle = PAL.gold; m.lineWidth = 2;
    m.beginPath(); m.moveTo(x, ly-30); m.lineTo(x, ly-40); m.stroke();
  });

  /* --- 近层：地板 / 透视线 / 光池 --- */
  const flo = makeCanvas(wid, H), fl = flo.getContext('2d');
  const fg = fl.createLinearGradient(0, GROUND_Y-14, 0, H);
  fg.addColorStop(0, th.floor[0]); fg.addColorStop(.32, th.floor[1]); fg.addColorStop(1, th.floor[2]);
  fl.fillStyle = fg; fl.fillRect(0, GROUND_Y-14, wid, H-GROUND_Y+14);
  fl.strokeStyle = 'rgba(217,164,65,.14)'; fl.lineWidth = 1;
  for(let i=0; i<=16; i++){
    const x = i*80;
    fl.beginPath();
    fl.moveTo(ox + W/2 + (x-ox-W/2)*0.34, GROUND_Y-14);
    fl.lineTo(x, H);
    fl.stroke();
  }
  for(let i=1; i<5; i++){
    const y = GROUND_Y-14 + Math.pow(i/4, 1.7)*(H-GROUND_Y+14);
    fl.beginPath(); fl.moveTo(0, y); fl.lineTo(wid, y); fl.stroke();
  }
  const pool = fl.createRadialGradient(ox + W/2, GROUND_Y+26, 18, ox + W/2, GROUND_Y+26, 440);
  pool.addColorStop(0, 'rgba(' + th.beam + ',.20)');
  pool.addColorStop(.6, 'rgba(' + th.beam + ',.05)');
  pool.addColorStop(1, 'rgba(' + th.beam + ',0)');
  fl.fillStyle = pool; fl.fillRect(0, GROUND_Y-50, wid, H-GROUND_Y+50);

  SCENE.far = far; SCENE.mid = mid; SCENE.floor = flo;
  sceneReady = true;
}

/* ---------- 特效 ---------- */
function spark(x, y, color, n){
  for(let i=0; i<n; i++){
    const a = Math.random()*Math.PI*2, sp = 90 + Math.random()*260;
    G.fxP.push({
      x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 60,
      life:16 + Math.random()*16, max:32, color, size:2 + Math.random()*3, g:620
    });
  }
  if(G.fxP.length > 120) G.fxP.splice(0, G.fxP.length-120);
}
function dustP(x, y, color, n, scale){
  for(let i=0; i<n; i++){
    G.dust.push({
      x:x + (Math.random()-.5)*10, y,
      vx:(Math.random()-.5)*60, vy:-30 - Math.random()*70,
      life:14 + Math.random()*18, max:32, color, size:(1 + Math.random()*2)*(scale || 1)
    });
  }
  if(G.dust.length > 90) G.dust.splice(0, G.dust.length-90);
}
function addRing(x, y, r, color){
  G.rings.push({ x, y, r:r*0.25, tr:r, life:16, max:16, color });
}
/* 蓝焰粒子：负重力往上飘，用来给斩击加“火焰”拖尾 */
function flameP(x, y, color, n, dir){
  for(let i=0; i<n; i++){
    G.fxP.push({
      x:x + (Math.random()-.5)*22, y:y + (Math.random()-.5)*22,
      vx:(dir||0)*(70 + Math.random()*160) + (Math.random()-.5)*70,
      vy:-40 - Math.random()*130,
      life:12 + Math.random()*12, max:24, color, size:2 + Math.random()*3, g:-150
    });
  }
  if(G.fxP.length > 160) G.fxP.splice(0, G.fxP.length-160);
}
/* 斩击弧：随时间展开再淡出的月牙刀光（蓝白） */
function slashFx(f, sp, opts){
  const reach = sp.reach || f.reach;
  const h = sp.h || 240;
  const big = !!(opts && opts.big);
  G.slashes.push({
    x: f.x + f.facing*reach*0.48, y: f.y - h*0.58,
    r: Math.max(46, h*0.56), dir: f.facing, t:0,
    life: big ? 22 : 15, max: big ? 22 : 15, big, wide: sp.slash === 'wide'
  });
  if(G.slashes.length > 10) G.slashes.shift();
  if(big) G.flashBlue = Math.max(G.flashBlue, 4);
}
function pushFloat(x, y, text, color, size){
  G.floats.push({ x, y, text, color, size:size || 16, life:44, max:44, vy:-1.4 });
}

/* ---------- 打击感：Q弹挤压 / 冲击星 / 镜头拳击 ---------- */
/* 方向化震屏：dir 为命中推动方向（单位向量），只保留最强的那一次 */
function shakeKick(dx, dy, power){
  if(!(power >= G.shake)) return;
  const m = Math.hypot(dx, dy) || 1;
  G.shake = power;
  G.shakeDX = dx / m;
  G.shakeDY = dy / m;
  G.shakePh = Math.PI/2;   // 立刻到达最大位移，不做渐入
}
function sqKick(f, ax, ay, tilt){
  if(!f) return;
  f.sqVX += ax; f.sqVY += ay;
  if(tilt) f.tiltV += tilt;
}
function updateSquash(f){
  if(!f) return;
  f.sqVX += (1 - f.sqx) * 0.34; f.sqVX *= 0.80; f.sqx += f.sqVX;
  f.sqVY += (1 - f.sqy) * 0.34; f.sqVY *= 0.80; f.sqy += f.sqVY;
  f.tiltV += (0 - f.tilt) * 0.28; f.tiltV *= 0.80; f.tilt += f.tiltV;
  f.sqx = clamp(f.sqx, 0.55, 1.5);
  f.sqy = clamp(f.sqy, 0.55, 1.5);
  f.tilt = clamp(f.tilt, -0.42, 0.42);
}
/* 血条残影：掉血后先停顿 hpGhostT 帧，再缓慢回落 */
function updateHpShow(f){
  if(!f) return;
  if(f.hp >= f.hpShow){ f.hpShow = f.hp; f.hpGhostT = 0; return; }
  if(f.hpGhostT > 0){ f.hpGhostT--; return; }
  f.hpShow = Math.max(f.hp, f.hpShow - Math.max(0.4, (f.hpShow - f.hp) * 0.12));
}
function punchZoom(at, amount){
  if(SV.settings && SV.settings.lowPower) return;
  if(amount > G.zoom) G.zoom = amount;
  if(at){ G.zoomAt.x = at.x; G.zoomAt.y = at.y; }
}
function impactBurst(x, y, r, color, power){
  power = power || 1;
  const dur = power >= 3 ? 24 : (power >= 2 ? 18 : 13);
  G.bursts.push({ x, y, r:Math.max(16, r), life:dur - 2, max:dur, color, power, rot:Math.random()*Math.PI*2 });
  if(G.bursts.length > 28) G.bursts.shift();
}
function updateFx(){
  for(let i=G.fxP.length-1; i>=0; i--){
    const p = G.fxP[i];
    p.life--; p.vy += p.g/60; p.x += p.vx/60; p.y += p.vy/60;
    if(p.life <= 0) G.fxP.splice(i,1);
  }
  for(let i=G.dust.length-1; i>=0; i--){
    const p = G.dust[i];
    p.life--; p.x += p.vx/60; p.y += p.vy/60; p.vy += 20/60; p.vx *= 0.98;
    if(p.life <= 0) G.dust.splice(i,1);
  }
  for(let i=G.rings.length-1; i>=0; i--){
    const r = G.rings[i];
    r.life--; r.r += (r.tr - r.r)*0.18;
    if(r.life <= 0) G.rings.splice(i,1);
  }
  for(let i=G.floats.length-1; i>=0; i--){
    const f = G.floats[i];
    f.life--; f.y += f.vy;
    if(f.life <= 0) G.floats.splice(i,1);
  }
  for(let i=G.slashes.length-1; i>=0; i--){
    const s = G.slashes[i];
    s.t++;
    if(s.big && s.t <= 8){
      const r = s.r*(0.72 + (s.t/8)*0.5);
      for(let k=0;k<5;k++){
        const a = (Math.random()-0.5)*2.3;
        flameP(s.x + Math.cos(a)*r*0.82, s.y + Math.sin(a)*r*0.82,
          k === 0 ? '#d7f6ff' : (k < 3 ? '#7fe0ff' : '#3fa9ff'), 1, s.dir);
      }
    }
    if(s.t >= s.life) G.slashes.splice(i,1);
  }
  if(G.flashWhite > 0) G.flashWhite--;
  if(G.flashBlue > 0) G.flashBlue--;
  if(G.shake > 0.2){ G.shake *= 0.86; G.shakePh += 0.9; }
  else G.shake = 0;
  if(G.banner) G.banner.t++;

  const frozen = G.hitstop > 0 || G.paused;
  if(!frozen){
    updateSquash(G.player); updateSquash(G.foe);
    updateHpShow(G.player); updateHpShow(G.foe);
    G.zoom = G.zoom > 0.0006 ? G.zoom * 0.87 : 0;
    for(let i=G.bursts.length-1; i>=0; i--){
      if(--G.bursts[i].life <= 0) G.bursts.splice(i,1);
    }
  }
}

/* ---------- 绘制：舞台 ---------- */
function drawStage(){
  ensureScene();
  const cam = G.camX || 0;
  const th = THEMES[sceneTheme < 0 ? 0 : sceneTheme];
  CTX.drawImage(SCENE.far, -LAYER_M - cam*0.55, 0);
  CTX.drawImage(SCENE.mid, -LAYER_M - cam*1.25, 0);
  CTX.drawImage(SCENE.floor, -LAYER_M - cam*2.1, 0);

  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  const t = G.bgT*0.008;
  for(let i=0; i<3; i++){
    const x = 150 + i*260 + Math.sin(t + i*1.7)*16;
    const lg = CTX.createLinearGradient(x, 0, x+140, H);
    lg.addColorStop(0, 'rgba(' + th.beam + ',.09)');
    lg.addColorStop(1, 'rgba(' + th.beam + ',0)');
    CTX.fillStyle = lg;
    CTX.beginPath();
    CTX.moveTo(x, 0); CTX.lineTo(x+96, 0);
    CTX.lineTo(x+250, H); CTX.lineTo(x+70, H);
    CTX.closePath(); CTX.fill();
  }
  const pul = 0.06 + Math.sin(G.bgT*0.02)*0.02;
  const pg = CTX.createRadialGradient(W/2, GROUND_Y+10, 20, W/2, GROUND_Y+10, 460);
  pg.addColorStop(0, 'rgba(' + th.pulse + ',' + pul + ')');
  pg.addColorStop(1, 'rgba(' + th.pulse + ',0)');
  CTX.fillStyle = pg;
  CTX.beginPath(); CTX.ellipse(W/2, GROUND_Y+10, 460, 120, 0, 0, Math.PI*2); CTX.fill();
  CTX.restore();

  drawCrowd();
}
