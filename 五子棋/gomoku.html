<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ea">
<title>月巴五子棋 · Banny Gomoku</title>
<style>
  /* ============================================================
     M0 · 浅色单色像素骨架
     结构沿用「蛇月巴 / 番茄幸存者」：顶栏 + 舞台 + 弹层 + 四角光标 + 扫描线
     配色改为 1-bit 墨色纸面：只有 ink / paper，不出现彩色与模糊
     ============================================================ */
  :root{
    --paper:#f6f3ea; --paper2:#ece8dc; --paper3:#fbf9f2;
    --ink:#23231f; --ink2:#4a4a42; --ink3:#7a7a6f;
    --line:rgba(35,35,31,.22); --line2:rgba(35,35,31,.55);
    --dither:rgba(35,35,31,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);}
  body{font-family:"SF Mono","Cascadia Mono",Consolas,ui-monospace,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;overscroll-behavior:none;display:flex;justify-content:center;}

  #app{position:relative;z-index:1;width:min(100vw,540px);height:100%;
    display:flex;flex-direction:column;
    padding:calc(6px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));}

  /* ---------- 顶栏 ---------- */
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 2px;}
  .brand{font-size:13px;font-weight:900;letter-spacing:2px;white-space:nowrap;}
  .brand span{color:var(--ink3);font-weight:900;}
  .brand b{font-weight:900;border-bottom:2px solid var(--ink);padding-bottom:1px;}
  .stats{display:flex;align-items:center;gap:4px;margin-left:auto;}
  .stat{display:flex;align-items:baseline;gap:4px;padding:3px 6px;
    border:1px solid var(--line);border-left:2px solid var(--line2);
    background:var(--paper2);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  .stat span{font-size:7px;font-weight:800;letter-spacing:1px;color:var(--ink3);}
  .stat b{display:inline-block;min-width:18px;font-size:12px;text-align:right;color:var(--ink);
    font-variant-numeric:tabular-nums;}
  #btnPause,#btnLb{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;color:var(--ink);cursor:pointer;padding:0;
    border:1px solid var(--line2);background:var(--paper2);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);}
  #btnPause:active,#btnLb:active{transform:scale(.94);}
  #btnPause svg,#btnLb svg{display:block;width:14px;height:14px;}

  /* ---------- 对手条 ---------- */
  #oppStrip{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:54px;padding:5px 2px;}
  #oppAvatar{width:42px;height:42px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--ink);background:var(--paper3);box-shadow:3px 3px 0 var(--dither);}
  #oppAvatar img,#oppAvatar svg{width:100%;height:100%;object-fit:contain;display:block;}
  /* 立绘保持原色（有外链立绘的月巴要看得出是谁）；无立绘的兜底像素兔仍是 1-bit 墨色 */
  #oppAvatar svg{filter:grayscale(1) contrast(1.15);}
  /* 换对手 / 对局开始时头像「弹」一下 */
  #oppAvatar.pop{animation:avPop .3s cubic-bezier(.34,1.56,.5,1);}
  @keyframes avPop{0%{transform:scale(.7) rotate(-4deg)}60%{transform:scale(1.07) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
  .oppMeta{flex:1 1 auto;min-width:0;}
  .oppName{font-size:11px;font-weight:900;letter-spacing:1.2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;}
  .oppLine{font-size:9px;line-height:1.4;color:var(--ink3);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #turnPill{flex:0 0 auto;padding:3px 7px;font-size:9px;font-weight:900;letter-spacing:1px;
    color:var(--paper);background:var(--ink);border:1px solid var(--ink);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);}
  /* 回合切换时胶囊「啪」一下 */
  #turnPill.pulse{animation:pillPop .3s steps(3,end);}
  @keyframes pillPop{0%{transform:scale(.7)}55%{transform:scale(1.08)}100%{transform:scale(1)}}

  /* ---------- 舞台 ---------- */
  #frame{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:6px;}
  #boardWrap{position:relative;z-index:2;background:var(--paper3);border:2px solid var(--ink);
    box-shadow:5px 5px 0 var(--dither);}
  #cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;}
  #boardWrap::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.28;
    background:repeating-conic-gradient(var(--dither) 0% 25%,transparent 0% 50%) 0 0/4px 4px;}
  #boardWrap::before{content:'';position:absolute;inset:-2px;z-index:2;pointer-events:none;opacity:.9;
    background:
      linear-gradient(var(--ink),var(--ink)) left top/14px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left top/2px 14px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right top/14px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right top/2px 14px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left bottom/14px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left bottom/2px 14px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right bottom/14px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right bottom/2px 14px no-repeat;}
  #frame .scan{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.24;
    background:repeating-linear-gradient(0deg,rgba(35,35,31,.09) 0 1px,transparent 1px 4px);}
  #hintBar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:4;
    pointer-events:none;font-size:9px;letter-spacing:1px;color:var(--ink2);white-space:nowrap;
    background:var(--paper);border:1px solid var(--line2);padding:4px 10px;
    opacity:0;transition:opacity .25s ease;}
  #hintBar.show{opacity:1;}

  /* ---------- 月巴立绘：棋盘上方的整块空白都是它的场地 ---------- */
  #pet{position:absolute;inset:0;z-index:1;display:none;pointer-events:none;}
  #pet.on{display:block;}
  /* 唯一位移层：JS 写 translate3d(x,y) + 远近缩放，改位置只动合成层、不触发重排 */
  #petPos{position:absolute;left:0;top:0;transform-origin:50% 100%;will-change:transform;}
  #petMood,#petAct,#petFlip,#petHop,#petSquash{position:absolute;inset:0;transform-origin:50% 100%;}
  /* 只有走动时才跳；停住 / 思考时脚不动 */
  #pet.walking #petHop{animation:petHop .34s ease-in-out infinite;}
  #pet.walking #petSquash{animation:petSquash .34s ease-in-out infinite;}
  /* 思考：站在原处左右摇晃 */
  #pet.think #petMood{animation:petThinkSway 2.8s ease-in-out infinite;}
  #petArt{transform-origin:50% 100%;}
  #petArt,#petArt img,#petArt svg{width:100%;height:100%;display:block;object-fit:contain;-webkit-user-drag:none;}
  #petArt svg{filter:grayscale(1) contrast(1.15);}
  #petEmo{position:absolute;inset:0;pointer-events:none;}
  .emo{position:absolute;width:22px;height:22px;animation:emoUp 1.15s ease-out forwards;}
  .emo svg{width:100%;height:100%;display:block;}

  @keyframes petHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes petSquash{
    0%{transform:scale(1.1,.9)}
    22%{transform:scale(1,1)}
    50%{transform:scale(.95,1.06)}
    70%{transform:scale(1,1)}
    100%{transform:scale(1.1,.9)}
  }
  @keyframes petThinkSway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  @keyframes emoUp{
    0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-8deg)}
    20%{opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),-44px) scale(1.15) rotate(6deg)}
  }
  /* 立绘呼吸：外链立绘给一点点起伏（叠在蹦跳 / Q 弹之上）；像素兔兜底交给蹦跳 */
  #petArt.art{animation:petBreathe 3.2s ease-in-out infinite;}
  @keyframes petBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
  /* 弹层挡在前面时先停下，省一份动画开销 */
  body.ov-on #pet *{animation-play-state:paused;}

  /* ---------- 月巴的小动作（15 种） ---------- */
  #petAct.a-sway{animation:petSway .9s ease-in-out;}
  #petAct.a-nod{animation:petNod .46s ease-in-out 2;}
  #petAct.a-hop{animation:petBigHop .36s cubic-bezier(.34,1.56,.5,1) 2;}
  #petAct.a-look{animation:petLook .8s ease-in-out;}
  #petAct.a-droop{animation:petDroop 1.6s ease-in-out;}
  #petAct.a-dance{animation:petDance .44s steps(2,end) 5;}
  #petAct.a-stretch{animation:petStretch 1.1s ease-in-out;}
  #petAct.a-wiggle{animation:petWiggle .5s ease-in-out;}
  #petAct.a-spin{animation:petSpin .7s ease-in-out;}
  #petAct.a-sit{animation:petSit 1.8s ease-in-out;}
  #petAct.a-yawn{animation:petYawn 1.6s ease-in-out;}
  #petAct.a-tap{animation:petTap .6s steps(4,end);}
  #petAct.a-lean{animation:petLean 1.4s ease-in-out;}
  #petAct.a-shiver{animation:petShiver .8s ease-in-out;}
  #petAct.a-peek{animation:petPeek .9s ease-in-out;}
  @keyframes petSway{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  @keyframes petNod{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
  @keyframes petBigHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-15px)}70%{transform:translateY(-4px)}}
  @keyframes petLook{0%,100%{transform:rotate(0)}35%,65%{transform:rotate(-7deg)}}
  @keyframes petDroop{0%{transform:scale(1,1)}22%{transform:scale(1.07,.9)}55%,100%{transform:scale(1.02,.93)}}
  @keyframes petDance{0%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-11px) rotate(8deg)}100%{transform:translateY(0) rotate(-8deg)}}
  @keyframes petStretch{0%,100%{transform:scale(1,1)}35%{transform:scale(.94,1.14)}70%{transform:scale(1.06,.92)}}
  @keyframes petWiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}45%{transform:rotate(3deg)}70%{transform:rotate(-3deg)}}
  @keyframes petSpin{0%,100%{transform:rotate(0) translateY(0)}30%{transform:rotate(-13deg) translateY(-10px)}65%{transform:rotate(13deg) translateY(-10px)}}
  @keyframes petSit{0%,100%{transform:translateY(0) scale(1,1)}18%{transform:translateY(6px) scale(1.07,.9)}70%{transform:translateY(6px) scale(1.07,.9)}}
  @keyframes petYawn{0%,100%{transform:scale(1,1)}30%{transform:scale(.93,1.08) translateY(-2px)}65%{transform:scale(1.05,.94)}}
  @keyframes petTap{0%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}50%{transform:translateY(0)}75%{transform:translateY(-3px)}}
  @keyframes petLean{0%,100%{transform:rotate(0) translateY(0)}35%,70%{transform:rotate(6deg) translateY(2px)}}
  @keyframes petShiver{0%,100%{transform:translateX(0)}12%{transform:translateX(-2px)}28%{transform:translateX(2px)}44%{transform:translateX(-2px)}60%{transform:translateX(2px)}76%{transform:translateX(-1px)}}
  @keyframes petPeek{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-6px) scale(.96,1.05)}}


  /* ---------- 底栏 ---------- */
  #bottom{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:38px;padding:0 2px;}
  .moveInfo{flex:1 1 auto;font-size:9px;font-weight:800;letter-spacing:1px;color:var(--ink3);}
  .moveInfo b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;margin:0 2px;}
  /* 手数变化时数字弹一下 */
  .moveInfo b.bump{animation:numPop .24s steps(3,end);}
  @keyframes numPop{0%{transform:translateY(3px) scale(.78)}60%{transform:translateY(-2px) scale(1.16)}100%{transform:translateY(0) scale(1)}}
  .btnMini{flex:0 0 auto;padding:7px 10px;font-family:inherit;font-size:10px;font-weight:900;
    letter-spacing:1px;color:var(--ink);cursor:pointer;
    border:1px solid var(--line2);background:var(--paper2);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  .btnMini:active{transform:translate(1px,1px);}
  .btnMini[disabled]{opacity:.35;cursor:default;transform:none;}

/* 无效落子：棋盘左右轻推一下，只在非低功耗下播放 */
  @keyframes nudge{0%{transform:translate(0,0)}25%{transform:translate(-2px,0)}50%{transform:translate(2px,0)}75%{transform:translate(-1px,0)}100%{transform:translate(0,0)}}
  #boardWrap.shake{animation:nudge .16s steps(2) 1;}
  body.low #boardWrap.shake{animation:none;}

  /* ---------- 设置行（标题页） ---------- */
  .setRow{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 8px;}
  .setLbl{font-size:8px;font-weight:900;letter-spacing:1px;color:var(--ink3);}

  /* ---------- 低功耗：关扫描线、关动效 ---------- */
  body.low .scan{display:none;}
  body.low #boardWrap::after{opacity:.14;}
  body.low #hintBar{transition:none;}
  body.low *{animation:none !important;}

  /* ---------- 弹层 ---------- */
  #overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    padding:18px;background:rgba(246,243,234,.87);}
  #overlay.show{display:flex;}
  /* 弹层一格一格蹦出来：显示状态切换时自动重播 */
  #panel{animation:panelIn .27s steps(4,end);}
  @keyframes panelIn{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
  #overlay::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
    background:repeating-conic-gradient(var(--dither) 0% 25%,transparent 0% 50%) 0 0/4px 4px;}
  #panel{position:relative;width:min(90%,356px);max-height:100%;overflow-y:auto;overscroll-behavior:contain;
    padding:18px 16px 15px;text-align:center;
    background:var(--paper3);border:2px solid var(--ink);
    box-shadow:6px 6px 0 var(--dither);}
  #panel::before{content:'';position:absolute;inset:5px;pointer-events:none;opacity:.65;
    background:
      linear-gradient(var(--ink),var(--ink)) left top/12px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left top/2px 12px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right top/12px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right top/2px 12px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left bottom/12px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) left bottom/2px 12px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right bottom/12px 2px no-repeat,
      linear-gradient(var(--ink),var(--ink)) right bottom/2px 12px no-repeat;}
  .kicker{font-size:9px;font-weight:900;letter-spacing:4px;color:var(--ink3);}
  .ovTitle{font-size:24px;font-weight:900;letter-spacing:5px;margin:8px 0 4px;color:var(--ink);}
  .ovAvatar{width:64px;height:64px;margin:6px auto 4px;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--ink);background:var(--paper2);box-shadow:4px 4px 0 var(--dither);}
  .ovAvatar img,.ovAvatar svg{width:100%;height:100%;object-fit:contain;display:block;}
  .ovAvatar svg{filter:grayscale(1) contrast(1.15);}
  .ovName{font-size:12px;font-weight:900;letter-spacing:1.5px;color:var(--ink);margin-bottom:4px;}
  .ovLine{font-size:10px;line-height:1.7;color:var(--ink2);margin:0 auto 10px;max-width:270px;}
  .diffRow{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 8px;}
  .chip{padding:5px 10px;font-family:inherit;font-size:10px;font-weight:900;letter-spacing:1px;
    color:var(--ink2);cursor:pointer;border:1px solid var(--line2);background:transparent;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);}
  .chip.on{color:var(--paper);background:var(--ink);border-color:var(--ink);}
  .chip:active{transform:translate(1px,1px);}
  .ovRules{font-size:9px;line-height:1.8;color:var(--ink3);margin:2px 0 12px;letter-spacing:.5px;}
  .ovRow{display:flex;gap:8px;}
  .btnMain{flex:1 1 auto;padding:11px 0;cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:900;letter-spacing:2.5px;color:var(--paper);
    border:2px solid var(--ink);background:var(--ink);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);}
  .btnMain:active{transform:translate(1px,1px);}
  .btnGhost{flex:0 0 auto;padding:11px 12px;cursor:pointer;font-family:inherit;
    font-size:11px;font-weight:900;letter-spacing:1px;color:var(--ink);
    border:1px solid var(--line2);background:var(--paper2);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);}
  .btnGhost:active{transform:translate(1px,1px);}
  @media (hover:hover){
    .btnGhost:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  }
  .ovNote{margin-top:10px;padding-top:8px;font-size:9px;line-height:1.6;color:var(--ink3);
    border-top:1px dashed var(--line2);}
  /* ---------- 排行榜 ---------- */
  .lbTabs{display:flex;gap:6px;margin:10px 0 12px;}
  .lbTabs .chip{flex:1 1 0;padding:6px 0;}
  .lbList{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
  .lbRow{display:flex;align-items:center;gap:8px;padding:5px 8px;
    border:1px solid var(--line);background:var(--paper2);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  .lbRow.top{background:var(--paper3);border-color:var(--line2);box-shadow:3px 3px 0 var(--dither);}
  .lbRank{width:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums;}
  .lbRank svg{display:block;width:16px;height:16px;}
  .lbPic{width:24px;height:24px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--line2);background:var(--paper3);}
  .lbPic img,.lbPic svg{width:100%;height:100%;object-fit:contain;display:block;}
  .lbPic svg{filter:grayscale(1) contrast(1.15);}
  .lbName{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;text-align:left;
    font-size:10px;font-weight:900;letter-spacing:.6px;color:var(--ink);
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .lbName i{font-style:normal;font-size:8px;font-weight:700;letter-spacing:.6px;color:var(--ink3);}
  .lbScore{flex:0 0 auto;font-size:8.5px;font-weight:800;letter-spacing:.5px;color:var(--ink2);white-space:nowrap;}
  .lbScore b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .lbEmpty{padding:20px 10px;text-align:center;font-size:10px;line-height:1.8;letter-spacing:.5px;
    color:var(--ink3);border:1px dashed var(--line2);background:var(--paper2);}
  .lbNote{font-size:8.5px;line-height:1.7;letter-spacing:.5px;color:var(--ink3);margin:0 0 12px;}
  .ovStats{display:flex;align-items:center;justify-content:center;gap:20px;margin:6px 0 12px;}
  .ovStats div{display:flex;flex-direction:column;gap:2px;}
  .ovStats span{font-size:8px;font-weight:800;letter-spacing:1.6px;color:var(--ink3);}
  .ovStats b{font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;}
  .demoTag{display:inline-block;margin-bottom:9px;padding:2px 8px;font-size:8px;font-weight:900;
    letter-spacing:1px;color:var(--ink2);border:1px solid var(--line2);}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand"><span id="brandA">月巴</span> <b id="brandB">五子棋</b></div>
    <div class="stats">
      <div class="stat"><span id="lblW">胜</span><b id="wEl">0</b></div>
      <div class="stat"><span id="lblL">负</span><b id="lEl">0</b></div>
      <div class="stat"><span id="lblD">和</span><b id="dEl">0</b></div>
    </div>

  var d = TXT[lang] || TXT.zh;

  return k;
}
/* 占位符替换：tf('可对战 {n} 只', {n:12}) */
function tf(s, o){
  return String(s).replace(/\{(\w+)\}/g, function(m, k){
    return (o && o[k] != null) ? o[k] : m;
  });
}

/* ---------- 独立存档（只读写自己的键） ---------- */
function normSave(o){
  o = o || {};
  var diff = String(o.diff || 'normal');
  if (diff !== 'easy' && diff !== 'normal' && diff !== 'hard') diff = 'normal';
  return {
    wins: Math.max(0, parseInt(o.wins, 10) || 0),
    losses: Math.max(0, parseInt(o.losses, 10) || 0),
    draws: Math.max(0, parseInt(o.draws, 10) || 0),
    streak: Math.max(0, parseInt(o.streak, 10) || 0),
    bestStreak: Math.max(0, parseInt(o.bestStreak, 10) || 0),
    plays: Math.max(0, parseInt(o.plays, 10) || 0),
    diff: diff,
    lastOpp: String(o.lastOpp || ''),
    lb: normLb(o.lb),
    muted: (o.muted === true || o.muted === false) ? o.muted : null,
    lowPower: (o.lowPower === true || o.lowPower === false) ? o.lowPower : null,
    v: 1
  };
}
var S = normSave(null);
try { S = normSave(JSON.parse(localStorage.getItem(SAVE_KEY) || 'null')); } catch (e) {}
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* 台词池：每类一组 key，洗牌后逐个抽，抽空再洗，一局内不会连续重复 */
var SAY_POOLS = {
  greet:    ['greet1','greet2','greet3','greet4','greet5','greet6','greet7','greet8'],
  move:     ['sayMove1','sayMove2','sayMove3','sayMove4','sayMove5','sayMove6','sayMove7','sayMove8'],

/* 抽一条台词 key：池子抽完自动重洗 */
function drawLine(name){
  var all = SAY_POOLS[name] || [];
  if (!all.length) return '';
  var bag = SAY_BAG[name];
  if (!bag || !bag.length){
    bag = all.slice();
    for (var i = bag.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
    SAY_BAG[name] = bag;
  }
  return bag.pop();
}

/* ============================================================
   PART 3.5 · 音效 / 台词 / 动效状态（M4）
   音效全部用 Web Audio 合成，不加载任何音频文件
   ============================================================ */
var AC = null, master = null;

function initAudio(){
  if (AC || MUTED) return;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = 0.55;
    master.connect(AC.destination);
  } catch (e) { AC = null; master = null; }
}

function tone(freq, dur, type, vol, delay, slideTo){
  if (!AC || MUTED) return;
  try {
    if (AC.state === 'suspended') AC.resume();
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.05, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) {}
}

function haptic(ms){
  if (navigator.vibrate){ try { navigator.vibrate(ms); } catch (e) {} }
}

/* 玩家黑子：偏干的短促木质音；月巴白子：略低一档 */
function sfxPlace(who){

  } else {

    tone(200, 0.055, 'square', 0.03, 0.01);
  }
}
function sfxInvalid(){ tone(160, 0.09, 'sawtooth', 0.04, 0, 110); }
function sfxWin(){ tone(523, 0.14, 'square', 0.055); tone(659, 0.14, 'square', 0.055, 0.1); tone(784, 0.18, 'square', 0.06, 0.2); }
function sfxLose(){ tone(392, 0.18, 'triangle', 0.06); tone(294, 0.22, 'triangle', 0.055, 0.14); }
function sfxDraw(){ tone(330, 0.14, 'triangle', 0.05); tone(330, 0.14, 'triangle', 0.05, 0.2); }

/* 首次触摸才创建 AudioContext，避免自动播放策略拦截 */

/* ============================================================
   PART 3.6 · 月巴立绘（棋盘对面走来走去 + 冒出爱心 / 圈圈）
   立绘 = 父页下发的外链 PNG（OPP.art），无立绘时退回像素兔 SVG
   动效全部交给 CSS（走路 / 转身 / 弹跳 / Q 弹挤压），低功耗直接静止
   ============================================================ */
var EMO_LAST = 0;
var HEART_ROWS = ['0110110','1111111','1111111','0111110','0011100','0001000'];
var RING_ROWS  = ['0011100','0100010','1000001','1000001','1000001','0100010','0011100'];

/* 把 0/1 点阵转成 1-bit SVG，爱心与圈圈都走同一套像素语言 */
function pxShape(rows){
  var h = rows.length, w = rows[0].length, out = '';
  for (var y = 0; y < h; y++){
    for (var x = 0; x < w; x++){
      if (rows[y].charAt(x) === '1') out += '<rect x="' + x + '" y="' + y + '" width="1" height="1"/>';
    }
  }
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" shape-rendering="crispEdges" style="fill:#23231f">' + out + '</svg>';
}

/* 同一个对手不重复铺图：铺一次 img 就会重新解码一次，看起来像「闪一下」 */
var petOppId = null;

function renderPet(){
  if (!el.pet) return;
  if (!OPP){ el.pet.classList.remove('on'); return; }
  if (petOppId !== OPP.id){
    paintOpp(el.petArt);
    var img = el.petArt.querySelector('img');
    /* 立绘 PNG 的画布留白用 artScale 补一下：缩放放在 img 上，呼吸动画留给 #petArt */
    el.petArt.classList.toggle('art', !!img);
    el.petArt.style.transform = '';
    if (img){
      img.style.transformOrigin = '50% 100%';
      img.style.transform = 'scale(' + OPP.scale + ')';
    }
    petOppId = OPP.id;
  }
  el.pet.classList.add('on');
  layoutPet();
  if (ROAM.ready) roamSchedule(900);
}

/* ============================================================
   月巴活动区
   · 场地 = 棋盘上方整块空白（横向全宽，纵向从顶到棋盘上沿）
   · 位置只由 JS 补间写 #petPos 的 transform，不走 CSS 无限循环
   · 坐标跨局保留：换局 / 清盘 / 窗口缩放都不重置，不会「闪现」
   ============================================================ */
var ROAM = {
  x:0, y:0, w:0, h:0,
  left:0, right:0, top:0, bottom:0,
  ready:false, raf:0, walking:false, frozen:false, timer:null, face:1, sinceWalk:0
};

function petHeight(){
  var bw = el.boardWrap.offsetWidth || 0;
  return Math.max(44, Math.min(88, Math.round(bw * 0.19)));
}

/* 量场地：太窄（手机竖屏）就退化成贴棋盘沿的一条线，只做原地动作 */
function layoutPet(){
  if (!el.pet || !el.pet.classList.contains('on')) return;
  var bw = el.boardWrap.offsetWidth;
  if (!bw) return;
  if (ROAM.walking) roamStop();
  var ph = petHeight();
  var bl = el.boardWrap.offsetLeft, bt = el.boardWrap.offsetTop;
  /* 脚底压在棋盘上边框 20%，多出的部分交给棋盘挡住，像站在棋盘后面 */
  var floorY = Math.max(2, bt - ph + Math.round(ph * 0.2));
  var l = Math.max(2, bl + 2);
  var r = Math.max(l, bl + bw - ph - 2);
  var t = 2, b = floorY;
  if (b - t < ph * 0.62) t = b;

  ROAM.w = ph; ROAM.h = ph;
  ROAM.left = l; ROAM.right = r; ROAM.top = t; ROAM.bottom = b;
  el.petPos.style.width = ph + 'px';
  el.petPos.style.height = ph + 'px';

  if (!ROAM.ready){
    ROAM.x = Math.round((l + r) / 2);
    ROAM.y = b;
    ROAM.ready = true;
  } else {
    /* 只夹回场内，不重置坐标 */
    ROAM.x = Math.min(r, Math.max(l, ROAM.x));
    ROAM.y = Math.min(b, Math.max(t, ROAM.y));
  }
  roamApply();
  if (!ROAM.walking) roamSchedule(900);
}

/* 站得越高 = 离棋盘越远，按深度缩一点；脚底锚点不变 */
function roamApply(){
  if (!el.petPos) return;
  var span = ROAM.bottom - ROAM.top;
  var depth = span > 4 ? 1 - 0.22 * ((ROAM.bottom - ROAM.y) / span) : 1;
  el.petPos.style.transform = 'translate3d(' + Math.round(ROAM.x) + 'px,' +
    Math.round(ROAM.y) + 'px,0) scale(' + depth.toFixed(3) + ')';
}

/* JS 补间走位：只在移动期间跑 rAF，停下就彻底不占帧 */
function roamWalkTo(tx, ty, cb){
  roamStop();
  var x0 = ROAM.x, y0 = ROAM.y;
  var dx = tx - x0, dy = ty - y0;
  var dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 4 || ROAM.frozen || LOW || reduced || document.hidden){
    ROAM.x = tx; ROAM.y = ty; roamApply();
    roamSchedule(1400);
    if (cb) cb();
    return;
  }
  if (dx < -2) ROAM.face = -1; else if (dx > 2) ROAM.face = 1;
  if (el.petFlip) el.petFlip.style.transform = 'scaleX(' + ROAM.face + ')';
  var dur = Math.min(1200, Math.max(280, dist * 9));
  var t0 = performance.now();
  ROAM.walking = true;
  el.pet.classList.add('walking');
  function step(){
    var k = Math.min(1, (performance.now() - t0) / dur);
    var e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    ROAM.x = x0 + dx * e;
    ROAM.y = y0 + dy * e;
    roamApply();
    if (k < 1){ ROAM.raf = requestAnimationFrame(step); return; }
    ROAM.raf = 0;
    ROAM.walking = false;
    el.pet.classList.remove('walking');
    if (cb) cb();
  }
  ROAM.raf = requestAnimationFrame(step);
}

function roamStop(){
  if (ROAM.raf){ cancelAnimationFrame(ROAM.raf); ROAM.raf = 0; }
  ROAM.walking = false;
  if (el.pet) el.pet.classList.remove('walking');
}

/* 爱心 = 这步走得好；圈圈 = 这步走得差 / 被玩家压住 */
function petEmote(kind){
  if (!el.pet || !el.pet.classList.contains('on')) return;
  if (LOW || reduced) return;
  var now = performance.now();
  if (now - EMO_LAST < 650) return;
  EMO_LAST = now;
  var glyph = pxShape(kind === 'heart' ? HEART_ROWS : RING_ROWS);
  var n = kind === 'heart' ? 3 : 2;
  for (var i = 0; i < n; i++){
    setTimeout(function(idx){
      if (!el.pet.classList.contains('on')) return;
      var d = document.createElement('div');
      d.className = 'emo';
      d.innerHTML = glyph;
      /* 三颗爱心错开一点，别都挤在耳朵上变成一团墨 */
      var spread = idx - (n - 1) / 2;
      d.style.left = (50 + spread * 17 + (Math.random() * 6 - 3)) + '%';
      d.style.top = (-12 + Math.random() * 8) + '%';
      d.style.setProperty('--dx', Math.round(Math.random() * 22 - 11) + 'px');
      el.petEmo.appendChild(d);
      setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 1300);
    }, i * 190, i);
  }
}

/* ---------- 一次性小动作：直接换 class，同一个动作也能重播 ---------- */
var PET_ACT_T = null;
var ACT_MS = {
  sway:1000, nod:950, hop:1000, look:860, droop:1700, dance:2300,
  stretch:1160, wiggle:560, spin:760, sit:1800, yawn:1660,
  tap:660, lean:1460, shiver:860, peek:960
};

function petAct(name, ms){
  if (!el.pet || !el.petAct || !el.pet.classList.contains('on')) return;
  if (LOW || reduced || !name) return;
  el.petAct.className = '';
  void el.petAct.offsetWidth;          /* 强制回流，让同一个动作能重播 */
  el.petAct.className = 'a-' + name;
  clearTimeout(PET_ACT_T);
  PET_ACT_T = setTimeout(function(){
    if (el.petAct) el.petAct.className = '';
  }, ms || ACT_MS[name] || 1000);
}

/* 思考中：停住不走，只在原地左右摇晃 */
function petThink(on){
  if (el.pet) el.pet.classList.toggle('think', !!on);
  if (on) roamStop();                  /* 半路停下也留在当前位置，不瞬移 */
  roamSchedule(on ? 1200 : 700);
}

/* ---------- 行为调度：发呆 / 原地小动作 / 换一块地方站 ---------- */
var POOL_MOVE  = ['sway','stretch','hop','look','peek','spin','nod','wiggle'];
var POOL_PLAY  = ['sway','stretch','nod','look','peek','tap','wiggle','sit'];
var POOL_THINK = ['sway','wiggle','look','sit','peek'];
var POOL_SOON  = ['nod','sway','look','stretch','peek'];

function pickFrom(list){ return list[Math.floor(Math.random() * list.length)]; }

function roamPool(){
  if (state === 'thinking') return POOL_THINK;
  if (state === 'playing') return POOL_PLAY;
  return POOL_MOVE;
}

function roamSchedule(ms){
  clearTimeout(ROAM.timer);
  ROAM.timer = null;
  if (ROAM.frozen || LOW || reduced) return;
  ROAM.timer = setTimeout(function(){ ROAM.timer = null; roamDecide(); }, ms);
}

function roamDecide(){
  ROAM.timer = null;
  if (ROAM.frozen || LOW || reduced || ROAM.walking) return;
  if (!el.pet || !el.pet.classList.contains('on') || !ROAM.ready) return;
  if (document.hidden) return;
  if (document.body.classList.contains('ov-on')) return;   /* 弹层挡着时看不见，不动 */
  if (state === 'paused' || state === 'confirm') return;

  /* 思考 / 结算表态：站定原地，只做小动作 */
  if (state === 'thinking' || state === 'over'){
    petAct(pickFrom(POOL_THINK));
    roamSchedule(1700 + Math.random() * 2200);
    return;
  }

  /* 场地够高时换个位置站；连续原地三次就强制走一趟，避免一直钉在同一个点 */
  if (ROAM.bottom - ROAM.top > 2 && (ROAM.sinceWalk >= 3 || Math.random() < 0.34)){
    ROAM.sinceWalk = 0;
    var nx = ROAM.left + Math.random() * (ROAM.right - ROAM.left);
    if (Math.abs(nx - ROAM.x) < 44) nx += (nx < ROAM.x ? -44 : 44);
    nx = Math.min(ROAM.right, Math.max(ROAM.left, nx));
    /* 七成待在靠棋盘的下半段，三成才往高处站（越高越远、越小） */
    var span = ROAM.bottom - ROAM.top;
    var ny = ROAM.bottom - Math.random() * span * (Math.random() < 0.7 ? 0.55 : 1);
    roamWalkTo(nx, ny, function(){
      if (ROAM.frozen || state === 'over'){ roamSchedule(1400); return; }
      if (Math.random() < 0.75) petAct(pickFrom(POOL_SOON));
      roamSchedule(1900 + Math.random() * 2800);
    });
    return;
  }

  /* 原地待着时累加；攒够三次下一次就强制走一趟，不会永远钉在一个点 */
  ROAM.sinceWalk++;
  petAct(Math.random() < 0.09 ? 'yawn' : pickFrom(roamPool()));
  roamSchedule(2000 + Math.random() * 2800);
}

/* ---------- 落子动画：先小石再落定（跑到 270ms，等耳朵回弹收住） ---------- */
var STONE_ANIM = null, STONE_RAF = 0;

function startDropAnim(x, y){
  if (LOW || reduced){
    STONE_ANIM = null;
    if (STONE_RAF){ cancelAnimationFrame(STONE_RAF); STONE_RAF = 0; }
    return;
  }
  if (STONE_RAF) cancelAnimationFrame(STONE_RAF);
  STONE_ANIM = {x:x, y:y, t0:performance.now()};
  stoneStep();
}
function stoneStep(){
  STONE_RAF = 0;
  if (!STONE_ANIM) return;
  drawBoard();
  if (performance.now() - STONE_ANIM.t0 < 270){
    STONE_RAF = requestAnimationFrame(stoneStep);
    return;
  }
  STONE_ANIM = null;
  drawBoard();
}

/* ---------- 胜利闪烁：四角块交替 ---------- */
var WIN_FLASH = 0, WIN_RAF = 0, WIN_PHASE = -1;

function startWinFlash(){
  if (LOW || reduced || !winCells) return;
  if (WIN_RAF) cancelAnimationFrame(WIN_RAF);
  WIN_FLASH = performance.now();
  WIN_PHASE = -1;
  winStep();
}
function winStep(){
  WIN_RAF = 0;
  if (!winCells) return;
  var age = performance.now() - WIN_FLASH;
  if (age > 700){
    WIN_FLASH = 0;
    drawBoard();
    return;
  }
  var ph = Math.floor(age / 110) & 1;
  if (ph !== WIN_PHASE){ WIN_PHASE = ph; drawBoard(); }
  WIN_RAF = requestAnimationFrame(winStep);
}

/* ---------- 落子冲击波：像素圆环扩散 + 四角碎屑（380ms） ---------- */
var PLACE_FX = null, PLACE_RAF = 0;

function startPlaceFx(x, y){
  if (LOW || reduced) return;
  if (PLACE_RAF) cancelAnimationFrame(PLACE_RAF);
  PLACE_FX = {x:x, y:y, t0:performance.now()};
  placeFxStep();
}
function placeFxStep(){
  PLACE_RAF = 0;
  if (!PLACE_FX) return;
  drawBoard();
  if (performance.now() - PLACE_FX.t0 < 380){
    PLACE_RAF = requestAnimationFrame(placeFxStep);
  } else {
    PLACE_FX = null;
    drawBoard();
  }
}

function drawPlaceFx(ctx){
  if (!PLACE_FX) return;
  var age = performance.now() - PLACE_FX.t0;
  if (age < 0 || age > 380) return;
  var cx = gx(PLACE_FX.x), cy = gx(PLACE_FX.y);

  /* 圆环：20 个 3×3 像素点拼一圈，越扩越淡 */
  var k = Math.min(1, age / 300);
  var r = 6 + k * 25;
  ctx.fillStyle = 'rgba(35,35,31,' + (0.08 + 0.54 * (1 - k)) + ')';
  for (var i = 0; i < 20; i++){
    var a = i / 20 * Math.PI * 2;
    ctx.fillRect(cx + Math.round(Math.cos(a) * r) - 1, cy + Math.round(Math.sin(a) * r) - 1, 3, 3);
  }

  /* 四角碎屑：前 190ms 向外飞散，边飞边淡 */
  if (age < 190){
    var d = 6 + age / 190 * 15;
    ctx.fillStyle = 'rgba(35,35,31,' + (0.8 * (1 - age / 190)) + ')';
    var dirs = [[-1,-1],[1,-1],[-1,1],[1,1]];
    for (var j = 0; j < 4; j++){
      ctx.fillRect(cx + Math.round(dirs[j][0] * d) - 1, cy + Math.round(dirs[j][1] * d) - 1, 2, 2);
    }
  }
}

/* ---------- 五连礼花：像素方片向上炸开后受重力落下（1.4s） ---------- */
var WIN_FX = null, WIN_FX_RAF = 0;

function startWinFx(line){
  if (LOW || reduced || !line || !line.length) return;
  if (WIN_FX_RAF) cancelAnimationFrame(WIN_FX_RAF);
  var bits = [];
  for (var i = 0; i < line.length; i++){
    for (var j = 0; j < 4; j++){
      bits.push({
        x: gx(line[i].x) + (Math.random() * 8 - 4),
        y: gx(line[i].y) + (Math.random() * 8 - 4),
        vx: Math.random() * 84 - 42,
        vy: -(50 + Math.random() * 95),
        s: Math.random() < 0.34 ? 3 : 2,
        life: 0.9 + Math.random() * 0.5
      });
    }
  }
  WIN_FX = {bits: bits, t0: performance.now()};
  winFxStep();
}
function winFxStep(){
  WIN_FX_RAF = 0;
  if (!WIN_FX) return;
  drawBoard();
  if (performance.now() - WIN_FX.t0 < 1450){
    WIN_FX_RAF = requestAnimationFrame(winFxStep);
  } else {
    WIN_FX = null;
    drawBoard();
  }
}

function drawWinFx(ctx){
  if (!WIN_FX) return;
  var age = (performance.now() - WIN_FX.t0) / 1000;
  if (age > 1.45) return;
  var bits = WIN_FX.bits;
  for (var i = 0; i < bits.length; i++){
    var b = bits[i];
    if (age > b.life) continue;
    var px = b.x + b.vx * age;
    var py = b.y + b.vy * age + 95 * age * age;
    if (py > LOGIC + 8 || py < -8) continue;
    ctx.fillStyle = 'rgba(35,35,31,' + (0.92 * (1 - age / b.life)) + ')';
    ctx.fillRect(Math.round(px), Math.round(py), b.s, b.s);
  }
}


/* ============================================================
   PART 4 · 棋盘模型 + Canvas 绘制（M2）
   模型：cells 225 项 Uint8Array（0 空 / 1 玩家 / 2 月巴）
   逻辑坐标固定 480，边距 37、步长 29，全部整数，保证像素对齐
   ============================================================ */
var N = 15;
var LOGIC = 480, MARGIN = 37, STEP = 29;
var CELL_TOL = 3;          /* 点击命中额外容差（显示像素） */

var cells = new Uint8Array(N * N);
var history = [];          /* {x,y,who}，who: 1 玩家 / 2 月巴 */
var lastMove = null;
var lastBy = [null, null, null];   /* 各方最后一手：1 玩家 2 月巴，用于戴兔子耳朵 */
var winCells = null;
var hoverCell = null;
var aiTimer = null;
var aiPending = false;
var busyLock = 0;

function gx(v){ return MARGIN + v * STEP; }

function fitBoard(){
  var w = el.frame.clientWidth - 12;
  var h = el.frame.clientHeight - 12;
  var size = Math.max(160, Math.min(520, Math.floor(Math.min(w, h))));
  el.boardWrap.style.width = size + 'px';
  el.boardWrap.style.height = size + 'px';
  layoutPet();
  drawBoard();
}

function drawBoard(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var px = Math.floor(LOGIC * dpr);
  /* 尺寸只在真正变化时才重设，避免每次重绘都清屏导致闪烁 */
  if (el.cv.width !== px || el.cv.height !== px){
    el.cv.width = px;
    el.cv.height = px;
  }
  var ctx = el.cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, LOGIC, LOGIC);

  /* 网格：1px 实心像素线，不做抗锯齿 */
  ctx.fillStyle = 'rgba(35,35,31,.5)';
  var g0 = gx(0), gE = gx(N - 1);
  for (var i = 0; i < N; i++){
    ctx.fillRect(gx(i), g0, 1, gE - g0 + 1);
    ctx.fillRect(g0, gx(i), gE - g0 + 1, 1);
  }

  /* 星位：小方块 */
  var stars = [[3,3],[11,3],[7,7],[3,11],[11,11]];
  ctx.fillStyle = 'rgba(35,35,31,.92)';
  for (var s = 0; s < stars.length; s++){
    var sx = gx(stars[s][0]), sy = gx(stars[s][1]);
    ctx.fillRect(sx - 1, sy - 1, 3, 3);
  }

  /* 落子冲击波：画在棋子下面，只露出扩散到棋子外的一圈 */
  drawPlaceFx(ctx);

  /* 悬停预览（只画空点） */
  if (hoverCell && state === 'playing' && !cells[hoverCell.y * N + hoverCell.x]){
    drawStone(ctx, hoverCell.x, hoverCell.y, 1, true);
  }

  /* 棋子 */
  for (var y = 0; y < N; y++){
    for (var x = 0; x < N; x++){
      var v = cells[y * N + x];
      if (v) drawStone(ctx, x, y, v, false);
    }
  }

  /* 兔子耳朵：双方各自的最后一手都戴一对，画在棋子之上保证看得见 */
  if (lastBy[1]) drawEars(ctx, lastBy[1].x, lastBy[1].y);
  if (lastBy[2]) drawEars(ctx, lastBy[2].x, lastBy[2].y);

  /* 最后一手：四角小方块 */
  if (lastMove && !winCells) drawTicks(ctx, lastMove.x, lastMove.y, lastMove.who);

  /* 五连：四角块交替闪烁 */
  if (winCells){
    var ph = 0;
    if (WIN_FLASH && !LOW && !reduced){
      ph = Math.floor((performance.now() - WIN_FLASH) / 110) & 1;
    }
    for (var w2 = 0; w2 < winCells.length; w2++){
      drawWinBox(ctx, winCells[w2].x, winCells[w2].y, ((w2 + ph) & 1) === 0);
    }
  }

  /* 五连礼花：压在最上层 */
  drawWinFx(ctx);
}

/* ---------- 像素棋子：11×11 圆形掩码，px 1/2 阶梯放大 ---------- */
var MASK_N = 11;

function buildMask(size){
  var r = size / 2, c = (size - 1) / 2, m = [];
  for (var y = 0; y < size; y++){
    var row = [];
    for (var x = 0; x < size; x++){
      var dx = x - c, dy = y - c;
      row.push((dx * dx + dy * dy) <= r * r + 0.2 ? 1 : 0);
    }
    m.push(row);
  }
  return m;
}

/* 内缩一圈：白子的纸色芯 */
function innerMask(m){
  var n = m.length, out = [];
  for (var y = 0; y < n; y++){
    var row = [];
    for (var x = 0; x < n; x++){
      var on = m[y][x];
      if (!on){ row.push(0); continue; }
      var edge = x === 0 || y === 0 || x === n - 1 || y === n - 1
        || !m[y - 1][x] || !m[y + 1][x] || !m[y][x - 1] || !m[y][x + 1];
      row.push(edge ? 0 : 1);
    }
    out.push(row);
  }
  return out;
}

var MASK = buildMask(MASK_N);
var MASK_IN = innerMask(MASK);
var MASK_CORE = innerMask(MASK_IN);   /* 内缩两圈：白子纸色芯，保证墨描边足够厚 */

function fillMask(ctx, mask, ox, oy, px, color, dither){
  ctx.fillStyle = color;
  for (var y = 0; y < mask.length; y++){
    var row = mask[y];
    for (var x = 0; x < row.length; x++){
      if (!row[x]) continue;
      if (dither && ((x + y) & 1)) continue;
      ctx.fillRect(ox + x * px, oy + y * px, px, px);
    }
  }
}

/* 落子动画的垂直偏移：由上往下压三级，90ms 内结束 */
function liftAt(age){
  return age < 90 ? -8 + Math.floor(age / 30) * 4 : 0;
}
function stoneLift(x, y){
  if (!STONE_ANIM || STONE_ANIM.x !== x || STONE_ANIM.y !== y) return 0;
  return liftAt(performance.now() - STONE_ANIM.t0);
}

/* 耳朵跟着棋子动：先落后棋子半拍被顶起来，落地后再弹两下收住 */
function earLift(x, y){
  if (!STONE_ANIM || STONE_ANIM.x !== x || STONE_ANIM.y !== y) return 0;
  var age = performance.now() - STONE_ANIM.t0 - 34;   /* 拖尾半拍 */
  if (age < 0) return -8;
  if (age < 90) return liftAt(age);
  var t = (age - 90) / 130;                            /* 0→1 弹性余振 */
  if (t >= 1) return 0;
  return Math.round(Math.sin(t * Math.PI * 2.4) * 3 * (1 - t));
}

/* ---------- 兔子耳朵：双方最后一手各戴一对，原始 8 行 × 5 列，按 EAR_SCALE 缩短 ---------- */
var EAR_SCALE = 0.65;
var EAR_ROWS = [
  [0,1,1,1,0],
  [1,1,1,1,1],
  [1,1,2,1,1],
  [1,1,2,1,1],
  [1,1,2,1,1],
  [1,1,2,1,1],
  [1,1,2,1,1],
  [1,1,1,1,1]
];
var EAR_INK = '#23231f', EAR_INNER = '#e6e1d2';
var EAR_N = Math.max(3, Math.round(EAR_ROWS.length * EAR_SCALE));   /* 8 行 → 5 行 */

function drawEar(ctx, ox, oy, px){
  for (var y = 0; y < EAR_N; y++){
    var row = EAR_ROWS[y];
    for (var x = 0; x < row.length; x++){
      if (!row[x]) continue;
      ctx.fillStyle = row[x] === 2 ? EAR_INNER : EAR_INK;
      ctx.fillRect(ox + x * px, oy + y * px, px, px);
    }
  }
}

function drawEars(ctx, x, y){
  var cx = gx(x), cy = gx(y), px = 2;
  var h = EAR_N * px;                    /* 缩短后的耳朵总高 */
  /* 耳根埋进棋子头顶 3px，并和棋子共用一套落子位移（earLift 额外带拖尾与回弹） */
  var oy = cy - 11 + 3 - h + earLift(x, y);
  drawEar(ctx, cx - 10, oy, px);         /* 左耳 */
  drawEar(ctx, cx + 1, oy, px);          /* 右耳 */
}

function drawStone(ctx, x, y, who, ghost){
  var cx = gx(x), cy = gx(y);
  var size = 2, lift = ghost ? 0 : stoneLift(x, y);
  var ox = cx - Math.round(MASK_N * size / 2);
  var oy = cy - Math.round(MASK_N * size / 2) + lift;

  if (ghost){
    ctx.save();
    ctx.globalAlpha = 0.4;
    fillMask(ctx, MASK, ox, oy, size, '#23231f', true);
    ctx.restore();
    return;
  }
  if (who === 1){
    fillMask(ctx, MASK, ox, oy, size, '#23231f', false);
    ctx.fillStyle = 'rgba(246,243,234,.8)';
    ctx.fillRect(ox + 8 * size, oy + 8 * size, size, size);
  } else {
    fillMask(ctx, MASK, ox, oy, size, '#23231f', false);
    fillMask(ctx, MASK_CORE, ox, oy, size, '#fdfbf3', false);
    ctx.fillStyle = '#23231f';
    ctx.fillRect(cx - 1, cy - 1, 2, 2);
  }
}

/* 最后一手标记：四角小方块，黑子用纸色、白子用墨色 */
function drawTicks(ctx, x, y, who){
  var cx = gx(x), cy = gx(y), d = 13, s = 3;
  ctx.fillStyle = who === 1 ? 'rgba(246,243,234,.95)' : 'rgba(35,35,31,.9)';
  var signs = [[-1,-1],[1,-1],[-1,1],[1,1]];
  for (var i = 0; i < signs.length; i++){
    var sx = cx + signs[i][0] * d - (signs[i][0] < 0 ? 0 : s);
    var sy = cy + signs[i][1] * d - (signs[i][1] < 0 ? 0 : s);
    ctx.fillRect(sx, sy, s, s);
  }
}

/* 五连标记：大块=亮起，小块=熄灭 */
function drawWinBox(ctx, x, y, filled){
  var cx = gx(x), cy = gx(y), d = 15, s = filled ? 5 : 2;
  ctx.fillStyle = filled ? 'rgba(35,35,31,.95)' : 'rgba(35,35,31,.26)';
  var signs = [[-1,-1],[1,-1],[-1,1],[1,1]];
  for (var i = 0; i < signs.length; i++){
    var sx = cx + signs[i][0] * d - (signs[i][0] < 0 ? 0 : s);
    var sy = cy + signs[i][1] * d - (signs[i][1] < 0 ? 0 : s);
    ctx.fillRect(sx, sy, s, s);
  }
}

/* 屏幕坐标 → 最近交叉点；超出容差返回 null */
function cellFromEvent(e){
  var rect = el.cv.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  var lx = (e.clientX - rect.left) / rect.width * LOGIC;
  var ly = (e.clientY - rect.top) / rect.height * LOGIC;
  var x = Math.round((lx - MARGIN) / STEP);
  var y = Math.round((ly - MARGIN) / STEP);
  if (x < 0 || x >= N || y < 0 || y >= N) return null;
  var tol = STEP / 2 + CELL_TOL * (LOGIC / rect.width);
  var dx = lx - gx(x), dy = ly - gx(y);
  if (Math.sqrt(dx * dx + dy * dy) > tol) return null;
  return {x:x, y:y};
}

/* 四个方向五连判定（返回连线格子；长连同样算胜） */
function checkWin(x, y, who){
  var dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for (var d = 0; d < 4; d++){
    var dx = dirs[d][0], dy = dirs[d][1];
    var line = [{x:x, y:y}];
    for (var a = 1; a < 5; a++){
      var nx = x + dx * a, ny = y + dy * a;
      if (nx < 0 || nx >= N || ny < 0 || ny >= N) break;
      if (cells[ny * N + nx] !== who) break;
      line.push({x:nx, y:ny});
    }
    for (var b = 1; b < 5; b++){
      var bx = x - dx * b, by = y - dy * b;
      if (bx < 0 || bx >= N || by < 0 || by >= N) break;
      if (cells[by * N + bx] !== who) break;
      line.unshift({x:bx, y:by});
    }
    if (line.length >= 5) return line;
  }
  return null;
}

/* ============================================================
   PART 5 · 弹层
   ============================================================ */

/* ============================================================
   PART 5.4 · 排行榜（本地 · 按难度记录自己最快获胜）
   只记玩家获胜的局，手数越少越靠前；榜行头像沿用棋盘立绘
   ============================================================ */
var LB_MAX = 6;
var LB_DIFFS = ['easy', 'normal', 'hard'];
var lbTab = 'normal';
var lbFrom = null;
var LAST_RESULT = 0, LAST_DEMO = false;

var LB_ICON_CROWN = '<svg viewBox="0 0 16 16" aria-hidden="true">'
  + '<path d="M2.4 10.5V6.1l3.1 3.4L8 4.1l2.5 5.4 3.1-3.4v4.4z" fill="currentColor"/>'
  + '<rect x="2.4" y="11.7" width="11.2" height="1.5" fill="currentColor"/></svg>';
var LB_ICON_MEDAL = '<svg viewBox="0 0 16 16" aria-hidden="true">'
  + '<path d="M5.1 1.5h2.2l1 3.7H5.5zM10.9 1.5H8.7l-1 3.7h3.5z" fill="currentColor"/>'
  + '<circle cx="8" cy="10.7" r="3.9" fill="none" stroke="currentColor" stroke-width="1.4"/>'
  + '<circle cx="8" cy="10.7" r="1.4" fill="currentColor"/></svg>';

function emptyLb(){ return {easy:[], normal:[], hard:[]}; }

function normLbRec(r){
  if (!r || typeof r !== 'object') return null;
  var m = parseInt(r.m, 10);
  if (!(m > 0)) return null;
  return {
    m: m,
    id: String(r.id || ''),
    n: String(r.n || ''),
    c: String(r.c || ''),
    t: Math.max(0, parseInt(r.t, 10) || 0)
  };
}

function normLb(o){
  o = (o && typeof o === 'object') ? o : {};
  var out = emptyLb();
  var keys = ['easy', 'normal', 'hard'];
  for (var i = 0; i < keys.length; i++){
    var k = keys[i];
    var arr = Array.isArray(o[k]) ? o[k] : [];
    for (var j = 0; j < arr.length; j++){
      var rec = normLbRec(arr[j]);
      if (rec) out[k].push(rec);
    }
    out[k].sort(function(a, b){ return a.m - b.m || b.t - a.t; });
    out[k] = out[k].slice(0, 6);
  }
  return out;
}

function lbAdd(moves){
  if (!OPP || !(moves > 0)) return;
  S.lb[S.diff].push({ m: moves, id: OPP.id, n: OPP.name, c: OPP.color, t: Date.now() });
  S.lb[S.diff].sort(function(a, b){ return a.m - b.m || b.t - a.t; });
  S.lb[S.diff] = S.lb[S.diff].slice(0, LB_MAX);
}

function escHTML(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '"' ? '&quot;' : '&#39;';
  });
}

function findOppById(r){
  var id = String((r && r.id) || '');
  var src = (ROSTER && ROSTER.length) ? ROSTER : FB_LIST;

/* ============================================================
   PART 6.5 · AI（M3）
   评分口径：成五 1e7 / 活四 1e6 / 冲四 1e5 / 活三 1e4 / 眠三 1e3 / 活二 100 / 眠二 10
   三档：easy 看 1 层（距离 1，30% 随机）；normal 看 2 层（距离 2，8% 随机）；
         hard 4 层 alpha-beta（距离 2，候选前 12，无随机）
   决策顺序：我能成五 → 对手能成五必堵 → 堵冲四 → 按档位搜索
   ============================================================ */
var DIRS = [[1,0],[0,1],[1,1],[1,-1]];
var AI_NODES = 0;
var AI_NODE_CAP = 2600;
var AI_DEADLINE = 0;
var AI_TIME_MS = {easy:0, normal:140, hard:420};
var AI_THINK_MS = {easy:300, normal:340, hard:300};
var AI_SPREAD = {easy:0.30, normal:0.08, hard:0};
var AI_WIDTH = [12, 8, 5, 3];

function inBoard(x, y){ return x >= 0 && x < N && y >= 0 && y < N; }

/* 假设中心已属于 who：统计该方向连子数与两端是否开放 */
function runInfo(bd, x, y, who, dx, dy){
  var len = 1, openA = 0, openB = 0, i, nx, ny, v;
  for (i = 1; i <= 4; i++){
    nx = x + dx * i; ny = y + dy * i;
    if (!inBoard(nx, ny)) break;
    v = bd[ny * N + nx];
    if (v === who) len++;
    else { if (v === 0) openA = 1; break; }
  }
  for (i = 1; i <= 4; i++){
    nx = x - dx * i; ny = y - dy * i;
    if (!inBoard(nx, ny)) break;
    v = bd[ny * N + nx];
    if (v === who) len++;
    else { if (v === 0) openB = 1; break; }
  }
  return {len:len, open:openA + openB};
}

/* 单点价值：假设 who 落在此处 */
function pointScore(bd, x, y, who){
  var total = 0;
  for (var d = 0; d < 4; d++){
    var r = runInfo(bd, x, y, who, DIRS[d][0], DIRS[d][1]);
    var s;
    if (r.len >= 5) s = 1e7;
    else if (r.len === 4) s = r.open === 2 ? 1e6 : (r.open === 1 ? 1e5 : 0);
    else if (r.len === 3) s = r.open === 2 ? 1e4 : (r.open === 1 ? 1e3 : 0);
    else if (r.len === 2) s = r.open === 2 ? 100 : (r.open === 1 ? 10 : 0);
    else s = r.open === 2 ? 5 : 0;
    total += s;
  }
  return total;
}

/* 候选生成：距已有棋子 dist 格内（切比雪夫），按 攻 + 守×1.1 排序 */
function genCands(bd, me, opp, dist, limit){
  var near = new Uint8Array(N * N);
  var i, x, y, dx, dy, nx, ny;
  for (i = 0; i < N * N; i++){
    if (!bd[i]) continue;
    x = i % N; y = (i / N) | 0;
    for (dy = -dist; dy <= dist; dy++){
      for (dx = -dist; dx <= dist; dx++){
        nx = x + dx; ny = y + dy;
        if (nx >= 0 && nx < N && ny >= 0 && ny < N) near[ny * N + nx] = 1;
      }
    }
  }
  var list = [];
  for (i = 0; i < N * N; i++){
    if (bd[i] || !near[i]) continue;
    x = i % N; y = (i / N) | 0;
    var off = pointScore(bd, x, y, me);
    var def = pointScore(bd, x, y, opp);
    list.push({x:x, y:y, off:off, def:def, score:off + def * 1.1});
  }
  list.sort(function(a, b){ return b.score - a.score; });
  if (limit && list.length > limit) list.length = limit;
  return list;
}

/* 超出候选的兜底：棋盘上任意空点 */
function nearestEmpty(bd){
  for (var i = 0; i < N * N; i++){
    if (!bd[i]) return {x:i % N, y:(i / N) | 0};
  }
  return null;
}

function bestThreat(cands, min){
  var best = null;
  for (var i = 0; i < cands.length; i++){
    var c = cands[i];
    if (c.def >= min && (!best || c.def > best.def)) best = c;
  }
  return best;
}

/* 叶节点：当前走子方的最佳进攻 − 对手最佳进攻 ×1.1 */
function evalLeaf(bd, me, opp){
  var c = genCands(bd, me, opp, 2, 16);
  if (!c.length) return 0;
  var bestOff = 0, bestDef = 0;
  for (var i = 0; i < c.length; i++){
    if (c[i].off > bestOff) bestOff = c[i].off;
    if (c[i].def > bestDef) bestDef = c[i].def;
  }
  return bestOff - bestDef * 1.1;
}

function negamax(bd, depth, alpha, beta, me, opp, level){
  if (depth === 0 || AI_NODES > AI_NODE_CAP || performance.now() > AI_DEADLINE){
    return evalLeaf(bd, me, opp);
  }
  var cands = genCands(bd, me, opp, 2, AI_WIDTH[level] || 3);
  if (!cands.length) return evalLeaf(bd, me, opp);

  var best = -1e9;
  for (var i = 0; i < cands.length; i++){
    var c = cands[i];
    if (c.off >= 1e7) return 1e7 - level;   /* 能直接成五，越早越好 */
    bd[c.y * N + c.x] = me;
    AI_NODES++;
    var v = -negamax(bd, depth - 1, -beta, -alpha, opp, me, level + 1);
    bd[c.y * N + c.x] = 0;
    if (v > best) best = v;
    if (best > alpha) alpha = best;
    if (alpha >= beta) break;
  }
  return best;
}

/* normal：两层——我方落子后看对手最佳应手威胁 */
function normalMove(bd, me, opp, cands){
  var top = cands.slice(0, 20);
  var scored = [];
  for (var i = 0; i < top.length; i++){
    var c = top[i];
    bd[c.y * N + c.x] = me;
    var rc = genCands(bd, opp, me, 2, 1);
    bd[c.y * N + c.x] = 0;
    var threat = rc.length ? rc[0].off : 0;
    scored.push({x:c.x, y:c.y, val:c.score - threat * 1.1});
  }
  scored.sort(function(a, b){ return b.val - a.val; });
  var pick = scored[0];
  if (scored.length > 1 && Math.random() < AI_SPREAD.normal){
    pick = scored[Math.floor(Math.random() * Math.min(3, scored.length))];
  }
  return {x:pick.x, y:pick.y};
}

/* hard：根层遍历候选前 12，再跑 3 层 negamax（合计 4 层） */
function hardMove(bd, me, opp, cands){
  AI_NODES = 0;
  AI_DEADLINE = performance.now() + AI_TIME_MS.hard;
  var top = cands.slice(0, AI_WIDTH[0]);
  var best = top[0], bestVal = -1e9;
  for (var i = 0; i < top.length; i++){
    var c = top[i];
    bd[c.y * N + c.x] = me;
    var v = -negamax(bd, 3, -1e9, 1e9, opp, me, 1);
    bd[c.y * N + c.x] = 0;
    if (v > bestVal){ bestVal = v; best = c; }
    if (bestVal >= 1e7) break;
  }
  return {x:best.x, y:best.y};
}

/* 三档主入口；bd 为棋盘数组，返回 {x,y} */
function aiBestMove(bd, who, opp, diff){
  var i, empty = true;
  for (i = 0; i < N * N; i++){ if (bd[i]){ empty = false; break; } }
  if (empty) return {x:7, y:7};

  var dist = (diff === 'easy') ? 1 : 2;
  var cap = diff === 'easy' ? 24 : (diff === 'normal' ? 60 : 90);
  var cands = genCands(bd, who, opp, dist, cap);
  if (!cands.length) return nearestEmpty(bd);

  /* 1. 一步成五 */
  for (i = 0; i < cands.length; i++){
    if (cands[i].off >= 1e7) return {x:cands[i].x, y:cands[i].y};
  }
  /* 2. 对手能一步成五 → 必堵 */
  var block = bestThreat(cands, 1e7);
  if (block) return {x:block.x, y:block.y};

  /* 3. easy：只看自己的进攻（会漏活三），前 5 个里 30% 随机 */
  if (diff === 'easy'){
    var atk = cands.slice().sort(function(a, b){ return b.off - a.off; });
    var top = atk.slice(0, Math.min(5, atk.length));
    if (Math.random() < AI_SPREAD.easy) return top[Math.floor(Math.random() * top.length)];
    return {x:atk[0].x, y:atk[0].y};
  }

  /* 4. normal / hard：先堵冲四（活四及以上） */
  block = bestThreat(cands, 1e5);
  if (block) return {x:block.x, y:block.y};

  if (diff === 'normal') return normalMove(bd, who, opp, cands);
  return hardMove(bd, who, opp, cands);
}

/* 落点接口保持不变：由 aiPlace() 调用 */
function aiPick(){
  return aiBestMove(cells, 2, 1, S.diff);
}

function aiPlace(){
  var m = aiPick();
  if (!m){ finish(0, null); return; }

  /* 这一手是否在回应玩家的大威胁（冲四及以上） */
  var danger = pointScore(cells, m.x, m.y, 1) >= 1e5;
  /* 自己这一手的进攻价值（活二以上才算走出东西） */
  var gain = pointScore(cells, m.x, m.y, 2);

  cells[m.y * N + m.x] = 2;
  history.push({x:m.x, y:m.y, who:2});
  lastMove = {x:m.x, y:m.y, who:2};
  lastBy[2] = {x:m.x, y:m.y};
  MOVE_COUNT = history.length;
  el.moveEl.textContent = MOVE_COUNT;
  bumpMove();
  sfxPlace(2);
  startDropAnim(m.x, m.y);
  startPlaceFx(m.x, m.y);
  drawBoard();

  var line = checkWin(m.x, m.y, 2);
  if (line){ finish(-1, line); return; }
  if (history.length >= N * N){ finish(0, null); return; }

  petThink(false);
  if (danger) sayPool('block');
  /* 走得好（挡住大威胁 / 自己做出冲四以上）原地蹦一下冒爱心；
     普通一手点点头；走得差（这手没什么内容）冒圈圈 */
  if (danger || gain >= 1e5){
    petAct('hop', 1000); petEmote('heart');
    /* 挡住大威胁时已经喊过 block，其余好手补一句；每局最多 3 次 */
    if (!danger && GOOD_SAID < 3){ GOOD_SAID++; sayPool('good'); }
  }
  else if (gain < 100 && history.length >= 8){ petAct('look', 900); petEmote('ring'); }
  else petAct('nod', 1000);
  state = 'playing';
  el.pill.textContent = t('yourTurn');
  el.hint.classList.remove('show');
  syncButtons();
  pulsePill();
}

/* 结算：1 胜 / 0 和 / -1 负 */
function finish(result, line){
  clearTimeout(aiTimer); aiTimer = null; aiPending = false;
  state = 'over';
  LAST_RESULT = result; LAST_DEMO = false;
  winCells = line || null;
  hoverCell = null;
  if (result === 1){
    S.wins++;
    S.streak++;
    if (S.streak > S.bestStreak) S.bestStreak = S.streak;
    lbAdd(history.length);
  } else if (result === -1){
    S.losses++;
    S.streak = 0;
  } else {
    S.draws++;
  }
  S.plays++;
  persist();
  renderStats();
  MOVE_COUNT = history.length;
  el.hint.classList.remove('show');
  el.pill.textContent = result === 1 ? t('overWin') : (result === -1 ? t('overLose') : t('overDraw'));
  if (result === 1){ sfxWin(); sayPool('lose'); haptic(28); }
  else if (result === -1){ sfxLose(); sayPool('win'); }
  else { sfxDraw(); sayPool('draw'); }
  drawBoard();
  startWinFlash();
  startWinFx(line);
  petThink(false);
  /* 表态期间不要被空闲调度打断（结算层 620ms 后才挡上来） */
  clearTimeout(ROAM.timer); ROAM.timer = null;
  /* 先让月巴表态 0.6 秒（赢棋跳舞 / 输棋蔫掉 / 平局摇摆），再弹结算层 */
  if (result === 1){ petAct('droop', 1600); petEmote('ring'); }
  else if (result === -1){
    petAct('dance', 2200);
    petEmote('heart');
    setTimeout(function(){ if (state === 'over') petEmote('heart'); }, 720);
  } else petAct('sway', 1400);
  clearTimeout(overTimer);
  overTimer = setTimeout(function(){
    overTimer = null;
    if (state === 'over') showOver(result, false);
  }, 620);
}

/* 认输二次确认 */
function askResign(){
  if (state !== 'playing' && state !== 'thinking') return;
  if (state === 'thinking' && aiTimer){
    clearTimeout(aiTimer);
    aiTimer = null;
    aiPending = true;
  }
  state = 'confirm';
  el.hint.classList.remove('show');
  el.panel.innerHTML = confirmHTML();
  overlayShow();
  syncButtons();
}

function cancelResign(){
  if (state !== 'confirm') return;
  overlayHide();
  if (aiPending){
    state = 'thinking';
    var th = thinkingText();
    el.pill.textContent = th;
    el.hint.textContent = th;
    el.hint.classList.add('show');
    petThink(true);
    scheduleAi(260);
  } else {
    state = 'playing';
    el.pill.textContent = t('yourTurn');
    petThink(false);
  }
  drawBoard();
  syncButtons();
  pulsePill();
}

el.overlay.addEventListener('click', function(e){
  initAudio();
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!b) return;
  var act = b.getAttribute('data-act');
  if (act === 'start'){ startMatch(); return; }
  if (act === 'reroll'){ pickOpp(); showTitle(); return; }
  if (act === 'sound'){
    MUTED = !MUTED;
    S.muted = MUTED;
    persist();
    if (!MUTED){ initAudio(); tone(520, 0.06, 'square', 0.06); }
    showTitle();
    return;
  }
  if (act === 'lowmode'){
    S.lowPower = !LOW;
    LOW = S.lowPower;
    persist();
    applyLow();
    roamStop();          /* 开关省电时立刻停在原地，不把补间留在半路 */
    showTitle();
    return;
  }
  if (act === 'diff'){
    var d = b.getAttribute('data-diff');
    if (d === 'easy' || d === 'normal' || d === 'hard'){
      S.diff = d; persist(); showTitle();
    }
    return;
  }
  if (act === 'resume'){ resumeMatch(); return; }
  if (act === 'restart'){ startMatch(); return; }
  if (act === 'home' || act === 'switch'){ showTitle(); return; }
  if (act === 'again'){ startMatch(); return; }
  if (act === 'resignYes'){ finish(-1, null); return; }
  if (act === 'resignNo'){ cancelResign(); return; }
  if (act === 'lbtab'){
    var lt = b.getAttribute('data-diff');
    if (lt === 'easy' || lt === 'normal' || lt === 'hard'){
      lbTab = lt;
      lbRenderPanel();
    }
    return;
  }
  if (act === 'lbclose'){ lbClose(); return; }
});

el.btnLb.addEventListener('click', function(){
  initAudio();
  lbOpen();
});

el.btnPause.addEventListener('click', function(){
  if (state === 'playing' || state === 'thinking') showPause();
  else if (state === 'paused') resumeMatch();
});

el.btnResign.addEventListener('click', function(){ askResign(); });

/* 棋盘输入：pointer 事件同时覆盖鼠标与触屏 */
el.cv.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  if (state !== 'playing') return;
  var c = cellFromEvent(e);
  if (!c) return;
  tryPlace(c.x, c.y);
});

el.cv.addEventListener('pointermove', function(e){
  if (e.pointerType !== 'mouse') return;
  if (state !== 'playing'){
    if (hoverCell){ hoverCell = null; drawBoard(); }
    return;
  }
  var c = cellFromEvent(e);
  if (c && cells[c.y * N + c.x]) c = null;
  if ((!c && !hoverCell) || (c && hoverCell && c.x === hoverCell.x && c.y === hoverCell.y)) return;
  hoverCell = c;
  drawBoard();
});

el.cv.addEventListener('pointerleave', function(){
  if (hoverCell){ hoverCell = null; drawBoard(); }
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' || e.key === 'Esc'){
    if (state === 'leaderboard'){ lbClose(); return; }
    if (state === 'confirm'){ cancelResign(); return; }
    if (state === 'paused'){ resumeMatch(); return; }
    if (state === 'playing' || state === 'thinking') showPause();
  }
});

document.addEventListener('visibilitychange', function(){
  if (document.hidden && (state === 'playing' || state === 'thinking')) showPause();
});

window.addEventListener('pagehide', function(){ persist(); });
window.addEventListener('resize', function(){ fitBoard(); });

/* ============================================================
   PART 7 · 启动
   ============================================================ */
applyTexts();
renderStats();
shoutReady();
/* 顺手报一次色系：百巴箱的功能栏换成浅纸色（父页按 gbTheme 切 t-gomo） */
try {
  if (window.parent && window.parent !== window) window.parent.postMessage({gbTheme:'gomo'}, '*');
} catch (e) {}
pickOpp();
renderOpp();
fitBoard();
showTitle();

/* 开发期预览结算外壳：gomoku.html?demo=over */
if (String(QS.get('demo') || '') === 'over'){
  MOVE_COUNT = 37;
  showOver(1, true);
}

setTimeout(fitBoard, 60);

})();
</script>
