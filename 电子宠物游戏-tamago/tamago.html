<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0e0e">
<title>月巴蛋 · M4 庭院访客</title>
<style>
  :root{
    --shell:#8FB3A6; --bezel:#5E7C72; --lcd:#B9C9A8;
    --ink:#26332A; --ghost:#93A585; --label:#33473D;
    --key-ink:#EAF2EA;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:#0d0e0e;
    font-family:"SF Mono","Cascadia Mono",Consolas,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(78% 62% at 50% 38%,transparent 40%,rgba(0,0,0,.58) 100%);}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:8px;}

  /* ---------- 机身 ---------- */
  #device{position:relative;width:360px;padding:14px 14px 12px;border-radius:26px;
    background:var(--shell);color:var(--label);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -5px 12px rgba(0,0,0,.28),
      0 26px 64px rgba(0,0,0,.62);
    transform-origin:center center;}
  #brand{font-size:10px;font-weight:900;letter-spacing:3.2px;text-align:center;
    opacity:.62;margin:1px 0 9px;white-space:nowrap;}
  #brand i{font-style:normal;letter-spacing:1px;opacity:.7;}

  /* ---------- 屏幕 ---------- */
  #screenWrap{position:relative;padding:6px;border-radius:7px;background:var(--bezel);
    box-shadow:inset 0 3px 9px rgba(0,0,0,.42),inset 0 -1px 0 rgba(255,255,255,.08);
    transition:filter .08s;}
  #lcd{display:block;width:320px;height:288px;border-radius:2px;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:var(--lcd);}
  #lcdText{position:absolute;left:10px;right:10px;bottom:9px;text-align:center;
    color:var(--ink);font-size:10.5px;line-height:1.25;letter-spacing:.3px;
    white-space:pre-line;pointer-events:none;transition:opacity .2s;}
  /* 详情页五行统计：缩一号字，仍落在宠物脚下的留白里 */
  #lcdText.compact{font-size:9px;line-height:1.2;letter-spacing:.2px;}
  /* 访客台词气泡：DOM 文本，放在宠物脚下、图标行上方，不遮脸 */
  #bubble{position:absolute;left:16px;right:16px;bottom:40px;padding:4px 7px 5px;
    border:1px solid var(--ink);background:var(--lcd);color:var(--ink);
    font-size:10px;line-height:1.25;letter-spacing:.2px;text-align:center;
    pointer-events:none;opacity:0;transform:translateY(5px) scale(.94);
    transform-origin:50% 100%;transition:opacity .12s ease-out,transform .14s ease-out;}
  #bubble.show{opacity:1;transform:none;}
  #bubble .sub{font-size:8.5px;line-height:1.2;opacity:.72;margin-top:2px;}
  /* 庭院访客：直接用原立绘（不是像素画）走进屏幕，Q 弹动效全靠 CSS */
  #visitor{position:absolute;left:6px;top:6px;width:320px;height:288px;
    overflow:hidden;pointer-events:none;}
  #visitor .vb{position:absolute;bottom:88px;width:72px;height:72px;
    transition:left .08s linear;will-change:left;}
  #visitor .vb::after{content:'';position:absolute;left:50%;bottom:-2px;width:44px;height:5px;
    border-radius:50%;background:var(--ink);opacity:.16;transform:translateX(-50%);}
  #visitor .vbArt{width:100%;height:100%;transform-origin:50% 100%;
    animation:vbIdle 1.7s ease-in-out infinite;}
  #visitor img,#visitor svg{display:block;width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
  #visitor .vb.walk .vbArt{animation:vbWalk .44s ease-in-out infinite;}
  #visitor .vb.pop .vbArt{animation:vbPop .46s cubic-bezier(.25,1.6,.4,1) both;}
  #visitor .vb.hop .vbArt{animation:vbHop .42s ease-out both;}
  @keyframes vbWalk{
    0%{transform:translateY(0) scale(1,1);}
    22%{transform:translateY(-5px) scale(.97,1.06);}
    48%{transform:translateY(0) scale(1.06,.93);}
    70%{transform:translateY(-2px) scale(.99,1.02);}
    100%{transform:translateY(0) scale(1,1);}
  }
  @keyframes vbIdle{
    0%,100%{transform:translateY(0) scale(1,1);}
    50%{transform:translateY(-1px) scale(1.025,.985);}
  }
  @keyframes vbPop{
    0%{transform:translateY(-6px) scale(.72,.72);}
    55%{transform:translateY(0) scale(1.1,.9);}
    78%{transform:translateY(-2px) scale(.99,1.03);}
    100%{transform:translateY(0) scale(1,1);}
  }
  @keyframes vbHop{
    0%{transform:translateY(0) scale(1,1);}
    28%{transform:translateY(-12px) scale(.94,1.08);}
    52%{transform:translateY(0) scale(1.09,.91);}
    68%{transform:translateY(-4px) scale(.99,1.02);}
    84%{transform:translateY(0) scale(1.03,.97);}
    100%{transform:translateY(0) scale(1,1);}
  }
  @media (prefers-reduced-motion:reduce){
    #visitor .vbArt,#visitor .vb.walk .vbArt,#visitor .vb.pop .vbArt,#visitor .vb.hop .vbArt{
      animation:none;}
  }
  #screenWrap.dim #bubble{opacity:.55;}
  #screenWrap.dim{filter:brightness(.62) saturate(.85);}
  @keyframes screenShake{
    0%,100%{transform:translate(0,0);}
    25%{transform:translate(-2px,1px);}
    50%{transform:translate(2px,-1px);}
    75%{transform:translate(-1px,0);}
  }
  #screenWrap.shake{animation:screenShake .32s linear;}

  /* ---------- 按键 ---------- */
  #keys{display:flex;justify-content:center;gap:28px;margin:17px 0 20px;}
  .key{width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:900;letter-spacing:1px;
    color:var(--key-ink);background:var(--bezel);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.22),inset 0 -4px 8px rgba(0,0,0,.34),
      0 4px 0 rgba(0,0,0,.28);
    transition:transform .06s,box-shadow .06s;
    position:relative;}
  .key:active,.key.press{transform:translateY(3px);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.16),inset 0 -2px 6px rgba(0,0,0,.4),
      0 1px 0 rgba(0,0,0,.3);}
  .key small{position:absolute;left:0;right:0;bottom:-13px;font-size:7px;font-weight:800;
    letter-spacing:1px;color:var(--label);opacity:.55;}

  /* ---------- 底部配色 ---------- */
  #foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;}
  #swatches{display:flex;gap:6px;}
  .swatch{width:17px;height:17px;padding:0;border-radius:50%;cursor:pointer;
    border:2px solid transparent;background:var(--sw);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2);
    transition:transform .12s;}
  .swatch[aria-pressed="true"]{border-color:var(--label);transform:scale(1.14);}
  .swatch:active{transform:scale(.92);}
  .key:focus-visible,.swatch:focus-visible{outline:2px solid var(--label);outline-offset:2px;}
  #model{font-size:7.5px;font-weight:800;letter-spacing:1.6px;opacity:.66;white-space:nowrap;}
  #model b{font-weight:900;opacity:1;}

  /* ---------- 机身小装饰 ---------- */
  #hint{position:fixed;left:0;right:0;bottom:9px;text-align:center;pointer-events:none;
    font-size:10px;letter-spacing:.6px;color:#7f837e;white-space:nowrap;}
  @media (max-height:520px){#hint{display:none;}}
  @media (max-width:350px){#hint{display:none;}}
  /* 独立打开时的存档工具：iframe 内隐藏 */
  #tools{position:fixed;left:0;right:0;bottom:25px;display:flex;justify-content:center;gap:14px;
    font-size:9.5px;letter-spacing:.5px;color:#6f736e;}
  #tools[hidden]{display:none;}
  #tools button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit;
    text-decoration:underline;text-underline-offset:2px;}
  #tools button:focus-visible{outline:1px solid currentColor;outline-offset:2px;}
  @media (max-height:520px){#tools{display:none;}}

  /* ---------- 低功耗（M5）：关抖屏 / 关访客 Q 弹 / 关过渡 ---------- */
  body.low #screenWrap.shake{animation:none;}
  body.low #visitor .vbArt,body.low #visitor .vb.walk .vbArt,
  body.low #visitor .vb.pop .vbArt,body.low #visitor .vb.hop .vbArt{animation:none;}
  body.low #screenWrap,body.low #lcdText,body.low #bubble,
  body.low .key,body.low .swatch{transition:none;}
</style>
</head>
<body>
<div id="stage">
  <div id="device" aria-label="月巴蛋电子宠物机">
    <div id="brand">BANNY TAMAGO <i>/ MODEL 01</i></div>

    <div id="screenWrap">
      <canvas id="lcd" width="160" height="144" aria-label="单色液晶屏"></canvas>
      <div id="visitor" aria-hidden="true"></div>
      <div id="lcdText" aria-live="polite"></div>
      <div id="bubble" aria-live="polite"><div id="bubbleMain"></div><div class="sub" id="bubbleSub"></div></div>
    </div>

    <div id="keys">
      <button class="key" data-k="A" aria-label="A 键">A<small>选择</small></button>
      <button class="key" data-k="B" aria-label="B 键">B<small>确认</small></button>
      <button class="key" data-k="C" aria-label="C 键">C<small>取消</small></button>

    <div id="foot">

    </div>
  </div>
</div>
<div id="tools" hidden>

  <button type="button" id="btnImport">导入存档</button>

const PERSONAS={
  clingy:{id:'clingy',nickBond:40,amb:'heart'},
  steady:{id:'steady',nickBond:50,amb:'flower'},
  proud:{id:'proud',nickBond:60,amb:'star'}
};
const PERSONA_KEYS=['clingy','steady','proud'];
function personaFor(id){
  return PERSONAS[PERSONA_KEYS[hashId(id||'')%PERSONA_KEYS.length]];
}
function personaOf(pet){
  if(!pet) return PERSONAS.steady;
  return PERSONAS[pet.persona]||personaFor(pet.species);
}
function personaLabel(pet){ return t('persona_'+personaOf(pet).id); }

function freshState(){

    visitLog:[],visitorSeen:{},pendingDeathTaunt:false,tutorialDone:false};

/* 存档迁移：以后加字段就在这里按 v 递增补默认值 */
function migrateSave(){
  const v=num(state.v,1);
  if(v<2){
    if(!Array.isArray(state.visitLog)) state.visitLog=[];
    state.pendingDeathTaunt=!!state.pendingDeathTaunt;
  }
  state.v=Math.max(v,SAVE_VER);
}
let state=freshState();
function loadState(){
  let rawText=null;
  try{ rawText=localStorage.getItem(SAVE_KEY); }catch(e){}
  let parsed=null, broken=false;
  if(rawText!==null&&rawText!==''){
    try{
      parsed=JSON.parse(rawText);
      if(!parsed||typeof parsed!=='object'||Array.isArray(parsed)) broken=true;
    }catch(e){ broken=true; }
  }
  if(broken){
    /* 坏档先留原串，方便排查；不静默丢掉玩家数据 */
    try{ localStorage.setItem(SAVE_BROKEN_KEY,rawText); }catch(e){}
    parsed=null;
  }
  state=parsed||freshState();
  migrateSave();
  if(!THEMES.some(function(t){return t.id===state.shell;})) state.shell='teal';
  if(!Array.isArray(state.eggs)) state.eggs=[];
  state.eggs=state.eggs.filter(function(e){
    return e&&typeof e==='object'&&e.species&&(e.slot===1||e.slot===2||e.slot===3);
  });
  if(state.eggs.length!==3) state.eggs=[];
  if(state.pet&&!state.pet.species) state.pet=null;
  if(state.pet) ensurePet(state.pet);
  /* 蛋位为空时，剩下的蛋要能开；三枚都孵过则在启动时重抽 */
  if(!state.pet&&state.eggs.length){
    if(state.eggs.every(function(e){ return e&&e.hatched; })) state.eggs=[];
    else state.eggs.forEach(function(e){ if(e&&!e.hatched) e.sealed=false; });
  }
  state.sampleMode=!!state.sampleMode;
  /* 访客：最近 2 只不复用；死亡后的下一次开机要补一句嘲讽 */
  state.visitLog=Array.isArray(state.visitLog)?state.visitLog.filter(function(id){
    return typeof id==='string'&&id;
  }).slice(-2):[];
  state.pendingDeathTaunt=!!state.pendingDeathTaunt;
  state.tutorialDone=!!state.tutorialDone;
  /* 访客累计：常客/礼物/来访记录；最多留 40 位，按最后来访时间取新的 */
  const seen=(state.visitorSeen&&typeof state.visitorSeen==='object'&&
    !Array.isArray(state.visitorSeen))?state.visitorSeen:{};
  const seenOut={};
  Object.keys(seen).forEach(function(id){
    const r=seen[id];
    if(typeof id!=='string'||!id||!r||typeof r!=='object') return;
    seenOut[id]={count:clamp(num(r.count,0),0,9999),lastAt:num(r.lastAt,0)};
  });
  state.visitorSeen={};
  Object.keys(seenOut).sort(function(a,b){
    return seenOut[b].lastAt-seenOut[a].lastAt;
  }).slice(0,40).forEach(function(id){ state.visitorSeen[id]=seenOut[id]; });
  /* 相册：只保留结构完整的记录，最多 40 条 */
  state.gallery=Array.isArray(state.gallery)?state.gallery.filter(function(r){
    return r&&typeof r==='object'&&r.species&&isFinite(Number(r.endedAt));
  }).slice(-40):[];
}

function num(v,d){
  const n=Number(v);
  return isFinite(n)?n:d;
}
function clamp(v,a,b){
  return v<a?a:(v>b?b:v);
}
/* 老存档 / 损坏字段兜底，保证所有数值都是有限数（M2 无 NaN 验收） */
function ensurePet(p){
  p.hunger=clamp(num(p.hunger,70),0,100);
  p.mood=clamp(num(p.mood,70),0,100);
  p.clean=clamp(num(p.clean,80),0,100);
  p.health=clamp(num(p.health,100),0,100);
  p.bond=clamp(num(p.bond,0),0,100);
  p.bornAt=num(p.bornAt,Date.now());
  p.lastSeen=num(p.lastSeen,Date.now());
  p.stage=p.stage||'baby';
  p.poopAcc=clamp(num(p.poopAcc,0),0,9999);
  p.poopNext=clamp(num(p.poopNext,90+Math.random()*30),30,240);
  p.sleeping=!!p.sleeping;
  p.sick=!!p.sick;
  p.critical=!!p.critical;
  if(!p.sick) p.critical=false;
  p.riskAcc=clamp(num(p.riskAcc,0),0,9999);
  p.sickSince=num(p.sickSince,0);
  p.rescueUntil=num(p.rescueUntil,0);
  p.rescuePresses=clamp(num(p.rescuePresses,0),0,8);
  p.rescueWindow=!!p.rescueWindow;
  if(!p.critical){ p.rescueWindow=false; p.rescueUntil=0; p.rescuePresses=0; }
  p.medsGiven=clamp(num(p.medsGiven,0),0,2);
  p.tauntCount=clamp(num(p.tauntCount,0),0,99999);
  p.ignoredCount=clamp(num(p.ignoredCount,0),0,999);
  p.careCount=clamp(num(p.careCount,0),0,999999);
  /* 性格 / 命名 / 成体形态 / 照顾质量 / 统计 */
  p.persona=PERSONAS[p.persona]?p.persona:personaFor(p.species).id;
  p.nickname=typeof p.nickname==='string'?p.nickname.slice(0,12):'';
  p.nickUnlocked=!!p.nickUnlocked;
  p.form=(p.form==='plump'||p.form==='lean'||p.form==='stubborn')?p.form:'';
  const q=(p.q&&typeof p.q==='object')?p.q:{};
  p.q={hunger:clamp(num(q.hunger,0),0,1e9),mood:clamp(num(q.mood,0),0,1e9),
    clean:clamp(num(q.clean,0),0,1e9),n:clamp(num(q.n,0),0,1e9),
    sick:clamp(num(q.sick,0),0,9999)};
  p.stats=(p.stats&&typeof p.stats==='object')?p.stats:{};
  ['feed','play','clean','pet','med','rescue','visit','sick'].forEach(function(k){
    p.stats[k]=clamp(num(p.stats[k],0),0,999999);
  });
  p.stats.maxBond=clamp(Math.max(num(p.stats.maxBond,0),p.bond),0,100);
  p.feedLog=Array.isArray(p.feedLog)?p.feedLog.filter(function(t){
    return isFinite(Number(t));
  }).slice(-8):[];
  if(p.stage==='adult'&&!p.form) p.form=computeForm(p);
  /* 访客排期：首访在孵化后 45 秒；老存档缺字段时从本次开机起排 45 秒 */
  if(!isFinite(Number(p.nextVisitAt))) p.nextVisitAt=Date.now()+VISIT_FIRST;
  else p.nextVisitAt=Math.max(0,num(p.nextVisitAt,0));
  p.nextVisitCheck=num(p.nextVisitCheck,0);
  p.lastVisitAt=num(p.lastVisitAt,0);
  p.afterVisitUntil=num(p.afterVisitUntil,0);
  p.poops=Array.isArray(p.poops)?p.poops.filter(function(i){ return i===0||i===1||i===2; }).slice(0,3):[];
  p.bondLog=Array.isArray(p.bondLog)?p.bondLog.filter(function(t){ return isFinite(Number(t)); }):[];
  ['lastFeed','lastPlay','lastClean','lastPet','med'].forEach(function(k){ p[k]=num(p[k],0); });
  p.actionAt=(p.actionAt&&typeof p.actionAt==='object')?p.actionAt:{};
  ['feedCookie','feedGrain','feedTomato','play','clean','pet','light','med'].forEach(function(k){
    p.actionAt[k]=num(p.actionAt[k],0);
  });
  return p;
}

const cv=$('lcd'), ctx=cv.getContext('2d');
const W=160, H=144;
cv.width=W; cv.height=H;
ctx.imageSmoothingEnabled=false;

function clearLcd(){
  ctx.fillStyle=theme.lcd;
  ctx.fillRect(0,0,W,H);
}
function drawMap(map,x,y,mode,s){
  const ink=(mode==='ghost')?theme.ghost:theme.ink;
  s=s||1;
  for(let r=0;r<map.length;r++){
    const row=map[r];
    for(let c=0;c<row.length;c++){
      const ch=row.charAt(c);
      if(ch==='#'){ ctx.fillStyle=ink; ctx.fillRect(x+c*s,y+r*s,s,s); }
      else if(ch==='+'){ ctx.fillStyle=theme.ghost; ctx.fillRect(x+c*s,y+r*s,s,s); }
    }
  }
}
function digitWidth(str){
  let n=0;
  for(let i=0;i<str.length;i++){ n+=3+(i?1:0); }
  return n;
}
function drawDigits(str,x,y,mode){
  const ink=(mode==='ghost')?theme.ghost:theme.ink;
  ctx.fillStyle=ink;
  let cx=x;
  for(let i=0;i<str.length;i++){
    const g=PIX.digits[str.charAt(i)];
    if(g){
      for(let r=0;r<g.length;r++){
        for(let c=0;c<3;c++){
          if(g[r].charAt(c)==='#') ctx.fillRect(cx+c,y+r,1,1);
        }
      }
    }
    cx+=4;
  }
}

let inFrame=false;

const QLANG=(location.search.match(/[?&]lang=([^&]+)/)||[])[1]||'';
let ROSTER=null, YARD=[], TOMATO=0,
    LANG=normLang(decodeURIComponent(QLANG||'zh')),
    MUTED=false, LOW=matchMedia('(prefers-reduced-motion: reduce)').matches,
    FOCUS=false, FOCUS_MINS=0;
let readyTry=0, readyTimer=null;
function sendReady(){
  try{ window.parent.postMessage({type:'yueba-tamago-ready'},'*'); }catch(e){}
}
function handshake(){
  sendReady();
  readyTimer=setInterval(function(){
    readyTry++;
    if(readyTry>=3){
      clearInterval(readyTimer); readyTimer=null;
      useSamples();
      return;
    }
    sendReady();

}
window.addEventListener('message',function(e){
  const d=e&&e.data;
  if(!d||typeof d!=='object') return;
  if(inFrame&&e.source!==window.parent) return;
  /* 毕业回写主游戏后的金币回执：直接补在毕业卡上 */
  if(d.type==='yueba-tamago-graduate-ack'){
    const n=Math.max(0,parseInt(d.coins,10)||0);
    if(ui.endCard) ui.endCard.reward=n;
    render();
    return;
  }
  /* 主游戏番茄钟：专注期间心情不掉、访客不打扰 */
  if(d.type==='yueba-tamago-focus'){
    FOCUS=!!d.on;
    FOCUS_MINS=Math.max(0,parseInt(d.mins,10)||0);
    if(FOCUS){
      ui.msg=t('focusStart');
      ui.msgUntil=Date.now()+2600;
    }else{
      ui.msg=FOCUS_MINS>0?t('focusEnd',{n:FOCUS_MINS}):t('focusEndShort');
      ui.msgUntil=Date.now()+2600;
    }
    render();
    return;
  }
  if(d.type!=='yueba-tamago-roster') return;
  if(readyTimer){ clearInterval(readyTimer); readyTimer=null; }
  ROSTER=Array.isArray(d.list)?d.list.filter(function(t){return t&&t.id;}):[];
  for(const k in speciesArtCache) delete speciesArtCache[k];
  YARD=Array.isArray(d.yard)?d.yard:[];
  TOMATO=parseInt(d.tomato,10)||0;
  LANG=normLang(d.lang||LANG);
  MUTED=!!d.muted;
  LOW=!!d.lowPower||matchMedia('(prefers-reduced-motion: reduce)').matches;
  FOCUS=!!d.focus;
  FOCUS_MINS=Math.max(0,parseInt(d.focusMins,10)||0);
  applyLangDom();
  buildSwatches();
  localizeEggs();
  applyLowPower();
  if(ROSTER.length){
    if(!state.eggs.length||(state.sampleMode&&!state.pet)) drawEggs(ROSTER,false);
  }else if(!state.eggs.length){
    useSamples();
  }
  render();
  restartIdle();
});
function useSamples(){
  if(state.eggs.length) return;
  drawEggs(SAMPLES,true);
}
function localizeEggs(){
  if(!state.sampleMode) return;
  if(Array.isArray(state.eggs)){
    for(let i=0;i<state.eggs.length;i++){
      const e=state.eggs[i];
      if(e&&e.species&&SAMPLES.some(function(s){return s.id===e.species;})) e.name=sampleName(e.species);
    }
  }
  if(state.pet&&SAMPLES.some(function(s){return s.id===state.pet.species;})){
    state.pet.name=sampleName(state.pet.species);
  }
}
function applyLowPower(){

}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function chooseSpecies(pool){
  const out=shuffle(pool.slice()).slice(0,3);
  while(out.length<3&&pool.length) out.push(pool[Math.floor(Math.random()*pool.length)]);
  return out;
}
/* 像素月巴只挑「有外链立绘」的月巴：没有立绘的只留给庭院访客当 SVG 兜底 */
function artOnly(pool){
  const out=(Array.isArray(pool)?pool:[]).filter(function(t){ return t&&t.id&&t.art; });
  if(out.length) return out;
  return SAMPLES.filter(function(t){ return t.art; });
}
function drawEggs(pool,isSample){
  pool=artOnly(pool);
  const picked=chooseSpecies(pool);
  state.eggs=picked.map(function(t,i){
    return {
      slot:i+1,
      species:t.id,
      name:(isSample?sampleName(t.id):(t.name||t.id)),
      shape:t.shape||'round',
      r:t.r||1,

  state.sampleMode=!!isSample;
  sel=0;

/* ---------- 宠物像素生成 ----------
   轮廓与 index.html 的立绘 shapeBody() 同源：同一套 40×40 几何，
   用 Path2D 超采样后压成 32×32 点阵，保证像素月巴的形状与立绘一模一样。 */
const SHAPE_GEOM={
  round:  [['c',20,21,13]],
  tall:   [['e',20,22,9.5,14]],
  wide:   [['e',20,22,15,10.5]],
  squish: [['e',20,24,13.5,9]],
  cube:   [['r',8,9,24,25,5]],
  big:    [['e',20,22,16,13]],
  bean:   [['c',15.5,22,9.5],['c',24.5,22,9.5]],
  heart:  [['p','M20 32 C10 24 6 17 9 12 C12 7.5 17 8 20 12 C23 8 28 7.5 31 12 C34 17 30 24 20 32 Z']],
  drop:   [['p','M20 7 C26 15 29 20 29 25 A9 9 0 1 1 11 25 C11 20 14 15 20 7 Z']],
  star:   [['p','M20 8 L23.6 16.8 L32.6 17.2 L25.6 22.9 L28.4 31.4 L20 26.6 L11.6 31.4 L14.4 22.9 L7.4 17.2 L16.4 16.8 Z']],
  spike:  [['c',20,25,10],['p','M14 11 L16 4 L20 10 L24 3 L27 11 L25 14 L15 14 Z']],
  crown:  [['c',20,25,11],['p','M13 13 L16 6 L20 11 L24 5 L27 12 Z']],
  moon:   [['p','M27 5 A14 14 0 1 0 27 35 A11 11 0 1 1 27 5 Z']],
  ghost:  [['p','M8 12 A12 12 0 0 1 32 12 L32 30 L27 25 L22 30 L17 25 L12 30 L8 26 Z']],
  rainbow:[['p','M12 27 A10 10 0 0 1 28 27 L25 27 A7 7 0 0 0 15 27 Z']],
  chaos:  [['c',20,21,12.5]]
};
const MASK_SS=4, ART_W=40, SPRITE=32;
const maskCache={};
function hashId(s){
  let h=0;
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;
  return Math.abs(h);
}
function buildMask(shape){
  if(maskCache[shape]) return maskCache[shape];
  const geom=SHAPE_GEOM[shape]||SHAPE_GEOM.round;
  const cv=document.createElement('canvas');
  cv.width=SPRITE*MASK_SS; cv.height=SPRITE*MASK_SS;
  const g=cv.getContext('2d');
  const k=cv.width/ART_W;
  g.setTransform(k,0,0,k,0,0);
  g.fillStyle='#000'; g.strokeStyle='#000'; g.lineWidth=1.4;
  for(const part of geom){
    const p=new Path2D();
    if(part[0]==='c'){
      p.moveTo(part[1]+part[3],part[2]);
      p.arc(part[1],part[2],part[3],0,Math.PI*2);
    }else if(part[0]==='e'){
      p.ellipse(part[1],part[2],part[3],part[4],0,0,Math.PI*2);
    }else if(part[0]==='r'){
      const x=part[1], y=part[2], w=part[3], h=part[4], r=part[5];
      p.moveTo(x+r,y);
      p.lineTo(x+w-r,y); p.quadraticCurveTo(x+w,y,x+w,y+r);
      p.lineTo(x+w,y+h-r); p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
      p.lineTo(x+r,y+h); p.quadraticCurveTo(x,y+h,x,y+h-r);
      p.lineTo(x,y+r); p.quadraticCurveTo(x,y,x+r,y);
      p.closePath();
    }else{
      p.addPath(new Path2D(part[1]));
    }
    g.fill(p); g.stroke(p);
  }
  const data=g.getImageData(0,0,cv.width,cv.height).data;
  const m=[];
  for(let y=0;y<SPRITE;y++){
    const row=[];
    for(let x=0;x<SPRITE;x++){
      let n=0;
      for(let sy=0;sy<MASK_SS;sy++){
        const base=((y*MASK_SS+sy)*cv.width+x*MASK_SS)*4+3;
        for(let sx=0;sx<MASK_SS;sx++) if(data[base+sx*4]>127) n++;
      }
      row.push(n*2>=MASK_SS*MASK_SS?1:0);
    }
    m.push(row);
  }
  maskCache[shape]=m;
  return m;
}
const spriteCache={};
/* 五官与立绘同源：眼睛 x 按形状（tall 11 / wide 12 / 其余 10，40 单位制），
   y=18；眼型与嘴型由 id 哈希决定，与 index.html 的 eye/mouth 取法一致。 */
function drawFace(g,shape,variant,blink){
  const eye=variant%4, mouth=(variant>>2)%4;
  const exBase=shape==='tall'?11:shape==='wide'?12:10;
  const ex1=Math.round(exBase*0.8), ex2=Math.round((30-exBase)*0.8);
  const ey=Math.round(18*0.8);
  g.fillStyle=theme.ink;
  for(const ex of [ex1,ex2]){
    if(blink||eye===3){ g.fillRect(ex-2,ey,4,1); }
    else if(eye===1){
      g.fillRect(ex-1,ey-2,2,1);
      g.fillRect(ex-2,ey-1,4,3);
      g.fillRect(ex-1,ey+2,2,1);
    }
    else if(eye===2){ g.fillRect(ex,ey-1,1,1); g.fillRect(ex-1,ey,3,1); g.fillRect(ex,ey+1,1,1); }
    else {
      g.fillRect(ex-1,ey-1,2,1);
      g.fillRect(ex-2,ey,4,2);
      g.fillRect(ex-1,ey+2,2,1);
    }
  }
  const mx=Math.round(20*0.8), my=Math.round(24.5*0.8);
  if(mouth===0){
    g.fillRect(mx-5,my-1,2,1); g.fillRect(mx,my-1,2,1); g.fillRect(mx+4,my-1,2,1);
    g.fillRect(mx-3,my,2,1);   g.fillRect(mx+2,my,2,1);
  }else if(mouth===1){
    g.fillRect(mx-1,my-2,2,1);
    g.fillRect(mx-2,my-1,4,2);
    g.fillRect(mx-1,my+1,2,1);
  }else if(mouth===2){
    g.fillRect(mx-4,my,9,1); g.fillRect(mx-3,my+1,7,1); g.fillRect(mx-2,my+2,5,1);
  }else{
    g.fillRect(mx-4,my,9,1); g.fillRect(mx-1,my-1,3,1);
  }
}
function petSprite(shape,id,blink){
  const variant=hashId(id||'');
  const key=theme.id+'|'+shape+'|'+variant+'|'+(blink?'b':'o');
  if(spriteCache[key]) return spriteCache[key];
  const mask=buildMask(shape);
  const c=document.createElement('canvas'); c.width=32; c.height=32;
  const g=c.getContext('2d');
  for(let y=0;y<32;y++){
    for(let x=0;x<32;x++){
      if(!mask[y][x]) continue;
      const edge=!mask[y-1]||!mask[y-1][x]||!mask[y+1]||!mask[y+1][x]||!mask[y][x-1]||!mask[y][x+1];
      g.fillStyle=edge?theme.ink:theme.ghost;
      g.fillRect(x,y,1,1);
    }
  }
  drawFace(g,shape,variant,blink);
  spriteCache[key]=c;
  return c;
}
/* ---------- 原立绘单色像素化 ----------
   游戏里的像素月巴只用「有外链立绘」的月巴：把立绘等比压到 32×32，
   用亮度阈值二值化后整只染成一种墨色（ghost），深色五官/耳尖保留为更深的点。
   跨域图片不能读像素，所以全程只用 canvas 滤镜与合成，不做 getImageData。 */
const artSpriteCache={};
const speciesArtCache={};
function speciesArt(id){
  if(speciesArtCache[id]!==undefined) return speciesArtCache[id];
  const t=rosterById(id);
  const url=(t&&t.art)?String(t.art):'';
  speciesArtCache[id]=url;
  return url;
}
function monoPixelSprite(img){
  const S=SPRITE;
  const c=document.createElement('canvas'); c.width=S; c.height=S;
  const g=c.getContext('2d');
  /* 关掉插值做最近邻采样，保证压到 32×32 后是硬边像素方块，而不是糊成一团的半透明边 */
  g.imageSmoothingEnabled=false;
  const k=Math.min(S/img.naturalWidth,S/img.naturalHeight);
  const w=Math.max(1,Math.round(img.naturalWidth*k));
  const h=Math.max(1,Math.round(img.naturalHeight*k));
  const x=Math.round((S-w)/2), y=Math.round((S-h)/2);
  /* 亮度二值化：白身体留下，眼睫毛/嘴/耳尖变深 */
  g.filter='grayscale(1) brightness(.7) contrast(20)';
  g.drawImage(img,x,y,w,h);
  g.filter='none';
  /* 只保留立绘不透明区域，再整体乘上同一种墨色 */
  g.globalCompositeOperation='multiply';
  g.fillStyle=theme.ghost;
  g.fillRect(0,0,S,S);
  g.globalCompositeOperation='destination-in';
  g.drawImage(img,x,y,w,h);
  /* 1px 墨线描边：沿用像素月巴原有的「墨线边 + 浅墨身体」观感 */
  const sil=document.createElement('canvas'); sil.width=S; sil.height=S;
  const sg=sil.getContext('2d');
  sg.drawImage(c,0,0);
  sg.globalCompositeOperation='source-in';
  sg.fillStyle=theme.ink; sg.fillRect(0,0,S,S);
  const out=document.createElement('canvas'); out.width=S; out.height=S;
  const og=out.getContext('2d');
  const off=[[1,0],[-1,0],[0,1],[0,-1]];
  for(const o of off) og.drawImage(sil,o[0],o[1]);
  og.drawImage(c,0,0);
  return out;
}
function artSprite(url){
  const key=theme.id+'|'+url;
  const rec=artSpriteCache[key];
  if(rec) return rec.cv||null;
  artSpriteCache[key]={cv:null,failed:false};
  const img=new Image();
  img.decoding='async';
  img.onload=function(){
    try{ artSpriteCache[key].cv=monoPixelSprite(img); }
    catch(e){ artSpriteCache[key].failed=true; }
    render();
  };
  img.onerror=function(){ artSpriteCache[key].failed=true; };
  img.src=url;
  return null;
}
function drawPetSprite(pet,x,y,scale,blink){
  const url=speciesArt(pet.species);
  const art=url?artSprite(url):null;
  /* 立绘还没加载好时先按形状兜底，加载完自动换成单色像素立绘 */
  const sp=art||petSprite(pet.shape,pet.species,!!blink);
  /* 成体形态只做轮廓微调 + 一枚小装饰，不改五官 */
  const form=pet.form||'';
  if(form==='plump'){
    ctx.drawImage(sp,x-scale,y+scale,34*scale,31*scale);
    drawMap(PIX.heartFull,x+13*scale,y-5*scale,'ink');
  }else if(form==='lean'){
    ctx.drawImage(sp,x+scale,y-scale,30*scale,33*scale);

  }else{

/* ---------- 氛围粒子：开心时冒爱心 / 小花 / 星星 ----------
   只画环境，不改造月巴的五官；低功耗与页面态一律关闭。 */
const AMBIENT_MAP={heart:'heartFull',flower:'flower',star:'star'};
const AMBIENT_KINDS=['heart','flower','star'];
let ambient=[], ambientNext=0;
function makeAmbient(pet,now){
  const p=personaOf(pet);
  const kind=(Math.random()<0.55)?p.amb:pickFrom(AMBIENT_KINDS);
  return {kind:kind,x:34+Math.random()*92,y:58+Math.random()*22,t0:now,
    life:1300+Math.random()*600,drift:(Math.random()<0.5?-1:1)*(3+Math.random()*7)};
}
function ambientTick(now,active){
  const pet=state.pet;
  if(!active||LOW||!pet||pet.sleeping||pet.sick||pet.critical||
     ui.play||ui.page||vis||ui.endCard||hatchState){
    ambient=[]; ambientNext=now+2500; return;
  }
  const mood=num(pet.mood,0);
  if(mood<45){ ambient=[]; ambientNext=now+4000; return; }
  if(!ambientNext) ambientNext=now+1200;
  const gap=mood>=85?2200:(mood>=65?4200:7000);
  if(now>=ambientNext){
    ambientNext=now+gap+Math.random()*1800;
    ambient.push(makeAmbient(pet,now));
  }
  ambient=ambient.filter(function(p){ return now-p.t0<p.life; });
}
function ambientBurst(kind,n){
  const pet=state.pet;
  if(LOW||!pet||pet.sleeping||pet.sick||pet.critical||ui.page||ui.endCard||hatchState) return;
  const now=Date.now();
  for(let i=0;i<(n||1);i++){
    ambient.push({kind:kind,x:58+Math.random()*44,y:52+Math.random()*18,t0:now+i*60,
      life:1200+Math.random()*500,drift:(Math.random()<0.5?-1:1)*(4+Math.random()*8)});
  }
}
function drawAmbient(now){
  for(let i=0;i<ambient.length;i++){
    const a=ambient[i], k=clamp((now-a.t0)/a.life,0,1);
    drawMap(PIX[AMBIENT_MAP[a.kind]],Math.round(a.x+a.drift*k),Math.round(a.y-18*k),
      k<0.55?'ink':'ghost');
  }
}

/* ============================================================
   养成模拟（M2）
   ============================================================ */
function cdLeft(pet,key,cd){
  const t=num(pet.actionAt&&pet.actionAt[key],0);
  return Math.max(0,t+cd-Date.now());
}
function markAction(pet,key){
  pet.actionAt=pet.actionAt||{};
  pet.actionAt[key]=Date.now();
}
/* 同类互动每分钟最多计入 6 次亲密度 */
function bondAdd(pet,n){
  const now=Date.now();
  pet.bondLog=pet.bondLog.filter(function(t){ return now-t<MIN; });
  if(pet.bondLog.length>=6) return;
  pet.bondLog.push(now);
  pet.bond=clamp(pet.bond+(n||1),0,100);
  if(pet.stats) pet.stats.maxBond=clamp(Math.max(num(pet.stats.maxBond,0),pet.bond),0,100);
}
/* 照顾次数与分类统计：只做统计埋点，不参与数值结算 */
function careTick(pet,kind){
  if(!pet) return;
  pet.careCount=clamp(num(pet.careCount,0)+1,0,999999);
  if(kind&&pet.stats) pet.stats[kind]=clamp(num(pet.stats[kind],0)+1,0,999999);
}
function addPoop(pet){
  for(let i=0;i<3;i++){
    if(pet.poops.indexOf(i)<0){
      pet.poops.push(i);
      pet.clean=clamp(pet.clean-5,0,100);
      return;
    }
  }
}
/* 成体形态由幼体/成长期的照顾质量决定：圆润 / 精瘦 / 倔强 */
function computeForm(pet){
  const q=pet.q||{};
  const n=num(q.n,0);
  if(n<=0) return 'plump';
  const h=num(q.hunger,0)/n, m=num(q.mood,0)/n, c=num(q.clean,0)/n;
  if(m<55||num(pet.tauntCount,0)>=5) return 'stubborn';
  if(h>=70&&c>=65&&num(q.sick,0)<=1) return 'plump';
  return 'lean';
}
/* 成长阶段按存活时长实时推进 */
function refreshStage(pet){
  const age=Date.now()-num(pet.bornAt,Date.now());
  const ns=age>=ADULT_MS?'adult':(age>=GROW_MS?'grow':'baby');
  if(ns!==pet.stage){
    pet.stage=ns;
    if(ns==='adult'&&!pet.form) pet.form=computeForm(pet);
    if(ns==='grow'){ ui.msg=t('growMsg'); ui.msgUntil=Date.now()+2200; }
    else if(ns==='adult'){ ui.msg=t('adultMsg'); ui.msgUntil=Date.now()+3000; }
  }
}
function simulateStep(ms,offline){
  const pet=state.pet;
  const mins=(ms/MIN)*(offline?OFFLINE_RATE:1);
  const asleep=!!pet.sleeping;
  pet.hunger-=mins/(asleep?12:6);
  if(!asleep){
    /* 主游戏番茄钟专注中：心情不下降，其它衰减照常 */
    if(!FOCUS) pet.mood-=mins/(pet.sick?2:((pet.hunger<15||pet.clean<15)?4:8));
    pet.clean-=mins/10;
    pet.poopAcc+=mins;
    while(pet.poopAcc>=pet.poopNext&&pet.poops.length<3){
      pet.poopAcc-=pet.poopNext;
      addPoop(pet);
      pet.poopNext=90+Math.random()*30;
    }
    if(pet.poops.length>=3) pet.poopAcc=Math.min(pet.poopAcc,pet.poopNext);
  }
  /* 隐患：低饱食 / 低清洁 / 两坨以上便便持续累积，满 30 分钟转生病 */
  const risk=pet.hunger<15||pet.clean<15||pet.poops.length>=2;
  if(risk) pet.riskAcc=clamp(num(pet.riskAcc,0)+mins,0,9999);
  else pet.riskAcc=0;
  if(!pet.sick&&pet.riskAcc>=SICK_AT){
    pet.sick=true; pet.sickSince=Date.now(); pet.riskAcc=0; pet.medsGiven=0;
    if(pet.q) pet.q.sick=clamp(num(pet.q.sick,0)+1,0,9999);
    if(pet.stats) pet.stats.sick=clamp(num(pet.stats.sick,0)+1,0,999999);
    sfx('sick');
  }
  if(pet.sick){
    pet.health-=mins/5;
    if(!pet.critical&&pet.health<35){
      pet.critical=true;
      pet.rescueWindow=false;
      pet.rescuePresses=0;
      pet.rescueUntil=offline?0:Date.now()+60*MIN;
    }
  }else if(asleep){
    pet.health+=mins/30;
  }
  /* 离线期间不会静默死亡，最低压到 1 */
  if(offline&&pet.health<1) pet.health=1;
  pet.hunger=clamp(pet.hunger,0,100);
  pet.mood=clamp(pet.mood,0,100);
  pet.clean=clamp(pet.clean,0,100);
  pet.health=clamp(pet.health,0,100);
  pet.bond=clamp(pet.bond,0,100);
  pet.poopAcc=clamp(pet.poopAcc,0,9999);
  /* 幼体/成长期按分钟累计照顾质量，成体时结算形态 */
  if(pet.stage!=='adult'&&mins>0&&pet.q){
    pet.q.hunger+=pet.hunger*mins;
    pet.q.mood+=pet.mood*mins;
    pet.q.clean+=pet.clean*mins;
    pet.q.n+=mins;
  }
  refreshStage(pet);
}
/* 每 5 分钟切一段，让「饱食/清洁 <15 心情掉更快」的阈值即时生效 */
function simulate(ms,offline){
  if(!state.pet||!isFinite(ms)||ms<=0) return;
  let left=Math.min(ms,offline?OFFLINE_CAP:12*60*MIN);
  while(left>0){
    const step=Math.min(left,5*MIN);
    simulateStep(step,offline);
    left-=step;
  }
}
function fmtGap(ms){
  const mins=Math.max(0,Math.floor(ms/MIN));
  if(mins<60) return t('unit_min',{n:mins});
  if(mins>=24*60){
    const d=Math.floor(mins/(24*60)), h=Math.floor((mins%(24*60))/60);
    return t('unit_day',{n:d})+(h?' '+t('unit_hour',{n:h}):'');
  }
  const h=Math.floor(mins/60), m=mins%60;
  return t('unit_hour',{n:h})+(m?' '+t('unit_min',{n:m}):'');
}
/* 长离线的分层台词：1 天 / 3 天 / 7 天 */
function offlineMessage(raw){
  const gap=fmtGap(raw);
  if(raw>=7*24*60*MIN) return t('offlineLong7',{gap:gap});
  if(raw>=3*24*60*MIN) return t('offlineLong3',{gap:gap});
  if(raw>=24*60*MIN) return t('offlineLong1',{gap:gap});
  return t('offlineMsg',{gap:gap});
}
function fmtAgo(ms){
  const m=Math.max(0,Math.floor(num(ms,0)/MIN));
  if(m<1) return t('agoJust');
  if(m<60) return t('agoMin',{n:m});
  const h=Math.floor(m/60);
  if(h<24) return t('agoHour',{n:h});
  return t('agoDay',{n:Math.floor(h/24)});
}
/* 常客计数：startVisit 时累加，openVisit 用它切换语气/礼物 */
function visitCount(id){
  const r=state.visitorSeen&&state.visitorSeen[id];
  return r?num(r.count,0):0;
}
function visitorRecords(){
  const seen=state.visitorSeen||{};
  const out=[];
  Object.keys(seen).forEach(function(id){
    const r=seen[id];
    if(!r||!num(r.count,0)) return;
    const item=rosterById(id);
    out.push({id:id,name:(item&&item.name)||t('yardBanny'),
      count:num(r.count,0),lastAt:num(r.lastAt,0)});
  });
  out.sort(function(a,b){ return b.count-a.count||b.lastAt-a.lastAt; });
  return out;
}
function settleOffline(){
  const pet=state.pet;
  if(!pet) return;
  const now=Date.now();
  const raw=Math.max(0,now-num(pet.lastSeen,now));
  const gap=clamp(raw,0,OFFLINE_CAP);
  pet.lastSeen=now;
  if(gap>5000){
    simulate(gap,true);
    /* 离线回来仍处重症：给 60 秒抢救窗口，不直接判死 */
    if(pet.sick&&pet.critical){
      pet.rescueUntil=now+60000;
      pet.rescuePresses=0;
      pet.rescueWindow=true;
    }
    if(raw>MIN){
      ui.bootUntil=now+800;
      ui.msg=offlineMessage(raw);
      ui.msgUntil=now+4200;
      setTimeout(render,860);
      setTimeout(render,4260);
    }
    saveState();
  }
}

/* ============================================================
   庭院访客（M4）：触发 / 入场 / 敲玻璃 / 无视 / 退场
   ============================================================ */
function rosterById(id){
  const fromRoster=function(list){
    if(!Array.isArray(list)) return null;
    for(let i=0;i<list.length;i++){
      if(list[i]&&list[i].id===id) return list[i];
    }
    return null;
  };
  return fromRoster(ROSTER)||fromRoster(SAMPLES);
}
/* 数据源：庭院当前 3 只；过滤最近 2 只；不足时在庭院内回退；单机用样机。
   庭院非空时绝不回退到全名册——否则会抽到没来庭院的月巴。 */
function visitorPool(){
  const recent=Array.isArray(state.visitLog)?state.visitLog:[];
  const out=[], seen={};
  function add(t,ignoreRecent){
    if(!t||!t.id||seen[t.id]) return false;
    if(!ignoreRecent&&recent.indexOf(t.id)>=0) return false;
    seen[t.id]=1;
    out.push({id:t.id,name:t.name||t.id,shape:t.shape||'round',r:t.r||1,
      color:t.color||'#8fb3a6',art:t.art||''});
    return true;
  }
  const yard=Array.isArray(YARD)?YARD:[];
  function yardRec(i){
    const id=typeof yard[i]==='string'?yard[i]:(yard[i]&&yard[i].id);
    if(!id) return null;
    return rosterById(id)||{id:id,name:t('yardBanny'),shape:'round',r:1,color:'#8fb3a6',art:''};
  }
  /* 连上主游戏但庭院为空：不生成访客（走「今天没人来看你」） */
  if(!yard.length&&inFrame&&!state.sampleMode) return [];
  for(let i=0;i<yard.length;i++) add(yardRec(i));
  /* 庭院有月巴但都刚来过：只在庭院内回退，挑最久没来的那只 */
  if(yard.length&&!out.length){
    let best=null, bestIdx=Infinity;
    for(let i=0;i<yard.length;i++){
      const rec=yardRec(i);
      if(!rec) continue;
      const idx=recent.indexOf(rec.id);
      if(idx<0){ best=rec; break; }
      if(idx<bestIdx){ bestIdx=idx; best=rec; }
    }
    if(best) add(best,true);
    return out;
  }
  if(!yard.length&&!out.length&&ROSTER&&ROSTER.length){
    for(let i=0;i<ROSTER.length;i++) add(ROSTER[i]);
  }
  if(!yard.length&&!out.length&&(state.sampleMode||!inFrame)){
    for(let i=0;i<SAMPLES.length;i++) add(SAMPLES[i]);
  }
  return out;
}
/* ---------- 访客原立绘：DOM 层渲染，不做像素化 ----------
   有主游戏下发的 PNG 就原样用 <img>；离线 / 没图时按同一套立绘几何本地重建 SVG。 */
function shadeHex(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function bodySVG(sh,c,dk){
  const f='fill="'+c+'"', s='stroke="'+dk+'" stroke-width="1.4"';
  switch(sh){
    case 'round':  return '<circle cx="20" cy="21" r="13" '+f+' '+s+'/>';
    case 'tall':   return '<ellipse cx="20" cy="22" rx="9.5" ry="14" '+f+' '+s+'/>';
    case 'wide':   return '<ellipse cx="20" cy="22" rx="15" ry="10.5" '+f+' '+s+'/>';
    case 'squish': return '<ellipse cx="20" cy="24" rx="13.5" ry="9" '+f+' '+s+'/>';
    case 'cube':   return '<rect x="8" y="9" width="24" height="25" rx="5" '+f+' '+s+'/>';
    case 'big':    return '<ellipse cx="20" cy="22" rx="16" ry="13" '+f+' '+s+'/>';
    case 'bean':   return '<circle cx="15.5" cy="22" r="9.5" '+f+' '+s+'/><circle cx="24.5" cy="22" r="9.5" '+f+' '+s+'/>';
    case 'heart':  return '<path d="M20 32 C10 24 6 17 9 12 C12 7.5 17 8 20 12 C23 8 28 7.5 31 12 C34 17 30 24 20 32 Z" '+f+' '+s+'/>';
    case 'drop':   return '<path d="M20 7 C26 15 29 20 29 25 A9 9 0 1 1 11 25 C11 20 14 15 20 7 Z" '+f+' '+s+'/>';
    case 'star':   return '<path d="M20 8 L23.6 16.8 L32.6 17.2 L25.6 22.9 L28.4 31.4 L20 26.6 L11.6 31.4 L14.4 22.9 L7.4 17.2 L16.4 16.8 Z" '+f+' '+s+'/>';

function visitorSvg(who){
  const shape=who.shape||'round';
  const c=/^#[0-9a-f]{6}$/i.test(who.color||'')?who.color:'#8fb3a6';
  const body=bodySVG(shape,c,shadeHex(c,-26));
  const h=hashId(who.id||'');
  const eye=h%4, mouth=(h>>2)%4;
  const ex1=shape==='tall'?11:shape==='wide'?12:10, ex2=30-ex1;
  let eyes, mm;
  if(eye===0) eyes='<circle cx="'+ex1+'" cy="18" r="2.4" fill="#3b3654"/><circle cx="'+ex2+'" cy="18" r="2.4" fill="#3b3654"/>';
  else if(eye===1) eyes='<ellipse cx="'+ex1+'" cy="18" rx="2.5" ry="3" fill="#3b3654"/><ellipse cx="'+ex2+'" cy="18" rx="2.5" ry="3" fill="#3b3654"/>';
  else if(eye===2) eyes='<path d="M'+ex1+' 15.5 l2.4 2.5 l-2.4 2.5 l-2.4 -2.5 z" fill="#3b3654"/><path d="M'+ex2+' 15.5 l2.4 2.5 l-2.4 2.5 l-2.4 -2.5 z" fill="#3b3654"/>';
  else eyes='<path d="M'+(ex1-2)+' 18 h4 M'+(ex2-2)+' 18 h4" stroke="#3b3654" stroke-width="1.8" stroke-linecap="round"/>';
  if(mouth===0) mm='<path d="M14 23.5 Q17 27 20 23.5 Q23 27 26 23.5" stroke="#3b3654" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
  else if(mouth===1) mm='<circle cx="20" cy="24.5" r="2.4" fill="#3b3654"/>';
  else if(mouth===2) mm='<path d="M15 25.5 Q20 29 25 25.5 L25 26.5 Q20 30 15 26.5 Z" fill="#3b3654"/>';
  else mm='<path d="M15 26 Q20 24.5 25 26" stroke="#3b3654" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
  const hi='<circle cx="13.5" cy="10.5" r="2.1" fill="rgba(255,255,255,.5)"/>';
  return '<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">'+body+eyes+mm+hi+'</svg>';
}
let visitorNode=null, visitorKey='', visitorPopTimer=null, visitorHopTimer=null;
function clearVisitor(){
  if(visitorPopTimer){ clearTimeout(visitorPopTimer); visitorPopTimer=null; }
  if(visitorHopTimer){ clearTimeout(visitorHopTimer); visitorHopTimer=null; }
  if(visitorEl) visitorEl.innerHTML='';
  visitorNode=null; visitorKey='';
}
function mountVisitor(who){
  clearVisitor();
  const vb=document.createElement('div'); vb.className='vb';
  const art=document.createElement('div'); art.className='vbArt';
  if(who.art){
    const img=document.createElement('img');
    img.alt=''; img.decoding='async';
    img.onerror=function(){ art.innerHTML=visitorSvg(who); };
    img.src=who.art;
    art.appendChild(img);
  }else{
    art.innerHTML=visitorSvg(who);
  }
  vb.appendChild(art);
  visitorEl.appendChild(vb);
  visitorNode=vb;
  visitorKey=(who.id||'')+'|'+(who.art||'')+'|'+(who.shape||'');
}
function syncVisitor(){
  if(!visitorEl) return;
  if(!vis||!state.pet||ui.endCard||ui.page){
    if(visitorNode) clearVisitor();
    return;
  }
  const key=(vis.pet.id||'')+'|'+(vis.pet.art||'')+'|'+(vis.pet.shape||'');
  if(!visitorNode||visitorKey!==key) mountVisitor(vis.pet);
  visitorNode.style.left=Math.round(vis.x*2)+'px';
  const walking=vis.phase==='in'||vis.phase==='out';
  visitorNode.classList.toggle('walk',walking);
  if(walking){ visitorNode.classList.remove('pop'); return; }
  if(vis.phase==='open'&&!visitorNode.classList.contains('pop')&&!visitorPopTimer){
    visitorNode.classList.add('pop');
    visitorPopTimer=setTimeout(function(){
      visitorPopTimer=null;
      if(visitorNode) visitorNode.classList.remove('pop');
    },480);
  }
}
/* 敲玻璃：访客原地 Q 弹一下 */
function visitorHop(){
  if(!visitorNode) return;
  visitorNode.classList.remove('hop');
  void visitorNode.offsetWidth;
  visitorNode.classList.add('hop');
  if(visitorHopTimer) clearTimeout(visitorHopTimer);
  visitorHopTimer=setTimeout(function(){
    visitorHopTimer=null;
    if(visitorNode) visitorNode.classList.remove('hop');

}
function syncBubble(){
  if(!vis||!vis.line){ bubbleEl.classList.remove('show'); return; }
  if(bubbleMain.textContent!==vis.line) bubbleMain.textContent=vis.line;
  const sub=vis.petLine||'';

}
function hideBubble(){ bubbleEl.classList.remove('show'); }
function clearVisit(){
  if(visitTimer){ clearInterval(visitTimer); visitTimer=null; }
  vis=null;
  hideBubble();
}
function startVisit(){
  const pet=state.pet;
  if(!pet||vis||ui.endCard||hatchState) return false;
  const pool=visitorPool();
  if(!pool.length){
    if(!YARD.length&&!state.sampleMode) say(t('nobody'),3200);
    pet.nextVisitAt=0;
    pet.nextVisitCheck=Date.now()+VISIT_CHECK;
    saveState();
    return false;
  }
  const who=pool[Math.floor(Math.random()*pool.length)];
  const side=Math.random()<0.5?'left':'right';
  const entry=side==='left'?-40:168;
  const stop=side==='left'?4:124;
  vis={
    pet:who, side:side, phase:'in', t0:Date.now(), x:entry,
    startX:entry, endX:stop, line:'', petLine:'', knocks:0, tomato:false
  };
  state.visitLog=Array.isArray(state.visitLog)?state.visitLog:[];
  state.visitLog.push(who.id);
  if(state.visitLog.length>2) state.visitLog=state.visitLog.slice(-2);
  /* 累计来访次数：5 次换常客语气，10 次带礼物 */
  state.visitorSeen=state.visitorSeen||{};
  const seen=state.visitorSeen[who.id]||{count:0,lastAt:0};
  seen.count=clamp(num(seen.count,0)+1,0,9999);
  seen.lastAt=Date.now();
  state.visitorSeen[who.id]=seen;
  pet.nextVisitAt=0;
  pet.nextVisitCheck=Date.now()+VISIT_CHECK;
  pet.lastVisitAt=Date.now();
  saveState();
  if(visitTimer) clearInterval(visitTimer);
  visitTimer=setInterval(visitTick,80);
  render();
  return true;
}
/* 开口：选一句嘲讽，首次被嘲讽心情 −2，累计被嘲次数 */
function openVisit(){
  const pet=state.pet;
  vis.phase='open'; vis.t0=Date.now();
  const count=visitCount(vis.pet&&vis.pet.id);
  let line=tauntOne('open'), kind='open';
  if(state.pendingDeathTaunt){ line=tauntOne('death'); kind='death'; state.pendingDeathTaunt=false; }
  else if(pet&&pet.critical){ line=tauntOne('crit'); kind='crit'; }
  else if(pet&&pet.sick){ line=tauntOne('sick'); kind='sick'; }
  else if(pet&&num(pet.ignoredCount,0)>=3){
    line=tauntOne('steal'); kind='steal';
    pet.ignoredCount=0;
  }else if(count>=10&&count%10===0){
    line=tauntOne('gift'); kind='gift';
    vis.gift=true;
    if(pet){
      pet.mood=clamp(num(pet.mood,70)+5,0,100);
      bondAdd(pet,1);
    }
  }else if(count>=5){
    line=tauntOne('friendly'); kind='friendly';
  }
  vis.kind=kind;
  vis.line=line;
  vis.petLine=t('pet_quiet');
  sfx('taunt');
  if(pet){
    if(kind!=='friendly'&&kind!=='gift'){
      pet.tauntCount=clamp(num(pet.tauntCount,0)+1,0,99999);
    }
    if(pet.stats) pet.stats.visit=clamp(num(pet.stats.visit,0)+1,0,999999);
    if(kind==='friendly') pet.mood=clamp(num(pet.mood,70)+1,0,100);
    else if(kind!=='gift') pet.mood=clamp(num(pet.mood,70)-2,0,100);
  }
  syncBubble();
  saveState();
  render();
}
function stayVisit(){
  vis.phase='stay'; vis.t0=Date.now();
  render();
}
function beginOut(line,petLine){
  if(!vis) return;
  vis.phase='out'; vis.t0=Date.now();
  if(line) vis.line=line;
  if(petLine) vis.petLine=petLine;
  syncBubble();
  render();
}
function finishVisit(){
  const pet=state.pet;
  clearVisit();
  if(pet){
    pet.afterVisitUntil=Date.now()+VISIT_TURN;
    pet.nextVisitAt=0;
    pet.nextVisitCheck=Date.now()+VISIT_CHECK;
    saveState();
  }
  ui.msg=t('visitorLeft');
  ui.msgUntil=Date.now()+2000;
  render();
}
function visitTick(){
  if(!vis){
    if(visitTimer){ clearInterval(visitTimer); visitTimer=null; }
    return;
  }
  if(document.hidden) return;
  if(!state.pet||ui.endCard){ clearVisit(); render(); return; }
  const el=Date.now()-vis.t0;
  if(vis.phase==='in'){
    const k=clamp(el/VISIT_IN,0,1);
    vis.x=vis.startX+(vis.endX-vis.startX)*k;
    if(el>=VISIT_IN) openVisit();
  }else if(vis.phase==='open'){
    if(el>=VISIT_OPEN) stayVisit();
  }else if(vis.phase==='stay'){
    if(el>=VISIT_STAY) beginOut(tauntOne('leave'),t('pet_follow'));
  }else if(vis.phase==='out'){
    const k=clamp(el/VISIT_OUT,0,1);
    vis.x=vis.endX+(vis.startX-vis.endX)*k;
    if(el>=VISIT_OUT){ finishVisit(); return; }
  }
  syncVisitor();
  drawLcd();
}
/* 敲玻璃：1–3 次回更欠的台词，第 3 次提前退场（心情 +4） */
function knockVisit(){
  const pet=state.pet;
  if(!vis||vis.phase!=='stay') return;
  vis.knocks++;
  vis.line=tauntList('knock')[Math.min(vis.knocks,3)-1];
  vis.petLine=t('pet_hop');
  sfx('knock');
  haptic(10);
  startAnim('startle',420);
  visitorHop();
  if(vis.knocks>=3){
    if(pet){
      pet.mood=clamp(num(pet.mood,70)+4,0,100);
      saveState();
    }
    beginOut(tauntOne('leave'),t('pet_watch'));
  }else{
    syncBubble();
    render();
  }
}
/* 无视：访客自嘲一句后离开 */
function ignoreVisit(){
  if(!vis||vis.phase!=='stay') return;
  const pet=state.pet;
  if(pet) pet.ignoredCount=clamp(num(pet.ignoredCount,0)+1,0,99);

/* 访客在场时喂番茄：只走这条专属台词，不扣番茄、不写主存档 */

/* 每秒检查：首访 45 秒；之后 3 分钟一次 35%，两次至少隔 8 分钟 */
function tickVisit(now){
  const pet=state.pet;
  if(!pet||vis||ui.endCard||hatchState) return;
  if(now<ui.bootUntil) return;
  if(FOCUS) return;
  if(pet.sleeping||pet.critical||ui.play||ui.menu||ui.page) return;
  const first=num(pet.nextVisitAt,0);
  if(first&&now>=first){ startVisit(); return; }
  const at=num(pet.nextVisitCheck,0);
  if(at&&now>=at){
    pet.nextVisitCheck=now+VISIT_CHECK;
    if(pet.lastVisitAt&&now-pet.lastVisitAt<VISIT_GAP){ saveState(); return; }
    if(Math.random()<0.35) startVisit();
    else saveState();
  }
}

/* ---------- 小游戏：三回合节奏条 ---------- */
function startPlay(){
  const pet=state.pet;
  if(!pet) return;
  if(pet.sick){ say(t('playSick'),1600); return; }
  const left=cdLeft(pet,'play',5*MIN);
  if(left>0){
    const s=Math.ceil(left/1000);
    say(t('playWait',{time:s>=60?t('unit_min',{n:Math.ceil(s/60)}):t('unit_sec',{n:s})}),1600);
    return;
  }
  markAction(pet,'play');
  ui.menu=false;
  ui.play={round:0,hits:0,phase:'run',t0:0,dur:1600,pos:0,zone:0.3,zw:0.2,
    nextAt:0,lastHit:null,msg:t('playStart')};
  startRound(0);
  if(playTimer) clearInterval(playTimer);
  playTimer=setInterval(playTick,33);
  saveState();
  render();
}
function startRound(i){
  const p=ui.play;
  if(!p) return;
  const now=Date.now();
  if(i>=3){
    p.phase='end';
    p.nextAt=now+800;
    p.msg=p.hits>=2?t('playGood'):t('playBad');
    return;
  }
  p.round=i; p.phase='run'; p.t0=now; p.pos=0; p.lastHit=null;
  p.dur=1600-i*250;
  p.zw=0.2-i*0.02;
  p.zone=0.12+Math.random()*(0.76-p.zw);
  p.msg=t('playRound',{n:i+1});
}
function pressPlay(){
  const p=ui.play;
  if(!p||p.phase!=='run') return;
  const center=p.zone+p.zw/2;
  const hit=Math.abs(p.pos-center)<=p.zw/2;
  if(hit) p.hits++;
  p.lastHit=hit;
  p.phase='result';
  p.nextAt=Date.now()+480;
  p.msg=hit?t('playHit'):t('playMiss');
  sfx(hit?'hit':'miss');
  drawLcd();
  updateText();
}
function playTick(){
  const p=ui.play;
  if(!p) return;
  const now=Date.now();
  if(p.phase==='run'){
    p.pos=clamp((now-p.t0)/p.dur,0,1);
    if(p.pos>=1){
      p.lastHit=false;
      p.phase='result';
      p.nextAt=now+480;
      p.msg=t('playNoCatch');
    }
  }else if(p.phase==='result'&&now>=p.nextAt){
    startRound(p.round+1);
  }else if(p.phase==='end'&&now>=p.nextAt){
    finishPlay();
    return;
  }
  drawLcd();
  updateText();
}
function finishPlay(){
  const p=ui.play;
  if(!p) return;
  const pet=state.pet;
  ui.play=null;
  if(playTimer){ clearInterval(playTimer); playTimer=null; }
  if(pet){
    if(p.hits>=2){
      pet.mood=clamp(pet.mood+8,0,100);
      bondAdd(pet,3);
      say(t('playEndGood'),2000);
      sfx('good');
      ambientBurst('star',3);
    }else{
      pet.mood=clamp(pet.mood+1,0,100);
      bondAdd(pet,1);
      say(t('playEndBad'),2000);
      sfx('bad');
      ambientBurst('star',1);
    }
    careTick(pet,'play');
    saveState();
  }
  render();
}
function cancelPlay(){
  if(!ui.play) return;
  ui.play=null;
  if(playTimer){ clearInterval(playTimer); playTimer=null; }
  say(t('playCancel'),1200);
}

/* ---------- 时钟：在线结算 / 自动存盘 ---------- */
function startClock(){
  if(clockTimer) clearInterval(clockTimer);
  lastTick=Date.now();
  clockTimer=setInterval(function(){
    if(document.hidden) return;
    const now=Date.now();
    let dt=clamp(now-lastTick,0,60*MIN);
    lastTick=now;
    if(state.pet){
      if(!ui.play&&!ui.endCard) simulate(dt,false);
      if(state.pet){
        state.pet.lastSeen=now;
        saveAcc+=dt;
        if(saveAcc>=10000){ saveAcc=0; saveState(); }
        checkEnd();
        if(state.pet) tickVisit(now);
      }
      if(state.pet) checkNameUnlock(now);
      updateText();
      drawLcd();
    }
  },1000);
}

        line+=(i?'　':'')+(i===ui.menuSel?'▶':'　')+t('feed_'+FEED[i].key);
      }
      setText(t('feedPrompt')+'\n'+line);
      return;
    }
    if(pet.sleeping){
      setText(t('sleepLine',{name:petName(pet)}));
      return;
    }
    if(pet.critical){
      setText(t('critLine',{name:petName(pet),stage:stageText(pet),hp:Math.round(pet.health)}));
      return;
    }
    setText(t('petStat',{name:petName(pet),stage:stageText(pet),
      sick:pet.sick?t('sickSuffix'):'',h:Math.round(pet.hunger),
      m:Math.round(pet.mood),c:Math.round(pet.clean)})+(FOCUS?'\n'+t('focusTag'):''));
  }else if(mode==='hatch'){
    /* 文字在演出末段由 hatchTick 写入 */
  }else if(state.eggs.length){
    setText((state.sampleMode?t('demoEggsLine')+'\n':'')+t('eggPrompt'));
  }else{
    setText(state.sampleMode?t('demoEggs'):t('connecting'));
  }
}

/* ---------- 语言落 DOM（M5） ---------- */
function applyLangDom(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;
  document.title=t('title');
  if(device) device.setAttribute('aria-label',t('ariaDevice'));
  if(cv) cv.setAttribute('aria-label',t('ariaLcd'));
  if(swatches) swatches.setAttribute('aria-label',t('ariaShell'));
  [['A','keyA','keySelect'],['B','keyB','keyConfirm'],['C','keyC','keyCancel']].forEach(function(k){
    const b=document.querySelector('.key[data-k="'+k[0]+'"]');
    if(!b) return;
    b.setAttribute('aria-label',t(k[1]));
    const s=b.querySelector('small');
    if(s) s.textContent=t(k[2]);
  });
  [['btnExport','toolExport'],['btnImport','toolImport'],['btnReset','toolReset']].forEach(function(pair){
    const b=$(pair[0]);
    if(b) b.textContent=t(pair[1]);
  });
  const h=$('hint');
  if(h) h.textContent=t('hint');
  const sn=$('shellName');
  if(sn&&state.shell) sn.textContent=t('theme_'+state.shell);
}

/* ---------- 配色 ---------- */
function applyTheme(id){
  const th=THEMES.filter(function(x){return x.id===id;})[0]||THEMES[0];
  theme=th;
  state.shell=th.id;
  spriteCacheKeysClear();
  document.documentElement.style.setProperty('--shell',th.shell);
  document.documentElement.style.setProperty('--bezel',th.bezel);
  document.documentElement.style.setProperty('--lcd',th.lcd);
  document.documentElement.style.setProperty('--ink',th.ink);
  document.documentElement.style.setProperty('--ghost',th.ghost);
  document.documentElement.style.setProperty('--label',th.label);
  document.documentElement.style.setProperty('--key-ink',th.keyInk);
  $('shellName').textContent=t('theme_'+th.id);
  document.querySelector('meta[name="theme-color"]').setAttribute('content',th.shell);
  const btns=swatches.children;
  for(let i=0;i<btns.length;i++){
    btns[i].setAttribute('aria-pressed',btns[i].dataset.id===th.id?'true':'false');
  }
  saveState();
  render();
}
function spriteCacheKeysClear(){
  for(const k in spriteCache) delete spriteCache[k];
}
function buildSwatches(){
  let html='';
  for(let i=0;i<THEMES.length;i++){
    const th=THEMES[i], name=t('theme_'+th.id);
    html+='<button class="swatch" data-id="'+th.id+'" title="'+name+'" aria-label="'+name+'"'+
      ' style="--sw:'+th.shell+'" onclick="pickShell(\''+th.id+'\')"></button>';
  }
  swatches.innerHTML=html;
}
function pickShell(id){ applyTheme(id); }
window.pickShell=pickShell;

/* ---------- 渲染与动画 ---------- */
function render(){
  syncBubble();
  updateText();
  syncVisitor();
  drawLcd();
}
let idleTimer=null;
function idleTick(){
  if(document.hidden) return;
  if(hatchState) return;
  frame=(frame+1)%4;
  drawLcd();
}
function restartIdle(){
  if(idleTimer) clearInterval(idleTimer);
  idleTimer=setInterval(idleTick,LOW?500:320);
}
let holdTimer=null, holdStart=0;
function startHold(){
  if(currentMode()!=='eggs'||!state.eggs.length||holdTimer) return;
  const e=state.eggs[sel];
  if(!e||e.sealed||e.hatched) return;
  holdStart=Date.now();
  holdTimer=setInterval(function(){
    holdP=Math.min(1,(Date.now()-holdStart)/HOLD_MS);
    drawLcd();
    if(holdP>=1) endHold(true);
  },60);
}
function endHold(complete){
  if(!holdTimer) return;
  clearInterval(holdTimer); holdTimer=null;
  holdP=0;
  if(complete) beginHatch();
  else drawLcd();
}

/* ---------- 孵化 ---------- */
let hatchTimer=null, hatchTextShown=false;
function beginHatch(){
  const e=state.eggs[sel];
  if(!e||e.sealed||e.hatched) return;
  if(ui.tut){ ui.tut=null; state.tutorialDone=true; saveState(); }
  hatchState={slot:sel,t0:Date.now()};
  hatchTextShown=false;
  setText('');
  sfx('hatch');
  if(hatchTimer) clearInterval(hatchTimer);
  hatchTimer=setInterval(hatchTick,55);
  drawLcd();
}
function hatchTick(){
  const el=Date.now()-hatchState.t0;
  drawLcd();
  if(el>=2200&&!hatchTextShown){
    hatchTextShown=true;
    const e=hatchStateEgg();
    const dup=state.eggs.filter(function(x){ return x.species===e.species; }).length>1;
    const tail=(dup?t('hatchTailDup'):'')+(state.sampleMode?t('hatchTailDemo'):'');
    setText(e.name+tail+'\n'+stageLabel('baby'));
  }
  if(el>=HATCH_MS) finishHatch();
}
function hatchStateEgg(){
  return state.eggs[hatchState.slot]||{species:'',shape:'round',name:'',r:1};
}
function skipHatch(){
  if(!hatchState) return;
  hatchState.t0=Date.now()-HATCH_MS;
  finishHatch();
}
function finishHatch(){
  if(!hatchState) return;
  const e=hatchStateEgg();
  if(hatchTimer){ clearInterval(hatchTimer); hatchTimer=null; }
  for(let i=0;i<3;i++){
    if(i!==hatchState.slot&&state.eggs[i]) state.eggs[i].sealed=true;
  }
  e.sealed=false; e.hatched=true;
  state.pet=makePet(e);
  hatchState=null;
  saveState();
  render();
}
function makePet(egg){
  return ensurePet({
    species:egg.species, name:egg.name, shape:egg.shape, r:egg.r||1,
    bornAt:Date.now(), stage:'baby',
    hunger:70, mood:70, clean:80, health:100, bond:0,
    sick:false, critical:false, sickSince:0,
    riskAcc:0, rescueUntil:0, rescuePresses:0, medsGiven:0,
    poops:[], sleeping:false, lightOff:false,
    poopAcc:0, poopNext:90+Math.random()*30,
    lastFeed:0, lastPlay:0, lastClean:0, lastPet:0,
    bondLog:[],
    careCount:0, tauntCount:0, ignoredCount:0, lastSeen:Date.now(),
    nickname:'', nickUnlocked:false, persona:personaFor(egg.species).id,
    form:'', q:{hunger:0,mood:0,clean:0,n:0,sick:0},
    stats:{feed:0,play:0,clean:0,pet:0,med:0,rescue:0,visit:0,sick:0,maxBond:0},
    feedLog:[],
    nextVisitAt:Date.now()+VISIT_FIRST, nextVisitCheck:0, lastVisitAt:0, afterVisitUntil:0
  });
}

/* ---------- 交互 ---------- */
function selectNext(){
  if(currentMode()!=='eggs'||!state.eggs.length) return;
  for(let i=1;i<=3;i++){
    const s=(sel+i)%3;
    const e=state.eggs[s];
    if(e&&!e.sealed&&!e.hatched){ sel=s; break; }
  }
  drawLcd();
}
function activateIcon(id){
  const pet=state.pet;
  if(!pet||ui.play||ui.endCard) return;
  ui.page=null;
  if(ui.menu&&id!=='feed') ui.menu=false;
  /* 访客在场：只保留「喂番茄」这一条专属分支 */
  if(vis){
    if(id==='feed') visitTomato();
    return;
  }
  if(id==='light'){ toggleLight(); return; }
  if(id==='med'){ takeMedicine(); return; }
  if(refuseAsleep()) return;
  if(id==='feed'){
    ui.menu=true; ui.menuSel=0; ui.sel=0;
    ui.msgUntil=0;
    render();
    return;
  }
  if(id==='clean'){ doClean(); return; }
  if(id==='play'){ startPlay(); }
}
function onA(){
  const mode=currentMode();
  if(mode==='end') return;
  if(mode==='eggs'){ selectNext(); return; }
  if(mode!=='pet'||ui.play) return;
  if(ui.page==='status'){
    ui.page='stats';
    render();
    return;
  }
  if(ui.page==='stats'){
    ui.page='album';
    ui.albumIdx=Math.max(0,state.gallery.length-1);
    render();
    return;
  }
  if(ui.page==='name'){
    ui.nameSel=(ui.nameSel+1)%nameChoices().length;
    render();
    return;
  }
  if(ui.page==='visitors'){
    ui.page='album';
    ui.albumIdx=Math.max(0,state.gallery.length-1);
    render();
    return;
  }
  if(ui.page==='album'){
    if(state.gallery.length) ui.albumIdx=(ui.albumIdx-1+state.gallery.length)%state.gallery.length;
    render();
    return;
  }
  if(ui.menu){
    ui.menuSel=(ui.menuSel+1)%FEED.length;
    ui.msgUntil=0;
    render();
    return;
  }
  ui.sel=(ui.sel+1)%4;
  drawLcd();
}
function onB(){
  const mode=currentMode();
  if(mode==='end'){ dismissEnd(); return; }
  if(mode==='hatch'){ skipHatch(); return; }
  if(mode!=='pet') return;
  if(ui.page==='status'){ doGraduate(); return; }
  if(ui.page==='stats'){
    if(nameReady(state.pet)){ ui.page='name'; ui.nameSel=0; render(); }
    else { ui.page='status'; render(); }
    return;
  }
  if(ui.page==='name'){ confirmName(); return; }
  if(ui.page==='visitors'){ ui.page='stats'; render(); return; }
  if(ui.page==='album'){ ui.page='visitors'; render(); return; }
  if(ui.play){ pressPlay(); return; }
  const pet=state.pet;
  if(pet&&pet.critical&&pet.rescueWindow&&num(pet.rescueUntil,0)>Date.now()){ pressRescue(); return; }
  if(vis){ if(vis.phase==='stay') knockVisit(); return; }
  if(ui.menu){ confirmFeed(); return; }
  activateIcon(iconsNow()[ui.sel].id);
}
function onC(){
  if(ui.endCard) return;
  if(vis){ if(vis.phase==='stay') ignoreVisit(); return; }
  if(ui.page==='name'){ ui.page='stats'; say(t('nameLater'),1400); return; }
  if(ui.page){ ui.page=null; render(); return; }
  if(ui.play){ cancelPlay(); return; }
  if(ui.menu){ ui.menu=false; say(t('cancelSay'),900); return; }
}
/* ---------- 音效（M5）：WebAudio 合成，无外部资源 ---------- */
let audioCtx=null, audioMaster=null, audioLive=0;
function audioReady(){
  if(MUTED) return null;
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      audioCtx=new AC();
      audioMaster=audioCtx.createGain();
      audioMaster.gain.value=0.28;
      audioMaster.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended'&&audioCtx.resume) audioCtx.resume();
    return audioCtx;
  }catch(e){ return null; }
}
function note(c,f0,f1,dur,type,vol,delay){
  if(!c||audioLive>=2) return;
  const t0=c.currentTime+(delay||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,t0);
  if(f1&&f1!==f0) o.frequency.linearRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(vol===undefined?0.4:vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(audioMaster);
  audioLive++;
  o.onended=function(){
    audioLive=Math.max(0,audioLive-1);
    try{ g.disconnect(); }catch(e){}
  };
  o.start(t0); o.stop(t0+dur+0.02);
}
const SFX={
  click:function(c){ note(c,440,440,0.04,'square',0.35); },
  hatch:function(c){ note(c,300,620,0.22,'triangle',0.5); },
  eat:function(c){ note(c,520,700,0.09,'triangle',0.45); },
  refuse:function(c){ note(c,200,200,0.09,'square',0.4); },
  pet:function(c){ note(c,780,980,0.08,'triangle',0.4); },
  clean:function(c){ note(c,620,300,0.1,'triangle',0.4); },
  med:function(c){ note(c,880,880,0.06,'square',0.35); },
  rescue:function(c){ note(c,300,300,0.05,'square',0.35); },
  hit:function(c){ note(c,880,880,0.06,'square',0.4); },
  miss:function(c){ note(c,220,220,0.09,'square',0.3); },
  good:function(c){ note(c,660,880,0.16,'triangle',0.45); },
  bad:function(c){ note(c,330,220,0.18,'triangle',0.4); },
  taunt:function(c){ note(c,360,360,0.07,'triangle',0.35); },
  knock:function(c){ note(c,180,180,0.05,'square',0.35); },
  sick:function(c){ note(c,240,240,0.12,'square',0.35); },
  death:function(c){ note(c,110,110,0.9,'triangle',0.45); },
  graduate:function(c){ note(c,660,440,0.2,'triangle',0.4); },
  light:function(c){ note(c,500,500,0.05,'square',0.32); }
};
/* 触觉：只在支持 vibrate 的设备上轻震，失败静默 */
function haptic(ms){
  try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){}
}
function sfx(kind){
  if(MUTED) return;
  const fn=SFX[kind];
  if(!fn) return;
  const c=audioReady();
  if(c) fn(c);
}

/* ---------- 独立打开：导出 / 导入 / 重置 ---------- */
function flash(msg){
  if(!lcdText) return;
  setText(msg);
  clearTimeout(flash._t);
  flash._t=setTimeout(function(){ render(); },1600);
}
function exportSave(){
  try{
    const blob=new Blob([JSON.stringify(state)],{type:'application/json'});
    const a=document.createElement('a');
    const d=new Date(), pad=function(n){ return (n<10?'0':'')+n; };
    a.href=URL.createObjectURL(blob);
    a.download='yueba-tamago-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} },1000);
    flash(t('ioExportOk'));
  }catch(e){ flash(t('ioExportFail')); }
}
function bindTools(){
  const ex=$('btnExport'), im=$('btnImport'), rs=$('btnReset'), file=$('importFile');
  if(!ex||!im||!rs||!file) return;
  ex.addEventListener('click',function(){ exportSave(); });
  im.addEventListener('click',function(){ try{ file.value=''; file.click(); }catch(e){} });
  file.addEventListener('change',function(){
    const f=file.files&&file.files[0];
    if(!f) return;
    if(f.size>2*1024*1024){ flash(t('ioTooBig')); return; }
    const fr=new FileReader();
    fr.onload=function(){
      try{
        const txt=String(fr.result||'');
        const obj=JSON.parse(txt);
        if(!obj||typeof obj!=='object'||Array.isArray(obj)) throw new Error('bad');
        localStorage.setItem(SAVE_KEY,txt);
        suppressSave=true;
        location.reload();
      }catch(e){ flash(t('ioImportFail')); }
    };
    fr.onerror=function(){ flash(t('ioImportFail')); };
    fr.readAsText(f);
  });
  rs.addEventListener('click',function(){
    if(!window.confirm(t('ioResetConfirm'))) return;
    suppressSave=true;
    try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(SAVE_BROKEN_KEY); }catch(e){}
    location.reload();
  });
}

function bindKeys(){
  const bBtn=document.querySelector('.key[data-k="B"]');
  bBtn.addEventListener('pointerdown',function(e){
    e.preventDefault();
    try{ if(bBtn.setPointerCapture) bBtn.setPointerCapture(e.pointerId); }catch(err){}
    if(currentMode()==='eggs') startHold();
    else onB();
  });
  bBtn.addEventListener('pointerup',function(){ endHold(false); });
  bBtn.addEventListener('pointercancel',function(){ endHold(false); });
  window.addEventListener('pointerup',function(){ endHold(false); });
  window.addEventListener('blur',function(){ endHold(false); });
  document.querySelectorAll('.key').forEach(function(btn){
    btn.addEventListener('pointerdown',function(){
      sfx('click');
      btn.classList.add('press');
      setTimeout(function(){btn.classList.remove('press');},90);
    });
  });
  document.querySelector('.key[data-k="A"]').addEventListener('click',function(){ onA(); });
  document.querySelector('.key[data-k="C"]').addEventListener('click',function(){ onC(); });

  /* 直接点屏幕：点宠物摸头，点图标执行 */
  cv.addEventListener('pointerdown',function(e){
    if(currentMode()!=='pet') return;
    sfx('click');
    const r=cv.getBoundingClientRect();
    if(!r.width||!r.height) return;
    const lx=(e.clientX-r.left)/r.width*W;
    const ly=(e.clientY-r.top)/r.height*H;
    if(ui.page){ ui.page=null; render(); return; }
    if(ui.play){ pressPlay(); return; }
    /* 访客在场：只有左下角的喂食槽能点（喂番茄），其余不响应 */
    if(vis){
      if(ly>=106&&lx<40) visitTomato();
      return;
    }
    /* 点顶部：状态页（含相册与归档入口） */
    if(ly<=24){
      ui.page='status'; ui.albumIdx=0; render(); return;
    }
    if(ly>=106){
      const idx=Math.min(3,Math.max(0,Math.floor(lx/40)));
      ui.sel=idx;
      activateIcon(iconsNow()[idx].id);
      return;
    }
    if(lx>=42&&lx<=118&&ly>=26&&ly<=100) petHead();
  });
}
let bHeld=false;
document.addEventListener('keydown',function(e){
  const k=String(e.key||'').toLowerCase();
  if(k==='a'||k==='arrowleft'||k==='arrowright'||k==='b'||k==='arrowup'||k==='c'||k==='arrowdown') sfx('click');
  if(k==='a'||k==='arrowleft'||k==='arrowright'){
    const btn=document.querySelector('.key[data-k="A"]');
    if(btn){ btn.classList.add('press'); setTimeout(function(){btn.classList.remove('press');},90); }
    onA();
    e.preventDefault(); return;
  }
  if(k==='b'||k==='arrowup'){
    if(e.repeat) return;
    const btn=document.querySelector('.key[data-k="B"]');
    if(btn){ btn.classList.add('press'); setTimeout(function(){btn.classList.remove('press');},90); }
    if(currentMode()==='eggs'){ bHeld=true; startHold(); } else onB();
    e.preventDefault(); return;
  }
  if(k==='c'||k==='arrowdown'){
    const btn=document.querySelector('.key[data-k="C"]');
    if(btn){ btn.classList.add('press'); setTimeout(function(){btn.classList.remove('press');},90); }
    onC();
    e.preventDefault(); return;
  }
  /* 键盘快捷：S 看状态；独立打开时 M 静音 */
  if(k==='s'){
    if(currentMode()==='pet'&&!ui.endCard){
      ui.page='status'; ui.albumIdx=0; render();
    }
    e.preventDefault(); return;
  }
  if(k==='m'&&!inFrame){
    MUTED=!MUTED;
    setText(t(MUTED?'muteOn':'muteOff'));
    setTimeout(function(){ render(); },1200);
    e.preventDefault(); return;
  }
  if(k>='1'&&k<='6'){ applyTheme(THEMES[Number(k)-1].id); return; }
  if(k==='t'){
    const i=THEMES.findIndex(function(t){return t.id===theme.id;});
    applyTheme(THEMES[(i+1)%THEMES.length].id);
  }
});
document.addEventListener('keyup',function(e){
  const k=String(e.key||'').toLowerCase();
  if(k==='b'||k==='arrowup'){
    if(bHeld){ bHeld=false; endHold(false); }
  }
});

/* ---------- 适配 ---------- */
let fitTimer=null;
function fit(){
  const s=Math.min(1,(window.innerWidth-16)/360,(window.innerHeight-20)/Math.max(1,device.offsetHeight));
  device.style.transform='scale('+Math.round(s*1000)/1000+')';
}
window.addEventListener('resize',function(){
  clearTimeout(fitTimer);
  fitTimer=setTimeout(fit,80);
});
document.addEventListener('visibilitychange',function(){
  applyLowPower();
  if(document.hidden){
    if(holdTimer){ clearInterval(holdTimer); holdTimer=null; holdP=0; }
    saveState();
    return;
  }
  lastTick=Date.now();
  if(state.pet){
    const now=Date.now();
    const raw=Math.max(0,now-num(state.pet.lastSeen,now));
    const gap=clamp(raw,0,OFFLINE_CAP);
    if(gap>MIN){
      simulate(gap,true);
      if(state.pet&&state.pet.sick&&state.pet.critical){
        state.pet.rescueUntil=now+60000;
        state.pet.rescuePresses=0;
        state.pet.rescueWindow=true;
      }
    }
    if(state.pet){
      state.pet.lastSeen=now;
      /* 切回标签页超过 1 小时：同样给分层离线台词 */
      if(raw>=60*MIN){
        ui.msg=offlineMessage(raw);
        ui.msgUntil=now+4200;
      }
    }
    render();
  }
});
window.addEventListener('beforeunload',function(){ saveState(); });
/* 首次手势解锁音频；卸载时释放 AudioContext */
window.addEventListener('pointerdown',function(){ audioReady(); },{once:true,capture:true});
window.addEventListener('pagehide',function(){
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} }
  audioCtx=null; audioMaster=null; audioLive=0;
});

/* ---------- 启动 ---------- */
applyLangDom();
applyLowPower();
buildSwatches();
bindKeys();
bindTools();
const toolsEl=$('tools');
if(toolsEl) toolsEl.hidden=!!inFrame;
settleOffline();
initTutorial();
applyTheme(state.shell);
fit();
restartIdle();
startClock();
if(inFrame) handshake();
else useSamples();
</script>
