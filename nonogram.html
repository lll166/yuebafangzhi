<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月巴数织 · Nonogram</title>
<script>
/* 每次直接打开数织时，先播放「群鸦筑笼」开场；由开场页带 intro=0 进入则跳过。
   百巴箱内嵌窗口由 gbFrameOpen 负责开场；selftest 等调试入口不受影响。 */
(function(){
  try{
    if(window.top!==window.self) return;
    if(/[?&](intro=0|selftest=1)(?:&|$)/.test(location.search)) return;
    var lang='';
    try{ lang=new URLSearchParams(location.search).get('lang')||''; }catch(e){}
    location.replace('crow-cage.html?next=nonogram.html'+(lang?'&lang='+encodeURIComponent(lang):''));
  }catch(e){}
})();
</script>
<style>
:root{
  --bg:#eff1f8; --bg2:#e2e5f1; --paper:#34384c; --ink:#34384c; --mut:#868aa2;
  --acc:#636c9e; --pink:#a08fc2; --ice:#7f9ec9; --gold:#b08a48;
  --line:rgba(52,58,82,.18); --line2:rgba(52,58,82,.46);
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.86);
  --tint:rgba(99,108,158,.055); --glow:0 0 16px rgba(99,108,158,.16);
  --mono:"SF Mono","Cascadia Mono",Consolas,ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
  --r1:#7d8aa5; --r2:#6e9d8a; --r3:#7f9ec9; --r4:#8c82c0; --r5:#b08a48; --r6:#a08fc2;
  --safe:env(safe-area-inset-bottom,0px);
  --ease-out:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1100px 700px at 18% -10%, #fbfbfe 0%, transparent 60%),
    radial-gradient(900px 600px at 92% 108%, #eceef6 0%, transparent 55%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  color:var(--paper);
  font-family:var(--mono);
  letter-spacing:.02em;
  overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.55;
  background:repeating-linear-gradient(0deg,rgba(52,58,82,.03) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(52,58,82,.024) 0 1px,transparent 1px 4px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto}
/* ---------- 顶栏 ---------- */
header#top{
  flex:none;display:flex;align-items:center;gap:8px;padding:calc(11px + env(safe-area-inset-top,0px)) 14px 10px;
  border-bottom:1px solid var(--line2);z-index:5;
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(234,238,248,.74));
  backdrop-filter:blur(10px);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.5);
}
.brand{font-family:var(--mono);font-size:15px;font-weight:900;letter-spacing:.2em;line-height:1.05}
.brand small{display:block;font-family:inherit;font-size:8px;font-weight:700;letter-spacing:.32em;color:var(--mut);margin-top:4px}
.brand small::before{content:"// ";color:var(--acc)}
.topstat{margin-left:auto;font-size:10px;letter-spacing:.06em;color:var(--mut);text-align:right;line-height:1.4;white-space:nowrap;font-variant-numeric:tabular-nums}
.topstat b{color:var(--paper);font-weight:800}
.iconbtn{
  width:34px;height:34px;flex:none;border-radius:0;display:grid;place-items:center;
  font-size:13px;line-height:1;color:var(--ink);
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.48);
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(228,232,244,.86));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  box-shadow:inset 0 0 12px rgba(99,108,158,.05);
  transition:background .15s,transform .12s;
}
.iconbtn:active{transform:scale(.94)}
.iconbtn.on{background:linear-gradient(180deg,rgba(99,108,158,.22),rgba(99,108,158,.1));border-color:rgba(99,108,158,.6);border-left-color:var(--acc)}
/* ---------- 滚动区 ---------- */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 14px calc(22px + var(--safe))}
/* ---------- 目录 ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stat{
  position:relative;padding:8px 10px;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.55);
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  box-shadow:inset 0 0 16px rgba(99,108,158,.04);
}
.stat i{display:block;font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.16em;color:var(--mut)}
.stat b{display:block;font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat b em{font-style:normal;font-size:10px;color:var(--mut);font-weight:400}
.notice{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px 9px 13px;margin-bottom:12px;
  border:1px solid var(--line);border-left:2px solid rgba(160,143,194,.72);border-radius:0;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(160,143,194,.09));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  font-size:10.5px;line-height:1.6;color:#61667c;
}
.notice .ni{flex:none;font-size:13px;line-height:1.2;color:var(--pink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.4);
  background:rgba(255,255,255,.5);font-size:10.5px;letter-spacing:.06em;color:var(--mut);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
  transition:.16s;
}
.chip::before{content:"";width:4px;height:4px;flex:none;background:currentColor;opacity:.4}
.chip.on{
  background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  border-color:rgba(99,108,158,.85);border-left-color:#4d5588;font-weight:800;
  box-shadow:0 0 12px rgba(99,108,158,.3);
}
.chip.on::before{opacity:1;box-shadow:0 0 6px #fff}
.rgroup{margin-top:12px}
.rhead{display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--mut);margin:0 2px 8px}
.rhead::after{content:"";flex:1;height:1px;background:var(--line)}
.rhead b{color:var(--paper);font-weight:900;letter-spacing:.08em}
.rdot{width:6px;height:6px;background:var(--c);box-shadow:0 0 8px var(--c)}
.rgroup.again{margin-top:16px}
.rhead.again{color:#a34b40}
.rhead.again b{color:#8f352e}
.rhead.again .rdot{background:#c1553f;box-shadow:0 0 8px #c1553f}
.gdesc{font-size:9.5px;line-height:1.6;color:var(--mut);margin:-1px 2px 9px;letter-spacing:.04em}
.rgroup.again .card{border-color:rgba(193,85,63,.34)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{
  flex:1;padding:9px 0;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.4);
  background:rgba(255,255,255,.5);
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mut);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
  transition:.16s;
}
.tab.on{
  background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  border-color:rgba(99,108,158,.85);border-left-color:#4d5588;
  box-shadow:0 0 12px rgba(99,108,158,.3);
}
#paneCodex.off,#paneRandom.off,#panePure.off{display:none}
#panePureNormal.off,#panePureMega.off{display:none}
.hero{
  position:relative;padding:14px 14px 12px;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.55);
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.4));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
  box-shadow:inset 0 0 20px rgba(99,108,158,.04);
}
.heroart{
  position:relative;width:min(58vw,230px);aspect-ratio:1/1;margin:0 auto 12px;
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.9),rgba(52,58,82,.05) 72%);
  border:1px solid var(--line);
}
.heroart img,.heroart canvas{width:100%;height:100%;object-fit:contain;padding:9%;image-rendering:pixelated;filter:drop-shadow(0 6px 10px rgba(52,58,82,.22))}
.heroart::after{
  content:"";position:absolute;inset:5px;pointer-events:none;opacity:.55;
  background:
    linear-gradient(var(--acc),var(--acc)) left top/12px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left top/2px 12px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/12px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/2px 12px no-repeat;
}
.hero .wq{font-size:44px}
.herotag{
  display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:6px;
  font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.3em;color:var(--mut);
}
.herotag::before,.herotag::after{content:"";height:1px;flex:1;background:var(--line)}
.herometa{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mut);margin-bottom:11px;font-variant-numeric:tabular-nums}
.herobtn{
  display:block;width:100%;padding:13px 0;border:0;border-radius:0;
  background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  font-family:var(--mono);font-size:12px;font-weight:900;letter-spacing:.2em;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
  box-shadow:0 0 18px rgba(99,108,158,.32);transition:transform .12s,filter .12s;
}
.herobtn:active{transform:translateY(1px);filter:brightness(.95)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(min-width:820px){.cards{grid-template-columns:repeat(5,1fr)}}
.card{
  position:relative;text-align:left;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.42);
  background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.4));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  overflow:hidden;transition:transform .14s,border-color .14s,background .14s;min-width:0;
  box-shadow:inset 0 0 18px rgba(99,108,158,.035);
}
.card:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(255,255,255,.74)}
.card:active{transform:scale(.985)}
.card .cart{aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;background:rgba(52,58,82,.05)}
.card .cart img{width:100%;height:100%;object-fit:contain;padding:8%;filter:drop-shadow(0 4px 8px rgba(52,58,82,.22))}
/* 未解救：统一灰色剪影（取微笑月巴外形）+ 牢门栏杆 + 锁/问号 */

.bars{position:absolute;inset:0;pointer-events:none;--gap:15px;
  background:
    repeating-linear-gradient(90deg,rgba(43,48,66,.46) 0 3px,transparent 3px var(--gap)),
    linear-gradient(rgba(43,48,66,.42),rgba(43,48,66,.42)) center/100% 2px no-repeat,
    linear-gradient(180deg,rgba(43,48,66,.10),transparent 24%,transparent 76%,rgba(43,48,66,.14));
  box-shadow:inset 0 0 18px rgba(43,48,66,.20)}
.heroart .sil{inset:14% 24% 10%}
.heroart .bars{--gap:26px}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:4px;background:rgba(43,48,66,.5);box-shadow:0 1px 0 rgba(255,255,255,.35)}
.bars::before{top:0}
.bars::after{bottom:0;box-shadow:0 -1px 0 rgba(255,255,255,.35)}
.wq{position:absolute;z-index:2;font-family:var(--mono);font-size:24px;color:rgba(52,58,82,.38);text-shadow:0 0 8px rgba(255,255,255,.95)}
.card.locked .wq{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;
  font-size:19px;line-height:1;opacity:1;
  background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(43,48,66,.16),0 2px 8px rgba(43,48,66,.22)}
.card.locked{opacity:.72}
.card.locked:active{transform:none}
.card.locked.deny{animation:deny .32s ease-out}
@keyframes deny{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.card.locked .cart{background:rgba(52,58,82,.075)}
.cdot{position:absolute;top:7px;left:7px;width:5px;height:5px;background:var(--pink);box-shadow:0 0 6px var(--pink)}
/* ---------- 棋盘页 ---------- */
#viewPuzzle{flex:1;display:none;flex-direction:column;min-height:0}
#viewPuzzle.on{display:flex}
#viewCatalog.off{display:none}
.pbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px 5px}
.pbar .ptitle{flex:1;text-align:center;font-size:9.5px;letter-spacing:.1em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .ptitle b{color:var(--paper);font-family:var(--mono);font-size:13px;font-weight:900;letter-spacing:.08em}
.backbtn{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut);padding:8px 10px;border-radius:0;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(228,232,244,.82));
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.45);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
}
.pinfo{flex:none;display:flex;justify-content:center;gap:15px;font-size:10px;letter-spacing:.08em;color:var(--mut);padding:0 14px 4px;font-variant-numeric:tabular-nums}
.pinfo b{color:var(--paper);font-weight:800}
.pinfo .warn b{color:var(--acc)}
#boardWrap{position:relative;flex:1;display:grid;place-items:center;min-height:0;padding:8px 10px;overflow:auto;overscroll-behavior:contain}
#board{position:relative;display:grid;grid-template-columns:var(--leftw) calc(var(--cell) * var(--n));
  grid-template-rows:var(--toph) calc(var(--cell) * var(--n));touch-action:none;user-select:none;-webkit-user-select:none}
#corner{grid-column:1;grid-row:1;position:relative}
#cluesTop{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(var(--n),var(--cell));align-items:end}
#cluesLeft{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(var(--n),var(--cell))}
#grid{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));outline:1.5px solid var(--line2);outline-offset:0;position:relative}
#grid::after{
  content:"";position:absolute;inset:-6px;pointer-events:none;z-index:3;opacity:.7;
  background:
    linear-gradient(var(--acc),var(--acc)) left top/13px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left top/2px 13px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right top/13px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right top/2px 13px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left bottom/13px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left bottom/2px 13px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/13px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/2px 13px no-repeat;
}
.ctop{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:0;height:100%;padding-bottom:calc(2px + var(--supLaneC,0px));overflow:hidden;position:relative}
.cleft{display:flex;align-items:center;justify-content:flex-end;gap:2px;height:100%;padding-right:calc(4px + var(--supLane,0px));overflow:hidden;position:relative}
.num{font-size:var(--cluefs);line-height:1.06;color:rgba(38,42,58,.72);font-variant-numeric:tabular-nums;font-weight:600}
.done .num{color:rgba(38,42,58,.24);text-decoration:line-through;text-decoration-thickness:1px}
.bad .num{color:var(--acc);text-shadow:0 0 7px rgba(99,108,158,.35)}
.cleft.fx-done .num,.ctop.fx-done .num{animation:clueNum .2s var(--ease-out) both;animation-delay:calc(var(--i,0) * 22ms)}
@keyframes clueNum{0%{transform:translateY(0) scale(1);opacity:1}45%{transform:translateY(-2px) scale(1.08);opacity:.9}100%{transform:translateY(0) scale(.92);opacity:.55}}
.cleft.fx-done::after,.ctop.fx-done::after{content:"✓";position:absolute;font-size:9px;line-height:1;color:rgba(99,108,158,.75);opacity:0;animation:clueCheck .26s ease-out .1s both}
.cleft.fx-done::after{left:2px;top:calc(50% - 5px)}
.ctop.fx-done::after{left:calc(50% - 4px);top:1px}
@keyframes clueCheck{0%{opacity:0}60%{opacity:.9}100%{opacity:.55}}
.cleft.fx-bad,.ctop.fx-bad{animation:clueBad .18s ease-out}
@keyframes clueBad{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}50%{transform:translateX(2px)}75%{transform:translateX(-1px)}}
.cleft.fx-bad::after,.ctop.fx-bad::after{content:"";position:absolute;height:1px;background:rgba(99,108,158,.7);opacity:0;animation:badLine .28s ease-out both}
.cleft.fx-bad::after{left:3px;bottom:2px;width:14px}
.ctop.fx-bad::after{left:50%;bottom:1px;width:10px;margin-left:-5px}
@keyframes badLine{0%{opacity:0;transform:scaleX(0)}30%{opacity:.85}100%{opacity:0;transform:scaleX(1)}}
.cell{
  --sh:inset -1px 0 0 var(--line),inset 0 -1px 0 var(--line);
  background:rgba(255,255,255,.52);box-shadow:var(--sh);position:relative;
  display:grid;place-items:center;border-radius:0;transition:background-color .1s;
}
.cell.br{--sh:inset -2px 0 0 var(--line2),inset 0 -1px 0 var(--line)}
.cell.bb{--sh:inset -1px 0 0 var(--line),inset 0 -2px 0 var(--line2)}
.cell.br.bb{--sh:inset -2px 0 0 var(--line2),inset 0 -2px 0 var(--line2)}
.cell.fill{background:linear-gradient(160deg,#949cc0,#737ca6);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.13)}
.cell.tent{
  background:
    repeating-linear-gradient(45deg,rgba(160,143,194,.32) 0 3px,rgba(160,143,194,.10) 3px 6px),
    rgba(255,255,255,.52);
  box-shadow:var(--sh),inset 0 0 0 1px rgba(160,143,194,.4);
}
.cell.tent::after{content:"";position:absolute;inset:2px;border:1px dashed rgba(99,108,158,.38);pointer-events:none}
.cell.cross::before{content:"✕";font-size:calc(var(--cell) * .48);color:rgba(38,42,58,.38);line-height:1}
.cell.fill.cross::before{content:none}
.cell.hm::after{content:"✦";position:absolute;right:1px;top:-1px;font-size:calc(var(--cell) * .4);color:rgba(255,255,255,.85);text-shadow:0 0 3px rgba(0,0,0,.6)}
/* 点提示后标出的填错格：红色描边呼吸 */
.cell.wbad::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 0 2px rgba(214,73,63,.95);animation:wbadPulse 1.15s ease-in-out infinite}
@keyframes wbadPulse{0%,100%{opacity:.95}50%{opacity:.38}}
body.low-power .cell.wbad::after{animation:none}
.cell.cur{outline:2px solid var(--ice);outline-offset:-2px;z-index:2}
.cell.fx-fill{animation:cellFill .11s var(--ease-out) both;animation-delay:var(--fd,0ms)}
@keyframes cellFill{0%{transform:scale(.7);opacity:.55}65%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
.cell.fx-cross{animation:cellCross .12s var(--ease-out) both;animation-delay:var(--fd,0ms)}
@keyframes cellCross{0%{transform:scale(.5) rotate(-9deg);opacity:.35}65%{transform:scale(1.06) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.cell.fx-tent{animation:cellTent .13s var(--ease-out) both;animation-delay:var(--fd,0ms)}
@keyframes cellTent{0%{transform:scale(.8);opacity:.3}70%{transform:scale(1.03);opacity:1}100%{transform:scale(1);opacity:1}}
.cell.fx-erase{animation:cellErase .1s ease-out both;animation-delay:var(--fd,0ms)}
@keyframes cellErase{0%{transform:translateY(0) scale(1);opacity:1}45%{transform:translateY(1px) scale(.86);opacity:.35}100%{transform:translateY(0) scale(1);opacity:1}}
.cell.win{animation:cellwin .55s ease-out both;animation-delay:var(--d,0ms)}
@keyframes cellwin{0%{transform:scale(1);filter:brightness(1)}45%{transform:scale(1.35);filter:brightness(1.7)}100%{transform:scale(1);filter:brightness(1.15)}}
.toolbar{
  position:relative;flex:none;display:flex;gap:6px;padding:9px 11px calc(10px + var(--safe));border-top:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(234,238,248,.92));backdrop-filter:blur(10px);
}
#brushBar{position:absolute;bottom:calc(6px + var(--safe));height:3px;border-radius:2px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,var(--acc),#8fb3e8);box-shadow:0 0 6px rgba(99,108,158,.35);
  transition:left .18s var(--ease-out),width .18s var(--ease-out),opacity .12s;z-index:2}
.tool{
  flex:1;height:46px;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:9px;letter-spacing:.06em;color:var(--mut);transition:.14s;min-width:0;position:relative;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.4);
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(234,238,248,.82));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
}
.tool b{font-size:15px;font-weight:800;color:var(--paper);line-height:1}
.tool.fillmode.on{background:linear-gradient(180deg,rgba(99,108,158,.16),rgba(99,108,158,.06));border-color:rgba(99,108,158,.6);border-left-color:var(--acc);box-shadow:inset 0 0 16px rgba(99,108,158,.12)}
.tool.crossmode.on{background:linear-gradient(180deg,rgba(127,158,201,.2),rgba(127,158,201,.08));border-color:rgba(127,158,201,.62);border-left-color:var(--ice);box-shadow:inset 0 0 16px rgba(127,158,201,.14)}
.tool.tentmode.on{background:linear-gradient(180deg,rgba(160,143,194,.2),rgba(160,143,194,.08));border-color:rgba(160,143,194,.62);border-left-color:var(--pink);box-shadow:inset 0 0 16px rgba(160,143,194,.14)}
.tool.fillmode.on b{color:var(--acc)}
.tool.crossmode.on b{color:var(--ice)}
.tool.tentmode.on b{color:var(--pink)}
.tool.easymode.on{background:linear-gradient(180deg,rgba(127,158,201,.2),rgba(127,158,201,.08));border-color:rgba(127,158,201,.62);border-left-color:var(--ice);box-shadow:inset 0 0 16px rgba(127,158,201,.14)}
.tool.easymode.on b{color:var(--ice)}
.tool:active{transform:scale(.95)}
.tool .cnt{position:absolute;transform:translate(14px,-11px);font-size:8px;color:var(--acc);font-weight:800}
/* ---------- 遮罩 / 面板 ---------- */
.overlay{
  position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(52,58,82,.34);backdrop-filter:blur(5px);
}
.overlay::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px)}
.overlay.show{display:flex}
.sheet{
  position:relative;width:100%;max-width:430px;max-height:86vh;overflow-y:auto;border-radius:0;
  border:1px solid var(--line2);background:linear-gradient(180deg,#fbfbfe,#eceff7);padding:18px 18px 16px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  box-shadow:0 24px 70px rgba(52,58,82,.28),inset 0 0 40px rgba(99,108,158,.035);
}
.sheet::before{content:"";position:absolute;inset:8px;pointer-events:none;opacity:.55;
  background:
    linear-gradient(var(--acc),var(--acc)) left top/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left top/2px 14px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/2px 14px no-repeat}
.sheet h3{
  margin:0 0 6px;display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:15px;font-weight:900;letter-spacing:.16em;
}
.sheet h3::before{content:"";flex:none;width:3px;height:15px;background:var(--acc);box-shadow:0 0 8px rgba(99,108,158,.5)}
.sheet .sub{font-size:10px;letter-spacing:.05em;line-height:1.6;color:var(--mut);margin-bottom:13px}
.sheet .x{position:absolute;top:10px;right:10px}
.row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:7px;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.42);
  background:rgba(255,255,255,.42);
}
.row:last-child{margin-bottom:0}
.row .rt{flex:1;font-size:11.5px;font-weight:700;letter-spacing:.03em}
.row .rt small{display:block;color:var(--mut);font-size:9.5px;margin-top:2px;font-weight:400}
.hrow{display:flex;gap:9px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:11px;line-height:1.6;color:#565b70}
.hrow:last-child{border-bottom:0}
.hrow b{
  flex:none;width:18px;height:18px;margin-top:1px;border-radius:0;display:grid;place-items:center;
  background:rgba(99,108,158,.12);border:1px solid rgba(99,108,158,.35);color:var(--acc);
  font-family:var(--mono);font-size:9px;font-weight:800;
}
.sw{
  width:44px;height:24px;border-radius:0;background:rgba(52,58,82,.12);border:1px solid var(--line);
  position:relative;flex:none;transition:.18s;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);
}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fbfbfe;box-shadow:0 1px 3px rgba(52,58,82,.25);transition:.18s}
.sw.on{background:linear-gradient(180deg,#7f88b8,var(--acc));border-color:rgba(99,108,158,.7)}
.sw.on::after{left:22px}
/* ---------- 结算 ---------- */
#result .sheet.cream{
  background:linear-gradient(170deg,#fbfbfe,#eaeef6);color:var(--ink);border-color:var(--line2);max-width:440px;
  position:relative;overflow:hidden;
}
#result .sheet.cream::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.6;
  background:repeating-linear-gradient(0deg,rgba(92,98,124,.045) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(92,98,124,.035) 0 1px,transparent 1px 4px)}
#result .sheet.cream::after{content:"";position:absolute;inset:8px;pointer-events:none;opacity:.6;
  background:
    linear-gradient(var(--acc),var(--acc)) left top/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left top/2px 14px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/2px 14px no-repeat}
.rhead2{display:flex;align-items:center;gap:8px;font-size:8.5px;font-weight:800;letter-spacing:.3em;color:#9498ae;margin-bottom:10px}
.rhead2::before,.rhead2::after{content:"";height:1px;flex:1;background:rgba(92,98,124,.22)}
.artframe{
  position:relative;width:min(64vw,236px);aspect-ratio:1/1;margin:0 auto 12px;border-radius:0;background:
  radial-gradient(circle at 50% 42%,#fbfbfe,#e1e5f1 70%,#d3d8e8);
  border:1px solid rgba(92,98,124,.3);box-shadow:inset 0 0 0 5px rgba(255,255,255,.5),0 14px 34px rgba(58,62,88,.18);
  display:grid;place-items:center;overflow:hidden;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
}
.artframe::after{content:"";position:absolute;inset:8px;border:1px dashed rgba(92,98,124,.28);pointer-events:none}
.artframe img{width:100%;height:100%;object-fit:contain;padding:7%;opacity:0;animation:revin .72s cubic-bezier(.2,.8,.2,1) .12s forwards;filter:drop-shadow(0 8px 12px rgba(48,52,76,.22))}
.artframe canvas{width:100%;height:100%;image-rendering:pixelated;padding:7%}
@keyframes revin{from{opacity:0;transform:scale(.88) rotate(-1.5deg);filter:blur(8px) drop-shadow(0 8px 12px rgba(48,52,76,.2))}to{opacity:1;transform:scale(1) rotate(0);filter:blur(0) drop-shadow(0 8px 12px rgba(48,52,76,.22))}}
.stamp{position:absolute;right:10px;bottom:10px;width:62px;height:62px;border-radius:50%;border:2px solid rgba(99,108,158,.75);color:rgba(99,108,158,.85);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:800;line-height:1.15;letter-spacing:.04em;text-align:center;opacity:0;animation:stamp .4s ease-out .7s forwards;background:rgba(255,255,255,.18)}
@keyframes stamp{0%{opacity:0;transform:scale(1.7) rotate(-20deg)}65%{opacity:1;transform:scale(.92) rotate(-9deg)}100%{opacity:.92;transform:scale(1) rotate(-9deg)}}
.rname{text-align:center;font-family:var(--mono);font-size:19px;font-weight:900;letter-spacing:.08em;margin:2px 0 3px}
.raliasline{text-align:center;font-size:10px;letter-spacing:.05em;color:#868aa2;margin-bottom:3px}
.rmeta{text-align:center;font-size:9.5px;letter-spacing:.06em;color:#868aa2;margin-bottom:10px}
.rstars{text-align:center;font-size:20px;letter-spacing:5px;color:#d3ab63;margin-bottom:10px;line-height:1}
.rstars .d{color:rgba(92,98,124,.16)}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.rgrid div{background:rgba(92,98,124,.055);border:1px solid rgba(92,98,124,.16);border-top:2px solid rgba(99,108,158,.4);padding:7px 4px;text-align:center}
.rgrid i{display:block;font-style:normal;font-size:8px;font-weight:700;letter-spacing:.14em;color:#9498ae}
.rgrid b{display:block;font-size:13px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.rcoin{text-align:center;font-size:10.5px;letter-spacing:.05em;color:#98733a;background:rgba(208,174,110,.16);border:1px dashed rgba(208,174,110,.5);padding:7px;margin-bottom:12px}
.rbtns{display:flex;gap:7px}
.rbtns button{
  flex:1;padding:12px 6px;border-radius:0;font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.12em;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
  transition:transform .12s,filter .12s;
}
.rbtns button:active{transform:translateY(1px);filter:brightness(.95)}
.rbtns .pri{background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;box-shadow:0 0 18px rgba(99,108,158,.32)}
.rbtns .sec{background:rgba(92,98,124,.09);color:#565b70;border:1px solid rgba(92,98,124,.24);border-left:2px solid rgba(99,108,158,.4)}
.rbtns .thi{background:transparent;color:#868aa2;border:1px solid rgba(92,98,124,.2)}
/* ---------- 暂停 / toast / 成就横幅 ---------- */
#pause .sheet{max-width:320px;text-align:center}
#pause .sheet h3{justify-content:center;font-size:16px;letter-spacing:.22em;margin-bottom:10px}
#pause .sheet h3::before{display:none}
#pause .sheet .sub{font-size:10.5px;letter-spacing:.05em;color:var(--mut);line-height:1.7}
#pause .pb{width:100%;margin-bottom:8px;padding:12px 0;border-radius:0;
  font-family:var(--mono);font-size:11px;font-weight:900;letter-spacing:.16em;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
  transition:transform .12s,filter .12s}
#pause .pb:active{transform:translateY(1px);filter:brightness(.95)}
#pause .pb.pri{background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  box-shadow:0 0 18px rgba(99,108,158,.32);border:0}
#pause .pb.sec{background:rgba(92,98,124,.09);color:#565b70;
  border:1px solid rgba(92,98,124,.24);border-left:2px solid rgba(99,108,158,.4)}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe));transform:translate(-50%,14px);z-index:40;
  background:linear-gradient(180deg,#2b2f41,#1e2230);color:#fafbfe;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;line-height:1.5;
  padding:9px 15px;border-radius:0;border:1px solid rgba(255,255,255,.14);
  border-left:2px solid var(--acc);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
  box-shadow:0 10px 30px rgba(52,58,82,.34),0 0 18px rgba(99,108,158,.16);
  opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#achbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);z-index:45;
  background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  border:1px solid rgba(99,108,158,.9);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  padding:8px 16px;display:flex;gap:10px;align-items:center;
  box-shadow:0 12px 34px rgba(52,58,82,.4),0 0 22px rgba(99,108,158,.34);
  transition:transform .32s cubic-bezier(.2,.9,.3,1);max-width:88vw}
#achbar.show{transform:translate(-50%,0)}
#achbar .ab{font-size:15px;line-height:1;filter:drop-shadow(0 0 6px rgba(255,255,255,.5))}
#achbar b{display:block;font-family:var(--mono);font-size:11.5px;font-weight:900;letter-spacing:.14em}
#achbar small{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.3em;color:rgba(247,249,255,.72);margin-top:3px}
.achrow{display:flex;gap:10px;align-items:center;padding:9px 8px;margin-bottom:5px;
  border:1px solid var(--line);border-left:2px solid rgba(52,58,82,.2);
  background:rgba(255,255,255,.4);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
.achrow:last-child{margin-bottom:0}
.achrow .ai{width:30px;height:30px;border-radius:0;display:grid;place-items:center;font-size:14px;flex:none;
  background:rgba(255,255,255,.7);border:1px solid var(--line);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
.achrow.got{border-left-color:rgba(176,138,72,.85);background:rgba(208,174,110,.09)}
.achrow.got .ai{background:rgba(208,174,110,.2);border-color:rgba(208,174,110,.6);color:var(--gold);
  box-shadow:0 0 12px rgba(208,174,110,.22)}
.achrow .at{flex:1;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.achrow .at small{display:block;font-size:9px;font-weight:400;letter-spacing:.04em;color:var(--mut);margin-top:2px}
.achrow .ap{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.achrow.got .ap{color:var(--gold);font-weight:800}
/* ---------- P0 动效 ---------- */
.cell.fx-autocross{animation:acIn .18s var(--ease-out) both;animation-delay:var(--ad,0ms)}
@keyframes acIn{0%{opacity:.2;transform:scale(.55)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.cell.fx-undo{animation:undoIn .13s var(--ease-out) both}
@keyframes undoIn{0%{opacity:.45;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.cell.fx-hint{animation:hintRing .38s ease-out both;animation-delay:var(--hd,0ms)}
@keyframes hintRing{
  0%{box-shadow:var(--sh),inset 0 0 0 1px rgba(176,138,72,.9),0 0 0 0 rgba(176,138,72,.32)}
  65%{box-shadow:var(--sh),inset 0 0 0 1px rgba(176,138,72,.5),0 0 0 6px rgba(176,138,72,0)}
  100%{box-shadow:var(--sh),inset 0 0 0 1px rgba(176,138,72,0),0 0 0 8px rgba(176,138,72,0)}
}
.cell.fx-fill.fx-hint{animation:cellFill .11s var(--ease-out) 0ms both,hintRing .38s ease-out var(--hd,0ms) both}
.pinfo b,.stat b{display:inline-block}
.fx-bump{animation:bumpNum .16s var(--ease-out)}
@keyframes bumpNum{0%{transform:translateY(0);color:inherit}35%{transform:translateY(-3px);color:var(--acc)}100%{transform:translateY(0);color:inherit}}
.linefx{position:absolute;z-index:4;pointer-events:none;opacity:0}
.linefx.h{height:1px;background:linear-gradient(90deg,transparent,rgba(99,108,158,.85),transparent);transform-origin:left center}
.linefx.v{width:1px;background:linear-gradient(180deg,transparent,rgba(99,108,158,.85),transparent);transform-origin:center top}
.linefx.fx-sweep-h{animation:sweepH .24s ease-out both}
@keyframes sweepH{0%{transform:scaleX(0);opacity:0}15%{opacity:.8}75%{opacity:.55}100%{transform:scaleX(1);opacity:0}}
.linefx.fx-sweep-v{animation:sweepV .24s ease-out both}
@keyframes sweepV{0%{transform:scaleY(0);opacity:0}15%{opacity:.8}75%{opacity:.55}100%{transform:scaleY(1);opacity:0}}
.scanfx{position:absolute;height:34px;pointer-events:none;z-index:6;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(99,108,158,.18) 42%,rgba(255,255,255,.52) 50%,rgba(99,108,158,.18) 58%,transparent)}
.scanfx.fx-scan{animation:scanDown .24s ease-out both}
@keyframes scanDown{0%{transform:translateY(-34px);opacity:0}20%{opacity:1}100%{transform:translateY(var(--scanh,600px));opacity:0}}
/* ---------- P1 动效 ---------- */
#grid.scan-in .cell{animation:gridIn .16s var(--ease-out) both;animation-delay:calc(var(--r,0) * 4ms)}
@keyframes gridIn{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:scale(1)}}
.cell.fx-final{animation:finalCell .42s var(--ease-out) both}
@keyframes finalCell{
  0%{transform:scale(1);box-shadow:var(--sh),0 0 0 0 rgba(176,138,72,0)}
  30%{transform:scale(1.2);box-shadow:var(--sh),0 0 0 5px rgba(176,138,72,.45)}
  65%{transform:scale(1.05);box-shadow:var(--sh),0 0 0 10px rgba(176,138,72,.12)}
  100%{transform:scale(1);box-shadow:var(--sh),0 0 0 12px rgba(176,138,72,0)}
}
.rstars span{display:inline-block}
.rstars span:not(.d){animation:starDrop .34s var(--ease-out) both;animation-delay:calc(var(--i,0) * 90ms)}
@keyframes starDrop{0%{opacity:0;transform:translateY(-10px) scale(.6) rotate(-12deg)}70%{opacity:1;transform:translateY(1px) scale(1.12) rotate(3deg)}100%{opacity:1;transform:none}}
.rcoin{position:relative;overflow:hidden}
.rcoin::after{content:"";position:absolute;inset:-40% -20%;pointer-events:none;background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.72) 48%,transparent 62%);transform:translateX(-130%);animation:coinShine 1s ease-out .15s both}
@keyframes coinShine{to{transform:translateX(130%)}}
.card.unlock .bars{animation:barsUp .42s var(--ease-out) both}
@keyframes barsUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-112%);opacity:0}}
.card.unlock .sil{animation:silFade .42s ease-out both}
@keyframes silFade{0%{opacity:.2}100%{opacity:0}}
.card.unlock .wq{animation:wqPop .42s var(--ease-out) both}
@keyframes wqPop{0%{opacity:0;transform:scale(.4)}62%{opacity:1;transform:scale(1.16)}100%{opacity:1;transform:scale(1)}}
.card.unlock .cart>img,.card.unlock .cart>canvas{animation:artPop .42s var(--ease-out) both}
@keyframes artPop{0%{opacity:0;transform:scale(.72)}62%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
#catalog.cat-in{animation:catIn .1s ease-out both}
@keyframes catIn{0%{opacity:.35;transform:translateY(3px)}100%{opacity:1;transform:none}}
/* ---------- 粒子 ---------- */
.fx{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.fx i{position:absolute;width:6px;height:9px;border-radius:1px;opacity:0;animation:fxfall 1.15s ease-out forwards}
@keyframes fxfall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
/* ---------- 解救成功：棋盘变立绘 ---------- */
#reveal{
  position:fixed;inset:0;z-index:28;display:grid;place-items:center;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s;
  background:radial-gradient(circle at 50% 46%,rgba(248,250,255,.94),rgba(234,238,248,.78) 46%,rgba(52,58,82,.46) 100%);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
#reveal.show{opacity:1;visibility:visible}
.rvstage{
  position:relative;width:min(70vw,300px);aspect-ratio:1/1;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#fbfbfe,#e1e5f1 74%);
  border:1px solid rgba(92,98,124,.3);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.5),0 18px 42px rgba(58,62,88,.22);
}
#reveal.show .rvstage{animation:rvstage .72s cubic-bezier(.22,.8,.22,1) both}
@keyframes rvstage{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
.rvstage::after{content:"";position:absolute;inset:7px;pointer-events:none;z-index:5;opacity:.7;
  background:
    linear-gradient(var(--acc),var(--acc)) left top/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left top/2px 14px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right top/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right top/2px 14px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left bottom/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left bottom/2px 14px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/14px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/2px 14px no-repeat}
.rvboard{
  position:absolute;inset:0;z-index:1;display:grid;overflow:hidden;
  grid-template-columns:repeat(var(--n,10),1fr);grid-template-rows:repeat(var(--n,10),1fr);
  gap:1px;background:rgba(52,58,82,.22);
}
.rvboard i{display:block;animation:rvcell .78s cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--d,0ms)}
@keyframes rvcell{0%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(.55)}}
.rvart{
  position:absolute;inset:0;z-index:2;opacity:0;
  animation:rvpop 1.2s cubic-bezier(.22,.68,.18,1) .28s both;will-change:transform,opacity;
}
.rvpix{position:absolute;inset:0;width:100%;height:100%;padding:6%;image-rendering:pixelated}
.rvimg{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6%;opacity:0;
  transition:opacity .5s ease;filter:drop-shadow(0 16px 26px rgba(52,58,82,.36));
}
.rvimg.ok{opacity:1}
@keyframes rvpop{
  0%{opacity:0;transform:scale(.84) rotate(-1.6deg)}
  30%{opacity:1;transform:scale(1.095) rotate(.9deg)}
  48%{transform:scale(.965) rotate(-.5deg)}
  64%{transform:scale(1.035) rotate(.22deg)}
  78%{transform:scale(.992) rotate(-.1deg)}
  90%{transform:scale(1.008) rotate(.04deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.rvflash{
  position:absolute;inset:-14%;z-index:3;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(255,248,228,.5),rgba(255,238,196,.24) 44%,transparent 68%);
  animation:rvflash 1.15s ease-out .34s both;
}
@keyframes rvflash{0%{opacity:0;transform:scale(.72)}38%{opacity:.55}100%{opacity:0;transform:scale(1.12)}}
.rvring{position:absolute;inset:6px;z-index:3;border:2px solid rgba(99,108,158,.4);opacity:0;
  animation:rvring 1.15s ease-out .42s both}
.rvring.b{animation-delay:.66s;border-color:rgba(176,138,72,.36)}
@keyframes rvring{0%{opacity:0;transform:scale(.62)}35%{opacity:.5}100%{opacity:0;transform:scale(1.38)}}
/* ---------- 无图数织 ---------- */
.tabs.sub{margin-bottom:10px}
.tabs.sub .tab{flex:none;padding:6px 14px;font-size:10px;letter-spacing:.14em}
.tabs.sub .tab.on{background:rgba(99,108,158,.14);color:var(--acc);
  border-color:rgba(99,108,158,.55);border-left-color:var(--acc);box-shadow:none}
/* ---------- 超级数织：超级线索徽章 ---------- */
.msup{position:absolute;display:grid;place-items:center;z-index:4;pointer-events:none;
  background:linear-gradient(160deg,#3c4159,#2b2f42);color:#f2f4fb;font-family:var(--mono);
  font-size:var(--msupfs,9px);font-weight:800;line-height:1;letter-spacing:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.26),0 1px 3px rgba(20,24,40,.34);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%);
  transition:background .18s,opacity .18s}
.msup.done{background:rgba(43,47,66,.26);color:rgba(255,255,255,.5);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);text-decoration:line-through;
  text-decoration-thickness:1px}
/* v3：大数字不参与小数字排序，单独放在贴近棋盘一侧的泳道里，跨两行/两列居中 */
/* ---------- 行/列引导：防止看错行 ---------- */
#cluesLeft>.cleft,#cluesTop>.ctop{transition:background .16s var(--ease-out),box-shadow .16s var(--ease-out)}
#cluesLeft>.cleft:nth-child(2n),#cluesTop>.ctop:nth-child(2n){background:rgba(99,108,158,.028)}
/* 超级带的两行/两列共用一层极浅的底色，提示「这两行是一组」 */
#cluesLeft>.cleft.band{background:linear-gradient(90deg,rgba(160,143,194,.025),rgba(160,143,194,.095))}
#cluesTop>.ctop.band{background:linear-gradient(0deg,rgba(160,143,194,.025),rgba(160,143,194,.095))}
#cluesLeft>.cleft.hl{background:linear-gradient(90deg,rgba(99,108,158,.05),rgba(99,108,158,.21));
  box-shadow:inset -2px 0 0 var(--acc)}
#cluesLeft>.cleft.hl2{background:linear-gradient(90deg,rgba(160,143,194,.03),rgba(160,143,194,.15));
  box-shadow:inset -2px 0 0 rgba(160,143,194,.62)}
#cluesTop>.ctop.hl{background:linear-gradient(0deg,rgba(99,108,158,.05),rgba(99,108,158,.2));
  box-shadow:inset 0 -2px 0 var(--acc)}
#cluesTop>.ctop.hl2{background:linear-gradient(0deg,rgba(160,143,194,.03),rgba(160,143,194,.15));
  box-shadow:inset 0 -2px 0 rgba(160,143,194,.62)}
#cluesLeft>.cleft.hl::before,#cluesLeft>.cleft.hl2::before{content:"";position:absolute;left:0;top:50%;
  width:5px;height:2px;margin-top:-1px;background:var(--acc);opacity:.85}
#cluesLeft>.cleft.hl2::before{background:var(--pink)}
#cluesTop>.ctop.hl::before,#cluesTop>.ctop.hl2::before{content:"";position:absolute;left:50%;top:0;
  width:2px;height:5px;margin-left:-1px;background:var(--acc);opacity:.85}
#cluesTop>.ctop.hl2::before{background:var(--pink)}
.cleft.hl .num,.cleft.hl2 .num,.ctop.hl .num,.ctop.hl2 .num{color:rgba(38,42,58,.94)}
.cleft.hl .msup,.cleft.hl2 .msup,.ctop.hl .msup,.ctop.hl2 .msup{
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.52),0 0 9px rgba(99,108,158,.5),0 0 0 1px var(--acc)}
/* 棋盘上的行/列对齐导轨：跟着手指/光标走，行带用横条，列带用竖条 */
#grid>.gband{position:absolute;left:0;top:0;pointer-events:none;z-index:2;opacity:0;will-change:transform,opacity;
  transition:opacity .15s var(--ease-out),transform .1s linear}
#grid>.gband.gr{right:0;height:var(--cell);
  background:linear-gradient(90deg,rgba(99,108,158,.13),rgba(99,108,158,.055));
  box-shadow:inset 0 2px 0 rgba(99,108,158,.52),inset 0 -2px 0 rgba(99,108,158,.52)}
#grid>.gband.gc{bottom:0;width:var(--cell);
  background:linear-gradient(180deg,rgba(99,108,158,.075),rgba(99,108,158,.03));
  box-shadow:inset 2px 0 0 rgba(99,108,158,.34),inset -2px 0 0 rgba(99,108,158,.34)}
#grid.guiding>.gband{opacity:1}
.hero.pure{padding:12px 14px 11px}
.card .cart .lockhole{position:relative;width:30%;aspect-ratio:1/1;
  border:2px solid rgba(52,58,82,.3);border-radius:50%}
.card .cart .lockhole::after{content:"";position:absolute;left:50%;top:78%;
  width:26%;height:46%;transform:translateX(-50%);background:rgba(52,58,82,.3);
  clip-path:polygon(50% 0,100% 100%,0 100%)}
.card .cart .pnum{position:absolute;bottom:5px;right:6px;font-family:var(--mono);
  font-size:9px;font-weight:800;letter-spacing:.06em;color:rgba(52,58,82,.42)}
.card .cart .psz{position:absolute;top:5px;left:6px;font-family:var(--mono);
  font-size:8.5px;letter-spacing:.06em;color:rgba(52,58,82,.4)}
/* 已完成的「无图」题目：只给一个与界面风格一致的对勾标记，不再展示图案 */
.card .cart .pdone{position:relative;display:grid;place-items:center;width:46%;aspect-ratio:1/1;
  color:var(--acc);border:1px solid rgba(99,108,158,.34);
  background:linear-gradient(180deg,rgba(99,108,158,.18),rgba(99,108,158,.06));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
  box-shadow:inset 0 0 14px rgba(99,108,158,.14)}
.card .cart .pdone svg{width:64%;height:64%;overflow:visible;
  filter:drop-shadow(0 1px 2px rgba(99,108,158,.26))}
.rvcap{position:absolute;left:0;right:0;bottom:9%;z-index:6;text-align:center;
  font-family:var(--mono);font-size:12px;font-weight:900;letter-spacing:.22em;
  color:var(--paper);text-shadow:0 0 10px rgba(255,255,255,.95);
  opacity:0;animation:rvcopin .5s ease-out .72s forwards}
@keyframes rvcopin{to{opacity:1}}
/* ---------- 低功耗 ---------- */
body.low-power #grid .cell.win{animation:none}
body.low-power .cell.fx-fill,body.low-power .cell.fx-cross,body.low-power .cell.fx-tent,body.low-power .cell.fx-erase,
body.low-power .cell.fx-autocross,body.low-power .cell.fx-undo,body.low-power .cell.fx-hint{animation:none!important}
body.low-power .linefx,body.low-power .scanfx{display:none!important}
body.low-power #grid.scan-in .cell,body.low-power .cell.fx-final,
body.low-power .rstars span,body.low-power .rcoin::after,
body.low-power .card.unlock .bars,body.low-power .card.unlock .sil,body.low-power .card.unlock .wq,
body.low-power .card.unlock .cart>img,body.low-power .card.unlock .cart>canvas,
body.low-power #catalog.cat-in{animation:none!important}
body.low-power #brushBar{transition:none}
body.low-power .cleft.fx-done .num,body.low-power .ctop.fx-done .num,
body.low-power .cleft.fx-bad,body.low-power .ctop.fx-bad{animation:none!important}
body.low-power .cleft.fx-done::after,body.low-power .ctop.fx-done::after,
body.low-power .cleft.fx-bad::after,body.low-power .ctop.fx-bad::after{display:none}
body.low-power .artframe img{animation-duration:.01s}
body.low-power .stamp{animation-duration:.01s}
body.low-power .fx{display:none}
body.low-power #top,body.low-power .toolbar{backdrop-filter:none}
body.low-power .overlay{backdrop-filter:none}
body.low-power body::before{display:none}
body.low-power .overlay::before{display:none}
body.low-power #achbar,body.low-power #toast{box-shadow:none}
body.low-power #reveal{-webkit-backdrop-filter:none;backdrop-filter:none}
body.low-power .rvboard,body.low-power .rvflash,body.low-power .rvring{display:none}
body.low-power .rvart{animation-duration:.5s;animation-delay:.05s}
body.low-power .rvcap{animation-duration:.01s}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span id="brandT">月巴数织</span><small>NONOGRAM · RESCUE</small></div>
    <div class="topstat" id="topstat"></div>
    <button class="iconbtn" id="btnHelp" title="玩法说明">?</button>
    <button class="iconbtn" id="btnAch" title="成就">✦</button>
    <button class="iconbtn" id="btnSet" title="设置">⚙</button>
  </header>

  <section class="scroll" id="viewCatalog">
    <div class="statgrid">
      <div class="stat"><i id="stL1">已解救</i><b id="stSolved">0<em>/110</em></b></div>
      <div class="stat"><i id="stL2">收集星数</i><b id="stStars">0<em>★</em></b></div>
      <div class="stat"><i id="stL3">累计用时</i><b id="stTime">0:00</b></div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="random" id="tabRandom">随机</button>
      <button class="tab" data-tab="codex" id="tabCodex">图鉴</button>
      <button class="tab" data-tab="pure" id="tabPure">🔓 无图</button>
    </div>
    <div id="paneRandom">
      <div class="hero" id="hero"></div>
    </div>
    <div id="paneCodex" class="off">
      <div class="notice"><span class="ni">✎</span><span id="noticeT"></span></div>
      <div class="chips" id="chips"></div>
      <div id="catalog"></div>
    </div>
    <div id="panePure" class="off">
      <div class="notice"><span class="ni">🔓</span><span id="pureIntroT"></span></div>
      <div class="tabs sub" id="pureTabs">
        <button class="tab on" data-sub="normal" id="subTabNormal">普通数织</button>
        <button class="tab" data-sub="mega" id="subTabMega">超级数织</button>
      </div>
      <div id="panePureNormal">
        <div class="hero pure" id="pureHero"></div>
        <div class="chips" id="pchips"></div>
        <div id="pcatalog"></div>
      </div>
      <div id="panePureMega" class="off">
        <div class="hero pure" id="megaHero"></div>
        <div class="chips" id="mchips"></div>
        <div id="mcatalog"></div>
      </div>
    </div>
  </section>

  <section id="viewPuzzle">
    <div class="pbar">
      <button class="backbtn" id="btnBack">← 目录</button>
      <div class="ptitle" id="pTitle"></div>
      <button class="iconbtn" id="btnPause" title="暂停">⏸</button>
    </div>
    <div class="pinfo">
      <span id="pTime">00:00</span>
      <span id="pMist">失误 <b>0</b></span>
      <span id="pHint">提示 <b>3</b></span>
    </div>
    <div id="boardWrap">
      <div id="board">
        <div id="corner"></div>
        <div id="cluesTop"></div>
        <div id="cluesLeft"></div>
        <div id="grid"></div>
      </div>
    </div>
    <div class="toolbar">
      <button class="tool fillmode on" id="modeFill"><b>■</b><span id="lblFill">涂黑</span></button>
      <button class="tool crossmode" id="modeCross"><b>✕</b><span id="lblCross">打叉</span></button>
      <button class="tool tentmode" id="modeTent"><b>▨</b><span id="lblTent">待选</span></button>
      <button class="tool" id="btnUndo"><b>↶</b><span id="lblUndo">撤销</span></button>
      <button class="tool" id="btnClear"><b>⌫</b><span id="lblClear">清空</span></button>
      <button class="tool" id="btnHint"><b>✦</b><span id="lblHint">提示</span></button>
      <button class="tool easymode" id="btnEasy"><b>↓</b><span id="lblEasy">降难度</span></button>
      <i id="brushBar" aria-hidden="true"></i>
    </div>
  </section>
</div>

<div id="reveal"><div class="rvstage" id="rvStage"></div></div>
<div class="overlay" id="result"><div class="sheet cream" id="resultSheet"></div></div>
<div class="overlay" id="pause"><div class="sheet">
  <h3 id="pauseTitle">已暂停</h3>
  <div class="sub" id="pauseSub" style="margin-bottom:12px"></div>
  <button class="pb pri" id="pauseResume">继续</button>
  <button class="pb sec" id="pauseBack">返回目录</button>
</div></div>
<div class="overlay" id="ach"><div class="sheet">
  <button class="iconbtn x" id="achClose">✕</button>
  <h3 id="achTitle">本地成就</h3>

const QS=new URLSearchParams(location.search);
function detectLang(){
  const q=(QS.get('lang')||'').toLowerCase();
  if(LANGS.indexOf(q)>=0) return q;
  try{
    const raw=localStorage.getItem('idle-yueba-save-v2');
    if(raw){
      const s=JSON.parse(raw);
      if(s&&LANGS.indexOf(s.lang)>=0) return s.lang;
    }
  }catch(e){}
  const nav=(navigator.language||'').toLowerCase();
  if(nav.indexOf('ja')===0) return 'ja';
  if(nav.indexOf('ko')===0) return 'ko';
  if(nav.indexOf('zh')===0) return 'zh';
  return 'en';
}
const LANG=detectLang();
document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;
function t(k,v){
  const d=I18N[LANG]||I18N.zh;
  let s=(d[k]!=null?d[k]:I18N.zh[k]);
  if(s==null) return k;
  if(v) s=s.replace(/\{(\w+)\}/g,function(m,kk){ return v[kk]!=null?v[kk]:m; });
  return s;
}
const RAR=[null,t('common'),t('uncommon'),t('rare'),t('epic'),t('legend'),t('event')];
const RCOL=['','var(--r1)','var(--r2)','var(--r3)','var(--r4)','var(--r5)','var(--r6)'];

const MAIN_KEY='idle-yueba-save-v2';
let MAIN=null;
try{ MAIN=JSON.parse(localStorage.getItem(MAIN_KEY)||'null'); }catch(e){ MAIN=null; }
function isCollected(id){
  if(!MAIN) return false;
  const all=[MAIN.collection,MAIN.collection2,MAIN.collection3];
  for(let i=0;i<all.length;i++){
    const c=all[i]&&all[i][id];
    if(c&&((typeof c==='number'&&c>0)||(c.count||0)>0)) return true;
  }
  return false;
}
function puzzleUnlocked(p){
  if(p.pure||p.mega) return true;
  if(isCollected(p.id)) return true;
  if(p.base&&isCollected(p.base)) return true;
  const al=p.alias||[];
  for(let i=0;i<al.length;i++) if(isCollected(al[i].id)) return true;
  return false;
}

/* ================= 对局续存：页面刷新 / 版本更新不丢进度 =================
   进行中的棋盘单独存一个键，任何原因导致重新载入（首页版本检查刷新、手动刷新、
   切后台被回收）都能原样恢复；通关或主动返回名册时清除。 */
const LIVE_KEY='yueba-nonogram-live-v1';
const LIVE_PURE_KEY='yueba-nonogram-live-pure-v1';
const LIVE_MEGA_KEY='yueba-nonogram-live-mega-v1';
let MODE='classic';                       /* classic | pure | mega */
function liveKey(){ return MODE==='pure'?LIVE_PURE_KEY:(MODE==='mega'?LIVE_MEGA_KEY:LIVE_KEY); }
function curPool(){ return MODE==='pure'?NP2:(MODE==='mega'?NP3:NP); }
function curSolved(){ return MODE==='pure'?S.pure.solved:(MODE==='mega'?S.mega.solved:S.solved); }
function packCells(arr){
  let s='';
  for(let i=0;i<arr.length;i++) s+=arr[i]===1?'2':(arr[i]===0?'1':(arr[i]===2?'3':'0'));
  return s;
}
function unpackCells(str,n,fill){
  const a=new (fill===1?Uint8Array:Int8Array)(n*n);
  for(let i=0;i<n*n;i++){
    const c=str.charAt(i);
    if(fill===1) a[i]=c==='1'?1:0;
    else a[i]=c==='2'?1:(c==='1'?0:(c==='3'?2:-1));
  }
  return a;
}
function saveLive(){
  if(!G||G.done) return;
  try{
    const touched=G.base>1000||Array.prototype.some.call(G.marks,function(v){ return v!==-1; });
    if(!touched){ clearLive(); return; }
    localStorage.setItem(liveKey(),JSON.stringify({
      v:1,id:G.p.id,ms:Math.round(elapsedNow()),m:G.mistakes,h:G.hintsLeft,mode:G.mode,
      marks:packCells(G.marks),seq:packCells(G.seq),hint:packCells(G.hintM),wb:packCells(G.wrongM)
    }));
  }catch(e){}
}
function clearLive(){
  try{ localStorage.removeItem(liveKey()); }catch(e){}

/* ================= 题目预处理 ================= */
const B36='0123456789abcdefghijklmnopqrstuvwxyz';
function runsOf(arr){
  const out=[]; let n=0;
  for(let i=0;i<arr.length;i++){ if(arr[i]===1){n++;} else if(n){out.push(n);n=0;} }
  if(n) out.push(n);
  return out;
}
/* 每段的位置区间（与 runsOf 一一对应），用于按实际先后顺序摆放超级徽章 */
function runsOfPos(arr){
  const out=[]; let st=-1;
  for(let i=0;i<arr.length;i++){
    if(arr[i]===1){ if(st<0) st=i; }
    else if(st>=0){ out.push({c0:st,c1:i-1}); st=-1; }
  }
  if(st>=0) out.push({c0:st,c1:arr.length-1});
  return out;
}
function sameClue(a,b){
  if(a.length!==b.length) return false;
  for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
  return true;
}
function rowStates(p,marks,r){
  const n=p.sz, a=new Array(n);
  for(let c=0;c<n;c++) a[c]=marks[r*n+c];
  return a;
}
function colStates(p,marks,c){
  const n=p.sz, a=new Array(n);
  for(let r=0;r<n;r++) a[r]=marks[r*n+c];
  return a;
}
function clueOfStates(a){ const b=new Array(a.length); for(let i=0;i<a.length;i++) b[i]=a[i]===1?1:0; return runsOf(b); }
function buildClues(p){
  const n=p.sz, rows=[], cols=[], rruns=[], cruns=[];
  const v3=p.v===3&&p._sr;
  for(let r=0;r<n;r++){
    const b=new Array(n);
    for(let c=0;c<n;c++) b[c]=p.bits.charCodeAt(r*n+c)===49?1:0;
    if(v3){
      /* v3：大数字与小数字分开计数 —— 超级块占用的格子不计入所在行的小线索 */
      const ex=v3RowMegaMaskFromGrid(p,function(rr,cc){ return p.bits.charCodeAt(rr*n+cc)===49; },r);
      for(let c=0;c<n;c++) if((ex>>c)&1) b[c]=0;
    }
    rows.push(runsOf(b)); rruns.push(runsOfPos(b));
  }
  for(let c=0;c<n;c++){
    const b=new Array(n);
    for(let r=0;r<n;r++) b[r]=p.bits.charCodeAt(r*n+c)===49?1:0;
    cols.push(runsOf(b)); cruns.push(runsOfPos(b));
  }
  p._rows=rows; p._cols=cols; p._rruns=rruns; p._cruns=cruns;
  p._maxR=Math.max.apply(null,rows.map(function(x){return x.length;}).concat([1]));
  p._maxC=Math.max.apply(null,cols.map(function(x){return x.length;}).concat([1]));
}
const PATC=new Map();
function patterns(n,clue){
  clue=clue.filter(function(x){return x>0;});
  const key=n+'|'+clue.join(',');
  if(PATC.has(key)) return PATC.get(key);
  const L=clue.length;
  if(!L){ const a=[0]; PATC.set(key,a); return a; }
  let total=L-1;
  for(let i=0;i<L;i++) total+=clue[i];
  if(total>n){ const a=[]; PATC.set(key,a); return a; }
  const out=[];
  (function rec(i,pos,bits){
    if(i===L){ out.push(bits); return; }
    const seg=clue[i];
    let rem=0;
    for(let j=i+1;j<L;j++) rem+=clue[j];
    rem+=Math.max(0,L-i-2);
    const maxstart=n-rem-seg-(i<L-1?1:0);
    for(let st=pos;st<=maxstart;st++){
      rec(i+1,st+seg+1,bits|(((1<<seg)-1)<<st));
    }
  })(0,0,0);
  PATC.set(key,out);
  return out;
}
function stateMasks(states){
  let fill=0,cross=0;
  for(let i=0;i<states.length;i++){
    if(states[i]===1) fill|=1<<i;
    else if(states[i]===0) cross|=1<<i;
  }
  return [fill,cross];
}
function compatible(pat,fill,cross){ return (pat&cross)===0 && (fill&~pat)===0; }
function lineCands(p,kind,idx,marks){
  const n=p.sz;
  const states=kind==='r'?rowStates(p,marks,idx):colStates(p,marks,idx);
  const clue=kind==='r'?p._rows[idx]:p._cols[idx];
  /* v3：行线索只描述单行块，超级块格子属于「额外的一段」，候选需放宽 */
  if(p.v===3&&kind==='r'&&v3AllowRow(p,idx)) return rowCandsV3(n,clue,states,true);
  const pats=patterns(n,clue);
  let f=0,x=0;
  if(kind==='r'){
    for(let c=0;c<n;c++){ const v=states[c]; if(v===1) f|=1<<c; else if(v===0) x|=1<<c; }
  }else{
    for(let r=0;r<n;r++){ const v=states[r]; if(v===1) f|=1<<r; else if(v===0) x|=1<<r; }
  }
  const out=[];
  for(let i=0;i<pats.length;i++) if(compatible(pats[i],f,x)) out.push(pats[i]);
  return out;
}
const allPatCache=new Map();
function allPatterns(p,kind,idx){
  const key=p.id+kind+idx;
  if(allPatCache.has(key)) return allPatCache.get(key);
  const n=p.sz, clue=kind==='r'?p._rows[idx]:p._cols[idx];
  const a=patterns(n,clue);
  allPatCache.set(key,a);
  return a;
}

function tone(freq,dur,type,vol,delay,attack){
  const ac=audio(); if(!ac) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    const t0=ac.currentTime+(delay||0);
    const at=attack||.008;
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol||.05,t0+at);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}

/* ================= 动效 ================= */
const FX=(function(){
  const cellCls=['fx-fill','fx-cross','fx-tent','fx-erase'];
  const seq=new WeakMap();
  const mq=(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)'))||null;
  function on(){ return !S.lowPower && !(mq&&mq.matches); }
  function play(el,cls,ms,delay,varName){
    if(!el||!on()) return false;
    let map=seq.get(el);
    if(!map){ map={}; seq.set(el,map); }
    const token=(map[cls]||0)+1; map[cls]=token;
    const v=varName||'--d';
    el.classList.remove(cls);
    if(delay) el.style.setProperty(v,delay+'ms'); else el.style.removeProperty(v);
    el.classList.add(cls);
    setTimeout(function(){
      if(map[cls]!==token) return;
      el.classList.remove(cls);
      el.style.removeProperty(v);
    },(ms||160)+(delay||0)+40);
    return true;
  }
  function cell(el,v,ms){
    if(!el||!on()) return;
    const cls=v===1?'fx-fill':(v===0?'fx-cross':(v===2?'fx-tent':'fx-erase'));
    cellCls.forEach(function(c){ if(c!==cls) el.classList.remove(c); });
    play(el,cls,ms||150,0,'--fd');
  }
  function clear(el){
    if(!el) return;
    cellCls.concat(['fx-autocross','fx-hint','fx-undo']).forEach(function(c){ el.classList.remove(c); });
    ['--fd','--ad','--hd'].forEach(function(v){ el.style.removeProperty(v); });
  }
  return {on:on,play:play,cell:cell,clear:clear};
})();

function lightInk(hex){
  const m=/^#([0-9a-fA-F]{6})$/.exec(hex||'');
  if(!m) return hex;
  const r=parseInt(m[1].slice(0,2),16), g=parseInt(m[1].slice(2,4),16), b=parseInt(m[1].slice(4,6),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  if(lum<=0.72) return hex;
  const k=0.72/lum;
  return 'rgb('+Math.round(r*k)+','+Math.round(g*k)+','+Math.round(b*k)+')';
}

/* ================= 棋盘构建 ================= */
function buildBoard(p){
  const n=p.sz;
  const board=$('board');
  board.style.setProperty('--n',n);
  board.querySelectorAll('.msup').forEach(function(el){ el.remove(); });
  /* v3：大数字不进小数字序列，单独放进线索区贴近棋盘一侧的泳道 */
  // 线索 DOM
  const top=$('cluesTop'), left=$('cluesLeft');
  let th='';
  for(let c=0;c<n;c++){
    const toks=[];
    (p._cols[c]||[]).forEach(function(v,i){
      const r=(p._cruns[c]||[])[i]||{c0:0};
      toks.push({v:v,key:r.c0});
    });
    toks.sort(function(x,y){ return x.key-y.key; });
    th+='<div class="ctop" data-line="c'+c+'">'+
      toks.map(function(o){ return '<span class="num">'+o.v+'</span>'; }).join('')+'</div>';
  }
  top.innerHTML=th;
  let lh='';
  for(let r=0;r<n;r++){
    const toks=[];
    (p._rows[r]||[]).forEach(function(v,i){
      const q=(p._rruns[r]||[])[i]||{c0:0};
      toks.push({v:v,key:q.c0});
    });
    toks.sort(function(x,y){ return x.key-y.key; });
    lh+='<div class="cleft" data-line="r'+r+'">'+
      toks.map(function(o){ return '<span class="num">'+o.v+'</span>'; }).join('')+'</div>';
  }
  left.innerHTML=lh;
  // 格
  let gh='';
  for(let r=0;r<n;r++){
    for(let c=0;c<n;c++){
      const i=r*n+c;
      const cls='cell'+(c%5===4?' br':'')+(r%5===4?' bb':'');
      gh+='<div class="'+cls+'" data-i="'+i+'"></div>';
    }
  }
  gh+='<div class="gband gr"></div><div class="gband gc"></div>';
  $('grid').innerHTML=gh;
  G.gRow=$('grid').querySelector('.gband.gr');
  G.gCol=$('grid').querySelector('.gband.gc');
  GUIDE.r=-1; GUIDE.c=-1;
  $('grid').classList.remove('guiding');
  $('grid').classList.remove('win','scan-in');
  G.cellEls=[];
  $('grid').querySelectorAll('.cell').forEach(function(el){ G.cellEls[+el.getAttribute('data-i')]=el; });
  G.rowEls=[]; G.colEls=[];
  left.querySelectorAll('.cleft').forEach(function(el,idx){ G.rowEls[idx]=el; });
  top.querySelectorAll('.ctop').forEach(function(el,idx){ G.colEls[idx]=el; });
  /* 超级带的两行/两列打上常驻底色，和徽章一起提示「这是一组」 */
  if(p.mega){
    const sr0=p._sr||[], sc0=p._sc||[];
    for(let a=0;a<n-1;a++){
      if(sr0[a]&&sr0[a].length){
        if(G.rowEls[a]) G.rowEls[a].classList.add('band');
        if(G.rowEls[a+1]) G.rowEls[a+1].classList.add('band');
      }
      if(sc0[a]&&sc0[a].length){
        if(G.colEls[a]) G.colEls[a].classList.add('band');
        if(G.colEls[a+1]) G.colEls[a+1].classList.add('band');
      }
    }
  }
  // 超级线索徽章（仅超级数织）
  G.supEls={r:[],c:[]};
  for(let a=0;a<n-1;a++){ G.supEls.r[a]=[]; G.supEls.c[a]=[]; }
  if(p.mega){
    const sr=p._sr||[], sc=p._sc||[];
    for(let a=0;a<n-1;a++){
      (sr[a]||[]).forEach(function(v,k){
        const el=document.createElement('span');
        el.className='msup'; el.textContent=String(v);
        el.setAttribute('data-band','r'+a); el.setAttribute('data-k',k);
        board.appendChild(el); G.supEls.r[a].push(el);
      });
      (sc[a]||[]).forEach(function(v,k){
        const el=document.createElement('span');
        el.className='msup'; el.textContent=String(v);
        el.setAttribute('data-band','c'+a); el.setAttribute('data-k',k);
        board.appendChild(el); G.supEls.c[a].push(el);
      });
    }
  }
  layoutBoard();
  renderBoard();
}
function layoutBoard(){
  if(!G) return;
  const n=G.p.sz;
  const vw=Math.min(window.innerWidth,860);
  const vh=window.innerHeight;
  const availW=vw-20;
  const availH=vh-190;
  const maxR=G.p._maxR, maxC=G.p._maxC;
  /* v3：大数字走专属泳道，要按徽章数量给线索区预留一条贴棋盘的长条空间 */
  const lane=!!(G.p.mega&&G.p.v===3);
  let MR=0, MC=0;
  if(G.p.mega && G.supEls){
    G.supEls.r.forEach(function(l){ MR=Math.max(MR,l.length); });
    G.supEls.c.forEach(function(l){ MC=Math.max(MC,l.length); });
  }
  const wUnit=n+maxR*0.62+0.4+(MR?MR*(lane?0.72:0.58)+(MR-1)*0.06+0.22:0);
  const hUnit=n+maxC*0.78+0.6+(MC?MC*(lane?0.72:0.58)+(MC-1)*0.06+0.22:0);
  let cell=Math.floor(Math.min(availW/wUnit,availH/hUnit,28));
  cell=Math.max(11,Math.min(30,cell));
  const ms=Math.max(10,Math.round(cell*0.54));
  /* v3 泳道里的徽章是长条：横跨两行/两列，宽边不小于 0.72 格，保证数字清楚 */
  const msw=lane?Math.max(ms,Math.round(cell*0.72)):ms;
  const laneW=lane&&MR?MR*msw+(MR-1)*2+4:0;
  const laneH=lane&&MC?MC*msw+(MC-1)*2+4:0;
  const leftw=Math.ceil(maxR*cell*0.62+6+(lane?laneW:(MR?MR*msw+(MR-1)*2+4:0)));
  const toph=Math.ceil(maxC*cell*0.74+4+(lane?laneH:(MC?MC*msw+(MC-1)*2+4:0)));
  const board=$('board');
  G.cell=cell;
  board.style.setProperty('--cell',cell+'px');
  board.style.setProperty('--leftw',leftw+'px');
  board.style.setProperty('--toph',toph+'px');
  board.style.setProperty('--cluefs',Math.max(7,Math.round(cell*0.52))+'px');
  board.style.setProperty('--msup',ms+'px');
  board.style.setProperty('--msupfs',Math.max(7,Math.round(ms*0.62))+'px');
  board.style.setProperty('--supLane',laneW+'px');
  board.style.setProperty('--supLaneC',laneH+'px');
  if(G.p.mega && G.supEls){
    if(lane){
      /* v3：徽章占满带内两行/两列，居中放在泳道里，和小数字不共用任何槽位，
         小数字保持真实先后顺序，大数字属于哪两行/两列也不会看错 */
      G.supEls.r.forEach(function(list,a){
        list.forEach(function(el,k){
          el.style.width=msw+'px'; el.style.height=(cell*2)+'px';
          el.style.left=(leftw-2-(k+1)*msw-k*2)+'px';
          el.style.top=(toph+a*cell)+'px';
        });
      });
      G.supEls.c.forEach(function(list,a){
        list.forEach(function(el,k){
          el.style.width=(cell*2)+'px'; el.style.height=msw+'px';
          el.style.left=(leftw+a*cell)+'px';
          el.style.top=(toph-2-(k+1)*msw-k*2)+'px';
        });
      });
    }else{
      G.supEls.r.forEach(function(list,a){
        list.forEach(function(el,k){
          el.style.width=ms+'px'; el.style.height=ms+'px';
          el.style.left=(2+k*(ms+2))+'px';
          el.style.top=Math.round(toph+(a+1)*cell-ms/2)+'px';
        });
      });
      G.supEls.c.forEach(function(list,a){
        list.forEach(function(el,k){
          el.style.width=ms+'px'; el.style.height=ms+'px';
          el.style.left=Math.round(leftw+(a+1)*cell-ms/2)+'px';
          el.style.top=(2+k*(ms+2))+'px';
        });
      });
    }
  }
  moveBrushBar();
  applyGuidePos();
}
/* ================= 行/列引导：防止看错行 ================= */
function applyGuidePos(){
  if(!G) return;
  const cell=G.cell||0;
  if(G.gRow) G.gRow.style.transform=GUIDE.r>=0?'translateY('+(GUIDE.r*cell)+'px)':'none';
  if(G.gCol) G.gCol.style.transform=GUIDE.c>=0?'translateX('+(GUIDE.c*cell)+'px)':'none';
}
function setGuide(r,c){
  if(!G||G.done||G.paused) return;
  if(r===GUIDE.r&&c===GUIDE.c) return;
  GUIDE.r=r; GUIDE.c=c;
  const p=G.p,n=p.sz;
  const rr={}, cc={};
  if(r>=0) rr[r]=1;
  if(c>=0) cc[c]=1;
  /* 超级带：相邻的行/列用次级高亮一并点亮，读大数字时不会看错是「哪两行」 */
  if(p.mega){
    const sr=p._sr||[], sc=p._sc||[];
    if(r>=0){
      if(sr[r]&&sr[r].length&&r+1<n) rr[r+1]=2;
      else if(r>0&&sr[r-1]&&sr[r-1].length) rr[r-1]=2;
    }
    if(c>=0){
      if(sc[c]&&sc[c].length&&c+1<n) cc[c+1]=2;
      else if(c>0&&sc[c-1]&&sc[c-1].length) cc[c-1]=2;
    }
  }
  for(let i=0;i<n;i++){
    const re=G.rowEls[i], ce=G.colEls[i];
    if(re){ re.classList.toggle('hl',rr[i]===1); re.classList.toggle('hl2',rr[i]===2); }
    if(ce){ ce.classList.toggle('hl',cc[i]===1); ce.classList.toggle('hl2',cc[i]===2); }
  }
  $('grid').classList.toggle('guiding',r>=0||c>=0);
  applyGuidePos();

/* ================= 线索状态 ================= */
function updateLines(silent){
  if(!G) return;
  const n=G.p.sz,easy=!!S.easy;
  const newBad=new Set(), newlyDone=[];
  let allSolved=true;
  function scan(kind,idx,el){
    const info=lineInfo(kind,idx);
    if(!info.solved) allSolved=false;
    const key=kind+idx;
    if(!info.ok) newBad.add(key);
    paintClue(el,info,easy);
    if(info.solved){
      if(!G.lineDone.has(key)){
        G.lineDone.add(key);
        if(!silent) newlyDone.push([kind,idx]);
      }
    }else{
      G.lineDone.delete(key);
    }
  }
  for(let r=0;r<n;r++) scan('r',r,G.rowEls[r]);
  for(let c=0;c<n;c++) scan('c',c,G.colEls[c]);
  if(G.p.mega){
    const sr=G.p._sr||[], sc=G.p._sc||[], strict=G.p.v>=2;
    for(let a=0;a<n-1;a++){
      const rv=sr[a]||[], cv=sc[a]||[];
      if(rv.length||strict){
        /* v2/v3：没有超级线索的行对之间不允许出现上下相接的填充（跨行连通分量恰好等于 sr[a]） */
        const ok=bandOk(rv,megaBandComps(G.p,G.marks,a,true),strict);
        if(!ok) allSolved=false;
        (G.supEls.r[a]||[]).forEach(function(el){ el.classList.toggle('done',ok); });
      }
      if(cv.length){
        const ok=bandOk(cv,megaBandComps(G.p,G.marks,a,false),strict);
        if(!ok) allSolved=false;
        (G.supEls.c[a]||[]).forEach(function(el){ el.classList.toggle('done',ok); });
      }
    }
  }
  if(easy){
    // 失误：从未解状态进入无解状态时 +1
    newBad.forEach(function(k){
      if(!G.bad.has(k)){
        G.bad.add(k);
        if(!silent){ G.mistakes++; SFX.err(); buzz(18); shakeBoard(); fxBadClue(k); }
        if(!silent) updateHUD();
      }
    });
    G.bad.forEach(function(k){ if(!newBad.has(k)) G.bad.delete(k); });
  }else{
    // 非降难度：玩家自己划叉，填错不提示；整盘填满仍不对才判一次错
    G.bad.clear();
    if(!allSolved&&!G.done&&!silent&&boardFull()){
      G.mistakes++; updateHUD(); SFX.err(); buzz(18); shakeBoard();
      toast(t('fillWrong'));
    }
  }
  if(!silent&&newlyDone.length&&!allSolved) fxLineDone(newlyDone);
  if(allSolved&&!G.done) finish();
}
function boardFull(){
  if(!G) return false;
  for(let i=0;i<G.marks.length;i++) if(G.marks[i]===-1||G.marks[i]===2) return false;
  return true;
}
function lineInfo(kind,idx){
  const p=G.p,n=p.sz;
  const states=kind==='r'?rowStates(p,G.marks,idx):colStates(p,G.marks,idx);
  const clue=kind==='r'?p._rows[idx]:p._cols[idx];
  const cands=lineCands(p,kind,idx,G.marks);
  let solved;
  if(p.v===3&&kind==='r'&&v3AllowRow(p,idx)){
    /* v3：超级块格子不计入小线索；整行（含超级格）都落实后才算完成 */
    const ex=v3RowMegaMaskFromGrid(p,function(rr,cc){ return G.marks[rr*n+cc]===1; },idx);
    const s2=new Array(n);
    let decided=true;
    for(let c=0;c<n;c++){
      const mv=G.marks[idx*n+c];
      if(mv===-1||mv===2) decided=false;
      s2[c]=((ex>>c)&1)?0:states[c];
    }
    solved=decided&&sameClue(clueOfStates(s2),clue);
  }else{
    solved=sameClue(clueOfStates(states),clue);
  }
  return {solved:solved,ok:cands.length>0,count:cands.length,cands:cands};
}
/* 超级线索：2×n 带状区域内「跨两行/两列」的极大 4 邻接连通块大小（升序） */
function megaBandComps(p,marks,a,isRow){
  const n=p.sz;
  const grid=[new Array(n),new Array(n)];
  for(let i=0;i<n;i++){
    grid[0][i]= isRow ? (marks[a*n+i]===1?1:0) : (marks[i*n+a]===1?1:0);
    grid[1][i]= isRow ? (marks[(a+1)*n+i]===1?1:0) : (marks[i*n+a+1]===1?1:0);
  }
  const seen=[new Array(n).fill(false),new Array(n).fill(false)];
  const out=[];
  for(let sy=0;sy<2;sy++) for(let sx=0;sx<n;sx++){
    if(!grid[sy][sx]||seen[sy][sx]) continue;
    const stack=[sy*n+sx]; seen[sy][sx]=true;
    let size=0,ta=false,tb=false;
    while(stack.length){
      const cur=stack.pop(), cy=Math.floor(cur/n), cx=cur%n;
      size++;
      if(cy===0) ta=true; else tb=true;
      const nb=[[cy-1,cx],[cy+1,cx],[cy,cx-1],[cy,cx+1]];
      for(let q=0;q<4;q++){
        const ny=nb[q][0], nx=nb[q][1];
        if(ny>=0&&ny<2&&nx>=0&&nx<n&&grid[ny][nx]&&!seen[ny][nx]){ seen[ny][nx]=true; stack.push(ny*n+nx); }
      }
    }
    if(ta&&tb) out.push(size);
  }
  out.sort(function(x,y){ return x-y; });
  return out;
}
function superSatisfied(vals,comps){
  if(!vals.length) return true;
  const pool=comps.slice();
  for(let i=0;i<vals.length;i++){
    const idx=pool.indexOf(vals[i]);
    if(idx<0) return false;
    pool.splice(idx,1);
  }
  return true;
}
/* v2：跨行连通分量必须「恰好」等于超级线索（没有线索时即一个都不许有） */
function bandOk(vals,comps,exact){
  if(exact&&comps.length!==vals.length) return false;
  return superSatisfied(vals,comps);
}
/* ============ 超级数织：联合传播（供「提示」使用） ============ */
const SUP_CACHE=new Map();
function popcnt(v){
  v=v-((v>>1)&0x55555555);
  v=(v&0x33333333)+((v>>2)&0x33333333);
  v=(v+(v>>4))&0x0f0f0f0f;
  return (v*0x01010101)>>24;
}
function bandCompsMask(n,pa,pb){
  const key=n+':'+pa+':'+pb;
  const hit=SUP_CACHE.get(key);
  if(hit!==undefined) return hit;
  if(SUP_CACHE.size>300000) SUP_CACHE.clear();
  const out=[];
  let ua=pa, ub=pb;
  while(ua|ub){
    let fa=ua&-ua, fb=0;
    if(fa) ua&=~fa;
    else{ fb=ub&-ub; ub&=~fb; }
    let size=0, ta=false, tb=false;
    while(fa|fb){
      if(fa) ta=true;
      if(fb) tb=true;
      size+=popcnt(fa)+popcnt(fb);
      const na=((((fa<<1)|(fa>>1))&pa)|fb)&ua;
      const nb=((((fb<<1)|(fb>>1))&pb)|fa)&ub;
      ua&=~na; ub&=~nb;
      fa=na; fb=nb;
    }
    if(ta&&tb) out.push(size);
  }
  out.sort(function(x,y){ return x-y; });
  SUP_CACHE.set(key,out);
  return out;
}
/* ============ v3：大数字与小数字分开计数 ============ */
/* 超级带 = 有超级线索的相邻行对；带内两行的小线索都不包含超级块占用的格子 */
function v3AllowRow(p,r){
  const sr=p._sr||[];
  return !!((sr[r]&&sr[r].length)||(r>0&&sr[r-1]&&sr[r-1].length));
}
function bandCrossGrid(n,pa,pb){
  let ua=pa, ub=pb, ca=0, cb=0;
  const comps=[];
  while(ua||ub){
    let A=0, B=0;
    if(ua){ const fa=ua&-ua; A=fa; ua&=~fa; }
    else{ const fb=ub&-ub; B=fb; ub&=~fb; }
    while(true){
      const A2=((A|(A<<1)|(A>>1))&pa)|(B&pa);
      const B2=((B|(B<<1)|(B>>1))&pb)|(A&pb);
      if(A2===A&&B2===B) break;
      A=A2; B=B2;
    }
    ua&=~A; ub&=~B;
    if(A&&B){ comps.push(popcnt(A)+popcnt(B)); ca|=A; cb|=B; }
  }
  comps.sort(function(x,y){ return x-y; });
  return {comps:comps,ca:ca,cb:cb};
}
/* 某一行里「属于超级块」的格子掩码（按当前已知的填充情况推定） */
function v3RowMegaMaskFromGrid(p,isFilled,r){
  const n=p.sz, sr=p._sr||[];
  let a=-1, upper=false;
  if(sr[r]&&sr[r].length){ a=r; upper=true; }
  else if(r>0&&sr[r-1]&&sr[r-1].length){ a=r-1; upper=false; }
  if(a<0) return 0;
  let pa=0, pb=0;
  for(let i=0;i<n;i++){
    if(isFilled(a,i)) pa|=1<<i;
    if(isFilled(a+1,i)) pb|=1<<i;
  }
  const res=bandCrossGrid(n,pa,pb);
  return upper?res.ca:res.cb;
}
function clueOfMask(n,m){
  const out=[]; let run=0;
  for(let i=0;i<n;i++){
    if((m>>i)&1) run++;
    else if(run){ out.push(run); run=0; }
  }
  if(run) out.push(run);
  return out;
}
/* cl 去掉恰好一段后等于 target（去掉的那段就是超级块） */
function minusOneClue(cl,target){
  if(cl.length!==target.length+1) return false;
  for(let k=0;k<cl.length;k++){
    if(sameClue(cl.slice(0,k).concat(cl.slice(k+1)),target)) return true;
  }
  return false;
}
const ROWV3C=new Map();
function rowCandsV3(n,target,states,allowExtra){
  let f=0,x=0;
  for(let i=0;i<n;i++){ const v=states[i]; if(v===1) f|=1<<i; else if(v===0) x|=1<<i; }
  const key=n+'|'+target.join(',')+'|'+f+'|'+x+'|'+(allowExtra?1:0);
  const hit=ROWV3C.get(key);
  if(hit!==undefined) return hit;
  const out=[];
  for(let m=0;m<(1<<n);m++){
    if((m&x)||(f&~m)) continue;
    const cl=clueOfMask(n,m);
    if(sameClue(cl,target)||(allowExtra&&minusOneClue(cl,target))) out.push(m);
  }
  if(ROWV3C.size>40000) ROWV3C.clear();
  ROWV3C.set(key,out);
  return out;
}
/* 枚举两行排列对：跨行连通分量恰等于 want；own 时再校验「行 - 超级块」= 该行小线索 */
function v3Pairs(n,clA,clB,stA,stB,want,allowA,allowB,own){
  let f=0,x=0,i;
  for(i=0;i<n;i++){ if(stA[i]===1) f|=1<<i; else if(stA[i]===0) x|=1<<i; }
  let paList;
  if(allowA) paList=rowCandsV3(n,clA,stA,true);
  else{
    paList=[];
    const pats=patterns(n,clA);
    for(let k=0;k<pats.length;k++) if(compatible(pats[k],f,x)) paList.push(pats[k]);
  }
  if(!paList.length) return null;
  f=0;x=0;
  for(i=0;i<n;i++){ if(stB[i]===1) f|=1<<i; else if(stB[i]===0) x|=1<<i; }
  let pbList;
  if(allowB) pbList=rowCandsV3(n,clB,stB,true);
  else{
    pbList=[];
    const pats=patterns(n,clB);
    for(let k=0;k<pats.length;k++) if(compatible(pats[k],f,x)) pbList.push(pats[k]);
  }
  if(!pbList.length) return null;
  const w=want.slice().sort(function(a,b){ return a-b; });
  let aa=0,oa=0,ab=0,ob=0,any=false;
  for(let p=0;p<paList.length;p++){
    const pa=paList[p];
    for(let q=0;q<pbList.length;q++){
      const pb=pbList[q], bc=bandCrossGrid(n,pa,pb);
      if(bc.comps.length!==w.length) continue;
      let ok=true;
      for(let t=0;t<w.length;t++){ if(bc.comps[t]!==w[t]){ ok=false; break; } }
      if(!ok) continue;
      if(own){
        if(!sameClue(clueOfMask(n,pa&~bc.ca),clA)) continue;
        if(!sameClue(clueOfMask(n,pb&~bc.cb),clB)) continue;
      }
      if(!any){ aa=oa=pa; ab=ob=pb; any=true; }
      else{ aa&=pa; oa|=pa; ab&=pb; ob|=pb; }
    }
  }
  if(!any) return null;
  return [aa,oa,ab,ob];
}
function deduceLine(n,clue,states){
  const pats=patterns(n,clue);
  let f=0,x=0;
  for(let i=0;i<n;i++){ if(states[i]===1) f|=1<<i; else if(states[i]===0) x|=1<<i; }
  let a=0,o=0,any=false;
  for(let k=0;k<pats.length;k++){
    const pt=pats[k];
    if(!compatible(pt,f,x)) continue;
    if(!any){ a=pt; o=pt; any=true; } else { a&=pt; o|=pt; }
  }
  if(!any) return null;
  return [a,o];
}
function megaPairs(n,clueA,clueB,want,sa,sb,exact){
  let f=0,x=0,i;
  for(i=0;i<n;i++){ if(sa[i]===1) f|=1<<i; else if(sa[i]===0) x|=1<<i; }
  const paList=patterns(n,clueA).filter(function(pt){ return compatible(pt,f,x); });
  if(!paList.length) return null;
  f=0;x=0;
  for(i=0;i<n;i++){ if(sb[i]===1) f|=1<<i; else if(sb[i]===0) x|=1<<i; }
  const pbList=patterns(n,clueB).filter(function(pt){ return compatible(pt,f,x); });
  if(!pbList.length) return null;
  const w=want.slice().sort(function(a,b){ return a-b; });
  let aa=0,oa=0,ab=0,ob=0,any=false;
  for(let p=0;p<paList.length;p++){
    const pa=paList[p];
    for(let q=0;q<pbList.length;q++){
      const pb=pbList[q], comps=bandCompsMask(n,pa,pb);
      if(exact&&comps.length!==w.length) continue;
      let ok=true;
      for(let t=0;t<w.length;t++){ if(comps.indexOf(w[t])<0){ ok=false; break; } }
      if(!ok) continue;
      if(!any){ aa=oa=pa; ab=ob=pb; any=true; }
      else{ aa&=pa; oa|=pa; ab&=pb; ob|=pb; }
    }
  }
  if(!any) return null;
  return [aa,oa,ab,ob];
}
function megaDeduce(p,marks){
  if(p.v===3) return megaDeduceV3(p,marks);
  const n=p.sz, empty={fill:[],cross:[]};
  const st=[];
  for(let r=0;r<n;r++){
    const row=[];
    for(let c=0;c<n;c++){ const v=marks[r*n+c]; row.push(v===1?1:(v===0?0:-1)); }
    st.push(row);
  }
  const apply=function(states,andm,orm){ let ch=false;
    for(let i=0;i<n;i++){
      if(((andm>>i)&1)&&states[i]!==1){ states[i]=1; ch=true; }
      else if(!((orm>>i)&1)&&states[i]!==0){ states[i]=0; ch=true; }
    }
    return ch;
  };
  for(let loop=0;loop<400;loop++){
    let changed=false;
    for(let r=0;r<n;r++){
      const d=deduceLine(n,p._rows[r],st[r]); if(!d) return empty;
      if(apply(st[r],d[0],d[1])) changed=true;
    }
    for(let c=0;c<n;c++){
      const col=[]; for(let r=0;r<n;r++) col.push(st[r][c]);
      const d=deduceLine(n,p._cols[c],col); if(!d) return empty;
      if(apply(col,d[0],d[1])){ for(let r=0;r<n;r++) st[r][c]=col[r]; changed=true; }

    for(let a=0;a<n-1;a++){

        const res=megaPairs(n,p._rows[a],p._rows[a+1],sr[a]||[],st[a],st[a+1],v2); if(!res) return empty;
        if(apply(st[a],res[0],res[1])) changed=true;
        if(apply(st[a+1],res[2],res[3])) changed=true;
