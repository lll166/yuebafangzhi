<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月巴数织 · Nonogram</title>
<style>
:root{
  --bg:#eff1f8; --bg2:#e2e5f1; --paper:#34384c; --ink:#34384c; --mut:#868aa2;
  --acc:#636c9e; --pink:#a08fc2; --ice:#7f9ec9; --gold:#b08a48;
  --line:rgba(52,58,82,.18); --line2:rgba(52,58,82,.46);
  --glass:rgba(255,255,255,.58); --glass2:rgba(255,255,255,.86);
  --tint:rgba(99,108,158,.055); --glow:0 0 16px rgba(99,108,158,.16);
  --mono:"SF Mono","Cascadia Mono",Consolas,ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
  --r1:#7d8aa5; --r2:#6e9d8a; --r3:#7f9ec9; --r4:#8c82c0; --r5:#b08a48; --r6:#a08fc2;
  --safe:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1100px 700px at 18% -10%, #fbfbfe 0%, transparent 60%),
    radial-gradient(900px 600px at 92% 108%, #eceef6 0%, transparent 55%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  color:var(--paper);
  font-family:var(--mono);
  letter-spacing:.02em;
  overflow:hidden;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.55;
  background:repeating-linear-gradient(0deg,rgba(52,58,82,.03) 0 1px,transparent 1px 3px),
             repeating-linear-gradient(90deg,rgba(52,58,82,.024) 0 1px,transparent 1px 4px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto}
/* ---------- 顶栏 ---------- */
header#top{
  flex:none;display:flex;align-items:center;gap:8px;padding:calc(11px + env(safe-area-inset-top,0px)) 14px 10px;
  border-bottom:1px solid var(--line2);z-index:5;
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(234,238,248,.74));
  backdrop-filter:blur(10px);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.5);
}
.brand{font-family:var(--mono);font-size:15px;font-weight:900;letter-spacing:.2em;line-height:1.05}
.brand small{display:block;font-family:inherit;font-size:8px;font-weight:700;letter-spacing:.32em;color:var(--mut);margin-top:4px}
.brand small::before{content:"// ";color:var(--acc)}
.topstat{margin-left:auto;font-size:10px;letter-spacing:.06em;color:var(--mut);text-align:right;line-height:1.4;white-space:nowrap;font-variant-numeric:tabular-nums}
.topstat b{color:var(--paper);font-weight:800}
.iconbtn{
  width:34px;height:34px;flex:none;border-radius:0;display:grid;place-items:center;
  font-size:13px;line-height:1;color:var(--ink);
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.48);
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(228,232,244,.86));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  box-shadow:inset 0 0 12px rgba(99,108,158,.05);
  transition:background .15s,transform .12s;
}
.iconbtn:active{transform:scale(.94)}
.iconbtn.on{background:linear-gradient(180deg,rgba(99,108,158,.22),rgba(99,108,158,.1));border-color:rgba(99,108,158,.6);border-left-color:var(--acc)}
/* ---------- 滚动区 ---------- */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:14px 14px calc(22px + var(--safe))}
/* ---------- 目录 ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.stat{
  position:relative;padding:8px 10px;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.55);
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.38));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  box-shadow:inset 0 0 16px rgba(99,108,158,.04);
}
.stat i{display:block;font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.16em;color:var(--mut)}
.stat b{display:block;font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.stat b em{font-style:normal;font-size:10px;color:var(--mut);font-weight:400}
.notice{
  display:flex;gap:9px;align-items:flex-start;padding:9px 12px 9px 13px;margin-bottom:12px;
  border:1px solid var(--line);border-left:2px solid rgba(160,143,194,.72);border-radius:0;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(160,143,194,.09));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  font-size:10.5px;line-height:1.6;color:#61667c;
}
.notice .ni{flex:none;font-size:13px;line-height:1.2;color:var(--pink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.4);
  background:rgba(255,255,255,.5);font-size:10.5px;letter-spacing:.06em;color:var(--mut);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
  transition:.16s;
}
.chip::before{content:"";width:4px;height:4px;flex:none;background:currentColor;opacity:.4}
.chip.on{
  background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  border-color:rgba(99,108,158,.85);border-left-color:#4d5588;font-weight:800;
  box-shadow:0 0 12px rgba(99,108,158,.3);
}
.chip.on::before{opacity:1;box-shadow:0 0 6px #fff}
.rgroup{margin-top:12px}
.rhead{display:flex;align-items:center;gap:8px;font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--mut);margin:0 2px 8px}
.rhead::after{content:"";flex:1;height:1px;background:var(--line)}
.rhead b{color:var(--paper);font-weight:900;letter-spacing:.08em}
.rdot{width:6px;height:6px;background:var(--c);box-shadow:0 0 8px var(--c)}
.rgroup.again{margin-top:16px}
.rhead.again{color:#a34b40}
.rhead.again b{color:#8f352e}
.rhead.again .rdot{background:#c1553f;box-shadow:0 0 8px #c1553f}
.gdesc{font-size:9.5px;line-height:1.6;color:var(--mut);margin:-1px 2px 9px;letter-spacing:.04em}
.rgroup.again .card{border-color:rgba(193,85,63,.34)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{
  flex:1;padding:9px 0;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.4);
  background:rgba(255,255,255,.5);
  font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--mut);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
  transition:.16s;
}
.tab.on{
  background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  border-color:rgba(99,108,158,.85);border-left-color:#4d5588;
  box-shadow:0 0 12px rgba(99,108,158,.3);
}
#paneCodex.off,#paneRandom.off{display:none}
.hero{
  position:relative;padding:14px 14px 12px;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.55);
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,.4));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);
  box-shadow:inset 0 0 20px rgba(99,108,158,.04);
}
.heroart{
  position:relative;width:min(58vw,230px);aspect-ratio:1/1;margin:0 auto 12px;
  display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.9),rgba(52,58,82,.05) 72%);
  border:1px solid var(--line);
}
.heroart img,.heroart canvas{width:100%;height:100%;object-fit:contain;padding:9%;image-rendering:pixelated;filter:drop-shadow(0 6px 10px rgba(52,58,82,.22))}
.heroart::after{
  content:"";position:absolute;inset:5px;pointer-events:none;opacity:.55;
  background:
    linear-gradient(var(--acc),var(--acc)) left top/12px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) left top/2px 12px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/12px 2px no-repeat,
    linear-gradient(var(--acc),var(--acc)) right bottom/2px 12px no-repeat;
}
.hero .wq{font-size:44px}
.herotag{
  display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:6px;
  font-family:var(--mono);font-size:8.5px;font-weight:800;letter-spacing:.3em;color:var(--mut);
}
.herotag::before,.herotag::after{content:"";height:1px;flex:1;background:var(--line)}
.herometa{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mut);margin-bottom:11px;font-variant-numeric:tabular-nums}
.herobtn{
  display:block;width:100%;padding:13px 0;border:0;border-radius:0;
  background:linear-gradient(180deg,#7f88b8,var(--acc));color:#f7f9ff;
  font-family:var(--mono);font-size:12px;font-weight:900;letter-spacing:.2em;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
  box-shadow:0 0 18px rgba(99,108,158,.32);transition:transform .12s,filter .12s;
}
.herobtn:active{transform:translateY(1px);filter:brightness(.95)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.cards{grid-template-columns:repeat(4,1fr)}}
@media(min-width:820px){.cards{grid-template-columns:repeat(5,1fr)}}
.card{
  position:relative;text-align:left;border-radius:0;
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.42);
  background:linear-gradient(180deg,rgba(255,255,255,.66),rgba(255,255,255,.4));
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  overflow:hidden;transition:transform .14s,border-color .14s,background .14s;min-width:0;
  box-shadow:inset 0 0 18px rgba(99,108,158,.035);
}
.card:hover{transform:translateY(-2px);border-color:var(--line2);background:rgba(255,255,255,.74)}
.card:active{transform:scale(.985)}
.card .cart{aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;background:rgba(52,58,82,.05)}
.card .cart img{width:100%;height:100%;object-fit:contain;padding:8%;filter:drop-shadow(0 4px 8px rgba(52,58,82,.22))}
/* 未解救：统一灰色剪影（取微笑月巴外形）+ 牢门栏杆 + 锁/问号 */

.bars{position:absolute;inset:0;pointer-events:none;--gap:15px;
  background:
    repeating-linear-gradient(90deg,rgba(43,48,66,.46) 0 3px,transparent 3px var(--gap)),
    linear-gradient(rgba(43,48,66,.42),rgba(43,48,66,.42)) center/100% 2px no-repeat,
    linear-gradient(180deg,rgba(43,48,66,.10),transparent 24%,transparent 76%,rgba(43,48,66,.14));
  box-shadow:inset 0 0 18px rgba(43,48,66,.20)}
.heroart .sil{inset:14% 24% 10%}
.heroart .bars{--gap:26px}
.bars::before,.bars::after{content:"";position:absolute;left:0;right:0;height:4px;background:rgba(43,48,66,.5);box-shadow:0 1px 0 rgba(255,255,255,.35)}
.bars::before{top:0}
.bars::after{bottom:0;box-shadow:0 -1px 0 rgba(255,255,255,.35)}
.wq{position:absolute;z-index:2;font-family:var(--mono);font-size:24px;color:rgba(52,58,82,.38);text-shadow:0 0 8px rgba(255,255,255,.95)}
.card.locked .wq{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;
  font-size:19px;line-height:1;opacity:1;
  background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(43,48,66,.16),0 2px 8px rgba(43,48,66,.22)}
.card.locked{opacity:.72}
.card.locked:active{transform:none}
.card.locked.deny{animation:deny .32s ease-out}
@keyframes deny{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.card.locked .cart{background:rgba(52,58,82,.075)}
.cdot{position:absolute;top:7px;left:7px;width:5px;height:5px;background:var(--pink);box-shadow:0 0 6px var(--pink)}
/* ---------- 棋盘页 ---------- */
#viewPuzzle{flex:1;display:none;flex-direction:column;min-height:0}
#viewPuzzle.on{display:flex}
#viewCatalog.off{display:none}
.pbar{flex:none;display:flex;align-items:center;gap:8px;padding:9px 14px 5px}
.pbar .ptitle{flex:1;text-align:center;font-size:9.5px;letter-spacing:.1em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar .ptitle b{color:var(--paper);font-family:var(--mono);font-size:13px;font-weight:900;letter-spacing:.08em}
.backbtn{
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mut);padding:8px 10px;border-radius:0;flex:none;
  background:linear-gradient(180deg,rgba(255,255,255,.86),rgba(228,232,244,.82));
  border:1px solid var(--line);border-left:2px solid rgba(99,108,158,.45);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
}
.pinfo{flex:none;display:flex;justify-content:center;gap:15px;font-size:10px;letter-spacing:.08em;color:var(--mut);padding:0 14px 4px;font-variant-numeric:tabular-nums}
.pinfo b{color:var(--paper);font-weight:800}
.pinfo .warn b{color:var(--acc)}
#boardWrap{flex:1;display:grid;place-items:center;min-height:0;padding:8px 10px;overflow:auto;overscroll-behavior:contain}
#board{display:grid;grid-template-columns:var(--leftw) calc(var(--cell) * var(--n));
  grid-template-rows:var(--toph) calc(var(--cell) * var(--n));touch-action:none;user-select:none;-webkit-user-select:none}
#corner{grid-column:1;grid-row:1;position:relative}
#cluesTop{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(var(--n),var(--cell));align-items:end}
#cluesLeft{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(var(--n),var(--cell))}
#grid{grid-column:2;grid-row:2;display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-template-rows:repeat(var(--n),var(--cell));outline:1.5px solid var(--line2);outline-offset:0;position:relative}
#grid::after{
  content:"";position:absolute;inset:-6px;pointer-events:none;z-index:3;opacity:.7;
  background:

@keyframes cellwin{0%{transform:scale(1);filter:brightness(1)}45%{transform:scale(1.35);filter:brightness(1.7)}100%{transform:scale(1);filter:brightness(1.15)}}
.toolbar{

}

.tool.tentmode.on{background:linear-gradient(180deg,rgba(160,143,194,.2),rgba(160,143,194,.08));border-color:rgba(160,143,194,.62);border-left-color:var(--pink);box-shadow:inset 0 0 16px rgba(160,143,194,.14)}

.tool .cnt{position:absolute;transform:translate(14px,-11px);font-size:8px;color:var(--acc);font-weight:800}

const QS=new URLSearchParams(location.search);
function detectLang(){
  const q=(QS.get('lang')||'').toLowerCase();
  if(LANGS.indexOf(q)>=0) return q;
  try{
    const raw=localStorage.getItem('idle-yueba-save-v2');
    if(raw){
      const s=JSON.parse(raw);
      if(s&&LANGS.indexOf(s.lang)>=0) return s.lang;
    }
  }catch(e){}
  const nav=(navigator.language||'').toLowerCase();
  if(nav.indexOf('ja')===0) return 'ja';
  if(nav.indexOf('ko')===0) return 'ko';
  if(nav.indexOf('zh')===0) return 'zh';
  return 'en';
}
const LANG=detectLang();
document.documentElement.lang=LANG==='zh'?'zh-CN':LANG;
function t(k,v){
  const d=I18N[LANG]||I18N.zh;
  let s=(d[k]!=null?d[k]:I18N.zh[k]);
  if(s==null) return k;
  if(v) s=s.replace(/\{(\w+)\}/g,function(m,kk){ return v[kk]!=null?v[kk]:m; });
  return s;
}

const MAIN_KEY='idle-yueba-save-v2';
let MAIN=null;
try{ MAIN=JSON.parse(localStorage.getItem(MAIN_KEY)||'null'); }catch(e){ MAIN=null; }
function isCollected(id){
  if(!MAIN) return false;
  const all=[MAIN.collection,MAIN.collection2,MAIN.collection3];
  for(let i=0;i<all.length;i++){
    const c=all[i]&&all[i][id];
    if(c&&((typeof c==='number'&&c>0)||(c.count||0)>0)) return true;
  }
  return false;
}
function puzzleUnlocked(p){
  if(isCollected(p.id)) return true;
  if(p.base&&isCollected(p.base)) return true;
  const al=p.alias||[];
  for(let i=0;i<al.length;i++) if(isCollected(al[i].id)) return true;
  return false;
}

/* ================= 对局续存：页面刷新 / 版本更新不丢进度 =================
   进行中的棋盘单独存一个键，任何原因导致重新载入（首页版本检查刷新、手动刷新、
   切后台被回收）都能原样恢复；通关或主动返回名册时清除。 */
const LIVE_KEY='yueba-nonogram-live-v1';
function packCells(arr){
  let s='';
  for(let i=0;i<arr.length;i++) s+=arr[i]===1?'2':(arr[i]===0?'1':(arr[i]===2?'3':'0'));
  return s;
}
function unpackCells(str,n,fill){
  const a=new (fill===1?Uint8Array:Int8Array)(n*n);
  for(let i=0;i<n*n;i++){
    const c=str.charAt(i);
    if(fill===1) a[i]=c==='1'?1:0;
    else a[i]=c==='2'?1:(c==='1'?0:(c==='3'?2:-1));
  }
  return a;
}
function saveLive(){
  if(!G||G.done) return;
  try{
    const touched=G.base>1000||Array.prototype.some.call(G.marks,function(v){ return v!==-1; });
    if(!touched){ clearLive(); return; }
    localStorage.setItem(LIVE_KEY,JSON.stringify({
      v:1,id:G.p.id,ms:Math.round(elapsedNow()),m:G.mistakes,h:G.hintsLeft,mode:G.mode,
      marks:packCells(G.marks),seq:packCells(G.seq),hint:packCells(G.hintM)
    }));
  }catch(e){}
}
function clearLive(){
  try{ localStorage.removeItem(LIVE_KEY); }catch(e){}
}
function restoreLive(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(LIVE_KEY)||'null'); }catch(e){ d=null; }
  if(!d||d.v!==1) return false;
  const p=NP.find(function(x){ return x.id===d.id; });
  const n=p?p.sz:0;
  if(!p||typeof d.marks!=='string'||d.marks.length!==n*n){ clearLive(); return false; }
  startPuzzle(p);
  G.marks=unpackCells(d.marks,n,0);
  G.seq=unpackCells(d.seq||'',n,0);
  G.hintM=unpackCells(d.hint||'',n,1);
  if(G.marks.length!==n*n||G.seq.length!==n*n||G.hintM.length!==n*n){ clearLive(); backToCatalog(); return false; }
  G.base=Math.max(0,parseInt(d.ms,10)||0);
  G.t0=0; G.running=false;
  G.mistakes=Math.max(0,parseInt(d.m,10)||0);
  G.hintsLeft=Math.max(0,Math.min(3,parseInt(d.h,10)||0));
  G.mode=(d.mode===0||d.mode===2)?d.mode:1;
  setMode(G.mode,true);
  renderBoard();
  saveLive();
  pauseGame();
  toast(t('resumed'),2400);
  return true;
}

function dayKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayKey(){ return dayKey(new Date()); }

const B36='0123456789abcdefghijklmnopqrstuvwxyz';
function runsOf(arr){
  const out=[]; let n=0;
  for(let i=0;i<arr.length;i++){ if(arr[i]===1){n++;} else if(n){out.push(n);n=0;} }
  if(n) out.push(n);
  return out;
}
function sameClue(a,b){
  if(a.length!==b.length) return false;
  for(let i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
  return true;
}
function rowStates(p,marks,r){
  const n=p.sz, a=new Array(n);
  for(let c=0;c<n;c++) a[c]=marks[r*n+c];
  return a;
}
function colStates(p,marks,c){
  const n=p.sz, a=new Array(n);
  for(let r=0;r<n;r++) a[r]=marks[r*n+c];
  return a;
}
function clueOfStates(a){ const b=new Array(a.length); for(let i=0;i<a.length;i++) b[i]=a[i]===1?1:0; return runsOf(b); }
function buildClues(p){
  const n=p.sz, rows=[], cols=[];
  for(let r=0;r<n;r++){
    const b=new Array(n);
    for(let c=0;c<n;c++) b[c]=p.bits.charCodeAt(r*n+c)===49?1:0;
    rows.push(runsOf(b));
  }
  for(let c=0;c<n;c++){
    const b=new Array(n);
    for(let r=0;r<n;r++) b[r]=p.bits.charCodeAt(r*n+c)===49?1:0;
    cols.push(runsOf(b));
  }
  p._rows=rows; p._cols=cols;
  p._maxR=Math.max.apply(null,rows.map(function(x){return x.length;}).concat([1]));
  p._maxC=Math.max.apply(null,cols.map(function(x){return x.length;}).concat([1]));
}
const PATC=new Map();
function patterns(n,clue){
  clue=clue.filter(function(x){return x>0;});
  const key=n+'|'+clue.join(',');
  if(PATC.has(key)) return PATC.get(key);
  const L=clue.length;
  if(!L){ const a=[0]; PATC.set(key,a); return a; }
  let total=L-1;
  for(let i=0;i<L;i++) total+=clue[i];
  if(total>n){ const a=[]; PATC.set(key,a); return a; }
  const out=[];
  (function rec(i,pos,bits){
    if(i===L){ out.push(bits); return; }
    const seg=clue[i];
    let rem=0;
    for(let j=i+1;j<L;j++) rem+=clue[j];
    rem+=Math.max(0,L-i-2);
    const maxstart=n-rem-seg-(i<L-1?1:0);
    for(let st=pos;st<=maxstart;st++){
      rec(i+1,st+seg+1,bits|(((1<<seg)-1)<<st));
    }
  })(0,0,0);
  PATC.set(key,out);
  return out;
}
function stateMasks(states){
  let fill=0,cross=0;
  for(let i=0;i<states.length;i++){
    if(states[i]===1) fill|=1<<i;
    else if(states[i]===0) cross|=1<<i;
  }
  return [fill,cross];
}
function compatible(pat,fill,cross){ return (pat&cross)===0 && (fill&~pat)===0; }
function lineCands(p,kind,idx,marks){
  const n=p.sz;
  const states=kind==='r'?rowStates(p,marks,idx):colStates(p,marks,idx);
  const clue=kind==='r'?p._rows[idx]:p._cols[idx];
  const pats=patterns(n,clue);
  let f=0,x=0;
  if(kind==='r'){
    for(let c=0;c<n;c++){ const v=states[c]; if(v===1) f|=1<<c; else if(v===0) x|=1<<c; }
  }else{
    for(let r=0;r<n;r++){ const v=states[r]; if(v===1) f|=1<<r; else if(v===0) x|=1<<r; }
  }
  const out=[];
  for(let i=0;i<pats.length;i++) if(compatible(pats[i],f,x)) out.push(pats[i]);
  return out;
}
const allPatCache=new Map();
function allPatterns(p,kind,idx){
  const key=p.id+kind+idx;
  if(allPatCache.has(key)) return allPatCache.get(key);
  const n=p.sz, clue=kind==='r'?p._rows[idx]:p._cols[idx];
  const a=patterns(n,clue);
  allPatCache.set(key,a);
  return a;
}

/* ================= 音效 ================= */
let AC=null;
function audio(){
  if(S.muted) return null;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
function tone(freq,dur,type,vol,delay){
  const ac=audio(); if(!ac) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain();
    const t0=ac.currentTime+(delay||0);
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol||.05,t0+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0+dur+.02);
  }catch(e){}
}
const SFX={
  fill:function(){ tone(620,.05,'sine',.045); },
  cross:function(){ tone(380,.04,'triangle',.035); },
  tent:function(){ tone(520,.035,'triangle',.03); },
  line:function(){ tone(880,.08,'sine',.06); tone(1046,.09,'sine',.045,.05); },
  err:function(){ tone(150,.10,'sawtooth',.055); tone(110,.12,'sine',.045,.05); },
  win:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,.14,'triangle',.09,i*.08); }); },
  reveal:function(){ [1046,1318,1568,2093].forEach(function(f,i){ tone(f,.16,'sine',.06,i*.07); }); },
  click:function(){ tone(720,.04,'square',.035); }
};

function lightInk(hex){
  const m=/^#([0-9a-fA-F]{6})$/.exec(hex||'');
  if(!m) return hex;
  const r=parseInt(m[1].slice(0,2),16), g=parseInt(m[1].slice(2,4),16), b=parseInt(m[1].slice(4,6),16);
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  if(lum<=0.72) return hex;
  const k=0.72/lum;
  return 'rgb('+Math.round(r*k)+','+Math.round(g*k)+','+Math.round(b*k)+')';
}
function drawPix(cv,p){
  const n=p.sz, ctx=cv.getContext('2d');
  ctx.clearRect(0,0,n,n);
  for(let i=0;i<n*n;i++){
    if(p.bits.charCodeAt(i)!==49) continue;
    const ci=B36.indexOf(p.col.charAt(i));
    ctx.fillStyle=lightInk(p.pal[ci]||'#34384c');
    ctx.fillRect(i%n,Math.floor(i/n),1,1);
  }
}

/* ================= 线索状态 ================= */
function updateLines(silent){
  if(!G) return;
  const p=G.p,n=p.sz,easy=!!S.easy;
  const newBad=new Set();
  let allSolved=true;
  for(let r=0;r<n;r++){
    const info=lineInfo('r',r);
    if(!info.solved) allSolved=false;
    if(!info.ok) newBad.add('r'+r);
    paintClue(G.rowEls[r],info,easy);
  }
  for(let c=0;c<n;c++){
    const info=lineInfo('c',c);
    if(!info.solved) allSolved=false;
    if(!info.ok) newBad.add('c'+c);
    paintClue(G.colEls[c],info,easy);
  }
  if(easy){
    // 失误：从未解状态进入无解状态时 +1
    newBad.forEach(function(k){
      if(!G.bad.has(k)){
        G.bad.add(k);
        if(!silent){ G.mistakes++; SFX.err(); buzz(18); shakeBoard(); }
        if(!silent) updateHUD();
      }
    });
    G.bad.forEach(function(k){ if(!newBad.has(k)) G.bad.delete(k); });
  }else{
    // 非降难度：玩家自己划叉，填错不提示；整盘填满仍不对才判一次错
    G.bad.clear();
    if(!allSolved&&!G.done&&!silent&&boardFull()){
      G.mistakes++; updateHUD(); SFX.err(); buzz(18); shakeBoard();
      toast(t('fillWrong'));
    }
  }
  if(allSolved&&!G.done) finish();
}
function boardFull(){
  if(!G) return false;
  for(let i=0;i<G.marks.length;i++) if(G.marks[i]===-1||G.marks[i]===2) return false;
  return true;
}
function lineInfo(kind,idx){
  const p=G.p,n=p.sz;
  const states=kind==='r'?rowStates(p,G.marks,idx):colStates(p,G.marks,idx);
  const clue=kind==='r'?p._rows[idx]:p._cols[idx];
  const cands=lineCands(p,kind,idx,G.marks);
  const solved=sameClue(clueOfStates(states),clue);
  return {solved:solved,ok:cands.length>0,count:cands.length,cands:cands};
}
function paintClue(el,info,showBad){
  if(!el) return;
  el.classList.toggle('done',info.solved);
  el.classList.toggle('bad',!!showBad&&!info.ok);
}
let _shakeT=0;

/* ================= 计时 ================= */
function elapsedNow(){
  if(!G) return 0;
  if(G.running&&G.t0) return G.base+(performance.now()-G.t0);
  return G.base;
}
function startTimer(){
  if(!G||G.running||G.done) return;
  G.running=true; G.t0=performance.now();
  G.tick=setInterval(function(){
    $('pTime').textContent=fmtTime(elapsedNow());
  },500);
}
function pauseTimer(){
  if(!G||!G.running) return;
  G.base+=performance.now()-G.t0;
  G.t0=0; G.running=false;
  clearInterval(G.tick); G.tick=null;
}
function stopTimer(){
  if(!G) return;
  if(G.running) pauseTimer();
  clearInterval(G.tick); G.tick=null;
}

let STROKE=null;

function paintCell(i,val,nseq){
  if(!G||G.done||G.paused) return false;
  if(G.marks[i]===val) return false;
  const from=G.marks[i];
  const fs=G.seq[i];
  G.marks[i]=val;
  G.seq[i]=(nseq===undefined)?seqOfVal(val):nseq;
  if(!G.hintM[i]||val!==1) G.hintM[i]=0;
  STROKE.changes.push({i:i,from:from,to:val,fs:fs});
  applyCell(G.cellEls[i],i,val,true);
  if(val===1) SFX.fill(); else if(val===0) SFX.cross(); else if(val===2) SFX.tent(); else SFX.click();
  return true;
}
/* 点击：涂上当前笔刷；同一格再次点击则消除
   seq 记录该格的进度：0 未点过 / 1 刚填涂 / 2 刚清空 / 3 刚打叉 / 4 刚待选 */
function seqOfVal(v){ return v===1?1:(v===0?3:(v===2?4:0)); }
function tapNextSeq(val){ return val===1?1:(val===0?3:(val===2?4:2)); }
function tapNextValue(from){ return from===G.mode?-1:G.mode; }
function cellFromPoint(x,y){
  const rect=$('grid').getBoundingClientRect();
  if(x<rect.left||y<rect.top||x>=rect.right||y>=rect.bottom) return -1;
  const n=G.p.sz;
  const c=Math.floor((x-rect.left)/(rect.width/n));
  const r=Math.floor((y-rect.top)/(rect.height/n));
  if(r<0||c<0||r>=n||c>=n) return -1;
  return r*n+c;
}
function beginStroke(i,reverse,desktop,pid,px,py){
  if(!G||G.done||G.paused) return;
  markStart();
  const from=G.marks[i];
  STROKE={changes:[],reverse:!!reverse,erase:false,origin:i,from:from,moved:false,desktop:!!desktop,tapVal:null,pid:pid,px:px,py:py};
  if(desktop){
    /* 电脑鼠标：左键使用当前笔刷（涂黑 / 打叉 / 待选），再次点击同一格则取消；
       右键固定为「打叉 / 取消」。起手是取消时，拖动整段都按取消处理。 */
    const val=reverse?(from===0?-1:0):(from===G.mode?-1:G.mode);
    STROKE.tapVal=val;
    paintCell(i,val);
    return;
  }
  if(STROKE.reverse){
    paintCell(i,-1);
  }else{
    const val=tapNextValue(from);
    // 起手格已是当前笔刷 → 整段滑动都按消除处理，可连续擦除
    if(val===-1) STROKE.erase=true;
    paintCell(i,val,tapNextSeq(val));
  }
}
function endStroke(){
  if(!STROKE) return;
  const rec=STROKE; STROKE=null;
  if(!rec.changes.length) return;
  autoCross(rec);
  G.undo.push(rec.changes);
  if(G.undo.length>50) G.undo.shift();
  updateLines(false);
  updateHUD();
  saveLive();
}
function autoCross(rec){
  if(!S.easy||!S.autoCross||!G||G.done) return;
  const p=G.p,n=p.sz;
  for(let r=0;r<n;r++){
    if(!sameClue(clueOfStates(rowStates(p,G.marks,r)),p._rows[r])) continue;
    for(let c=0;c<n;c++){
      const i=r*n+c;
      if(G.marks[i]===-1||G.marks[i]===2){ const from=G.marks[i], fs=G.seq[i]; G.marks[i]=0; G.seq[i]=3; rec.changes.push({i:i,from:from,to:0,fs:fs}); applyCell(G.cellEls[i],i,0,false); }
    }
  }
  for(let c=0;c<n;c++){
    const states=colStates(p,G.marks,c);
    if(!sameClue(clueOfStates(states),p._cols[c])) continue;
    for(let r=0;r<n;r++){
      const i=r*n+c;
      if(G.marks[i]===-1||G.marks[i]===2){ const from=G.marks[i], fs=G.seq[i]; G.marks[i]=0; G.seq[i]=3; rec.changes.push({i:i,from:from,to:0,fs:fs}); applyCell(G.cellEls[i],i,0,false); }
    }
  }
}
function undo(){
  if(!G||G.done||G.paused) return;
  const rec=G.undo.pop();
  if(!rec||!rec.length){ toast(t('none')); return; }
  for(let k=rec.length-1;k>=0;k--){
    const ch=rec[k];
    G.marks[ch.i]=ch.from;
    G.seq[ch.i]=(ch.fs===undefined)?seqOfVal(ch.from):ch.fs;
    if(ch.from!==1) G.hintM[ch.i]=0;
    applyCell(G.cellEls[ch.i],ch.i,ch.from,false);
  }
  SFX.click();
  G.bad=new Set();
  updateLines(true);
  updateHUD();
  saveLive();
}
function clearBoard(){
  if(!G||G.done||G.paused) return;
  const rec=[];
  for(let i=0;i<G.marks.length;i++){
    if(G.marks[i]!==-1){
      rec.push({i:i,from:G.marks[i],to:-1,fs:G.seq[i]});
      G.marks[i]=-1;
      G.seq[i]=0;
      G.hintM[i]=0;
      applyCell(G.cellEls[i],i,-1,false);
    }
  }
  if(rec.length){
    G.undo.push(rec);
    if(G.undo.length>50) G.undo.shift();
  }
  G.bad=new Set();
  updateLines(true);
  updateHUD();
  saveLive();
  toast(t('cleared'));
  SFX.click();
}
function useHint(){
  if(!G||G.done||G.paused) return;
  if(G.hintsLeft<=0){ toast(t('hintOut')); return; }
  const p=G.p,n=p.sz;
  let forced=[];
  // 先找唯一排布的线
  for(let r=0;r<n&&!forced.length;r++){
    const info=lineInfo('r',r);
    if(info.solved||!info.ok) continue;
    if(info.cands.length===1){
      const pat=info.cands[0];
      for(let c=0;c<n;c++){
        if(((pat>>c)&1)&&G.marks[r*n+c]===-1) forced.push(r*n+c);
      }
    }
  }
  for(let c=0;c<n&&!forced.length;c++){
    const info=lineInfo('c',c);
    if(info.solved||!info.ok) continue;
    if(info.cands.length===1){
      const pat=info.cands[0];
      for(let r=0;r<n;r++){
        if(((pat>>r)&1)&&G.marks[r*n+c]===-1) forced.push(r*n+c);
      }
    }
  }
  // 再找所有排布共同格
  if(!forced.length){
    let best=[];
    for(let r=0;r<n;r++){
      const info=lineInfo('r',r);
      if(info.solved||!info.ok||!info.cands.length) continue;
      let andv=(1<<n)-1;
      info.cands.forEach(function(pt){ andv&=pt; });
      const cells=[];
      for(let c=0;c<n;c++) if(((andv>>c)&1)&&G.marks[r*n+c]===-1) cells.push(r*n+c);
      if(cells.length>best.length) best=cells;
    }
    for(let c=0;c<n;c++){
      const info=lineInfo('c',c);
      if(info.solved||!info.ok||!info.cands.length) continue;
      let andv=(1<<n)-1;
      info.cands.forEach(function(pt){ andv&=pt; });
      const cells=[];
      for(let r=0;r<n;r++) if(((andv>>r)&1)&&G.marks[r*n+c]===-1) cells.push(r*n+c);
      if(cells.length>best.length) best=cells;
    }
    forced=best;
  }
  if(!forced.length){ toast(t('hintNone')); return; }
  markStart();
  const rec=[];
  forced.forEach(function(i){
    const from=G.marks[i];
    if(from!==-1) return;
    const fs=G.seq[i];
    G.marks[i]=1; G.seq[i]=1; G.hintM[i]=1;
    rec.push({i:i,from:from,to:1,fs:fs});
    applyCell(G.cellEls[i],i,1,true);
  });
  if(!rec.length){ toast(t('hintNone')); return; }
  G.hintsLeft--;
  autoCross({changes:rec});
  G.undo.push(rec);
  if(G.undo.length>50) G.undo.shift();
  G.bad=new Set();
  updateLines(true);
  updateHUD();
  saveLive();
  SFX.line();
}

function startPuzzle(p){

/* ================= 解救成功：棋盘 → 立绘 ================= */
let RVT1=0, RVT2=0, RVT3=0, RVSEQ=0;
function cancelReveal(){
  RVSEQ++;
  clearTimeout(RVT1); clearTimeout(RVT2); clearTimeout(RVT3);
  const rv=$('reveal'); if(rv) rv.classList.remove('show');
}
function revealPuzzle(p,done){
  const rv=$('reveal'), stage=$('rvStage');
  if(!rv||!stage){ done(); return; }
  clearTimeout(RVT1); clearTimeout(RVT2); clearTimeout(RVT3);
  const seq=++RVSEQ;
  const n=p.sz, c0=(n-1)/2;
  stage.style.setProperty('--n',n);
  const gr=$('grid');
  if(gr){
    const w=Math.round(gr.getBoundingClientRect().width);
    if(w>120) stage.style.width=Math.min(340,Math.max(190,w))+'px';
  }
  let cells='';
  for(let i=0;i<n*n;i++){
    let bg='#fbfbfe';
    if(p.bits.charCodeAt(i)===49){
      const ci=B36.indexOf(p.col.charAt(i));
      bg=lightInk(p.pal[ci]||'#34384c');
    }
    const d=Math.abs(i%n-c0)+Math.abs(Math.floor(i/n)-c0);
    cells+='<i style="background:'+bg+';--d:'+(150+Math.round(d*20))+'ms"></i>';
  }
  stage.innerHTML='<div class="rvboard">'+cells+'</div>'
    +'<div class="rvart"><canvas class="rvpix" width="'+n+'" height="'+n+'"></canvas>'
    +'<img class="rvimg" alt=""></div>'
    +'<div class="rvflash"></div><div class="rvring"></div><div class="rvring b"></div>';
  const pix=stage.querySelector('.rvpix');
  if(pix) drawPix(pix,p);
  const im=stage.querySelector('.rvimg');
  if(im){
    im.addEventListener('load',function(){ im.classList.add('ok'); },{once:true});
    im.addEventListener('error',function(){ im.remove(); },{once:true});
    im.src=p.img;
    if(im.complete&&im.naturalWidth>0) im.classList.add('ok');
  }
  rv.classList.add('show');
  RVT1=setTimeout(function(){
    if(seq!==RVSEQ) return;
    SFX.reveal(); buzz(30);
  },520);
  RVT3=setTimeout(function(){
    if(seq!==RVSEQ) return;
    particles();
  },860);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  RVT2=setTimeout(function(){
    if(seq!==RVSEQ) return;
    rv.classList.remove('show');
    RVT2=setTimeout(function(){ if(seq===RVSEQ) done(); },340);
  },(S.lowPower||reduce)?800:1500);
}
function finish(){
  if(!G||G.done) return;
  G.done=true;
  clearLive();
  stopTimer();
  // 待选格统一落定为打叉，避免通关后仍留浅色标记
  for(let i=0;i<G.marks.length;i++){
    if(G.marks[i]===2){ G.marks[i]=0; G.seq[i]=3; applyCell(G.cellEls[i],i,0,false); }
  }
  const p=G.p, ms=Math.max(0,Math.round(G.base)), m=G.mistakes, h=3-G.hintsLeft;
  const stars=starsFor(p,ms,m,h);
  const prev=S.solved[p.id];
  const first=!prev;
  const oldBest=prev?prev.t:0;
  const rec={t:prev?Math.min(prev.t,ms):ms,m:prev?Math.min(prev.m,m):m,h:prev?Math.min(prev.h,h):h,s:prev?Math.max(prev.s,stars):stars,d:prev?prev.d:todayKey()};
  if(!prev) rec.d=todayKey();
  S.solved[p.id]=rec;
  S.plays++; S.totalMs+=ms;
  saveGame();
  unlockAchievements(p,ms,m,h);
  saveGame();
  renderStats();
  // 棋盘显影脉冲
  const n=p.sz, cx=(n-1)/2, cy=(n-1)/2;
  $('grid').classList.add('win');
  for(let i=0;i<n*n;i++){
    const el=G.cellEls[i]; if(!el) continue;
    if(G.marks[i]===1){
      const d=Math.abs(i%n-cx)+Math.abs(Math.floor(i/n)-cy);
      el.style.setProperty('--d',Math.round(d*26)+'ms');
    }
  }
  SFX.win(); buzz(40);
  setTimeout(function(){
    if(!G||G.p!==p) return;
    revealPuzzle(p,function(){
      showResult({mode:'win',p:p,ms:ms,m:m,h:h,stars:stars,first:first,
        newBest:!!(oldBest&&ms<oldBest)});
    });
  },300);
}

/* ================= 指针 / 键盘 ================= */
function bindBoard(){
  const grid=$('grid');
  grid.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  /* 右键（或触屏长按）起手后拖到棋盘外再松手时，系统菜单会弹到游戏界面之外。
     在起手后的一小段时间内整页拦截 contextmenu，保证右键手势不会“出界”。 */
  let ctxGuard=0;
  window.addEventListener('contextmenu',function(e){
    if(grid.contains(e.target)||STROKE||(ctxGuard&&Date.now()-ctxGuard<2500)){
      e.preventDefault();
      ctxGuard=0;
    }
  },true);
  // 在棋盘外松手也能正常结束本次笔画，避免标记跟着指针乱跑
  window.addEventListener('pointerup',function(e){
    if(ctxGuard) ctxGuard=Date.now();
    if(STROKE&&e.pointerId===STROKE.pid) endStroke();
  },false);
  grid.addEventListener('pointerdown',function(e){
    if(!G||G.done||G.paused) return;
    if(e.button!==undefined&&e.button!==0&&e.button!==2) return;
    const i=cellFromPoint(e.clientX,e.clientY);
    if(i<0) return;
    e.preventDefault();
    try{ grid.setPointerCapture(e.pointerId); }catch(err){}
    const reverse=(e.button===2)||e.shiftKey;
    if(e.button===2||e.pointerType!=='mouse') ctxGuard=Date.now();
    // 只保留一个活动笔画：多指/误触的第二次按下先结算上一次，避免串到相邻格
    if(STROKE) endStroke();
    beginStroke(i,reverse,e.pointerType!=='touch',e.pointerId,e.clientX,e.clientY);
    LONG_FIRED=false;
    clearTimeout(LONG_T);
    if(!reverse&&e.pointerType!=='mouse'){
      LONG_T=setTimeout(function(){
        if(!STROKE||STROKE.pid!==e.pointerId) return;
        LONG_FIRED=true;
        STROKE.reverse=true;
        const val=-1;
        // 撤销按下时已经涂上的笔刷，长按统一按消除处理
        const changes=STROKE.changes;
        if(changes.length){
          const ch=changes[0];
          if(ch.to===G.mode){
            G.marks[ch.i]=ch.from;
            G.seq[ch.i]=ch.fs;
            applyCell(G.cellEls[ch.i],ch.i,ch.from,false);
            changes.length=0;
          }
        }
        paintCell(i,val);
        buzz(10);
      },350);
    }
  });
  grid.addEventListener('pointermove',function(e){
    if(!STROKE||e.pointerId!==STROKE.pid||!G||G.done||G.paused) return;
    e.preventDefault();
    // 轻微抖动不取消长按，手指明显移动后才取消，长按后继续拖动可连续消除
    if(!LONG_FIRED&&e.pointerType!=='mouse'&&STROKE.px!=null){
      const dx=e.clientX-STROKE.px, dy=e.clientY-STROKE.py;
      if(dx*dx+dy*dy>64) clearTimeout(LONG_T);
    }
    const i=cellFromPoint(e.clientX,e.clientY);
    if(i<0) return;
    if(i!==STROKE.origin&&!STROKE.moved) STROKE.moved=true;
    paintCell(i,STROKE.desktop?STROKE.tapVal:((STROKE.reverse||STROKE.erase)?-1:G.mode));
  });
  function up(e){
    clearTimeout(LONG_T);
    if(!STROKE||e.pointerId!==STROKE.pid) return;
    // 触屏纯点击（没拖到别的格子）：涂上当前笔刷，或再点一次取消；电脑按下时已落子
    if(!STROKE.moved&&!STROKE.reverse&&!LONG_FIRED&&!STROKE.desktop){
      const val=tapNextValue(STROKE.from);
      paintCell(STROKE.origin,val,tapNextSeq(val));
    }
    endStroke();
  }
  grid.addEventListener('pointerup',up);
  grid.addEventListener('pointercancel',up);
  grid.addEventListener('pointerleave',function(e){ /* 不结束，拖出再拖回仍连续 */ });
  // 光标
  document.addEventListener('keydown',function(e){
    if(!G||G.paused||G.done) return;
    if($('set').classList.contains('show')||$('ach').classList.contains('show')||$('result').classList.contains('show')||$('help').classList.contains('show')) return;
    const n=G.p.sz;
    let r=Math.floor(CURSOR/n), c=CURSOR%n;
    let handled=true;
    if(e.key==='ArrowLeft') c=Math.max(0,c-1);
    else if(e.key==='ArrowRight') c=Math.min(n-1,c+1);
    else if(e.key==='ArrowUp') r=Math.max(0,r-1);
    else if(e.key==='ArrowDown') r=Math.min(n-1,r+1);
    else if(e.key===' '||e.key==='Spacebar'){
      e.preventDefault(); markStart();
      STROKE={changes:[],reverse:false};
      paintCell(r*n+c,1); endStroke();
      return;
    }else if(e.key==='x'||e.key==='X'){
      STROKE={changes:[],reverse:false};
      paintCell(r*n+c,0); endStroke();
      return;
    }else if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); undo(); return; }
    else if(e.key==='h'||e.key==='H'){ useHint(); return; }
    else if(e.key==='Escape'){ togglePause(); return; }
    else handled=false;
    if(!handled) return;
    e.preventDefault();
    const old=G.cellEls[CURSOR];
    if(old) old.classList.remove('cur');
    CURSOR=r*n+c;
    G.cellEls[CURSOR].classList.add('cur');
    if(e.key===' '||e.key==='x'||e.key==='X'){}
  });
  // 点击格：把光标也移过去
  grid.addEventListener('pointerup',function(e){
    if(!G||G.done) return;
    const i=cellFromPoint(e.clientX,e.clientY);
    if(i>=0){ if(G.cellEls[CURSOR]) G.cellEls[CURSOR].classList.remove('cur'); CURSOR=i; }
  });
}

/* ================= 暂停 ================= */
function togglePause(){
  if(!G||G.done) return;
  if(G.paused) resumeGame(); else pauseGame();
}
function pauseGame(){
  if(!G||G.done||G.paused) return;
  G.paused=true;
  pauseTimer();
  saveLive();
  $('pause').classList.add('show');
}
function resumeGame(){
  if(!G||!G.paused) return;
  G.paused=false;
  $('pause').classList.remove('show');
  if(!G.done) startTimer();
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    if(G&&!G.done&&!G.paused) pauseGame();
  }
});
window.addEventListener('pagehide',function(){
  stopTimer();
  saveLive();     /* 刷新/版本更新前把当前棋盘落盘，重载后可续玩 */
  try{ if(AC&&AC.state==='running') AC.suspend(); }catch(e){}
});

  if(S.lowPower) return;
  const box=$('fx');

/* ================= 自检 ================= */
function selftest(){
  const errs=[];
  if(NP.length!==110) errs.push('NP='+NP.length);
  let aliasCount=0;
  NP.forEach(function(p){
    aliasCount+=1+(p.alias?p.alias.length:0);
    if(p.bits.length!==p.sz*p.sz) errs.push(p.id+' bits');
    if(p.col.length!==p.sz*p.sz) errs.push(p.id+' col');
    if(!p._rows) buildClues(p);
    if(p._rows.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' row clue');
    if(p._cols.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' col clue');
    for(let i=0;i<p.sz*p.sz;i++){
      if(p.bits.charCodeAt(i)===49){
        const ci=B36.indexOf(p.col.charAt(i));
        if(ci<0||ci>=p.pal.length) errs.push(p.id+' colidx@'+i);
      }
    }
  });
  if(aliasCount!==111) errs.push('ids='+aliasCount);
  // 线解算器干跑：官方解必须全部满足、且不出现无解线
  NP.forEach(function(p){
    const n=p.sz;
    const marks=new Int8Array(n*n);
    for(let i=0;i<n*n;i++) marks[i]=p.bits.charCodeAt(i)===49?1:0;
    for(let r=0;r<n;r++){
      if(!sameClue(clueOfStates(rowStates(p,marks,r)),p._rows[r])) errs.push(p.id+' row'+r);
    }
    for(let c=0;c<n;c++){
      if(!sameClue(clueOfStates(colStates(p,marks,c)),p._cols[c])) errs.push(p.id+' col'+c);
    }
  });
  const msg=errs.length?t('selftestFail',{s:errs.slice(0,4).join(', ')}):t('selftestOk');
  console.log('[nonogram selftest]',msg,errs);
  toast(msg);
  return errs;
}

  renderChips();
  refreshCatalog();
  renderSettings();

  $('btnAch').onclick=function(){ renderAch(); $('ach').classList.add('show'); SFX.click(); };
  $('achClose').onclick=function(){ $('ach').classList.remove('show'); };
  $('ach').onclick=function(e){ if(e.target===$('ach')) $('ach').classList.remove('show'); };
  $('btnHelp').onclick=function(){ $('help').classList.add('show'); SFX.click(); };
  $('helpClose').onclick=function(){ $('help').classList.remove('show'); };
  $('help').onclick=function(e){ if(e.target===$('help')) $('help').classList.remove('show'); };
  $('btnSet').onclick=function(){ renderSettings(); $('set').classList.add('show'); SFX.click(); };
  $('btnBack').onclick=function(){ SFX.click(); backToCatalog(); };
  $('btnPause').onclick=function(){ SFX.click(); togglePause(); };
  $('pauseResume').onclick=function(){ SFX.click(); resumeGame(); };
  $('pauseBack').onclick=function(){ backToCatalog(); };
  $('modeFill').onclick=function(){ setMode(1); };
  $('modeCross').onclick=function(){ setMode(0); };
  $('modeTent').onclick=function(){ setMode(2); };
  $('btnUndo').onclick=function(){ undo(); };
  $('btnClear').onclick=function(){ clearBoard(); };
  $('btnHint').onclick=function(){ useHint(); };
  $('btnEasy').onclick=function(){
    S.easy=!S.easy; saveGame();
    syncEasyBtn();
    SFX.click();
    toast(S.easy?t('easyOn'):t('easyOff'),2200);
    if(G&&!G.done){ G.bad=new Set(); updateLines(true); updateHUD(); }
  };
  $('tabs').addEventListener('click',function(e){
    const b=e.target.closest('[data-tab]'); if(!b) return;
    setTab(b.getAttribute('data-tab')); SFX.click();
  });
  $('hero').addEventListener('click',function(e){
    const b=e.target.closest('[data-pid]'); if(!b) return;
    const p=NP.find(function(x){ return x.id===b.getAttribute('data-pid'); }); if(!p) return;
    if(!puzzleUnlocked(p)){ toast(t('lockedTip'),2800); return; }
    SFX.click();
    if(S.solved[p.id]) showResult({mode:'detail',p:p});
    else startPuzzle(p);
  });
  $('chips').addEventListener('click',function(e){
    const b=e.target.closest('[data-filter]'); if(!b) return;
    filter=b.getAttribute('data-filter'); SFX.click();
    renderChips(); renderCatalog();
  });
  $('catalog').addEventListener('click',function(e){
    const card=e.target.closest('.card'); if(!card) return;
    const pid=card.getAttribute('data-pid');
    const p=NP.find(function(x){ return x.id===pid; }); if(!p) return;
    SFX.click();
    if(card.getAttribute('data-lock')==='1'){
      toast(t('lockedTip'),2800);
      card.classList.remove('deny');
      void card.offsetWidth;
      card.classList.add('deny');
      setTimeout(function(){ card.classList.remove('deny'); },400);
      return;
    }
    if(S.solved[p.id]) showResult({mode:'detail',p:p});
    else startPuzzle(p);
  });
  bindBoard(); bindSettings();
  layoutBoard();
  window.addEventListener('resize',function(){
    if(G&&!G.done){ layoutBoard(); }
  });
  window.addEventListener('orientationchange',function(){ setTimeout(layoutBoard,220); });
  /* 刷新或首页自动更新后重开页面：把上一次进行中的棋盘原样接回来（暂停态，点继续即可） */
  if(QS.get('selftest')!=='1') restoreLive();
  if(QS.get('selftest')==='1') setTimeout(selftest,120);
  // 暴露给自动化测试
  window.__NP_TEST={NP:NP,patterns:patterns,buildClues:buildClues,sameClue:sameClue,
    clueOfStates:clueOfStates,rowStates:rowStates,colStates:colStates,S:S,startPuzzle:startPuzzle,finish:finish,selftest:selftest};
  window.__NP_STATE=function(){ return G?(G.done?'win':(G.paused?'pause':'play')):'catalog'; };
}
init();
})();
