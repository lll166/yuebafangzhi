      if(sc[a]&&sc[a].length){
        const ca=[],cb=[];
        for(let r=0;r<n;r++){ ca.push(st[r][a]); cb.push(st[r][a+1]); }
        const res=megaPairs(n,p._cols[a],p._cols[a+1],sc[a],ca,cb,v2); if(!res) return empty;
        const chA=apply(ca,res[0],res[1]), chB=apply(cb,res[2],res[3]);
        if(chA){ for(let r=0;r<n;r++) st[r][a]=ca[r]; changed=true; }

    const i=r*n+c, v=marks[i];

    if(st[r][c]===1) fill.push(i);
    else if(st[r][c]===0) cross.push(i);
  }
  return {fill:fill,cross:cross};
}
/* v3 联合传播：行线索放宽（超级块那一段不计入小线索）+ 行带枚举 + 列常规交集 */
function megaDeduceV3(p,marks){
  const n=p.sz, empty={fill:[],cross:[]};
  const st=[];
  for(let r=0;r<n;r++){
    const row=[];
    for(let c=0;c<n;c++){ const v=marks[r*n+c]; row.push(v===1?1:(v===0?0:-1)); }
    st.push(row);
  }
  const apply=function(states,andm,orm){ let ch=false;
    for(let i=0;i<n;i++){
      if(((andm>>i)&1)&&states[i]!==1){ states[i]=1; ch=true; }
      else if(!((orm>>i)&1)&&states[i]!==0){ states[i]=0; ch=true; }
    }
    return ch;
  };
  const sr=p._sr||[], sc=p._sc||[];
  for(let loop=0;loop<400;loop++){
    let changed=false;
    for(let r=0;r<n;r++){
      let d;
      if(v3AllowRow(p,r)){
        const cd=rowCandsV3(n,p._rows[r],st[r],true);
        if(!cd.length) return empty;
        let a=0,o=0;
        for(let k=0;k<cd.length;k++){ if(!k){ a=cd[k]; o=cd[k]; } else{ a&=cd[k]; o|=cd[k]; } }
        d=[a,o];
      }else{
        d=deduceLine(n,p._rows[r],st[r]); if(!d) return empty;
      }
      if(apply(st[r],d[0],d[1])) changed=true;
    }
    for(let c=0;c<n;c++){
      const col=[]; for(let r=0;r<n;r++) col.push(st[r][c]);
      const d=deduceLine(n,p._cols[c],col); if(!d) return empty;
      if(apply(col,d[0],d[1])){ for(let r=0;r<n;r++) st[r][c]=col[r]; changed=true; }
    }
    for(let a=0;a<n-1;a++){
      const want=sr[a]||[];
      const res=v3Pairs(n,p._rows[a],p._rows[a+1],st[a],st[a+1],want,
                        v3AllowRow(p,a),v3AllowRow(p,a+1),want.length>0);
      if(!res) return empty;
      if(apply(st[a],res[0],res[1])) changed=true;
      if(apply(st[a+1],res[2],res[3])) changed=true;
      if(sc[a]&&sc[a].length){
        const ca=[],cb=[];
        for(let r=0;r<n;r++){ ca.push(st[r][a]); cb.push(st[r][a+1]); }
        const rr=megaPairs(n,p._cols[a],p._cols[a+1],sc[a],ca,cb,true); if(!rr) return empty;
        const chA=apply(ca,rr[0],rr[1]), chB=apply(cb,rr[2],rr[3]);
        if(chA){ for(let r=0;r<n;r++) st[r][a]=ca[r]; changed=true; }
        if(chB){ for(let r=0;r<n;r++) st[r][a+1]=cb[r]; changed=true; }
      }
    }
    if(!changed) break;
  }
  const fill=[],cross=[];
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    const i=r*n+c, v=marks[i];
    if(v!==-1&&v!==2) continue;
    if(st[r][c]===1) fill.push(i);
    else if(st[r][c]===0) cross.push(i);
  }
  return {fill:fill,cross:cross};
}

/* ================= 计时 ================= */
function elapsedNow(){
  if(!G) return 0;
  if(G.running&&G.t0) return G.base+(performance.now()-G.t0);
  return G.base;
}
function startTimer(){
  if(!G||G.running||G.done) return;
  G.running=true; G.t0=performance.now();
  G.tick=setInterval(function(){
    $('pTime').textContent=fmtTime(elapsedNow());
  },500);
}
function pauseTimer(){
  if(!G||!G.running) return;
  G.base+=performance.now()-G.t0;
  G.t0=0; G.running=false;
  clearInterval(G.tick); G.tick=null;
}
function stopTimer(){
  if(!G) return;
  if(G.running) pauseTimer();
  clearInterval(G.tick); G.tick=null;
}

let STROKE=null;
let LONG_T=null, LONG_FIRED=false;
function markStart(){

function paintCell(i,val,nseq){
  if(!G||G.done||G.paused) return false;
  if(G.marks[i]===val) return false;
  const from=G.marks[i];
  const fs=G.seq[i];
  G.marks[i]=val;
  G.seq[i]=(nseq===undefined)?seqOfVal(val):nseq;
  if(!G.hintM[i]||val!==1) G.hintM[i]=0;
  if(G.wrongM[i]) G.wrongM[i]=0;
  STROKE.changes.push({i:i,from:from,to:val,fs:fs});
  if(val===1) G.lastCell=i;
  if($('grid').classList.contains('scan-in')) clearScanIn();
  applyCell(G.cellEls[i],i,val,true);
  if(val===1) SFX.fill(); else if(val===0) SFX.cross(); else if(val===2) SFX.tent(); else SFX.click();
  return true;
}
/* 点击：涂上当前笔刷；同一格再次点击则消除

function seqOfVal(v){ return v===1?1:(v===0?3:(v===2?4:0)); }
function tapNextSeq(val){ return val===1?1:(val===0?3:(val===2?4:2)); }
function tapNextValue(from){ return from===G.mode?-1:G.mode; }
function cellFromPoint(x,y){
  const rect=$('grid').getBoundingClientRect();
  if(x<rect.left||y<rect.top||x>=rect.right||y>=rect.bottom) return -1;
  const n=G.p.sz;
  const c=Math.floor((x-rect.left)/(rect.width/n));
  const r=Math.floor((y-rect.top)/(rect.height/n));
  if(r<0||c<0||r>=n||c>=n) return -1;
  return r*n+c;
}
function beginStroke(i,reverse,desktop,pid,px,py){
  if(!G||G.done||G.paused) return;
  markStart();
  const from=G.marks[i];
  STROKE={changes:[],reverse:!!reverse,erase:false,origin:i,from:from,moved:false,desktop:!!desktop,tapVal:null,pid:pid,px:px,py:py};
  if(desktop){
    /* 电脑鼠标：左键使用当前笔刷（涂黑 / 打叉 / 待选），再次点击同一格则取消；
       右键固定为「打叉 / 取消」。起手是取消时，拖动整段都按取消处理。 */
    const val=reverse?(from===0?-1:0):(from===G.mode?-1:G.mode);
    STROKE.tapVal=val;
    paintCell(i,val);
    return;
  }
  if(STROKE.reverse){

  }else{
    const val=tapNextValue(from);
    // 起手格已是当前笔刷 → 整段滑动都按消除处理，可连续擦除
    if(val===-1) STROKE.erase=true;
    paintCell(i,val,tapNextSeq(val));
  }
}
function endStroke(){
  if(!STROKE) return;
  const rec=STROKE; STROKE=null;
  if(!rec.changes.length) return;
  autoCross(rec);
  G.undo.push(rec.changes);
  if(G.undo.length>50) G.undo.shift();
  updateLines(false);
  updateHUD();
  saveLive();
}
function autoCross(rec){
  if(!S.easy||!S.autoCross||!G||G.done) return;
  const p=G.p,n=p.sz;
  for(let r=0;r<n;r++){
    /* v3：超级行的小线索不含超级块格子，整行线索先满足并不代表该行已填完 */
    if(p.v===3&&v3AllowRow(p,r)) continue;
    if(!sameClue(clueOfStates(rowStates(p,G.marks,r)),p._rows[r])) continue;
    for(let c=0;c<n;c++){
      const i=r*n+c;
      if(G.marks[i]===-1||G.marks[i]===2){
        const from=G.marks[i], fs=G.seq[i];
        G.marks[i]=0; G.seq[i]=3;
        rec.changes.push({i:i,from:from,to:0,fs:fs});
        applyCell(G.cellEls[i],i,0,false);
        FX.play(G.cellEls[i],'fx-autocross',190,70+c*8,'--ad');
      }
    }
  }
  for(let c=0;c<n;c++){
    const states=colStates(p,G.marks,c);
    if(!sameClue(clueOfStates(states),p._cols[c])) continue;
    for(let r=0;r<n;r++){
      const i=r*n+c;
      if(G.marks[i]===-1||G.marks[i]===2){
        const from=G.marks[i], fs=G.seq[i];
        G.marks[i]=0; G.seq[i]=3;
        rec.changes.push({i:i,from:from,to:0,fs:fs});
        applyCell(G.cellEls[i],i,0,false);
        FX.play(G.cellEls[i],'fx-autocross',190,70+r*8,'--ad');
      }
    }
  }
}
function undo(){
  if(!G||G.done||G.paused) return;
  const rec=G.undo.pop();
  if(!rec||!rec.length){ toast(t('none')); return; }
  for(let k=rec.length-1;k>=0;k--){
    const ch=rec[k];
    G.marks[ch.i]=ch.from;
    G.seq[ch.i]=(ch.fs===undefined)?seqOfVal(ch.from):ch.fs;
    if(ch.from!==1) G.hintM[ch.i]=0;
    if(G.wrongM[ch.i]) G.wrongM[ch.i]=0;
    FX.clear(G.cellEls[ch.i]);
    applyCell(G.cellEls[ch.i],ch.i,ch.from,false);
    FX.play(G.cellEls[ch.i],'fx-undo',140);
  }
  SFX.click();
  G.bad=new Set();
  updateLines(true);
  updateHUD();
  saveLive();
}
function clearBoard(){
  if(!G||G.done||G.paused) return;
  const rec=[];
  for(let i=0;i<G.marks.length;i++){
    if(G.marks[i]!==-1){
      rec.push({i:i,from:G.marks[i],to:-1,fs:G.seq[i]});
      G.marks[i]=-1;
      G.seq[i]=0;
      G.hintM[i]=0;
      G.wrongM[i]=0;
      FX.clear(G.cellEls[i]);
      applyCell(G.cellEls[i],i,-1,false);
    }
  }
  if(rec.length){
    G.undo.push(rec);
    if(G.undo.length>50) G.undo.shift();
    scanBoard();
  }
  G.bad=new Set();
  updateLines(true);
  updateHUD();
  saveLive();
  toast(t('cleared'));
  SFX.click();
}
function useHint(){
  if(!G||G.done||G.paused) return;
  if(G.hintsLeft<=0){ toast(t('hintOut')); return; }
  const p=G.p,n=p.sz;
  /* 玩家已经填错/划错时，提示优先把错误格标红（消耗 1 次） */
  const wrong=[];
  for(let i=0;i<n*n;i++){
    const v=G.marks[i];
    if(v===1&&p.bits.charAt(i)==='0') wrong.push(i);
    else if(v===0&&p.bits.charAt(i)==='1') wrong.push(i);
  }
  if(wrong.length){
    for(let k=0;k<wrong.length;k++){
      const el=G.cellEls[wrong[k]];
      if(!el) continue;
      G.wrongM[wrong[k]]=1;
      applyCell(el,wrong[k],G.marks[wrong[k]],false);
      FX.play(el,'fx-hint',380,Math.min(k*30,180),'--hd');
    }
    G.hintsLeft--;
    updateHUD();
    saveLive();
    SFX.err();
    toast(t('hintWrong',{n:wrong.length}),2200);
    return;
  }
  let forced=[],forcedX=[];
  // 先找唯一排布的线
  for(let r=0;r<n&&!forced.length;r++){
    const info=lineInfo('r',r);
    if(info.solved||!info.ok) continue;
    if(info.cands.length===1){
      const pat=info.cands[0];
      for(let c=0;c<n;c++){
        if(((pat>>c)&1)&&G.marks[r*n+c]===-1) forced.push(r*n+c);
      }
    }
  }
  for(let c=0;c<n&&!forced.length;c++){
    const info=lineInfo('c',c);
    if(info.solved||!info.ok) continue;
    if(info.cands.length===1){
      const pat=info.cands[0];
      for(let r=0;r<n;r++){
        if(((pat>>r)&1)&&G.marks[r*n+c]===-1) forced.push(r*n+c);
      }
    }
  }
  // 再找所有排布共同格
  if(!forced.length){
    let best=[];
    for(let r=0;r<n;r++){
      const info=lineInfo('r',r);
      if(info.solved||!info.ok||!info.cands.length) continue;
      let andv=(1<<n)-1;
      info.cands.forEach(function(pt){ andv&=pt; });
      const cells=[];
      for(let c=0;c<n;c++) if(((andv>>c)&1)&&G.marks[r*n+c]===-1) cells.push(r*n+c);
      if(cells.length>best.length) best=cells;
    }
    for(let c=0;c<n;c++){
      const info=lineInfo('c',c);
      if(info.solved||!info.ok||!info.cands.length) continue;
      let andv=(1<<n)-1;
      info.cands.forEach(function(pt){ andv&=pt; });
      const cells=[];
      for(let r=0;r<n;r++) if(((andv>>r)&1)&&G.marks[r*n+c]===-1) cells.push(r*n+c);
      if(cells.length>best.length) best=cells;
    }
    forced=best;
  }
  /* 超级数织：普通线索推不出新格时，用「线推演 + 超级线索传播」找必然格 */
  if(p.mega&&!forced.length){
    const res=megaDeduce(p,G.marks);
    if(res.fill.length) forced=res.fill.slice(0,8);
    else if(res.cross.length) forcedX=res.cross.slice(0,8);
  }
  if(!forced.length&&!forcedX.length){ toast(t('hintNone')); return; }
  markStart();
  const rec=[];
  forced.forEach(function(i,hi){
    const from=G.marks[i];
    if(from!==-1) return;
    const fs=G.seq[i];
    G.marks[i]=1; G.seq[i]=1; G.hintM[i]=1;
    rec.push({i:i,from:from,to:1,fs:fs});
    applyCell(G.cellEls[i],i,1,true);
    FX.play(G.cellEls[i],'fx-hint',380,Math.min(hi*30,180),'--hd');
  });
  forcedX.forEach(function(i,hi){
    const from=G.marks[i];
    if(from!==-1&&from!==2) return;
    const fs=G.seq[i];
    G.marks[i]=0; G.seq[i]=3;
    rec.push({i:i,from:from,to:0,fs:fs});
    applyCell(G.cellEls[i],i,0,true);
    FX.play(G.cellEls[i],'fx-hint',380,Math.min(hi*30,180),'--hd');
  });
  if(!rec.length){ toast(t('hintNone')); return; }
  G.hintsLeft--;
  autoCross({changes:rec});
  G.undo.push(rec);
  if(G.undo.length>50) G.undo.shift();
  G.bad=new Set();
  updateLines(true);
  updateHUD();
  saveLive();
  SFX.line();
}

  stopTimer();
  clearLive();
  if(p.mega) S.mega.lastId=p.id; else if(p.pure) S.pure.lastId=p.id; else S.lastId=p.id;
  const n=p.sz;
  if(p.img){ try{ const pre=new Image(); pre.src=p.img; }catch(e){} }
  G={
    p:p,marks:new Int8Array(n*n),seq:new Int8Array(n*n),hintM:new Uint8Array(n*n),
    undo:[],mistakes:0,hintsLeft:3,base:0,t0:0,running:false,tick:null,
    done:false,paused:false,bad:new Set(),lineDone:new Set(),mode:1,lastCell:-1,wrongM:new Uint8Array(n*n)
  };
  G.marks.fill(-1); G.hintM.fill(0); G.wrongM.fill(0);

    : (p.pure
      ? '<b>No.'+pad3(NP2.indexOf(p)+1)+'</b> · '+esc(t('pureMeta'))+' · '+p.sz+'×'+p.sz
      : '<b>'+esc(t('puzzleNo',{n:NP.indexOf(p)+1}))+'</b> · '+(p.rep?esc(t('groupAgain')):'R'+p.r)+' · '+p.sz+'×'+p.sz);
  setMode(1,true);
  buildBoard(p);
  updateHUD();
  renderBoard();
  updateHUD();

  setTimeout(layoutBoard,60);

function setMode(m,silent){

function moveBrushBar(){

/* ================= 解救成功：棋盘 → 立绘 ================= */
let RVT1=0, RVT2=0, RVT3=0, RVSEQ=0;
function cancelReveal(){
  RVSEQ++;
  clearTimeout(RVT1); clearTimeout(RVT2); clearTimeout(RVT3);
  const rv=$('reveal'); if(rv) rv.classList.remove('show');
}
function revealPuzzle(p,done){
  const rv=$('reveal'), stage=$('rvStage');
  if(!rv||!stage){ done(); return; }
  clearTimeout(RVT1); clearTimeout(RVT2); clearTimeout(RVT3);
  const seq=++RVSEQ;
  const n=p.sz, c0=(n-1)/2;
  stage.style.setProperty('--n',n);
  const gr=$('grid');
  if(gr){
    const w=Math.round(gr.getBoundingClientRect().width);
    if(w>120) stage.style.width=Math.min(340,Math.max(190,w))+'px';
  }
  let cells='';
  for(let i=0;i<n*n;i++){
    let bg='#fbfbfe';
    if(p.bits.charCodeAt(i)===49){
      bg=(p.pure||p.mega)?'#737ca6':lightInk(p.pal[B36.indexOf(p.col.charAt(i))]||'#34384c');
    }
    const d=Math.abs(i%n-c0)+Math.abs(Math.floor(i/n)-c0);
    cells+='<i style="background:'+bg+';--d:'+(150+Math.round(d*20))+'ms"></i>';
  }
  stage.classList.toggle('pure',!!(p.pure||p.mega));
  stage.innerHTML='<div class="rvboard">'+cells+'</div>'
    +((p.pure||p.mega)
      ? '<div class="rvcap">'+esc(t(p.mega?'megaWin':'pureWin'))+'</div>'
      : '<div class="rvart"><canvas class="rvpix" width="'+n+'" height="'+n+'"></canvas>'
        +'<img class="rvimg" alt=""></div>')
    +'<div class="rvflash"></div><div class="rvring"></div><div class="rvring b"></div>';
  const pix=stage.querySelector('.rvpix');
  if(pix) drawPix(pix,p);
  const im=stage.querySelector('.rvimg');
  if(im){
    im.addEventListener('load',function(){ im.classList.add('ok'); },{once:true});
    im.addEventListener('error',function(){ im.remove(); },{once:true});
    im.src=p.img;
    if(im.complete&&im.naturalWidth>0) im.classList.add('ok');
  }
  rv.classList.add('show');
  RVT1=setTimeout(function(){
    if(seq!==RVSEQ) return;
    SFX.reveal(); buzz(30);
  },520);
  RVT3=setTimeout(function(){
    if(seq!==RVSEQ) return;
    particles();
  },860);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  RVT2=setTimeout(function(){
    if(seq!==RVSEQ) return;
    rv.classList.remove('show');
    RVT2=setTimeout(function(){ if(seq===RVSEQ) done(); },340);
  },(S.lowPower||reduce)?800:1250);
}
function finish(){
  if(!G||G.done) return;
  G.done=true;
  clearLive();
  stopTimer();
  // 待选格统一落定为打叉，避免通关后仍留浅色标记
  for(let i=0;i<G.marks.length;i++){
    if(G.marks[i]===2){ G.marks[i]=0; G.seq[i]=3; applyCell(G.cellEls[i],i,0,false); }
  }
  const p=G.p, ms=Math.max(0,Math.round(G.base)), m=G.mistakes, h=3-G.hintsLeft;
  const stars=starsFor(p,ms,m,h);
  const sol=curSolved();
  const prev=sol[p.id];
  const first=!prev;
  const oldBest=prev?prev.t:0;
  const rec={t:prev?Math.min(prev.t,ms):ms,m:prev?Math.min(prev.m,m):m,h:prev?Math.min(prev.h,h):h,s:prev?Math.max(prev.s,stars):stars,d:prev?prev.d:todayKey()};
  if(!prev) rec.d=todayKey();
  sol[p.id]=rec;
  if(p.mega){ S.mega.plays++; S.mega.totalMs+=ms; }
  else if(p.pure){ S.pure.plays++; S.pure.totalMs+=ms; }
  else{ S.plays++; S.totalMs+=ms; }
  saveGame();
  if(!p.pure&&!p.mega) unlockAchievements(p,ms,m,h);
  saveGame();
  renderStats();
  // P1-2 终局定格：最后落子先亮起，再启动全盘脉冲
  const n=p.sz, cx=(n-1)/2, cy=(n-1)/2;
  const animate=FX.on();
  let last=G.lastCell;
  if(!(last>=0&&G.marks[last]===1)){
    last=-1;
    for(let i=0;i<G.marks.length;i++){ if(G.marks[i]===1){ last=i; break; } }
  }
  if(animate&&last>=0) FX.play(G.cellEls[last],'fx-final',420);
  const lead=animate?160:0;
  setTimeout(function(){
    if(!G||G.p!==p) return;
    $('grid').classList.add('win');
    for(let i=0;i<n*n;i++){
      const el=G.cellEls[i]; if(!el) continue;
      if(G.marks[i]===1){
        const d=Math.abs(i%n-cx)+Math.abs(Math.floor(i/n)-cy);
        el.style.setProperty('--d',Math.round(d*26)+'ms');
      }
    }
    SFX.win(); buzz(40);
  },lead);
  setTimeout(function(){
    if(!G||G.p!==p) return;
    revealPuzzle(p,function(){
      showResult({mode:'win',p:p,ms:ms,m:m,h:h,stars:stars,first:first,
        newBest:!!(oldBest&&ms<oldBest)});
    });
  },lead+300);
}

function rollResultNums(){
  const els=$('resultSheet').querySelectorAll('.rgrid b[data-to]');
  if(!els.length) return;
  cancelAnimationFrame(RESULT_RAF);
  if(!FX.on()) return;
  els.forEach(function(el){ el.textContent=el.getAttribute('data-fmt')==='time'?'0:00':'0'; });
  const t0=performance.now();
  function step(now){
    const k=Math.min(1,(now-t0)/360), e=1-Math.pow(1-k,3);
    els.forEach(function(el){
      const to=+el.getAttribute('data-to'), v=Math.round(to*e);
      el.textContent=el.getAttribute('data-fmt')==='time'?fmtTime(v):String(v);
    });
    if(k<1) RESULT_RAF=requestAnimationFrame(step);
  }
  RESULT_RAF=requestAnimationFrame(step);
}

    ? '<button class="pri" data-act="next">'+esc(t('next'))+'</button>'
      +'<button class="sec" data-act="replay">'+esc(t('replay'))+'</button>'
      +'<button class="thi" data-act="close">'+esc(t('backCatalog'))+'</button>'
    : '<button class="pri" data-act="replay">'+esc(t('replay'))+'</button>'
      +'<button class="sec" data-act="close">'+esc(t('close'))+'</button>';
  const title=win?(p.mega?t('megaWin'):(p.pure?t('pureWin'):t('win'))):'';
  $('resultSheet').innerHTML=
    '<div class="rhead2">'+(win?esc(title):esc(t('catalog')))+'</div>'
    +art
    +'<div class="rname">'+esc(p.mega?('No.'+pad3(NP3.indexOf(p)+1)):(p.pure?('No.'+pad3(NP2.indexOf(p)+1)):nameOf(p)))+'</div>'
    +aliasLine
    +'<div class="rmeta">'+(p.mega?esc(t('megaMeta')):(p.pure?esc(t('pureMeta')):(p.rep?esc(t('groupAgain'))+' · '+esc(t('groupAgainSub')):'R'+p.r+' · '+esc(RAR[p.r]||''))))+' · '+p.sz+'×'+p.sz+(p.by?' · '+esc(t('author'))+': '+esc(p.by):'')+'</div>'
    +stats
    +(win&&o.newBest&&o.first===false?'<div class="rcoin" style="color:#98733a">'+esc(t('newBest'))+'</div>':'')
    +'<div class="rbtns">'+buttons+'</div>';
  // 像素回退
  const im=$('resultSheet').querySelector('.artframe img');
  $('resultSheet').querySelectorAll('canvas[data-pix]').forEach(function(cv){
    const pp=NP.find(function(x){ return x.id===cv.getAttribute('data-pix'); }); if(pp) drawPix(cv,pp);
  });
  $('resultSheet').querySelectorAll('canvas[data-np2]').forEach(function(cv){
    const pp=NP2.find(function(x){ return x.id===cv.getAttribute('data-np2'); }); if(pp) drawPixMono(cv,pp);
  });
  $('resultSheet').querySelectorAll('canvas[data-np3]').forEach(function(cv){
    const pp=NP3.find(function(x){ return x.id===cv.getAttribute('data-np3'); }); if(pp) drawPixMono(cv,pp);
  });
  if(im){
    im.addEventListener('error',function(){
      const cv=pixelArtHTML(p);
      const holder=im.parentNode;
      const tmp=document.createElement('div'); tmp.innerHTML=cv;
      const cvEl=tmp.firstChild; cvEl.style.width='100%'; cvEl.style.height='100%';
      cvEl.style.imageRendering='pixelated';
      drawPix(cvEl,p);
      im.replaceWith(cvEl);
    },{once:true});
  }
  $('result').classList.add('show');
  rollResultNums();
  if(!win) SFX.reveal();
  $('resultSheet').onclick=function(e){
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const act=btn.getAttribute('data-act');
    SFX.click();
    $('result').classList.remove('show');
    if(act==='replay'){ startPuzzle(p); }
    else if(act==='next'){ goNextUnsolved(p); }
    else if(act==='close'){ backToCatalog(); }
  };
}
function goNextUnsolved(from){
  const pool=from.mega?NP3:(from.pure?NP2:NP);
  const sol=from.mega?S.mega.solved:(from.pure?S.pure.solved:S.solved);
  const idx=pool.indexOf(from);
  for(let k=1;k<=pool.length;k++){
    const p=pool[(idx+k)%pool.length];
    if(!sol[p.id]&&puzzleUnlocked(p)){ startPuzzle(p); return; }
  }
  backToCatalog();
  toast(t('achAll'));
}
function backToCatalog(){
  cancelReveal();
  stopTimer();
  clearLive();
  clearScanIn();
  $('result').classList.remove('show');
  $('pause').classList.remove('show');
  $('viewPuzzle').classList.remove('on');
  $('viewCatalog').classList.remove('off');
  G=null;
  if(MODE==='mega'){ setTab('pure'); setSubTab('mega'); }
  else if(MODE==='pure'){ setTab('pure'); setSubTab('normal'); }
  else{ setTab(tab==='pure'?'random':tab); }
}

/* ================= 指针 / 键盘 ================= */
function bindBoard(){
  const grid=$('grid');
  grid.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  /* 右键（或触屏长按）起手后拖到棋盘外再松手时，系统菜单会弹到游戏界面之外。
     在起手后的一小段时间内整页拦截 contextmenu，保证右键手势不会“出界”。 */
  let ctxGuard=0;
  window.addEventListener('contextmenu',function(e){
    if(grid.contains(e.target)||STROKE||(ctxGuard&&Date.now()-ctxGuard<2500)){
      e.preventDefault();
      ctxGuard=0;
    }
  },true);
  // 在棋盘外松手也能正常结束本次笔画，避免标记跟着指针乱跑
  window.addEventListener('pointerup',function(e){
    if(ctxGuard) ctxGuard=Date.now();
    if(STROKE&&e.pointerId===STROKE.pid) endStroke();
  },false);
  grid.addEventListener('pointerdown',function(e){
    if(!G||G.done||G.paused) return;
    if(e.button!==undefined&&e.button!==0&&e.button!==2) return;
    const i=cellFromPoint(e.clientX,e.clientY);
    if(i<0) return;
    setGuide((i/G.p.sz)|0,i%G.p.sz);
    e.preventDefault();
    try{ grid.setPointerCapture(e.pointerId); }catch(err){}
    const reverse=(e.button===2)||e.shiftKey;
    if(e.button===2||e.pointerType!=='mouse') ctxGuard=Date.now();
    // 只保留一个活动笔画：多指/误触的第二次按下先结算上一次，避免串到相邻格
    if(STROKE) endStroke();
    beginStroke(i,reverse,e.pointerType!=='touch',e.pointerId,e.clientX,e.clientY);
    LONG_FIRED=false;
    clearTimeout(LONG_T);
    if(!reverse&&e.pointerType!=='mouse'){
      LONG_T=setTimeout(function(){
        if(!STROKE||STROKE.pid!==e.pointerId) return;
        LONG_FIRED=true;
        STROKE.reverse=true;
        const val=-1;
        // 撤销按下时已经涂上的笔刷，长按统一按消除处理
        const changes=STROKE.changes;
        if(changes.length){
          const ch=changes[0];
          if(ch.to===G.mode){
            G.marks[ch.i]=ch.from;
            G.seq[ch.i]=ch.fs;
            applyCell(G.cellEls[ch.i],ch.i,ch.from,false);
            changes.length=0;
          }
        }
        paintCell(i,val);
        buzz(10);
      },350);
    }
  });
  grid.addEventListener('pointermove',function(e){
    if(!G||G.done||G.paused) return;
    if(e.pointerType==='mouse'||(STROKE&&e.pointerId===STROKE.pid)){
      const gi=cellFromPoint(e.clientX,e.clientY);
      if(gi>=0) setGuide((gi/G.p.sz)|0,gi%G.p.sz);
    }
    if(!STROKE||e.pointerId!==STROKE.pid) return;
    e.preventDefault();
    // 轻微抖动不取消长按，手指明显移动后才取消，长按后继续拖动可连续消除
    if(!LONG_FIRED&&e.pointerType!=='mouse'&&STROKE.px!=null){
      const dx=e.clientX-STROKE.px, dy=e.clientY-STROKE.py;
      if(dx*dx+dy*dy>64) clearTimeout(LONG_T);
    }
    const i=cellFromPoint(e.clientX,e.clientY);
    if(i<0) return;
    if(i!==STROKE.origin&&!STROKE.moved) STROKE.moved=true;
    paintCell(i,STROKE.desktop?STROKE.tapVal:((STROKE.reverse||STROKE.erase)?-1:G.mode));
  });
  function up(e){
    clearTimeout(LONG_T);
    if(!STROKE||e.pointerId!==STROKE.pid) return;
    // 触屏纯点击（没拖到别的格子）：涂上当前笔刷，或再点一次取消；电脑按下时已落子
    if(!STROKE.moved&&!STROKE.reverse&&!LONG_FIRED&&!STROKE.desktop){
      const val=tapNextValue(STROKE.from);
      paintCell(STROKE.origin,val,tapNextSeq(val));
    }
    endStroke();
  }
  grid.addEventListener('pointerup',up);
  grid.addEventListener('pointercancel',up);
  grid.addEventListener('pointerleave',function(e){
    /* 鼠标移出棋盘：收起引导；拖拽中不收起，拖出再拖回仍连续 */
    if(e.pointerType==='mouse'&&!STROKE) clearGuide();
  });
  // 光标
  document.addEventListener('keydown',function(e){
    if(!G||G.paused||G.done) return;
    if($('set').classList.contains('show')||$('ach').classList.contains('show')||$('result').classList.contains('show')||$('help').classList.contains('show')) return;
    const n=G.p.sz;
    let r=Math.floor(CURSOR/n), c=CURSOR%n;
    let handled=true;
    if(e.key==='ArrowLeft') c=Math.max(0,c-1);
    else if(e.key==='ArrowRight') c=Math.min(n-1,c+1);
    else if(e.key==='ArrowUp') r=Math.max(0,r-1);
    else if(e.key==='ArrowDown') r=Math.min(n-1,r+1);
    else if(e.key===' '||e.key==='Spacebar'){
      e.preventDefault(); markStart();
      STROKE={changes:[],reverse:false};
      paintCell(r*n+c,1); endStroke();
      return;
    }else if(e.key==='x'||e.key==='X'){
      STROKE={changes:[],reverse:false};
      paintCell(r*n+c,0); endStroke();
      return;
    }else if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){ e.preventDefault(); undo(); return; }
    else if(e.key==='h'||e.key==='H'){ useHint(); return; }
    else if(e.key==='Escape'){ togglePause(); return; }
    else handled=false;
    if(!handled) return;
    e.preventDefault();
    const old=G.cellEls[CURSOR];
    if(old) old.classList.remove('cur');
    CURSOR=r*n+c;
    G.cellEls[CURSOR].classList.add('cur');
    setGuide(r,c);
    if(e.key===' '||e.key==='x'||e.key==='X'){}
  });
  // 点击格：把光标也移过去
  grid.addEventListener('pointerup',function(e){
    if(!G||G.done) return;
    const i=cellFromPoint(e.clientX,e.clientY);
    if(i>=0){
      if(G.cellEls[CURSOR]) G.cellEls[CURSOR].classList.remove('cur');
      CURSOR=i;
      setGuide((i/G.p.sz)|0,i%G.p.sz);
    }
  });
  /* 反过来：鼠标移到线索行/列上，也点亮它对应的棋盘行/列，读线索时不会串行 */
  $('cluesLeft').addEventListener('pointerover',function(e){
    if(!G||G.done||G.paused||e.pointerType!=='mouse') return;
    const el=e.target.closest?e.target.closest('.cleft'):null;
    if(!el) return;
    setGuide(+el.getAttribute('data-line').slice(1),GUIDE.c);
  });
  $('cluesTop').addEventListener('pointerover',function(e){
    if(!G||G.done||G.paused||e.pointerType!=='mouse') return;
    const el=e.target.closest?e.target.closest('.ctop'):null;
    if(!el) return;
    setGuide(GUIDE.r,+el.getAttribute('data-line').slice(1));
  });
}

/* ================= 暂停 ================= */
function togglePause(){
  if(!G||G.done) return;
  if(G.paused) resumeGame(); else pauseGame();
}
function pauseGame(){
  if(!G||G.done||G.paused) return;
  G.paused=true;
  clearGuide();
  pauseTimer();
  saveLive();
  $('pause').classList.add('show');
}
function resumeGame(){
  if(!G||!G.paused) return;
  G.paused=false;
  $('pause').classList.remove('show');
  if(!G.done) startTimer();
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    if(G&&!G.done&&!G.paused) pauseGame();
  }
});
window.addEventListener('pagehide',function(){
  stopTimer();
  saveLive();     /* 刷新/版本更新前把当前棋盘落盘，重载后可续玩 */
  try{ if(AC&&AC.state==='running') AC.suspend(); }catch(e){}
});

/* ================= 自检 ================= */
function selftest(){
  const errs=[];
  if(NP.length!==110) errs.push('NP='+NP.length);
  let aliasCount=0;
  NP.forEach(function(p){
    aliasCount+=1+(p.alias?p.alias.length:0);
    if(p.bits.length!==p.sz*p.sz) errs.push(p.id+' bits');
    if(p.col.length!==p.sz*p.sz) errs.push(p.id+' col');
    if(!p._rows) buildClues(p);
    if(p._rows.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' row clue');
    if(p._cols.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' col clue');
    for(let i=0;i<p.sz*p.sz;i++){
      if(p.bits.charCodeAt(i)===49){
        const ci=B36.indexOf(p.col.charAt(i));
        if(ci<0||ci>=p.pal.length) errs.push(p.id+' colidx@'+i);
      }
    }
  });
  if(aliasCount!==111) errs.push('ids='+aliasCount);
  // 线解算器干跑：官方解必须全部满足、且不出现无解线
  NP.forEach(function(p){
    const n=p.sz;
    const marks=new Int8Array(n*n);
    for(let i=0;i<n*n;i++) marks[i]=p.bits.charCodeAt(i)===49?1:0;
    for(let r=0;r<n;r++){
      if(!sameClue(clueOfStates(rowStates(p,marks,r)),p._rows[r])) errs.push(p.id+' row'+r);
    }
    for(let c=0;c<n;c++){
      if(!sameClue(clueOfStates(colStates(p,marks,c)),p._cols[c])) errs.push(p.id+' col'+c);
    }
  });
  if(!NP2||NP2.length!==100) errs.push('NP2='+(NP2?NP2.length:'-'));
  NP2.forEach(function(p){
    if(p.bits.length!==p.sz*p.sz) errs.push(p.id+' bits');
    if(!p._rows) buildClues(p);
    if(p._rows.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' row clue');
    if(p._cols.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' col clue');
  });
  /* 官方解满足 + 纯逻辑可推完（推完 ⇒ 唯一解 ⇒ 无需猜测） */
  NP2.forEach(function(p){
    const n=p.sz, m=new Int8Array(n*n); m.fill(-1);
    for(let i=0;i<n*n;i++) if(p.bits.charCodeAt(i)===49) m[i]=1;
    for(let r=0;r<n;r++) if(!sameClue(clueOfStates(rowStates(p,m,r)),p._rows[r])) errs.push(p.id+' sol-r'+r);
    for(let c=0;c<n;c++) if(!sameClue(clueOfStates(colStates(p,m,c)),p._cols[c])) errs.push(p.id+' sol-c'+c);
    const s=new Int8Array(n*n); s.fill(-1);
    for(let loop=0;loop<n*n*2;loop++){
      let ch=false;
      for(let r=0;r<n;r++){
        const cd=lineCands(p,'r',r,s); if(!cd.length){ errs.push(p.id+' dead-r'+r); return; }
        let av=(1<<n)-1, ov=0; cd.forEach(function(x){ av&=x; ov|=x; });
        for(let c=0;c<n;c++){ const i=r*n+c;
          if(((av>>c)&1)&&s[i]===-1){ s[i]=1; ch=true; }
          else if(!((ov>>c)&1)&&s[i]===-1){ s[i]=0; ch=true; } }
      }
      for(let c=0;c<n;c++){
        const cd=lineCands(p,'c',c,s); if(!cd.length){ errs.push(p.id+' dead-c'+c); return; }
        let av=(1<<n)-1, ov=0; cd.forEach(function(x){ av&=x; ov|=x; });
        for(let r=0;r<n;r++){ const i=r*n+c;
          if(((av>>r)&1)&&s[i]===-1){ s[i]=1; ch=true; }
          else if(!((ov>>r)&1)&&s[i]===-1){ s[i]=0; ch=true; } }
      }
      if(!ch) break;
    }
    for(let i=0;i<n*n;i++) if(s[i]===-1) errs.push(p.id+' guess@'+i);
  });
  /* ---- 超级数织：结构 + 官方解满足 + 普通线索推不完 + 加超级线索可推完 == 原解 ---- */
  if(!NP3||NP3.length!==40) errs.push('NP3='+(NP3?NP3.length:'-'));
  NP3.forEach(function(p){
    if(p.bits.length!==p.sz*p.sz) errs.push(p.id+' bits');
    p._sr=p._sr||p.sr; p._sc=p._sc||p.sc;
    if(p._sr.length!==p.sz-1||p._sc.length!==p.sz-1) errs.push(p.id+' super-len');
    if(!p._rows) buildClues(p);
    if(p._rows.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' row clue');
    if(p._cols.some(function(c){ return patterns(p.sz,c).length===0; })) errs.push(p.id+' col clue');
  });
  NP3.forEach(function(p){
    const n=p.sz, m=new Int8Array(n*n); m.fill(-1);
    for(let i=0;i<n*n;i++) if(p.bits.charCodeAt(i)===49) m[i]=1;
    for(let r=0;r<n;r++){
      /* v3：超级块占用的格子不计入该行小线索 */
      let b=rowStates(p,m,r), ex=0;
      if(p.v===3){
        ex=v3RowMegaMaskFromGrid(p,function(rr,cc){ return m[rr*n+cc]===1; },r);
        b=b.slice();
        for(let c=0;c<n;c++) if((ex>>c)&1) b[c]=0;
      }
      if(!sameClue(clueOfStates(b),p._rows[r])) errs.push(p.id+' sol-r'+r);
    }
    for(let c=0;c<n;c++) if(!sameClue(clueOfStates(colStates(p,m,c)),p._cols[c])) errs.push(p.id+' sol-c'+c);
    let hasSup=false;
    for(let a=0;a<n-1;a++){
      if(p._sr[a].length||p._sc[a].length) hasSup=true;
      if(!superSatisfied(p._sr[a],megaBandComps(p,m,a,true))) errs.push(p.id+' sup-r'+a);
      if(!superSatisfied(p._sc[a],megaBandComps(p,m,a,false))) errs.push(p.id+' sup-c'+a);
      if(p.v>=2){
        if(!bandOk(p._sr[a],megaBandComps(p,m,a,true),true)) errs.push(p.id+' v2-band'+a);
        if(p._sc[a].length&&!bandOk(p._sc[a],megaBandComps(p,m,a,false),true)) errs.push(p.id+' v2-bandc'+a);
      }
    }
    if(!hasSup) errs.push(p.id+' no-super');
    // 只用普通行列线索推不完（超级线索必要）
    const base=new Int8Array(n*n); base.fill(-1);
    for(let loop=0;loop<n*n*2;loop++){
      let ch=false;
      for(let r=0;r<n;r++){
        const cd=lineCands(p,'r',r,base); if(!cd.length){ errs.push(p.id+' dead-r'+r); return; }
        let av=(1<<n)-1, ov=0; cd.forEach(function(x){ av&=x; ov|=x; });
        for(let c=0;c<n;c++){ const i=r*n+c;
          if(((av>>c)&1)&&base[i]===-1){ base[i]=1; ch=true; }
          else if(!((ov>>c)&1)&&base[i]===-1){ base[i]=0; ch=true; } }
      }
      for(let c=0;c<n;c++){
        const cd=lineCands(p,'c',c,base); if(!cd.length){ errs.push(p.id+' dead-c'+c); return; }
        let av=(1<<n)-1, ov=0; cd.forEach(function(x){ av&=x; ov|=x; });
        for(let r=0;r<n;r++){ const i=r*n+c;
          if(((av>>r)&1)&&base[i]===-1){ base[i]=1; ch=true; }
          else if(!((ov>>r)&1)&&base[i]===-1){ base[i]=0; ch=true; } }
      }
      if(!ch) break;
    }
    let baseFull=true;
    for(let i=0;i<n*n;i++) if(base[i]===-1){ baseFull=false; break; }
    if(baseFull) errs.push(p.id+' super-useless');
    // 普通 + 超级线索联合传播：推完且 == 原解
    const u=new Int8Array(n*n); u.fill(-1);
    const res=megaDeduce(p,u);
    const setF=new Set(res.fill), setX=new Set(res.cross);
    for(let i=0;i<n*n;i++){
      const want=p.bits.charCodeAt(i)===49?1:0;
      if(setF.has(i)){ if(want!==1) errs.push(p.id+' mega-fill@'+i); }
      else if(setX.has(i)){ if(want!==0) errs.push(p.id+' mega-cross@'+i); }
      else errs.push(p.id+' mega-guess@'+i);
    }
  });
  const msg=errs.length?t('selftestFail',{s:errs.slice(0,4).join(', ')}):t('selftestOk');
  console.log('[nonogram selftest]',msg,errs);
  toast(msg);
  return errs;
}

/* ================= 初始化 ================= */
function init(){
  applyStaticText();
  NP.forEach(buildClues);
  NP2.forEach(function(p){ p.pure=true; buildClues(p); });
  NP3.forEach(function(p){ p.mega=true; p._sr=p.sr; p._sc=p.sc; buildClues(p); });
  renderChips();
  refreshCatalog();
  renderSettings();
  // 顶栏
  $('btnAch').onclick=function(){ renderAch(); $('ach').classList.add('show'); SFX.click(); };
  $('achClose').onclick=function(){ $('ach').classList.remove('show'); };
  $('ach').onclick=function(e){ if(e.target===$('ach')) $('ach').classList.remove('show'); };
  $('btnHelp').onclick=function(){ $('help').classList.add('show'); SFX.click(); };
  $('helpClose').onclick=function(){ $('help').classList.remove('show'); };
  $('help').onclick=function(e){ if(e.target===$('help')) $('help').classList.remove('show'); };
  $('btnSet').onclick=function(){ renderSettings(); $('set').classList.add('show'); SFX.click(); };
  $('btnBack').onclick=function(){ SFX.click(); backToCatalog(); };
  $('btnPause').onclick=function(){ SFX.click(); togglePause(); };
  $('pauseResume').onclick=function(){ SFX.click(); resumeGame(); };
  $('pauseBack').onclick=function(){ backToCatalog(); };
  $('modeFill').onclick=function(){ setMode(1); };
  $('modeCross').onclick=function(){ setMode(0); };
  $('modeTent').onclick=function(){ setMode(2); };
  $('btnUndo').onclick=function(){ undo(); };
  $('btnClear').onclick=function(){ clearBoard(); };
  $('btnHint').onclick=function(){ useHint(); };
  $('btnEasy').onclick=function(){
    S.easy=!S.easy; saveGame();
    syncEasyBtn();
    SFX.click();
    toast(S.easy?t('easyOn'):t('easyOff'),2200);
    if(G&&!G.done){ G.bad=new Set(); updateLines(true); updateHUD(); }
  };
  $('tabs').addEventListener('click',function(e){
    const b=e.target.closest('[data-tab]'); if(!b) return;
    setTab(b.getAttribute('data-tab')); SFX.click();
  });
  $('hero').addEventListener('click',function(e){
    const b=e.target.closest('[data-pid]'); if(!b) return;
    const p=NP.find(function(x){ return x.id===b.getAttribute('data-pid'); }); if(!p) return;
    if(!puzzleUnlocked(p)){ toast(t('lockedTip'),2800); return; }
    SFX.click();
    if(S.solved[p.id]) showResult({mode:'detail',p:p});
    else startPuzzle(p);
  });
  $('chips').addEventListener('click',function(e){
    const b=e.target.closest('[data-filter]'); if(!b) return;
    filter=b.getAttribute('data-filter'); SFX.click();
    renderChips(); renderCatalog();
  });
  $('catalog').addEventListener('click',function(e){
    const card=e.target.closest('.card'); if(!card) return;
    const pid=card.getAttribute('data-pid');
    const p=NP.find(function(x){ return x.id===pid; }); if(!p) return;
    SFX.click();
    if(card.getAttribute('data-lock')==='1'){
      toast(t('lockedTip'),2800);
      card.classList.remove('deny');
      void card.offsetWidth;
      card.classList.add('deny');
      setTimeout(function(){ card.classList.remove('deny'); },400);
      return;
    }
    if(S.solved[p.id]) showResult({mode:'detail',p:p});
    else startPuzzle(p);
  });
  $('pchips').addEventListener('click',function(e){
    const b=e.target.closest('[data-filter]'); if(!b) return;
    filter=b.getAttribute('data-filter'); SFX.click();
    renderPureChips(); renderPureCatalog();
  });
  $('pcatalog').addEventListener('click',function(e){
    const card=e.target.closest('.card'); if(!card) return;
    const pid=card.getAttribute('data-pid');
    const p=NP2.find(function(x){ return x.id===pid; }); if(!p) return;
    SFX.click();
    if(S.pure.solved[p.id]) showResult({mode:'detail',p:p});
    else startPuzzle(p);
  });
  $('pureHero').addEventListener('click',function(e){
    const b=e.target.closest('[data-rand]'); if(!b) return;
    SFX.click();
    const un=NP2.filter(function(p){ return !S.pure.solved[p.id]; });
    const pool=un.length?un:NP2;
    startPuzzle(pool[Math.floor(Math.random()*pool.length)]);
  });
  $('pureTabs').addEventListener('click',function(e){
    const b=e.target.closest('[data-sub]'); if(!b) return;
    setSubTab(b.getAttribute('data-sub')); SFX.click();
  });
  $('mchips').addEventListener('click',function(e){
    const b=e.target.closest('[data-filter]'); if(!b) return;
    filter=b.getAttribute('data-filter'); SFX.click();
    renderMegaChips(); renderMegaCatalog();
  });
  $('mcatalog').addEventListener('click',function(e){
    const card=e.target.closest('.card'); if(!card) return;
    const pid=card.getAttribute('data-pid');
    const p=NP3.find(function(x){ return x.id===pid; }); if(!p) return;
    SFX.click();
    if(S.mega.solved[p.id]) showResult({mode:'detail',p:p});
    else startPuzzle(p);
  });
  $('megaHero').addEventListener('click',function(e){
    const b=e.target.closest('[data-rand]'); if(!b) return;
    SFX.click();
    const un=NP3.filter(function(p){ return !S.mega.solved[p.id]; });
    const pool=un.length?un:NP3;
    startPuzzle(pool[Math.floor(Math.random()*pool.length)]);
  });
  bindBoard(); bindSettings();
  layoutBoard();
  window.addEventListener('resize',function(){
    if(G&&!G.done){ layoutBoard(); }
  });
  window.addEventListener('orientationchange',function(){ setTimeout(layoutBoard,220); });
  /* 刷新或首页自动更新后重开页面：把上一次进行中的棋盘原样接回来（暂停态，点继续即可） */
  if(QS.get('selftest')!=='1') restoreLive();
  if(QS.get('selftest')==='1') setTimeout(selftest,120);
  // 暴露给自动化测试
  window.__NP_TEST={NP:NP,patterns:patterns,buildClues:buildClues,sameClue:sameClue,
    clueOfStates:clueOfStates,rowStates:rowStates,colStates:colStates,S:S,startPuzzle:startPuzzle,finish:finish,selftest:selftest,
    NP2:NP2,drawPixMono:drawPixMono,MODE:function(){return MODE;},
    NP3:NP3,setSubTab:setSubTab,megaDeduce:megaDeduce,megaBandComps:megaBandComps,superSatisfied:superSatisfied};
  window.__NP_STATE=function(){ return G?(G.done?'win':(G.paused?'pause':'play')):'catalog'; };
}
init();
})();
</script>
