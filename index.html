  check('删除常用项目', S.pomo.presets.length===2);
  pomoPreset(45);
  check('pomoPreset 设定时长', S.pomo.focusTotal===45*60000 && S.pomo.total===45*60000 && S.pomo.remain===45*60000);
  pomoBreakPreset(10);
  check('pomoBreakPreset 设定休息', S.pomo.breakMin===10);
  document.getElementById('pomoCustom').value=40;
  pomoCustomChange();
  check('滑杆设定时长', S.pomo.focusTotal===40*60000 && S.pomo.total===40*60000);
  pomoPreset(25);
  check('预设联动滑杆', document.getElementById('pomoCustom').value===25 && S.pomo.focusTotal===25*60000);
  openPomo();
  const pomoBody=document.getElementById('modal-body').innerHTML;
  check('番茄钟含常用项目/休息按钮', pomoBody.includes('pomoPresets') && pomoBody.includes('休息时长') && pomoBody.includes('pomoNextBtn') && pomoBody.includes('pomoRing'));
  check('番茄钟新结构:滑杆/存为常用同行/休息5-10-15', pomoBody.includes('type="range"') && pomoBody.includes('pomoCustomLbl') && pomoBody.includes('pomo-sec-row') && pomoBody.includes('pomoBreakPreset(15)'));
  check('置顶图标位于番茄钟右上侧', pomoBody.includes('pomo-pipbtn') && pomoBody.includes('pomoPipBtn') && !pomoBody.includes('>📌 置顶小窗<'));

  // 10. 虚拟时间（约2现实小时=1游戏年）
  const g0=gameNow();
  S.gameStart=now()-2*3600*1000;
  const g1=gameNow();
  check('2现实小时≈1游戏年', g1.getFullYear()===g0.getFullYear()+1, g0.toString()+' -> '+g1.toString());
  S.gameStart=now();
  check('虚拟时间可回拨', gameNow().getFullYear()===g0.getFullYear());
  check('天气间隔为现实分钟级', (function(){ const b=S.nextWeatherAt-now(); return b>0 && b<20*60000; })());

  // 11. 连击/节日月巴改为低概率永久可遇
  const comboIds=['mb_lian','mb_kuanglian','mb_shenlian'];
  const eventIds=['mb_zhoumo','mb_zhengdian','mb_xinnian','mb_qingren','mb_wuyi','mb_guoqing','mb_wansheng','mb_shengdan','mb_zhongqiu'];
  const conv=[...comboIds,...eventIds].map(id=>TYPES.find(t=>t.id===id));
  check('连击/节日月巴条件全空', conv.every(t=>t.cond===null));
  check('概率均<1', conv.every(t=>t.weight!=null && t.weight<1));
  check('移除combo/event条件类型', (function(){ const cs=new Set(); TYPES.forEach(t=>t.cond&&cs.add(t.cond.t)); return !cs.has('combo') && !cs.has('event'); })());
  check('无连击状态字段', !('combo' in defaultState()) && !('lastHarvest' in defaultState()));
  check('低概率月巴在可遇列表', availableTypes().some(t=>t.id==='mb_lian'));

  // 12. 打卡与日历
  S.pomo.history.push({n:'健身', s:now()-30*60000, d:30*60000, t:now(), c:'跑步30分钟'});
  openPomoCalendar();
  const calEl=document.getElementById('modal-body');
  const calTitle=document.getElementById('modalTitle').textContent;
  check('日历渲染', calEl.innerHTML.includes('cal-cell') && calEl.innerHTML.includes('cal-grid') && calTitle.includes('打卡日历'), calTitle);
  calDetail(new Date().getDate());
  const detEl=document.getElementById('calDetail');
  check('日历含打卡内容', detEl.innerHTML.includes('健身') && detEl.innerHTML.includes('跑步30分钟'));
  check('打卡总时长显示', detEl.innerHTML.includes(fmtDur(30*60000)));

  // 12b. 日历按专注时长变色填充（8小时=100%，满8小时换色）
  const H=3600*1000;
  check('1小时填充1/8(色1)', calFill(1*H).includes('height:13%') && calFill(1*H).includes(CAL_COLORS[0]), calFill(1*H));
  check('8小时填满(色1)', calFill(8*H).includes('height:100%') && calFill(8*H).includes(CAL_COLORS[0]), calFill(8*H));
  check('9小时填充1/8(色2)', calFill(9*H).includes('height:13%') && calFill(9*H).includes(CAL_COLORS[1]), calFill(9*H));
  check('16小时填满(色2)', calFill(16*H).includes('height:100%') && calFill(16*H).includes(CAL_COLORS[1]), calFill(16*H));
  check('17小时填充1/8(色3)', calFill(17*H).includes('height:13%') && calFill(17*H).includes(CAL_COLORS[2]), calFill(17*H));
  check('24小时填满(色3)', calFill(24*H).includes('height:100%') && calFill(24*H).includes(CAL_COLORS[2]), calFill(24*H));
  check('超24小时用第4色', calFill(25*H).includes('height:13%') && calFill(25*H).includes(CAL_COLORS[3]), calFill(25*H));
  check('仅4种颜色', CAL_COLORS.length===4, CAL_COLORS.length);
  check('填充色为半透明', CAL_COLORS.every(c=>/rgba\\(.*,\\s*0?\\.?\\d+\\)/.test(c)), CAL_COLORS.join(','));
  check('0小时无填充', calFill(0)==='');
  check('日历格含填充层', (function(){ openPomoCalendar(); return document.getElementById('modal-body').innerHTML.includes('calfill'); })());
  check('日历填充图例', (function(){ openPomoCalendar(); return document.getElementById('modal-body').innerHTML.includes('cal-legend'); })());

  // 13. woodSpot 手机端不越界
  check('woodSpot 最低限70%', ZONES.every((z,i)=>woodSpot(i,5).t<=70));

  // 14. 时间显示改为时段词
  check('时段词:上午/下午等', periodOf(9)==='上午' && periodOf(15)==='下午' && periodOf(1)==='凌晨' && periodOf(21)==='晚上', periodOf(9)+'/'+periodOf(15));
  check('状态栏无具体时间', (function(){ updateStatus(); const t=document.getElementById('stTime').textContent; return !/:\d\d/.test(t) && /上午|下午|中午|傍晚|晚上|凌晨/.test(t); })());

  // 15. 老存档 pomo 深合并（缺少 presets/mode 时补默认值）
  const oldPomo={name:'旧专注', total:1, remain:1, running:false, history:[{n:'旧',s:1,d:1,t:1}]};
  const merged=Object.assign({}, defaultState());
  merged.pomo=Object.assign(defaultState().pomo, oldPomo||{});
  check('老存档pomo深合并', merged.pomo.presets.length===2 && merged.pomo.mode==='focus' && merged.pomo.breakMin===5 && merged.pomo.history.length===1 && merged.pomo.name==='旧专注');

  // 16. 番茄钟专注时段自动收集 / 其余时段手动
  S.pomo=Object.assign({history:[]}, defaultState().pomo);
  S.coins=0; S.totalHarvest=0;
  const t16=TYPES.find(t=>!t.cond);
  const mkMature=()=>({t:t16.id,start:now()-t16.t*1000,dur:t16.t*1000,h:5,w:5});
  // 未启动：成熟不自动收
  S.zones[0].woods[0].cells=[mkMature()];
  S.pomo.running=false; S.pomo.mode='focus'; S.pomo.end=0;
  tick();
  check('未启动不自动收集', S.zones[0].woods[0].cells[0].t!==null && S.totalHarvest===0 && S.coins===0);
  // 休息时段：不自动收
  S.pomo.running=true; S.pomo.mode='break'; S.pomo.end=now()+60*60000;
  S.zones[0].woods[0].cells[0]=mkMature();
  tick();
  check('休息时不自动收集', S.zones[0].woods[0].cells[0].t!==null && S.totalHarvest===0);
  check('休息时 autoCollectActive=false', autoCollectActive()===false);
  // 专注时段：成熟自动收（含未打开场地，静默收割）
  S.pomo.mode='focus'; S.pomo.end=now()+60*60000;
  tick();
  check('专注时成熟自动收集', S.zones[0].woods[0].cells[0].t===null && S.totalHarvest===1 && S.coins>=t16.v, JSON.stringify(S.zones[0].woods[0].cells[0])+' coins='+S.coins);
  check('专注时 autoCollectActive=true', autoCollectActive()===true);
  check('自动收集记录最近身高体重', (function(){ const rec=S.collection[t16.id]; return rec && rec.last && rec.last.h===5 && rec.last.w===5 && (openBook(), document.getElementById('modal-body').innerHTML.includes('📍 最近 5cm · 5g')); })());
  // 未成熟不自动收
  S.zones[0].woods[0].cells[0]={t:t16.id,start:now(),dur:t16.t*1000,h:5,w:5};
  tick();
  check('未成熟不自动收', S.zones[0].woods[0].cells[0].t!==null && S.totalHarvest===1);
  S.pomo.running=false;
  check('停止后 autoCollectActive=false', autoCollectActive()===false);

  // 16b. 番茄钟面板打开时：自动收集记入本轮 + 右上角记录；轮结束弹出汇总
  S.pomo=Object.assign({history:[]}, defaultState().pomo);
  S.coins=0; S.totalHarvest=0;
  S.zones[0].woods[0].cells=[mkMature()];
  S.pomo.running=true; S.pomo.mode='focus'; S.pomo.end=now()+60*60000;
  pomoModalOpen=true;
  tick();
  check('面板打开时自动收集记入本轮', S.pomo.roundItems.length===1 && S.pomo.roundItems[0].id===t16.id, JSON.stringify(S.pomo.roundItems));
  check('右上角记录出现', document.getElementById('collectFeed').children.length>=1, String(document.getElementById('collectFeed').children.length));
  check('无收获时汇总不弹', (function(){ document.getElementById('modal-body').innerHTML=''; S.pomo.roundItems=[]; pomoRoundSummary(); return !document.getElementById('modal-body').innerHTML.includes('本轮收获'); })());
  S.pomo.name='测试';
  S.pomo.roundItems=[{id:t16.id,name:t16.name,color:t16.color,val:10}];
  pomoRoundSummary();
  check('轮结束弹出收获汇总', document.getElementById('modalTitle').textContent.includes('本轮收获') && document.getElementById('modal-body').innerHTML.includes('共 1 个月巴'), document.getElementById('modalTitle').textContent+' | '+document.getElementById('modal-body').innerHTML);
  // 中途停止也弹汇总
  S.pomo.mode='focus'; S.pomo.running=true; S.pomo.total=60000; S.pomo.remain=30000; S.pomo.end=now()+30000;
  S.pomo.roundItems=[{id:t16.id,name:t16.name,color:t16.color,val:10}];
  pomoStop();
  check('中途停止也弹汇总', document.getElementById('modalTitle').textContent.includes('本轮收获'), document.getElementById('modalTitle').textContent);
  pomoModalOpen=false;

  // 16c. 番茄钟不足5分钟不记录（打卡/日历均读 history）
  S.pomo=Object.assign({history:[]}, defaultState().pomo);
  S.pomo.mode='focus'; S.pomo.running=true; S.pomo.total=60000; S.pomo.remain=30000; S.pomo.end=now()+30000; S.pomo.start=now()-30000;
  pomoStop();
  check('停止<5分钟不记录', S.pomo.history.length===0, JSON.stringify(S.pomo.history));
  S.pomo=Object.assign({history:[]}, defaultState().pomo);
  S.pomo.mode='focus'; S.pomo.running=true; S.pomo.total=10*60000; S.pomo.remain=60000; S.pomo.end=now()+60000; S.pomo.start=now()-9*60000;
  pomoStop();
  check('停止>=5分钟记录', S.pomo.history.length===1 && S.pomo.history[0].d===9*60000, JSON.stringify(S.pomo.history));

  // 16d. 置顶小窗（Document PiP）：测试环境无 https/API，应优雅降级不抛错
  check('supportsPiP 在测试环境为 false', supportsPiP()===false, String(supportsPiP()));
  check('非支持环境点击置顶不弹窗且不报错', (function(){ pipWin=null; pomopipToggle(); return pipWin===null; })());
  check('openPomoPiP 非支持环境安全', (function(){ pipWin=null; return (openPomoPiP(), pipWin===null); })());
  // 16e. 置顶小窗存在时，页面失焦不自动暂停
  check('无小窗时失焦仍自动暂停', (function(){ pipWin=null; S.pomo.running=true; S.pomo.mode='focus'; S.pomo.total=10*60000; S.pomo.remain=10*60000; S.pomo.end=now()+10*60000; pomoPause(true); const p=S.pomo.running===false && S.pomo.pausedByBlur===true; if(p){S.pomo.running=true; S.pomo.pausedByBlur=false; S.pomo.end=now()+S.pomo.remain;} return p; })());
  check('有置顶小窗时失焦不暂停(依赖 pipping)', (function(){ pipWin={closed:false}; const r=pipping()===true; pipWin=null; return r; })());
  check('小窗暂停/继续切换逻辑(使用主窗 pomoToggle)', (function(){
    S.pomo.running=true; S.pomo.total=60000; S.pomo.remain=30000; S.pomo.end=now()+30000;
    pomoToggle(); const paused=!S.pomo.running;
    return paused;
  })());
  S.pomo=Object.assign({history:[]}, defaultState().pomo);
  S.pomo.mode='focus'; S.pomo.running=true; S.pomo.total=2*60000; S.pomo.remain=2*60000; S.pomo.start=now()-2*60000; S.pomo.end=now()-1000;
  pomoComplete();
  check('完成<5分钟不记录', S.pomo.history.length===0, JSON.stringify(S.pomo.history));
  S.pomo=Object.assign({history:[]}, defaultState().pomo);
  S.pomo.mode='focus'; S.pomo.running=true; S.pomo.total=25*60000; S.pomo.remain=25*60000; S.pomo.start=now()-25*60000; S.pomo.end=now()-1000;
  pomoComplete();
  check('完成>=5分钟记录', S.pomo.history.length===1 && S.pomo.history[0].d===25*60000, JSON.stringify(S.pomo.history));

  // 17. 天气瓶：购买后自选天气
  S.boughtItems=[]; S.coins=1000;
  useWeather();
  check('天气瓶未持有先购买', S.boughtItems.includes('weather') && S.coins===500, 'coins='+S.coins);
  check('购买后打开自选面板', document.getElementById('modal-body').innerHTML.includes('wgrid') && document.getElementById('modalTitle').textContent.includes('天气瓶'));
  check('自选面板含5种天气', (function(){ const b=document.getElementById('modal-body').innerHTML; return ['sunny','cloudy','rain','storm','snow'].every(w=>b.includes("setWeather('"+w+"')")); })());
  S.weather='sunny'; S.lastRainAt=-1e12;
  setWeather('rain');
  check('setWeather 设为雨天', S.weather==='rain' && S.lastRainAt>0, S.weather);
  check('天气瓶效果持续2小时', Math.abs((S.nextWeatherAt-now())-2*3600*1000)<4000, (S.nextWeatherAt-now()));
  check('天气瓶倒计时出现', (function(){ updateWeatherHold(); const el=document.getElementById('weatherHold'); return el.style.display==='' && el.innerHTML.includes('剩余') && el.innerHTML.includes(fmtDur(S.weatherHoldEnd-now())); })());
  S.weatherHoldEnd=now()-1000;
  check('倒计时结束自动隐藏', (function(){ updateWeatherHold(); return document.getElementById('weatherHold').style.display==='none'; })());
  S.weatherHoldEnd=now()+WEATHER_HOLD;
  changeWeather(false);
  check('自然轮换清除倒计时', S.weatherHoldEnd===0);
  S.coins=500;
  useWeather();
  check('已持有不再扣费', S.coins===500 && S.boughtItems.length===1, 'coins='+S.coins+' n='+S.boughtItems.length);

  // 18. 场景按钮标注价格
  currentZone=0; S.boughtItems=[];
  updateSceneBar();
  const sWB=document.getElementById('sceneWoodBtn').textContent;
  const sWE=document.getElementById('sceneWeather').textContent;
  const sSF=document.getElementById('sceneFast').textContent;
  check('新木头标注价格', sWB.includes('新木头') && sWB.includes('🪙') && sWB.includes(String(woodCost(0,S.zones[0].woods.length))), sWB);
  check('快长肥标注价格', sSF.includes(String(FAST_COST)), sSF);
  check('天气瓶按钮标注价格', sWE.includes(String(WEATHER_COST)), sWE);
  S.boughtItems.push('weather');
  updateSceneBar();
  check('持有后场景按钮变自选', document.getElementById('sceneWeather').textContent.includes('自选天气'));
  S.boughtItems=[];

  // 20. 界面皮肤（图鉴解锁）
  check('默认皮肤始终可用', skinMet('default')===true);
  check('未达阈值不可用', (function(){ S.collection.mb_chun={count:499}; return skinMet('spring')===false; })());
  check('达阈值可领取', (function(){ S.collection.mb_chun={count:500}; return skinMet('spring')===true; })());
  check('useSkin 领取并启用', (function(){
    S.skins={unlocked:[],active:null};
    useSkin('spring');
    return S.skins.unlocked.includes('spring') && S.skins.active==='spring';
  })());
  check('applySkin 设置CSS变量', (function(){
    applySkin('winter');
    return document.documentElement.style.getPropertyValue('--bg')==='#f0f2f5';
  })());
  check('未达阈值 useSkin 不生效', (function(){
    S.skins={unlocked:[],active:null};
    S.collection.mb_xia={count:999};
    useSkin('summer');
    return !S.skins.unlocked.includes('summer') && S.skins.active===null;
  })());

  console.log(failures? '\\n❌ 失败数: '+failures : '\\n✅ 全部通过');
  return failures;
})();
`;
eval(js + '\n' + tests);
