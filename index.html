<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>放置月巴 🍄</title>
<style>
  /* ========== 主题：灰白 + 浅紫，磨砂玻璃 ========== */
  :root{
    --bg:#ece9f6; --bg2:#e2ddf2;
    --panel:#ffffff; --panel2:#f5f2fc;
    --line:#ddd6ef; --text:#413c5b; --dim:#8d86ab;
    --purple:#9575cd; --purple2:#7e57c2; --accent:#b39ddb;
    --gold:#c9971c; --good:#6fb26a; --danger:#e05b6f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;
    background:
      radial-gradient(900px 520px at 85% -8%, rgba(149,117,205,.20), transparent 60%),
      radial-gradient(800px 480px at -8% 108%, rgba(179,157,219,.22), transparent 60%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    color:var(--text); overflow-x:hidden; padding-bottom:92px;
  }
  /* 磨砂玻璃通用 */
  .frost{
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    border:1px solid rgba(255,255,255,.65);
    box-shadow:0 10px 32px rgba(100,80,160,.14);
  }
  #fx{position:fixed;inset:0;pointer-events:none;z-index:80;}
  #collectFeed{position:fixed;top:70px;right:12px;z-index:65;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;}
  .cf-item{font-size:12px;font-weight:800;color:var(--text);background:rgba(255,255,255,.9);
    backdrop-filter:blur(8px);border:1px solid rgba(149,117,205,.35);border-radius:99px;padding:5px 11px;
    box-shadow:0 4px 14px rgba(100,80,160,.14);display:flex;align-items:center;gap:6px;
    animation:cfin .28s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;}
  .cf-item.out{opacity:0;transform:translateY(-6px);transition:all .3s;}
  @keyframes cfin{0%{transform:translateY(-8px) scale(.8);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:0 0 auto;}
  .rsum{padding:4px 0;}
  .rsum-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--text);
    padding:7px 10px;border-radius:10px;background:rgba(149,117,205,.08);margin-bottom:6px;}
  .rsum-row b{margin-left:auto;color:var(--purple2);}
  .rsum-total{font-size:13px;font-weight:800;color:var(--purple2);text-align:center;margin:10px 0 12px;}

  #app{max-width:1020px;margin:0 auto;padding:10px 12px 24px;}

  /* ---------- 顶栏 ---------- */
  #topbar{
    position:sticky;top:8px;z-index:40;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    border-radius:16px;padding:10px 14px;
  }
  #topbar .title{font-weight:800;font-size:18px;letter-spacing:1px;color:var(--purple2);}
  #topbar .title span{color:var(--gold);}
  .coinbox{display:flex;align-items:center;gap:6px;font-weight:800;font-size:19px;color:var(--gold);}
  .coinbox .cico{font-size:20px;}
  .coinbox.pulse{animation:coinpop .35s ease;}
  @keyframes coinpop{0%{transform:scale(1.35);}100%{transform:scale(1);}}
  .chip{
    display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;
    border-radius:999px;padding:5px 12px;color:var(--text);
  }
  .collbox{flex:1;min-width:130px;}
  .collbox .top{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px;}
  .bar{height:9px;background:#e6e0f5;border-radius:99px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#b39ddb,#7e57c2);border-radius:99px;transition:width .4s ease;}
  .iconbtn{
    background:rgba(255,255,255,.65);border:1px solid var(--line);color:var(--purple2);
    border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;transition:.15s;
  }
  .iconbtn:hover{transform:translateY(-1px);border-color:var(--purple);}
  .iconbtn:active{transform:scale(.92);}

  /* ---------- 状态条 ---------- */
  #statusbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px;font-size:13px;}
  #statusbar .st{color:var(--text);border-radius:12px;padding:5px 12px;display:inline-flex;align-items:center;gap:5px;font-weight:600;}

  /* ---------- 场地卡片（总览） ---------- */
  .zonegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px;}
  .zcard{
    position:relative;border-radius:18px;overflow:hidden;cursor:pointer;aspect-ratio:4/3;
    border:1px solid var(--line);box-shadow:0 8px 24px rgba(100,80,160,.10);
    transition:transform .18s;
  }
  .zcard:hover{transform:translateY(-3px);}
  .zcard:active{transform:scale(.97);}
  .zcard .zbg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .35s;}
  .zcard:hover .zbg{transform:scale(1.08);}
  .zcard .zover{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.05) 30%,rgba(235,228,250,.78));}
  .zcard .zinfo{
    position:absolute;left:8px;right:8px;bottom:8px;border-radius:14px;
    padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .zcard .zn{font-weight:800;font-size:14px;color:var(--purple2);}
  .zcard .zs{font-size:11px;color:var(--dim);margin-top:1px;}
  .zcard .zb{font-size:12px;font-weight:800;color:var(--purple2);white-space:nowrap;}
  .zcard.locked .zover{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(220,214,240,.85));}
  .zcard .lock{position:absolute;top:10px;right:10px;font-size:16px;background:rgba(255,255,255,.75);
    border-radius:99px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;}

  /* ---------- 底部 dock ---------- */
  #weatherHold{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:45;
    font-size:12px;font-weight:800;color:var(--purple2);
    background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border:1px solid rgba(149,117,205,.35);border-radius:99px;padding:6px 14px;
    box-shadow:0 4px 14px rgba(100,80,160,.14);white-space:nowrap;
    animation:whpop .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes whpop{0%{transform:translate(-50%,6px) scale(.8);opacity:0;}100%{transform:translate(-50%,0) scale(1);opacity:1;}}
  #dock{
    position:fixed;left:12px;right:12px;bottom:12px;z-index:40;
    display:flex;justify-content:center;gap:8px;flex-wrap:wrap;border-radius:18px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .dockbtn{
    background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--purple2);
    border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;
    display:inline-flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;transition:.15s;
  }
  .dockbtn b{font-size:17px;}
  .dockbtn small{font-size:10px;color:var(--dim);font-weight:600;}
  .dockbtn:hover{transform:translateY(-2px);border-color:var(--purple);}
  .dockbtn:active{transform:scale(.93);}
  .dockbtn.cta{background:linear-gradient(180deg,#ffe9a8,#f2c94c);color:#6b4e00;border-color:#e6c04a;}

  /* ========== 场地场景视图 ========== */
  #scene{position:fixed;inset:0;z-index:55;display:none;}
  #scene.show{display:block;}
  #scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;}
  #scene .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.06));}
  #scene .sbar{
    position:absolute;top:10px;left:10px;right:10px;z-index:5;border-radius:16px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;
  }
  #scene .sbar .sname{font-weight:800;font-size:15px;color:var(--purple2);flex:1;min-width:90px;}
  #scene .sbar .btn{padding:6px 10px;font-size:12px;}
  #sceneWoods{position:absolute;inset:0;z-index:3;}

  .wood{position:absolute;height:150px;transform-origin:center;transition:opacity .3s;}
  .wood.pop{animation:woodpop .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes woodpop{0%{transform:scale(.6);}100%{transform:scale(1);}}
  .wimg{position:absolute;left:0;right:0;bottom:0;height:46px;border-radius:14px;z-index:1;
    background-size:cover;background-position:center;
    box-shadow:inset 0 3px 8px rgba(120,90,60,.25), inset 0 -5px 10px rgba(0,0,0,.18);}
  .wslots{position:absolute;left:0;right:0;bottom:46px;height:70px;z-index:4;}
  .wcell{
    position:absolute;width:42px;height:56px;transform-origin:50% 100%;z-index:4;
    cursor:pointer;border:none;background:transparent;padding:0;
  }
  .wcell .spr{position:absolute;left:0;top:0;width:100%;height:100%;}
  .wcell .pg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:34px;height:4px;
    background:rgba(255,255,255,.55);border-radius:99px;overflow:hidden;box-shadow:0 1px 2px rgba(90,70,150,.2);}
  .wcell .pg i{display:block;height:100%;background:linear-gradient(90deg,#b39ddb,#7e57c2);width:0%;}
  .wcell .val{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;
    color:var(--gold);text-shadow:0 1px 2px rgba(255,255,255,.8);white-space:nowrap;}
  .wcell.grow .spr{animation:bob 2.4s ease-in-out infinite;}
  .wcell.mature .spr{animation:readyBounce .5s cubic-bezier(.34,1.56,.64,1);}
  .wcell.mature:hover .spr{transform:scale(1.1);}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  @keyframes readyBounce{0%{transform:scale(.4);}60%{transform:scale(1.2);}100%{transform:scale(1);}}
  .scenefoot{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;
    border-radius:99px;padding:6px 14px;font-size:12px;color:var(--dim);font-weight:600;white-space:nowrap;
  }

  /* ---------- 按钮 ---------- */
  .btn{
    background:linear-gradient(180deg,#ffffff,#efeafc);color:var(--purple2);
    border:1px solid var(--line);border-radius:11px;padding:7px 12px;
    font-size:13px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .btn:hover{transform:translateY(-1px);border-color:var(--purple);}
  .btn:active{transform:scale(.95);}
  .btn.gold{background:linear-gradient(180deg,#ffe9a8,#f2c94c);color:#6b4e00;border-color:#e6c04a;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;border-color:var(--line);}

  /* ---------- 弹窗（磨砂玻璃） ---------- */
  #overlay{position:fixed;inset:0;background:rgba(90,70,150,.28);z-index:60;display:none;align-items:center;justify-content:center;padding:14px;}
  #overlay.show{display:flex;}
  #modal{
    border-radius:20px;max-width:700px;width:100%;
    max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
    animation:popin .25s ease;
  }
  @keyframes popin{0%{transform:scale(.86);opacity:0;}100%{transform:scale(1);opacity:1;}}
  #modal-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(149,117,205,.18);}
  #modal-head h2{font-size:16px;color:var(--purple2);}
  #modal-body{padding:14px;overflow-y:auto;}

  /* 图鉴 */
  .book{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;}
  .bcard{background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;}
  .bcard .pic{height:52px;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .bcard .pic svg{width:42px!important;height:42px!important;}
  .ybimg{width:100%;height:100%;object-fit:contain;display:block;}
  .bcard .pic .ybimg{width:48px;height:48px;}
  .bcard .nm{font-size:12px;font-weight:800;color:var(--purple2);margin-top:2px;}
  .bcard .cnt{font-size:11px;color:var(--dim);}
  .bcard .stats{font-size:10px;color:var(--dim);margin-top:4px;line-height:1.5;text-align:left;background:rgba(149,117,205,.08);border-radius:8px;padding:4px 6px;}
  .bcard .stats b{color:var(--purple2);}
  .bcard .stats .gold{color:var(--gold);font-weight:900;}
  .bcard .cd{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.3;}
  .bcard.allgold{background:linear-gradient(180deg,rgba(255,239,181,.75),rgba(255,224,130,.7));
    border-color:#e6b84c;animation:goldbox 1.8s ease-in-out infinite;}
  .bcard.allgold .cd{color:#8a6a00;font-weight:800;}
  @keyframes goldbox{0%,100%{box-shadow:0 0 8px rgba(245,200,60,.6),0 0 0 1.5px rgba(230,184,76,.9);}
    50%{box-shadow:0 0 20px rgba(255,215,70,.95),0 0 30px rgba(255,190,50,.55),0 0 0 2px rgba(230,184,76,1);}}
  .bcard.locked{opacity:.65;filter:saturate(0);}
  .bcard.locked .nm{color:var(--dim);}
  .bcard.epic{box-shadow:0 0 0 1px #b39ddb;}
  .bcard.legend{box-shadow:0 0 12px rgba(149,117,205,.5),0 0 0 1px #9575cd;}
  .rar-tag{font-size:9px;font-weight:800;padding:1px 6px;border-radius:99px;color:#fff;}
  .rr1{background:#a5a0bd;} .rr2{background:#6fb26a;} .rr3{background:#4fa8c9;}
  .rr4{background:#9575cd;} .rr5{background:#7e57c2;} .rr6{background:#e05b6f;}

  /* 商店 */
  .shoprow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;}
  .shoprow .ico{font-size:26px;width:44px;text-align:center;}
  .shoprow .info{flex:1;}
  .shoprow .info .t{font-weight:800;font-size:14px;color:var(--purple2);}
  .shoprow .info .d{font-size:12px;color:var(--dim);margin-top:2px;}
  .shoprow .btn{flex-shrink:0;}
  .shoprow.owned{border-color:rgba(111,178,106,.6);}
  .shoprow.owned .t::after{content:' ✓';color:var(--good);}
  .hintline{font-size:12px;color:var(--dim);margin:4px 0 10px;line-height:1.5;}

  /* 横幅 / 提示 */
  #banner{
    position:fixed;top:14%;left:50%;transform:translateX(-50%) scale(.6);z-index:85;
    background:linear-gradient(180deg,#f1ecfb,#e4dcf5);border:2px solid var(--purple);border-radius:18px;
    padding:14px 26px;text-align:center;opacity:0;pointer-events:none;
    box-shadow:0 0 40px rgba(149,117,205,.5);width:min(320px,86vw);color:var(--text);
  }
  #banner.show{animation:bannerin 4s ease forwards;}
  @keyframes bannerin{
    0%{opacity:0;transform:translateX(-50%) scale(.5);}
    12%{opacity:1;transform:translateX(-50%) scale(1.05);}
    20%{transform:translateX(-50%) scale(1);}
    82%{opacity:1;transform:translateX(-50%) scale(1);}
    100%{opacity:0;transform:translateX(-50%) scale(.8);}
  }
  #banner .bt{font-size:13px;font-weight:800;color:var(--purple2);letter-spacing:2px;}
  #banner .pic{width:92px;height:92px;margin:6px auto;}
  #banner .bnm{font-size:22px;font-weight:900;color:var(--purple2);}
  #banner .bd{font-size:12px;color:var(--dim);margin-top:4px;}
  #banner .bn{font-size:13px;font-weight:800;color:var(--gold);margin-top:6px;}
  #toast{position:fixed;left:50%;bottom:106px;transform:translateX(-50%);z-index:90;
    background:rgba(65,60,91,.92);color:#fff;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;
    opacity:0;pointer-events:none;transition:opacity .3s;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  #toast.show{opacity:1;}

  /* ---------- 番茄钟 ---------- */
  .pomo-wrap{text-align:center;}
  .pomo-hero{position:relative;width:216px;height:216px;margin:6px auto 2px;}
  .pomo-ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .pomo-ring .ring-bg{fill:none;stroke:rgba(149,117,205,.15);stroke-width:11;}
  .pomo-ring .ring-fg{fill:none;stroke:url(#pomoGrad);stroke-width:11;stroke-linecap:round;
    stroke-dasharray:553;stroke-dashoffset:0;transition:stroke-dashoffset .5s linear;}
  .pomo-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
  .pomo-name{font-size:14px;font-weight:800;color:var(--purple2);display:flex;align-items:center;gap:4px;}
  .pomo-time{font-size:46px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;
    letter-spacing:1px;line-height:1.05;}
  .pomo-state{font-size:12px;font-weight:700;color:#e57373;background:rgba(229,115,115,.12);
    border:1px solid rgba(229,115,115,.3);border-radius:999px;padding:2px 10px;}
  .pomo-state.brk{color:#43a047;background:rgba(102,187,106,.14);border-color:rgba(102,187,106,.35);}
  .pomo-state.rdy{color:var(--dim);background:rgba(149,117,205,.08);border-color:rgba(149,117,205,.2);}
  .pomo-sec{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--dim);
    letter-spacing:1px;margin:13px 0 4px;}
  .pomo-sec::before,.pomo-sec::after{content:'';flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(149,117,205,.35),transparent);}
  .pomo-presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0;}
  .preset-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--purple2);
    background:rgba(255,255,255,.65);border:1px solid rgba(149,117,205,.35);border-radius:999px;padding:5px 12px;cursor:pointer;
    box-shadow:0 2px 6px rgba(100,80,160,.06);transition:.15s;}
  .preset-chip:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(100,80,160,.14);}
  .preset-chip.on{background:linear-gradient(180deg,#b39ddb,#9575cd);color:#fff;border-color:var(--purple);}
  .preset-chip .del{font-size:10px;color:inherit;opacity:.7;margin-left:2px;}
  .preset-chip .del:hover{opacity:1;}
  .pomo-none{font-size:11px;color:var(--dim);}
  .pomo-name-in{margin:4px 0;}
  .pomo-name-in input{
    width:100%;max-width:280px;text-align:center;border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;font-size:14px;font-weight:700;color:var(--text);background:rgba(255,255,255,.8);
    outline:none;user-select:text;transition:.15s;}
  .pomo-name-in input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(149,117,205,.15);}
  .pomo-sec-row{display:flex;align-items:center;justify-content:space-between;margin:13px 0 4px;}
  .pomo-sec-lbl{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:1px;}
  .pomo-sec-row .btn{padding:6px 14px;font-size:12px;min-width:0;}
  .pomo-slider{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px auto 2px;max-width:300px;}
  .pomo-slider input[type=range]{flex:1;accent-color:var(--purple);height:6px;cursor:pointer;}
  .pomo-slider b{font-size:14px;color:var(--purple2);min-width:46px;text-align:left;}
  .pomo-row{display:flex;gap:8px;justify-content:center;margin-top:6px;}
  .pomo-row input{flex:1;max-width:170px;text-align:center;border:1px solid var(--line);border-radius:11px;
    padding:10px 10px;font-size:13px;font-weight:700;color:var(--text);background:rgba(255,255,255,.8);outline:none;}
  .pomo-row input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(149,117,205,.15);}
  .pomo-row .btn{padding:8px 14px;font-size:13px;}
  .pomo-quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0;}
  .seg{min-width:56px;font-size:13px;font-weight:800;color:var(--purple2);background:rgba(255,255,255,.65);
    border:1px solid rgba(149,117,205,.3);border-radius:999px;padding:8px 14px;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(100,80,160,.05);}
  .seg:hover{border-color:var(--purple);}
  .seg.on{background:linear-gradient(180deg,#b39ddb,#9575cd);color:#fff;border-color:var(--purple);
    box-shadow:0 4px 12px rgba(149,117,205,.35);}
  .pomo-lbl{font-size:12px;font-weight:700;color:var(--dim);align-self:center;}
  .pomo-lbl b{color:var(--purple2);font-size:14px;}

}

const SAVE_KEY='idle-yueba-save-v2';

function defaultState(){
  return {

    weather:'sunny', lastRainAt:-1e12, weatherHoldEnd:0,
    nextWeatherAt:now()+rand(2,4)*60000, muted:false, lastSave:now(),

      history:[], presets:['工作','学习'], mode:'focus', breakMin:5, focusTotal:25*60000, roundItems:[]},
    zones:ZONES.map((z,i)=>({id:i, bought:i===0, woods: i===0?[{cells:[null,null,null]}]:[]})),
  };
}
function save(){ S.lastSave=now(); try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem(SAVE_KEY)||localStorage.getItem('idle-yueba-save-v1');
    if(raw){
      const d=JSON.parse(raw);
      // 迁移旧版存档：collection 由 {id:数量} 升级为 {id:{count,极值}}
      if(d.collection) for(const k in d.collection){
        if(typeof d.collection[k]==='number') d.collection[k]={count:d.collection[k]};
      }
      // 迁移旧版生长时长单位（秒 -> 毫秒）
      if(d.zones) for(const z of d.zones) for(const w of (z.woods||[])) for(const c of w.cells){
        if(c && c.t && c.dur && c.dur<10000) c.dur=c.dur*(1000/BASE_SPEED);
      }
      S=Object.assign(defaultState(),d);
      // 深合并番茄钟字段，旧存档缺少 presets/mode/breakMin/focusTotal 时补默认值
      S.pomo=Object.assign(defaultState().pomo, d.pomo||{});
      return true;
    }
  }catch(e){}
  S=defaultState();
  return false;
}
function speedMult(){ return (1+S.accelLv*0.1) * (S.pomo && S.pomo.running && S.pomo.mode==='focus' ? 2 : 1); }

function woodCost(z,w){ const zone=ZONES[z]; return Math.round(zone.woodBase*Math.pow(zone.woodMult,w)); }
function slotCost(z,w){ const slots=S.zones[z].woods[w].cells.length; return Math.round(120*Math.pow(1.9,slots-1)); }
function accelCost(){ return Math.round(ACCEL_BASE*Math.pow(ACCEL_MULT,S.accelLv)); }

/* ---------------- 时间/季节/天气 ---------------- */
/* 虚拟游戏时钟：约 2 现实小时 = 1 游戏年（季节/昼夜/时间条件都走虚拟时钟）
   天气变化维持原速（现实 8~18 分钟），番茄钟仍按现实时间 */
const VIRT_MS_PER_REAL_MS=4383; // 365.25天*24h*3600s*1000 / (2h*3600s*1000)
function gameNow(){ return new Date((S.gameEpoch||now()) + (now()-S.gameStart)*VIRT_MS_PER_REAL_MS); }
function seasonOf(d){
  const m=d.getMonth()+1;
  if(m>=3&&m<=5)return 'spring';
  if(m>=6&&m<=8)return 'summer';
  if(m>=9&&m<=11)return 'autumn';
  return 'winter';
}
const SEASON_NAME={spring:'🌱 春季',summer:'☀️ 夏季',autumn:'🍂 秋季',winter:'❄️ 冬季'};
function condOk(c){
  if(!c)return true;
  const d=gameNow(), h=d.getHours();
  switch(c.t){
    case 'day': return h>=6&&h<18;
    case 'night': return !(h>=6&&h<18);
    case 'time': { if(c.a<=c.b)return h>=c.a&&h<c.b; return h>=c.a||h<c.b; }
    case 'weather': {
      if(S.weather!==c.w) return false;
      if(c.night && h>=6&&h<18) return false;
      if(c.day && !(h>=6&&h<18)) return false;
      return true;
    }
    case 'rainbow': return S.weather==='sunny' && (now()-S.lastRainAt<30*60000);
    case 'season': return seasonOf(d)===c.s && (c.night? !(h>=6&&h<18):true) && (c.day? (h>=6&&h<18):true);
    case 'zone': return !!(S.zones[c.z-1]&&S.zones[c.z-1].bought);
    case 'item': return S.boughtItems.includes(c.i);
    case 'harvest': return S.totalHarvest>=c.n;
    case 'count': return colCount(c.id)>=c.n;
  }
  return false;
}
function condText(c){
  if(!c)return '随时可长';
  switch(c.t){
    case 'day': return '白天(6-18点)';
    case 'night': return '夜晚(18-6点)';
    case 'time': return c.a<=c.b? `${c.a}:00-${c.b}:00` : `${c.a}:00-次日${c.b}:00`;
    case 'weather': return ({sunny:'晴天',cloudy:'多云',rain:'雨天',storm:'暴雨',snow:'下雪'})[c.w];
    case 'rainbow': return '雨后天晴';
    case 'season': return ({spring:'春季',summer:'夏季',autumn:'秋季',winter:'冬季'})[c.s]+(c.night?'(夜晚)':'')+(c.day?'(白天)':'');
    case 'zone': return `需要「${ZONES[c.z-1].name}」`;
    case 'item': return `需要道具「${ITEMS.find(i=>i.id===c.i).name}」`;
    case 'harvest': return `累计收获 ${c.n} 次`;
    case 'count': { const t=TYPES.find(x=>x.id===c.id); return `收获「${t.name}」${c.n} 次`; }
  }
  return '';
}

/* ---------------- 天气模拟 ---------------- */
function changeWeather(force){
  const gd=gameNow(), nowH=gd.getHours(), sea=seasonOf(gd);
  const seq=['sunny','cloudy','rain','storm','cloudy','sunny'];
  let idx=seq.indexOf(S.weather);
  if(force){
    S.weather=pick(['sunny','cloudy','rain','storm','snow']);
  }else{
    S.weatherHoldEnd=0; // 自然轮换时清除天气瓶倒计时
    let next=seq[clamp(idx+randi(1,2),0,seq.length-1)];
    if(sea==='winter' && next!=='sunny' && Math.random()<0.4) next='snow';
    if(nowH>=19||nowH<5){ if(next==='storm')next='cloudy'; }
    S.weather=next;
  }
  if(S.weather==='rain'||S.weather==='storm') S.lastRainAt=now();
  S.nextWeatherAt=now()+rand(8,18)*60000;
}
function weatherTick(){
  if(now()>=S.nextWeatherAt) changeWeather(false);
}

/* ---------------- 音频（WebAudio 合成） ---------------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq,dur,type,vol,when,slide){
  if(S.muted)return; const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain();
  const t0=c.currentTime+(when||0);
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t0+dur);
  g.gain.setValueAtTime(vol||0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sfx={
  click(){ tone(720,0.05,'square',0.05); },

  harvest(combo){ const p=440+clamp(combo,0,60)*18; tone(p,0.09,'triangle',0.18); tone(p*1.5,0.12,'triangle',0.14,0.05); },
  coin(){ tone(880,0.07,'sine',0.1); tone(1318,0.09,'sine',0.08,0.05); },
  ready(){ tone(660,0.14,'sine',0.05); },
  reveal(){ tone(880,0.12,'triangle',0.1); tone(1320,0.16,'triangle',0.08,0.08); },

const fx=[]; const cv=$('fx'), ctx=cv.getContext('2d');
function resizeFx(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener('resize',resizeFx); resizeFx();
function burst(x,y,colors,n,speed){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), sp=rand(1,speed);
    fx.push({k:'p',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rand(0,1),g:0.06,life:rand(40,70),c:colors[i%colors.length],s:rand(2,5),r:rand(0,Math.PI),vr:rand(-.2,.2)});
  }
}
function coinFly(x,y,target){
  fx.push({k:'c',x,y,tx:target.x,ty:target.y,t0:now(),dur:700,life:40});
}
function floatText(x,y,text,color,big){
  fx.push({k:'t',x,y,text,color,c0:1,big:big||false,vy:-0.9,life:70});
}
function fxLoop(){
  requestAnimationFrame(fxLoop);
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(let i=fx.length-1;i>=0;i--){
    const p=fx[i]; p.life--;
    if(p.life<=0){ fx.splice(i,1); continue; }
    if(p.k==='p'){
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.globalAlpha=clamp(p.life/50,0,1);
      ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s); ctx.restore();
    }else if(p.k==='c'){
      const t=clamp((now()-p.t0)/p.dur,0,1);
      const e=1-Math.pow(1-t,3);
      const x=p.x+(p.tx-p.x)*e, y=p.y+(p.ty-p.y)*e-20*Math.sin(Math.PI*t);
      ctx.globalAlpha=clamp(p.life/25,0,1);
      ctx.fillStyle='#e6c44c'; ctx.beginPath(); ctx.arc(x,y,4.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#c9a227'; ctx.beginPath(); ctx.arc(x,y,2.2,0,Math.PI*2); ctx.fill();
    }else if(p.k==='t'){
      p.y+=p.vy;
      ctx.globalAlpha=clamp(p.life/40,0,1)*p.c0;
      ctx.font=(p.big?'800 24px':'800 16px')+' "Segoe UI","Microsoft YaHei",sans-serif';
      ctx.textAlign='center';
      ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.strokeText(p.text,p.x,p.y);
      ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y);
    }
  }
}
fxLoop();

function shapeBody(sh,c,dk,lt){
  const f=`fill="${c}"`, s=`stroke="${dk}" stroke-width="1.4"`;
  switch(sh){
    case 'round':  return `<circle cx="20" cy="21" r="13" ${f} ${s}/>`;
    case 'tall':   return `<ellipse cx="20" cy="22" rx="9.5" ry="14" ${f} ${s}/>`;
    case 'wide':   return `<ellipse cx="20" cy="22" rx="15" ry="10.5" ${f} ${s}/>`;
    case 'squish': return `<ellipse cx="20" cy="24" rx="13.5" ry="9" ${f} ${s}/>`;
    case 'cube':   return `<rect x="8" y="9" width="24" height="25" rx="5" ${f} ${s}/>`;
    case 'big':    return `<ellipse cx="20" cy="22" rx="16" ry="13" ${f} ${s}/>`;
    case 'bean':   return `<circle cx="15.5" cy="22" r="9.5" ${f} ${s}/><circle cx="24.5" cy="22" r="9.5" ${f} ${s}/>`;
    case 'heart':  return `<path d="M20 32 C10 24 6 17 9 12 C12 7.5 17 8 20 12 C23 8 28 7.5 31 12 C34 17 30 24 20 32 Z" ${f} ${s}/>`;
    case 'drop':   return `<path d="M20 7 C26 15 29 20 29 25 A9 9 0 1 1 11 25 C11 20 14 15 20 7 Z" ${f} ${s}/>`;
    case 'star':   return `<path d="M20 8 L23.6 16.8 L32.6 17.2 L25.6 22.9 L28.4 31.4 L20 26.6 L11.6 31.4 L14.4 22.9 L7.4 17.2 L16.4 16.8 Z" ${f} ${s}/>`;
    case 'spike':  return `<circle cx="20" cy="25" r="10" ${f} ${s}/><path d="M14 11 L16 4 L20 10 L24 3 L27 11 L25 14 L15 14 Z" ${f} ${s}/>`;
    case 'crown':  return `<circle cx="20" cy="25" r="11" ${f} ${s}/><path d="M13 13 L16 6 L20 11 L24 5 L27 12 Z" ${f} ${s}/>`;
    case 'moon':   return `<path d="M27 5 A14 14 0 1 0 27 35 A11 11 0 1 1 27 5 Z" ${f} ${s}/>`;
    case 'ghost':  return `<path d="M8 12 A12 12 0 0 1 32 12 L32 30 L27 25 L22 30 L17 25 L12 30 L8 26 Z" ${f} ${s}/>`;
    case 'rainbow':return `<path d="M12 27 A10 10 0 0 1 28 27 L25 27 A7 7 0 0 0 15 27 Z" ${f} ${s}/>`;
    case 'chaos':  return `<circle cx="20" cy="21" r="12.5" ${f} ${s}/>`;
    default:       return `<circle cx="20" cy="21" r="13" ${f} ${s}/>`;
  }
}
function fatSVG(type){
  if(type.img){ // 外链 PNG（玩家不可见，仅代码内配置），未配置则走默认 SVG
    return `<img class="fat ybimg" src="${type.img}" alt="">`;
  }
  const h=hashStr(type.id), c=type.color, dk=shade(c,-26);
  const body=shapeBody(type.shape||'round',c,dk,shade(c,26));
  const eye=(h%4), mouth=((h>>2)%4);
  const ex1=type.shape==='tall'?11:type.shape==='wide'?12:10;
  const ex2=30-ex1;
  let eyes, mm;
  if(eye===0) eyes=`<circle cx="${ex1}" cy="18" r="2.4" fill="#3b3654"/><circle cx="${ex2}" cy="18" r="2.4" fill="#3b3654"/>`;
  else if(eye===1) eyes=`<ellipse cx="${ex1}" cy="18" rx="2.5" ry="3" fill="#3b3654"/><ellipse cx="${ex2}" cy="18" rx="2.5" ry="3" fill="#3b3654"/>`;
  else if(eye===2) eyes=`<path d="M${ex1} 15.5 l2.4 2.5 l-2.4 2.5 l-2.4 -2.5 z" fill="#3b3654"/><path d="M${ex2} 15.5 l2.4 2.5 l-2.4 2.5 l-2.4 -2.5 z" fill="#3b3654"/>`;
  else eyes=`<path d="M${ex1-2} 18 h4 M${ex2-2} 18 h4" stroke="#3b3654" stroke-width="1.8" stroke-linecap="round"/>`;
  if(mouth===0) mm=`<path d="M14 23.5 Q17 27 20 23.5 Q23 27 26 23.5" stroke="#3b3654" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  else if(mouth===1) mm=`<circle cx="20" cy="24.5" r="2.4" fill="#3b3654"/>`;
  else if(mouth===2) mm=`<path d="M15 25.5 Q20 29 25 25.5 L25 26.5 Q20 30 15 26.5 Z" fill="#3b3654"/>`;
  else mm=`<path d="M15 26 Q20 24.5 25 26" stroke="#3b3654" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
  const hi=`<circle cx="13.5" cy="10.5" r="2.1" fill="rgba(255,255,255,.5)"/>`;
  return `<svg viewBox="0 0 40 40" class="fat" style="width:100%;height:100%">${body}${eyes}${mm}${hi}</svg>`;
}

function hScale(h){ return clamp(0.7+(h-2)/38,0.7,1.7); }

/* ---------------- 图鉴数据（含极值） ---------------- */
function colGet(id){ if(!S.collection[id]) S.collection[id]={count:0}; return S.collection[id]; }
function colCount(id){ return (S.collection[id]&&S.collection[id].count)||0; }
const EXTREME_MIN_H=3; // 极值记录最小现实间隔（小时）：约 8 小时刷出 1~3 个
function recordExtremes(id,h,w){
  const nr=now();
  // 极值低频化：两次极值记录之间至少间隔 EXTREME_MIN_H 现实小时，约 8 小时刷出 1~3 个
  if(S.lastExtreme && nr-S.lastExtreme < EXTREME_MIN_H*3600000) return [];
  const c=colGet(id), beats=[];
  if(!c.tallest  || h>c.tallest.v)  { c.tallest ={v:h,t:nr}; beats.push('最高'); }
  if(!c.shortest || h<c.shortest.v){ c.shortest={v:h,t:nr}; beats.push('最矮'); }
  if(!c.heaviest || w>c.heaviest.v){ c.heaviest={v:w,t:nr}; beats.push('最重'); }
  if(!c.lightest || w<c.lightest.v){ c.lightest={v:w,t:nr}; beats.push('最轻'); }
  if(beats.length) S.lastExtreme=nr;
  return beats;
}
function rollStats(r){
  const [ha,hb]=R_H[r], [wa,wb]=R_W[r];
  return {h:+rand(ha,hb).toFixed(1), w:+rand(wa,wb).toFixed(1)};
}

/* ---------------- 核心逻辑：生长 / 收获 ---------------- */
function availableTypes(){ return TYPES.filter(t=>condOk(t.cond)); }
function weightOf(t){ return t.weight!=null?t.weight:({1:100,2:45,3:14,4:4,5:1.2,6:0.9}[t.r]||1); }
function weightedPick(list){
  let sum=0; for(const t of list) sum+=weightOf(t);
  let r=Math.random()*sum;
  for(const t of list){ r-=weightOf(t); if(r<=0)return t; }
  return list[list.length-1];
}
const BASE_SPEED=0.5; // 全部月巴基础生长速度（倍）：0.5 倍时间，即生长时长翻倍
function spawnIn(zone,wood,cell){
  const t=weightedPick(availableTypes());
  const st=rollStats(t.r);
  cell.t=t.id; cell.start=now(); cell.dur=t.t*(1000/BASE_SPEED); cell.h=st.h; cell.w=st.w; cell.delay=0;
}
function cellRemaining(cell){ return (cell.dur/speedMult())-(now()-cell.start); }
function cellReady(cell){ return cell.t && cellRemaining(cell)<=0; }
function cellStage(cell){
  if(!cell||!cell.t)return 'empty';
  if(cellReady(cell))return 'mature';
  const p=clamp((now()-cell.start)/(cell.dur/speedMult()),0,1);
  return p<0.34?'baby':'grow';
}

function addCoins(n){
  S.coins+=n;
  const el=$('coinbox'); el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  $('coinTxt').textContent=fmt(S.coins);
}
function doHarvest(z,w,i,cell,el,quiet){
  const type=TYPES.find(x=>x.id===cell.t);
  const isNew=!S.collection[type.id];
  if(!cell.h||!cell.w){ const st=rollStats(type.r); cell.h=st.h; cell.w=st.w; }
  const beats=recordExtremes(type.id,cell.h,cell.w);
  const val=Math.round(type.v*(isNew?3:1));
  addCoins(val);
  S.totalHarvest++;
  colGet(type.id).count++;
  // 特效（非可见槽位自动收集时跳过；静默自动收集时不出声）
  if(el){
    const r=el.getBoundingClientRect();
    const x=r.left+r.width/2, y=r.top+r.height/2;
    const col=[type.color,shade(type.color,20),'#e6c44c'];
    burst(x,y,col,isNew?26:14,isNew?5:3.4);
    floatText(x,y-8,`+${fmt(val)} 🪙 · ${cell.h}cm`,isNew?'#e6c44c':'#7e57c2');
    coinFly(x,y,coinTarget());
    if(!quiet) sfx.harvest(0);
  }
  if(beats.length) toast(`📐 新纪录！「${type.name}」${beats.join('、')} ${cell.h}cm / ${cell.w}g`);
  if(isNew){ unlockBanner(type,cell); if(!quiet) sfx.unlock(); } else if(!quiet) sfx.coin();
  cell.t=null; cell.delay=now()+rand(900,2600);
  updateHeader();
  renderCell(z,w,i);
  return {id:type.id,name:type.name,color:type.color,val};
}
function unlockBanner(type,cell){
  $('bannerPic').innerHTML=fatSVG(type);

}

let currentZone=-1;
function openScene(z){

function closeScene(){ $('scene').classList.remove('show'); currentZone=-1; for(const k in cellEls) delete cellEls[k]; }
function woodSpot(z,wi){
  const spots=ZONES[z].spots;
  const base=spots[wi%spots.length];
  const extra=Math.floor(wi/spots.length);
  // 限制最低位置，避免手机端木头/月巴被屏幕底缘遮挡
  return {l:base[0], t:Math.min(base[1]+extra*2, 70)};
}
function renderSceneWoods(){
  const wrap=$('sceneWoods');
  let html='';
  for(let w=0;w<S.zones[currentZone].woods.length;w++){

      html+=`<button class="wcell" id="cell-${currentZone}-${w}-${i}" data-z="${currentZone}" data-w="${w}" data-i="${i}"

    }
    html+=`</div>
      <div class="wimg" style="background-image:url('${WOOD_IMG}'),linear-gradient(180deg,#cdb9e6,#a58fd0)"></div>
    </div>`;
  }
  wrap.innerHTML=html;
  // 重建 cell 引用
  for(const k in cellEls) delete cellEls[k];
  for(let w=0;w<S.zones[currentZone].woods.length;w++){
    const wood=S.zones[currentZone].woods[w];
    for(let i=0;i<wood.cells.length;i++){
      const el=document.getElementById(`cell-${currentZone}-${w}-${i}`);
      if(el){ cellEls[`${currentZone}-${w}-${i}`]=el; renderCell(currentZone,w,i); }
    }

  const last=wrap.querySelectorAll('.wood'); if(last.length) last[last.length-1].classList.add('pop');
}
function renderCell(z,w,i){
  const cell=S.zones[z].woods[w].cells[i];
  const el=cellEls[`${z}-${w}-${i}`];
  if(!el)return;
  if(cell && cell.t){
    const stage=cellStage(cell);
    if(stage==='mature'){
      const type=TYPES.find(x=>x.id===cell.t);
      const s=hScale(cell.h)*(type.size||1);
      el.className='wcell mature';
      el.innerHTML=`<span class="spr" style="transform:scale(${s})">${fatSVG(type)}</span>
        <span class="val">+${fmt(type.v)}</span>`;
      el.title=`${type.name} · ${cell.h}cm · ${cell.w}g`;
    }else{
      const s=stage==='baby'?0.62:0.88;
      const p=clamp((now()-cell.start)/(cell.dur/speedMult()),0,1);
      el.className='wcell grow';
      el.innerHTML=`<span class="spr" style="transform:scale(${s})">${sproutSVG()}</span>
        <span class="pg"><i style="width:${p*100}%"></i></span>`;
      el.title='生长中…';
    }
  }else if(cell && cell.delay){
    el.className='wcell';
    el.innerHTML=`<span class="spr" style="transform:scale(.4);opacity:.35">${lockedSVG()}</span>`;
    el.title='';
  }else{
    el.className='wcell';
    el.innerHTML=''; el.title='';
  }
}
function clickCell(z,w,i){
  const cell=S.zones[z].woods[w].cells[i];
  if(cell&&cell.t&&cellReady(cell)){ doHarvest(z,w,i,cell,cellEls[`${z}-${w}-${i}`]); }

}

      const [hLo,hHi]=R_H[t.r], [wLo,wHi]=R_W[t.r];

      const gL=rec.lightest&&rec.lightest.v<=wLo+0.001;
      allGold=!!(gH&&gS&&gW&&gL);
      const ss=(e,k,unit)=>{ if(!e)return '--'; const txt=e.v+unit; return k?`<span class="gold">${txt}</span>`:txt; };
      stats=`<div class="stats">
        📏 最高 ${ss(rec.tallest, gH,'cm')} · ${rec.tallest?fmtTS(rec.tallest.t):''}<br>
        📏 最矮 ${ss(rec.shortest, gS,'cm')} · ${rec.shortest?fmtTS(rec.shortest.t):''}<br>

      </div>`;
    }
    rows+=`<div class="bcard ${c?'':'locked'} ${t.r>=4?'epic':''} ${t.r===5?'legend':''}${allGold?' allgold':''}">

  }

/* ---------------- 番茄钟 ---------------- */
let pomoModalOpen=false;
const POMO_REC_MIN=5*60000; // 番茄钟不足5分钟不记录（打卡/日历）
function pomoRemaining(){ return S.pomo.running ? Math.max(0,S.pomo.end-now()) : S.pomo.remain; }
function pomoStart(name,dur){
  S.pomo.name=name||'专注';
  S.pomo.total=dur; S.pomo.remain=dur; S.pomo.focusTotal=dur;
  S.pomo.mode='focus';
  S.pomo.start=now(); S.pomo.end=now()+dur;
  S.pomo.running=true; S.pomo.pausedByBlur=false;
  S.pomo.roundItems=[];
  sfx.click(); save();
  toast(`🍅 番茄开始：「${S.pomo.name}」专注中，月巴生长 x2`);
  renderPomoModal(); updatePomoUI();
}
function pomoPause(byBlur){
  if(!S.pomo.running)return;
  S.pomo.remain=Math.max(0,S.pomo.end-now());
  S.pomo.running=false;
  if(byBlur) S.pomo.pausedByBlur=true;
  save(); renderPomoModal(); updatePomoUI();
}
function pomoResume(){
  if(S.pomo.running||S.pomo.remain<=0)return;
  S.pomo.end=now()+S.pomo.remain;
  S.pomo.running=true; S.pomo.pausedByBlur=false;
  save(); renderPomoModal(); updatePomoUI();
}
function pomoStop(){
  const elapsed=S.pomo.total-S.pomo.remain; // 已专注时间（完成或中途停止都按实际经过计）
  const active=S.pomo.running || S.pomo.remain>0;
  if(!active){ sfx.click(); return; }
  // 只有专注阶段的中途停止才记录已过时间；休息阶段停止不记录
  let stoppedRound=false;
  if(elapsed>0 && S.pomo.mode==='focus'){
    stoppedRound=true;
    if(elapsed>=POMO_REC_MIN){
      const t=now(), s=t-elapsed;
      S.pomo.history.push({n:S.pomo.name, s, d:elapsed, t});
      if(S.pomo.history.length>5000) S.pomo.history.shift();
      save(); sfx.unlock();
      toast(`⏹ 已停止：「${S.pomo.name}」记录已专注 ${fmtDur(elapsed)}`);
    }else{
      save(); sfx.click();
      toast(`⏹ 已停止：「${S.pomo.name}」专注不足 5 分钟，未记录`);
    }
  }else if(S.pomo.mode==='focus'){
    sfx.error();
  }else{
    sfx.click(); toast('☕ 已跳过休息，准备开始下一个番茄');
  }
  S.pomo.running=false; S.pomo.remain=0; S.pomo.mode='focus';
  S.pomo.total=S.pomo.focusTotal||S.pomo.total||25*60000; S.pomo.pausedByBlur=false;
  save(); renderPomoModal(); updatePomoUI();
  if(stoppedRound) pomoRoundSummary();
}
function pomoEnterBreak(){
  const b=(S.pomo.breakMin||5)*60000;
  S.pomo.mode='break';
  S.pomo.total=b; S.pomo.remain=b;
  S.pomo.start=now(); S.pomo.end=now()+b;
  S.pomo.running=true; S.pomo.pausedByBlur=false;
  save(); renderPomoModal(); updatePomoUI();
}
function pomoComplete(){
  if(S.pomo.mode==='focus'){
    if(S.pomo.total>=POMO_REC_MIN){
      S.pomo.history.push({n:S.pomo.name, s:S.pomo.start||now()-S.pomo.total, d:S.pomo.total, t:now()});
      if(S.pomo.history.length>5000) S.pomo.history.shift();
    }
    sfx.unlock(); save();
    toast(`🍅 完成「${S.pomo.name}」！休息 ${S.pomo.breakMin||5} 分钟 ☕`);
    pomoEnterBreak();
    pomoRoundSummary();
  }else{
    // 休息结束 → 回到就绪，可开始下一个番茄
    S.pomo.mode='focus';
    S.pomo.total=S.pomo.focusTotal||25*60000;
    S.pomo.remain=0; S.pomo.running=false; S.pomo.pausedByBlur=false;
    save();
    toast(`☕ 休息结束！准备开始下一个番茄钟`);
    renderPomoModal(); updatePomoUI();
  }
}
function pomoNext(){
  if(S.pomo.mode==='break') sfx.unlock();
  pomoStart(S.pomo.name, S.pomo.focusTotal||S.pomo.total||25*60000);
}

function feedCollect(got){

function pomoRoundSummary(){
  const items=S.pomo.roundItems||[];
  if(!items.length)return;
  const byId={}; let total=0, n=0;
  for(const g of items){ byId[g.id]=(byId[g.id]||0)+1; total+=g.val; n++; }
  let rows='';
  for(const id in byId){
    const t=TYPES.find(x=>x.id===id); if(!t)continue;
    rows+=`<div class="rsum-row"><span class="dot" style="background:${t.color}"></span>${esc(t.name)} <b>x${byId[id]}</b></div>`;
  }
  openModal(`🍅 「${esc(S.pomo.name||'专注')}」本轮收获`, `
    <div class="rsum">${rows}
      <div class="rsum-total">共 ${n} 个月巴 · 收获 +${fmt(total)}🪙</div>
      <button class="btn" style="width:100%" onclick="closeModal();openPomo()">👍 好的</button>
    </div>`);
}

function renderPomoModal(){
  if(!pomoModalOpen)return;
  const t=$('pomoTime'), st=$('pomoState'), big=$('pomoStartBtn'), nb=$('pomoNextBtn'), ring=$('pomoRing');
  if(t) t.textContent=fmtDur(pomoRemaining());
  const inBreak=S.pomo.mode==='break';
  if(ring){
    const total=S.pomo.total>0?S.pomo.total:((S.pomo.mode==='break'?(S.pomo.breakMin||5):(S.pomo.focusTotal/60000||25))*60000);
    const ratio=total>0?Math.max(0,S.pomo.remain)/total:0;
    const C=2*Math.PI*88;
    ring.style.strokeDashoffset=(C*(1-ratio)).toFixed(1);
  }
  if(st){
    st.classList.remove('brk','rdy');
    if(inBreak){ st.textContent=S.pomo.running?'☕ 休息中 · 时长 '+S.pomo.breakMin+'分':'☕ 休息暂停'; st.classList.add('brk'); }
    else if(S.pomo.running){ st.textContent='⏳ 专注中 · 生长 x2 · 自动收集'; }
    else if(S.pomo.remain>0){ st.textContent='⏸ 已暂停'; st.classList.add('rdy'); }
    else { st.textContent='就绪 · 点击开始专注'; st.classList.add('rdy'); }
  }
  if(big){
    big.classList.toggle('brk', inBreak);
    big.classList.toggle('pause', !S.pomo.running && !inBreak && S.pomo.remain>0);

}

  syncPomoSegs();
  const sl=$('pomoCustom'); const curMin=Math.round((S.pomo.focusTotal||25*60000)/60000);
  if(sl) sl.value=curMin;
  const ckLbl=$('pomoCustomLbl'); if(ckLbl) ckLbl.textContent=curMin+'分';
}
function dayKey(ts){ const d=new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function startOfWeek(ts){ const d=new Date(ts); d.setHours(0,0,0,0); const wd=d.getDay()||7; d.setDate(d.getDate()-wd+1); return d.getTime(); }
function startOfMonth(ts){ const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(1); return d.getTime(); }
function openPomoStats(period){
  const hist=S.pomo.history.slice().sort((a,b)=>b.t-a.t);
  const nowTs=now();
  let title='', rows='', total=0, cnt=0;
  if(period==='day'){
    const s=startOfDay(nowTs);
    const list=hist.filter(r=>r.t>=s);
    total=list.reduce((a,r)=>a+r.d,0); cnt=list.length;
    title='📊 今日统计';
    rows=list.length? list.map(r=>`<div class="pstat-row"><b>${esc(r.n)}</b><span>${fmtTS(r.s)} ~ ${fmtTS(r.t)}</span><em>${fmtDur(r.d)}</em></div>`).join('')
      : `<div class="empty">今天还没有番茄记录，开始一个吧~</div>`;
  }else if(period==='week'){
    const s=startOfWeek(nowTs);
    const wd=['日','一','二','三','四','五','六'];
    title='📊 本周统计';
    const dayRows=[];
    for(let i=0;i<7;i++){
      const ds=s+i*86400000;
      const list=hist.filter(r=>r.t>=ds && r.t<ds+86400000);
      if(!list.length)continue;
      const dsum=list.reduce((a,r)=>a+r.d,0);
      total+=dsum; cnt+=list.length;
      const dt=new Date(ds);
      dayRows.push(`<div class="pstat-row"><b>周${wd[dt.getDay()]} · ${dt.getMonth()+1}/${dt.getDate()}</b><span>${list.length}次</span><em>${fmtDur(dsum)}</em></div>`);
    }
    rows=dayRows.length?dayRows.join(''):`<div class="empty">本周还没有番茄记录</div>`;
  }else{
    const s=startOfMonth(nowTs);
    const map={};
    title='📊 本月统计';
    for(const r of hist){
      if(r.t<s)continue;
      const k=dayKey(r.t);
      map[k]=(map[k]||0)+r.d; total+=r.d; cnt++;
    }
    const dayRows=Object.keys(map).sort().map(k=>`<div class="pstat-row"><b>${k}</b><span></span><em>${fmtDur(map[k])}</em></div>`);
    rows=dayRows.length?dayRows.join(''):`<div class="empty">本月还没有番茄记录</div>`;
  }
  const tabs=[['day','今日'],['week','本周'],['month','本月']]
    .map(([p,lab])=>`<button class="btn pstat-tab ${p===period?'on':''}" onclick="openPomoStats('${p}')">${lab}</button>`).join('');
  openModal(title,
    `<div class="pstat-tabs">${tabs}</div>
     <div class="pstat-total">共 <b>${cnt}</b> 次专注 · 累计 <b>${fmtDur(total)}</b></div>
     <div class="pstat-list">${rows}</div>
     <button class="btn" style="width:100%;margin-top:8px" onclick="openPomo()">⏰ 返回番茄钟</button>`);
  pomoModalOpen=false;
}

/* ---------------- 番茄钟：打卡与日历 ---------------- */
function renderCheckinPresets(){ const el=$('ckPresets'); if(el) el.innerHTML=presetsRowHTML('ckDelPreset','ckUsePreset'); }
function ckUsePreset(i){
  const p=(S.pomo.presets||[])[i]; if(!p)return;
  const inp=$('ckName'); if(inp) inp.value=p;
  sfx.click();
}
function ckDelPreset(i){ (S.pomo.presets||[]).splice(i,1); save(); sfx.click(); renderCheckinPresets(); }
function openPomoCheckin(){
  openModal('✅ 打卡',
    `<div class="pomo-wrap">
      <div class="pomo-presets" id="ckPresets"></div>
      <div class="pomo-name-in"><input id="ckName" value="${esc(S.pomo.name)}" placeholder="专注项目，如：工作 / 学习"></div>
      <div class="pomo-name-in"><input id="ckMin" type="number" min="1" max="600" value="25" placeholder="专注分钟"></div>
      <div class="pomo-name-in"><input id="ckNote" placeholder="打卡内容 / 备注（可选）"></div>
      <div class="pomo-note">打卡会记录<b>项目、专注时长、打卡内容与时间</b>，可在日历中回顾复盘。</div>
      <div class="pomo-controls">
        <button class="btn cta" onclick="pomoDoCheckin()">✅ 保存打卡</button>
        <button class="btn" onclick="openPomo()">返回</button>
      </div>
    </div>`);
  pomoModalOpen=false;
  renderCheckinPresets();
}
function pomoDoCheckin(){
  const name=inpVal('ckName','专注');
  const min=parseInt(inpVal('ckMin','25'),10)||25;
  const note=inpVal('ckNote','');
  const d=Math.max(1,Math.min(600,min))*60000;
  const t=now(), s=t-d;
  S.pomo.history.push({n:name, s, d, t, c:note});
  if(S.pomo.history.length>5000) S.pomo.history.shift();
  save(); sfx.unlock();
  toast(`✅ 打卡成功：「${name}」${fmtDur(d)}${note?' · '+note:''}`);
  openPomo();
}
let calY=0, calM=0;
function openPomoCalendar(){
  const gd=gameNow();
  calY=gd.getFullYear(); calM=gd.getMonth();
  renderPomoCalendar();
}
const CAL_COLORS=['rgba(102,187,106,.5)','rgba(66,165,245,.5)','rgba(255,167,38,.5)','rgba(239,83,80,.5)'];
/* 日历填充：8小时=100%，每满8小时换一种颜色继续填充 */
function calFill(total){
  if(!(total>0))return '';
  const bucket=8*3600*1000;
  const completed=Math.floor(total/bucket);
  const within=total-completed*bucket;
  let bi, frac;
  if(within===0){ bi=Math.max(0,completed-1); frac=1; }
  else{ bi=completed; frac=within/bucket; }
  const pct=Math.round(frac*100);
  return `<div class="calfill" style="height:${pct}%;background:${CAL_COLORS[bi%CAL_COLORS.length]}"></div>`;
}
function renderPomoCalendar(){
  const first=new Date(calY,calM,1);
  const startWd=(first.getDay()+6)%7; // 周一开头
  const days=new Date(calY,calM+1,0).getDate();
  const map={};
  for(const r of S.pomo.history){
    const dd=new Date(r.t);
    if(dd.getFullYear()===calY && dd.getMonth()===calM){
      (map[dd.getDate()]=map[dd.getDate()]||[]).push(r);
    }
  }
  let grid='';
  for(let i=0;i<startWd;i++) grid+='<div class="cal-cell empty"></div>';
  const gd=gameNow();
  for(let day=1;day<=days;day++){
    const recs=map[day]||[];
    const total=recs.reduce((a,r)=>a+r.d,0);
    const isToday=(gd.getFullYear()===calY&&gd.getMonth()===calM&&gd.getDate()===day);
    grid+=`<div class="cal-cell ${total?'has':''} ${isToday?'today':''}" onclick="calDetail(${day})">
      ${calFill(total)}
      <b>${day}</b>
      ${recs.length?`<span>${fmtDur(total)}</span><em>${recs.length}次</em>`:'<em>·</em>'}
    </div>`;
  }
  openModal(`📅 打卡日历 · ${calY}年${calM+1}月`,
    `<div class="cal-head">
      <button class="btn" onclick="calMove(-1)">‹ 上月</button>
      <span>${calY} / ${calM+1}</span>
      <button class="btn" onclick="calMove(1)">下月 ›</button>
    </div>
    <div class="cal-grid">
      ${['一','二','三','四','五','六','日'].map(w=>`<div class="cal-wd">${w}</div>`).join('')}
      ${grid}
    </div>
    <div class="cal-detail" id="calDetail"></div>
    <div class="cal-legend">🎨 每 8 小时换一种颜色 · 一天最多 4 色（24 小时）</div>
    <div class="pomo-controls">
      <button class="btn" onclick="openPomo()">⏰ 返回番茄钟</button>
      <button class="btn" onclick="openPomoStats('day')">📊 统计</button>
    </div>`);
  pomoModalOpen=false;
}
function calMove(delta){ calM+=delta; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} renderPomoCalendar(); }
function calDetail(day){
  const el=$('calDetail'); if(!el)return;
  const recs=S.pomo.history.filter(r=>{ const d=new Date(r.t); return d.getFullYear()===calY&&d.getMonth()===calM&&d.getDate()===day; }).sort((a,b)=>b.t-a.t);
  const total=recs.reduce((a,r)=>a+r.d,0);
  el.innerHTML=`<div class="cal-dtitle">${calY}/${calM+1}/${day} · ${recs.length}次 · 共${fmtDur(total)}</div>
    ${recs.map(r=>`<div class="pstat-row"><b>${esc(r.n)}</b><span>${r.c?esc(r.c):''}</span><em>${fmtDur(r.d)}</em></div>`).join('')||'<div class="empty">当天没有打卡</div>'}`;
}

/* ---------------- 主循环 ---------------- */
let lastReadySfx=0, lastRevealSfx=0;
function tick(){
  weatherTick();
  pomoTick();
  for(let z=0;z<S.zones.length;z++){
    for(let w=0;w<S.zones[z].woods.length;w++){
      for(let i=0;i<S.zones[z].woods[w].cells.length;i++){
        const cell=S.zones[z].woods[w].cells[i];
        if(!cell){
          S.zones[z].woods[w].cells[i]={delay:now()+rand(900,2600)};
          renderCell(z,w,i);
        }else if(cell.delay && now()>=cell.delay){
          spawnIn(S.zones[z],S.zones[z].woods[w],cell);
          renderCell(z,w,i);
        }else if(cell.t){
          // 番茄钟专注时段：成熟即自动收集（含未打开的场地）；番茄钟面板打开时静默并在右上角记录
          if(autoCollectActive() && cellReady(cell)){
            const quiet=pomoModalOpen;
            const got=doHarvest(z,w,i,cell,cellEls[`${z}-${w}-${i}`],quiet);
            if(got){
              S.pomo.roundItems.push(got);
              if(quiet) feedCollect(got);
            }
            continue;
          }
          const el=cellEls[`${z}-${w}-${i}`];
          if(!el)continue;
          const stage=cellStage(cell);
          const prev=el._stage;
          if(stage!==prev){
            renderCell(z,w,i); el._stage=stage;
            if(stage==='mature'){
              if(now()-lastReadySfx>1200){ lastReadySfx=now(); sfx.ready(); }
              // 揭示特效：白色星点
              const r=el.getBoundingClientRect();
              burst(r.left+r.width/2,r.top+r.height/2,['#ffffff','#e6d9ff','#c9b2e8'],12,3);
            }
          }else if(stage!=='mature'){
            const iw=el.querySelector('.pg i');
            if(iw){ const p=clamp((now()-cell.start)/(cell.dur/speedMult()),0,1); iw.style.width=(p*100)+'%'; }
          }
        }
      }
    }
  }
  updateStatus();
  updateWeatherHold();
  if(now()-S.lastSave>5000) save();
}

/* ---------------- 离线结算 ---------------- */
function offlineSettle(){
  const elapsed=now()-S.lastSave;
  if(elapsed<=2000)return;
  const capped=Math.min(elapsed,OFFLINE_CAP);
  const backAt=new Date(now()-capped);
  let readyCount=0;
  for(let z=0;z<S.zones.length;z++){
    for(let w=0;w<S.zones[z].woods.length;w++){
      for(let i=0;i<S.zones[z].woods[w].cells.length;i++){
        const cell=S.zones[z].woods[w].cells[i];
        if(!cell||cell.delay){
          const list=availableTypes();
          const t=weightedPick(list);
          const st=rollStats(t.r);
          S.zones[z].woods[w].cells[i]={t:t.id,start:backAt.getTime(),dur:t.t*(1000/BASE_SPEED),h:st.h,w:st.w};
          if(now()-backAt.getTime()>=t.t*(1000/BASE_SPEED)/speedMult()) readyCount++;
        }else if(cell.t&&cellReady(cell)){
          readyCount++;
        }
      }
    }
  }
  const mins=Math.floor(capped/60000);
  if(mins>=1){
    toast(`欢迎回来！你离开了 ${mins>=60?(Math.floor(mins/60)+'小时'+((mins%60)?(''+mins%60+'分'):'')):(mins+'分')}，${readyCount} 个月巴已成熟待收~`);
  }
}

/* ---------------- 初始化 ---------------- */
function init(){
  const hasSave=load();
  if(!S.seenHelp){
    S.coins+=100; S.seenHelp=true;
    openHelp();
  }
  if(hasSave) offlineSettle();
  renderOverview(); updateHeader(); updateStatus(); updatePomoUI(); updateSceneBar(); updateWeatherHold();
  setInterval(tick,250);
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){ if(S.pomo.running) pomoPause(true); save(); }
    else if(S.pomo.pausedByBlur){ pomoResume(); }
  });
  $('btnBook').onclick=()=>{ sfx.click(); openBook(); };
  $('btnShop').onclick=()=>{ sfx.click(); openShop(); };
  $('btnFast').onclick=useFast;
  $('btnWeather').onclick=useWeather;
  $('btnPomo').onclick=()=>{ sfx.click(); openPomo(); };
  $('btnHelp').onclick=()=>{ sfx.click(); openHelp(); };
  $('btnMute').onclick=()=>{ S.muted=!S.muted; updateHeader(); sfx.click(); save(); };
  $('overlay').onclick=(e)=>{ if(e.target===$('overlay'))closeModal(); };
  $('sceneBack').onclick=closeScene;
  $('sceneWoodBtn').onclick=()=>buyWood(currentZone);
  $('sceneFast').onclick=useFast;
  $('sceneWeather').onclick=useWeather;
  $('slotBtn').onclick=openSlotMenu;
  save();
}
init();
</script>
