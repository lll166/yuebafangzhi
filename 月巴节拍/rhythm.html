/* 调试：?debug=1&level=3 直接进关，便于验收截图 */
if(DEBUG){
  function b64of(u8){
    var CH=0x8000, parts=[];
    for(var i=0;i<u8.length;i+=CH) parts.push(String.fromCharCode.apply(null,u8.subarray(i,i+CH)));
    return btoa(parts.join(''));
  }
  /* 用 WebCodecs 编成 AAC（ADTS 封装），浏览器与 Safari 都能直接解码 */
  function encodeADTS(buf,bitrate){
    return new Promise(function(res,rej){
      if(typeof AudioEncoder==='undefined') return rej(new Error('no AudioEncoder'));
      var chunks=[];
      var enc;
      try{
        enc=new AudioEncoder({
          output:function(c){ var u=new Uint8Array(c.byteLength); c.copyTo(u); chunks.push(u); },
          error:function(e){ rej(e); }
        });
        enc.configure({codec:'mp4a.40.2',sampleRate:buf.sampleRate,numberOfChannels:buf.numberOfChannels,
          bitrate:bitrate,aac:{format:'adts'}});
      }catch(e){ return rej(e); }
      var total=0, F=1024, chs=buf.numberOfChannels;
      while(total<buf.length){
        var n=Math.min(F,buf.length-total);
        var data=new Float32Array(n*chs);
        for(var c=0;c<chs;c++){
          var tmp=new Float32Array(n);
          buf.copyFromChannel(tmp,c,total);
          data.set(tmp,c*n);
        }
        var ad;
        try{
          ad=new AudioData({format:'f32-planar',sampleRate:buf.sampleRate,numberOfFrames:n,
            numberOfChannels:chs,timestamp:Math.round(total/buf.sampleRate*1e6),data:data});
        }catch(e){ return rej(e); }
        enc.encode(ad);
        try{ ad.close(); }catch(e){}
        total+=n;
      }
      enc.flush().then(function(){
        try{ enc.close(); }catch(e){}
        var len=0,i;
        for(i=0;i<chunks.length;i++) len+=chunks[i].byteLength;
        var all=new Uint8Array(len), off=0;
        for(i=0;i<chunks.length;i++){ all.set(chunks[i],off); off+=chunks[i].byteLength; }
        res(all);
      }).catch(rej);
    });
  }
  window.__rb={G:G,TR:TR,now:function(){return AC?AC.currentTime:0;},chart:function(){return chartNow();},judge:judgeTap,notes:function(){return G.notes;},imgs:function(){return bunnyImg;},levels:function(){return LEVELS;},tiers:function(){return TIERS;},save:save,unlocked:isLevelUnlocked,valid:validateLevels,
    start:startLevel, finish:finishLevel, quit:quitToMenu, segment:startSegment,
    commit:function(){ if(TR.phrase) commitHistory(TR.phrase); },
    tick:function(){ loop(); },
    audio:function(){return AC;},
    acc:function(){ return {bufs:Object.keys(ACCBUF),jobs:Object.keys(ACCJOB),kit:Object.keys(SAMPLE.kit)}; },
    /* 调试：管弦采样是否解码完成、各乐器有几个锚点音 */
    orch:function(){
      var o={}; for(var k in ORCH.inst) o[k]=ORCH.inst[k].list.length;
      return {ready:ORCH.ready,packed:!!ORCH.raw,inst:o};
    },
    /* 调试：统计某关整轨伴奏的事件构成，用来核对编曲加层是否逐级递进 */
    arrange:function(idx,combo){
      var L=LEVELS[idx]; if(!L) return null;
      var sp=TR.phrase, ss=G.stat, cnt={};
      TR.phrase=null; G.stat={combo:combo||0};
      try{
        var ev=buildAccRange(L,0,compileLevel(L).duration);
        for(var i=0;i<ev.length;i++) cnt[ev[i].type]=(cnt[ev[i].type]||0)+1;
        return {id:L.id,arr:(typeof L.arr==='number'?L.arr:null),n:ev.length,types:cnt};
      }finally{ TR.phrase=sp; G.stat=ss; }
    },
    /* 构建脚本调用：把整关伴奏渲染并编码成 ADTS/AAC，返回 base64 */
    exportLevel:function(idx,opt){
      opt=opt||{};
      var L=LEVELS[idx];
      if(!L) return Promise.reject('no level');
      if(!AC) return Promise.reject('no audio');
      /* 固定种子导出：任意关卡（含最后一关的交响终章）都能烘成一条独立整轨 */
      var savedSeed=G.runSeed, savedSong=L._song, seeded=opt.seed!=null;
      if(seeded){ G.runSeed=opt.seed; L._song=null; }
      var ch=compileLevel(L), rate=+(opt.rate||48000), dur=ch.duration+0.9;
      var job=accOffline(L,0,ch.duration,0,rate,dur,null);
      if(!job){
        if(seeded){ G.runSeed=savedSeed; L._song=savedSong; }
        return Promise.reject('no offline context');
      }
      return job.then(function(buf){
        /* 顺便量一下峰值，导出的轨是不是真的有声音，一眼能看出来 */
        var pk=0, d=buf.getChannelData(0), st=Math.max(1,Math.floor(d.length/4096));
        for(var i=0;i<d.length;i+=st){ var a=d[i]<0?-d[i]:d[i]; if(a>pk) pk=a; }
        return encodeADTS(buf,opt.bitrate||96000).then(function(u8){
          return {id:L.id,idx:idx,sr:buf.sampleRate,dur:+buf.duration.toFixed(2),
                  peak:+pk.toFixed(3),bytes:u8.byteLength,b64:b64of(u8)};
        });
      }).then(function(r){
        if(seeded){ G.runSeed=savedSeed; L._song=savedSong; }
        return r;
      },function(e){
        if(seeded){ G.runSeed=savedSeed; L._song=savedSong; }
        throw e;
      });
    },
    /* 诊断：用「旧烘焙链路」（master 1.0 直连、无压缩器）渲染整关，逐样本量峰值与削波数，
       用于对照确认离线烘焙是否真的削波（炸麦排查用） */
    rawPeak:function(idx,opt){
      opt=opt||{};
      var L=LEVELS[idx];
      if(!L) return Promise.reject('no level');
      if(!AC) return Promise.reject('no audio');
      var savedSeed=G.runSeed, savedSong=L._song, seeded=opt.seed!=null;
      if(seeded){ G.runSeed=opt.seed; L._song=null; }
      var ch=compileLevel(L), rate=Math.min(44100,(AC&&AC.sampleRate)||44100), dur=ch.duration+0.9;
      var O=window.OfflineAudioContext||window.webkitOfflineAudioContext, off;
      try{ off=new O(1,Math.ceil(dur*rate),rate); }catch(e){ return Promise.reject('no offline ctx'); }
      var savedPh=TR.phrase, savedStat=G.stat, ev=[];
      try{ TR.phrase=null; G.stat={combo:0}; ev=buildAccRange(L,0,ch.duration); }catch(e){ ev=[]; }
      TR.phrase=savedPh; G.stat=savedStat;
      var sAC=AC,sMaster=master,sBus=musicBus,sWet=musicWet,sNoise=noiseBuf,sMuted=muted,ok=true;
      try{
        AC=off; muted=false;
        master=off.createGain(); master.gain.value=1; master.connect(off.destination);
        musicBus=off.createGain(); musicBus.gain.value=0.9;
        var dry=off.createGain(); dry.gain.value=0.9; dry.connect(master);
        var rev=off.createConvolver();
        try{ rev.buffer=makeImpulse(1.4,2.6); }catch(e){}
        musicWet=off.createGain(); musicWet.gain.value=0.2; musicWet.connect(master);
        musicBus.connect(dry); musicBus.connect(rev); rev.connect(musicWet);
        noiseBuf=off.createBuffer(1,Math.ceil(off.sampleRate*0.2),off.sampleRate);
        var nd=noiseBuf.getChannelData(0);
        for(var i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
        for(var pi=0;pi<ev.length;pi++) playAcc(ev[pi],ev[pi].t);
      }catch(e){ ok=false; }
      AC=sAC; master=sMaster; musicBus=sBus; musicWet=sWet; noiseBuf=sNoise; muted=sMuted;
      if(seeded){ G.runSeed=savedSeed; L._song=savedSong; }
      if(!ok) return Promise.reject('render setup failed');
      return off.startRendering().then(function(buf){
        var d=buf.getChannelData(0), pk=0, over=0, i, a;
        for(i=0;i<d.length;i++){ a=d[i]<0?-d[i]:d[i]; if(a>pk) pk=a; if(a>=0.999) over++; }
        return {id:L.id, peak:+pk.toFixed(3), clippedSamples:over, samples:d.length};
      });
    },
    report:function(){
      var rows=[], total=0, chapters=[], seen={}, issues=validateLevels();
      for(var i=0;i<LEVELS.length;i++){
        var L=LEVELS[i], sec=levelPlaySeconds(L);
        total+=sec;
        var ch=L.chapter||'';
        if(ch&&!seen[ch]){ seen[ch]=1; chapters.push({id:ch,no:L.chapterNo,name:chapName(L),levels:0,sec:0}); }
        if(ch){ var c=chapters[chapters.length-1]; c.levels++; c.sec+=sec; }
        rows.push({no:i+1,id:L.id,tier:L.tier,chapter:ch||null,bpm:L.bpm,bars:L.bars,phrase:L.phrase,
          ns:+(L.phrase*L.bpm/240).toFixed(2),sec:+sec.toFixed(1),
          time:Math.floor(sec/60)+':'+pad2(Math.floor(sec%60))});
      }
      for(var k=0;k<chapters.length;k++) chapters[k].min=+(chapters[k].sec/60).toFixed(1);
      return {levels:rows,totalSec:+total.toFixed(1),totalMin:+(total/60).toFixed(1),chapters:chapters,issues:issues};
    },
    resume:function(){ try{ if(AC) AC.resume(); }catch(e){} TR.paused=false; hide('pauseScr'); },
    draw:function(t){ if(G.L&&TR.phrase) draw(t==null?chartNow():t,TR.mode); },
    state:function(){ return {lowPower:lowPower,qual:QUAL,lean:lowPower}; }};
  var m=/[?&]level=(\d+)/.exec(location.search);
  if(m){
    setTimeout(function(){
      var idx=clamp(parseInt(m[1],10)-1,0,LEVELS.length-1);
      startLevel(idx);
    },350);
  }
}
