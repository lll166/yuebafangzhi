}
function kidx(arr,v){
  for(var i=0;i<arr.length;i++) if(arr[i]===v) return i;
  return -1;
}
function playAcc(e,when){
  if(e.type==='kick') kick(when,e.v);
  else if(e.type==='hat') hat(when,e.v);
  else if(e.type==='bass') bass(when,e.f);
  else if(e.type==='pad') padVoiceSong(e.deg,when,e.d,e.k,e.sc,e.sty);
  else if(e.type==='bassSong') bassSong(e.deg,when,e.k,e.sc,e.sty);
  else if(e.type==='arp') pluck(midiHz(scaleMidiSong(e.deg,60+e.k,e.sc)),when,e.v);
  else if(e.type==='lead') leadVoice(e.deg,when,e.d,e.k,e.sc,e.v);
  else if(e.type==='wood') woodVoice(e.deg,when,e.d,e.k,e.sc,e.v);
  else if(e.type==='bell') bellTone(e.deg,when,e.k,e.sc,e.v);
  else if(e.type==='snare') snare(when,e.v);
  else if(e.type==='rim') rim(when,e.v);
  else if(e.type==='shaker') shaker(when,e.v);
  else if(e.type==='clap') clap(when,e.v);
  else if(e.type==='ohat') openHat(when,e.v);
  else if(e.type==='crash') crash(when,e.v);
  else if(e.type==='strings') stringSection(e.deg,when,e.d,e.k,e.sc,e.v);
  else if(e.type==='brass') brassChord(e.deg,when,e.d,e.k,e.sc,e.v);
  else if(e.type==='timpani') timpani(when,e.deg,e.k,e.sc,e.v);
  else if(e.type==='tom') tom(when,e.f,e.v);
  else if(e.type==='crackle') hitNoise('crackle',when,900);
  else if(e.type==='drip') hitNoise('drip',when,e.f);
  else if(e.type==='sparkle') hitNoise('sparkle',when,e.f);
}

/* =========================================================
   5. 段落 / 调度
   ========================================================= */
function stopSched(){
  if(TR.timer){ clearInterval(TR.timer); TR.timer=null; }
  /* 预渲染伴奏：短淡出后停掉，避免段间切换时尾音被硬切 */
  if(TR.bedSrc){
    var src=TR.bedSrc, g=TR.bedGain, now=(AC&&AC.currentTime)||0;
    try{
      if(g) g.gain.setTargetAtTime(0.0001,now,0.06);
      src.stop(now+0.24);
    }catch(e){}
    TR.bedSrc=null; TR.bedGain=null;
  }
}
/* 当前段内时间 → 整谱绝对时间 */
function chartNow(){
  if(!TR.phrase||!AC) return 0;
  return TR.phrase.t0+(AC.currentTime-TR.songStart);
}
function startSched(mode,L,ph,lead){
  stopSched();
  TR.mode=mode;
  TR.phrase=ph;
  startAmbience(L);
  TR.noteIdx=ph.i0;
  TR.accIdx=0;
  TR.paused=false;
  TR.songStart=AC.currentTime+(lead||0.4);
  var combo=(G.stat&&G.stat.combo)||0;
  var lvl=(L&&L.classic&&combo>=40)?1:0;
  var bed=(L&&L.classic&&ACCBUF[accKey(L,ph,lvl)])||null;
  TR.acc=[];
  /* 优先级：句子级离线缓存 > 实时合成（同一局用同一份生成 plan，音型对得上） */
  if(bed){
    /* 命中缓存：直接播放离线渲染好的整句伴奏，不再实时排事件 */
    try{
      var src=AC.createBufferSource(); src.buffer=bed;
      var g=AC.createGain();
      /* 自适应段落：连击越高，伴奏垫得越满 */
      g.gain.value=0.94+Math.min(0.10,combo/600);
      src.connect(g); g.connect(master);
      src.start(TR.songStart);
      TR.bedSrc=src; TR.bedGain=g;
    }catch(e){ bed=null; }
  }
  if(!bed){
    TR.acc=buildAccRange(L,ph.t0,ph.t1);
    /* 首次听到的句子走实时合成，同时把它离线烘焙进缓存，下一遍开始直接用 */
    if(L&&L.classic){ renderAccPhrase(L,ph,lvl); }
  }
  /* 预取下一句：两种连击档位都备好，轮到它时直接命中 */
  if(L&&L.classic&&G.phrases){
    var nx=G.phrases[G.phraseIdx+1];
    if(nx){
      if(!ACCBUF[accKey(L,nx,0)]) renderAccPhrase(L,nx,0);
      if(!ACCBUF[accKey(L,nx,1)]) renderAccPhrase(L,nx,1);
    }
  }
  TR.timer=setInterval(pump,45);
}
function pump(){
  if(!AC||TR.paused||!TR.phrase) return;
  var nowRel=AC.currentTime-TR.songStart;
  if(nowRel<-6) return;
  var ph=TR.phrase, lead=0.20;
  if(TR.mode==='demo'){
    while(TR.noteIdx<ph.i1 && G.notes[TR.noteIdx].t-ph.t0 < nowRel+lead){
      var n=G.notes[TR.noteIdx++];
      pluck(noteFreq(G.L,n.lane,n.step), TR.songStart+(n.t-ph.t0), 0.14);
    }
  }
  while(TR.accIdx<TR.acc.length && TR.acc[TR.accIdx].t < nowRel+lead){
    var e=TR.acc[TR.accIdx++];
    playAcc(e, TR.songStart+e.t);
  }
}
var CI={beats:[],idx:0,timer:null};
function stopCountIn(){
  if(CI.timer){ clearInterval(CI.timer); CI.timer=null; }
}
function countIn(base,beat){
  stopCountIn();
  CI.beats=[]; CI.idx=0;
  for(var i=0;i<4;i++) CI.beats.push({t:base+i*beat,high:i===3});
  CI.timer=setInterval(function(){
    if(!AC) return;
    while(CI.idx<CI.beats.length && CI.beats[CI.idx].t<AC.currentTime+0.15){
      var e=CI.beats[CI.idx++]; click(e.t,e.high);
    }
    if(CI.idx>=CI.beats.length) stopCountIn();
  },50);
}

/* =========================================================
   6. 开始 / 试听 / 演奏 / 结算
   ========================================================= */
function resetStat(){
  return {perfect:0,great:0,good:0,miss:0,combo:0,maxCombo:0,judged:0,weighted:0};
}
function hideCoach(){
  if(els.coach) els.coach.classList.remove('on');
}
function setCoach(msg){
  if(!els.coach||!els.coachTxt) return;
  if(!msg){ hideCoach(); return; }
  els.coachTxt.textContent=msg;
  els.coach.classList.add('on');
}
/* 教学关按短句进度给提示：第 3/4 段是八分音变奏 */
function coachFor(pi,mode){
  if(!G.L||!G.L.tutorial) return '';
  if(pi===0&&mode==='demo') return t('coachIntro');
  if((pi===2||pi===3)&&mode==='demo') return t('coachEighth');
  if((pi===2||pi===3)&&mode==='play') return t('coachEighthTap');
  if(mode==='play'&&pi===G.phrases.length-1) return t('coachLast');
  if(mode==='play') return t('coachTap');
  return t('coachListen');
}
/* 长按教学：只在带 holdTip 的关卡里，首次遇到长按月巴时提示一次 */
function phraseHasHold(ph){
  if(!ph||!G.notes) return false;
  for(var i=ph.i0;i<ph.i1;i++){
    if(G.notes[i].hold>0) return true;
  }
  return false;
}
function coachHoldFor(pi,mode){
  if(!G.L||!G.L.holdTip) return '';
  if(!phraseHasHold(G.phrases[pi])) return '';
  if(mode==='demo'&&!TR.holdTipDemo){ TR.holdTipDemo=1; return t('coachHold'); }
  if(mode==='play'&&!TR.holdTipPlay){ TR.holdTipPlay=1; return t('coachHoldPlay'); }
  return '';
}
function segTail(mode){
  var s=G.L&&G.L.seg;
  if(mode==='demo') return s&&s.demoTail!=null?s.demoTail:SEG.demoTail;
  return s&&s.playTail!=null?s.playTail:SEG.playTail;
}
function isRecallPhrase(L,pi){
  return !!(L&&L.recall&&L.recall.indexOf(pi)>=0);
}
function phraseLabel(pi){
  var L=G.L;
  return (L&&L.labels&&L.labels[pi])?L.labels[pi]:'';
}
/* 一小节演奏结束后，把这小节的月巴固定到上方历史带 */
function commitHistory(ph){
  if(!ph||TR.histCommitted) return;
  TR.histCommitted=true;
  var nowA=AC?AC.currentTime:0;
  var r=holeR();
  var hopStep=r*1.15;
  var slot=0, prevT=null;
  for(var i=ph.i1-1;i>=ph.i0;i--){
    var n=G.notes[i];
    if(n.hitT===undefined&&n.missT===undefined) continue;
    if(prevT===null||n.t!==prevT) slot++;
    prevT=n.t;
    var stp=Math.round(n.t/(G.chart.stepDur||0.1));
    if(stp+1>(G.histMax||0)) G.histMax=stp+1;
    G.hist.push({
      lane:n.lane,
      step:stp,
      dimg:n.dimg||0,
      result:n.result||'miss',
      born:nowA,
      waveAt:nowA+0.55,
      fromX:laneX(n.lane)-slot*hopStep,
      fromY:rowY('bot')-r*0.55
    });
    /* 小节气压条只统计一次，避免每帧重复扫描历史 */
    var barIdx=Math.floor(stp/16);
    var rank=(n.result==='perfect')?1:((n.result==='great')?2:((n.result==='good')?3:4));
    if(rank>(TR.barWorst[barIdx]||0)) TR.barWorst[barIdx]=rank;
  }
}
function startLevel(idx){
  ensureAudio();
  if(!AC){
    toast(t('noAudio'));
    return;
  }
  if(AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  var L=LEVELS[idx];
  if(!L) return;
  stopAmbience();
  /* 每局换一个种子：和弦走向、动机排列、过门与装饰音都不沿用上一局 */
  G.runSeed=Math.floor(Math.random()*2147483000)+1;
  clearAccCache();
  hideCoach();
  G.screen='game'; G.phase='demo'; G.levelIdx=idx; G.L=L;
  /* 本关专属 4 只外链月巴：相邻关卡不重复，整池轮转尽量均匀 */
  setLevelBunnies(idx);
  G.chart=compileLevel(L);
  G.notes=G.chart.notes;
  G.phrases=buildPhrases(G.notes,L.phrase||6);
  if(G.phrases.length&&G.chart){
    var barT=G.chart.stepDur*16;
    var lastPh=G.phrases[G.phrases.length-1];
    lastPh.t1=Math.min(G.chart.duration,Math.ceil((lastPh.t1+0.0001)/barT)*barT);
  }
  /* 长按不能跨短句：会越界的退回普通音符，保证每段自己闭合 */
  for(var pi=0;pi<G.phrases.length;pi++){
    var ph=G.phrases[pi];
    for(var ni=ph.i0;ni<ph.i1;ni++){
      var hnt=G.notes[ni];
      if(hnt.hold&&hnt.t+hnt.hold>ph.t1+0.02){ hnt.hold=0; hnt.holdSteps=0; }
    }
  }
  G.phraseIdx=0;
  G.stat=resetStat();
  G.missIdx=0; G.fx=[]; G.pops=[]; G.hist=[]; G.burst=[]; G.petHit=[]; G.histMax=0;
  TR.finishAt=0; TR.histCommitted=false;
  TR.lastBar=-1; TR.big=-1; TR.comboLv=-1; TR.hopAt=-9;
  TR.segSeen={}; TR.barWorst=[];
  TR.lastLane=0; TR.lookAt=-9; TR.tapAt=-9; TR.whiffAt=-9; TR.whiffLane=-1;
  TR.beatIdx=-1; TR.beatAt=-9; TR.bigAt=-9;
  TR.segKind=''; TR.segAbs=0; TR.segDur=0; TR.segLane=0;
  TR.playAbs=0; TR.perfBar=-1; TR.petAt=-9; TR.hoverLane=-1;
  TR.offMarks=[]; TR.offAvg=0; TR.breakAt=-9; TR.breakN=0;
  TR.hold=null; TR.tapSrc=null;
  TR.holdTipDemo=0; TR.holdTipPlay=0;
  if(TR.comboAnim){ try{ TR.comboAnim.cancel(); }catch(e){} TR.comboAnim=null; }
  if(TR.segT){ clearTimeout(TR.segT); TR.segT=null; }
  /* 本关 4 只月巴按音符顺序轮转，保证每只都出场且分配均匀；
     试听与演奏共用同一张，看到的就是要打的那只 */
  for(var i=0;i<G.notes.length;i++){
    var nt=G.notes[i];
    nt.dimg=i%4;
    nt.trait=nt.dimg;              /* 立绘即性格：活泼/害羞/困倦/好奇 */
    nt.seed=(i*1.7+nt.dimg*2.4)%5.9;
  }
  document.body.classList.remove('menu');
  hideAllScr();
  els.hudLv.textContent=pad2(tierLevelNo(L));
  els.hudName.textContent=levelName(L);
  els.hudAcc.textContent='100.0%';
  els.hudCombo.textContent='0';
  els.hudCombo.className='';
  els.barFill.style.transform='scaleX(0)';
  els.barFill.className='';
  $('segChip').classList.remove('on');
  var bar=$('bar');
  if(bar){
    bar.style.setProperty('--beat',(60/L.bpm)+'s');
    bar.classList.toggle('beating',!lowPower);
  }
  invalidateBaseCache();
  resize();
  setTimeout(resize,60);
  /* 首段前的四拍倒数 */
  var beat=60/L.bpm;
  var base=AC.currentTime+0.60;
  countIn(base,beat);
  TR.intro=true;
  startSegment('demo',0,base+4*beat-AC.currentTime);
}
/* 进入某一小节的试听 / 演奏，lead 秒后开始 */
function startSegment(mode,pi,lead){
  if(!G.L||!AC) return;
  var ph=G.phrases[pi];
  if(!ph) return;
  /* 换段时不会有跨段长按；万一残留就丢掉，交给结算判漏 */
  if(TR.hold){ TR.hold.note.holdActive=false; TR.hold=null; }
  /* 已经全局跳过试听：任何 demo 段都直接转成演奏 */
  if(mode==='demo'&&SKIP_ALL_DEMO) mode='play';
  var lab=phraseLabel(pi);
  var prevMode=TR.mode;
  stopCountIn();
  G.phraseIdx=pi;
  G.fx=[]; G.pops=[];
  TR.offMarks=[]; TR.offAvg=0;
  startSched(mode,G.L,ph,lead);
  if(prevMode==='demo'&&mode==='play'){
    /* 交棒：一只月巴从试听行跳到演奏行 */
    TR.segKind='hand';
    TR.segAbs=AC.currentTime;
    TR.segDur=Math.min(0.55,Math.max(0.22,lead));
    TR.segLane=(G.notes[ph.i0]&&G.notes[ph.i0].lane)||0;
  }else{
    TR.segKind='';
  }
  if(mode==='play') TR.playAbs=AC.currentTime;
  if(mode==='play'){
    /* 清掉试听阶段留下的自动敲击痕迹 */
    for(var i=ph.i0;i<ph.i1;i++){
      var n=G.notes[i];
      n.judged=false; n.result='';
      delete n.hitT; delete n.missT;
      n.auto=false; n.holdActive=false;
    }
    TR.hold=null;
    var recall=isRecallPhrase(G.L,pi);
    TR.histCommitted=false;
    G.phase='play';
    G.missIdx=ph.i0;
    els.tip.textContent=(recall?t('recall'):t('yourTurn'))+(lab?'  '+lab:'')+'  '+(pi+1)+'/'+G.phrases.length;
    els.barFill.className='play';
    if(recall&&G.L.recall[0]===pi) toast(t('recallToast'));
  }else{
    G.phase='demo';
    els.tip.textContent=t('listen')+(lab?'  '+lab:'')+'  '+(pi+1)+'/'+G.phrases.length;
    els.barFill.className='';
  }
  updateSkipBtn();
  if(G.L.tutorial) setCoach(coachFor(pi,mode));
  else if(G.L.holdTip) setCoach(coachHoldFor(pi,mode));
  else hideCoach();
  /* 每个关卡第一次进入试听/演奏时，弹一次小票条提示 */
  if(!G.L.tutorial&&!TR.segSeen[mode]){ TR.segSeen[mode]=true; segChip(mode); }
}
/* 右上角的试听开关：游戏中一直显示，关闭后仍可随时点开 */
function updateSkipBtn(){
  if(!els.skip) return;
  var on=G.screen==='game'&&G.phase!=='done';
  els.skip.classList.toggle('on',on);
  els.skip.textContent=SKIP_ALL_DEMO?t('listenOn'):t('skip');
}
function toggleDemo(){
  if(G.screen!=='game'||G.phase==='done'||!G.phrases.length) return;
  if(SKIP_ALL_DEMO){
    /* 重新打开试听：后续小节恢复试听 */
    SKIP_ALL_DEMO=false;
  }else{
    SKIP_ALL_DEMO=true;
    if(G.phase==='demo'){
      TR.intro=false;
      els.bigNum.classList.remove('on');
      startSegment('play',G.phraseIdx,0.35);
    }
  }
  updateSkipBtn();
}
function judgeTap(lane){
  if(!AC||G.screen!=='game'||G.phase!=='play'||TR.paused||!TR.phrase) return;
  if(AC.currentTime<TR.songStart-JUDGE.good) return;
  var ph=TR.phrase;
  var relNow=chartNow();
  var tNow=relNow-(save.offset||0)/1000;
  /* 长按进行中：同一轨道再按既不判定也不惩罚 */
  if(TR.hold&&TR.hold.lane===lane) return;
  /* 本小节的判定窗口：最后一拍也要留足时间，超出才算收尾空拍 */
  if(tNow>ph.t1+JUDGE.late+0.10) return;
  var best=null,bestD=0;
  for(var i=ph.i0;i<ph.i1;i++){
    var n=G.notes[i];
    if(n.judged||n.holdActive||n.lane!==lane) continue;
    var d=tNow-n.t, win=n.hold?HOLD.entry:JUDGE.good;
    if(d>win||d<-win) continue;
    if(best===null||Math.abs(d)<Math.abs(bestD)){ best=n; bestD=d; }
  }
  if(!best){
    /* 已过本小节最后一拍：这是收尾的余拍，不算扑空，别打断连击 */
    if(tNow>ph.t1+0.03) return;
    TR.lastLane=lane; TR.lookAt=relNow; TR.whiffAt=relNow; TR.whiffLane=lane;
    whiff();
    addWhiff(lane,'bot');
    /* 多按：本轨道下一只还没判定的月巴直接记「漏了」，防止狂点刷判定 */
    var nx=null;
    for(var k=ph.i0;k<ph.i1;k++){
      var nn=G.notes[k];
      if(nn.judged||nn.lane!==lane||nn.t<=tNow) continue;
      if(nx===null||nn.t<nx.t) nx=nn;
    }
    if(nx){
      judgeMiss(nx);
    }else{
      if(G.stat.combo>=10){ TR.breakN=G.stat.combo; TR.breakAt=relNow; }
      G.stat.combo=0;
      G.lastDelta=0;
    }
    updateHud();
    return;
  }
  var ad=Math.abs(bestD);
  var res=ad<=JUDGE.perfect?'perfect':(ad<=JUDGE.great?'great':'good');
  /* 长按月巴：先吃下头拍，按住到尾部才结算 */
  if(best.hold){ startHold(best,lane,res,bestD,relNow); return; }
  best.judged=true; best.result=res; best.hitT=relNow;
  var w=res==='perfect'?1:(res==='great'?0.75:0.4);
  G.stat[res]++;
  G.stat.judged++;
  G.stat.weighted+=w;
  G.stat.combo++;
  if(G.stat.combo>G.stat.maxCombo) G.stat.maxCombo=G.stat.combo;
  G.lastDelta=bestD*1000;
  TR.offMarks.push({d:G.lastDelta,t0:relNow});
  if(TR.offMarks.length>6) TR.offMarks.shift();
  var om=0;
  for(var mi=0;mi<TR.offMarks.length;mi++) om+=TR.offMarks[mi].d;
  TR.offAvg=om/TR.offMarks.length;
  TR.lastLane=lane; TR.lookAt=relNow; TR.tapAt=relNow;
  /* 经典关的月巴声用钢琴；采样没就绪时退回原来的啵哟，音量保持原值 */
  var tapFreq=noteFreq(G.L,best.lane,best.step), tapVol=res==='perfect'?0.20:0.15;
  if(!(G.L&&G.L.classic&&pianoTap(tapFreq,AC.currentTime,tapVol))){
    boing(tapFreq,AC.currentTime,tapVol,!!songOf(G.L),G.L&&G.L.style);
  }
  addFx(lane,'bot');
  addPop(lane,res,'bot');
  if(G.stat.combo%10===0){
    var bn=G.stat.combo>=100?22:(G.stat.combo>=50?16:(G.stat.combo>=25?12:8));
    addBurst(laneX(lane),rowY('bot')-holeR()*0.35,bn);
    if(G.stat.combo===10||G.stat.combo===25||G.stat.combo===50||G.stat.combo===100){
      milestone(G.stat.combo); musicCombo(G.stat.combo);
    }
  }
  TR.hopAt=relNow;
  updateHud();
  if(DEBUG) els.tip.textContent=t('debug',{n:(bestD*1000).toFixed(0)});
}
function judgeMiss(note){
  note.judged=true; note.result='miss';
  note.missT=chartNow();
  if(G.stat.combo>=10){ TR.breakN=G.stat.combo; TR.breakAt=note.missT; }
  G.stat.miss++; G.stat.combo=0;
  addPop(note.lane,'miss','bot');
  TR.hopAt=note.missT;
  updateHud();
}
function autoMiss(now){
  var ph=TR.phrase;
  var end=ph?ph.i1:G.notes.length;
  while(G.missIdx<end){
    var n=G.notes[G.missIdx];
    /* 正在长按的那只先等它按完/松手，别提前判漏 */
    if(n.holdActive) return;
    var late=n.hold?HOLD.late:JUDGE.late;
    if(!(n.t < now-late)) break;
    if(!n.judged) judgeMiss(n);
    G.missIdx++;
  }
}
/* ---- 长按月巴：按住到尾部才结算，提前松手整只判漏 ---- */
function startHold(note,lane,res,d,relNow){
  note.holdActive=true;
  TR.hold={note:note,lane:lane,res:res,d:d,start:relNow,src:TR.tapSrc||{kind:'key',id:''}};
  TR.lastLane=lane; TR.lookAt=relNow; TR.tapAt=relNow;
  var tapFreq=noteFreq(G.L,note.lane,note.step), tapVol=res==='perfect'?0.20:0.15;
  if(!(G.L&&G.L.classic&&pianoTap(tapFreq,AC.currentTime,tapVol))){
    boing(tapFreq,AC.currentTime,tapVol,!!songOf(G.L),G.L&&G.L.style);
  }
  addFx(lane,'bot');
  updateHud();
}
function finishHold(ok){
  var h=TR.hold;
  if(!h) return;
  var note=h.note;
  TR.hold=null;
  note.holdActive=false;
  if(ok){
    note.judged=true; note.result=h.res; note.hitT=chartNow();
    var res=h.res, w=res==='perfect'?1:(res==='great'?0.75:0.4);
    G.stat[res]++; G.stat.judged++; G.stat.weighted+=w; G.stat.combo++;
    if(G.stat.combo>G.stat.maxCombo) G.stat.maxCombo=G.stat.combo;
    G.lastDelta=h.d*1000;
    TR.offMarks.push({d:G.lastDelta,t0:note.hitT});
    if(TR.offMarks.length>6) TR.offMarks.shift();
    var om=0;
    for(var mi=0;mi<TR.offMarks.length;mi++) om+=TR.offMarks[mi].d;
    TR.offAvg=om/TR.offMarks.length;
    addFx(note.lane,'bot');
    addPop(note.lane,res,'bot');
    if(G.stat.combo%10===0){
      var bn=G.stat.combo>=100?22:(G.stat.combo>=50?16:(G.stat.combo>=25?12:8));
      addBurst(laneX(note.lane),rowY('bot')-holeR()*0.35,bn);
      if(G.stat.combo===10||G.stat.combo===25||G.stat.combo===50||G.stat.combo===100){
        milestone(G.stat.combo); musicCombo(G.stat.combo);
      }
    }
    TR.hopAt=note.hitT;
    click(AC.currentTime,true);
  }else{
    click(AC.currentTime,false);
    judgeMiss(note);
  }
  updateHud();
}
function releaseHold(){
  var h=TR.hold;
  if(!h||TR.paused) return;
  var tNow=chartNow()-(save.offset||0)/1000;
  if(tNow>=h.note.t+h.note.hold-HOLD.release) finishHold(true);
  else finishHold(false);
}
function holdTick(nowRel){
  var h=TR.hold;
  if(!h||TR.paused) return;
  var tNow=nowRel-(save.offset||0)/1000;
  if(tNow>=h.note.t+h.note.hold-HOLD.auto) finishHold(true);
}
function updateHud(){
  var st=G.stat; if(!st) return;
  var a=st.judged?st.weighted/st.judged*100:100;
  els.hudAcc.textContent=a.toFixed(1)+'%';
  els.hudCombo.textContent=st.combo;
  var cb=els.hudCombo;
  /* 连击档位换色 */
  var lv=st.combo>=100?100:(st.combo>=50?50:(st.combo>=25?25:(st.combo>=10?10:0)));
  if(TR.comboLv!==lv){
    cb.classList.remove('c10','c25','c50','c100');
    if(lv) cb.classList.add('c'+lv);
    TR.comboLv=lv;
  }
  /* 轻量弹跳：优先 Web Animations，避免强制回流 */
  if(st.combo>0&&!lowPower&&!QUAL.low&&cb.animate){
    try{
      if(TR.comboAnim) TR.comboAnim.cancel();
      TR.comboAnim=cb.animate(
        [{transform:'scale(1)'},{transform:'scale(1.32)'},{transform:'scale(1)'}],
        {duration:220,easing:'cubic-bezier(.2,1.4,.4,1)'}
      );
    }catch(e){}
  }else if(!cb.animate&&st.combo>0&&!lowPower){
    cb.classList.remove('pop');
    void cb.offsetWidth;
    cb.classList.add('pop');
  }
}
function finishLevel(){
  if(G.phase==='done') return;
  G.phase='done';
  if(TR.hold){ TR.hold.note.holdActive=false; TR.hold=null; }
  updateSkipBtn();
  hideCoach();
  stopSched();
  stopCountIn();
  stopAmbience();
  var total=G.notes.length;
  for(var i=0;i<G.notes.length;i++){
    var n=G.notes[i];
    if(!n.judged){ n.judged=true; n.result='miss'; G.stat.miss++; }
  }
  var acc=total?G.stat.weighted/total*100:0;
  var g=gradeOf(acc);
  var idx=G.levelIdx, L=G.L;
  var passed=L.tutorial||acc>=60;
  var prev=save.best[L.id];
  var improved=!L.tutorial&&!!prev&&acc>prev.acc+0.01;
  /* 只在「本次比历史最好更好（或首次通关）」时上报：
     服务端按 uid+曲目 取更优成绩，重复上报只会把提交时间往后推，影响同分排序 */
  if(passed&&(!prev||improved)) rankSubmit(L,acc);
  if(!L.tutorial&&(!prev||improved)) save.best[L.id]={acc:Math.round(acc*10)/10,grade:g,combo:G.stat.maxCombo,clear:passed};
  var tier=tierOf(L);
  var tierIdx=tier.levels.indexOf(L);
  var unlockOk=passed;
  var unlockedNew=false;
  if(unlockOk && tierIdx>=0 && tierIdx+1<tier.levels.length){
    var np=Math.min(tier.levels.length,tierIdx+2);
    if(np>(save.progress[tier.id]||1)){
      save.progress[tier.id]=np;
      unlockedNew=true;
    }
  }
  persist();
  var nextL=LEVELS[idx+1];
  var nextOk=!!nextL&&isLevelUnlocked(nextL);
  /* 结算面板 */
  var rg=$('rGrade');
  rg.textContent=g;
  rg.className='grade g-'+g;
  /* 结算月巴：按评级换立绘反应 */
  var rb=$('rBunny');
  if(rb){
    var ri=g==='S'?0:(g==='A'?1:(g==='B'?2:3));
    var rk=BUNNY_SLOT[ri]===undefined?ri:BUNNY_SLOT[ri];
    rb.src=BUNNY_POOL[rk];
    rb.className='rBunny g-'+g;
  }
  $('rAcc').textContent=acc.toFixed(1)+'%';
  $('rCombo').textContent=t('maxCombo')+' '+G.stat.maxCombo;
  $('rKicker').textContent='// '+t('kickerResult')+' · '+levelName(L)+' //';
  $('rNew').style.display=improved?'inline-block':'none';
  $('rNew').textContent=t('newRecord');
  var rows=[
    ['perfect','var(--mint)'],['great','var(--butter)'],['good','#8FA8BF'],['miss','var(--danger)']
  ];
  var rh='';
  for(var k=0;k<rows.length;k++){
    rh+='<span class="rrow"><i style="background:'+rows[k][1]+'"></i>'+t(rows[k][0])+' <b>'+G.stat[rows[k][0]]+'</b></span>';
  }
  $('rRows').innerHTML=rh;
  $('btnNext').disabled=!nextOk;
  $('btnNext').textContent=t('next');
  $('btnRetry').textContent=t('retry');
  $('btnToMenu').textContent=t('toMenu');
  show('resultScr');
  G.screen='result';
  G.pops=[]; G.fx=[]; G.burst=[];
  TR.big=-1; els.bigNum.classList.remove('on');
  var bar=$('bar'); if(bar) bar.classList.remove('beating');
  $('segChip').classList.remove('on');
  if(TR.segT){ clearTimeout(TR.segT); TR.segT=null; }
  ctx.clearRect(0,0,view.w,view.h);
  var nextInTier=tierIdx>=0?tier.levels[tierIdx+1]:null;
  var campaignEnd=!!L.chapter&&!L.classic&&!!nextInTier&&(!!nextInTier.legacy||!!nextInTier.classic);
  var chapterEnd=!!L.chapter&&(!nextInTier||nextInTier.chapter!==L.chapter);
  if(campaignEnd&&unlockOk) toast(t(tier.id==='hard'?'campaignClearHard':'campaignClear'));
  else if(chapterEnd&&unlockOk) toast(t('chapterClear',{n:chapName(L)}));
  else if(unlockedNew) toast(t('levelUp'));
  else if(nextL&&!nextOk) toast(t('unlockNeed'));
}

/* =========================================================
   8. 渲染
   ========================================================= */
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=els.cv.clientWidth||1, h=els.cv.clientHeight||1;
  els.cv.width=Math.max(1,Math.round(w*dpr));
  els.cv.height=Math.max(1,Math.round(h*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  view.w=w; view.h=h; view.dpr=dpr;
  invalidateBaseCache();
}
function laneX(lane){
  var lanes=G.L?G.L.lanes:1;
  return view.w*(lane+0.5)/lanes;
}
function holeR(){
  var lanes=G.L?G.L.lanes:1;
  return Math.min(view.w/Math.max(1,lanes)*0.42,view.h*0.155,74);
}
/* 上方历史带的下边界：与 drawHistory 的几何保持一致 */
function histBandBottom(){
  var W=view.w,H=view.h;
  var narrow=W<640;
  var rows=narrow?2:1, barsPerRow=narrow?1:3;
  var histR=Math.min(16,Math.max(5,(W-80)/(barsPerRow*16))*0.90);
  return H*0.145+(rows*histR*2.15)/2+histR*0.35;
}
/* 两行洞口位置：整体下移，保证月巴的头顶不会钻进上方历史带；
   演奏行同时给试听行留出月巴身位，并保证洞口键位不出画 */
function rowY(row){
  var H=view.h, r=holeR();
  if(row==='top'){
    return clamp(histBandBottom()+r*1.62+14,H*0.30,H*0.48);
  }
  var top=rowY('top');
  return clamp(Math.max(H*0.79,top+r*2.0+10),H*0.76,H-r*0.86);
} 
/* 冒出弹簧：0 → 1，中段带一次明显过冲再落定，像从洞口弹出来 */
function popEase(u){
  if(u<=0) return 0;
  if(u>=1) return 1;
  return 1-Math.exp(-2.6*u)*Math.cos(2*Math.PI*u);
}
function ellPath(x,y,rx,ry,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.scale(rx,ry);
  ctx.beginPath();
  ctx.arc(0,0,1,0,Math.PI*2);
  ctx.restore();
}
function drawBunny(x,y,r,color,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ellPath(x-r*0.42,y-r*1.02,r*0.24,r*0.62,-0.22); ctx.fill();
  ellPath(x+r*0.42,y-r*1.02,r*0.24,r*0.62,0.22); ctx.fill();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,253,248,.95)';
  ctx.lineWidth=Math.max(1.4,r*0.10);
  ctx.stroke();
  ctx.fillStyle='#3C3A33';
  ctx.beginPath(); ctx.arc(x-r*0.32,y-r*0.06,Math.max(1.2,r*0.085),0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.32,y-r*0.06,Math.max(1.2,r*0.085),0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=alpha*0.55;
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(x-r*0.46,y+r*0.24,r*0.16,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*0.46,y+r*0.24,r*0.16,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
/* 图鉴外链图优先，未加载时回退手绘；
   imgIdx 是洞位 0~3，经 BUNNY_SLOT 映射到本关专属的池下标 */
function bunnyAt(x,y,r,imgIdx,alpha){
  if(alpha<=0.01) return;
  var s=((imgIdx%4)+4)%4;
  var k=BUNNY_SLOT[s];
  if(k===undefined) k=s;
  /* 历史带里的小月巴用 96 的小图，避免每帧从 256 纹理大幅缩小采样 */
  var small=r*2*(view.dpr||1)<=110;
  var sp=(small?bunnySpriteSm[k]:bunnySprite[k])||bunnySprite[k]||bunnySpriteSm[k];
  if(!sp&&bunnyImg[k]&&bunnyImg[k].complete&&bunnyImg[k].naturalWidth){
    bunnySprite[k]=makeBunnySprite(bunnyImg[k],256);
    bunnySpriteSm[k]=makeBunnySprite(bunnyImg[k],96);
    sp=small?bunnySpriteSm[k]:bunnySprite[k];
  }
  if(sp){
    /* 只为透明度改动临时切 globalAlpha，省掉每只月巴的 save/restore */
    if(alpha!==1){
      var pa=ctx.globalAlpha;
      ctx.globalAlpha=alpha;
      ctx.drawImage(sp,x-r,y-r,r*2,r*2);
      ctx.globalAlpha=pa;
    }else{
      ctx.drawImage(sp,x-r,y-r,r*2,r*2);
    }
  }else{
    drawBunny(x,y,r,COLORS[s],alpha);
  }
}
function resultColor(res){
  return res==='perfect'?'#5AA9A3':res==='great'?'#C9971C':res==='good'?'#5C7FA3':'#C94A24';
}
function drawHeart(cx,cy,s,color,alpha,rot){
  if(alpha<=0) return;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.translate(cx,cy);
  if(rot) ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0,s*0.9);
  ctx.bezierCurveTo(-s*1.5,-s*0.35,-s*0.9,-s*1.5,0,-s*0.5);
  ctx.bezierCurveTo(s*0.9,-s*1.5,s*1.5,-s*0.35,0,s*0.9);
  ctx.fill();
  ctx.restore();
}
var sadShadeCv=null;
/* 阴影预渲染成小贴图：不再每帧、每只月巴都新建径向渐变 */
function sadShadeSprite(){
  if(sadShadeCv) return sadShadeCv;
  var s=128, c=document.createElement('canvas'); c.width=s; c.height=s;
  var g=c.getContext('2d');
  var gr=g.createRadialGradient(s*0.5,s*0.5,s*0.03,s*0.5,s*0.5,s*0.5);
  gr.addColorStop(0,'rgba(36,48,92,.24)');
  gr.addColorStop(0.55,'rgba(36,48,92,.12)');
  gr.addColorStop(1,'rgba(36,48,92,0)');
  g.fillStyle=gr;
  g.beginPath(); g.arc(s*0.5,s*0.5,s*0.5,0,Math.PI*2); g.fill();
  sadShadeCv=c;
  return c;
}
function drawSadMood(cx,cy,r,alpha){
  if(alpha<=0) return;
  ctx.save();
  ctx.globalAlpha=alpha;
  /* 上半身盖一层墨蓝阴影，不画表情 */
  ctx.drawImage(sadShadeSprite(),cx-r*0.95,cy-r*1.20,r*1.9,r*1.7);
  /* 头顶郁闷圈圈：上下浮、呼吸放大、左右摇，像晕乎乎打转 */
  var t=AC?AC.currentTime:0;
  var bob=Math.sin(t*2.6)*r*0.05;
  var pulse=1+Math.sin(t*3.3)*0.10;
  var spin=Math.sin(t*2.2)*0.22;
  ctx.translate(cx,cy-r*1.16+bob);
  ctx.rotate(spin);
  ctx.scale(pulse,pulse*0.92);
  ctx.strokeStyle='rgba(36,48,92,.78)';
  ctx.lineWidth=Math.max(1,r*0.045);
  ctx.lineCap='round';
  ctx.beginPath();
  var turns=Math.PI*4.2;
  for(var a=0;a<=turns;a+=0.24){
    var rr=r*(0.05+(a/turns)*0.30);
    var px=Math.cos(a)*rr, py=Math.sin(a)*rr*0.55;
    if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.stroke();
  ctx.restore();
}
/* —— 月巴表情贴纸：纯色图元，无渐变/无阴影，低功耗下不调用 —— */
function markAge(now,t0,dur){

function drawStarMark(x,y,s,a,color){

/* 四档判定的表情层：身体语言之外的符号贴纸 */
function drawResultMarks(now,n,r,res,al){
  var age,a;
  if(res==='perfect'){
    age=markAge(now,n.hitT,0.6); if(age<0) return;
    a=(1-age/0.6)*al;
    drawBlush(0,-r*0.16,r,a*0.85);
    drawStarMark(-r*0.74,-r*0.92-age*r*0.50,r*0.16,a);
    drawStarMark(r*0.80,-r*1.02-age*r*0.70,r*0.11,a);
    drawNoteMark(r*0.58,-r*1.12-age*r*0.90,r*0.12,a);
  }else if(res==='great'){
    age=markAge(now,n.hitT,0.4); if(age<0) return;
    a=(1-age/0.4)*al;
    drawStarMark(r*0.72,-r*0.95-age*r*0.55,r*0.13,a);
  }else if(res==='good'){
    age=markAge(now,n.hitT,0.3); if(age<0) return;
    a=(1-age/0.3)*al;
    drawSweatMark(r*0.55,-r*0.55,r*0.11,a);
  }else if(res==='miss'){
    age=markAge(now,n.missT,0.9); if(age<0) return;
    a=(1-age/0.9)*al;
    drawTear(r*0.34,-r*0.02+(1-a)*r*0.45,r*0.12,a*0.9);
    drawDotsMark(r*0.55,-r*0.86,r*0.10,a*0.8);
  }
}
function holePath(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2); }
function addFx(lane,row){
  if(lowPower||QUAL.low) return;

  if(G.fx.length>40) G.fx.shift();
}
function addWhiff(lane,row){
  if(lowPower||QUAL.low) return;
  G.fx.push({lane:lane,row:row||'bot',t0:chartNow(),whiff:true});
  if(G.fx.length>40) G.fx.shift();
}
function addPop(lane,kind,row){
  G.pops.push({lane:lane,row:row||'bot',kind:kind,t0:chartNow()});
  if(G.pops.length>24) G.pops.shift();
}
function addBurst(x,y,n){
  if(lowPower||QUAL.low) return;
  var pal=['#D4552B','#E9C46A','#5AA9A3','#8C7AA8','#FFF9ED'];
  var t0=chartNow();
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, sp=34+Math.random()*66;
    G.burst.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-28,t0:t0,
      c:pal[i%pal.length],sz:1.5+Math.random()*2.0});
  }
  if(G.burst.length>60) G.burst.splice(0,G.burst.length-60);

function segChip(mode){

  el.textContent=mode==='play'?t('rowPlay'):t('rowDemo');
  el.classList.add('on');
  if(TR.segT) clearTimeout(TR.segT);

}
/* 静态层离屏缓存：纸面、五线谱、洞口、键位只画一次，换段/换关/改尺寸才重建 */
var baseCv=null, baseCtx=null, baseKey='';
function invalidateBaseCache(){ baseKey=''; }
function buildBase(mode){
  var W=view.w, H=view.h, dpr=view.dpr||1;
  var key=W+'x'+H+'|'+dpr+'|'+mode+'|'+(G.L?G.L.id:'');
  if(baseKey===key&&baseCv) return baseCv;
  if(!baseCv){
    baseCv=document.createElement('canvas');
    baseCtx=baseCv.getContext('2d');
  }
  var pw=Math.max(1,Math.round(W*dpr)), ph=Math.max(1,Math.round(H*dpr));
  if(baseCv.width!==pw||baseCv.height!==ph){ baseCv.width=pw; baseCv.height=ph; }
  baseCtx.setTransform(dpr,0,0,dpr,0,0);
  baseCtx.clearRect(0,0,W,H);
  var old=ctx; ctx=baseCtx;
  var lanes=G.L?G.L.lanes:1, r=holeR();
  var yTop=rowY('top'), yBot=rowY('bot');
  /* 纸面 */
  var bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#FBF5E6');
  bg.addColorStop(0.55,'#F6EEDC');
  bg.addColorStop(1,'#EFE4D0');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);
  /* 上下两行的底色：试听薄荷、演奏朱红 */
  ctx.fillStyle='rgba(36,48,92,.045)';
  ctx.fillRect(0,0,W,H*0.525);
  ctx.fillStyle='rgba(212,85,43,.035)';
  ctx.fillRect(0,H*0.525,W,H*0.475);
  /* 中间柔光 */
  var glow=ctx.createRadialGradient(W*0.5,H*0.525,10,W*0.5,H*0.525,Math.max(W,H)*0.55);
  glow.addColorStop(0,'rgba(255,249,237,.55)');
  glow.addColorStop(0.55,'rgba(255,249,237,.14)');
  glow.addColorStop(1,'rgba(255,249,237,0)');
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(36,48,92,.12)';
  ctx.lineWidth=1;
  ctx.strokeRect(0.5,0.5,W-1,H-1);
  /* 五线谱带 + 小节线 */
  band(yTop,mode==='demo','demo');
  band(yBot,mode==='play','play');
  /* 洞位分隔（浅虚竖线，铺满整个台面） */
  ctx.save();
  ctx.strokeStyle='rgba(36,48,92,.07)';
  ctx.lineWidth=1;
  ctx.setLineDash([4,6]);
  for(var d=1;d<lanes;d++){
    ctx.beginPath();
    ctx.moveTo(W*d/lanes,16);
    ctx.lineTo(W*d/lanes,H-10);
    ctx.stroke();
  }
  ctx.restore();
  /* 上下行之间的分界虚线 + 朱红小菱形 */
  ctx.save();
  ctx.strokeStyle='rgba(36,48,92,.20)';
  ctx.setLineDash([8,8]);
  ctx.beginPath();
  ctx.moveTo(8,H*0.525);
  ctx.lineTo(W-8,H*0.525);
  ctx.stroke();
  ctx.restore();
  ctx.save();
  ctx.translate(W*0.5,H*0.525);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle='rgba(212,85,43,.65)';
  ctx.fillRect(-3,-3,6,6);
  ctx.restore();
  /* 行标题：试听 / LISTEN，演奏 / PLAY */
  var lf=Math.max(9,Math.min(11,r*0.17));
  ctx.textAlign='left';
  ctx.font='900 '+lf+'px '+UI_FONT;
  ctx.fillStyle=mode==='demo'?'rgba(36,48,92,.92)':'rgba(36,48,92,.28)';
  ctx.fillText(t('rowDemo'),12,H*0.525-12);
  ctx.font='800 7px '+UI_FONT;
  ctx.fillStyle=mode==='demo'?'rgba(36,48,92,.78)':'rgba(36,48,92,.22)';
  ctx.fillText('LISTEN',12,H*0.525-2);
  ctx.font='900 '+lf+'px '+UI_FONT;
  ctx.fillStyle=mode==='play'?'rgba(212,85,43,.95)':'rgba(36,48,92,.28)';
  ctx.fillText(t('rowPlay'),12,H*0.525+14);
  ctx.font='800 7px '+UI_FONT;
  ctx.fillStyle=mode==='play'?'rgba(212,85,43,.75)':'rgba(36,48,92,.22)';
  ctx.fillText('PLAY',12,H*0.525+23);
  /* 两行洞口 */
  var keys=KEYSETS[lanes]||KEYSETS[4];
  holes(yTop,mode==='demo'?1:0.30,'demo',keys);
  holes(yBot,mode==='play'?1:0.30,'play',keys);
  ctx=old;
  baseKey=key;
  return baseCv;

  function band(y,active,role){
    var g=Math.max(3,r*0.055);
    var ac=role==='play'?'rgba(212,85,43':'rgba(36,48,92';
    ctx.save();
    ctx.strokeStyle=active?(ac+',.14)'):'rgba(36,48,92,.09)';
    ctx.lineWidth=1;
    for(var i=-2;i<=2;i++){
      ctx.beginPath();
      ctx.moveTo(12,y+i*g);
      ctx.lineTo(W-12,y+i*g);
      ctx.stroke();
    }
    ctx.strokeStyle=active?(ac+',.28)'):'rgba(36,48,92,.18)';
    ctx.beginPath(); ctx.moveTo(12,y-2.6*g); ctx.lineTo(12,y+2.6*g); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-16,y-2.6*g); ctx.lineTo(W-16,y+2.6*g); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-10,y-2.6*g); ctx.lineTo(W-10,y+2.6*g); ctx.stroke();
    ctx.strokeStyle=active?(ac+',.11)'):'rgba(36,48,92,.07)';
    for(var q=1;q<4;q++){
      var xx=W*q/4;
      ctx.beginPath(); ctx.moveTo(xx,y-2.6*g); ctx.lineTo(xx,y+2.6*g); ctx.stroke();
    }
    ctx.fillStyle=active?(ac+',.30)'):'rgba(36,48,92,.24)';
    ctx.font='900 '+Math.round(g*9.6)+'px "Segoe UI Symbol","Apple Symbols","Noto Music","Bravura",serif';
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillText('\uD834\uDD1E',18,y);
    ctx.restore();
  }
  function holes(y,alpha,role,keys){
    for(var i=0;i<lanes;i++){
      var hx=laneX(i);
      ctx.save();
      ctx.globalAlpha=alpha;
      if(alpha>0.6){
        ctx.strokeStyle=role==='play'?'rgba(212,85,43,.55)':'rgba(36,48,92,.55)';
        ctx.lineWidth=1.4;
        holePath(hx,y,r*0.94,r*0.29); ctx.stroke();
      }
      ctx.save();
      ctx.globalAlpha=alpha*0.16; ctx.fillStyle='#3A3B2F';
      holePath(hx,y+r*0.12,r*0.98,r*0.28); ctx.fill();
      ctx.restore();
      ctx.fillStyle='#E6DAC3';
      holePath(hx,y,r*0.94,r*0.29); ctx.fill();
      ctx.fillStyle='#CBBDA2';
      holePath(hx,y,r*0.80,r*0.22); ctx.fill();
      ctx.fillStyle='#8E8066';
      holePath(hx,y,r*0.60,r*0.15); ctx.fill();
      ctx.fillStyle='rgba(255,250,240,.45)';
      holePath(hx,y-r*0.05,r*0.86,r*0.22); ctx.fill();
      var kf=Math.max(9,Math.min(12,r*0.24));
      ctx.fillStyle=role==='play'?'rgba(212,85,43,.80)':'rgba(36,48,92,.62)';
      ctx.font='800 '+kf+'px '+UI_FONT;
      ctx.textAlign='center';
      ctx.fillText(keys[i]||String(i+1),hx,y+r*0.72);
      ctx.restore();
    }
  }
}
function draw(now,mode){
  var W=view.w, H=view.h;
  if(!W||!H){ return; }
  ctx.clearRect(0,0,W,H);
  if(!G.L||!G.notes) return;
  var lanes=G.L.lanes, r=holeR();
  var yTop=rowY('top'), yBot=rowY('bot');
  var FF=UI_FONT;
  var lean=lowPower;   /* 月巴动态只受手动省电开关控制，不因自动降档而停 */
  /* 静态层一次画好，逐帧只做一次贴图 */
  var base=buildBase(mode);
  if(base) ctx.drawImage(base,0,0,W,H);
  /* 本帧的可摸热区（历史带 + 试听行）：复用对象，避免每帧新建数组造成 GC 抖动 */
  var hitN=0;
  function pushHit(hx,hy,hr,kind,ref){
    var o=G.petHit[hitN]||(G.petHit[hitN]={});
    o.x=hx;o.y=hy;o.r=hr;o.kind=kind;o.ref=ref;
    hitN++;
  }
  /* 谱面角标：BPM / 短句标签（动态文字，单独画） */
  drawScoreTags();
  /* 洞口收缩圈先画，月巴后画：圈永远在月巴下面 */
  if(mode==='demo') drawRings(yTop,1,'demo');
  else drawRings(yBot,1,'play');
  /* 正在演的那一行才冒月巴 */
  if(mode==='demo') drawBunnies(yTop,'demo');
  else drawBunnies(yBot,'play');
  /* 上方小节历史：打完的月巴固定在这里 */
  drawHistory();
  G.petHit.length=hitN;
  /* 打击光环 */
  if(!lean){
    for(var f=G.fx.length-1;f>=0;f--){
      var e=G.fx[f];
      var age=now-e.t0;
      if(age<0||age>0.5){ if(age>0.5) G.fx.splice(f,1); continue; }
      var fy=e.row==='top'?yTop:yBot;
      var a=1-age/0.5;
      ctx.save();
      ctx.globalAlpha=a*0.55;
      if(e.whiff){
        ctx.strokeStyle='rgba(36,48,92,.45)';
        ctx.lineWidth=2;
        holePath(laneX(e.lane),fy,r*0.94+age*26,r*0.29+age*8); ctx.stroke();
      }else{
        ctx.fillStyle=e.row==='bot'?'rgba(212,85,43,.9)':'rgba(36,48,92,.85)';
        ctx.globalAlpha=a*0.34;
        holePath(laneX(e.lane),fy,r*(0.4+age*1.3),r*(0.16+age*0.45)); ctx.fill();
        ctx.globalAlpha=a*0.75;
        ctx.strokeStyle=e.row==='bot'?'rgba(212,85,43,.9)':'rgba(36,48,92,.85)';
        ctx.lineWidth=3*a+0.5;
        holePath(laneX(e.lane),fy,r*(0.5+age*1.6),r*(0.2+age*0.55)); ctx.stroke();
        /* 洞口被戳一下的白亮内圈 */
        if(age<0.24){
          var kk=age/0.24;
          ctx.globalAlpha=(1-kk)*0.42;
          ctx.fillStyle='rgba(255,250,240,.9)';
          holePath(laneX(e.lane),fy,r*0.92*(1-0.08*Math.sin(kk*Math.PI)),
            r*0.28*(1-0.16*Math.sin(kk*Math.PI))); ctx.fill();
        }
      }
      ctx.restore();
    }
  }
  /* 判定文字：命中弹一下、miss 下沉 */
  for(var p=G.pops.length-1;p>=0;p--){
    var q2=G.pops[p];
    var age2=now-q2.t0;
    if(age2<0) continue;
    if(age2>0.62){ G.pops.splice(p,1); continue; }
    if(q2.kind==='whiff') continue;
    var py=q2.row==='top'?yTop:yBot;
    var al=1-age2/0.62;
    var col2=q2.kind==='perfect'?'#5AA9A3':(q2.kind==='great'?'#C9971C':(q2.kind==='good'?'#5C7FA3':'#D4552B'));
    ctx.save();
    ctx.globalAlpha=al;
    ctx.fillStyle=col2;
    var fs2=12+(lean?0:6*Math.max(0,1-age2/0.12));
    ctx.font='900 '+fs2.toFixed(0)+'px '+FF;
    ctx.textAlign='center';
    var popScale=lean?1:1+0.18*Math.exp(-age2*15);
    var popRot=lean?0:(q2.kind==='miss'?0.09:-0.05)*Math.exp(-age2*9);
    ctx.translate(laneX(q2.lane),py-r*1.7-age2*30);
    ctx.rotate(popRot);
    ctx.scale(popScale,popScale);
    ctx.fillText(t(q2.kind).toUpperCase(),0,0);
    ctx.restore();
  }
  /* 连击礼花：纯色小圆点，无阴影/渐变 */
  if(!lean&&G.burst.length){
    ctx.save();
    for(var bi=G.burst.length-1;bi>=0;bi--){
      var b=G.burst[bi];
      var ba=now-b.t0;
      if(ba<0) continue;
      if(ba>0.45){ G.burst.splice(bi,1); continue; }
      var bx=b.x+b.vx*ba, by=b.y+b.vy*ba+44*ba*ba;
      ctx.globalAlpha=1-ba/0.45;
      ctx.fillStyle=b.c;
      ctx.beginPath(); ctx.arc(bx,by,b.sz,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  /* 连击观众席 / 交棒 / 轮到你 / 悬停 —— 全部为轻量叠加层 */
  drawComboCrowd(now,lean);
  drawCountdown(lean);
  drawHandoff(now,lean);
  drawTurnTip(lean);
  drawHoverRing(lean);
  drawTimingRuler(now,lean);
  drawBreak(now,lean);

  /* 偏移尺：本段命中偏移，早=负 / 晚=正；放在中缝空白带，不挡演奏行 */
  function drawTimingRuler(now2,lean){
    if(G.phase!=='play'||!TR.offMarks.length) return;
    var cy=(G.L&&G.L.tutorial)?H*0.63:H*0.56;
    var half=Math.min(160,W*(lanes>=3?0.18:0.23));
    var cx=W*0.5;
    ctx.save();
    ctx.strokeStyle='rgba(36,48,92,.20)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-half,cy); ctx.lineTo(cx+half,cy); ctx.stroke();
    ctx.strokeStyle='rgba(36,48,92,.16)';
    for(var tk=-150;tk<=150;tk+=50){
      var tx=cx+half*(tk/180), th=(tk===0?7:4);
      ctx.beginPath(); ctx.moveTo(tx,cy); ctx.lineTo(tx,cy+th); ctx.stroke();
    }
    /* 命中落点：前 2.4 秒内淡出；lean 只留最近一次 */
    var lim=lean?1:TR.offMarks.length;
    for(var mi=TR.offMarks.length-lim;mi<TR.offMarks.length;mi++){
      var mk=TR.offMarks[mi];
      var age=now2-mk.t0;
      if(age<0||age>2.4) continue;
      var a=lean?0.55:0.62*(1-age/2.4)+0.1;
      var dx=Math.max(-180,Math.min(180,mk.d));
      var mx=cx+half*(dx/180);
      ctx.globalAlpha=a;
      ctx.fillStyle='rgba(36,48,92,.85)';
      ctx.fillRect(mx-1.5,cy-8,3,5);
      ctx.globalAlpha=1;
    }
    var last=TR.offMarks[TR.offMarks.length-1];
    var ld=Math.max(-180,Math.min(180,last.d));
    var lx=cx+half*(ld/180);
    ctx.strokeStyle=Math.abs(last.d)>60?'rgba(212,85,43,.9)':(Math.abs(last.d)<=JUDGE.perfect*1000?'rgba(90,169,163,.95)':'rgba(36,48,92,.85)');
    ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(lx,cy-11); ctx.lineTo(lx,cy+5); ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;
    ctx.beginPath(); ctx.arc(lx,cy-9,2.1,0,Math.PI*2); ctx.fill();
    /* 读数 */
    ctx.textBaseline='middle';
    ctx.font='800 8px '+FF;
    ctx.textAlign='left';
    ctx.fillStyle='rgba(36,48,92,.62)';
    ctx.fillText((last.d>0?'+':'')+Math.round(last.d)+' ms',cx+half+8,cy-2);
    if(half>70){
      ctx.font='800 7px '+FF;
      ctx.fillStyle='rgba(36,48,92,.30)';
      ctx.textAlign='left';
      ctx.fillText(t('early'),cx-half,cy-8);
      ctx.textAlign='right';
      ctx.fillText(t('late'),cx+half,cy-8);
    }
    if(TR.offMarks.length>=3){
      ctx.textAlign='center';
      ctx.font='800 7px '+FF;
      ctx.fillStyle='rgba(36,48,92,.34)';
      ctx.fillText(t('avgMs',{n:(TR.offAvg>0?'+':'')+Math.round(TR.offAvg)}),cx,cy+15);
    }
    ctx.restore();
  }

  /* 断连提示：只在 ≥10 连被打断时出现，0.95 秒后消失 */
  function drawBreak(now2,lean){
    if(G.phase!=='play') return;
    if(!TR.breakAt||TR.breakAt<0) return;
    var age=now2-TR.breakAt;
    if(age<0||age>0.95) return;
    var al=lean?0.5:Math.max(0,0.62*(1-age/0.95));
    var txt=t('comboBreak',{n:TR.breakN});
    ctx.save();
    ctx.globalAlpha=al;
    ctx.font='900 9px '+FF;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    var tw=ctx.measureText(txt).width;
    ctx.fillStyle='rgba(36,48,92,.72)';
    ctx.fillText(txt,W*0.5,H*0.435);
    ctx.strokeStyle='rgba(212,85,43,.7)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(W*0.5-tw/2-5,H*0.435+9);
    ctx.lineTo(W*0.5+tw/2+5,H*0.435+9);
    ctx.stroke();
    ctx.restore();
  }

  function drawScoreTags(){
    ctx.save();
    ctx.textAlign='left';
    ctx.textBaseline='top';
    ctx.font='800 9px '+FF;
    ctx.fillStyle='rgba(212,85,43,.90)';
    var beatLen=(G.chart&&G.chart.beat>0)?G.chart.beat:0.75;
    var barNo=Math.max(1,Math.min(G.L.bars||1,Math.floor(now/(beatLen*4))+1));
    ctx.fillText('BPM '+G.L.bpm+' · 4/4 · BAR '+barNo+'/'+(G.L.bars||0),18,14);
    ctx.strokeStyle='rgba(212,85,43,.35)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(18,28); ctx.lineTo(132,28); ctx.stroke();
    /* 四拍灯：当前拍朱红点亮；倒数/待机时不亮 */
    var bin=(now>=0)?(Math.floor(now/beatLen)%4):-1;
    for(var bd=0;bd<4;bd++){
      var dx0=22+bd*16;
      ctx.beginPath(); ctx.arc(dx0,28,2.2,0,Math.PI*2);
      if(bin===bd){
        ctx.fillStyle='rgba(212,85,43,.88)'; ctx.fill();
      }else{
        ctx.strokeStyle='rgba(36,48,92,.26)'; ctx.lineWidth=1; ctx.stroke();
      }
    }
    var lab=phraseLabel(G.phraseIdx);
    var tag=(lab?lab+' · ':'')+(G.phraseIdx+1)+'/'+G.phrases.length;
    ctx.textAlign='right';
    ctx.fillStyle='rgba(36,48,92,.55)';
    ctx.fillText(tag,W-18,44);
    ctx.restore();
  }
  /* 洞口收缩圈：拍点前 lead 秒从大圈收到洞口边缘
     先于月巴绘制，所以永远在月巴下面；分段 + 柔光 + 最后一刻洞口亮边 */
  function drawRings(y,alpha,role){
    var ph=TR.phrase;
    if(!ph) return;
    var off=(role==='demo')?0:(save.offset||0)/1000;
    var col=role==='play'?'212,85,43':'36,48,92';
    for(var i=0;i<lanes;i++){
      var best=null;
      for(var k=ph.i0;k<ph.i1;k++){
        var n=G.notes[k];
        if(n.lane!==i) continue;
        if(role==='play'&&n.judged) continue;
        var dt=n.t+off-now;
        if(dt>RING.lead) break;           /* 还没到该提示的时候 */
        if(dt<0) continue;                /* 已经过了这一拍，等下一拍 */
        best=n; break;
      }
      if(!best) continue;
      var pr=clamp((best.t+off-now)/RING.lead,0,1);   /* 1=刚出现，0=正好到洞口 */
      /* 大圈按洞里可用空间收边，别被画布裁掉 */
      var room=Math.min(laneX(i)-6,view.w-laneX(i)-6);
      var maxSc=Math.min(RING.max,room/(r*0.94));
      maxSc=Math.max(maxSc,RING.min+0.10);
      var sc=maxSc-(maxSc-RING.min)*(1-pr);
      var cx=laneX(i), rx=r*0.94*sc;
      var ry=r*0.29*sc*(1-0.10*Math.pow(1-pr,3));
      var base=alpha*(0.18+0.80*(1-pr));
      if(lean){
        ctx.save();
        ctx.globalAlpha=base;
        ctx.strokeStyle='rgba('+col+',1)';
        ctx.lineWidth=1.6+2.8*(1-pr);
        ctx.beginPath(); ctx.ellipse(cx,y,rx,ry,0,0,Math.PI*2); ctx.stroke();
        ctx.restore();
        continue;
      }
      /* 柔光外圈 */
      ctx.save();
      ctx.globalAlpha=base*0.16;
      ctx.strokeStyle='rgba('+col+',1)';
      ctx.lineWidth=5+7*(1-pr);
      ctx.beginPath(); ctx.ellipse(cx,y,rx,ry,0,0,Math.PI*2); ctx.stroke();
      ctx.restore();
      /* 分段目标圈 */
      var segs=12, gap=0.20;
      var rot=(role==='play'?-0.45:0.45)*(1-pr)+Math.sin(now*1.6+i*0.9)*0.045;
      ctx.save();
      ctx.globalAlpha=base;
      ctx.strokeStyle='rgba('+col+',1)';
      ctx.lineWidth=1.4+2.8*(1-pr);
      ctx.lineCap='round';
      for(var sg=0;sg<segs;sg++){
        var a0=(sg/segs)*Math.PI*2-Math.PI/2+rot;
        var a1=a0+(Math.PI*2/segs)*(1-gap);
        ctx.beginPath();
        ctx.ellipse(cx,y,rx,ry,0,a0,a1);
        ctx.stroke();
      }
      ctx.restore();
      /* 最后一刻洞口亮边 */
      if(pr<0.22){
        var flash=clamp((0.22-pr)/0.22,0,1);
        ctx.save();
        ctx.globalAlpha=base*(0.20+0.70*flash);
        ctx.strokeStyle='rgba('+col+',1)';
        ctx.lineWidth=1.2+2.2*flash;
        ctx.beginPath(); ctx.ellipse(cx,y,r*0.94,r*0.29,0,0,Math.PI*2); ctx.stroke();
        ctx.restore();
      }
    }
  }
  function drawBunnies(y,role){
    var ph=TR.phrase;
    if(!ph) return;
    var demo=(role==='demo');
    var STEP=r*1.15;                 /* 每过一拍，整排向左挪一格 */
    /* 这一拍让位的时间：试听按音符时刻走，演奏按判定时刻走 */
    var lastHop=-9;
    if(!demo) lastHop=(TR.hopAt===undefined?-9:TR.hopAt);
    else{
      for(var h=ph.i1-1;h>=ph.i0;h--){
        if(now>=G.notes[h].t){ lastHop=G.notes[h].t; break; }
      }
    }
    var hp=clamp((now-lastHop)/0.2,0,1);
    var hE=hp<0.5?2*hp*hp:1-Math.pow(2-2*hp,2)/2;   /* 起跳快、落地慢 */
    var hopY=-r*0.26*Math.sin(Math.PI*hE);          /* 向左跳的同时向上颠一下 */
    /* 已经过去的月巴：从洞里跳出，向左一字排开，越旧越靠左，可以出界 */
    var slot=0,prevT=null;
    for(var k=ph.i1-1;k>=ph.i0;k--){
      var jn=G.notes[k];
      if(demo){ if(now<jn.t) continue; }
      else if(jn.hitT===undefined&&(jn.missT===undefined||now<jn.t)) continue;
      if(prevT===null||jn.t!==prevT) slot++;
      prevT=jn.t;
      var jx=laneX(jn.lane)-((slot-1)+hE)*STEP;
      if(jx<-r*0.9) continue;
      var sqX=1,sqY=1,al=1,rot=0,lift=0,flash=0;
      var res=jn.result||'';
      if(jn.hitT!==undefined){
        var el=now-jn.hitT;
        if(el>=0&&el<0.60){
          /* 受击：先压扁、再弹起回正；低功耗保留 6 成力度，点击手感不丢 */
          var leanK=lean?0.6:1;
          var strength=(res==='perfect'?2.0:(res==='great'?1.45:0.85))*leanK;
          var qq=Math.exp(-el*5.2)*Math.cos(el*22);
          var punch=Math.exp(-el*26)*0.15*(res==='perfect'?1:0.62)*leanK;
          sqX=Math.max(0.28,1+0.46*strength*qq+punch);
          sqY=Math.max(0.20,1-0.54*strength*qq-punch);
          rot=-0.13*strength*qq;
          lift=-r*0.24*leanK*Math.exp(-el*7.5)*Math.max(0,Math.cos(el*8));
          flash=Math.exp(-el*12);
          if(res==='good') rot+=0.09*Math.sin(el*24)*Math.exp(-el*4.5);
        }
      }else if(jn.missT!==undefined){
        var em=Math.min(Math.max(now-jn.missT,0)/0.3,1);
        sqX=1+0.06*em; sqY=1-0.12*em; rot=0.16*em; al=1-0.55*em;
      }
      /* 命中瞬间月巴身后爆一圈星芒，受击更明显 */
      if(flash>0.2&&!lean){
        drawStarMark(jx,y-r*0.55+hopY+lift,r*0.92*(1+0.3*(1-flash)),flash*0.46,res==='perfect'?'#FFF6D8':'#F7EAD0');
      }
      ctx.save();
      ctx.translate(jx,y-r*0.55+hopY+lift);
      ctx.rotate(rot);
      ctx.scale(sqX*0.62,sqY*0.62);
      var sad=(res==='miss');
      bunnyAt(0,0,r,jn.dimg||0,al);
      if(sad) drawSadMood(0,0,r,al);
      if(!lean) drawResultMarks(now,jn,r,res,al);
      ctx.restore();
      if(res==='perfect'&&!lean&&jn.hitT!==undefined){
        var hAge=now-jn.hitT;
        if(hAge>=0&&hAge<0.8){
          for(var hi=0;hi<2;hi++){
            var hp2=((hAge*1.5+hi*0.5)%1);
            drawHeart(jx+(hi?r*0.28:-r*0.28),y-r*0.55+hopY-r*0.72-hp2*r*1.2,r*0.16,'rgba(226,114,91,.9)',clamp(1-hp2,0,1)*clamp(hAge/0.12,0,1)*0.9);
          }
        }
      }
    }
    /* 洞口待打的那只：冒出后停在原位，同洞不叠娃 */
    var latest=[null,null,null,null];
    for(var q=ph.i0;q<ph.i1;q++){
      var nq=G.notes[q];
      if(demo){ if(now>=nq.t) continue; }
      else if(nq.hitT!==undefined||nq.missT!==undefined) continue;
      if(latest[nq.lane]===null) latest[nq.lane]=nq;
    }
    for(var lane=0;lane<4;lane++){
      var n=latest[lane];
      if(!n) continue;
      var dt=n.t-now;
      /* 冒出的月巴正好在拍点长到满：看得见的「到位」就是击打时刻 */
      var pop=dt>0?(dt>POP.lead?0:popEase(clamp((POP.lead-dt)/POP.lead,0,1))):1;
      if(pop<=0.01) continue;
      var em=Math.min(pop,1);
      var over=Math.max(pop-1,0);          /* 弹出过冲：拉长一点再回正 */
      var ov=lean?0:over;
      var trait=n.trait===undefined?(n.dimg||0):n.trait;
      var seed=n.seed||0;
      var sc=0.26+0.74*em;
      if(ov>0) sc*=1+1.45*ov;
      /* 待机呼吸：性格决定幅度 */
      var amp=trait===0?1.32:(trait===1?0.78:(trait===2?0.86:1.08));
      var breathe=lean?0:Math.sin(now*3.0+n.t*1.7)*0.026*amp;
      sc*=1+breathe;
      /* 拍点抽一下：与真实节拍同频，不改变判定 */
      var bp=0;
      if(!lean&&TR.beatAt!==undefined){
        var ba=now-TR.beatAt;
        if(ba>=0&&ba<0.22) bp=Math.sin((ba/0.22)*Math.PI);
      }
      var bobY=lean?0:Math.sin(now*2.6+n.t*2.2)*r*0.020*amp-r*0.028*bp;
      var rot2=lean?0:Math.sin((now+n.t)*5)*0.065*pop+0.040*bp;
      /* 眨眼：整只轻微一压，立绘无需改眼睛 */
      var blink=0;
      if(!lean&&pop>=1){
        var bcyc=(now+seed*1.3)%(trait===2?5.4:4.2);
        if(bcyc<0.10) blink=1;
      }
      /* 看向最近敲击的洞：好奇性格幅度更大；鼠标悬停时优先看向悬停洞口 */
      var lookX=0;
      var lookTarget=(TR.hoverLane>=0&&G.phase==='play')?TR.hoverLane:TR.lastLane;
      var lookAge=(TR.hoverLane>=0&&G.phase==='play')?0:(now-(TR.lookAt===undefined?-9:TR.lookAt));
      if(!lean&&lookAge>=0&&lookAge<0.7){
        var lf=Math.exp(-lookAge*2.2);
        var lamp=(trait===3?1.5:(trait===1?0.8:0.55));
        lookX=clamp((lookTarget-n.lane)*r*0.045,-r*0.05,r*0.05)*lf*lamp;
      }
      /* 空拍被戳空：受惊弹一下 */
      var startle=0,sx=0;
      if(TR.whiffAt!==undefined&&n.lane===TR.whiffLane){
        var wa=now-TR.whiffAt;
        if(wa>=0&&wa<0.28&&!lean){
          startle=Math.sin((wa/0.28)*Math.PI)*1.35;
          sx=Math.sin(wa*78)*r*0.052*startle;
        }
      }
      /* 试听行可摸：挤压 + 爱心 */
      var petA=-1;
      if(demo&&n.petAt!==undefined) petA=now-n.petAt;
      var petSq=0;
      if(petA>=0&&petA<0.45&&!lean) petSq=Math.exp(-petA*5.6)*Math.cos(petA*20);
      /* 长按月巴：身侧一根持续条，按住时随进度缩短，并顶出爱心 */
      var holdK=n.holdActive?1:0;
      if(n.hold){
        var hoffs=demo?0:(save.offset||0)/1000;
        var hgp=holdK?clamp((now-(n.t+hoffs))/Math.max(0.08,n.hold),0,1):0;
        var poleH=Math.max(r*0.32,r*1.30*(1-hgp))*em;
        var px=laneX(n.lane)-r*0.68;
        var pbot=y+r*0.02;
        var ptop=pbot-poleH;
        ctx.save();
        ctx.globalAlpha=0.60+(holdK?0.32:0);
        ctx.lineCap='round';
        ctx.strokeStyle='rgba(226,114,91,.92)';
        ctx.lineWidth=Math.max(2,r*0.13);
        ctx.beginPath(); ctx.moveTo(px,pbot); ctx.lineTo(px,ptop); ctx.stroke();
        ctx.strokeStyle='rgba(255,249,237,.80)';
        ctx.lineWidth=Math.max(1,r*0.040);
        ctx.beginPath(); ctx.moveTo(px-r*0.033,pbot-r*0.04); ctx.lineTo(px-r*0.033,ptop+r*0.06); ctx.stroke();
        ctx.fillStyle='#e2725b';
        ctx.beginPath(); ctx.arc(px,ptop,Math.max(2,r*0.095),0,Math.PI*2); ctx.fill();
        if(!lean&&holdK){
          ctx.globalAlpha=0.32+0.22*Math.sin(now*9.5);
          ctx.fillStyle='rgba(255,249,237,.95)';
          ctx.beginPath(); ctx.arc(px,ptop,Math.max(1.5,r*0.045),0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
        if(!lean&&!holdK&&em>=0.7){
          ctx.save();
          ctx.globalAlpha=0.9;
          ctx.fillStyle='rgba(212,85,43,.95)';
          ctx.font='900 '+Math.max(7,Math.round(r*0.17))+'px '+FF;
          ctx.textAlign='center';
          ctx.textBaseline='middle';
          ctx.fillText(t('holdTag'),px,ptop-r*0.30);
          ctx.restore();
        }
        if(!lean&&holdK){
          var hsp=(now%0.24)/0.24;
          drawHeart(px+r*0.17,pbot-hsp*r*0.85,r*0.095,'rgba(226,114,91,.9)',(1-hsp)*0.85);
        }
      }
      var holdPress=holdK&&!lean?r*0.012*Math.sin(now*19):0;
      ctx.save();
      ctx.translate(laneX(n.lane)+lookX+sx,y-(r*0.62)*em-r*0.55*ov+bobY+holdK*r*0.10+holdPress);
      ctx.rotate(rot2);
      ctx.scale(sc*(1+0.14*startle+0.13*petSq-0.20*ov+holdK*0.06),sc*(1-0.07*blink-0.16*petSq+0.28*ov-holdK*0.10));
      bunnyAt(0,0,r,n.dimg||0,clamp(pop*2.6,0,1));
      if(!lean){
        if(trait===2&&dt>1.8&&pop>=1){
          var zc=(now+seed)%6.0;
          if(zc<1.0) drawZzz(r*0.58,-r*0.88,r*0.10,Math.sin(zc/1.0*Math.PI)*0.75);
        }
        if(startle>0.05) drawSweatMark(r*0.58,-r*0.55,r*0.11,startle);
        if(petA>=0&&petA<0.5){
          drawHeart(0,-r*0.92-petA*r*1.1,r*0.15,'rgba(226,114,91,.9)',clamp(1-petA/0.5,0,1));
        }
      }
      ctx.restore();
      if(demo){
        pushHit(laneX(n.lane),y-(r*0.62)*em,r*1.18,'demo',n);
      }
    }
  }
  function drawHistory(){
    var hn=AC?AC.currentTime:0;
    var narrow=W<640;
    var rows=narrow?2:1;
    var barsPerRow=narrow?1:3;
    var visibleBars=rows*barsPerRow;
    var histX0=64;
    var histW=W-histX0-16;
    var histStepsPerRow=barsPerRow*16;
    var slotW=Math.max(5,histW/histStepsPerRow);
    var histR=Math.min(16,slotW*0.90);
    var rowH=histR*2.15;
    var bandH=rows*rowH;
    var histY=H*0.145;
    var bandTop=histY-bandH/2-histR*0.45;
    var bandBottom=histY+bandH/2+histR*0.35;
    var endStep=Math.ceil((G.histMax||0)/16)*16;
    var endBar=Math.floor(endStep/16);
    var startBar=Math.max(0,endBar-visibleBars);
    ctx.save();
    ctx.fillStyle='rgba(255,249,237,.62)';
    ctx.fillRect(6,bandTop,W-12,bandBottom-bandTop);
    ctx.strokeStyle='rgba(36,48,92,.10)';
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(8,bandTop); ctx.lineTo(W-8,bandTop); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,bandBottom); ctx.lineTo(W-8,bandBottom); ctx.stroke();
    ctx.fillStyle='rgba(212,85,43,.78)';
    ctx.font='900 7px '+FF;
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillText('HISTORY',12,histY);
    if(rows>1){
      ctx.strokeStyle='rgba(36,48,92,.08)';
      ctx.beginPath();
      ctx.moveTo(histX0,histY);
      ctx.lineTo(W-16,histY);
      ctx.stroke();
    }
    /* 整关小节结果条：每小节一个印章色块 */
    var sq=12, gap=5, sx=64, sy=histY-bandH/2-histR*0.45-13;
    var totalBars=G.L?G.L.bars:0;
    ctx.fillStyle='rgba(212,85,43,.78)';
    ctx.font='900 7px '+FF;
    ctx.textAlign='left';
    ctx.textBaseline='middle';
    ctx.fillText('BARS',12,sy+sq/2);
    for(var bb=0;bb<totalBars;bb++){
      var worst=TR.barWorst[bb]||0;
      var ccol=worst===1?'#5AA9A3':(worst===2?'#C9971C':(worst===3?'#5C7FA3':(worst===4?'#D4552B':null)));
      var bx=sx+bb*(sq+gap);
      if(ccol){
        ctx.fillStyle=ccol;
        ctx.fillRect(bx,sy,sq,sq);
        /* 全 Perfect 小节：印章右上角补一颗小星 */
        if(worst===1) drawStarMark(bx+sq-3,sy+3.5,3.4,0.95,'#FFF6D8');
      }else{
        ctx.strokeStyle='rgba(36,48,92,.18)';
        ctx.strokeRect(bx+0.5,sy+0.5,sq-1,sq-1);
      }
      if(bb===G.phraseIdx){
        ctx.strokeStyle='rgba(36,48,92,.55)';
        ctx.strokeRect(bx-1.5,sy-1.5,sq+3,sq+3);
      }
    }
    for(var b=startBar;b<endBar;b++){
      var barRow=(rows===1)?0:(rows-1-(endBar-1-b));
      if(barRow<0||barRow>=rows) continue;
      var barInRow=(rows===1)?(b-startBar):0;
      if(barInRow<0||barInRow>=barsPerRow) continue;
      var rowTop=histY-bandH/2+barRow*rowH;
      var boxY=rowTop+rowH/2;
      var bx=histX0+barInRow*16*slotW;
      ctx.strokeStyle='rgba(36,48,92,.13)';
      ctx.strokeRect(bx+0.5,boxY-histR*1.05,16*slotW-1,histR*2.10);
      ctx.fillStyle='rgba(36,48,92,.35)';
      ctx.font='700 6px '+FF;
      ctx.textAlign='left';
      ctx.textBaseline='top';
      ctx.fillText(String(b+1),bx+2,boxY+histR*1.24);
    }
    for(var h=0;h<G.hist.length;h++){
      var e=G.hist[h];
      var bar=Math.floor(e.step/16);
      if(bar<startBar||bar>=endBar) continue;
      var barRow=(rows===1)?0:(rows-1-(endBar-1-bar));
      if(barRow<0||barRow>=rows) continue;
      var barInRow=(rows===1)?(bar-startBar):0;
      if(barInRow<0||barInRow>=barsPerRow) continue;
      var within=e.step%16;
      var slot=barInRow*16+within;
      var tx=histX0+(slot+0.5)*slotW;
      var rowTop=histY-bandH/2+barRow*rowH;
      var ty=rowTop+rowH/2;
      var laneOff=lanes>1?((e.lane-(lanes-1)/2)*histR*0.56):0;
      ty+=laneOff;
      var age=hn-e.born;
      var rise=lean?1:clamp(age/0.5,0,1);
      var ease=1-Math.pow(1-rise,3);
      var x=lean?tx:(e.fromX+(tx-e.fromX)*ease);
      var y=lean?ty:(e.fromY+(ty-e.fromY)*ease);
      var scale=lean?1:(0.55+0.45*ease+Math.sin(rise*Math.PI)*0.07);
      var alpha=lean?1:clamp(age/0.22,0,1);
      var bob=lean?0:Math.sin(hn*2.1+h*1.7)*histR*0.055;
      var sad=e.result==='miss';
      var happy=e.result==='perfect';
      /* 落位后挥手 + 被摸时的挤压 */
      var wave=0;
      if(!lean&&e.waveAt!==undefined){
        var wa2=hn-e.waveAt;
        if(wa2>=0&&wa2<0.55) wave=Math.sin(wa2*15)*Math.exp(-wa2*4)*0.19;
      }
      var petAge=(e.petAt!==undefined)?hn-e.petAt:-1;
      var petSq=(petAge>=0&&petAge<0.45&&!lean)?Math.exp(-petAge*5.6)*Math.cos(petAge*20):0;
      /* 按成绩待机：完美（有心心）左右摇摆 + 偶尔小碎步走动；漏拍垂头丧气；其余轻轻点头 */
      var tilt=0,sway=0,swayX=0,sag=0,squashY=0,walkX=0,walkY=0,walkRot=0;
      if(!lean){
        if(happy){
          var swv=Math.sin(hn*3.4+h*0.8);
          sway=swv*0.16;
          swayX=sway*histR*0.85;
          squashY=Math.sin(hn*6.8+h*1.6)*0.05;
          /* 偶尔随机走动：每只间隔 4.6~7.2 秒走一小段，左右交替、带小跳 */
          var wP=4.6+((h*0.37)%2.6);
          var wph=(hn+h*1.9)%wP;
          if(wph<1.35){
            var wu=wph/1.35;
            var wdir=((((hn+h*1.9)/wP)|0)%2===0)?1:-1;
            walkX=Math.sin(Math.PI*wu)*histR*0.30*wdir;
            walkY=-Math.abs(Math.sin(Math.PI*2*wu))*histR*0.20;
            walkRot=wdir*0.12*Math.sin(Math.PI*wu);
          }
        }else if(sad){
          tilt=-0.30-0.055*Math.sin(hn*1.5+h);
          sag=histR*0.16;
        }else{
          tilt=Math.sin(hn*2.3+h*1.3)*0.055;
        }
      }else if(sad){ tilt=-0.22; }
      var px=x+swayX+walkX, py=y+bob+sag+walkY;
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.translate(px,py);
      ctx.rotate(tilt+sway+wave+walkRot);
      ctx.scale(scale*(1+0.14*petSq+(sad?0.06:0)+squashY*0.6),scale*(1-0.16*petSq-(sad?0.085:0)-squashY));
      bunnyAt(0,0,histR,e.dimg||0,1);
      ctx.restore();
      ctx.save();
      ctx.globalAlpha=alpha;
      ctx.strokeStyle=resultColor(e.result);
      ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(px-histR*0.55,ty+histR*0.92);
      ctx.lineTo(px+histR*0.55,ty+histR*0.92);
      ctx.stroke();
      ctx.restore();
      if(sad){
        drawSadMood(px,py,histR,alpha);
        if(!lean){
          var tm=hn-e.born;
          if(tm>=0&&tm<0.9) drawTear(px+histR*0.32,py+histR*0.02+tm*histR*0.45,histR*0.14,(1-tm/0.9)*0.85);
        }
      }else if(e.result==='perfect'){
        /* 头上的心心：会鼓、会摇、会左右飘 */
        var beat=1+0.12*Math.sin(hn*6.4+h*1.7);
        var hrot=Math.sin(hn*4.3+h*1.1)*0.22;
        if(lean){
          drawHeart(px,py-histR*1.05,histR*(0.36+0.03*Math.sin(hn*6+h)),'rgba(226,114,91,.9)',alpha,hrot*0.4);
        }else{
          var phase=((hn*0.9+h*0.37)%1);
          var hsw=Math.sin(hn*3.1+h*2.1)*histR*0.10;
          drawHeart(px+hsw,py-histR*1.0-phase*histR*1.5,histR*0.38*beat,'rgba(226,114,91,.85)',alpha*(1-phase),hrot);
        }
      }
      if(!lean&&petAge>=0&&petAge<0.5){
        drawHeart(px,py-histR*1.0-petAge*histR*1.1,histR*0.30,'rgba(226,114,91,.9)',1-petAge/0.5);
      }
      pushHit(px,py,histR*1.45,'hist',e);
    }
    ctx.restore();
  }
  /* 倒数时从洞里探头，跟着数字一起蹦 */
  function drawCountdown(lean){
    if(lean||!TR.intro||TR.big<=0||!AC) return;
    var t=AC.currentTime-TR.bigAt;
    if(t<0||t>0.55) return;
    var r=holeR();
    for(var i=0;i<lanes;i++){
      var bob=-Math.sin((t/0.55)*Math.PI)*r*0.16;
      bunnyAt(laneX(i),yBot-r*0.55+bob,r*0.62,i===1?1:(i===2?2:0),1);
    }
  }
  /* 连击观众席：从画布底部边缘探头的月巴，连击越高越多 */
  function drawComboCrowd(now2,lean){
    if(lean||!G.stat||G.stat.combo<10) return;
    var r=holeR();
    var rr=Math.max(9,Math.min(18,r*0.30));
    var count=G.stat.combo>=100?4:(G.stat.combo>=50?3:(G.stat.combo>=25?2:1));
    var bp=0;
    if(TR.beatAt!==undefined){
      var ba=now2-TR.beatAt;
      if(ba>=0&&ba<0.22) bp=Math.sin((ba/0.22)*Math.PI);
    }
    for(var i=0;i<count;i++){
      var x=(i%2===0)?(18+Math.floor(i/2)*rr*2.05):(W-18-Math.floor(i/2)*rr*2.05);
      var bob=Math.sin(now2*3.4+i*1.7)*rr*0.18+rr*0.16*bp;
      bunnyAt(x,H-rr*0.55+bob,rr,i===1?1:(i===2?2:0),1);
    }
    if(count>=3){
      ctx.save();
      ctx.strokeStyle='rgba(36,48,92,.28)';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(10,H-r*0.85); ctx.lineTo(10,H-r*1.85); ctx.stroke();
      ctx.fillStyle='#D4552B';
      ctx.beginPath();
      ctx.moveTo(10,H-r*1.85); ctx.lineTo(10+r*0.85,H-r*1.55); ctx.lineTo(10,H-r*1.25);
      ctx.fill();
      ctx.restore();
    }
  }
  /* 试听 → 演奏的交棒：一只月巴从上方跳进演奏行 */
  function drawHandoff(now2,lean){
    if(lean||!AC||TR.segKind!=='hand') return;
    var t=AC.currentTime-TR.segAbs;
    if(t<0) return;
    if(t>=TR.segDur){ TR.segKind=''; return; }
    var r=holeR();
    var u=t/TR.segDur;
    var ph=TR.phrase;
    var n=ph?G.notes[ph.i0]:null;
    var x=laneX(TR.segLane);
    var y0=yTop-r*0.55, y1=yBot-r*0.55;
    var y=y0+(y1-y0)*u-Math.sin(Math.PI*u)*r*0.95;
    var sc=0.55+0.45*u;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(-0.55*Math.sin(Math.PI*u));
    ctx.scale(sc,sc);
    bunnyAt(0,0,r,n?(n.dimg||0):0,1);
    drawSweatMark(r*0.55,-r*0.55,r*0.10,0.35);
    ctx.restore();
  }
  /* 轮到你：洞口下方的小箭头随拍脉动 */
  function drawTurnTip(lean){
    if(lean||!AC||G.phase!=='play') return;
    var t=AC.currentTime-TR.playAbs;
    if(t<0||t>1.15) return;
    var a=Math.sin(Math.min(t/1.15,1)*Math.PI)*0.8;
    var r=holeR();
    ctx.save();
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(212,85,43,.85)';
    for(var i=0;i<lanes;i++){
      var x=laneX(i);
      var bob=Math.sin(t*10+i*0.6)*r*0.03;
      var y=yBot+r*1.10+bob;
      ctx.beginPath();
      ctx.moveTo(x-r*0.10,y);
      ctx.lineTo(x+r*0.10,y);
      ctx.lineTo(x,y+r*0.16);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  /* 鼠标悬停的洞口亮边 */
  function drawHoverRing(lean){
    if(lean||mode!=='play'||TR.hoverLane<0) return;
    var r=holeR();
    ctx.save();
    ctx.globalAlpha=0.38;
    ctx.strokeStyle='rgba(212,85,43,.9)';
    ctx.lineWidth=2;
    holePath(laneX(TR.hoverLane),yBot,r*1.03,r*0.34);
    ctx.stroke();
    ctx.restore();
  }
}
function loop(){
  requestAnimationFrame(loop);
  if(G.screen!=='game') return;
  if(!AC||!G.L||!TR.phrase) return;
  var ph=TR.phrase;
  perfTick();
  var nowRel=AC.currentTime-TR.songStart;
  var now=ph.t0+nowRel;
  /* 拍点脉冲：只驱动待机抽动/观众席，不参与判定 */
  if(G.chart&&G.chart.beat>0){
    var bi=Math.floor(now/G.chart.beat);
    if(TR.beatIdx!==bi){ TR.beatIdx=bi; TR.beatAt=now; }
  }
  if(TR.finishAt&&!TR.paused&&AC.currentTime>=TR.finishAt){
    finishLevel();
    return;
  }
  /* 倒数（只在第一段前）：数字变化时才写 DOM */
  if(TR.intro&&nowRel<0){
    var bn=Math.ceil(-nowRel/G.chart.beat);
    if(bn>=1&&bn<=4){
      if(TR.big!==bn){
        TR.big=bn;
        TR.bigAt=AC.currentTime;
        els.bigNum.textContent=bn;
        els.bigNum.classList.add('on');
      }
    }else if(TR.big!==0){
      TR.big=0;
      els.bigNum.classList.remove('on');
    }
  }else{
    if(TR.big!==0){ TR.big=0; els.bigNum.classList.remove('on'); }
    if(TR.intro&&nowRel>=0) TR.intro=false;
  }
  if(G.phase==='demo'){
    for(var i=ph.i0;i<ph.i1;i++){
      var nt=G.notes[i];
      if(!nt.auto&&nt.t<=now){
        nt.auto=true;
        nt.hitT=nt.t;
        addFx(nt.lane,'top');
      }
    }
  }else if(G.phase==='play'){
    holdTick(nowRel);
    autoMiss(now-(save.offset||0)/1000);
  }
  draw(now,TR.mode);
  /* 进度条：按「试听 / 演奏」小段推进 */
  var span=Math.max(0.2,ph.t1-ph.t0);
  var segLen=span+segTail(TR.mode);
  var segIdx=G.phraseIdx*2+(TR.mode==='play'?1:0);
  var totalSeg=Math.max(1,G.phrases.length*2);
  var frac=clamp((Math.max(0,nowRel)+0.45)/Math.max(0.4,segLen),0,1);
  var bp=clamp((segIdx+frac)/totalSeg,0,1);
  if(TR.lastBar<0||Math.abs(bp-TR.lastBar)>0.001){
    TR.lastBar=bp;
    els.barFill.style.transform='scaleX('+bp.toFixed(4)+')';
  }
  /* 本段演完 → 接下一段 */
  if(!TR.paused){
    var tailEnd=ph.t1+segTail(TR.mode);
    var ready=(TR.mode==='demo')?(now>=ph.t1+0.10):(now>=ph.t1+JUDGE.late+0.10);
    if(ready){
      var lead=Math.max(0.18,tailEnd-now);
      if(TR.mode==='demo'){
        startSegment('play',G.phraseIdx,lead);
      }else{
        commitHistory(ph);
        var nx=G.phraseIdx+1;
        if(nx<G.phrases.length){
          if(isRecallPhrase(G.L,nx)) startSegment('play',nx,Math.max(1.2,lead));
          else startSegment('demo',nx,lead);
        }else if(!TR.finishAt){
          /* 最后小节：先让月巴飞上历史带，再结算 */
          TR.finishAt=AC.currentTime+0.65;
        }
      }
    }
  }
}

function laneFromX(clientX){
  var rect=els.cvWrap.getBoundingClientRect();
  var lanes=G.L?G.L.lanes:1;
  var x=(clientX-rect.left)/Math.max(1,rect.width);
  return clamp(Math.floor(x*lanes),0,lanes-1);
}
/* 可摸热区命中：只认历史带与试听行，演奏行的点击永远只判定 */
function petHitTest(clientX,clientY){
  var rect=els.cv.getBoundingClientRect();
  var x=clientX-rect.left, y=clientY-rect.top;
  for(var i=G.petHit.length-1;i>=0;i--){
    var h=G.petHit[i];
    var dx=x-h.x, dy=y-h.y;
    if(dx*dx+dy*dy<=h.r*h.r) return h;
  }
  return null;
}
function petBunny(hit){
  var nowA=AC?AC.currentTime:0;
  if(nowA-TR.petAt<0.12) return;
  TR.petAt=nowA;
  if(hit.kind==='hist') hit.ref.petAt=nowA;
  else if(hit.ref) hit.ref.petAt=chartNow();
  purr();
}
els.playArea.addEventListener('pointerdown',function(e){
  ensureAudio();
  if(e.target&&e.target.getAttribute&&e.target.getAttribute('data-ui')) return;
  if(G.screen!=='game'||TR.paused) return;
  if(e.pointerType==='mouse'&&e.button!==0) return;
  e.preventDefault();
  /* 先摸月巴：历史带永远可摸；试听行可摸；演奏行不摸，避免抢判定 */
  var hit=petHitTest(e.clientX,e.clientY);
  if(hit&&(hit.kind==='hist'||(hit.kind==='demo'&&G.phase==='demo'))){
    petBunny(hit);
    return;
  }
  if(G.phase!=='play') return;
  var lane=laneFromX(e.clientX);
  TR.tapSrc={kind:'pointer',id:e.pointerId};
  judgeTap(lane);
},{passive:false});
els.cvWrap.addEventListener('pointermove',function(e){
  if(e.pointerType!=='mouse'||G.screen!=='game'||G.phase!=='play'||TR.paused){ TR.hoverLane=-1; return; }
  TR.hoverLane=laneFromX(e.clientX);
},{passive:true});
els.cvWrap.addEventListener('pointerleave',function(){ TR.hoverLane=-1; },{passive:true});

document.addEventListener('keydown',function(e){
  var tag=e.target&&e.target.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA') return;
  if(e.key==='Escape'){
    if($('pauseScr').classList.contains('on')){ resumeGame(); e.preventDefault(); return; }
    if($('resultScr').classList.contains('on')) return;
    if(G.screen==='game'){ pauseGame(); e.preventDefault(); }
    return;
  }
  if(G.screen!=='game'||G.phase!=='play'||TR.paused) return;
  var k=String(e.key);
  var idx=-1;
  var keys=KEYSETS[G.L.lanes]||KEYSETS[4];
  var up=k.toUpperCase();
  for(var i=0;i<keys.length;i++){ if(keys[i]===up){ idx=i; break; } }
  if(idx<0&&/^[1-4]$/.test(k)){
    var n=parseInt(k,10)-1;
    if(n<G.L.lanes) idx=n;
  }
  if(idx<0&&G.L.lanes===1&&(k===' '||k==='Spacebar')) idx=0;
  if(idx>=0){
    e.preventDefault();
    if(e.repeat) return;
    TR.tapSrc={kind:'key',id:up};
    judgeTap(idx);
  }
});

/* ===== 12. 单曲排行榜 =====
   复用 yueba-sync Worker 的 /board 接口：
   · 按准确度从高到低，同准确度由服务端按提交时间升序（先提交的在前）
   · 准确度编码进 time：time = 9500 + (1000 - 准确度×10)，数值越小越好
   · 每首歌以关卡 id 作为 diff，互不干扰 */
var RANK_API='https://yueba-sync.yueba.workers.dev';
var RANK_UID_KEY='yueba-rb-board-uid';
var RANK_BASE=9500;
var RANK_ICO='<svg viewBox="0 0 18 18" aria-hidden="true" focusable="false">'
  +'<rect x="1.1" y="9.2" width="4.2" height="6.8" rx="1.2" fill="currentColor" opacity=".5"/>'
  +'<rect x="6.9" y="4.6" width="4.2" height="11.4" rx="1.2" fill="#D4552B"/>'
  +'<rect x="12.7" y="10.6" width="4.2" height="5.4" rx="1.2" fill="currentColor" opacity=".5"/>'
  +'<circle cx="9" cy="2.3" r="1.5" fill="currentColor"/></svg>';
var rankLevel=null, rankSeq=0;
function rankUid(){
  var uid='';
  try{ uid=localStorage.getItem(RANK_UID_KEY)||''; }catch(e){}
  if(!uid){
    try{
      var m=document.cookie.match(/yueba_rb_uid=([^;]+)/);
      if(m) uid=decodeURIComponent(m[1]);
    }catch(e){}
  }
  if(!uid){
    uid='rb'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
    try{ localStorage.setItem(RANK_UID_KEY,uid); }catch(e){}
    try{ document.cookie='yueba_rb_uid='+encodeURIComponent(uid)+'; max-age=63072000; path=/; SameSite=Lax'; }catch(e){}
  }
  return uid;
}
function rankNick(){
  var uid=rankUid().replace(/[^a-z0-9]/gi,'');
  return t('rankSelf')+'#'+uid.slice(-4).toUpperCase();
}
function rankSubmit(L,acc){
  if(!L||L.tutorial||!window.fetch||!isFinite(acc)) return;
  try{
    var bp=Math.max(0,Math.min(1000,Math.round(acc*10)));
    fetch(RANK_API+'/board',{
      method:'POST',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({day:'all',diff:L.id,uid:rankUid(),name:rankNick(),time:RANK_BASE+(1000-bp)})
    }).catch(function(){});
  }catch(e){}
}
function openRank(idx){

function loadRank(){
  var L=rankLevel;
  if(!L) return;
  var seq=++rankSeq;
  fetch(RANK_API+'/board?day=all&diff='+encodeURIComponent(L.id)+'&n=20',{cache:'no-store'})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(seq!==rankSeq) return;
      var rows=(j&&j.rows)||[];
      if(!rows.length){
        $('rankList').innerHTML='<div class="rankEmpty">'+esc(t('boardEmpty'))+'</div>';
        return;
      }
      var my=rankUid(), html='';
      for(var i=0;i<rows.length&&i<20;i++){
        var row=rows[i], tm=Number(row.time);
        var bp=isFinite(tm)?Math.max(0,Math.min(1000,10500-tm)):0;
        var me=row.uid===my;

          +'<b class="rk">'+(i+1)+'</b>'
          +'<span class="rn">'+esc(String(row.name||'—'))+(me?' <i>'+esc(t('rankMe'))+'</i>':'')+'</span>'
          +'<span class="rp">'+(bp/10).toFixed(1)+'%</span></div>';
      }
      $('rankList').innerHTML=html;
    })
    .catch(function(){
      if(seq!==rankSeq) return;
      $('rankList').innerHTML='<div class="rankEmpty">'+esc(t('boardFail'))+'</div>';
    });
}

function renderLevels(){
  var grid=$('levelGrid');
  var html='';
  function clearedOf(L){
    if(L.tutorial) return save.progress.normal>=2;
    var b=save.best[L.id];
    return !!(b&&(b.clear===true||(b.clear===undefined&&Number(b.acc)>=60)));
  }
  var list=tabLevels(menuTab);
  var tier=TIERS[menuTab==='hard'?1:0];
  /* 找出下一关：当前标签页里第一个已解锁且未通关的正式关卡 */
  var nextL=null;
  for(var a=0;a<list.length;a++){
    var q=list[a];
    if(q.tutorial||!isLevelUnlocked(q)) continue;
    if(!clearedOf(q)){ nextL=q; break; }
  }
  var headMark=menuTab==='classic'?'★':(menuTab==='hard'?'II':'I');
  var headName=menuTab==='classic'?t('tabClassic'):(menuTab==='hard'?tierName(tier):t('tabEasy'));
  var headMeta=menuTab==='classic'?laneLabel(tier.lanes):(t('movement')+' · '+laneLabel(tier.lanes));
  html+='<div class="tierHead"><b class="mv">'+headMark+'</b><i></i><span>'+esc(headName)+'</span><em>'+headMeta+'</em></div>';
  var lastChap=null, chapLocal=0;
  for(var j=0;j<list.length;j++){
    var L=list[j];
    var idx=LEVELS.indexOf(L);
    var locked=!isLevelUnlocked(L);
    var best=save.best[L.id];
    /* 乐章分隔行：章名 + 本章已通关数 */
    if(L.chapter&&L.chapter!==lastChap){
      var cd=0, ct=0;
      for(var cj=0;cj<list.length;cj++){
        var cL=list[cj];
        if(cL.chapter!==L.chapter) continue;
        ct++;
        if(clearedOf(cL)) cd++;
      }
      var hMark=L.classic?'★':CH_ROMAN[L.chapterNo-1];
      var hName=chapName(L);
      html+='<div class="chapHead"><b>'+hMark+'</b><i></i><span>'+esc(hName)+'</span><em>'+cd+'/'+ct+'</em></div>';
      lastChap=L.chapter; chapLocal=0;
    }else if(L.legacy&&lastChap!=='legacy'){
      html+='<div class="chapHead"><b>★</b><i></i><span>'+esc(t('classicZone'))+'</span><em></em></div>';
      lastChap='legacy';
    }
    var lbest;
    if(L.tutorial){
      lbest=(save.progress.normal>=2)?t('tutorialClear'):(locked?t('unlockHint'):t('emptyBest'));
    }else{
      lbest=best?(best.grade+' '+Number(best.acc).toFixed(1)+'%'):(locked?t('unlockHint'):t('emptyBest'));
    }
    var bar=String(L.tracks[0]||'').slice(0,16);
    var cleared=clearedOf(L);
    var stripHtml='';
    if(cleared){
      var strip='';
      for(var st=0;st<16;st++) strip+='<i class="'+(bar.charAt(st)==='x'?'on':'')+'"></i>';
      stripHtml='<div class="strip" aria-hidden="true">'+strip+'</div>';
    }
    var dots='';

var CAL={active:false,beats:[],taps:[],timer:null,raf:0,clickIdx:0};
function calibStatus(msg){
  var el=$('calibStatus');

}
function calibSetProgress(n){
  var tap=$('calibTap');
  if(tap) tap.style.setProperty('--p',String(Math.max(0,Math.min(8,n))*12.5));
  var dots=$('calibDots');
  if(dots){
    for(var i=0;i<dots.children.length;i++) dots.children[i].classList.toggle('on',i<n);
  }
}
function calibSetResult(sub){

}
function openCalib(){
  ensureAudio();
  stopCalib();
  $('calibRange').value=String(save.offset||0);
  $('calibVal').textContent=(save.offset||0)+' ms';
  $('calibCount').textContent='0/8';
  $('btnCalibStart').textContent=t('calibStart');
  calibSetProgress(0);
  calibSetResult('');
  calibStatus(t('calibReady'));
  show('calibScr');
}
function stopCalib(){
  CAL.active=false;
  if(CAL.timer){ clearInterval(CAL.timer); CAL.timer=null; }
  if(CAL.raf){ cancelAnimationFrame(CAL.raf); CAL.raf=0; }
  var tap=$('calibTap');
  if(tap) tap.classList.remove('live');
}
function startCalib(){
  ensureAudio();
  if(!AC){ toast(t('noAudio')); return; }
  if(AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  stopCalib();
  CAL.active=true; CAL.beats=[]; CAL.taps=[]; CAL.clickIdx=0;
  $('calibCount').textContent='0/8';
  $('calibTap').classList.add('live');
  $('btnCalibStart').textContent=t('startCalib');
  calibSetProgress(0);
  calibSetResult('');
  calibStatus(t('calibRunning'));
  /* 约 24 秒的循环节拍：点满 8 下会立刻结束，反应慢也不会被提前判失败 */
  var base=AC.currentTime+1.6;
  var beat=0.6;
  for(var i=0;i<40;i++) CAL.beats.push(base+i*beat);
  CAL.timer=setInterval(function(){
    if(!CAL.active) return;
    while(CAL.clickIdx<CAL.beats.length && CAL.beats[CAL.clickIdx]<AC.currentTime+0.15){
      var idx=CAL.clickIdx++;
      click(CAL.beats[idx],idx===0);
    }
    if(AC.currentTime>CAL.beats[CAL.beats.length-1]+0.8) finishCalib(false);
  },60);
  calibLoop();
}
function calibLoop(){
  if(!CAL.active) return;
  var best=null,bd=9;
  for(var i=0;i<CAL.beats.length;i++){
    var d=CAL.beats[i]-AC.currentTime;
    if(d>=-0.05&&d<bd){ bd=d; best=CAL.beats[i]; }
  }
  if(best!==null&&bd>-0.06&&bd<0.02){
    var el=$('calibTap');
    el.classList.remove('beat'); void el.offsetWidth; el.classList.add('beat');
    CAL._last=best;
  }
  CAL.raf=requestAnimationFrame(calibLoop);
}
function finishCalib(ok){
  stopCalib();
  if(CAL.taps.length>=8){
    var m=median(CAL.taps);
    save.offset=clamp(Math.round(m),-150,150);
    persist();
    $('calibRange').value=String(save.offset);
    $('calibVal').textContent=save.offset+' ms';
    calibSetProgress(CAL.taps.length);
    calibSetResult('');
    calibStatus(t('calibDone',{n:save.offset}));
    var st=$('calibStatus'); if(st) st.classList.add('done');
    var rs=$('calibResultSub'); if(rs) rs.textContent=t('calibMedian');
    toast(t('calibDone',{n:save.offset}));
  }else{
    calibSetResult('');
    calibStatus(t('calibTimeout'));
    toast(t('calibFail'));
  }
  $('btnCalibStart').textContent=t('calibRetry');
  CAL.taps=[];
}
$('calibTap').addEventListener('pointerdown',function(e){
  if(!CAL.active||!AC) return;
  e.preventDefault();
  var now=AC.currentTime;
  var best=null,bd=9;
  for(var i=0;i<CAL.beats.length;i++){
    var d=now-CAL.beats[i];
    if(Math.abs(d)<Math.abs(bd)){ bd=d; best=CAL.beats[i]; }
  }
  if(best===null||Math.abs(bd)>0.45) return;
  CAL.taps.push(bd*1000);
  $('calibCount').textContent=CAL.taps.length+'/8';
  calibSetProgress(CAL.taps.length);
  click(now,true);
  var left=Math.max(0,8-CAL.taps.length);
  if(left>0) calibStatus(t('calibLeft',{n:left}));
  if(CAL.taps.length>=8) finishCalib(true);
});
