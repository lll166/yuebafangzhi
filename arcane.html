<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f6f3ea">
<title>月巴奥术</title>
<style>
/* =========================================================
   0 · 令牌（plan §5.2）
   ========================================================= */
:root{
  /* —— 日间：宣纸 —— */
  --paper:#f6f3ea; --paper2:#fffdf6; --panel:#fffdf7;
  --ink:#2d3242; --dim:#798094;
  --jade:#4c9a7f; --jade2:#2f7f66;
  --tomato:#cc5a42; --gold:#b8862f;
  --line:rgba(45,50,66,.14); --line2:rgba(45,50,66,.30);
  --acad:#4f9d77;
  --bunny-fill:#fffdf7; --bunny-line:#2d3242;
  --glow-a:rgba(76,154,127,.26);
  --wash-top:#fffdf7; --wash-bot:#ece4d2; --scan:rgba(45,50,66,.014);
  --shadow-1:0 10px 30px rgba(45,50,66,.10);
  --shadow-2:0 18px 48px rgba(45,50,66,.18);
  --tab-h:58px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* —— 夜间：烛下书库 —— */
body.dark{
  --paper:#11131a; --paper2:#181b23; --panel:#1a1e27;
  --ink:#e7eaf1; --dim:#8b93a6;
  --jade:#5fc9a3; --jade2:#8ee4c2;
  --tomato:#e8735c; --gold:#e0b060;
  --line:rgba(231,234,241,.13); --line2:rgba(231,234,241,.28);
  --bunny-fill:#f4f0e3; --bunny-line:#1a1d24;
  --glow-a:rgba(95,201,163,.20);
  --wash-top:#1b1f29; --wash-bot:#0b0d12; --scan:rgba(231,234,241,.016);
  --shadow-1:0 10px 30px rgba(0,0,0,.42);
  --shadow-2:0 18px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink); background:var(--paper);
  font-variant-numeric:tabular-nums;
  overflow:hidden;
  overscroll-behavior:none;
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(110% 70% at 50% -10%, var(--wash-top) 0%, transparent 62%),
    radial-gradient(85% 55% at 50% 112%, var(--wash-bot) 0%, transparent 72%),
    repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 6px),
    var(--paper);
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}

/* 骨架 */
#app{
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  width:100%; max-width:480px; margin:0 auto;
  height:100vh; height:100dvh;
  padding-top:var(--safe-t);
}

/* HUD */
#hud{flex:0 0 auto; padding:10px 14px 6px; position:relative}
.hudRow{display:flex;align-items:center;gap:8px}
.hudRow + .hudRow{margin-top:6px}
.hudStrip{
  display:flex; align-items:baseline; gap:6px;
  padding:5px 12px 5px 9px;
  background:linear-gradient(180deg, var(--panel), var(--paper2));
  border:1px solid var(--line);
  border-left:2px solid var(--acad);
  clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);
  transition:border-color .3s;
}
#hudTitle{font-size:15px;font-weight:700;letter-spacing:.08em;color:var(--acad);transition:color .3s}
#hudRank{font-size:13px;font-weight:600;color:var(--ink)}
#hudFocus{margin-left:auto;font-size:12px;color:var(--dim)}
#hudFocus b{color:var(--jade);font-weight:600}
#hudDisson{font-size:12px;color:var(--tomato)}
#hudDisson b{font-weight:700}
#hudDisson[hidden]{display:none}
#hudMana{font-size:13px}
#hudMana b{font-weight:700}
#hudRate{font-size:11px;color:var(--jade);font-weight:600}
#hudCredit{margin-left:auto;font-size:12px;color:var(--dim)}
#hudCredit b{color:var(--gold);font-weight:600}

/* 增益条 */#buffBar{display:flex;gap:6px;flex-wrap:wrap;padding:2px 14px 0;flex:0 0 auto}
#buffBar[hidden]{display:none}
.buff{
  display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:10px;
  background:color-mix(in srgb, var(--jade) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--jade) 30%, transparent);
  font-size:11px;
}
.buff b{font-weight:700;color:var(--jade2)}
.buff i{font-style:normal;color:var(--dim);font-variant-numeric:tabular-nums}

/* 天降机缘：呼吸标记 */
#btnJiban{
  margin-left:8px;display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:11px;
  border:1px solid var(--tomato);color:var(--tomato);
  background:color-mix(in srgb, var(--tomato) 12%, transparent);
  font-size:11px;font-weight:700;
  animation:jibanPulse 1.8s ease-in-out infinite;
}
#btnJiban[hidden]{display:none}
#btnJiban .dot{width:6px;height:6px;border-radius:50%;background:var(--tomato)}
@keyframes jibanPulse{0%,100%{opacity:1}50%{opacity:.5}}

/* 事件弹层正文 */
.evBody{font-size:13.5px;line-height:1.85;color:var(--ink);padding:4px 0 12px}

/* 试炼：三道具象化的雷 */
.bolts{display:flex;gap:12px;justify-content:center;margin:16px 0 14px}
.bolt{
  width:62px;height:62px;border-radius:13px;
  border:1px solid var(--line);color:var(--line2);
  display:flex;align-items:center;justify-content:center;
  opacity:.45;transition:opacity .15s,border-color .15s,color .15s,transform .15s;
}
.bolt svg{width:26px;height:26px}
.bolt.open{
  opacity:1;border-color:var(--gold);color:var(--gold);
  animation:boltPulse .55s ease-in-out infinite alternate;
}
.bolt.hit{opacity:1;border-color:var(--jade);color:var(--jade)}
.bolt.miss{opacity:.28}
@keyframes boltPulse{from{transform:scale(1)}to{transform:scale(1.07)}}
.trialBar{height:5px;border-radius:3px;background:rgba(128,128,128,.16);overflow:hidden;margin-bottom:8px}
.trialBar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s linear}

/* 成就 / 图鉴小标签 */
.cxHead{display:flex;justify-content:space-between;align-items:baseline;
  font-size:11.5px;color:var(--dim);margin:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{
  font-size:11px;line-height:1.4;padding:3px 9px;border-radius:9px;
  border:1px solid var(--line);color:var(--ink);background:var(--panel);
}
.chip.off{color:var(--line2);background:transparent;border-style:dashed}
.chip.got{border-color:color-mix(in srgb, var(--acad) 45%, transparent);color:var(--acad)}

/* 分段控件 */
.seg{display:flex;gap:6px;margin-bottom:10px}
.segBtn{
  flex:1;min-height:36px;border-radius:9px;
  border:1px solid var(--line);color:var(--dim);
  font-size:12.5px;font-weight:700;
}
.segBtn.on{background:var(--acad);border-color:var(--acad);color:#fff}

/* 招募弹层里的职务选择 */
.rrow{
  display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;
  padding:11px 13px;margin-bottom:8px;
  border:1px solid var(--line);border-radius:10px;background:var(--panel);
}
.rrow b{font-size:13.5px;font-weight:800}
.rrow i{font-style:normal;font-size:11.5px;line-height:1.5;color:var(--dim)}
.rrow:active{transform:scale(.99)}
#btnLow{
  margin-left:6px;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;color:var(--dim);
}
#btnLow.on{background:var(--ink);color:var(--paper2);border-color:var(--ink)}

/* 场景 */
#stage{
  flex:1 1 auto; min-height:0; position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:4px 16px 0; overflow:hidden;
}
/* 场景四角括号（参考 snake 的游戏框） */
#stage::after{
  content:''; position:absolute; inset:8px; z-index:3; pointer-events:none; opacity:.58;
  background:
    linear-gradient(var(--acad),var(--acad)) left top/15px 2px no-repeat,
    linear-gradient(var(--acad),var(--acad)) left top/2px 15px no-repeat,
    linear-gradient(var(--acad),var(--acad)) right top/15px 2px no-repeat,
    linear-gradient(var(--acad),var(--acad)) right top/2px 15px no-repeat,
    linear-gradient(var(--acad),var(--acad)) left bottom/15px 2px no-repeat,
    linear-gradient(var(--acad),var(--acad)) left bottom/2px 15px no-repeat,
    linear-gradient(var(--acad),var(--acad)) right bottom/15px 2px no-repeat,
    linear-gradient(var(--acad),var(--acad)) right bottom/2px 15px no-repeat;
}
/* 章节标签（参考 survivor 的 kicker） */
.kicker{
  font-size:8.5px; font-weight:800; letter-spacing:.34em;
  color:var(--acad); opacity:.85; text-transform:uppercase;
}
.kicker::before{content:'// '}
.kicker::after{content:' //'}
#clouds{
  position:absolute; left:-10%; right:-10%; top:-6%; height:44%; z-index:0;
  background:
    radial-gradient(34% 52% at 20% 40%, rgba(222,229,233,.55), rgba(222,229,233,0) 72%),
    radial-gradient(42% 58% at 76% 30%, rgba(228,234,237,.45), rgba(228,234,237,0) 74%),
    radial-gradient(26% 42% at 50% 64%, rgba(232,237,239,.35), rgba(232,237,239,0) 78%);
  pointer-events:none;
}
#ridge{
  position:absolute; left:-6%; right:-6%; bottom:0; height:36%; z-index:0;
  background:
    radial-gradient(52% 108% at 20% 130%, rgba(76,154,127,.20) 0%, rgba(76,154,127,.12) 44%, rgba(76,154,127,0) 72%),
    radial-gradient(58% 118% at 70% 134%, rgba(76,154,127,.16) 0%, rgba(76,154,127,.09) 46%, rgba(76,154,127,0) 74%),
    linear-gradient(180deg, rgba(236,228,210,0) 26%, rgba(236,228,210,.58) 100%);
  pointer-events:none;
}
#moon{
  position:absolute; right:-10%; top:2%; z-index:0;
  width:min(48vw,190px); aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 36% 32%, rgba(255,253,246,.98) 0%, rgba(249,243,227,.86) 52%, rgba(241,233,211,.42) 72%, rgba(241,233,211,0) 76%);
  pointer-events:none;
}
#acadFlag{
  position:absolute; left:14px; top:34px; z-index:2;
  width:30px; display:flex; flex-direction:column; align-items:center;
}
#acadFlag .pole{width:1px;height:44px;background:var(--line2)}
#acadFlag .cloth{
  width:28px;height:34px;border-radius:2px 2px 3px 3px;
  background:var(--acad); color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;transition:background .3s;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);
}
#btnMute{
  position:absolute; right:14px; top:34px; z-index:2;
  width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);color:var(--dim);
  display:flex;align-items:center;justify-content:center;
}
#btnTheme{
  position:absolute; right:52px; top:34px; z-index:2;
  width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line);color:var(--dim);
  display:flex;align-items:center;justify-content:center;
}
#btnTheme svg{width:15px;height:15px;display:block}

#bunnyWrap{
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center;
  margin-top:-6%;
}
#moonba{
  position:relative; z-index:2;
  width:min(62vw,240px); height:auto;
  animation:breathe 3.2s ease-in-out infinite;
  transform-origin:50% 92%;
  will-change:transform;
}
#moonba svg{display:block;width:100%;height:auto;overflow:visible}
#moonba.squash{animation:squash .26s ease-out}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes squash{0%{transform:scale(1,1)}40%{transform:scale(1.06,.94)}100%{transform:scale(1,1)}}
#cushion{
  position:relative; z-index:1;
  width:min(46vw,178px); height:26px; margin-top:-16px;
  border-radius:50%;
  background:rgba(76,154,127,.16);
  background:radial-gradient(60% 80% at 50% 35%, color-mix(in srgb, var(--acad) 34%, transparent) 0%, color-mix(in srgb, var(--acad) 16%, transparent) 62%, transparent 78%);
  box-shadow:inset 0 -3px 0 rgba(45,50,66,.05);
  transition:background .3s;
}
#glow{
  position:absolute; z-index:1; top:46%; left:50%;
  width:min(74vw,282px); aspect-ratio:1;
  transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(circle, rgba(124,196,167,.26) 0%, rgba(124,196,167,0) 66%);
  pointer-events:none;
}
#particles{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* 夜间：云雾 / 远山 / 月 / 光晕换成烛光版 */
body.dark #clouds{
  background:
    radial-gradient(34% 52% at 20% 40%, rgba(140,158,186,.10), rgba(140,158,186,0) 72%),
    radial-gradient(42% 58% at 76% 30%, rgba(150,168,196,.08), rgba(150,168,196,0) 74%),
    radial-gradient(26% 42% at 50% 64%, rgba(160,176,200,.06), rgba(160,176,200,0) 78%);
}
body.dark #ridge{
  background:
    radial-gradient(52% 108% at 20% 130%, rgba(95,201,163,.14) 0%, rgba(95,201,163,.07) 44%, rgba(95,201,163,0) 72%),
    radial-gradient(58% 118% at 70% 134%, rgba(95,201,163,.10) 0%, rgba(95,201,163,.05) 46%, rgba(95,201,163,0) 74%),
    linear-gradient(180deg, rgba(30,34,44,0) 26%, rgba(8,10,15,.8) 100%);
}
body.dark #moon{
  background:radial-gradient(circle at 36% 32%,
    rgba(255,248,226,.14) 0%, rgba(255,248,226,.07) 48%,
    rgba(255,248,226,.02) 70%, rgba(255,248,226,0) 80%);
}
body.dark #glow{background:radial-gradient(circle, var(--glow-a) 0%, rgba(95,201,163,0) 66%)}
body.dark #cushion{box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}

/* 施法：水波纹 + 连击芯片 */
.ripple{
  position:absolute; z-index:3; width:34px; height:34px; border-radius:50%;
  border:1.5px solid rgba(124,196,167,.8);
  transform:translate(-50%,-50%) scale(.4);
  pointer-events:none;
  animation:rippleOut .62s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes rippleOut{
  0%{transform:translate(-50%,-50%) scale(.4);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(3.1);opacity:0}
}
#combo{
  position:absolute; left:50%; bottom:9%; z-index:4;
  transform:translateX(-50%);
  padding:3px 11px; border-radius:12px;
  background:rgba(45,50,66,.05);
  border:1px solid var(--line);
  color:var(--dim); font-size:11px; font-weight:700; letter-spacing:.06em;
  opacity:0; pointer-events:none;
  transition:opacity .18s,color .18s,background .18s,border-color .18s;
}
#combo.show{opacity:1}
#combo.hot{color:#fff;background:var(--tomato);border-color:var(--tomato)}
body.low .ripple{display:none}
@media (prefers-reduced-motion:reduce){ .ripple{animation-duration:.2s} }

/* 咒力条 / 姿态 / 主按钮 */
#prog{flex:0 0 auto;width:100%;padding:0 16px}
#progTop{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--dim);margin-bottom:5px}
#progTop .lab{letter-spacing:.06em}
#progTop .pct{margin-left:auto;color:var(--ink);font-weight:600}
#progTop .eta{color:var(--dim)}
#barWrap{height:12px;border-radius:7px;background:rgba(45,50,66,.07);border:1px solid var(--line);overflow:hidden}
#bar{
  height:100%;width:0%;border-radius:7px;
  background:linear-gradient(90deg,var(--jade2),var(--jade));
  box-shadow:0 0 12px var(--glow-a);
  transition:width .22s linear;
}
#bar.full{background:linear-gradient(90deg,var(--gold),#d8b063)}

#postures{flex:0 0 auto;display:flex;gap:8px;padding:12px 16px 0;width:100%}
.ponBtn{
  flex:1;min-height:44px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);
  font-size:13px;font-weight:600;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:color .18s,border-color .18s,background .18s;
}
.ponBtn small{font-size:10px;font-weight:400;opacity:.8}
.ponBtn.on{color:#fff;background:var(--acad);border-color:var(--acad)}

#btnMain{
  flex:0 0 auto;margin:12px 16px 0;min-height:52px;border-radius:14px;
  background:var(--jade);color:#fff;
  font-size:16px;font-weight:700;letter-spacing:.12em;
  display:flex;align-items:center;justify-content:center;
  transition:transform .16s,background .2s,color .2s;
}
#btnMain:active:not(:disabled){transform:scale(.985)}
#btnMain:disabled{
  background:color-mix(in srgb, var(--jade) 12%, transparent);
  color:color-mix(in srgb, var(--jade) 86%, var(--ink));
  box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--jade) 26%, transparent);
}
#btnMain.ready{background:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(201,154,69,.32)}
  50%{box-shadow:0 0 0 10px rgba(201,154,69,0)}
}

/* 页签 */
#tabs{
  flex:0 0 auto;display:flex;margin-top:auto;
  border-top:1px solid var(--line);
  background:rgba(255,253,246,.86);
  padding-bottom:var(--safe-b);
}
.tab{
  flex:1;min-height:var(--tab-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--dim);font-size:11px;transition:color .18s;
}
.tab .ico{display:flex;align-items:center;justify-content:center;color:inherit}
.tab .ico svg{width:19px;height:19px;display:block}
.tab.on{color:var(--acad)}
#btnLow svg,#btnMute svg{width:16px;height:16px;display:block}

/* 面板 */
#panel{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  max-width:480px;margin:0 auto;max-height:78vh;
  background:var(--panel);
  border-top:1px solid var(--line2);
  border-radius:18px 18px 0 0;
  transform:translateY(102%);
  transition:transform .24s cubic-bezier(.22,.9,.28,1);
  display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);
  box-shadow:var(--shadow-1);
}
#panel.show{transform:translateY(0)}
#panelHead{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:14px 18px 10px;border-bottom:1px solid var(--line);
}
#panelTitle{font-size:15px;font-weight:700}
#panelHead .ph-tx{display:flex;flex-direction:column;gap:3px;min-width:0}
#panelClose{
  margin-left:auto;width:32px;height:32px;border-radius:50%;
  border:1px solid var(--line);color:var(--dim);font-size:15px;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
#panelBody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 22px}
.wip{color:var(--dim);font-size:13px;line-height:1.9;text-align:center;padding:26px 0}
#scrim{
  position:fixed;inset:0;z-index:19;background:rgba(45,50,66,.18);
  opacity:0;pointer-events:none;transition:opacity .24s;
}
#scrim.show{opacity:1;pointer-events:auto}
@media (min-width:720px){
  #panel{
    top:50%;bottom:auto;left:50%;right:auto;
    width:460px;max-height:80vh;
    transform:translate(-50%,-46%) scale(.98);opacity:0;
    border-radius:18px;border:1px solid var(--line2);
    box-shadow:0 18px 48px rgba(45,50,66,.18);
    transition:transform .24s cubic-bezier(.22,.9,.28,1),opacity .2s;
  }
  #panel.show{transform:translate(-50%,-50%) scale(1);opacity:1}
}

/* Toast / 飘字 / 晋级弹层 */
#toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);
  transform:translate(-50%,10px);z-index:30;
  max-width:min(86vw,380px);
  padding:9px 16px;border-radius:20px;
  background:rgba(45,50,66,.90);color:var(--paper2);
  font-size:12.5px;line-height:1.5;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* 面板打开时提示会压住按钮，改到顶部 */
body.panel-open #toast{
  bottom:auto; top:calc(var(--safe-t) + 16px);
  transform:translate(-50%,-10px);
}
body.panel-open #toast.show{transform:translate(-50%,0)}

#floats{position:fixed;inset:0;z-index:32;pointer-events:none;overflow:hidden}
.float{
  position:absolute;left:50%;top:44%;transform:translate(-50%,0);
  font-size:15px;font-weight:700;letter-spacing:.04em;
  color:var(--jade);white-space:nowrap;
  animation:floatUp 1.05s cubic-bezier(.2,.7,.3,1) forwards;
}
.float.bad{color:var(--tomato)}
.float.gold{color:var(--gold)}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,8px) scale(.92)}
  16%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-54px) scale(1)}
}

#modalScrim{
  position:fixed;inset:0;z-index:40;background:rgba(45,50,66,.24);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#modalScrim.show{opacity:1;pointer-events:auto}
#modal{
  position:fixed;left:50%;top:50%;z-index:41;
  width:min(88vw,352px);
  transform:translate(-50%,-48%) scale(.97);opacity:0;pointer-events:none;
  background:var(--panel);border:1px solid var(--line2);border-radius:18px;
  box-shadow:0 18px 48px rgba(45,50,66,.18);
  transition:transform .22s cubic-bezier(.22,.9,.28,1),opacity .18s;
  display:flex;flex-direction:column;overflow:hidden;
}
#modal.show{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
#modalHead{
  display:flex; flex-direction:column; gap:4px;
  padding:15px 20px 12px; border-bottom:1px solid var(--line);
}
#modalTitle{font-size:15px;font-weight:700;letter-spacing:.08em}
#modalBody{padding:6px 20px 4px;max-height:52vh;overflow-y:auto}
.mrow{display:flex;align-items:baseline;padding:7px 0;font-size:13px;color:var(--dim);border-bottom:1px dashed rgba(45,50,66,.08)}
.mrow:last-child{border-bottom:0}
.mrow .k{flex:0 0 auto}
.mrow .v{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.mrow .v.plus{color:var(--jade)}
.mrow .v.minus{color:var(--tomato)}
.mrow .v.zero{color:var(--line2);font-weight:500}
.mrow.total{padding-top:11px;margin-top:4px;border-top:1px solid var(--line2);border-bottom:0}
.mrow.total .k{color:var(--ink);font-weight:700}
.mrow.total .v{font-size:17px;color:var(--gold)}
.mnote{padding:9px 0 2px;font-size:11.5px;line-height:1.6;color:var(--dim)}
#modalFoot{display:flex;gap:10px;padding:14px 20px 18px}
#modalFoot button{
  flex:1;min-height:46px;border-radius:12px;font-size:14px;font-weight:600;
  border:1px solid var(--line2);color:var(--dim);background:transparent;
}
/* 注意：必须写成 #modalFoot #modalOk，否则会被上面的 `#modalFoot button` 压掉 */
#modalFoot #modalOk{background:var(--jade);border-color:var(--jade);color:#fff}
#modalFoot #modalOk:disabled{
  background:rgba(76,154,127,.10);border-color:rgba(76,154,127,.22);
  color:rgba(76,154,127,.65);
}

/* 卡片（面板通用，参考 survivor 的升级卡） */
.card{
  position:relative; display:flex; flex-direction:column; gap:6px;
  width:100%; padding:13px 12px 12px; text-align:left;
  background:linear-gradient(180deg, rgba(76,154,127,.06), rgba(76,154,127,.015));
  border:1px solid var(--line);
  border-top:2px solid var(--acad);
  transition:transform .13s, border-color .13s, background .13s;
}
.card:active{transform:scale(.985)}
.card .nm{font-size:14px;font-weight:800;letter-spacing:.04em}
.card .ds{font-size:12px;line-height:1.55;color:var(--dim)}
.card .dl{font-size:11.5px;font-weight:800;color:var(--jade2);font-variant-numeric:tabular-nums}
.card .cat{position:absolute;top:7px;right:9px;font-size:9px;font-weight:800;letter-spacing:.1em;color:var(--dim)}
.card .cost{font-size:11px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.card:disabled{opacity:.45}
body.dark .card{background:linear-gradient(180deg, rgba(95,201,163,.09), rgba(95,201,163,.02))}
.card .dl.go{color:var(--jade2)}
.card .dl.lock{color:var(--dim);font-weight:600}
.card.cur{border-left:3px solid var(--acad);cursor:default}
.card.cur .dl{color:var(--acad);font-weight:700}

/* 法师塔卡片 */
.card.fac{padding-bottom:11px}
.card.fac .facBtn{
  width:100%;margin-top:3px;min-height:38px;border-radius:9px;
  background:var(--acad);color:#fff;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.card.fac .facBtn:active{transform:scale(.98)}
.card.fac .facBtn:disabled{
  background:color-mix(in srgb, var(--acad) 20%, transparent);
  color:color-mix(in srgb, var(--acad) 78%, var(--ink));
}

/* 学院面板 */
.acadNow{
  padding:14px; margin-top:6px;
  background:linear-gradient(180deg, var(--panel), var(--paper2));
  border:1px solid var(--line); border-left:3px solid var(--acad);
}
.anNm{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800}
.anTag{
  font-size:10px;font-weight:800;color:#fff;background:var(--acad);
  padding:1px 8px;border-radius:9px;
}
.anB{font-size:12px;line-height:1.75;color:var(--dim);margin-top:6px}
.anRow{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:11px}
.anRow b{color:var(--ink);font-weight:700}
.acadBar{height:6px;border-radius:4px;background:rgba(128,128,128,.18);margin-top:9px;overflow:hidden}
.acadBar i{display:block;height:100%;background:var(--acad);border-radius:4px;transition:width .25s}
.anNote{font-size:11px;color:var(--dim);margin-top:6px}
.kicker2{margin-top:16px}
.acadList{display:flex;flex-direction:column;gap:8px;margin-top:8px}

/* 法术面板 */
.spHead{display:flex;gap:8px;margin-bottom:10px}
.spCell{
  flex:1;padding:9px 8px;text-align:center;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--paper2));
}
.spCell span{display:block;font-size:10px;color:var(--dim);letter-spacing:.08em;margin-bottom:3px}
.spCell b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.spDraw{display:flex;gap:8px;margin-bottom:6px}
.spBtn{
  flex:1;min-height:46px;border-radius:12px;
  background:var(--acad);color:#fff;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.spBtn:active{transform:scale(.985)}
.card.slot .facBtn.ghost{
  align-self:flex-end;width:auto;min-height:34px;padding:0 18px;
  margin-top:8px;border-radius:8px;
  background:transparent;border:1px solid var(--line2);color:var(--dim);
  font-size:12px;
}
.spActions{display:flex;gap:8px;align-items:center;margin-top:2px}
.miniBtn{
  flex:1;min-height:36px;border-radius:8px;
  border:1px solid color-mix(in srgb, var(--acad) 42%, transparent);
  background:color-mix(in srgb, var(--acad) 10%, transparent);
  color:var(--acad);font-size:12px;font-weight:700;
}
.miniBtn:active{transform:scale(.98)}
.miniBtn.dim{opacity:.45}
.miniTag{font-size:11px;color:var(--dim);white-space:nowrap}
.tier-white{color:#8fa0b4}
.tier-blue{color:#4f86b0}
.tier-purple{color:#8a6bb0}
.tier-gold{color:#c99a45}
body.dark .tier-white{color:#c3cddb}
body.dark .tier-blue{color:#78b0d8}
body.dark .tier-purple{color:#b49ae0}
body.dark .tier-gold{color:#e0b060}
.drow{
  display:flex;align-items:center;gap:9px;padding:8px 0;
  border-bottom:1px dashed var(--line);font-size:13px;
}
.drow:last-child{border-bottom:0}
.drow .dt{margin-left:auto;font-size:11px;color:var(--dim)}

/* 数值变化 pop（参考 snake） */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.32)}100%{transform:scale(1)}}
.pop{animation:pop .26s ease-out;display:inline-block}

/* 首启开场 */
#intro{
  position:fixed;inset:0;z-index:60;
  background:
    radial-gradient(110% 70% at 50% -10%, #fffdf7 0%, rgba(255,253,247,0) 62%),
    radial-gradient(85% 55% at 50% 112%, #ece4d2 0%, rgba(236,228,210,0) 72%),
    var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 30px calc(40px + var(--safe-b));
  opacity:0;pointer-events:none;transition:opacity .55s ease;
}
#intro.show{opacity:1;pointer-events:auto}
#introLines{display:flex;flex-direction:column;gap:15px;width:100%;max-width:330px}
#introLines p{
  margin:0;font-size:15px;line-height:1.95;color:var(--ink);letter-spacing:.02em;
  opacity:0;transform:translateY(7px);
}
#intro.show #introLines p{animation:introIn .75s cubic-bezier(.2,.7,.3,1) forwards}
#intro.show #introLines p:nth-child(1){animation-delay:.25s}
#intro.show #introLines p:nth-child(2){animation-delay:.95s}
#intro.show #introLines p:nth-child(3){animation-delay:1.65s}
#intro.show #introLines p:nth-child(4){animation-delay:2.35s}
#intro.show #introLines p:nth-child(5){animation-delay:3.05s}
@keyframes introIn{to{opacity:1;transform:translateY(0)}}
#introBtn{
  margin-top:30px;min-width:136px;min-height:46px;border-radius:23px;
  background:var(--jade);color:#fff;font-size:14px;font-weight:600;letter-spacing:.18em;
  opacity:0;transition:opacity .5s ease;
}
#intro.show #introBtn{opacity:1;transition-delay:3.9s}

/* 省电 / 减少动效 */
body.low #moonba{animation:none}
body.low #particles{display:none}
body.low #glow{display:none}
body.low #btnMain.ready{animation:none}
body.low::before{background:var(--paper)}
body.low #introLines p{animation:none;opacity:1;transform:none}
body.low #introBtn{opacity:1;transition:none}
@media (prefers-reduced-motion:reduce){
  #moonba{animation:none}
  #btnMain.ready{animation:none}
  #bar{transition:none}
  #panel,#scrim,#modal,#modalScrim{transition:none}
  .float{animation-duration:.4s}
  #intro.show #introLines p{animation:none;opacity:1;transform:none}
  #introBtn{transition:none}
  #intro.show #introBtn{transition-delay:0s}
}
</style>
</head>

<div id="app">

</div>

  </div>
  <div id="panelBody"></div>
</div>

<div id="intro" role="dialog" aria-modal="true">
  <div id="introLines"></div>
  <button id="introBtn">坐下</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="floats" aria-hidden="true"></div>

<div id="modalScrim"></div>

function loadSave(){
  var raw = null;
  try{ raw = JSON.parse(localStorage.getItem(G.SAVE_KEY) || 'null'); }catch(e){ raw = null; }
  return migrate(raw);
}

function migrate(raw){
  var d = defaultState();
  if (!raw || typeof raw !== 'object') return d;
  var out = d;
  Object.keys(d).forEach(function(k){
    if (raw[k] === undefined || raw[k] === null) return;
    var dv = d[k];
    if (dv && typeof dv === 'object' && !Array.isArray(dv) && !Array.isArray(raw[k])){
      out[k] = Object.assign({}, dv, raw[k]);
    }else{
      out[k] = raw[k];
    }
  });
  out.r = clampInt(out.r, 0, G.REALM_MAX);
  out.circle = clampInt(out.circle, 1, G.CIRCLE_MAX);
  out.mana = num(out.mana);
  out.spell = num(out.spell);
  out.focus = clamp(num(out.focus), 0, G.FOCUS_MAX);
  out.disson = clampInt(out.disson, 0, G.DISSON_MAX);
  if (out.disson > 0 && !out.dissonEndAt) out.dissonEndAt = Date.now() + G.DISSON_MIN * 60000;
  if (!PON_BY_ID[out.posture]) out.posture = 'pon_zuo';
  if (out.theme !== 'light' && out.theme !== 'dark') out.theme = '';
  if (!ACADEMIES[out.academy]) out.academy = 's_verdant';
  if (!out.acadData[out.academy]) out.acadData[out.academy] = {credit:0, rank:0};
  Object.keys(out.acadData).forEach(function(k){
    var e = out.acadData[k] || {};
    out.acadData[k] = { credit: Math.max(0, num(e.credit)), rank: clampInt(e.rank, 0, RANKS.length - 1) };
  });
  TOWER.forEach(function(c){ out.tower[c.id] = clampInt(out.tower[c.id], 0, G.TOWER_MAX); });
  out.v = G.VERSION;
  return out;
}

/* =========================================================
   PART 4 · 小工具
   ========================================================= */
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function clampInt(v, a, b){ return Math.round(clamp(num(v), a, b)); }
function sumPct(arr){ var s = 0; for (var i = 0; i < arr.length; i++) s += num(arr[i]); return s; }

function fmt(n){
  n = num(n);
  var a = Math.abs(n);
  if (a < 10000) return a < 100 ? (Math.round(n * 10) / 10) + '' : Math.round(n) + '';
  if (a < 1e8) return (n / 1e4).toFixed(a < 1e6 ? 1 : 0) + t('unit_wan');
  return (n / 1e8).toFixed(1) + t('unit_yi');
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(num(sec)));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
  return m + ':' + pad(s);
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function now(){ return Date.now(); }
function fmtDur(sec){
  sec = Math.max(0, Math.floor(num(sec)));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h > 0) return tf('dur_hm', {h: h, m: m});
  return tf('dur_m', {m: Math.max(1, m)});
}

/* =========================================================
   PART 4.5 · 音效（共享 AudioContext，单音钳制，并发上限 6）
   ========================================================= */
var SFX = (function(){
  var AC = null, master = null, live = 0, MAX_LIVE = 6;

  function ensure(){
    if (AC) return AC;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try{ AC = new C(); }catch(e){ return null; }
    master = AC.createGain();
    master.gain.value = 0.16;          /* 总输出限幅，避免叠加爆音 */
    master.connect(AC.destination);
    return AC;
  }
  /* 必须由用户手势调用，否则浏览器会拦自动播放 */
  function unlock(){
    var c = ensure();
    if (c && c.state === 'suspended'){ try{ c.resume(); }catch(e){} }
  }
  function tone(freq, dur, type, vol, delay, slideTo){
    if (S.muted) return;
    var c = ensure();
    if (!c || c.state !== 'running') return;
    if (live >= MAX_LIVE) return;      /* 并发钳制：超过就丢，不排队 */
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol == null ? 0.28 : vol), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    live++;
    osc.onended = function(){ live = Math.max(0, live - 1); };
    osc.start(t0); osc.stop(t0 + dur + 0.03);
  }
  return {
    unlock: unlock,
    tap:   function(){ tone(760 + Math.random() * 70, 0.055, 'triangle', 0.20); },
    ring:  function(){ tone(640, 0.10, 'sine', 0.22); tone(960, 0.12, 'sine', 0.14, 0.07); },
    ok:    function(){ tone(523, 0.16, 'sine', 0.24); tone(659, 0.18, 'sine', 0.20, 0.11); tone(784, 0.26, 'sine', 0.18, 0.22); },
    fail:  function(){ tone(190, 0.26, 'sawtooth', 0.16, 0, 120); },

/* =========================================================
   PART 5 · 经济（纯函数，全部做输入保护）
   ========================================================= */
function rankMult(){
  var ad = S.acadData[S.academy];
  /* 以学分为准，不信任存档里的 rank 字段（旧档可能不同步） */
  var idx = ad ? rankOf(ad.credit) : 0;
  return RANKS[idx].mult;
}
function acadPct(kind){
  var a = ACADEMIES[S.academy];
  if (!a) return 0;
  return (num(a.b[kind]) + num(a.b.all)) * rankMult();
}
function towerPct(kind){
  var s = 0;
  for (var i = 0; i < TOWER.length; i++){
    var c = TOWER[i];
    if (c.kind === kind) s += num(S.tower[c.id]) * c.per;
  }
  return s;
}
/* 法术 / 魔药 / 学徒 已接入 */
function apprPct(kind){
  var total = 0;
  for (var i = 0; i < S.apprentices.length; i++){
    var a = S.apprentices[i];
    var r = roleById(a.role), q = qualityById(a.quality);
    if (!r || !q || r.kind !== kind) continue;
    total += num(r.per) * num(a.lv) * num(q.mult);
  }
  return total;
}

function posture(){ return PON_BY_ID[S.posture] || PON_BY_ID.pon_zuo; }
function focusMod(){ return clamp((num(S.focus) - 50) * 0.002, -0.10, 0.10); }
function dissonMod(){
  if (S.disson <= 0) return 0;
  var cut = clamp(num(acadPct('dissonCut')) / 100, 0, 1);
  return -(S.disson * G.DISSON_PENALTY) * (1 - cut) / 100;
}

function manaPerSec(){
  if (!REALMS[S.r]) return 0;
  var base = REALMS[S.r].mana * (1 + G.MANA_STEP * (S.circle - 1));
  var m = 1;
  m *= (1 + sumPct([acadPct('mana'), towerPct('mana'), spellPct('mana'), potionPct('mana'), apprPct('mana')]) / 100);
  m *= (1 + num(posture().mana) / 100);
  m *= (1 + focusMod());
  m *= (1 + dissonMod());
  m *= (1 + starPct('flash') / 100);
  return Math.max(0, base * m);
}

function spellPerSec(){
  if (!REALMS[S.r]) return 0;
  var base = manaPerSec() * G.SPELL_RATE;
  var m = 1;
  m *= (1 + sumPct([acadPct('spell'), towerPct('spell'), spellPct('spell'), potionPct('spell'), apprPct('spell')]) / 100);
  m *= (1 + num(posture().spell) / 100);
  return Math.max(0, base * m * injuryMul());
}

function circleNeed(){
  if (!REALMS[S.r]) return 1;
  return REALMS[S.r].spell * (1 + G.SPELL_STEP * (S.circle - 1));
}

function rankUpCost(){ return spellPerSec() * G.BREAK_SEC * (1 + G.BREAK_SEC_PER_REALM * S.r); }

/* ---------- 施法（主动点击） ----------
   一次点击 = TAP_SEC 秒魔力产能 × 施法倍率 × 连击倍率。
   连击只存在运行态，不入存档；20 连达到 +100%。 */
var comboCount = 0, comboAt = 0;
function comboMult(){
  if (comboCount <= 1) return 1;
  return 1 + Math.min(comboCount, G.COMBO_FULL) / G.COMBO_FULL;
}
function castGain(){
  var m = 1 + sumPct([acadPct('cast'), spellPct('cast'), potionPct('cast'), apprPct('cast')]) / 100;
  m *= (1 + num(posture().cast) / 100);
  return manaPerSec() * G.TAP_SEC * m * (comboCount > 1 ? comboMult() : 1);
}

function rankUpBreakdown(){
  var base = REALMS[S.r] ? num(REALMS[S.r].succ) : 0;
  var capTower = G.CAVE_BREAK_CAP * 100;
  var towerRaw = num(towerPct('rank')) + num(spellPct('rank'));
  var cave = clamp(num(towerPct('rank')), 0, capTower);
  var book = clamp(num(spellPct('rank')), 0, capTower - cave);
  var acad = clamp(num(acadPct('rank')), 0, G.ACAD_BREAK_CAP * 100);
  var appr = num(apprPct('rank'));
  var potion = S.draughtArmed ? 12 : 0;
  var focus = focusMod() * 100;
  var star = starPct('poise');
  var raw = (base + cave + book + acad + appr + potion + focus + star) / 100;
  var total = clamp(raw, G.BREAK_RATE_FLOOR, G.BREAK_RATE_CAP) * 100;
  return {
    base: base, cave: cave, book: book, sect: acad, appr: appr, pill: potion,
    focus: focus, star: star, total: total,
    subCapped: towerRaw > capTower + 1e-9,
    hardCapped: raw > G.BREAK_RATE_CAP || raw < G.BREAK_RATE_FLOOR,
    capped: raw > G.BREAK_RATE_CAP || raw < G.BREAK_RATE_FLOOR
  };
}
function rankUpRate(){ return rankUpBreakdown().total / 100; }

function offlineEff(){
  var p = G.OFFLINE_BASE * 100;
  p += sumPct([towerPct('off'), acadPct('off'), spellPct('off'), apprPct('off')]);
  p += starPct('starsense');
  return clamp(p / 100, 0, G.OFFLINE_MAX);
}

function econStep(dt){
  if (!(dt > 0)) return;
  var gainMana = manaPerSec() * dt;
  var gainSpell = spellPerSec() * dt;
  if (!isFinite(gainMana) || !isFinite(gainSpell)) return;
  S.mana = num(S.mana) + gainMana;
  S.spell = clamp(num(S.spell) + gainSpell, 0, circleNeed());
  var regen = (G.FOCUS_REGEN + apprFocusRegen())
            * (1 + num(acadPct('focusRegen')) / 100)
            * (1 + num(posture().focusRegen) / 100);
  S.focus = clamp(num(S.focus) + regen * dt / 60, 0, G.FOCUS_MAX);
  var fr = foragerRate();
  if (fr > 0) S.reagent = num(S.reagent) + fr * dt / 60;
  ensureDaily();
  if (S.posture === 'pon_zuo') S.daily.sit = num(S.daily.sit) + dt;
  tickBuffs(dt);
  gainCredit(dt);
}

function inscribe(){
  if (S.circle >= G.CIRCLE_MAX) return false;
  var need = circleNeed();
  if (S.spell + 1e-9 < need) return false;
  S.spell = Math.max(0, S.spell - need);
  S.circle += 1;
  S.stat.circles += 1;
  scheduleSave();
  return true;
}

function canRankUp(){
  return S.r < G.REALM_MAX && S.circle >= G.CIRCLE_MAX
      && S.spell + 1e-9 >= circleNeed() && S.mana + 1e-9 >= rankUpCost();
}

function addDisson(){
  var step = G.DISSON_MIN * 60000;
  if (S.disson >= G.DISSON_MAX) return;
  if (S.disson <= 0 || !S.dissonEndAt){
    S.disson = 1;
    S.dissonEndAt = now() + step;
    return;
  }
  /* 当前链条最后一层的到期时间；新层排在它后面 */
  var lastExpiry = S.dissonEndAt + (S.disson - 1) * step;
  var want = now() + step;
  if (want > lastExpiry) lastExpiry = want;
  S.disson += 1;
  S.dissonEndAt = lastExpiry - (S.disson - 1) * step;
}
/* 按到期时间推进而不是按 now()：后台放 30 分钟回来能一次退掉 3 层 */
function tickDisson(){
  if (S.disson <= 0){ S.disson = 0; S.dissonEndAt = 0; return; }
  if (!S.dissonEndAt){ S.dissonEndAt = now() + G.DISSON_MIN * 60000; return; }

  var step = G.DISSON_MIN * 60000;
  var guard = 0, changed = false;
  while (S.disson > 0 && now() >= S.dissonEndAt && guard++ < G.DISSON_MAX + 2){
    S.disson -= 1;
    S.dissonEndAt += step;
    changed = true;
  }
  if (S.disson <= 0){ S.disson = 0; S.dissonEndAt = 0; }
  if (changed){
    if (S.disson === 0){
      S.stat.dissonClear = num(S.stat.dissonClear) + 1;
      toast(t('tip_xinmo_clear'));
    }
    scheduleSave();
  }
}

function doRankUp(bonus){
  if (S.r >= G.REALM_MAX) return null;
  if (S.circle < G.CIRCLE_MAX) return null;
  if (S.spell + 1e-9 < circleNeed()) return null;
  var cost = rankUpCost();
  if (S.mana + 1e-9 < cost) return null;

  var rate = clamp(rankUpRate() + num(bonus), G.BREAK_RATE_FLOOR, G.BREAK_RATE_CAP);
  var tookDraught = !!S.draughtArmed;
  S.draughtArmed = false;
  S.stat.attempts = (S.stat.attempts | 0) + 1;

  if (Math.random() < rate){
    S.mana = Math.max(0, num(S.mana) - cost);
    S.r = clampInt(S.r + 1, 0, G.REALM_MAX);
    S.circle = 1; S.spell = 0;
    S.stat.breaks += 1;
    ensureDaily();
    S.daily.brk = num(S.daily.brk) + 1;
    if (TRIAL_REALMS[S.r]) S.stat.trib = num(S.stat.trib) + 1;
    return {ok:true, rate:rate, tookDraught:tookDraught, r:S.r};
  }

  S.mana = Math.max(0, num(S.mana) - cost * G.FAIL_MANA_LOSS * failPenaltyMul());
  S.spell = circleNeed() * G.FAIL_SPELL_KEEP;
  S.focus = clamp(num(S.focus) + G.FOCUS_FAIL, 0, G.FOCUS_MAX);
  addDisson();
  S.stat.fails += 1;
  return {ok:false, rate:rate, tookDraught:tookDraught, r:S.r};
}

/* =========================================================
   PART 5.5 · 离线结算
   口径：先把离线时长按离线效率折算成「有效秒数」，再用与在线相同的方式推进。
   环内自动铭环，9 环封顶，**不自动晋级**。
   ========================================================= */
function simulateOffline(sec){
  var eff = offlineEff();
  var left = Math.max(0, num(sec)) * eff;
  var startMana = num(S.mana), startCircle = S.circle;
  var guard = 0;

  /* 离线期间魔药按「暂停」处理：不计时，也不参与这段收益 */
  suppressBuffs = true;
  try{
  while (left > 1e-6 && guard++ < 60){
    var rateM = manaPerSec();
    var rateS = spellPerSec();
    var need = circleNeed();
    if (!isFinite(rateM) || !isFinite(rateS)) break;

    /* 9 环封顶：只填到本环上限，不替玩家叩阶 */
    if (S.circle >= G.CIRCLE_MAX){
      S.mana += rateM * left;
      S.spell = Math.min(need, num(S.spell) + rateS * left);
      left = 0;
      break;
    }

    var remainSpell = Math.max(0, need - num(S.spell));
    var tFill = rateS > 0 ? remainSpell / rateS : Infinity;

    if (!isFinite(tFill) || tFill > left){
      S.mana += rateM * left;
      S.spell = Math.min(need, num(S.spell) + rateS * left);
      left = 0;
    }else{
      S.mana += rateM * tFill;
      S.spell = 0;
      S.circle += 1;
      S.stat.circles = (S.stat.circles | 0) + 1;
      left -= tFill;
    }
  }

  }finally{
    suppressBuffs = false;
  }

  if (!isFinite(S.mana)) S.mana = startMana;
  S.mana = num(S.mana);
  S.spell = num(S.spell);

  /* 学分在线与离线同口径：1/分钟，按真实时长算（不乘离线效率） */
  var ad = acadData(S.academy);
  var creditFrom = num(ad.credit);
  gainCredit(sec);
  var creditGain = num(ad.credit) - creditFrom;

  /* 采集员离线也产材料（按真实时长） */
  var fr = foragerRate();
  if (fr > 0) S.reagent = num(S.reagent) + fr * sec / 60;

  /* 离线期间最多缓存 1 条事件，回来再选 */
  if (sec >= 360 && !S.eventCache){
    var pe = pickEvent();
    if (pe) S.eventCache = pe.id;
  }

  return { eff: eff, mana: S.mana - startMana, circleFrom: startCircle, circleTo: S.circle,
           spell: S.spell, need: circleNeed(), credit: creditGain };
}

/* 启动 / 回到前台时调用：只结算一次（结算即写回 ts） */
function settleOffline(){
  var nowMs = now();
  /* 系统时间回拨 → 负数，clamp 到 0，不产生负收益 */
  var sec = clamp((nowMs - num(S.ts)) / 1000, 0, G.OFFLINE_CAP_SEC);
  S.ts = nowMs;
  if (sec < 1) return null;
  var info = simulateOffline(sec);
  info.sec = sec;
  info.capped = sec >= G.OFFLINE_CAP_SEC;
  S.stat.offlineMax = Math.max(num(S.stat.offlineMax), sec);
  persist();
  return info;
}

/* =========================================================
   PART 5.6 · 学院：解锁 / 学分 / 职称 / 转院
   ========================================================= */
function reach(r, c){
  return S.r > r || (S.r === r && S.circle >= c);
}
function acadUnlocked(id){
  switch (id){
    case 's_verdant':   return true;
    case 's_crimson':   return reach(1, 3);
    case 's_deepwell':  return reach(2, 1);
    case 's_stonehold': return reach(2, 5);
    case 's_starlight': return reach(3, 1);
    case 's_bany':      return num(S.ascendCount) >= 1;
  }
  return false;
}
function acadUnlockText(id){
  switch (id){
    case 's_crimson':   return tf('ui_acad_unlock_r', {rank: t('realm_1_n'), n: 3});
    case 's_deepwell':  return tf('ui_acad_unlock_r', {rank: t('realm_2_n'), n: 1});
    case 's_stonehold': return tf('ui_acad_unlock_r', {rank: t('realm_2_n'), n: 5});
    case 's_starlight': return tf('ui_acad_unlock_r', {rank: t('realm_3_n'), n: 1});
    case 's_bany':      return t('ui_acad_unlock_ascend');
  }
  return '';
}

function rankOf(credit){
  var c = num(credit), k = 0;
  for (var i = RANKS.length - 1; i >= 0; i--){ if (c >= RANKS[i].credit){ k = i; break; } }
  return k;
}
function acadData(id){
  if (!S.acadData[id]) S.acadData[id] = {credit: 0, rank: 0};
  return S.acadData[id];
}

var BONUS_KEY = {
  mana:'lbl_mana', spell:'lbl_spell', off:'lbl_off', cast:'lbl_cast', rank:'lbl_rank',
  exp:'lbl_exp', event:'lbl_event', focusRegen:'lbl_focusRegen', potionEff:'lbl_potionEff',
  potionDur:'lbl_potionDur', dissonCut:'lbl_dissonCut', alembicDiscount:'lbl_alembicDiscount',
  towerDiscount:'lbl_towerDiscount', all:'lbl_all', spellEff:'lbl_spellEff',
  potion:'lbl_potionAll', reagent:'lbl_reagent', focus:'lbl_focus', disson:'lbl_disson',
  credit:'lbl_credit', page:'lbl_page'
};
function bonusText(b){
  var out = [];
  Object.keys(b).forEach(function(k){
    if (!b[k]) return;
    var lab = t(BONUS_KEY[k] || k);
    if (k === 'rank') out.push(lab + ' +' + b[k] + 'pp');
    else if (k.indexOf('Discount') >= 0) out.push(lab + ' −' + b[k] + '%');
    else out.push(lab + ' +' + b[k] + '%');
  });
  return out.join(' · ');
}

function transferCost(){
  if (S.transCount <= 0) return 0;
  return 6000 * Math.pow(3, S.transCount - 1);
}
function transferCDLeft(){
  return Math.max(0, num(S.transAt) - now());
}
function canTransfer(id){
  if (id === S.academy) return false;
  if (!acadUnlocked(id)) return false;
  if (transferCDLeft() > 0) return false;
  return num(S.mana) + 1e-9 >= transferCost();
}
function doTransfer(id){
  if (!canTransfer(id)) return false;
  var cost = transferCost();
  S.mana = Math.max(0, num(S.mana) - cost);
  S.academy = id;
  S.transCount = (S.transCount | 0) + 1;
  S.transAt = now() + 30 * 60000;
  acadData(id);
  S.stat.academies = Object.keys(S.acadData).length;
  markCodex(id);
  applyAcadColor();
  refreshUI();
  persist();
  return true;
}

/* 学分被动累积 + 职称晋升提示（在线与离线共用） */
function gainCredit(sec){  if (!(sec > 0)) return false;
  var ad = acadData(S.academy);
  var before = rankOf(ad.credit);
  ad.credit = num(ad.credit) + sec / 60;
  var after = rankOf(ad.credit);
  ad.rank = after;
  if (after > before){
    toast(tf('tip_rank_up', {name: t(RANKS[after].key)}));
    return true;
  }
  return false;
}

/* =========================================================
   PART 5.7 · 法师塔
   ========================================================= */
function facById(id){
  for (var i = 0; i < TOWER.length; i++) if (TOWER[i].id === id) return TOWER[i];
  return null;
}
function towerUnlocked(f){ return !!f && reach(f.unlock.r, f.unlock.c); }
function towerUnlockText(f){
  return tf('ui_tower_unlock', {rank: t('realm_' + f.unlock.r + '_n'), n: f.unlock.c});
}
function towerCost(id){
  var f = facById(id);
  if (!f) return 0;
  var lv = clampInt(S.tower[id], 0, G.TOWER_MAX);
  var base = G.TOWER_COST * Math.pow(G.TOWER_COST_GROW, lv);
  var disc = clamp(num(acadPct('towerDiscount')) / 100, 0, 1);
  return base * (1 - disc);
}
function towerEffectText(f, lv){
  var v = Math.round(num(f.per) * lv * 10) / 10;
  var lab = t(BONUS_KEY[f.kind] || f.kind);
  return lab + ' +' + v + (f.kind === 'rank' ? 'pp' : '%');
}
/* 临时把某设施设成指定等级，算一次产能再还原（只读，不改存档） */
function towerRateWith(id, lv, which){
  var old = S.tower[id];
  S.tower[id] = lv;
  var r = (which === 'spell') ? spellPerSec() : manaPerSec();
  S.tower[id] = old;
  return r;
}
function upgradeTower(id){
  var f = facById(id);
  if (!f || !towerUnlocked(f)) return false;
  var lv = clampInt(S.tower[id], 0, G.TOWER_MAX);
  if (lv >= G.TOWER_MAX) return false;
  var cost = towerCost(id);
  if (num(S.mana) + 1e-9 < cost) return false;
  S.mana = Math.max(0, num(S.mana) - cost);
  S.tower[id] = lv + 1;
  refreshUI();
  persist();
  return true;
}

/* =========================================================
   PART 5.8 · 法术
   ========================================================= */
function spellById(id){
  for (var i = 0; i < SPELLS.length; i++) if (SPELLS[i].id === id) return SPELLS[i];
  return null;
}
/* 一个法术在指定等级下的总放大系数：等级 × 书库 × 月巴之塔 */
function spellMult(lv){
  return (1 + G.BOOK_LV_GROW * (num(lv) - 1))
       * (1 + 0.03 * num(S.tower.c_library))
       * (1 + num(acadPct('spellEff')) / 100);
}
/* 已装备法术对某一类加成的合计（加算） */
function spellPct(kind){
  var total = 0;
  for (var i = 0; i < S.equip.length; i++){
    var id = S.equip[i];
    if (!id) continue;
    var sp = spellById(id);
    var own = S.spells[id];
    if (!sp || !own) continue;
    var mult = spellMult(own.lv);
    if (DIR_KIND[sp.dir] === kind) total += num(sp.v) * mult;
    if (sp.affix && sp.affix.kind === kind) total += num(sp.affix.v) * mult;
  }
  return total;
}
/* 金阶晋级法术的「失败惩罚 −30%」 */
function failPenaltyMul(){
  var m = 1;
  for (var i = 0; i < S.equip.length; i++){
    var sp = spellById(S.equip[i]);
    if (sp && sp.tier === 'gold' && sp.affix && sp.affix.kind === 'failCut') m *= (1 - sp.affix.v / 100);
  }
  return m;
}

function equipSlotCount(){
  var n = 0;
  if (S.r >= 3) n = 3;
  else if (S.r >= 2) n = 2;
  else if (S.r >= 1) n = 1;
  return n + (starLv('ins_gift') > 0 ? 1 : 0);
}
function equipSlotUnlockText(i){
  var r = i + 1;
  return tf('ui_spell_slot_lock', {rank: t('realm_' + r + '_n'), n: 1});
}

/* 抽取成本：单价随累计抽取次数上升，避免后期法术瞬间满级 */
function drawCost(n){
  var base = n === 10 ? G.DRAW10_SEC : G.DRAW_SEC;
  return manaPerSec() * base * (1 + G.DRAW_INFLATE * num(S.draws));
}
function rollTier(){
  /* 第 80 抽必出金：pity 记的是「连续未出金次数」 */
  if (num(S.pity) >= G.PITY_GOLD - 1) return 3;
  var r = Math.random(), acc = 0;
  for (var i = 0; i < G.TIER_P.length; i++){
    acc += G.TIER_P[i];
    if (r < acc) return i;
  }
  return 0;
}
function drawOne(){
  var ti = rollTier();
  var tier = ['white','blue','purple','gold'][ti];
  var pool = SPELLS.filter(function(s){ return s.tier === tier; });
  var sp = pool[Math.floor(Math.random() * pool.length)];
  var isNew = !S.spells[sp.id];
  if (isNew){
    S.spells[sp.id] = {lv: 1, n: 1};
  }else{
    S.spells[sp.id].n = (S.spells[sp.id].n | 0) + 1;
    S.pages = num(S.pages) + G.TIER_PAGES[ti];
  }
  S.pity = ti === 3 ? 0 : num(S.pity) + 1;
  S.draws = num(S.draws) + 1;
  markCodex(sp.id);
  return { id: sp.id, tier: tier, isNew: isNew, pages: isNew ? 0 : G.TIER_PAGES[ti] };
}
function doDraw(n){
  var cost = drawCost(n);
  if (num(S.mana) + 1e-9 < cost) return null;
  S.mana = Math.max(0, num(S.mana) - cost);
  var out = [];
  for (var i = 0; i < n; i++) out.push(drawOne());
  refreshUI();
  persist();
  return out;
}

function equipSpell(id){
  if (!S.spells[id]) return false;
  if (S.equip.indexOf(id) >= 0) return true;
  var cnt = equipSlotCount();
  for (var i = 0; i < cnt; i++){
    if (!S.equip[i]){ S.equip[i] = id; refreshUI(); persist(); return true; }
  }
  return false;
}
function unequipSlot(i){
  if (i < 0 || i >= S.equip.length) return false;
  S.equip[i] = '';
  refreshUI();
  persist();
  return true;
}
function upgradeSpell(id){
  var own = S.spells[id];
  if (!own) return false;
  var lv = clampInt(own.lv, 1, G.BOOK_MAX_LV);
  if (lv >= G.BOOK_MAX_LV) return false;
  var need = lv;                    /* 升到下一级要「当前等级」张残页 */
  if (num(S.pages) < need) return false;
  S.pages = num(S.pages) - need;
  own.lv = lv + 1;
  refreshUI();
  persist();
  return true;
}

function spellValueText(sp, lv){
  var mult = spellMult(lv);
  var unit = sp.dir === 'rank' ? 'pp' : '%';
  var v = Math.round(num(sp.v) * mult * 10) / 10;
  var s = t(BONUS_KEY[DIR_KIND[sp.dir]]) + ' +' + v + unit;
  if (sp.affix){
    if (sp.affix.kind === 'failCut'){
      s += ' · ' + t('lbl_failCut') + ' −' + sp.affix.v + '%';
    }else{
      var au = sp.affix.kind === 'rank' ? 'pp' : '%';
      s += ' · ' + t(BONUS_KEY[sp.affix.kind] || sp.affix.kind)
         + ' +' + (Math.round(sp.affix.v * mult * 10) / 10) + au;
    }
  }
  return s;
}

/* =========================================================
   PART 5.9 · 魔药
   ========================================================= */
var suppressBuffs = false;   /* 离线结算期间让增益暂停：离线既不计时也不生效 */
function potionById(id){
  for (var i = 0; i < POTIONS.length; i++) if (POTIONS[i].id === id) return POTIONS[i];
  return null;
}
function potionAlembicMul(){
  return 1 + 0.06 * num(S.tower.c_alembic);      /* 炼金台：效果与时长同时放大 */
}
function potionEffectPct(p){
  var e = potionAlembicMul() * (1 + num(acadPct('potionEff')) / 100);
  return num(p.pct) * e;
}
function potionDurationMs(p){
  var d = potionAlembicMul() * (1 + num(acadPct('potionDur')) / 100);
  return num(p.durMin) * 60000 * d;
}
/* 当前生效的增益对某一类产能的合计（加算） */
function potionPct(kind){
  if (suppressBuffs) return 0;
  var total = 0;
  for (var i = 0; i < S.buffs.length; i++){
    var b = S.buffs[i];
    if (b.kind === kind && num(b.remainMs) > 0) total += num(b.pct);
  }
  return total;
}
function tickBuffs(dt){
  if (!(dt > 0) || !S.buffs.length) return;
  var changed = false;
  for (var i = S.buffs.length - 1; i >= 0; i--){
    S.buffs[i].remainMs = num(S.buffs[i].remainMs) - dt * 1000;
    if (S.buffs[i].remainMs <= 0){ S.buffs.splice(i, 1); changed = true; }
  }
  return changed;
}

function brewCost(p){ return manaPerSec() * num(p.sec); }
function canBrew(p){
  if (!p) return false;
  if (num(S.potions[p.id]) >= p.cap) return false;
  if (num(S.reagent) < p.reagent) return false;
  return num(S.mana) + 1e-9 >= brewCost(p);
}
function brewPotion(id){
  var p = potionById(id);
  if (!canBrew(p)) return false;
  S.mana = Math.max(0, num(S.mana) - brewCost(p));
  S.reagent = Math.max(0, num(S.reagent) - p.reagent);
  S.potions[p.id] = clampInt(num(S.potions[p.id]) + 1, 0, p.cap);
  S.stat.brews = num(S.stat.brews) + 1;
  S.brewKinds[p.id] = 1;
  markCodex(p.id);
  refreshUI();
  persist();
  return true;
}

/* 最多同时 3 种增益：同种刷新，异种占位 */
function activeBuffKinds(){
  var k = [];
  for (var i = 0; i < S.buffs.length; i++){
    if (num(S.buffs[i].remainMs) > 0 && k.indexOf(S.buffs[i].kind) < 0) k.push(S.buffs[i].kind);
  }
  return k;
}
function usePotion(id){
  var p = potionById(id);
  if (!p) return {ok: false, why: 'none'};
  if (num(S.potions[id]) <= 0) return {ok: false, why: 'none'};

  if (p.kind === 'buff'){
    var kinds = activeBuffKinds();
    if (kinds.indexOf(p.dir) < 0 && kinds.length >= 3) return {ok: false, why: 'maxBuff'};
    var pct = potionEffectPct(p);
    var durMs = potionDurationMs(p);
    var found = null;
    for (var i = 0; i < S.buffs.length; i++) if (S.buffs[i].kind === p.dir) found = S.buffs[i];
    if (found){ found.pct = pct; found.remainMs = durMs; }
    else S.buffs.push({kind: p.dir, pct: pct, remainMs: durMs, id: id});
  }else if (p.kind === 'ascend'){
    S.draughtArmed = true;
  }else if (p.kind === 'clarity'){
    S.focus = clamp(num(S.focus) + 40, 0, G.FOCUS_MAX);
    S.injuryUntil = 0;                 /* 清心药剂也解轻伤 */
    if (S.disson > 0){
      S.disson -= 1;
      if (S.disson <= 0){ S.disson = 0; S.dissonEndAt = 0; }
    }
  }else if (p.kind === 'echo'){
    var gain = spellPerSec() * 1800;
    var need = circleNeed();
    var room = Math.max(0, need - num(S.spell));
    if (room <= 1e-9) return {ok: false, why: 'full'};
    var applied = Math.min(gain, room);
    S.spell = num(S.spell) + applied;
    if (applied < gain * 0.999) return {ok: true, waste: true};
  }

  S.potions[id] = Math.max(0, num(S.potions[id]) - 1);
  refreshUI();
  persist();
  return {ok: true};
}

function buffLabel(kind){
  return t(BONUS_KEY[kind] || kind);
}

/* =========================================================
   PART 5.10 · 学徒
   ========================================================= */
function roleById(id){
  for (var i = 0; i < ROLES.length; i++) if (ROLES[i].id === id) return ROLES[i];
  return null;
}
function qualityById(id){
  for (var i = 0; i < QUALITIES.length; i++) if (QUALITIES[i].id === id) return QUALITIES[i];
  return QUALITIES[0];
}
/* 席位：见习 1 / 初阶 2 / 中阶 3 / 高阶 4 */
function apprenticeSlots(){ return clampInt(S.r, 0, 4); }
function apprenticeSlotLockText(i){
  var r = i + 1;
  return tf('ui_appr_lock', {rank: t('realm_' + r + '_n'), n: 1});
}
function foragerRate(){ return apprPct('reagent'); }        /* 材料 / 分钟 */
function apprFocusRegen(){                                   /* 专注 / 分钟 */
  var total = 0;
  for (var i = 0; i < S.apprentices.length; i++){
    var a = S.apprentices[i];
    var r = roleById(a.role), q = qualityById(a.quality);
    if (!r || !q || !r.focus) continue;
    total += num(r.focus) * num(a.lv) * num(q.mult);
  }
  return total;
}
function rollQuality(){
  var x = Math.random(), acc = 0;
  for (var i = 0; i < QUALITIES.length; i++){
    acc += QUALITIES[i].p;
    if (x < acc) return QUALITIES[i];
  }
  return QUALITIES[0];
}
function recruitCost(){ return manaPerSec() * 30; }
function canRecruit(){
  if (S.apprentices.length >= apprenticeSlots()) return false;
  if (rankOf(acadData(S.academy).credit) < G.DISC_RANK_MIN) return false;
  if (num(acadData(S.academy).credit) < 150) return false;
  return num(S.mana) + 1e-9 >= recruitCost();
}
function recruitApprentice(roleId){
  if (!roleById(roleId) || !canRecruit()) return null;
  var ad = acadData(S.academy);
  ad.credit = Math.max(0, num(ad.credit) - 150);
  S.mana = Math.max(0, num(S.mana) - recruitCost());
  var q = rollQuality();
  var a = {
    role: roleId, quality: q.id, lv: 1,
    name: APPR_NAMES[Math.floor(Math.random() * APPR_NAMES.length)]
  };
  S.apprentices.push(a);
  if (q.id === 'q_star') S.stat.starAppr = num(S.stat.starAppr) + 1;
  refreshUI();
  persist();
  return a;
}
function apprUpgradeCost(i){
  var a = S.apprentices[i];
  if (!a) return 0;
  var q = qualityById(a.quality);
  return manaPerSec() * 20 * num(a.lv) * num(q.mult);
}
function upgradeApprentice(i){
  var a = S.apprentices[i];
  if (!a) return false;
  if (num(a.lv) >= G.DISC_MAX_LV) return false;
  var cost = apprUpgradeCost(i);
  if (num(S.mana) + 1e-9 < cost) return false;
  S.mana = Math.max(0, num(S.mana) - cost);
  a.lv = num(a.lv) + 1;
  refreshUI();
  persist();
  return true;
}
function dismissApprentice(i){
  if (!S.apprentices[i]) return false;
  S.apprentices.splice(i, 1);
  refreshUI();
  persist();
  return true;
}
function apprEffectText(a){
  var r = roleById(a.role), q = qualityById(a.quality);
  if (!r) return '';
  var v = num(r.per) * num(a.lv) * num(q.mult);
  var unit = r.kind === 'rank' ? 'pp' : (r.kind === 'reagent' ? '/分' : '%');
  var s = buffLabel(r.kind) + ' +' + (Math.round(v * 10) / 10) + unit;
  if (r.focus) s += ' · ' + buffLabel('focusRegen') + ' +' + (Math.round(num(r.focus) * num(a.lv) * num(q.mult) * 10) / 10) + '/分';
  return s;
}

/* =========================================================
   PART 5.11 · 远征
   ========================================================= */
function dungeonById(id){
  for (var i = 0; i < DUNGEONS.length; i++) if (DUNGEONS[i].id === id) return DUNGEONS[i];
  return null;
}
function tripUnlocked(d){ return !!d && reach(d.gate.r, d.gate.c); }
function tripUnlockText(d){
  return tf('ui_exp_locked', {rank: t('realm_' + d.gate.r + '_n'), n: d.gate.c});
}
/* 游历姿态在出发时把时长减半，写入结束时间戳后不再回滚 */
function tripDurationMs(d){
  var m = d.min * 60000;
  if (S.posture === 'pon_you') m *= 0.5;
  return m;
}
function tripRatio(d){
  return clamp(1 + 0.10 * (S.r - d.gate.r), G.DUNGEON_RATIO_MIN, G.DUNGEON_RATIO_MAX);
}
function departTrip(id){
  var d = dungeonById(id);
  if (!d || !tripUnlocked(d) || S.trip) return false;
  var dur = tripDurationMs(d);
  S.trip = { id: id, startAt: now(), endAt: now() + dur, durMs: dur };
  markCodex(id);
  SFX.depart();
  refreshUI();
  persist();
  return true;
}
function randInt(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

/* 结算：返回明细；不吃 tick，只看 endAt */
function settleTrip(){
  var tr = S.trip;
  if (!tr) return null;
  if (now() < tr.endAt) return null;
  var d = dungeonById(tr.id);
  S.trip = null;
  if (!d) return null;

  var ratio = tripRatio(d);
  var out = { id: d.id, ratio: ratio, reagent: 0, pages: 0, credit: 0, mana: 0,
              potions: [], gold: false, injury: false };

  if (d.reagent){
    var n = randInt(d.reagent[0], d.reagent[1]);
    out.reagent = Math.max(1, Math.round(n * ratio));
    S.reagent = num(S.reagent) + out.reagent;
  }
  if (d.pages){
    var p = randInt(d.pages[0], d.pages[1]);
    out.pages = Math.max(1, Math.round(p * ratio));
    S.pages = num(S.pages) + out.pages;
  }
  if (d.credit){
    out.credit = Math.round(d.credit * ratio);
    var ad = acadData(S.academy);
    ad.credit = num(ad.credit) + out.credit;
  }
  if (d.manaMin){
    out.mana = manaPerSec() * d.manaMin * 60 * ratio;
    S.mana = num(S.mana) + out.mana;
  }
  if (d.potion){
    for (var i = 0; i < d.potion; i++){
      var pick = POTIONS[Math.floor(Math.random() * POTIONS.length)];
      var cap = pick.cap;
      if (clampInt(num(S.potions[pick.id]), 0, cap) < cap){
        S.potions[pick.id] = clampInt(num(S.potions[pick.id]) + 1, 0, cap);
        out.potions.push(pick.id);
      }
    }
  }
  /* 金阶法术掉落不受 ratio 影响 */
  if (d.goldP && Math.random() < d.goldP){
    var pool = SPELLS.filter(function(s){ return s.tier === 'gold'; });
    var sp = pool[Math.floor(Math.random() * pool.length)];
    out.gold = true;
    out.goldId = sp.id;
    if (!S.spells[sp.id]) S.spells[sp.id] = {lv: 1, n: 1};
    else { S.spells[sp.id].n = (S.spells[sp.id].n | 0) + 1; S.pages = num(S.pages) + 8; }
  }
  /* 10% 轻伤 */
  if (Math.random() < G.DUNGEON_INJURY){
    out.injury = true;
    S.injuryUntil = now() + 10 * 60000;
    S.stat.injuries = num(S.stat.injuries) + 1;
  }
  out.flavor = Math.random() < 0.2;      /* 「带回来的东西都在这儿了」 */
  S.stat.expeditions = (S.stat.expeditions | 0) + 1;
  SFX.back();
  ensureDaily();
  S.daily.dungeon = num(S.daily.dungeon) + 1;
  refreshUI();
  persist();
  return out;
}
/* 轻伤期间咒力产出打折 */
function injuryMul(){
  return (num(S.injuryUntil) > now()) ? 0.8 : 1;
}

/* =========================================================
   PART 5.12 · 事件 / 天降机缘 / 每日功课
   ========================================================= */
function eventById(id){
  for (var i = 0; i < EVENTS.length; i++) if (EVENTS[i].id === id) return EVENTS[i];
  return null;
}
/* 抽一条没见过的；学院专属只在对应学院出现 */
function pickEvent(){
  var seen = S.eventSeen || [];
  var pool = EVENTS.filter(function(e){
    if (e.acad && e.acad !== S.academy) return false;
    return seen.indexOf(e.id) < 0;
  });
  if (!pool.length){
    S.eventSeen = [];
    pool = EVENTS.filter(function(e){ return !e.acad || e.acad === S.academy; });
  }
  return pool[Math.floor(Math.random() * pool.length)];
}
function eventIntervalMs(){
  var m = G.QIYU_MIN + Math.random() * (G.QIYU_MAX - G.QIYU_MIN);
  if (S.posture === 'pon_you') m *= 2 / 3;      /* 游历：事件概率 +50% */
  return m * 60000;
}
function scheduleEvent(){
  S.eventAt = now() + eventIntervalMs();
}
/* 选项里要扣的资源不够就不能选 */
function canAffordEffects(ef){
  for (var i = 0; i < ef.length; i++){
    var k = ef[i][0], v = ef[i][1];
    if (v >= 0) continue;
    if (k === 'reagent' && num(S.reagent) < -v) return false;
    if (k === 'page' && num(S.pages) < -v) return false;
    if (k === 'credit' && num(acadData(S.academy).credit) < -v) return false;
    if (k === 'mana' && num(S.mana) < -v) return false;
  }
  return true;
}
function applyEventEffects(ef){
  ef.forEach(function(e){
    var k = e[0], v = e[1], unit = e[2];
    if (k === 'mana'){
      var amt = unit === 'm' ? manaPerSec() * v * 60 : v;
      S.mana = Math.max(0, num(S.mana) + amt);
    }else if (k === 'spell'){
      var sam = unit === 'm' ? spellPerSec() * v * 60 : v;
      S.spell = clamp(num(S.spell) + sam, 0, circleNeed());
    }else if (k === 'focus'){
      S.focus = clamp(num(S.focus) + v, 0, G.FOCUS_MAX);
    }else if (k === 'disson'){
      if (v > 0){ for (var i = 0; i < v; i++) addDisson(); }
      else if (v < 0){
        S.disson = Math.max(0, num(S.disson) + v);
        if (S.disson === 0) S.dissonEndAt = 0;
      }
    }else if (k === 'reagent'){
      S.reagent = Math.max(0, num(S.reagent) + v);
    }else if (k === 'page'){
      S.pages = Math.max(0, num(S.pages) + v);
    }else if (k === 'credit'){
      var ad = acadData(S.academy);
      ad.credit = Math.max(0, num(ad.credit) + v);
    }else if (k === 'potion'){
      var p = potionById(v);
      if (p) S.potions[v] = clampInt(num(S.potions[v]) + 1, 0, p.cap);
    }
  });
  refreshUI();
  persist();
}
function fireEvent(){
  var e = pickEvent();
  if (!e) return null;
  S.eventSeen.push(e.id);
  S.stat.events = (S.stat.events | 0) + 1;
  scheduleEvent();
  persist();
  return e;
}

/* ---------- 天降机缘 ---------- */
function scheduleJiban(){
  var m = G.JIBAN_MIN + Math.random() * (G.JIBAN_MAX - G.JIBAN_MIN);
  S.jibanAt = now() + m * 60000;
}
function claimJiban(){
  if (!S.jibanGot) return false;
  var mins = 3 + Math.random() * 2;
  S.mana = num(S.mana) + manaPerSec() * mins * 60;
  var ad = acadData(S.academy);

  S.jibanGot = false;

}

/* ---------- 每日功课 ---------- */
var DAILY = [
  {id:'daily_tap',     key:'daily_tap_n',     desc:'daily_tap_d',     goal:100},
  {id:'daily_dungeon', key:'daily_dungeon_n', desc:'daily_dungeon_d', goal:1},
  {id:'daily_break',   key:'daily_break_n',   desc:'daily_break_d',   goal:1}
];
function dayKeyNow(){
  var d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function ensureDaily(){
  var k = dayKeyNow();
  if (!S.daily || S.daily.key !== k){
    S.daily = {key: k, tap: 0, dungeon: 0, brk: 0, sit: 0, got: []};
  }
}
function dailyProgress(id){
  if (id === 'daily_tap') return num(S.daily.tap);
  if (id === 'daily_dungeon') return num(S.daily.dungeon);
  if (id === 'daily_break') return Math.max(num(S.daily.brk), num(S.daily.sit) / 1800);
  return 0;
}
function dailyDone(id){
  var d = DAILY.filter(function(x){ return x.id === id; })[0];
  return d ? dailyProgress(id) >= d.goal : false;
}
function claimDaily(id){
  ensureDaily();
  if (S.daily.got.indexOf(id) >= 0 || !dailyDone(id)) return false;
  S.daily.got.push(id);
  S.mana = num(S.mana) + manaPerSec() * 300;        /* 单项 5 分钟产能 */
  if (S.daily.got.length >= DAILY.length){
    var ad = acadData(S.academy);
    ad.credit = num(ad.credit) + 60;
    var p = POTIONS[Math.floor(Math.random() * POTIONS.length)];
    S.potions[p.id] = clampInt(num(S.potions[p.id]) + 1, 0, p.cap);
    S.stat.dailyAll = num(S.stat.dailyAll) + 1;
  }
  refreshUI();
  persist();
  return true;
}

/* =========================================================
   PART 5.13 · 试炼
   ========================================================= */
function trialName(targetRealm){
  var key = TRIAL_REALMS[targetRealm];
  return key ? key : null;
}
/* 把「叩阶」拆成两步：普通晋级直接掷骰，试炼阶位先打三雷 */
function commitRankUp(){
  var target = S.r + 1;
  if (TRIAL_REALMS[target]){
    startTrial(target);
    return null;
  }
  return doRankUp(0);
}
function startTrial(target){
  if (S.trial) return false;
  S.trial = { at: now(), bolts: 0, realm: target };
  markCodex(TRIAL_REALMS[target]);
  persist();
  openTrialModal();
  return true;
}
function trialElapsed(){
  return S.trial ? (now() - num(S.trial.at)) : 0;
}
function trialBoltState(i){
  var e = trialElapsed();
  var off = TRIAL_WINDOWS[i];
  if (num(S.trial.bolts) > i) return 'hit';
  if (e < off) return 'wait';
  if (e <= off + TRIAL_WINDOW_MS) return 'open';
  return 'miss';
}
function clickBolt(i){
  if (!S.trial) return false;
  if (trialBoltState(i) !== 'open') return false;
  S.trial.bolts = Math.max(num(S.trial.bolts), i + 1);
  persist();
  return true;
}
/* 三雷都过了（或满 20 秒）就结算 */
function trialReady(){
  if (!S.trial) return false;
  if (trialElapsed() >= G.TRIB_AUTO_MS) return true;
  for (var i = 0; i < TRIAL_WINDOWS.length; i++){
    if (trialBoltState(i) === 'wait' || trialBoltState(i) === 'open') return false;
  }

  {id:'ins_gift',      key:'ins_gift_n',      desc:'ins_gift_d',      cap:1,  cost:function(){ return 20; }},

];
function insightById(id){
  for (var i = 0; i < INSIGHTS.length; i++) if (INSIGHTS[i].id === id) return INSIGHTS[i];
  return null;
}
function starLv(id){
  var ins = insightById(id);
  return ins ? clampInt(num(S.star[id]), 0, ins.cap) : 0;
}
function starPct(kind){
  if (kind === 'flash') return starLv('ins_flash') * 10;
  if (kind === 'poise') return starLv('ins_poise') * 5;
  if (kind === 'starsense') return starLv('ins_starsense') * 5;
  return 0;
}
function buyInsight(id){
  var ins = insightById(id);
  if (!ins) return false;
  var lv = starLv(id);
  if (lv >= ins.cap) return false;
  var cost = ins.cost(lv);
  if (num(S.starPts) < cost) return false;
  S.starPts = num(S.starPts) - cost;
  S.star[id] = lv + 1;
  refreshUI();
  persist();
  return true;
}

/* 星辉 = floor(总环数^1.5 / 8)，满 90 环 = 106 */
function ascendPoints(){
  var total = S.r * 9 + S.circle;
  return Math.floor(Math.pow(total, G.ASCEND_POW) / G.ASCEND_DIV);
}
function canAscend(){
  return S.r >= G.REALM_MAX && S.circle >= G.CIRCLE_MAX;
}
/* 回环：抹掉这一世的积累，留下星图与图鉴 */
function doAscend(){
  if (!canAscend()) return null;
  var pts = ascendPoints();
  S.starPts = num(S.starPts) + pts;
  S.ascendCount = (S.ascendCount | 0) + 1;

  var legacy = starLv('ins_legacy') > 0;
  var keepAch = S.ach, keepCodex = S.codex, keepStat = S.stat;

  S.r = 0;
  S.circle = legacy ? 5 : 1;
  S.spell = 0; S.mana = 0;
  S.focus = G.FOCUS_MAX; S.disson = 0; S.dissonEndAt = 0;
  S.tower = { c_manapool:0, c_mat:0, c_mirror:0, c_alembic:0, c_library:0, c_ward:0 };
  Object.keys(S.spells).forEach(function(k){ S.spells[k].lv = 1; });
  S.pages = 0;
  S.potions = {}; S.buffs = []; S.draughtArmed = false;
  S.reagent = 0;
  S.apprentices = [];
  S.acadData = {}; S.acadData[S.academy] = {credit: 0, rank: 0};
  S.trip = null; S.trial = null; S.injuryUntil = 0;
  S.eventSeen = []; S.eventCache = null; S.eventAt = 0;
  S.jibanAt = 0; S.jibanGot = false;
  S.daily = { key: dayKeyNow(), tap: 0, dungeon: 0, brk: 0, sit: 0, got: [] };

  S.ach = keepAch; S.codex = keepCodex; S.stat = keepStat;
  scheduleEvent(); scheduleJiban();
  persist();
  return { pts: pts, total: S.starPts, legacy: legacy, count: S.ascendCount };
}
