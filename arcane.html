/* ---------- 手记：每日功课 ---------- */
function renderNotePanel(){
  ensureDaily();
  var html = '<div class="kicker">' + t('daily_title') + '</div>';
  DAILY.forEach(function(d){
    var prog = Math.min(dailyProgress(d.id), d.goal);
    var claimed = S.daily.got.indexOf(d.id) >= 0;
    var done = dailyProgress(d.id) >= d.goal;
    html += '<div class="card fac">';
    html +=   '<div class="nm">' + t(d.key)
          +    '<span class="cat">' + Math.floor(prog) + ' / ' + d.goal + '</span></div>';
    html +=   '<div class="ds">' + t(d.desc) + '</div>';
    if (claimed){
      html += '<button class="facBtn" disabled>' + t('daily_done') + '</button>';
    }else if (done){
      html += '<button class="facBtn" data-dclaim="' + d.id + '">' + t('btn_claim')
           +  ' · ' + tf('daily_item_reward', {n: 5}) + '</button>';
    }else{
      html += '<button class="facBtn" disabled>' + t('btn_claim') + '</button>';
    }
    html += '</div>';
  });
  if (S.daily.got.length >= DAILY.length){
    html += '<div class="mnote">' + t('daily_all_reward') + '</div>';
  }

  /* 成就 */
  html += '<div class="kicker kicker2">' + t('ui_ach_title') + '</div>';
  html += '<div class="cxHead"><span></span><span>'
       +  tf('ui_ach_prog', {a: (S.ach || []).length, b: ACHS.length}) + '</span></div>';
  html += '<div class="chips">';
  ACHS.forEach(function(a){
    var got = hasAch(a.id);
    html += '<span class="chip' + (got ? ' got' : ' off') + '">'
         +  (got ? t(a.n) : t('ui_codex_locked')) + '</span>';
  });
  html += '</div>';

  /* 图鉴 */
  html += '<div class="kicker kicker2">' + t('ui_codex_title') + '</div>';
  CODEX_GROUPS.forEach(function(g){
    var seen = 0;
    var chips = '';
    g.ids.forEach(function(id){
      var got = !!S.codex[id];
      if (got) seen++;
      chips += '<span class="chip' + (got ? ' got' : ' off') + '">'
            +  (got ? t(id + '_n') : t('ui_codex_locked')) + '</span>';
    });
    html += '<div class="cxHead"><span>' + t(g.key) + '</span><span>'
         +  tf('ui_ach_prog', {a: seen, b: g.ids.length}) + '</span></div>';
    html += '<div class="chips">' + chips + '</div>';
  });

  el.panelBody.innerHTML = html;
  Array.prototype.forEach.call(el.panelBody.querySelectorAll('[data-dclaim]'), function(b){
    b.addEventListener('click', function(){
      if (claimDaily(b.dataset.dclaim)) renderNotePanel();
    });
  });
}

/* ---------- 法术面板 ---------- */
function renderSpellPanel(){
  var cost1 = drawCost(1), cost10 = drawCost(10);
  var html = '';

  html += '<div class="spHead">'
        + '<div class="spCell"><span>' + t('ui_spell_pages') + '</span><b>' + fmt(S.pages) + '</b></div>'
        + '<div class="spCell"><span>' + t('ui_spell_pity') + '</span><b>'
        + Math.min(num(S.pity), G.PITY_GOLD) + '/' + G.PITY_GOLD + '</b></div>'
        + '<div class="spCell"><span>' + t('ui_spell_have') + '</span><b>'
        + Object.keys(S.spells).length + '/24</b></div>'
        + '</div>';

  html += '<div class="spDraw">'
        + '<button class="spBtn" data-draw="1">' + t('ui_spell_draw1') + ' · ' + fmt(cost1) + '</button>'
        + '<button class="spBtn" data-draw="10">' + t('ui_spell_draw10') + ' · ' + fmt(cost10) + '</button>'
        + '</div>';

  html += '<div class="kicker kicker2">' + t('ui_spell_slots') + '</div>';
  var cnt = equipSlotCount();
  for (var i = 0; i < 3; i++){
    var id = S.equip[i];
    html += '<div class="card slot">';
    if (i >= cnt){
      html += '<div class="nm">' + t('ui_spell_slot_empty') + '</div>';
      html += '<div class="dl lock">' + equipSlotUnlockText(i) + '</div>';
    }else if (!id){
      html += '<div class="nm">' + t('ui_spell_slot_empty') + '</div>';
    }else{
      var sp = spellById(id), own = S.spells[id];
      html += '<div class="nm">' + t(id + '_n')
            + '<span class="cat tier-' + sp.tier + '">' + t(TIER_NAME[sp.tier])
            + ' · ' + tf('ui_spell_lv', {n: own.lv}) + '</span></div>';
      html += '<div class="ds">' + spellValueText(sp, own.lv) + '</div>';
      html += '<button class="facBtn ghost" data-unequip="' + i + '">' + t('btn_unequip') + '</button>';
    }
    html += '</div>';
  }

  html += '<div class="kicker kicker2">' + t('ui_spell_owned') + '</div>';
  var ids = Object.keys(S.spells);
  if (!ids.length){
    html += '<div class="wip">' + t('ui_spell_empty') + '</div>';
  }else{
    ids.sort(function(a, b){
      var A = spellById(a), B = spellById(b);
      return (TIER_INDEX[B.tier] - TIER_INDEX[A.tier]) || (a < b ? -1 : 1);
    });
    ids.forEach(function(sid){
      var s2 = spellById(sid), own2 = S.spells[sid];
      var equipped = S.equip.indexOf(sid) >= 0;
      var canUp = own2.lv < G.BOOK_MAX_LV && num(S.pages) >= own2.lv;
      html += '<div class="card spItem">';
      html +=   '<div class="nm">' + t(sid + '_n')
            +    '<span class="cat tier-' + s2.tier + '">' + t(TIER_NAME[s2.tier]) + '</span></div>';
      html +=   '<div class="ds">' + spellValueText(s2, own2.lv) + '</div>';
      html +=   '<div class="spActions">';
      if (!equipped) html += '<button class="miniBtn" data-equip="' + sid + '">' + t('btn_equip') + '</button>';
      else html += '<span class="miniTag">' + t('ui_acad_joined') + '</span>';
      if (own2.lv >= G.BOOK_MAX_LV){
        html += '<span class="miniTag">' + t('ui_spell_max') + '</span>';
      }else{
        html += '<button class="miniBtn' + (canUp ? '' : ' dim') + '" data-up="' + sid + '">'
             +  tf('ui_spell_up', {n: own2.lv}) + '</button>';
      }
      html +=   '</div>';
      html += '</div>';
    });
  }

  el.panelBody.innerHTML = html;
  bindSpellPanel();
}

function bindSpellPanel(){
  var q = el.panelBody.querySelectorAll.bind(el.panelBody);
  Array.prototype.forEach.call(q('[data-draw]'), function(b){
    b.addEventListener('click', function(){
      var n = Number(b.dataset.draw);
      var res = doDraw(n);
      if (!res){ toast(t('tip_mana_lack')); return; }
      renderSpellPanel();
      openDrawResult(res);
    });
  });
  Array.prototype.forEach.call(q('[data-unequip]'), function(b){
    b.addEventListener('click', function(){
      unequipSlot(Number(b.dataset.unequip));
      renderSpellPanel();
    });
  });
  Array.prototype.forEach.call(q('[data-equip]'), function(b){
    b.addEventListener('click', function(){
      if (!equipSpell(b.dataset.equip)) toast(t('ui_spell_full'));
      renderSpellPanel();
    });
  });
  Array.prototype.forEach.call(q('[data-up]'), function(b){
    b.addEventListener('click', function(){
      if (!upgradeSpell(b.dataset.up)) toast(t('ui_spell_up_lack'));
      renderSpellPanel();
    });
  });
}

function openDrawResult(results){
  modalMode = 'draw';
  resetModalFoot();
  var html = '';
  results.forEach(function(r){
    html += '<div class="drow">'
         +  '<span class="tier-' + r.tier + '">◆</span>'
         +  '<span class="dn">' + t(r.id + '_n') + '</span>'
         +  '<span class="dt">' + (r.isNew ? t('ui_spell_new') : tf('ui_spell_dup', {n: r.pages})) + '</span>'
         +  '</div>';
  });
  el.modalTitle.textContent = t('ui_spell_result');
  el.modalBody.innerHTML = html;
  el.modalOk.textContent = t('btn_ok');
  el.modalCancel.hidden = true;
  el.modalOk.disabled = false;
  el.modal.classList.add('show');
  el.modalScrim.classList.add('show');
}

/* ---------- 法师塔面板 ---------- */
var towerTab = 'build';

function renderTowerPanel(){
  var html = '<div class="seg">'
    + '<button class="segBtn' + (towerTab === 'build' ? ' on' : '') + '" data-tt="build">'
    +   t('tab_sub_tower_build') + '</button>'
    + '<button class="segBtn' + (towerTab === 'potion' ? ' on' : '') + '" data-tt="potion">'
    +   t('tab_sub_tower_potion') + '</button>'
    + '<button class="segBtn' + (towerTab === 'appr' ? ' on' : '') + '" data-tt="appr">'
    +   t('tab_sub_tower_disciple') + '</button>'
    + '</div>';

  html += (towerTab === 'potion') ? potionPanelHtml()
        : (towerTab === 'appr' ? apprPanelHtml() : buildPanelHtml());
  el.panelBody.innerHTML = html;

  var body = el.panelBody;
  Array.prototype.forEach.call(body.querySelectorAll('[data-tt]'), function(b){
    b.addEventListener('click', function(){ towerTab = b.dataset.tt; renderTowerPanel(); });
  });

  if (towerTab === 'appr'){
    Array.prototype.forEach.call(body.querySelectorAll('[data-recruit]'), function(b){
      b.addEventListener('click', openRecruitModal);
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-aup]'), function(b){
      b.addEventListener('click', function(){
        if (!upgradeApprentice(Number(b.dataset.aup))) toast(t('ui_mana_lack'));
        renderTowerPanel();
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-aleave]'), function(b){
      b.addEventListener('click', function(){
        var i = Number(b.dataset.aleave);
        var a = S.apprentices[i];
        if (!a) return;
        openConfirm(t('ui_appr_leave_t'), tf('ui_appr_leave_b', {name: a.name}),
                    t('ui_appr_leave'), function(){ dismissApprentice(i); renderTowerPanel(); });
      });
    });
    return;
  }

  if (towerTab === 'potion'){
    Array.prototype.forEach.call(body.querySelectorAll('[data-brew]'), function(b){
      b.addEventListener('click', function(){
        var p = potionById(b.dataset.brew);
        if (!brewPotion(p.id)){
          if (num(S.potions[p.id]) >= p.cap) toast(t('ui_potion_full'));
          else if (num(S.reagent) < p.reagent) toast(t('ui_potion_reagent') + ' · ' + t('ui_potion_lack_reagent'));
          else toast(t('ui_potion_lack_mana'));
          return;
        }
        toast(t('ui_potion_ok'));
        renderTowerPanel();
      });
    });
    Array.prototype.forEach.call(body.querySelectorAll('[data-use]'), function(b){
      b.addEventListener('click', function(){
        var r = usePotion(b.dataset.use);
        if (!r.ok){
          if (r.why === 'maxBuff') toast(t('ui_potion_max_buff'));
          else if (r.why === 'full') toast(t('ui_echo_full'));
          else toast(t('ui_potion_none'));
          return;
        }
        toast(r.waste ? t('ui_echo_waste') : t('ui_use_ok'));
        renderTowerPanel();
      });
    });
    return;
  }

  Array.prototype.forEach.call(body.querySelectorAll('[data-up]'), function(b){
    b.addEventListener('click', function(){
      if (upgradeTower(b.dataset.up)) renderTowerPanel();
    });
  });
}

function buildPanelHtml(){
  var html = '';
  TOWER.forEach(function(f){
    var lv = clampInt(S.tower[f.id], 0, G.TOWER_MAX);
    var unlocked = towerUnlocked(f);
    var maxed = lv >= G.TOWER_MAX;
    var cost = towerCost(f.id);

    html += '<div class="card fac">';
    html +=   '<div class="nm">' + t(f.key)
          +    '<span class="cat">' + tf('ui_tower_lv', {n: lv}) + '</span></div>';
    html +=   '<div class="ds">' + t('ui_tower_per') + ' ' + towerEffectText(f, 1) + '</div>';

    if (!unlocked){
      html += '<div class="dl lock">' + towerUnlockText(f) + '</div>';
    }else{
      html += '<div class="dl">' + t('ui_tower_cur') + ' ' + towerEffectText(f, lv)
            + (maxed ? '' : ' → ' + towerEffectText(f, lv + 1)) + '</div>';

      if (f.kind === 'mana' || f.kind === 'spell'){
        var r0 = towerRateWith(f.id, lv, f.kind);
        var r1 = towerRateWith(f.id, lv + 1, f.kind);
        html += '<div class="dl go">'
             +  tf(f.kind === 'spell' ? 'ui_tower_rate_spell' : 'ui_tower_rate',
                  {a: (Math.round(r0 * 10) / 10), b: (Math.round(r1 * 10) / 10)}) + '</div>';
      }

      if (maxed){
        html += '<button class="facBtn" disabled>' + t('ui_tower_max') + '</button>';
      }else if (num(S.mana) + 1e-9 < cost){
        html += '<button class="facBtn" disabled>'
             +  tf('ui_tower_lack', {n: fmt(cost - num(S.mana))}) + '</button>';
      }else{
        html += '<button class="facBtn" data-up="' + f.id + '">'
             +  tf('ui_tower_up', {n: fmt(cost)}) + '</button>';
      }
    }
    html += '</div>';
  });
  return html;
}

/* ---------- 试炼弹层 ---------- */
function boltSVG(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
       + 'stroke-linejoin="round" stroke-linecap="round"><path d="M13 2 6.5 13H11l-1.2 9L17 11h-4.4z"/></svg>';
}
function openTrialModal(){
  if (!S.trial) return;
  modalMode = 'trial';
  resetModalFoot();
  var key = TRIAL_REALMS[S.trial.realm];
  el.modalTitle.textContent = t(key + '_n');

  var html = '<div class="evBody">' + t(key + '_d') + '</div>';
  html += '<div class="bolts">';
  for (var i = 0; i < 3; i++){
    html += '<button class="bolt" data-bolt="' + i + '">' + boltSVG() + '</button>';
  }
  html += '</div>';
  html += '<div class="trialBar"><i id="trialFill"></i></div>';
  html += '<div class="mnote" id="trialNote">' + t('ui_trial_hint') + '</div>';

  el.modalBody.innerHTML = html;
  el.modalOk.hidden = true;
  el.modalCancel.hidden = true;
  el.modal.classList.add('show');
  el.modalScrim.classList.add('show');

  Array.prototype.forEach.call(el.modalBody.querySelectorAll('[data-bolt]'), function(b){
    b.addEventListener('click', function(){
      if (clickBolt(Number(b.dataset.bolt))) SFX.tap();
      updateTrialUI();
    });
  });
  updateTrialUI();
}
function updateTrialUI(){
  if (modalMode !== 'trial' || !S.trial) return;
  var e = trialElapsed();
  var bolts = el.modalBody.querySelectorAll('[data-bolt]');
  for (var i = 0; i < bolts.length; i++){
    var st = trialBoltState(i);
    bolts[i].className = 'bolt'
      + (st === 'open' ? ' open' : st === 'hit' ? ' hit' : st === 'miss' ? ' miss' : '');
  }
  var fill = document.getElementById('trialFill');
  if (fill) fill.style.width = Math.min(100, e / G.TRIB_AUTO_MS * 100).toFixed(1) + '%';

  var note = document.getElementById('trialNote');
  if (note){
    var p = Math.round((rankUpRate() + num(S.trial.bolts) * G.TRIB_BONUS) * 100);
    note.textContent = tf('ui_trial_now', {p: p}) + ' · '
      + tf('ui_trial_auto', {t: fmtTime(Math.max(0, (G.TRIB_AUTO_MS - e) / 1000))});
  }
  if (trialReady()) finishTrialAndShow();
}
function finishTrialAndShow(){
  var res = finishTrial();
  closeRankUpModal();
  if (!res) return;
  if (res.ok){
    floatText(t('ui_trial_pass'), 'gold');
    toast(t('brk_' + res.r + '_d'));
    SFX.ok();
  }else{
    floatText(t('tip_break_no'), 'bad');
    toast(t('tip_xinmo_up'));
    SFX.fail();
  }
  refreshUI();
  if (curTab) renderPanel(curTab);
}

/* ---------- 事件弹层 ---------- */function effectText(ef){
  var parts = [];
  ef.forEach(function(e){
    var k = e[0], v = e[1], unit = e[2];
    if (k === 'potion'){
      var p = potionById(v);
      parts.push((p ? t(p.key) : v));
      return;
    }
    var lab = buffLabel(k);
    if (k === 'disson'){
      parts.push(lab + ' ' + (v > 0 ? '+' : '') + v + ' ' + t('lbl_layer'));
      return;
    }
    parts.push(lab + ' ' + (v > 0 ? '+' : '') + v + (unit === 'm' ? ' ' + t('lbl_min') : ''));
  });
  return parts.join(' · ');
}
function openEventModal(e){
  modalMode = 'event';
  resetModalFoot();
  SFX.event();
  el.modalTitle.textContent = t(e.id + '_n');

  var okA = canAffordEffects(e.a);
  var okB = canAffordEffects(e.b);
  var html = '<div class="evBody">' + t(e.id + '_b') + '</div>';
  html += '<button class="rrow" data-opt="a"' + (okA ? '' : ' disabled') + '>'
       +  '<b>' + t(e.id + '_a') + '</b><i>' + effectText(e.a) + '</i></button>';
  html += '<button class="rrow" data-opt="b"' + (okB ? '' : ' disabled') + '>'
       +  '<b>' + t(e.id + '_c') + '</b><i>' + effectText(e.b) + '</i></button>';

  el.modalBody.innerHTML = html;
  el.modalOk.hidden = true;
  el.modalCancel.hidden = (okA || okB);      /* 两个都选不了时给个出口 */
  el.modalCancel.textContent = t('btn_cancel');
  el.modal.classList.add('show');
  el.modalScrim.classList.add('show');

  Array.prototype.forEach.call(el.modalBody.querySelectorAll('[data-opt]'), function(b){
    b.addEventListener('click', function(){
      var ef = b.dataset.opt === 'a' ? e.a : e.b;
      applyEventEffects(ef);
      S.eventCache = null;
      closeRankUpModal();
      toast(t('ui_use_ok'));
    });
  });
}

/* ---------- 远征面板 ---------- */
function rewardSummary(d){
  var parts = [];
  if (d.reagent) parts.push(t('res_reagent') + ' ' + d.reagent[0] + '~' + d.reagent[1]);
  if (d.pages) parts.push(t('res_page') + ' ' + d.pages[0] + '~' + d.pages[1]);
  if (d.manaMin) parts.push(t('res_mana') + ' ' + d.manaMin + '分');
  if (d.potion) parts.push(t('ui_exp_gain_potion').replace('{n}', d.potion));
  if (d.goldP) parts.push(Math.round(d.goldP * 100) + '% ' + t('ui_exp_gold'));
  parts.push(t('res_credit') + ' ' + d.credit);
  return parts.join(' · ');
}
function renderExpedPanel(){
  var html = '';

  if (S.trip){
    var cur = dungeonById(S.trip.id);
    var leftMs = Math.max(0, S.trip.endAt - now());
    var pct = S.trip.durMs ? (1 - leftMs / S.trip.durMs) : 1;
    html += '<div class="acadNow">';
    html +=   '<div class="anNm">' + t('ui_exp_active') + '<span class="anTag">' + t(cur.key) + '</span></div>';
    html +=   '<div class="anB">' + tf('ui_exp_left', {t: fmtTime(leftMs / 1000)}) + '</div>';
    html +=   '<div class="acadBar"><i style="width:' + (clamp(pct, 0, 1) * 100).toFixed(1) + '%"></i></div>';
    html += '</div>';
  }

  html += '<div class="acadList">';
  DUNGEONS.forEach(function(d){
    var unlocked = tripUnlocked(d);
    html += '<div class="card fac">';
    html +=   '<div class="nm">' + t(d.key)
          +    '<span class="cat">' + fmtTime(d.min * 60) + '</span></div>';
    html +=   '<div class="ds">' + rewardSummary(d) + '</div>';
    if (!unlocked){
      html += '<div class="dl lock">' + tripUnlockText(d) + '</div>';
    }else if (S.trip){
      html += '<button class="facBtn" disabled>' + t('ui_exp_busy') + '</button>';
    }else{
      html += '<button class="facBtn" data-dep="' + d.id + '">' + t('ui_exp_depart') + '</button>';
    }
    html += '</div>';
  });
  html += '</div>';

  el.panelBody.innerHTML = html;
  Array.prototype.forEach.call(el.panelBody.querySelectorAll('[data-dep]'), function(b){
    b.addEventListener('click', function(){
      if (departTrip(b.dataset.dep)) renderExpedPanel();
      else toast(t('ui_exp_busy'));
    });
  });
}

function openTripModal(r){
  modalMode = 'trip';

  el.modalTitle.textContent = t('ui_exp_result');
  var html = '';

  if (r.gold) html += modalRow(t('ui_exp_gold'), t(r.goldId + '_n'), 'gold');
  if (r.injury) html += '<div class="mnote">' + t('ui_exp_injury') + '</div>';

  el.modalBody.innerHTML = html;
  el.modalOk.textContent = t('btn_claim');

  el.modalCancel.hidden = true;
  el.modal.classList.add('show');
  el.modalScrim.classList.add('show');
}

/* ---------- 学徒 ---------- */
function apprPanelHtml(){
  var slots = apprenticeSlots();
  var html = '<div class="spHead">'
    + '<div class="spCell"><span>' + t('ui_appr_inroster') + '</span><b>'
    +   S.apprentices.length + '/' + slots + '</b></div>'
    + '<div class="spCell"><span>' + t('ui_acad_credit') + '</span><b>' + fmt(currentCredit()) + '</b></div>'
    + '</div>';

/* 施法飘字按累计值节流：狂点时合并成一个数字，而不是十条叠在一起 */
var floatAcc = 0, floatAt = 0;
function queueFloat(v){
  floatAcc += v;
  flushFloat(false);
}
function flushFloat(force){
  if (!(floatAcc > 0)) return;
  var ts = now();
  if (!force && ts - floatAt < 200) return;
  floatAt = ts;
  var s = floatAcc;
  floatAcc = 0;
  floatText('+' + fmt(s));
}

/* ---------- 施法：点击月巴 ---------- */
var tapTimes = [], limitToastAt = 0;

function updateCombo(){
  if (comboCount >= 2){
    el.comboN.textContent = comboCount;
    el.combo.classList.add('show');
    el.combo.classList.toggle('hot', comboCount >= G.COMBO_FULL);
  }else{
    el.combo.classList.remove('show');
    el.combo.classList.remove('hot');
  }
}
function rippleAt(x, y){
  var r = el.stage.getBoundingClientRect();
  var d = document.createElement('div');
  d.className = 'ripple';
  d.style.left = (x - r.left) + 'px';
  d.style.top = (y - r.top) + 'px';
  el.stage.appendChild(d);
  setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 660);
}
function onCast(e){
  var ts = now();

  /* 每秒最多计 10 次：超出只给反馈，不给收益 */
  for (var i = tapTimes.length - 1; i >= 0; i--){
    if (ts - tapTimes[i] >= 1000) tapTimes.splice(i, 1);
  }
  var over = tapTimes.length >= G.TAP_MAX_PER_SEC;
  if (!over) tapTimes.push(ts);

  squashBunny();
  var cx = (e && e.clientX) || 0, cy = (e && e.clientY) || 0;
  if (!cx || !cy){
    var b = el.moonba.getBoundingClientRect();
    cx = b.left + b.width / 2;
    cy = b.top + b.height / 2;
  }
  rippleAt(cx, cy);
  SFX.tap();

  if (over){
    if (ts - limitToastAt > 1200){ limitToastAt = ts; toast(t('tip_tap_limit')); }
    return;
  }

  if (ts - comboAt <= G.COMBO_MS) comboCount += 1;
  else comboCount = 1;
  comboAt = ts;
  if (comboCount > num(S.stat.maxCombo)) S.stat.maxCombo = comboCount;

  var gain = castGain();
  if (isFinite(gain) && gain > 0){
    S.mana = num(S.mana) + gain;
    S.stat.casts = (S.stat.casts | 0) + 1;
    ensureDaily();
    S.daily.tap = num(S.daily.tap) + 1;
    queueFloat(gain);
  }
  updateCombo();
  refreshUI();
  scheduleSave();
}

el.moonba.addEventListener('pointerdown', function(e){
  e.preventDefault();
  onCast(e);
});
el.moonba.addEventListener('keydown', function(e){
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onCast(null); }
});

document.addEventListener('keydown', function(e){

});

var PT_MAX = 20;

function ptResize(){
  var c = el.particles; if (!c) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var r = c.getBoundingClientRect();
  PT.w = r.width; PT.h = r.height;
  c.width = Math.round(r.width * dpr);
  c.height = Math.round(r.height * dpr);
  PT.ctx = c.getContext('2d');
  PT.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function ptSpawn(){
  return { x: PT.w * (0.35 + Math.random() * 0.30), y: PT.h * (0.45 + Math.random() * 0.45),
           vy: -(8 + Math.random() * 14), vx: (Math.random() - 0.5) * 8,
           r: 1 + Math.random() * 1.8, a: 0.25 + Math.random() * 0.35, t: 0 };
}
function ptLoop(ts){
  if (!PT.on) return;
  PT.raf = requestAnimationFrame(ptLoop);
  if (ts - PT.last < 33) return;
  var dt = Math.min((ts - PT.last) / 1000, 0.1);
  PT.last = ts;
  var ctx = PT.ctx; if (!ctx) return;
  ctx.clearRect(0, 0, PT.w, PT.h);
  if (PT.list.length < PT_MAX && Math.random() < 0.25) PT.list.push(ptSpawn());
  for (var i = PT.list.length - 1; i >= 0; i--){
    var p = PT.list[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > 4 || p.y < -10){ PT.list.splice(i, 1); continue; }
    var fade = Math.min(1, p.t * 2) * Math.max(0, 1 - p.t / 4);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(124,196,167,' + (p.a * fade).toFixed(3) + ')'; ctx.fill();
  }
}
function startParticles(){
  if (PT.on || S.lowPower) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  ptResize(); PT.on = true; PT.last = 0;
  PT.raf = requestAnimationFrame(ptLoop);
}
function stopParticles(){
  PT.on = false;
  if (PT.raf) cancelAnimationFrame(PT.raf);
  PT.raf = 0;
  if (PT.ctx) PT.ctx.clearRect(0, 0, PT.w, PT.h);
  PT.list = [];
}

/* =========================================================
   PART 10 · 循环
   ========================================================= */
var lastPerf = 0, accEcon = 0, accUi = 0, loopTimer = 0;

function frame(ts){
  if (!lastPerf) lastPerf = ts;
  var dt = (ts - lastPerf) / 1000;
  lastPerf = ts;
  if (document.hidden) return;
  if (dt > 2) dt = 0;
  accEcon += dt; accUi += dt;
  if (accEcon >= G.TICK_MS / 1000){ econStep(accEcon); accEcon = 0; }
  if (accUi >= G.UI_MS / 1000){
    tickDisson();
    if (comboCount > 0 && now() - comboAt > G.COMBO_MS){ comboCount = 0; updateCombo(); }
    if (S.trip && now() >= S.trip.endAt){
      var ti = settleTrip();
      if (ti){
        if (el.modal.classList.contains('show')) toast(t('ui_exp_result'));
        else openTripModal(ti);
      }
    }
    /* 机缘生成 */
    if (!S.jibanGot && S.jibanAt && now() >= S.jibanAt) S.jibanGot = true;
    /* 试炼窗口 */
    if (modalMode === 'trial' && S.trial) updateTrialUI();
    /* 事件触发：弹层或面板开着时先不打断；调试模式不自动弹（自动化测试会被打断） */
    if (!DEBUG && S.eventAt && now() >= S.eventAt && !S.eventCache &&
        !el.modal.classList.contains('show') && !el.panel.classList.contains('show')){
      var ev = fireEvent();
      if (ev) openEventModal(ev);
    }
    flushFloat(false);
    checkAchs();
    refreshUI();
    accUi = 0;
  }
  loopTimer = requestAnimationFrame(frame);
}
function startLoop(){
  lastPerf = 0; accEcon = 0; accUi = 0;
  if (!loopTimer) loopTimer = requestAnimationFrame(frame);
  startParticles();
}
function stopLoop(){
  if (loopTimer) cancelAnimationFrame(loopTimer);
  loopTimer = 0;
  stopParticles();
}

var lastSaveAt = 0;
setInterval(function(){
  if (document.hidden) return;
  if (now() - lastSaveAt >= G.SAVE_MS){ lastSaveAt = now(); persist(); }
}, 1000);

document.addEventListener('visibilitychange', function(){
  if (document.hidden){ persist(); stopLoop(); }
  else {
    lastPerf = 0;
    var off = settleOffline();
    startLoop();
    if (off && off.sec >= G.OFFLINE_MIN_MS / 1000) openOfflineModal(off);
    refreshUI();
  }
});
window.addEventListener('pagehide', persist);
window.addEventListener('beforeunload', persist);
window.addEventListener('resize', function(){ if (PT.on) ptResize(); });

/* =========================================================
   PART 11 · 自测 / 调试
   ========================================================= */
function selftest(){
  var out = [];
  function ok(name, cond){ out.push((cond ? 'PASS ' : 'FAIL ') + name); }

  var snap = JSON.parse(JSON.stringify(S));
  var oldRand = Math.random;

  var vals = [manaPerSec(), spellPerSec(), circleNeed(), rankUpCost(), rankUpRate(), offlineEff()];
  ok('公式全部有限', vals.every(function(v){ return isFinite(v) && !isNaN(v); }));
  ok('魔力速率 > 0', manaPerSec() > 0);
  ok('本环需求 > 0', circleNeed() > 0);
  ok('晋级成功率在 20%~95%', rankUpRate() >= 0.20 - 1e-9 && rankUpRate() <= 0.95 + 1e-9);
  ok('离线效率 ≤ 120%', offlineEff() <= 1.20 + 1e-9);

  S.r = G.REALM_MAX; S.circle = G.CIRCLE_MAX;
  ok('90 环公式有限', isFinite(circleNeed()) && isFinite(spellPerSec()) && circleNeed() > 0);

  S.r = 0; S.circle = 1; S.spell = circleNeed() - 1;
  ok('未满不可铭环', inscribe() === false);
  S.spell = circleNeed();
  ok('满则可铭环', inscribe() === true && S.circle === 2);

  var baseR = 0, baseFocus = 100, N = 3000, hits = 0;
  S.r = baseR; S.circle = G.CIRCLE_MAX; S.mana = 1e15; S.focus = baseFocus;
  S.disson = 0; S.draughtArmed = false; S.spell = circleNeed();
  var exp = rankUpRate();
  for (var i = 0; i < N; i++){
    S.r = baseR; S.circle = G.CIRCLE_MAX; S.mana = 1e15; S.focus = baseFocus;
    S.disson = 0; S.spell = circleNeed();
    var r1 = doRankUp();
    if (r1 && r1.ok) hits++;
  }
  var got = hits / N;
  ok('成功率偏差 <3pp（实测 ' + (got * 100).toFixed(1) + '% / 理论 ' + (exp * 100).toFixed(1) + '%）',
     Math.abs(got - exp) < 0.03);

  S.r = baseR; S.circle = G.CIRCLE_MAX; S.focus = baseFocus; S.disson = 0; S.dissonEndAt = 0;
  S.spell = circleNeed(); S.mana = 1e9;
  var costBefore = rankUpCost(), needBefore = circleNeed(), manaBefore = S.mana;
  Math.random = function(){ return 0.999999; };
  doRankUp();
  Math.random = oldRand;
  ok('失败：咒力回落到 35%', Math.abs(S.spell - needBefore * G.FAIL_SPELL_KEEP) < 1e-6);
  ok('失败：专注 −25', Math.abs(S.focus - (baseFocus + G.FOCUS_FAIL)) < 1e-6);
  ok('失败：杂念 +1', S.disson === 1);
  ok('失败：只损失 50% 魔力', Math.abs((manaBefore - S.mana) - costBefore * G.FAIL_MANA_LOSS) < 1e-6);

  S.r = baseR; S.circle = G.CIRCLE_MAX; S.spell = circleNeed(); S.mana = 1e9;
  S.focus = baseFocus; S.disson = 0;
  Math.random = function(){ return 0; };
  var okRes = doRankUp();
  Math.random = oldRand;
  ok('成功：阶位 +1、回到第 1 环、咒力清零',
     !!okRes && okRes.ok && S.r === baseR + 1 && S.circle === 1 && S.spell === 0);

  S = JSON.parse(JSON.stringify(snap));
  refreshUI();

  persist();
  var back = loadSave();
  ok('存档往返可读', !!back && back.r === snap.r && back.circle === snap.circle);

  var uiText = document.body.innerText || '';
  ok('UI 无 NaN/undefined/Infinity', !/(NaN|undefined|Infinity)/.test(uiText));

  var pass = out.filter(function(s){ return s.indexOf('PASS') === 0; }).length;
  var txt = '[' + pass + '/' + out.length + ']';
  console.log('[arcane selftest] ' + txt + '\n' + out.join('\n'));
  toast(txt + ' selftest');
  return out;
}

if (DEBUG){
  window.__cult = { S: S, G: G, REALMS: REALMS, ACADEMIES: ACADEMIES, TOWER: TOWER,
                    econ: { mana: manaPerSec, spell: spellPerSec, need: circleNeed,
                            cost: rankUpCost, rate: rankUpRate, off: offlineEff },
                    brk: { bd: rankUpBreakdown, do: doRankUp, can: canRankUp,
                           open: openRankUpModal, close: closeRankUpModal },
                    cast: { gain: castGain, combo: function(){ return comboCount; },
                            reset: function(){ comboCount = 0; comboAt = 0; tapTimes.length = 0; updateCombo(); } },
                    off: { settle: settleOffline, sim: simulateOffline, eff: offlineEff,
                           backdate: function(sec){ S.ts = Date.now() - num(sec) * 1000; } },
                    acad: { unlocked: acadUnlocked, unlockText: acadUnlockText, cost: transferCost,
                            cd: transferCDLeft, can: canTransfer, transfer: doTransfer,
                            rankOf: rankOf, gain: gainCredit, panel: renderAcademyPanel },
                    mood: { addDisson: addDisson, tick: tickDisson,
                            dissonMod: dissonMod, focusMod: focusMod, breakdown: rankUpBreakdown },
                    step: econStep, inscribe: inscribe,
                    setGrowth: function(x){ G.SPELL_GROW = x; buildRealms(); return REALMS[9].spell; },
                    tower: { cost: towerCost, up: upgradeTower, unlocked: towerUnlocked,
                             rateWith: towerRateWith, panel: renderTowerPanel },
                    spell: { all: SPELLS, byId: spellById, cost: drawCost, draw: doDraw,
                             one: drawOne, equip: equipSpell, unequip: unequipSlot,
                             upgrade: upgradeSpell, pct: spellPct, slots: equipSlotCount,
                             mult: spellMult },
                    potion: { all: POTIONS, byId: potionById, cost: brewCost, brew: brewPotion,
                              use: usePotion, pct: potionPct, tick: tickBuffs,
                              effect: potionEffectPct, dur: potionDurationMs },
                    appr: { roles: ROLES, qualities: QUALITIES, slots: apprenticeSlots,
                            recruit: recruitApprentice, up: upgradeApprentice,
                            leave: dismissApprentice, cost: recruitCost,
                            upCost: apprUpgradeCost, pct: apprPct,
                            forager: foragerRate, focusRegen: apprFocusRegen },
                    trip: { all: DUNGEONS, byId: dungeonById, unlocked: tripUnlocked,
                            depart: departTrip, settle: settleTrip, ratio: tripRatio,
                            dur: tripDurationMs, injury: injuryMul },
                    event: { all: EVENTS, byId: eventById, pick: pickEvent, fire: fireEvent,
                             apply: applyEventEffects, open: openEventModal,
                             canAfford: canAffordEffects, reset: function(){ S.eventSeen = []; } },
                    jiban: { claim: claimJiban, schedule: scheduleJiban,
                             at: function(ms){ S.jibanAt = Date.now() + ms; } },
                    daily: { all: DAILY, progress: dailyProgress, done: dailyDone,
                             claim: claimDaily, ensure: ensureDaily, key: dayKeyNow,
                             reset: function(){ S.daily = {key: dayKeyNow(), tap:0, dungeon:0, brk:0, sit:0, got:[]}; } },
                    trial: { realms: TRIAL_REALMS, start: startTrial, click: clickBolt,
                             state: trialBoltState, ready: trialReady, finish: finishTrial,
                             commit: commitRankUp, open: openTrialModal,
                             setAt: function(ms){ if (S.trial) S.trial.at = Date.now() - ms; } },
                    star: { all: INSIGHTS, lv: starLv, pct: starPct, buy: buyInsight,
                            pts: ascendPoints, can: canAscend, ascend: doAscend, panel: starPanelHtml },
                    ach: { all: ACHS, has: hasAch, check: checkAchs,
                           codex: markCodex, groups: CODEX_GROUPS },
                    selftest: selftest, save: persist, load: loadSave };
}

/* =========================================================
   PART 12 · 启动
   ========================================================= */
var INTRO_KEYS = ['intro_1','intro_2','intro_3','intro_4','intro_5'];

function showIntro(){
  el.introLines.innerHTML = INTRO_KEYS.map(function(k){ return '<p>' + t(k) + '</p>'; }).join('');
  el.introBtn.textContent = t('intro_btn');
  el.intro.classList.add('show');
}
function closeIntro(){
  if (!el.intro.classList.contains('show')) return;
  el.intro.classList.remove('show');
  S.seenIntro = true;
  scheduleSave();
}
el.intro.addEventListener('click', closeIntro);
el.introBtn.addEventListener('click', function(e){ e.stopPropagation(); closeIntro(); });

function boot(){
  document.title = t('ui_title');
  el.hudTitle.textContent = t('ui_title');
  el.btnMute.setAttribute('aria-label', t('btn_mute'));
  el.btnLow.setAttribute('aria-label', t('btn_lowpower'));
  el.panelClose.setAttribute('aria-label', t('btn_close'));
  /* 首次启动按系统偏好选配色，之后以存档为准 */
  if (S.theme !== 'light' && S.theme !== 'dark'){
    S.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ? 'dark' : 'light';
  }
  applyTheme(S.theme);
  ensureDaily();
  if (!S.eventAt) scheduleEvent();
  if (!S.jibanAt) scheduleJiban();
  markCodex(S.academy);
  renderStatic();
  applyAcadColor();
  renderMute();
  /* 先结远征（静默），再结离线；两者都有时合并到离线弹窗里 */
  var tripInfo = settleTrip();
  var off = settleOffline();
  refreshUI();
  startLoop();
  if (off && off.sec >= G.OFFLINE_MIN_MS / 1000) openOfflineModal(off, tripInfo);
  else if (tripInfo) openTripModal(tripInfo);
  /* 离线期间最多缓存 1 条事件，回来再选 */
  else if (S.eventCache){
    var cached = eventById(S.eventCache);
    if (cached) openEventModal(cached);
    else S.eventCache = null;
  }
  if (!S.seenIntro && !DEBUG && !SELFTEST) showIntro();
  /* 刷新时若试炼还在进行：过了 20 秒就按已记录的雷数直接结算，不重抽 */
  if (S.trial){
    if (trialReady()){
      var tr = finishTrial();
      if (tr) toast(tr.ok ? t('tip_break_ok') : t('tip_break_no'));
    }else{
      openTrialModal();
    }
  }
  if (SELFTEST) setTimeout(selftest, 200);
}

boot();

})();
