<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#031019">
<title>黄金矿工 · 矿工月巴</title>
<style>
  :root{
    --bg:#031019; --bg2:#061c26; --panel:#071f2a; --panel2:#082430;
    --line:rgba(90,222,238,.22); --line2:rgba(99,234,247,.48);
    --text:#ddf6fb; --dim:#7fa7b7;
    --red:#ff5468; --accent:#46e6f2; --accent2:#b0f9ff; --green:#4fd8a8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);}
  body{font-family:"SF Mono","Cascadia Mono",Consolas,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;overscroll-behavior:none;}
  /* 全屏扫描线 + 暗角：静态单层，低功耗下关闭 */
  body::before{content:'';position:fixed;inset:0;z-index:9990;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(120,232,255,.028) 0 1px,transparent 1px 3px);}
  body::after{content:'';position:fixed;inset:0;z-index:9989;pointer-events:none;
    background:radial-gradient(120% 82% at 50% 4%,transparent 46%,rgba(0,9,15,.55) 100%);}
  body.lp::before,body.lp::after{display:none;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));
    background:radial-gradient(74% 58% at 50% 36%,#082430,#020a10 78%);}
  #app{display:flex;flex-direction:column;align-items:center;gap:6px;}

  /* ---------- 顶部 HUD ---------- */
  #hud{display:flex;flex-direction:column;gap:4px;width:100%;}
  #hud .cells{display:flex;gap:6px;width:100%;}
  #hud .cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:5px 4px 6px;color:var(--text);
    background:linear-gradient(180deg,rgba(8,34,46,.88),rgba(4,18,26,.94));
    border:1px solid var(--line);border-left:2px solid var(--line2);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
    box-shadow:inset 0 0 18px rgba(70,230,242,.06);}
  #hud .lb{font-size:9px;font-weight:800;letter-spacing:1.4px;color:var(--dim);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  #hud .num{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2;
    letter-spacing:1px;color:var(--accent2);text-shadow:0 0 12px rgba(70,230,242,.42);}
  #hud .cell.time .num{font-size:19px;}
  #hud .cell.time .num.warn{color:var(--red);text-shadow:0 0 14px rgba(255,84,104,.7);
    animation:warnPulse .9s ease-in-out infinite;}
  @keyframes warnPulse{0%,100%{opacity:1}50%{opacity:.42}}
  #hud .cell.time .num.flash{animation:flash .5s ease-out;}
  @keyframes flash{0%{transform:scale(1);color:var(--green)}45%{transform:scale(1.22);color:var(--green)}100%{transform:scale(1)}}
  .tbar{height:3px;background:rgba(70,230,242,.1);box-shadow:inset 0 0 0 1px rgba(70,230,242,.16);}
  .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#19c8dc,#7df6ff);
    box-shadow:0 0 10px rgba(70,230,242,.45);transition:width .12s linear;}
  .tbar.warn i{background:linear-gradient(90deg,#ff5468,#ff8b98);box-shadow:0 0 10px rgba(255,84,104,.5);}

  /* ---------- 矿区 ---------- */
  #frame{position:relative;overflow:hidden;border-radius:3px;background:#04141b;
    box-shadow:0 0 0 1px rgba(70,230,242,.26),0 0 46px rgba(70,230,242,.07),0 22px 60px rgba(0,0,0,.7);}
  #cv{display:block;width:100%;height:100%;}
  #domLayer{position:absolute;left:0;top:0;width:480px;height:720px;transform-origin:top left;pointer-events:none;}

  #minerBox{position:absolute;left:208px;top:40px;width:64px;height:64px;}
  #minerTilt{width:100%;height:100%;position:relative;transform-origin:50% 100%;will-change:transform;}
  #minerTilt .av{width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,.5));}
  #minerTilt .av img,#minerTilt .av svg{width:100%;height:100%;object-fit:contain;}
  /* 矿帽：暗金属帽体 + 青蓝描边，和 HUD 面板同族 */
  .helmet{position:absolute;left:50%;top:-6px;width:34px;height:19px;margin-left:-17px;pointer-events:none;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.6));}
  .helmet .dome{position:absolute;left:0;top:0;width:34px;height:15px;border-radius:17px 17px 3px 3px;
    background:
      repeating-linear-gradient(0deg,rgba(140,246,255,.07) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,#2f7e92 0%,#145261 38%,#0a2833 74%,#071f2a 100%);
    border:1px solid rgba(99,234,247,.85);border-bottom:0;
    box-shadow:inset 0 1px 0 rgba(210,252,255,.6),inset 0 -3px 7px rgba(0,8,12,.78),
      0 0 8px rgba(70,230,242,.22);}
  .helmet .dome::after{content:'';position:absolute;left:50%;bottom:2px;width:9px;height:2px;margin-left:-4.5px;
    background:rgba(120,232,255,.5);box-shadow:0 0 5px rgba(70,230,242,.5);}
  .helmet .brim{position:absolute;left:-5px;top:13px;width:44px;height:5px;
    background:linear-gradient(180deg,#2b6b7d,#0a2937 60%,#061a24);
    border:1px solid rgba(99,234,247,.55);border-top:0;border-radius:0 0 2px 2px;
    clip-path:polygon(0 0,100% 0,100% 56%,calc(100% - 6px) 100%,0 100%);
    box-shadow:0 1px 0 rgba(70,230,242,.32),0 2px 5px rgba(0,0,0,.45);}
  .helmet .lamp{position:absolute;left:50%;top:3px;width:6px;height:6px;margin-left:-3px;border-radius:50%;
    background:#eaffff;border:1px solid rgba(99,234,247,.9);
    box-shadow:0 0 4px 1px rgba(140,246,255,.9),0 0 10px 3px rgba(70,230,242,.38);}
  #minerName{position:absolute;left:50%;top:-26px;transform:translateX(-50%);white-space:nowrap;
    padding:2px 7px;border:1px solid var(--line);border-left:2px solid var(--line2);border-radius:2px;
    font-size:9px;font-weight:800;letter-spacing:1px;color:var(--accent2);
    background:linear-gradient(180deg,rgba(8,34,46,.9),rgba(4,18,26,.95));
    box-shadow:0 0 10px rgba(70,230,242,.18);}

  /* 暂停按钮：与 HUD 同族的切角冷光块 */
  #pauseBtn{position:absolute;right:10px;top:10px;width:34px;height:34px;z-index:4;display:none;
    align-items:center;justify-content:center;padding:0;font-family:inherit;font-size:13px;line-height:1;
    color:var(--accent2);cursor:pointer;
    background:linear-gradient(180deg,rgba(8,34,46,.9),rgba(4,18,26,.95));
    border:1px solid var(--line);border-left:2px solid var(--line2);border-radius:2px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
    box-shadow:0 0 12px rgba(70,230,242,.16);}
  #pauseBtn.on{display:flex;}
  #pauseBtn:active{transform:scale(.94);}
  #pauseBtn::before{content:'❚❚';letter-spacing:1px;}

  /* 番茄金像 */
  #statueBox{position:absolute;left:0;top:0;width:60px;height:60px;display:none;
    filter:drop-shadow(0 0 9px rgba(232,185,63,.8)) drop-shadow(0 3px 6px rgba(0,0,0,.45));}
  #statueBox img{width:100%;height:100%;object-fit:contain;
    filter:sepia(1) saturate(2.8) hue-rotate(2deg) brightness(1.06) contrast(1.05);}
  #statueBox svg{width:100%;height:100%;}
  #statueBox .ring{position:absolute;inset:-5px;border-radius:50%;
    box-shadow:inset 0 0 0 2px rgba(255,243,176,.6),0 0 16px rgba(232,185,63,.5);}
  #statueBox::after{content:'';position:absolute;inset:-8%;border-radius:50%;pointer-events:none;
    background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.9) 47%,rgba(255,243,176,.55) 54%,transparent 66%);
    background-size:260% 100%;mix-blend-mode:screen;animation:sweep 2.6s linear infinite;}
  @keyframes sweep{0%{background-position:190% 0}100%{background-position:-90% 0}}
  body.lp #statueBox::after{display:none;}
  body.lp #statueBox{filter:drop-shadow(0 0 6px rgba(232,185,63,.6));}

  /* 横幅 / 提示 */
  #banner{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;
    font-size:26px;font-weight:900;letter-spacing:4px;color:var(--accent2);
    text-shadow:0 0 18px rgba(70,230,242,.8),0 2px 0 #04141b;opacity:0;transform:scale(.9);}
  #banner.show{animation:bannerIn 1.8s ease-out;}
  @keyframes bannerIn{0%{opacity:0;transform:scale(.7)}18%{opacity:1;transform:scale(1.06)}30%{transform:scale(1)}
    78%{opacity:1}100%{opacity:0;transform:scale(1.02)}}
  #hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;pointer-events:none;
    font-size:11px;font-weight:700;letter-spacing:1px;color:rgba(127,167,183,.8);transition:opacity .35s;}
  #hint.hide{opacity:0;}

  /* ---------- 面板 ---------- */
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:16px;z-index:5;
    background:
      repeating-linear-gradient(0deg,rgba(110,226,240,.025) 0 1px,transparent 1px 4px),
      radial-gradient(90% 70% at 50% 42%,rgba(6,42,56,.55),rgba(2,9,14,.88));}
  #overlay.show{display:flex;}
  body.lp #overlay{background:rgba(2,9,14,.9);}
  .panel{position:relative;width:min(94%,360px);max-height:100%;overflow:auto;padding:20px 18px 16px;
    text-align:center;color:var(--text);border-radius:3px;
    background:
      linear-gradient(90deg,var(--accent),rgba(70,230,242,0) 38%) left top/100% 1px no-repeat,
      linear-gradient(180deg,rgba(8,36,48,.985),rgba(3,14,21,.995));
    border:1px solid var(--line2);
    box-shadow:0 26px 80px rgba(0,0,0,.65),inset 0 0 40px rgba(70,230,242,.05);}
  /* 四角括号：单伪元素 8 层背景，静态绘制 */
  .panel::before{content:'';position:absolute;inset:8px;pointer-events:none;opacity:.5;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left top/2px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/2px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/2px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/2px 14px no-repeat;}
  .panel .kicker{font-size:9px;font-weight:900;letter-spacing:4px;color:var(--accent);opacity:.85;}
  .panel .kicker::before{content:'// ';} .panel .kicker::after{content:' //';}
  .panel .pt{font-size:24px;font-weight:900;letter-spacing:6px;color:var(--accent2);margin:4px 0 2px;
    text-shadow:0 0 18px rgba(70,230,242,.5),0 0 46px rgba(70,230,242,.22);}
  .panel .av{width:96px;height:96px;margin:14px auto 0;position:relative;}
  .panel .av::before{content:'';position:absolute;inset:-9px;border-radius:50%;
    border:1px solid var(--line2);
    background:radial-gradient(circle,rgba(70,230,242,.16),rgba(70,230,242,.02) 68%,transparent 70%);
    box-shadow:inset 0 0 24px rgba(70,230,242,.12);}
  .panel .av .inner{position:relative;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;}
  .panel .av .inner img,.panel .av .inner svg{width:100%;height:100%;object-fit:contain;}
  .panel .av .helmet{top:-8px;width:60px;height:33px;margin-left:-30px;transform:none;}
  .panel .av .helmet .dome{width:60px;height:26px;border-radius:30px 30px 6px 6px;}
  .panel .av .helmet .brim{left:-6px;top:23px;width:72px;height:8px;border-radius:4px;}
  .panel .av .helmet .lamp{top:5px;width:10px;height:10px;margin-left:-5px;}
  .panel .nm{display:inline-block;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--accent2);
    margin-top:13px;padding:3px 10px;border:1px solid var(--line);
    background:rgba(70,230,242,.06);}
  .panel .qt{font-size:11px;line-height:1.65;color:var(--dim);margin-top:9px;min-height:32px;
    text-align:left;padding:7px 10px;border-left:2px solid var(--line2);background:rgba(70,230,242,.04);}
  .panel .st{font-size:10px;letter-spacing:.5px;color:var(--dim);margin-top:10px;line-height:1.6;}
  .panel .rows{margin-top:12px;}
  .panel .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 2px;
    border-bottom:1px dashed rgba(90,222,238,.16);}
  .panel .row:last-child{border-bottom:0;}
  .panel .row span{color:var(--dim);}
  .panel .row b{font-weight:900;font-variant-numeric:tabular-nums;color:var(--accent2);}
  .panel .badge{display:inline-block;margin-top:10px;padding:3px 10px;
    background:var(--red);color:#210409;font-size:10px;font-weight:900;letter-spacing:2px;
    box-shadow:0 0 14px rgba(255,84,104,.45);animation:pop .6s ease-out;
    clip-path:polygon(0 0,100% 0,100% 100%,6px 100%,0 calc(100% - 6px));}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
  .panel .btnw{display:flex;gap:8px;margin-top:16px;}
  .panel button{flex:1;height:44px;border:1px solid var(--accent);border-radius:2px;
    font-family:inherit;font-size:13px;font-weight:900;letter-spacing:2px;cursor:pointer;color:#eafeff;
    background:linear-gradient(180deg,rgba(70,230,242,.24),rgba(24,140,164,.34));
    box-shadow:0 0 22px rgba(70,230,242,.18),inset 0 0 18px rgba(70,230,242,.12);
    transition:transform .12s,background .12s,box-shadow .12s;}
  .panel button:hover{background:linear-gradient(180deg,rgba(70,230,242,.34),rgba(24,140,164,.44));
    box-shadow:0 0 26px rgba(70,230,242,.26),inset 0 0 18px rgba(70,230,242,.16);}
  .panel button:active{transform:scale(.97);}

  #foot{font-size:10px;letter-spacing:1px;color:var(--dim);opacity:.8;height:12px;}

  /* ---------- 连击 / 道具状态条（画布逻辑坐标） ---------- */
  .gmchip{position:absolute;left:12px;top:12px;display:none;padding:3px 8px;font-size:10px;font-weight:900;
    letter-spacing:1px;color:var(--accent2);white-space:nowrap;
    background:rgba(4,18,26,.74);border:1px solid var(--line2);border-left-width:2px;
    box-shadow:0 0 12px rgba(70,230,242,.18);}
  #statusChip{left:auto;right:12px;color:#ffe9a8;border-color:rgba(232,185,63,.55);
    box-shadow:0 0 12px rgba(232,185,63,.18);}
  .gmchip.show{display:block;}
  .gmchip.pop{animation:chipPop .26s ease-out;}
  @keyframes chipPop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

  /* 成就提示：独立于关卡横幅，避免互相覆盖 */
  #achToast{position:absolute;left:50%;top:14px;z-index:6;pointer-events:none;
    transform:translate(-50%,-8px);opacity:0;transition:opacity .24s,transform .24s;
    padding:5px 12px;font-size:11px;font-weight:900;letter-spacing:1px;color:#04141b;white-space:nowrap;
    background:linear-gradient(180deg,#b0f9ff,#46e6f2);border-radius:2px;
    box-shadow:0 0 22px rgba(70,230,242,.55);}
  #achToast.show{opacity:1;transform:translate(-50%,0);}

  /* 道具到手卡片：单独一条，避免和成就 / 关卡横幅互相覆盖 */
  #itemToast{position:absolute;left:50%;top:44px;z-index:7;pointer-events:none;
    display:flex;align-items:center;gap:9px;max-width:min(88%,330px);
    padding:8px 12px;text-align:left;
    transform:translate(-50%,-10px) scale(.94);opacity:0;
    transition:opacity .26s,transform .26s;
    background:linear-gradient(180deg,rgba(10,34,42,.97),rgba(3,13,19,.98));
    border:1px solid rgba(232,185,63,.62);border-left:3px solid #e8b93f;border-radius:2px;
    box-shadow:0 10px 30px rgba(0,0,0,.62),0 0 22px rgba(232,185,63,.22);}
  #itemToast.show{opacity:1;transform:translate(-50%,0) scale(1);}
  #itemToast .ii{font-size:24px;line-height:1;filter:drop-shadow(0 0 8px rgba(232,185,63,.75));}
  #itemToast .itt{font-size:8px;font-weight:900;letter-spacing:2px;color:#e8b93f;}
  #itemToast .inm{font-size:13px;font-weight:900;letter-spacing:1px;color:#eafeff;margin-top:1px;}
  #itemToast .ids{font-size:9px;line-height:1.5;color:var(--dim);margin-top:2px;}

  /* 金像全屏金色闪光 */
  #goldFlash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 54%,rgba(255,248,222,.95),rgba(255,214,106,.5) 34%,rgba(232,185,63,0) 70%);}
  #goldFlash.show{animation:goldFlash .62s ease-out;}
  @keyframes goldFlash{0%{opacity:0;transform:scale(.6)}16%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(1.28)}}
  body.lp #goldFlash{display:none;}

  /* 面板内的成就 / 图鉴列表 */
  .panel .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
  .panel .gcell{position:relative;padding:6px 3px 4px;border:1px solid rgba(90,222,238,.16);
    background:rgba(70,230,242,.04);}
  .panel .gcell .ga{width:100%;aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
  .panel .gcell .ga img,.panel .gcell .ga svg{width:100%;height:100%;object-fit:contain;}
  .panel .gcell .gn{font-size:8px;line-height:1.3;color:var(--dim);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .panel .gcell .gc{position:absolute;right:2px;top:1px;font-size:8px;font-weight:900;color:var(--accent2);}
  .panel .alist{margin-top:10px;text-align:left;}
  .panel .aitem{display:flex;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px dashed rgba(90,222,238,.14);}
  .panel .aitem:last-child{border-bottom:0;}
  .panel .aitem .dot{width:9px;height:9px;flex:0 0 9px;border:1px solid var(--line2);transform:rotate(45deg);}
  .panel .aitem.on .dot{background:var(--accent);box-shadow:0 0 8px rgba(70,230,242,.7);}
  .panel .aitem .an{font-size:11px;font-weight:800;color:var(--text);}
  .panel .aitem .ad{font-size:9px;color:var(--dim);margin-top:1px;}
  .panel .aitem.off .an,.panel .aitem.off .ad{opacity:.45;}
  .panel .btnw.half button{flex:1;}
  .panel button.ghost{background:rgba(70,230,242,.06);border-color:var(--line);color:var(--dim);}
  .panel .mode{font-size:9px;letter-spacing:2px;color:var(--accent);opacity:.85;margin-top:6px;}

  /* 横屏窄高：HUD 改侧栏，给矿区留满高度 */
  @media (orientation:landscape) and (max-height:560px){
    #app{flex-direction:row;align-items:stretch;}
    #hud{width:126px;flex:0 0 126px;}
    #hud .cells{flex-direction:column;height:100%;}
    #hud .cell{flex:1;}
    #foot{display:none;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="app">
    <div id="hud">
      <div class="cells">
        <div class="cell"><span class="lb" id="lbLv">第 1 关</span><span class="num" id="numTar">0/450</span></div>
        <div class="cell time"><span class="lb" id="lbTime">时间</span><span class="num" id="numTime">60</span></div>
        <div class="cell"><span class="lb" id="lbScore">得分</span><span class="num" id="numScore">0</span></div>
      </div>
      <div class="tbar" id="tbar"><i id="timeBar"></i></div>
    </div>
    <div id="frame">
      <canvas id="cv"></canvas>
      <div id="domLayer">
        <div id="comboChip" class="gmchip"></div>
        <div id="statusChip" class="gmchip"></div>
        <div id="statueBox"><img id="statueImg" alt=""><span class="ring"></span></div>
        <div id="minerBox">
          <div id="minerTilt"><div class="av" id="minerAv"></div><div class="helmet"><span class="dome"></span><span class="brim"></span><span class="lamp"></span></div></div>
          <div id="minerName"></div>
        </div>
      </div>
      <button id="pauseBtn" type="button" aria-label="暂停"></button>
      <div id="goldFlash"></div>

const POOL_BY_ID={};
POOL.forEach(function(p){ if(!POOL_BY_ID[p.id]) POOL_BY_ID[p.id]=p; });

/* 场上的「石块」换成随机月巴：仅使用有外链立绘的条目 */
const DIRT_POOL=POOL.filter(function(p){ return !!p.img; });
const IMG_CACHE={};
function bannyImage(id){
  const p=POOL_BY_ID[id];
  if(!p||!p.img) return null;
  let im=IMG_CACHE[id];
  if(!im){
    im=new Image(); im.decoding='async';
    // 图片晚到时重烘焙一次静态矿点，避免一直停在石块占位图
    im.onload=function(){ oreDirty=true; };
    // 加载失败也标脏一次，让静态层回落到矢量占位，不再等图
    im.onerror=function(){ oreDirty=true; };
    im.src=p.img;
    IMG_CACHE[id]=im;
  }
  return (im.complete&&im.naturalWidth>0)?im:null;
}

const LANG=(function(){
  let q='';
  try{ q=(new URLSearchParams(location.search).get('lang')||'').toLowerCase(); }catch(e){}
  if(q==='zh'||q==='en'||q==='ja'||q==='ko') return q;
  try{
    const raw=JSON.parse(localStorage.getItem(MAIN_KEY)||'null');
    const l=raw&&raw.lang;
    if(l==='zh'||l==='en'||l==='ja'||l==='ko') return l;
  }catch(e){}
  const n=String((navigator&&navigator.language)||'').toLowerCase();
  if(n.indexOf('ja')===0) return 'ja';
  if(n.indexOf('ko')===0) return 'ko';
  if(n.indexOf('en')===0) return 'en';
  return 'zh';
})();

function loadSave(){
  const d={v:2,best:0,bestLv:0,plays:0,miners:{},statues:0,last:null,totalOres:0,ach:{},daily:{key:'',best:0,plays:0,rewarded:''}};
  try{
    const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(!raw||typeof raw!=='object') return d;
    d.best=Math.max(0,parseInt(raw.best,10)||0);
    d.bestLv=Math.max(0,parseInt(raw.bestLv,10)||0);
    d.plays=Math.max(0,parseInt(raw.plays,10)||0);
    d.statues=Math.max(0,parseInt(raw.statues,10)||0);
    d.totalOres=Math.max(0,parseInt(raw.totalOres,10)||0);
    if(raw.miners&&typeof raw.miners==='object'){
      for(const k in raw.miners){ if(POOL_BY_ID[k]) d.miners[k]=Math.max(0,parseInt(raw.miners[k],10)||0); }
    }
    if(raw.ach&&typeof raw.ach==='object'){
      for(const a of ACHS){ if(raw.ach[a.id]) d.ach[a.id]=1; }
    }
    if(raw.daily&&typeof raw.daily==='object'){
      d.daily.key=String(raw.daily.key||'');
      d.daily.best=Math.max(0,parseInt(raw.daily.best,10)||0);
      d.daily.plays=Math.max(0,parseInt(raw.daily.plays,10)||0);
      d.daily.rewarded=String(raw.daily.rewarded||'');
    }
    if(typeof raw.last==='string'&&POOL_BY_ID[raw.last]) d.last=raw.last;
  }catch(e){}
  return d;
}

/* 隧道通行证不可叠加：旅行仓库或行囊里已有，就不再发放 */
function hasTicket(){
  const m=readMain();
  const tr=m&&m.travel;
  if(!tr) return false;
  const n=(tr.wh&&tr.wh.goldletter)||0;
  const inBag=(tr.bag||[]).some(function(x){ return x&&x.k==='goldletter'; });
  return n>0||inBag;
}
function collectedIds(){
  const m=readMain(); if(!m) return [];
  const out=[];
  ['collection','collection2','collection3'].forEach(function(k){
    const c=m[k]||{};
    for(const id in c){
      const n=(c[id]&&c[id].count)||0;
      if(n>0&&POOL_BY_ID[id]) out.push(id);
    }
  });
  return out;
}
/* 矿工池：只收有外链立绘的月巴，没有立绘的一律不出场 */
function hasArt(id){
  const p=POOL_BY_ID[id];
  return !!(p&&p.img);
}
function minerPool(){
  const owned=collectedIds().filter(hasArt);
  const set={};
  owned.forEach(function(id){ set[id]=1; });
  if(owned.length<8){
    POOL.forEach(function(p){ if(p.img&&p.r<=2) set[p.id]=1; });
  }
  if(!Object.keys(set).length){
    // 极端兜底：基础池也没有可用立绘时，退回全部有立绘的月巴
    POOL.forEach(function(p){ if(p.img) set[p.id]=1; });
  }
  return Object.keys(set);
}
function pickMiner(){
  const pool=minerPool();
  let list=pool;
  if(pool.length>1&&save.last) list=pool.filter(function(id){ return id!==save.last; });
  if(!list.length) list=pool;
  const id=list[Math.floor(RNG()*list.length)];
  save.last=id;
  return POOL_BY_ID[id]||POOL[0];
}
/* 图鉴只在真正开局后记录；仅展示/刷新首页不计入 */

  if(!id||!POOL_BY_ID[id]) return;
  save.miners[id]=(save.miners[id]||0)+1;
}

/* ================= 随机数（每日挑战用固定种子） ================= */
let RNG=Math.random;
function seedRng(seed){
  let s=(seed>>>0)||1;
  RNG=function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
}
function resetRng(){ RNG=Math.random; }
function dailyKey(){
  const d=new Date();
  return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function hashNum(n){
  const str=String(n); let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=(h*16777619)>>>0; }
  return h||1;
}

/* ================= 工具 ================= */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rand(a,b){ return a+RNG()*(b-a); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
function shade(hex,amt){
  try{
    const n=parseInt(hex.slice(1),16);
    const r=clamp((n>>16)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }catch(e){ return hex; }
}

    case 'drop':   return '<path d="M20 7 C26 15 29 20 29 25 A9 9 0 1 1 11 25 C11 20 14 15 20 7 Z" '+f+' '+s+'/>';
    case 'star':   return '<path d="M20 8 L23.6 16.8 L32.6 17.2 L25.6 22.9 L28.4 31.4 L20 26.6 L11.6 31.4 L14.4 22.9 L7.4 17.2 L16.4 16.8 Z" '+f+' '+s+'/>';

function bannySVG(p){

  const ex1=p.shape==='tall'?11:p.shape==='wide'?12:10, ex2=30-ex1;

let AC=null;
const muted=!!mainSave.muted;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function tone(freq,dur,type,vol,delay){
  if(muted) return;
  const a=ac(); if(!a) return;
  try{
    const t0=a.currentTime+(delay||0);
    const o=a.createOscillator(), g=a.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(vol||0.08,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}

/* ================= 生成关卡 ================= */
function canPlace(x,y,r){
  if(x<MINE.x0+r||x>MINE.x1-r||y<MINE.y0+r||y>MINE.y1-r) return false;
  const dx=x-PIVOT.x, dy=y-PIVOT.y;
  if(Math.sqrt(dx*dx+dy*dy)<110+r) return false;
  for(let i=0;i<gm.ores.length;i++){
    const o=gm.ores[i];
    const ddx=x-o.x, ddy=y-o.y, rr=o.r+r+4;
    if(ddx*ddx+ddy*ddy<rr*rr) return false;
  }
  return true;
}
function makeOre(kind,x,y,r){
  const c=ORE[kind];
  /* 拉起速度 = 基准 / 重量 × 尺寸系数：同种番茄越大越沉，石头最拖沓 */
  const refR=(c.min+c.max)/2;
  const sizeF=Math.pow(refR/Math.max(1,r), 1.2);
  const pull=Math.max(CARRY_MIN, (CARRY_BASE/Math.max(0.5,c.weight))*sizeF);
  const o={kind:kind, x:x, y:y, r:r, score:c.score, weight:c.weight, bonus:c.bonus||0,
          pull:pull, attached:false, seed:RNG()*Math.PI*2};
  // 石块随机抽取一位有外链立绘的月巴，并提前预热图片
  if(kind==='dirt'&&DIRT_POOL.length){
    const p=DIRT_POOL[Math.floor(RNG()*DIRT_POOL.length)];
    o.imgId=p.id;
    bannyImage(p.id);
  }
  return o;
}
function tryPlace(kind){
  const c=ORE[kind];
  for(let i=0;i<70;i++){
    const r=rand(c.min,c.max);
    const x=rand(MINE.x0+r,MINE.x1-r);
    const y=rand(MINE.y0+r,MINE.y1-r);
    if(canPlace(x,y,r)){ const o=makeOre(kind,x,y,r); gm.ores.push(o); return o; }
  }
  return null;
}
function placeStatue(){
  for(let i=0;i<220;i++){
    const r=30;
    const x=rand(80,390), y=rand(400,620);
    if(canPlace(x,y,r)){ const o=makeOre('statue',x,y,r); gm.ores.push(o); return o; }
  }
  return null;
}
function genOres(lv){
  gm.ores=[]; gm.statueOre=null;
  if(lv%3===0) gm.statueOre=placeStatue();   // 每 3 关保底 1 座，先放避免被挤掉
  // 每关 1 个道具（炸药 / 马达 / 矿灯），第 2 关起偶尔混进一颗腐烂番茄
  tryPlace(['bomb','glue','lamp'][Math.floor(RNG()*3)]);
  if(lv>=2&&RNG()<0.45) tryPlace('rot');
  const n=Math.min(32, 18+2*(lv-1));
  const dirtPct=Math.min(0.26, 0.14+Math.max(0,lv-3)*0.015);
  const base={small:36, mid:26, big:14, gem:4, clock:3};
  let sum=0; for(const k in base) sum+=base[k];
  const scale=(1-dirtPct)/sum;
  const table=[];
  for(const k in base) table.push([k, base[k]*scale]);
  table.push(['dirt', dirtPct]);
  const pick=function(){
    let rnd=RNG(), acc=0;
    for(let i=0;i<table.length;i++){ acc+=table[i][1]; if(rnd<=acc) return table[i][0]; }
    return 'small';
  };
  for(let i=0;i<n;i++) tryPlace(pick());
  ensureValue();
}
/* 保底：场上总价值不足以覆盖目标时，把土块换成中/大番茄 */
function ensureValue(){
  const need=gm.target*1.2;
  let sum=0;
  for(let i=0;i<gm.ores.length;i++) sum+=Math.max(0,gm.ores[i].score);
  if(sum>=need) return;
  const dirt=gm.ores.filter(function(o){ return o.kind==='dirt'; });
  for(let i=0;i<dirt.length&&sum<need;i++){
    const o=dirt[i];
    const c=ORE[i%3===2?'big':'mid'];
    sum-=o.score;
    o.kind=i%3===2?'big':'mid';
    o.r=Math.min(o.r,(c.min+c.max)/2);
    o.score=c.score; o.weight=c.weight;
    o.pull=Math.max(CARRY_MIN,(CARRY_BASE/c.weight)*Math.pow(((c.min+c.max)/2)/o.r,1.2));
    sum+=o.score;
  }
  // 还是不够：补几颗小番茄（有空位才补）
  let extra=0;
  while(sum<need&&extra<4){
    const o=tryPlace('small'); if(!o) break;
    sum+=o.score; extra++;
  }
}

/* ================= 钩爪 ================= */
function tip(){
  const a=gm.hook.a, l=gm.hook.len;
  return {x:PIVOT.x+Math.sin(a)*l, y:PIVOT.y+Math.cos(a)*l};
}
function shootHook(){
  if(gm.phase!=='play'||gm.hook.state!=='idle') return;
  gm.hook.state='shoot';
  gm.hook.ore=null;
  kickMiner(-3.0, -42);   // 发射反冲：先拔高一截再回落
  SFX.shoot();
  if(!gm.shotAny){ gm.shotAny=true; hintEl.classList.add('hide'); }
}
function updateHook(dt){
  const hk=gm.hook;
  if(hk.state==='idle'){
    gm.swing+=dt*Math.PI*2/gm.period;
    hk.a=Math.sin(gm.swing)*MAXA;
    hk.len=MINLEN;
    return;
  }
  if(hk.state==='shoot'){
    hk.len+=SHOOT_SPD*dt;
    const p=tip();
    let hit=null, bestD=1e9;
    for(let i=0;i<gm.ores.length;i++){
      const o=gm.ores[i];
      const dx=p.x-o.x, dy=p.y-o.y;
      const rr=o.r+HOOK_R+((o.kind==='small'||o.kind==='gem')?4:0);
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<=rr&&d<bestD){ bestD=d; hit=o; }
    }
    if(hit){
      // 炸药：钩尖一碰到立刻引爆，不再挂住回收
      if(hit.kind==='bomb'){
        explodeBomb(hit);
        hk.state='retract';
        hk.ore=null;
        return;
      }
      hk.state='attach'; hk.ore=hit; hit.attached=true; oreDirty=true;
      // 抓住的瞬间：按重量给一下「坠手感」，重的压得更扁
      kickMiner(1.2+2.4*Math.min(1,hit.weight/4.2), 26*Math.min(1,hit.weight/4.2));
      if(hit.kind==='gem'){ burst(p.x,p.y,'#ffe9a8',8,120); }
      if(hit.kind==='statue'){ SFX.statue(); }
      if(hit.weight>=2.4) tone(96,0.22,'sawtooth',0.05);   // 重物的低鸣
      // 命中定格 + 掉土 + 震动：强化「抓到了」的手感
      if(hit.kind==='big'||hit.kind==='gem'||hit.kind==='statue') gm.hitStop=0.055;
      if(hit.kind==='small'||hit.kind==='mid'||hit.kind==='big'){
        burst(p.x,p.y+hit.r*0.3,'#6b5a45',4,60);
      }
      if(hit.weight>=3.0) buzz(18);
    }else if(hk.len>=MAXLEN){
      hk.state='retract';
      gm.streak=0; updateComboChip();   // 空钩断连击
    }
    return;
  }
  if(hk.state==='attach'){
    const o=hk.ore;
    let spd=Math.max(CARRY_MIN, o.pull || CARRY_BASE/Math.max(0.5,o.weight));
    if(gm.glueT>0) spd*=GLUE_MULT;
    hk.len-=spd*dt;
    const p=tip();
    o.x=p.x; o.y=p.y;
    if(hk.len<=MINLEN){ collect(hk.ore); hk.ore=null; hk.state='retract'; hk.len=MINLEN; }
    return;
  }
  if(hk.state==='retract'){
    hk.len-=EMPTY_SPD*dt;
    if(hk.len<=MINLEN){ hk.len=MINLEN; hk.state='idle'; }
  }
}

function comboMult(){
  return Math.min(COMBO_CAP, 1+Math.max(0,gm.streak-1)*COMBO_STEP);
}

    comboChip.classList.remove('pop'); void comboChip.offsetWidth; comboChip.classList.add('pop');

    comboChip.classList.remove('show');
  }

function addScore(base){
  const v=Math.round(base*comboMult());
  gm.total=Math.max(0,gm.total+v);
  gm.lvScore=Math.max(0,gm.lvScore+v);
  return v;
}
function resetCombo(){ gm.streak=0; updateComboChip(); }

/* 炸药：钩尖触到即引爆，清掉半径内的土块，自身消失并震屏 */
function explodeBomb(o){
  const x=o.x, y=o.y;
  const idx=gm.ores.indexOf(o);
  if(idx>=0) gm.ores.splice(idx,1);
  let n=0;
  for(let i=gm.ores.length-1;i>=0;i--){
    const d=gm.ores[i];
    if(d.kind!=='dirt') continue;
    if(Math.hypot(d.x-x,d.y-y)<=BOMB_RADIUS){
      burst(d.x,d.y,'#8b8175',6,130);
      gm.ores.splice(i,1); n++;
    }
  }
  gm.boomDirt+=n;
  oreDirty=true;
  tone(90,0.26,'sawtooth',0.09); tone(58,0.3,'sine',0.06,0.03);
  burst(x,y,'#ffb35c',16,240);
  kickMiner(4.2, 24);   // 爆炸气浪把月巴掀得往下一沉
  shake(8);
  showBanner(t('bombBanner',{n:n}));
}

function collect(o){
  const x=o.x, y=o.y, idx=gm.ores.indexOf(o);
  if(idx>=0) gm.ores.splice(idx,1);
  oreDirty=true;
  const kind=o.kind;
  if(kind==='statue'){
    gm.streak++;
    const v=addScore(o.score);
    gm.bestStreak=Math.max(gm.bestStreak,gm.streak);
    gm.statueCount++;
    save.statues=(save.statues||0)+1;
    saveStore();
    gm.statueOre=null;
    SFX.statue();
    shake(7);
    buzz(45);
    if(goldFlash){
      goldFlash.classList.remove('show');
      void goldFlash.offsetWidth;
      goldFlash.classList.add('show');
    }
    burst(x,y,'#ffe9a8',18,220);
    popText(x,y-14,'+'+v,'#fff3b0',22);
    showBanner(t('statueBanner'));
    kickMiner(-3.2, -46);   // 金像到手：开心地蹦一下
    gm.quote=t('q5');
    unlockAch('statue');
    updateComboChip();
  }else if(kind==='gem'){
    gm.streak++;
    const v=addScore(o.score);
    gm.bestStreak=Math.max(gm.bestStreak,gm.streak);
    SFX.gem(); shake(6); buzz(25);
    burst(x,y,'#9be7ff',14,190);
    popText(x,y-10,'+'+v,'#d9f7ff',20);
    kickMiner(-2.4, -30);   // 宝石：小跳
    gm.quote=t('q2');
    updateComboChip();
  }else if(kind==='dirt'){
    const v=addScore(o.score);
    resetCombo();
    SFX.dirt();
    const bp=o.imgId?POOL_BY_ID[o.imgId]:null;
    burst(x,y,bp?bp.color:'#6b6257',8,110);
    popText(x,y-10,'+'+v,'#d9cdbb',16);
    kickMiner(2.6, 14);   // 泥土入手：轻轻一沉
    gm.quote=t('q3');
  }else if(kind==='clock'){
    gm.time=Math.min(LV_TIME,gm.time+o.bonus);
    flashTime();
    SFX.clock();
    burst(x,y,'#9be07a',10,150);
    popText(x,y-10,t('plusTime'),'#b8f08a',19);
  }else if(kind==='small'||kind==='mid'||kind==='big'){
    gm.streak++;
    const v=addScore(o.score);
    gm.bestStreak=Math.max(gm.bestStreak,gm.streak);
    save.totalOres=(save.totalOres||0)+1;
    SFX.grab();
    burst(x,y,'#ff9b8d',7,140);
    popText(x,y-10,'+'+v,'#ffe0b8',kind==='big'?22:18);
    kickMiner(kind==='big'?-2.0:-1.2, kind==='big'?-26:-12);   // 大番茄弹得更高
    updateComboChip();
  }else if(kind==='rot'){
    gm.total=Math.max(0,gm.total+o.score);
    gm.lvScore=Math.max(0,gm.lvScore+o.score);
    resetCombo();
    SFX.dirt();
    tone(180,0.18,'sawtooth',0.06);
    burst(x,y,'#7e6b4a',10,120);
    popText(x,y-10,'−40','#c9a86a',18);
    kickMiner(3.4, 18);   // 吃到烂番茄：嫌弃地往下一缩
  }else if(kind==='glue'){
    gm.glueT=GLUE_TIME;
    updateStatusChip();
    SFX.clock();
    burst(x,y,'#7de3ff',12,170);
    showBanner(t('glueBanner'));
  }else if(kind==='lamp'){
    gm.time=Math.min(LV_TIME,gm.time+LAMP_TIME);
    flashTime();
    SFX.clock();
    burst(x,y,'#ffe9a8',12,180);
    showBanner(t('lampBanner'));
  }
  saveStore();
  checkAch();
  if(gm.lvScore>=gm.target) levelClear();
}

    const key=String(dailyKey());
    if(save.daily.key!==key){ save.daily={key:key,best:0,plays:0,rewarded:save.daily.rewarded||''}; }
    save.daily.best=Math.max(save.daily.best,gm.total);

}

/* 结算数字从 0 滚到目标值；用 setTimeout 链，避免额外占用 rAF */
function countUp(id,to,dur,prefix){
  const el=document.getElementById(id);
  if(!el||!(to>0)) return;
  const steps=12, iv=Math.max(20,Math.round((dur||480)/steps));
  let i=0;
  const tick=function(){
    i++;
    const p=i/steps;
    const e=1-Math.pow(1-p,3);
    el.textContent=(prefix?'+':'')+Math.round(to*e);
    if(i<steps) setTimeout(tick,iv);
    else el.textContent=(prefix?'+':'')+to;
  };
  setTimeout(tick,iv);
}

/* 渐变缓存：静态背景只建一次；矿点静止时复用，被钩住移动时才重建，降低每帧分配 */
let BG_G=null, PIT_GLOW=null;

/* 岩层配色：每 5 关换一层，深处更冷 */
const BANDS=[
  {a:'#07202b', b:'#05161f', c:'#020b11', line:'rgba(120,232,255,.045)', pit:'#0a2632', glow:'70,230,242'},
  {a:'#06251f', b:'#041813', c:'#020c09', line:'rgba(120,255,214,.045)', pit:'#0a2b23', glow:'70,242,190'},
  {a:'#0d1830', b:'#070f20', c:'#03060f', line:'rgba(150,180,255,.05)',  pit:'#101a38', glow:'120,150,255'}
];
function drawBg(){
  const pal=BANDS[(gm.band||0)%BANDS.length];
  if(!BG_G){
    BG_G=ctx.createLinearGradient(0,0,0,H);
    BG_G.addColorStop(0,pal.a);
    BG_G.addColorStop(0.28,pal.b);
    BG_G.addColorStop(1,pal.c);
  }
  ctx.fillStyle=BG_G;
  ctx.fillRect(0,0,W,H);

  // 井口柔光：只留月巴身后一团，把角色从背景里托出来
  if(!PIT_GLOW){
    PIT_GLOW=ctx.createRadialGradient(PIVOT.x,PIVOT.y-34,8,PIVOT.x,PIVOT.y-34,136);
    PIT_GLOW.addColorStop(0,'rgba('+pal.glow+',.15)');
    PIT_GLOW.addColorStop(.5,'rgba('+pal.glow+',.05)');
    PIT_GLOW.addColorStop(1,'rgba('+pal.glow+',0)');
  }
  ctx.fillStyle=PIT_GLOW;
  ctx.fillRect(PIVOT.x-140,0,280,PIVOT.y+96);

  // 土层纹理：从平台下方开始，线条更轻更平
  ctx.strokeStyle=pal.line;
  ctx.lineWidth=1;
  for(let y=196;y<H;y+=52){
    ctx.beginPath();
    for(let x=0;x<=W;x+=48){
      const yy=y+Math.sin((x+y)*0.018)*2.6;
      if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  // 矿口平台：干净的地台 + 顶缘冷光
  ctx.fillStyle=pal.pit;
  ctx.beginPath();
  ctx.ellipse(PIVOT.x,PIVOT.y+4,76,14,0,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='rgba('+pal.glow+',.09)';
  ctx.beginPath();
  ctx.ellipse(PIVOT.x,PIVOT.y+2,64,9,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='rgba('+pal.glow+',.34)';
  ctx.lineWidth=1.2;
  ctx.beginPath();
  ctx.ellipse(PIVOT.x,PIVOT.y+4,76,14,0,Math.PI*1.04,Math.PI*1.96);
  ctx.stroke();
  // 月巴脚下压暗，稳住重心
  ctx.fillStyle='rgba(2,10,16,.5)';
  ctx.beginPath();
  ctx.ellipse(PIVOT.x,PIVOT.y+2,32,7,0,0,Math.PI*2);
  ctx.fill();
}

/* ================= HD-2D 像素番茄 ================= */
/* 本体在 26×30 的像素格上烘焙：硬边轮廓 + 分级色带 + 像素高光，
   运行时再叠柔光和右下冷调轮廓光，得到「像素本体 + 现代光照」的 HD-2D 观感 */
const TOM_W=26, TOM_H=30, TOM_CX=13, TOM_CY=16.5, TOM_RX=11, TOM_RY=10.2;
const TOM_PAL={
  normal:{edge:'#2a0b0c', deep:'#5f1719', shadow:'#8d2622', base:'#c0352b',
          light:'#e05244', high:'#ff8672', spec:'#ffd3bd', rim:'#69c3d2'},
  big:   {edge:'#2a0b0c', deep:'#641a1c', shadow:'#952a25', base:'#ca3a2e',
          light:'#eb5a4b', high:'#ff8f79', spec:'#ffd8c4', rim:'#7ad4e4'},
  rot:   {edge:'#241a10', deep:'#35281a', shadow:'#4f3d26', base:'#6a5236',
          light:'#826846', high:'#9d8158', spec:'#c5ad80', rim:'#6d9a8c'}
};
const TOM_SPRITES={};
const TOM_MOLD=[[8,19],[9,20],[10,19],[17,21],[18,22],[17,14],[7,23],[18,11],[10,24]];

function makeTomatoSprite(kind, variant){
  const pal=TOM_PAL[kind==='rot'?'rot':(kind==='big'?'big':'normal')];
  const c=document.createElement('canvas');
  c.width=TOM_W; c.height=TOM_H;
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=false;
  const bands=[pal.deep,pal.shadow,pal.base,pal.light,pal.high,pal.spec];
  const cuts=[0.24,0.40,0.56,0.72,0.86];
  // 球体：以左上光点为圆心算亮度，量化成 6 级色带（像素画的明暗分层）
  const lx=-0.52, ly=-0.58;
  for(let py=0;py<TOM_H;py++){
    for(let px=0;px<TOM_W;px++){
      const nx=(px+0.5-TOM_CX)/TOM_RX, ny=(py+0.5-TOM_CY)/TOM_RY;
      const d=Math.sqrt(nx*nx+ny*ny);
      if(d>1) continue;
      if(d>0.9){
        const cool=(nx*0.45+ny*0.9)>0.22;
        g.fillStyle=cool?pal.rim:pal.edge;
        g.fillRect(px,py,1,1);
        continue;
      }
      let B=1-0.52*Math.sqrt((nx-lx)*(nx-lx)+(ny-ly)*(ny-ly));
      if(d>0.84) B-=0.10;
      B+=((((Math.sin(px*12.9898+py*78.233+variant*7.13)*43758.5453)%1)+1)%1)*0.04-0.02;
      let bi=0;
      while(bi<cuts.length&&B>cuts[bi]) bi++;
      g.fillStyle=bands[bi];
      g.fillRect(px,py,1,1);
    }
  }
  // 硬边高光 / 霉斑
  if(kind!=='rot'){
    g.fillStyle=pal.spec;
    g.fillRect(9,11,1,1);
  }else{
    for(let i=0;i<TOM_MOLD.length;i++){
      g.fillStyle=i%2?'#b8c08d':'#8a9a68';
      g.fillRect(TOM_MOLD[i][0],TOM_MOLD[i][1],1,1);
    }
    g.fillStyle='#2f2416';
    g.fillRect(9,21,1,1); g.fillRect(16,15,1,1);
  }
  // 五片像素绿萼：叶片从蒂芯向外伸出，压在果肩上方
  const hubX=TOM_CX, hubY=6.8;
  const baseA=-Math.PI/2+variant*0.13;
  for(let py=0;py<TOM_H;py++){
    for(let px=0;px<TOM_W;px++){
      const dx=px+0.5-hubX, dy=py+0.5-hubY;
      let q=-1;
      if(dx*dx+dy*dy<=2.1) q=0;
      else{
        for(let i=0;i<5;i++){
          const a=baseA+i*Math.PI*2/5, ca=Math.cos(a), sa=Math.sin(a);
          const ox=ca*2.3, oy=sa*2.3;
          const u=((dx-ox)*ca+(dy-oy)*sa)/2.3;
          const v=(-(dx-ox)*sa+(dy-oy)*ca)/1.15;
          const e=u*u+v*v;
          if(e<=1&&(q<0||e<q)) q=e;
        }
      }
      if(q<0) continue;
      let col;
      if(q>0.62) col='#0e3a29';
      else if(q>0) col='#2f9469';
      else col='#1c6b4d';
      if(q>0&&q<=0.62&&(-0.5*dx-0.72*dy)>0) col='#54c08c';
      g.fillStyle=col;
      g.fillRect(px,py,1,1);
    }
  }
  // 小藤
  g.fillStyle='#123d2c'; g.fillRect(12,3,2,4);
  g.fillStyle='#3f9a70'; g.fillRect(12,3,1,4);
  g.fillStyle='#0d2c20'; g.fillRect(12,6,2,1);
  return c;
}

function tomatoSprite(kind, seed){
  const k=kind==='big'?'big':(kind==='rot'?'rot':'normal');
  const v=Math.floor((seed||0)*3)%4;
  const key=k+'|'+v;
  if(!TOM_SPRITES[key]) TOM_SPRITES[key]=makeTomatoSprite(k, v);
  return TOM_SPRITES[key];
}

/* 漂浮矿尘：廉价的视差层，让静态背景有空气感 */
function drawDust(){
  if(document.body.classList.contains('lp')) return;
  const t=performance.now()/1000;
  const pal=BANDS[(gm.band||0)%BANDS.length];
  ctx.fillStyle='rgba('+pal.glow+',.12)';
  for(let i=0;i<12;i++){
    const x=(i*97 + Math.sin(t*0.35+i*1.3)*22 + 480)%480;
    const y=(i*151 + t*(9+i%4*3))%720;
    ctx.beginPath();
    ctx.arc(x,y,1+ (i%3)*0.5,0,Math.PI*2);
    ctx.fill();
  }
}

function drawTomato(o){
  const x=o.x, y=o.y, r=o.r, rot=o.kind==='rot';
  // 土丘 + 冷光地圈
  ctx.fillStyle='rgba(2,10,16,.75)';
  ctx.beginPath();
  ctx.ellipse(x,y+r*0.82,r*0.9,r*0.32,0,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='rgba(70,230,242,.16)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.ellipse(x,y+r*0.82,r*0.9,r*0.32,0,0,Math.PI*2);
  ctx.stroke();
  // 柔光晕：像素本体外的暖色 bloom（腐烂番茄偏土黄）
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const gr=ctx.createRadialGradient(x-r*0.28,y-r*0.32,r*0.1,x,y,r*1.72);
  if(rot){
    gr.addColorStop(0,'rgba(150,132,86,.16)');
    gr.addColorStop(.55,'rgba(120,108,70,.05)');
  }else{
    gr.addColorStop(0,'rgba(255,120,92,.22)');
    gr.addColorStop(.55,'rgba(255,80,58,.08)');
  }
  gr.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gr;
  ctx.beginPath();
  ctx.ellipse(x,y,r*1.72,r*1.55,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
  // 像素本体：关闭插值放大，保持硬边颗粒
  const sp=tomatoSprite(o.kind, o.seed);
  const s=r/TOM_RX;
  const w=Math.round(TOM_W*s*DPR)/DPR;
  const h=Math.round(TOM_H*s*DPR)/DPR;
  const ox=Math.round((x-TOM_CX*s)*DPR)/DPR;
  const oy=Math.round((y-TOM_CY*s)*DPR)/DPR;
  const smooth=ctx.imageSmoothingEnabled;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(sp, ox, oy, w, h);
  ctx.imageSmoothingEnabled=smooth;
  // 右下冷调轮廓光：HD-2D 的「现代光照」层
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=rot?'rgba(140,210,190,.14)':'rgba(150,240,255,.17)';
  ctx.lineWidth=Math.max(1,r*0.07);
  ctx.beginPath();
  ctx.ellipse(x,y,r*0.97,r*0.92,0,Math.PI*0.14,Math.PI*0.62);
  ctx.stroke();
  ctx.restore();
}

/* 钻石本体：番茄金像外链图缩小当「钻石番茄」，再叠冷光 + 星芒特效 */
const GEM_SRC=STATUE_SRC;
let GEM_IMG=null;
function gemImage(){
  if(!GEM_IMG){
    GEM_IMG=new Image(); GEM_IMG.decoding='async';
    // 图晚到时重烘焙一次静态矿点，避免一直停在矢量占位
    GEM_IMG.onload=function(){ oreDirty=true; };
    GEM_IMG.onerror=function(){ oreDirty=true; };
    GEM_IMG.src=GEM_SRC;
  }
  return (GEM_IMG.complete&&GEM_IMG.naturalWidth>0)?GEM_IMG:null;
}
/* 四芒星：两层细长菱形交叉，配合叠加混合得到钻石星芒 */
function gemStar(x,y,len,alpha,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);
  ctx.globalAlpha=alpha;
  ctx.fillStyle='#eafcff';
  for(let i=0;i<2;i++){
    ctx.rotate(i?Math.PI/2:0);
    ctx.beginPath();
    ctx.moveTo(0,-len);
    ctx.quadraticCurveTo(len*0.14,0,0,len);
    ctx.quadraticCurveTo(-len*0.14,0,0,-len);
    ctx.fill();
  }
  ctx.restore();
}
function drawGemShape(o){
  // 外链图未就绪时的矢量占位（仍是旧宝石轮廓，避免空窗）
  const x=o.x, y=o.y, r=o.r;
  const g=ctx.createLinearGradient(x-r,y-r,x+r,y+r);
  g.addColorStop(0,'#ffd6cf');
  g.addColorStop(0.35,'#ff7b6b');
  g.addColorStop(0.62,'#ffb3a6');
  g.addColorStop(1,'#c9342b');
  ctx.beginPath();
  ctx.moveTo(x,y-r);
  ctx.lineTo(x+r*0.78,y-r*0.25);
  ctx.lineTo(x+r*0.5,y+r*0.75);
  ctx.lineTo(x-r*0.5,y+r*0.75);
  ctx.lineTo(x-r*0.78,y-r*0.25);
  ctx.closePath();
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(x-r*0.5,y-r*0.25); ctx.lineTo(x+r*0.5,y-r*0.25);
  ctx.moveTo(x,y-r); ctx.lineTo(x,y+r*0.75);
  ctx.stroke();
}
function drawGem(o){
  const x=o.x, y=o.y, r=o.r;
  const t=performance.now()/1000;
  const pulse=0.5+0.5*Math.sin(t*2.1+o.seed);
  ctx.fillStyle='rgba(2,10,16,.7)';
  ctx.beginPath(); ctx.ellipse(x,y+r*0.85,r*0.9,r*0.3,0,0,Math.PI*2); ctx.fill();
  // 冷光晕：钻石的呼吸底光
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const halo=ctx.createRadialGradient(x,y,r*0.15,x,y,r*2.05);
  halo.addColorStop(0,'rgba(160,242,255,'+(0.20+0.12*pulse).toFixed(3)+')');
  halo.addColorStop(.55,'rgba(70,230,242,'+(0.08+0.05*pulse).toFixed(3)+')');
  halo.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=halo;
  ctx.beginPath(); ctx.arc(x,y,r*2.05,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // 本体：番茄外链图缩到与旧钻石同尺寸（直径约 2r）
  const im=gemImage();
  if(im){
    const s=r*1.96;
    ctx.drawImage(im,x-s/2,y-s/2,s,s);
  }else{
    drawGemShape(o);
  }
  // 冷调轮廓光 + 偶发高光扫过（钻石切面感）
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle='rgba(190,250,255,'+(0.30+0.20*pulse).toFixed(3)+')';
  ctx.lineWidth=Math.max(1,r*0.07);
  ctx.beginPath();
  ctx.ellipse(x,y,r*0.94,r*0.9,0,Math.PI*0.1,Math.PI*0.66);
  ctx.stroke();
  const cyc=(t*0.42+o.seed*0.16)%1;
  if(cyc<0.4){
    const k=cyc/0.4;                       // 0→1 扫过本体
    const gx=x-r*1.1+k*r*2.2;
    const gleam=ctx.createLinearGradient(gx-r*0.5,y-r,gx+r*0.5,y+r);
    gleam.addColorStop(0,'rgba(255,255,255,0)');
    gleam.addColorStop(.5,'rgba(225,252,255,.42)');
    gleam.addColorStop(1,'rgba(255,255,255,0)');
    ctx.save();
    ctx.beginPath(); ctx.arc(x,y,r*0.96,0,Math.PI*2); ctx.clip();
    ctx.fillStyle=gleam;
    ctx.fillRect(x-r,y-r,r*2,r*2);
    ctx.restore();
  }
  ctx.restore();
  // 星芒：主星呼吸闪烁 + 两颗小星环绕
  const tw=Math.pow(0.5+0.5*Math.sin(t*3.1+o.seed*5.7),2);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  gemStar(x-r*0.22,y-r*0.3,r*(0.55+0.25*tw),0.35+0.55*tw,t*0.25);
  const a1=t*0.9+o.seed;
  gemStar(x+Math.cos(a1)*r*1.15,y+Math.sin(a1)*r*0.92,Math.max(2,r*0.16),0.25+0.45*tw,Math.PI/4);
  const a2=-a1*0.7+1.7;
  gemStar(x+Math.cos(a2)*r*1.05,y+Math.sin(a2)*r*1.0,Math.max(1.6,r*0.11),0.2+0.4*(1-tw),0);
  ctx.restore();
}

function drawClock(o){
  drawTomato({x:o.x,y:o.y,r:o.r*1.02,kind:'mid',seed:o.seed});
  const x=o.x, y=o.y, r=o.r*0.62;
  ctx.fillStyle='#082b39';
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#46e6f2'; ctx.lineWidth=1.6; ctx.stroke();
  ctx.strokeStyle='#b0f9ff'; ctx.lineWidth=2.2; ctx.lineCap='round';
  const ang=performance.now()/900;
  ctx.beginPath();
  ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(ang)*r*0.55,y+Math.sin(ang)*r*0.55);
  ctx.moveTo(x,y); ctx.lineTo(x+Math.cos(ang*0.4-1.2)*r*0.42,y+Math.sin(ang*0.4-1.2)*r*0.42);
  ctx.stroke();
  ctx.fillStyle='#ff5468';
  ctx.beginPath(); ctx.arc(x,y,1.8,0,Math.PI*2); ctx.fill();
}

function drawDirt(o){
  const x=o.x, y=o.y, r=o.r;
  const im=o.imgId?bannyImage(o.imgId):null;
  // 投影
  ctx.fillStyle='rgba(2,10,16,.7)';
  ctx.beginPath(); ctx.ellipse(x,y+r*0.85,r*0.9,r*0.3,0,0,Math.PI*2); ctx.fill();
  if(im){
    // 圆形立绘牌：任意外链图都裁进冷光圆盘，观感统一
    ctx.save();
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();
    ctx.fillStyle='#0e2b36';
    ctx.fillRect(x-r,y-r,r*2,r*2);
    const s=r*2.35;
    ctx.drawImage(im,x-s/2,y-s/2,s,s);
    ctx.restore();
    ctx.strokeStyle='rgba(120,232,255,.5)';
    ctx.lineWidth=Math.max(1,r*0.07);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='rgba(200,252,255,.55)';
    ctx.lineWidth=Math.max(.8,r*0.04);
    ctx.beginPath(); ctx.arc(x,y,r*0.94,Math.PI*1.12,Math.PI*1.72); ctx.stroke();
    return;
  }
  const pts=6, seed=o.seed;
  ctx.beginPath();
  for(let i=0;i<pts;i++){
    const a=i/pts*Math.PI*2+seed*0.3;
    const rr=r*(0.82+((Math.sin(seed+i*2.1)+1)/2)*0.26);
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr*0.92;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  const g=ctx.createLinearGradient(x,y-r,x,y+r);
  g.addColorStop(0,'#6b6257'); g.addColorStop(1,'#3a3630');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#2b2721'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.12)';
  for(let i=0;i<3;i++){
    const a=seed+i*1.7;
    ctx.beginPath();
    ctx.arc(x+Math.cos(a)*r*0.4, y+Math.sin(a)*r*0.35, r*0.11,0,Math.PI*2);
    ctx.fill();
  }
}

/* ---------- 道具 / 腐烂番茄 ---------- */
function drawBomb(o){
  const x=o.x, y=o.y, r=o.r;
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(x,y+r*0.86,r*0.9,r*0.3,0,0,Math.PI*2); ctx.fill();
  const g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.18,x,y,r);
  g.addColorStop(0,'#66707c'); g.addColorStop(.55,'#353c45'); g.addColorStop(1,'#171b20');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#6f7a86'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.ellipse(x-r*0.34,y-r*0.36,r*0.24,r*0.14,-0.5,0,Math.PI*2); ctx.fill();
  // 引线
  ctx.strokeStyle='#c9a86a'; ctx.lineWidth=2.2; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x,y-r*0.9);
  ctx.quadraticCurveTo(x+r*0.5,y-r*1.25,x+r*0.28,y-r*1.5);
  ctx.stroke();
  // 火花
  const tw=0.6+0.4*Math.sin(performance.now()/90);
  ctx.fillStyle='#ffd76a';
  ctx.beginPath(); ctx.arc(x+r*0.28,y-r*1.5,r*0.2*tw+1.6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,235,160,.55)';
  ctx.beginPath(); ctx.arc(x+r*0.28,y-r*1.5,r*0.5*tw+2.4,0,Math.PI*2); ctx.fill();
}
/* 马达：金属机身 + 散热鳍片 + 常转不休的风扇，一眼看出「拉速 ×2」 */
function drawMotor(o){
  const x=o.x, y=o.y, r=o.r;
  const spin=performance.now()/180;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x,y+r*0.9,r*0.9,r*0.28,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(125,227,255,.14)';
  ctx.beginPath(); ctx.arc(x,y,r*1.2,0,Math.PI*2); ctx.fill();
  // 机身
  const g=ctx.createLinearGradient(x,y-r*0.62,x,y+r*0.62);
  g.addColorStop(0,'#aec2cf'); g.addColorStop(.44,'#5f7484'); g.addColorStop(1,'#27333e');
  ctx.fillStyle=g;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x-r*0.8,y-r*0.62,r*1.5,r*1.24,r*0.2);
  else ctx.rect(x-r*0.8,y-r*0.62,r*1.5,r*1.24);
  ctx.fill();
  ctx.strokeStyle='rgba(215,245,255,.72)'; ctx.lineWidth=1.2; ctx.stroke();
  // 散热鳍片
  ctx.strokeStyle='rgba(8,22,30,.45)'; ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const bx=x-r*0.6+i*r*0.23;
    ctx.beginPath(); ctx.moveTo(bx,y-r*0.42); ctx.lineTo(bx,y+r*0.24); ctx.stroke();
  }
  // 接线端子
  ctx.fillStyle='#d8a54a';
  ctx.fillRect(x-r*0.52,y-r*0.84,r*0.28,r*0.22);
  // 前端风扇
  const fx=x+r*0.52, fy=y, fr=r*0.42;
  ctx.fillStyle='#0f1c25';
  ctx.beginPath(); ctx.arc(fx,fy,fr,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(150,240,255,.8)'; ctx.lineWidth=1.1; ctx.stroke();
  ctx.save();
  ctx.translate(fx,fy); ctx.rotate(spin);
  ctx.fillStyle='rgba(168,228,242,.92)';
  for(let i=0;i<3;i++){
    ctx.rotate(Math.PI*2/3);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(fr*0.55,-fr*0.5,fr*0.92,-fr*0.1);
    ctx.quadraticCurveTo(fr*0.5,fr*0.14,0,0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle='#0b1620';
  ctx.beginPath(); ctx.arc(fx,fy,fr*0.22,0,Math.PI*2); ctx.fill();
}
function drawLamp(o){
  const x=o.x, y=o.y, r=o.r;
  ctx.fillStyle='rgba(255,215,106,.14)';
  ctx.beginPath(); ctx.arc(x,y,r*1.3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x,y+r*0.92,r*0.72,r*0.24,0,0,Math.PI*2); ctx.fill();
  // 提手
  ctx.strokeStyle='#8f9aa6'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y-r*0.78,r*0.42,Math.PI,0); ctx.stroke();
  // 灯体
  const g=ctx.createLinearGradient(x,y-r*0.6,x,y+r*0.7);
  g.addColorStop(0,'#ffe9a8'); g.addColorStop(.5,'#ffd76a'); g.addColorStop(1,'#c98f1f');
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(x-r*0.6,y-r*0.55,r*1.2,r*1.2,r*0.22)
                : ctx.rect(x-r*0.6,y-r*0.55,r*1.2,r*1.2);
  ctx.fill();
  ctx.strokeStyle='#8c6a1c'; ctx.lineWidth=1.3; ctx.stroke();
  ctx.fillStyle='#fffbe8';
  ctx.beginPath(); ctx.arc(x,y,r*0.26,0,Math.PI*2); ctx.fill();
  // 上下盖
  ctx.fillStyle='#8f9aa6';
  ctx.fillRect(x-r*0.68,y-r*0.68,r*1.36,r*0.16);
  ctx.fillRect(x-r*0.68,y+r*0.56,r*1.36,r*0.16);
}
function drawRot(o){
  // 腐烂番茄同样走像素精灵，只换土黄霉变调色板
  drawTomato(o);
  const x=o.x, y=o.y, r=o.r;
  // 小飞虫
  const t=performance.now()/600+o.seed;
  ctx.fillStyle='#d9d2a8';
  for(let i=0;i<2;i++){
    ctx.beginPath();
    ctx.arc(x+Math.cos(t+i*2.1)*r*1.2, y-r*0.4+Math.sin(t*1.7+i)*r*0.5, 1.6,0,Math.PI*2);
    ctx.fill();
  }
}

function drawOre(o){
  if(o.kind==='dirt') drawDirt(o);
  else if(o.kind==='gem') drawGem(o);
  else if(o.kind==='clock') drawClock(o);
  else if(o.kind==='bomb') drawBomb(o);
  else if(o.kind==='glue') drawMotor(o);
  else if(o.kind==='lamp') drawLamp(o);
  else if(o.kind==='rot') drawRot(o);
  else drawTomato(o);
}

function drawHook(){
  const p=tip();
  // 拉重物时绳子被绷弯 + 轻微抖动，直观表现「沉」
  let strain=0;
  if(gm.hook.state==='attach'&&gm.hook.ore) strain=Math.min(1, gm.hook.ore.weight/4.2);
  const dx=p.x-PIVOT.x, dy=p.y-PIVOT.y;
  const len=Math.hypot(dx,dy)||1;
  const sag=strain*len*0.05;
  const jit=(strain>0.1)?Math.sin(performance.now()/85)*strain*1.1:0;
  const mx=(PIVOT.x+p.x)/2 + (dy/len)*(sag*0.9+jit);
  const my=(PIVOT.y+p.y)/2 - (dx/len)*(sag*0.9+jit);
  const drawLine=function(){
    ctx.beginPath();
    ctx.moveTo(PIVOT.x,PIVOT.y);
    if(sag>0.4) ctx.quadraticCurveTo(mx,my,p.x,p.y);
    else ctx.lineTo(p.x,p.y);
    ctx.stroke();
  };
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(70,230,242,.22)';
  ctx.lineWidth=6;
  drawLine();
  ctx.strokeStyle=strain>0.5?'rgba(200,252,255,.95)':'rgba(176,249,255,.85)';
  ctx.lineWidth=2;
  drawLine();
  // 钩子
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(-gm.hook.a);
  ctx.strokeStyle='#a9c8d4';
  ctx.lineWidth=3;
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.lineTo(0,7);
  ctx.arc(-5,7,5,0,Math.PI,false);
  ctx.stroke();
  ctx.restore();
}

function drawParticles(){
  for(let i=gm.parts.length-1;i>=0;i--){
    const p=gm.parts[i];
    p.life-=1/60;
    p.x+=p.vx/60; p.y+=p.vy/60; p.vy+=260/60;
    if(p.life<=0){ gm.parts.splice(i,1); continue; }
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawTexts(){
  for(let i=gm.texts.length-1;i>=0;i--){
    const o=gm.texts[i];
    o.life-=1/60;
    o.y-=26/60;
    if(o.life<=0){ gm.texts.splice(i,1); continue; }
    ctx.globalAlpha=Math.min(1,o.life/0.35);
    ctx.font='900 '+o.size+'px system-ui,"PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center';
    ctx.lineWidth=4;
    ctx.strokeStyle='rgba(40,24,12,.85)';
    ctx.strokeText(o.txt,o.x,o.y);
    ctx.fillStyle=o.color;
    ctx.fillText(o.txt,o.x,o.y);
  }
  ctx.globalAlpha=1;
}

/* ---------- 离屏烘焙：土层只画一次，静态矿点按需重烘焙 ---------- */
function bakeBg(){
  const c=document.createElement('canvas');
  c.width=Math.round(W*DPR); c.height=Math.round(H*DPR);
  const g=c.getContext('2d');
  g.setTransform(DPR,0,0,DPR,0,0);
  const prev=ctx; ctx=g;
  BG_G=null; PIT_GLOW=null;
  drawBg();
  ctx=prev;
  bgCv=c;
}
function isStaticOre(o){
  return o.kind==='small'||o.kind==='mid'||o.kind==='big'||o.kind==='dirt'
    ||o.kind==='rot'||o.kind==='glue'||o.kind==='lamp';
}
function bakeOres(){
  if(!oreCv) oreCv=document.createElement('canvas');
  if(oreCv.width!==Math.round(W*DPR)||oreCv.height!==Math.round(H*DPR)){
    oreCv.width=Math.round(W*DPR); oreCv.height=Math.round(H*DPR);
  }
  const g=oreCv.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,oreCv.width,oreCv.height);
  g.setTransform(DPR,0,0,DPR,0,0);
  const prev=ctx; ctx=g;
  for(let i=0;i<gm.ores.length;i++){
    const o=gm.ores[i];
    if(!isStaticOre(o)||o.attached) continue;
    drawOre(o);
  }
  ctx=prev;
  oreDirty=false;
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  let sx=0, sy=0;
  if(gm.shake>0){
    sx=(Math.random()-0.5)*gm.shake;
    sy=(Math.random()-0.5)*gm.shake;
    gm.shake=Math.max(0,gm.shake-0.6);
  }
  ctx.save();
  ctx.translate(sx,sy);
  if(bgCv) ctx.drawImage(bgCv,0,0,W,H);
  else drawBg();
  drawDust();
  if(oreDirty) bakeOres();
  if(oreCv) ctx.drawImage(oreCv,0,0,W,H);
  for(let i=0;i<gm.ores.length;i++){
    const o=gm.ores[i];
    if(o.kind==='statue') continue;
    if(!isStaticOre(o)||o.attached) drawOre(o);
  }
  drawHook();
  drawParticles();
  drawTexts();
  ctx.restore();
  syncDom();
}

/* 月巴 Q 弹：挤压/拉伸与上下位移各一根弹簧，阻尼略欠一点以保留回弹 */
const SQ_K=300, SQ_C=17;   // ω≈17.3、ζ≈0.49 → 一次明显回弹
const DY_K=260, DY_C=19;
function kickMiner(sq, dy){
  const S=gm.spring;
  if(sq) S.vs+=sq;
  if(dy) S.vy+=dy;
}

function syncDom(){
  const a=gm.hook.a;
  const rot=a*0.1;
  const S=gm.spring;
  const now=performance.now();
  let dt=gm.springLast?(now-gm.springLast)/1000:1/60;
  gm.springLast=now;
  if(dt>0.05) dt=0.05;
  // 拉重物时矿工被往下拽、轻微发抖，强化「沉」的手感
  let strain=0;
  if(gm.hook.state==='attach'&&gm.hook.ore) strain=Math.min(1, gm.hook.ore.weight/4.2);
  const jit=(strain>0.4&&!document.body.classList.contains('lp'))?(Math.random()-0.5)*1.6*strain:0;
  const tgtDy=strain*3.0;
  // 弹簧积分：s>0 压扁（矮胖）、s<0 拉长（瘦高），回弹留一点点过冲
  S.vs+=(-SQ_K*S.s-SQ_C*S.vs)*dt;
  S.s+=S.vs*dt;
  if(S.s>0.34){ S.s=0.34; if(S.vs>0) S.vs*=-0.3; }
  if(S.s<-0.26){ S.s=-0.26; if(S.vs<0) S.vs*=-0.3; }
  S.vy+=(-DY_K*(S.dy-tgtDy)-DY_C*S.vy)*dt;
  S.dy+=S.vy*dt;
  // 待机呼吸：极轻的竖向起伏，静止时也不僵
  const br=Math.sin(now*0.0032)*0.006;
  const sy=1-S.s+br;
  const sx=1+S.s*0.62-br*0.5;
  minerTilt.style.transform='rotate('+rot.toFixed(4)+'rad) translate('+jit.toFixed(2)+'px,'
    +(S.dy+br*2.2).toFixed(2)+'px) scale('+sx.toFixed(3)+','+sy.toFixed(3)+')';
  syncStatue();
}

/* ================= 主循环 ================= */
function tick(dt){
  if(gm.phase==='play'){
    if(gm.glueT>0){
      gm.glueT=Math.max(0, gm.glueT-dt);
      const sec=Math.ceil(gm.glueT);
      if(sec!==gm.lastGlueSec){ gm.lastGlueSec=sec; updateStatusChip(); }
    }
    gm.time-=dt;
    if(gm.time<=10){
      const sec=Math.ceil(gm.time);
      if(sec!==gm.lastSec){ gm.lastSec=sec; if(sec>0) tone(1046,0.035,'square',0.035); }
    }
    if(gm.time<=0){
      gm.time=0;
      updateHUD();
      endRun();
    }else{
      updateHook(dt);
      if(gm.phase==='play') updateHUD();
    }
  }else if(gm.phase==='clear'){
    // 结算横幅期间仍让钩子归位
    gm.hook.state='idle';
  }
}
function loop(ts){
  gm.raf=requestAnimationFrame(loop);
  if(!gm.last) gm.last=ts;
  let dt=(ts-gm.last)/1000;
  gm.last=ts;
  if(dt>0.1) dt=0.1;
  if(gm.hitStop>0){ gm.hitStop=Math.max(0,gm.hitStop-dt); render(); return; }
  // 帧率自适应：持续偏低时下调渲染倍率，保住交互流畅度
  if(gm.phase==='play'&&gm.dprSteps<2&&dt>0.001&&dt<0.2){
    gm.fpsAcc+=dt; gm.fpsN++;
    if(gm.fpsN>=90){
      const avg=gm.fpsAcc/gm.fpsN;
      if(avg>1/44&&DPR>1.25){
        DPR=Math.max(1.25,(DPR===2?1.5:1.25));
        gm.dprSteps++;
        resize();
      }
      gm.fpsAcc=0; gm.fpsN=0;
    }
  }
  if(!gm.paused) tick(dt);
  render();
}

/* ================= 输入 ================= */
frame.addEventListener('pointerdown',function(e){
  if(overlay.classList.contains('show')) return;
  ac();
  shootHook();
});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowDown'){
    e.preventDefault();
    if(overlay.classList.contains('show')) return;
    ac();
    shootHook();
  }else if(e.code==='Enter'){
    if(overlay.classList.contains('show')&&gm.phase!=='over'&&gm.phase!=='start'){
      return;
    }
    if(gm.phase==='start'||gm.phase==='over'){
      const b=panel.querySelector('button[data-act]');
      if(b) b.click();
    }
  }else if(e.code==='Escape'||e.code==='KeyP'){
    if(gm.phase!=='play') return;
    e.preventDefault();
    if(gm.paused) resumeGame(); else pauseGame();
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&gm.phase==='play'&&!gm.paused) pauseGame();
  gm.last=0;
});
window.addEventListener('pagehide',function(){
  try{ cancelAnimationFrame(gm.raf); }catch(e){}
  try{ if(AC&&AC.state==='running') AC.suspend(); }catch(e){}
});

/* ================= 启动 ================= */
/* 内嵌在百巴箱里时，向父页回报矿区色系，让顶部功能栏同色 */
try{ if(window.top!==window.self) parent.postMessage({gbTheme:'gold'},'*'); }catch(e){}
/* 供首页「新版本自动刷新」判断：一局进行中（含暂停、过关过渡）不刷新，避免半途打断 */
window.__gmState=function(){ return gm.phase; };
function applyLangStatic(){
  document.title=t('docTitle');
  hintEl.textContent=t('hint');
  pauseBtn.setAttribute('aria-label', t('pause'));
  pauseBtn.title=t('pause');
  updateFoot();
}
applyLangStatic();
resize();
// 先抽一位矿工给开始面板展示
resetRng();
gm.miner=pickMiner();
minerAv.innerHTML=avatarHTML(gm.miner);
minerName.textContent=gm.miner.name;
showStart();
gm.raf=requestAnimationFrame(loop);

})();
</script>
