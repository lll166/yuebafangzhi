<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eff6f4">
<title>月巴螺旋跳 · Helix Banny</title>
<style>
  :root{
    --bg:#eff6f4; --bg2:#e4efec;
    --line:rgba(18,110,100,.18); --line2:rgba(18,110,100,.42);
    --text:#173f3d; --dim:#5d8381;
    --accent:#12a08a; --accent2:#0b8b76;
    --danger:#d94a38; --danger2:#b8372a;
    --panel:rgba(255,255,255,.97); --panel2:rgba(238,248,245,.99);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);}
  body{font-family:"SF Mono","Cascadia Mono",Consolas,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;overscroll-behavior:none;display:flex;justify-content:center;}
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 82% at 50% 6%,transparent 50%,rgba(23,63,61,.10) 100%);}

  #app{position:relative;z-index:1;width:min(100vw,540px);height:100%;
    display:flex;flex-direction:column;
    padding:calc(6px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));}

  /* ---------- 顶栏 ---------- */
  #topbar{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 2px;}
  .brand{font-size:13px;font-weight:900;letter-spacing:2px;white-space:nowrap;}
  .brand b{color:var(--accent2);font-weight:900;text-shadow:0 0 14px rgba(18,160,138,.24);}
  .stats{display:flex;align-items:center;gap:5px;margin-left:auto;}
  .stat{display:flex;align-items:baseline;gap:4px;padding:4px 6px;
    border:1px solid var(--line);border-left:2px solid var(--line2);
    background:linear-gradient(180deg,#ffffff,#eef7f4);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  .stat span{font-size:7px;font-weight:800;letter-spacing:1px;color:var(--dim);}
  .stat b{display:inline-block;min-width:20px;font-size:13px;text-align:right;color:var(--accent2);
    font-variant-numeric:tabular-nums;}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  .stat b.pop{animation:pop .24s ease-out;}
  #comboStat{opacity:.45;transition:opacity .18s;}
  #comboStat.on{opacity:1;}
  #btnPause{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    font-size:10px;line-height:1;color:var(--accent2);cursor:pointer;padding:0;
    border:1px solid var(--line);background:linear-gradient(180deg,#ffffff,#eef7f4);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);}
  #btnPause:active{transform:scale(.94);}

  /* ---------- 舞台 ---------- */
  #frame{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#f7fbfa;
    border:1px solid var(--line2);
    box-shadow:0 10px 28px rgba(20,60,56,.12),inset 0 0 40px rgba(18,160,138,.04);}
  #cv{display:block;width:100%;height:100%;}
  #ballLayer{position:absolute;inset:0;z-index:3;pointer-events:none;}
  #ballWrap{position:absolute;left:0;top:0;width:56px;height:56px;transform-origin:50% 50%;
    will-change:transform;}
  #ballWrap.pierce::after{content:'';position:absolute;inset:-7px;border:2px dashed var(--accent);
    border-radius:50%;opacity:.9;animation:pierceSpin 2.4s linear infinite;}
  @keyframes pierceSpin{to{transform:rotate(360deg)}}
  body.low #ballWrap.pierce::after{animation:none;}
  #ball{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  #ball img{width:100%;height:100%;object-fit:contain;display:block;}
  #ball svg{width:100%;height:100%;display:block;}
  #frame .scan{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.4;
    background:repeating-linear-gradient(0deg,rgba(18,160,138,.05) 0 1px,transparent 1px 3px);}
  #frame::before{content:'';position:absolute;inset:5px;z-index:4;pointer-events:none;opacity:.5;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left top/2px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/2px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/2px 14px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/14px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/2px 14px no-repeat;}

  #countdown{position:absolute;left:0;right:0;top:38%;z-index:6;pointer-events:none;text-align:center;
    font-size:60px;font-weight:900;letter-spacing:4px;color:var(--accent2);opacity:0;
    text-shadow:0 0 24px rgba(18,160,138,.28),0 0 60px rgba(18,160,138,.14);}
  #countdown.show{opacity:1;}
  @keyframes cdPop{0%{transform:scale(.6);opacity:0}35%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
  #countdown.pop{animation:cdPop .34s ease-out;}

  #hintBar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;
    pointer-events:none;font-size:10px;letter-spacing:1.4px;color:var(--dim);white-space:nowrap;
    background:rgba(255,255,255,.92);border:1px solid var(--line);padding:5px 11px;opacity:0;
    transition:opacity .5s ease;}
  #hintBar.show{opacity:1;}

  #flash{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;background:var(--danger);}
  @keyframes flashIn{0%{opacity:.5}100%{opacity:0}}
  #flash.on{animation:flashIn .55s ease-out;}

  /* ---------- 弹层通用 ---------- */
  #overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
    padding:18px;background:radial-gradient(90% 70% at 50% 42%,rgba(228,242,238,.72),rgba(206,228,223,.92));}
  #overlay.show{display:flex;}
  .panel{position:relative;width:min(90%,340px);padding:18px 16px 15px;text-align:center;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line2);border-radius:3px;
    box-shadow:0 16px 40px rgba(20,60,56,.18),inset 0 0 30px rgba(18,160,138,.04);}
  .panel::before{content:'';position:absolute;inset:6px;pointer-events:none;opacity:.45;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/12px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left top/2px 12px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/12px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/2px 12px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/12px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/2px 12px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/12px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/2px 12px no-repeat;}
  .kicker{font-size:9px;font-weight:900;letter-spacing:4px;color:var(--accent);opacity:.92;}
  .ovTitle{font-size:24px;font-weight:900;letter-spacing:5px;margin:8px 0 4px;color:var(--accent2);
    text-shadow:0 0 18px rgba(18,160,138,.20),0 0 44px rgba(18,160,138,.09);}
  .ovBall{width:70px;height:70px;margin:4px auto 2px;display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 4px 8px rgba(20,60,56,.20));}
  .ovBall svg,.ovBall img{width:100%;height:100%;object-fit:contain;display:block;}
  .ovName{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--accent);margin-bottom:6px;}
  .ovSub{font-size:11px;line-height:1.7;color:var(--dim);margin:2px 0 8px;}
  .ovBest{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--accent2);
    margin:2px 0 12px;opacity:.95;}
  .ovNote{font-size:9px;line-height:1.6;color:rgba(93,131,129,.92);margin-top:9px;
    border-top:1px solid var(--line);padding-top:8px;}
  .ovHint{margin-top:9px;font-size:9px;letter-spacing:1px;color:rgba(93,131,129,.92);}
  .ovRow{display:flex;gap:8px;}
  .btnMain{flex:1 1 auto;padding:11px 0;cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:900;letter-spacing:2.5px;color:var(--accent2);
    border:1px solid rgba(11,139,118,.34);
    background:linear-gradient(180deg,#f7fdfb,#e2f4ef);
    box-shadow:0 3px 10px rgba(18,110,100,.10);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);}
  .btnMain:active{transform:translateY(1px);background:linear-gradient(180deg,#eefaf6,#d5eeea);}
  .btnGhost{flex:0 0 auto;padding:11px 12px;cursor:pointer;font-family:inherit;
    font-size:11px;font-weight:900;letter-spacing:1px;color:var(--accent2);
    border:1px solid var(--line2);background:linear-gradient(180deg,#ffffff,#eaf4f1);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);}
  .btnGhost:active{transform:translateY(1px);}
  .ovStats{display:flex;align-items:center;justify-content:center;gap:20px;margin:6px 0 12px;}
  .ovStats div{display:flex;flex-direction:column;gap:2px;}
  .ovStats span{font-size:8px;font-weight:800;letter-spacing:1.6px;color:var(--dim);}
  .ovStats b{font-size:19px;color:var(--accent2);font-variant-numeric:tabular-nums;
    text-shadow:0 0 12px rgba(18,160,138,.16);}
  .recBadge{display:inline-block;margin:0 0 9px;padding:3px 10px;font-size:9px;font-weight:900;
    letter-spacing:2px;color:#07332c;background:linear-gradient(180deg,#96efdb,#43d2b8);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  .dangerTxt{color:var(--danger2);}

  /* ---------- 选月巴 ---------- */
  #pickModal{position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;
    padding:14px;background:radial-gradient(90% 70% at 50% 42%,rgba(228,242,238,.82),rgba(206,228,223,.94));}
  #pickModal.show{display:flex;}
  .pkPanel{width:min(94%,380px);max-height:100%;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line2);border-radius:3px;
    box-shadow:0 16px 40px rgba(20,60,56,.18),inset 0 0 30px rgba(18,160,138,.04);}
  .pkTop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
    padding:11px 12px 9px;border-bottom:1px solid var(--line);}
  .pkKicker{font-size:8px;font-weight:900;letter-spacing:3px;color:var(--accent);opacity:.9;}
  .pkTitle{font-size:14px;font-weight:900;letter-spacing:2.5px;color:var(--accent2);margin-top:4px;}
  .pkTitle b{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--dim);margin-left:6px;}
  #pkClose{width:26px;height:26px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    padding:0;font-size:11px;color:var(--accent2);cursor:pointer;border:1px solid var(--line);
    background:linear-gradient(180deg,#ffffff,#eaf4f1);}
  #pkClose:active{transform:scale(.94);}
  .pkSearch{padding:8px 11px 0;}
  #pkInput{width:100%;padding:8px 10px;font-family:inherit;font-size:11px;letter-spacing:.5px;
    color:var(--text);background:#ffffff;border:1px solid var(--line);border-radius:2px;outline:none;
    -webkit-user-select:text;user-select:text;}
  #pkInput:focus{border-color:var(--line2);}
  #pkInput::placeholder{color:rgba(93,131,129,.55);}
  .pkGrid{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 11px;}
  @media (min-width:430px){ .pkGrid{grid-template-columns:repeat(4,1fr);} }
  .pkItem{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px 5px;min-width:0;
    cursor:pointer;font-family:inherit;color:var(--dim);
    background:#f6fbf9;border:1px solid var(--line);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);
    transition:transform .12s ease,border-color .12s ease,background .12s ease;}
  .pkItem .pkArt{width:40px;height:40px;display:flex;align-items:center;justify-content:center;}
  .pkItem .pkArt svg,.pkItem .pkArt img{width:100%;height:100%;object-fit:contain;display:block;}
  .pkItem .pkName{font-size:9px;font-weight:800;line-height:1.2;letter-spacing:0;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;}
  .pkItem.sel{color:var(--accent2);border-color:var(--accent);background:#d9f6ee;
    transform:translateY(-2px);box-shadow:0 0 14px rgba(18,160,138,.18);}
  .pkItem:active{transform:scale(.96);}
  #pkNone{display:none;padding:18px 0;text-align:center;font-size:10px;letter-spacing:1px;color:var(--dim);}
  .pkFoot{display:flex;gap:8px;padding:9px 11px 12px;border-top:1px solid var(--line);}
  .pkFoot .btnGhost{flex:0 0 auto;}
  .pkFoot .btnMain{flex:1 1 auto;}

  /* ---------- 低功耗 ---------- */
  body.low #frame .scan{display:none;}
  body.low #countdown{text-shadow:none;}
  body.low .ovTitle{text-shadow:none;}
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="brand">月巴<b>螺旋跳</b></div>
    <div class="stats">
      <div class="stat"><span id="lblDepth">DEPTH</span><b id="depthEl">0</b></div>
      <div class="stat"><span id="lblBest">BEST</span><b id="bestEl">0</b></div>
      <div class="stat" id="comboStat"><span id="lblCombo">COMBO</span><b id="comboEl">0</b></div>
    </div>
    <button id="btnPause" aria-label="pause">❙❙</button>
  </div>

  <div id="frame">
    <canvas id="cv"></canvas>
    <div id="ballLayer"><div id="ballWrap"><div id="ball"></div></div></div>
    <div class="scan"></div>
    <div id="countdown"></div>
    <div id="hintBar"></div>
    <div id="flash"></div>
  </div>
</div>

<div id="overlay"><div id="ovPanel" class="panel"></div></div>

<div id="pickModal">
  <div class="pkPanel">
    <div class="pkTop">
      <div>
        <div class="pkKicker" id="pkKicker">// ROSTER //</div>
        <div class="pkTitle"><span id="pkTitle">选择月巴</span><b id="pkCount"></b></div>
      </div>
      <button id="pkClose">✕</button>
    </div>
    <div class="pkSearch"><input id="pkInput" type="search" autocomplete="off" spellcheck="false"></div>
    <div class="pkGrid" id="pkGrid"></div>
    <div id="pkNone"></div>
    <div class="pkFoot">
      <button class="btnGhost" data-act="pickback" id="pkBack">返 回</button>
      <button class="btnMain" data-act="pickok" id="pkOk">确 定</button>
    </div>
  </div>
</div>

  for (var i = 0; i < list.length; i++){
    var it = normItem(list[i]);
    if (it.id) ROSTER.push(it);
  }
  if (!ROSTER.length) { ROSTER = fallbackRoster(); FALLBACK = true; }
  var ok = false;
  for (var j = 0; j < ROSTER.length; j++){ if (ROSTER[j].id === PICK_ID) { ok = true; break; } }
  if (!ok) PICK_ID = ROSTER[0].id;
  save.pick = PICK_ID;
  persist();
  refreshBall();
  if (state === 'menu') showStart();
  if (pickModal.classList.contains('show')) renderPick();
}
function currentItem(){

}
function ballHTML(it, lazy){

    return '<img src="' + esc(it.art) + '" alt="" decoding="async"'
      + (lazy ? ' loading="lazy"' : '')

}
/* 外链图加载失败（离线 / 图床不可达）→ 就地换回默认 SVG，避免出现破图 */
document.addEventListener('error', function(e){

  if (!t || t.tagName !== 'IMG' || !t.hasAttribute || !t.hasAttribute('data-fb')) return;

}, true);
function computeBallSize(){

function setPick(id){

/* =========================================================
   PART 4 · 音效
   ========================================================= */
var AC = null, master = null, toneCount = 0;
function initAudio(){
  if (AC) return;
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try {
    AC = new Ctor();
    master = AC.createGain();
    master.gain.value = 0.62;
    master.connect(AC.destination);
  } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, delay, slideTo){
  if (MUTED) return;
  initAudio();
  if (!AC) return;
  if (AC.state === 'suspended'){ try { AC.resume(); } catch (e) {} }
  var now = AC.currentTime + (delay || 0);
  if (toneCount > 7) toneCount = 0;
  toneCount++;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, now);
  if (slideTo) { try { o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), now + dur); } catch (e) {} }
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.1), now + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(master);
  o.start(now); o.stop(now + dur + 0.03);
}
function sfxTick(n){ tone(430 + n * 95, 0.07, 'square', 0.045); }
var noiseBuf = null;
function noiseSrc(){
  if (!AC) return null;
  if (!noiseBuf){
    var n = Math.floor(AC.sampleRate * 0.4);
    noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  var s = AC.createBufferSource();
  s.buffer = noiseBuf;
  return s;
}
/* 吧唧吧唧的水声：带通噪声快速下滑 */
function squish(freq, dur, vol, delay){
  if (MUTED) return;
  initAudio();
  if (!AC) return;
  if (AC.state === 'suspended'){ try { AC.resume(); } catch (e) {} }
  var s = noiseSrc();
  if (!s) return;
  var now = AC.currentTime + (delay || 0);
  var bp = AC.createBiquadFilter();
  bp.type = 'bandpass';
  bp.Q.value = 1.5;
  bp.frequency.setValueAtTime(freq, now);
  try { bp.frequency.exponentialRampToValueAtTime(Math.max(120, freq * 0.30), now + dur); } catch (e) {}
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.08), now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  s.connect(bp); bp.connect(g); g.connect(master);
  s.start(now); s.stop(now + dur + 0.03);
}
function sfxCrack(){
  if (MUTED) return;
  initAudio();
  if (!AC) return;
  if (AC.state === 'suspended'){ try { AC.resume(); } catch (e) {} }
  var s = noiseSrc();
  if (!s) return;
  var now = AC.currentTime;
  var hp = AC.createBiquadFilter();
  hp.type = 'highpass';
  hp.frequency.value = 3000;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.018, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
  s.connect(hp); hp.connect(g); g.connect(master);
  s.start(now); s.stop(now + 0.16);
}
function sfxPass(n){
  var m = Math.min(n, 10);
  tone(500 * Math.pow(1.035, m), 0.13, 'sine', 0.055);
  tone(760 * Math.pow(1.035, m), 0.10, 'sine', 0.03, 0.03);
  squish(1700, 0.22, 0.085, 0);
  squish(760, 0.26, 0.06, 0.02);
  sfxCrack();
}
function sfxBounce(){
  tone(520, 0.09, 'sine', 0.05, 0, 700);
  tone(880, 0.055, 'triangle', 0.022, 0.02, 990);
  squish(1650, 0.14, 0.06);
  squish(1050, 0.12, 0.032, 0.015);
}
function sfxSpring(){
  tone(360, 0.20, 'sine', 0.055, 0, 720);
  squish(1300, 0.18, 0.05);
}
function sfxDrill(){
  tone(260, 0.12, 'sine', 0.045, 0, 170);
  tone(430, 0.09, 'triangle', 0.025, 0.03, 310);
  squish(820, 0.18, 0.06);
}
function sfxDeath(){
  tone(210, 0.45, 'triangle', 0.10, 0, 70);
  tone(105, 0.60, 'sine', 0.07, 0.05, 50);
  squish(520, 0.34, 0.07);
}
function sfxRecord(){
  tone(880, 0.12, 'sine', 0.11);
  tone(1320, 0.16, 'sine', 0.09, 0.1);
}

/* =========================================================
   PART 5 · 游戏状态
   ========================================================= */
var state = 'menu';                 /* menu | countdown | playing | paused | dead */
var rings = [], genTo = 0;
var depth = 0, combo = 0, maxCombo = 0, pierce = 0;
var by = -1.4, vy = 0;
var rot = 0, rotV = 0, spinT = 0;
var sq = 0, sqV = 0, shake = 0, particles = [], shards = [];
var puddleWet = 0, ripples = [], puddles = [], drips = [];
var running = false, raf = 0, lastT = 0;
var deadTimer = 0, cdToken = 0, hintTimer = 0;
var newRec = false, comboOn = false;

function gapDeg(d){
  if (d < 10) return 95 - 7 * (d / 10);
  if (d < 30) return 88 - 12 * ((d - 10) / 20);
  if (d < 60) return 76 - 14 * ((d - 30) / 30);
  if (d < 120) return 62 - 10 * ((d - 60) / 60);
  return Math.max(46, 52 - 6 * ((d - 120) / 120));
}
function redCount(d){ return d >= 60 ? 2 : (d >= 10 ? 1 : 0); }
/* 红色危险区宽度：开局很窄，随深度慢慢变宽 */
function redWidth(d){
  return Math.min(1.05, 0.15 + Math.max(0, d - 10) * 0.0072);
}
function spinChance(d){
  if (d >= 120) return 0.6;
  if (d >= 60) return 0.45;
  if (d >= 40) return 0.3;
  return 0;
}
function makeRed(gapA, gapW, n, idx){
  var margin = 12 * D2R;
  var start = gapA + gapW / 2 + margin;
  var avail = TWO - gapW - 2 * margin;
  var out = [];
  var cap = redWidth(idx);
  for (var k = 0; k < n; k++){
    var slot = avail / n;
    var segW = Math.min(slot * 0.62, cap * (0.80 + Math.random() * 0.40));
    var pad = (slot - segW) * Math.random();
    out.push({ a0: start + slot * k + pad, w: segW });
  }
  return out;
}
function makeRing(idx, prev){
  var r = { idx: idx, y: idx, gapA: 0, gapW: 95 * D2R, red: [], spinA: 0, spinRate: 0, items: [] };
  if (idx < 3){
    r.gapA = prev ? prev.gapA : 0;
    r.gapW = 100 * D2R;
    return r;
  }
  r.gapW = gapDeg(idx) * D2R;
  r.gapA = (prev ? prev.gapA : 0) + (Math.random() * 2 - 1) * 55 * D2R;
  var n = redCount(idx);
  if (n > 0) r.red = makeRed(r.gapA, r.gapW, n, idx);
  var p = spinChance(idx);
  if (p > 0 && Math.random() < p){
    r.spinRate = (Math.random() < 0.5 ? -1 : 1) * (0.22 + Math.random() * 0.18);
  }
  if (idx >= 5 && Math.random() < 0.24){
    var it = makeItem(r);
    if (it) r.items.push(it);
  }
  return r;
}
/* 跳板道具：钻头（奖励，破板） / 弹簧（妨碍，向上弹飞） */
function makeItem(r){
  var margin = 0.20;
  for (var tries = 0; tries < 16; tries++){
    var a = Math.random() * TWO;
    if (Math.abs(wrapPi(a - r.gapA)) < r.gapW / 2 + margin) continue;
    var ok = true;
    for (var i = 0; i < r.red.length; i++){
      var d = wrapPi(a - r.red[i].a0);
      if (d > -margin && d < r.red[i].w + margin){ ok = false; break; }
    }
    if (!ok) continue;
    return { a: a, t: Math.random() < 0.45 ? 'drill' : 'spring' };
  }
  return null;
}
function ringByIndex(idx){
  for (var i = 0; i < rings.length; i++){ if (rings[i].idx === idx) return rings[i]; }
  return null;
}
function ensureRings(){
  var last = rings.length ? rings[rings.length - 1] : null;
  var guard = 0;
  while (genTo < depth + AHEAD && guard++ < 80){
    var r = makeRing(genTo, last);
    rings.push(r);
    last = r;
    genTo++;
  }
  if (rings.length > 34){
    var cut = depth - 5;
    var keep = [];
    for (var i = 0; i < rings.length; i++){ if (rings[i].idx > cut) keep.push(rings[i]); }
    rings = keep;
  }
}
function inRed(r, localA){
  for (var i = 0; i < r.red.length; i++){
    var z = r.red[i];
    var d = wrapPi(localA - z.a0);
    if (d >= 0 && d <= z.w) return true;
  }
  return false;
}

/* =========================================================
   PART 6 · 物理 / 判定
   ========================================================= */
function passRing(r){
  depth++;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  r.passed = true;
  r.broken = true;
  shatterRing(r);
  burstMint();
  splashWhite(14);
  dripWhite(4);
  pushPuddle(r, 0.92);
  sq = 0.45; sqV = 0;
  sfxPass(combo);
  depthEl.textContent = depth;
  popEl(depthEl);
  ensureRings();
  if (depth >= MAXD){ endRun(true); }
}
function bounceRing(r){
  by = r.y - 0.055;
  vy = -VBOUNCE;
  combo = 0;
  sq = 1; sqV = 0;
  splashWhite(18);
  dripWhite(5);
  pushPuddle(r, 1.06);
  if (!LOW) shake = Math.max(shake, 2.6);
  sfxBounce();
}
function springRing(r){
  by = r.y - 0.05;
  vy = -VBOUNCE * 1.85;
  combo = 0;
  sq = 1; sqV = 0;
  splashWhite(20);
  dripWhite(6);
  pushPuddle(r, 1.2);
  if (!LOW) shake = Math.max(shake, 4);
  sfxSpring();
}
function itemAt(r, localA){
  for (var i = 0; i < r.items.length; i++){
    if (Math.abs(wrapPi(r.items[i].a - localA)) <= 0.17) return r.items[i];
  }
  return null;
}
function takeItem(r, it){
  var i = r.items.indexOf(it);
  if (i >= 0) r.items.splice(i, 1);
}
function syncPierce(){
  ballWrap.classList.toggle('pierce', pierce > 0);
}
function resolveCross(r){
  var tower = rot + r.spinA;
  var localA = wrapPi(-tower);
  if (inRed(r, localA)){ die(); return; }
  var it = itemAt(r, localA);
  if (it){
    takeItem(r, it);
    if (it.t === 'drill'){
      pierce = 2;
      syncPierce();
      drillBurst();
      sfxDrill();
      passRing(r);
      return;
    }
    springRing(r);
    return;
  }
  var gapD = Math.abs(wrapPi(r.gapA - localA));
  if (gapD <= r.gapW / 2){
    passRing(r);
  } else if (pierce > 0){
    pierce--;
    syncPierce();
    drillBurst();
    sfxDrill();
    passRing(r);
  } else {
    bounceRing(r);
  }
}
function die(){
  if (state !== 'playing') return;
  sq = 1;
  if (!LOW) shake = 11;
  flashEl.classList.remove('on');
  void flashEl.offsetWidth;
  flashEl.classList.add('on');
  burstRed();
  endRun(false);
}
function endRun(capped){
  if (state !== 'playing') return;
  state = 'dead';
  sfxDeath();
  newRec = depth > best;
  if (newRec) best = depth;
  save.best = best;
  save.runs = (save.runs || 0) + 1;
  save.totalDepth = (save.totalDepth || 0) + depth;
  if (maxCombo > (save.bestCombo || 0)) save.bestCombo = maxCombo;
  persist();
  bestEl.textContent = best;
  clearTimeout(deadTimer);
  deadTimer = setTimeout(function(){ showGameOver(capped); }, 680);
}
function burstMint(){
  if (LOW) return;
  for (var i = 0; i < 9; i++){
    var a = Math.random() * TWO;
    particles.push({
      x: CX + Math.cos(a) * R * 0.55,
      y: CY + R * E,
      vx: (Math.random() - 0.5) * 170,
      vy: -50 - Math.random() * 120,
      life: 1, c: '#12a08a', r: 1.5 + Math.random() * 2
    });
  }
  trimParticles();
}
function burstRed(){
  if (LOW) return;
  for (var i = 0; i < 14; i++){
    var a = Math.random() * TWO;
    particles.push({
      x: CX + Math.cos(a) * R * 0.4,
      y: CY + R * E,
      vx: (Math.random() - 0.5) * 260,
      vy: -70 - Math.random() * 160,
      life: 1, c: Math.random() < 0.6 ? '#d94a38' : '#e8806f', r: 1.8 + Math.random() * 2.4
    });
  }
  trimParticles();
}
/* 吧唧一下溅起的白色水花（脚底向两侧溅），同时在地面留下水迹 */
function splashWhite(n){
  var fy = footY();
  puddleWet = Math.min(1, puddleWet + 0.16);
  if (ripples.length > 5) ripples.shift();
  ripples.push({ r: 0, life: 1 });
  if (LOW) return;
  for (var i = 0; i < n; i++){
    var dir = (i % 2) ? 1 : -1;
    particles.push({
      x: CX + (Math.random() - 0.5) * ballSize * 0.34,
      y: fy,
      vx: dir * (55 + Math.random() * 190),
      vy: -12 - Math.random() * 110,
      life: 1, c: Math.random() < 0.7 ? '#ffffff' : '#eefbf8', r: 2.2 + Math.random() * 3
    });
  }
  trimParticles();
}
function footY(){ return CY + R * E * 0.92 + ballSize * 0.46; }
/* 每次触板在对应塔层留下水迹（随塔上滚，走过的地方一直保留到滚出画面） */
function pushPuddle(r, k){
  puddles.push({ y: r.y + 0.18, ox: (Math.random() - 0.5) * ballSize * 0.52, k: k || 1 });
  var cut = by - 6.6;
  for (var i = puddles.length - 1; i >= 0; i--){
    if (puddles[i].y < cut) puddles.splice(i, 1);
  }
}
function drawTrailPuddles(){
  for (var i = puddles.length - 1; i >= 0; i--){
    var p = puddles[i];
    var dy = p.y - by;
    if (dy < -6.4 || dy > 7.6) continue;
    var sy = CY + dy * K;
    var s = clamp(1 - dy * 0.070, 0.42, 1.12);
    var fade = dy < 0 ? clamp(1 + dy / 6.4, 0, 1) : clamp(1 - Math.max(0, dy) * 0.135, 0.15, 1);
    var rx = ballSize * 0.60 * p.k * s;
    var ry = rx * 0.30;
    var px = CX + p.ox * s;
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = 0.42 * fade;
    ctx.beginPath();
    ctx.ellipse(px, sy, rx, ry, 0, 0, TWO);
    ctx.fill();
    ctx.globalAlpha = 0.62 * fade;
    ctx.beginPath();
    ctx.ellipse(px - rx * 0.20, sy - ry * 0.08, rx * 0.44, ry * 0.56, 0, 0, TWO);
    ctx.fill();
    ctx.globalAlpha = 0.50 * fade;
    ctx.beginPath();
    ctx.ellipse(px + rx * 0.31, sy + ry * 0.14, rx * 0.30, ry * 0.40, 0, 0, TWO);
    ctx.fill();
    /* 溅开的小水珠，让痕迹不那么规整 */
    for (var d = 0; d < 3; d++){
      var dxs = [-1.06, 1.02, 0.72][d] * rx;
      var dys = [-0.34, 0.30, -0.44][d] * ry;
      ctx.globalAlpha = 0.55 * fade;
      ctx.beginPath();
      ctx.ellipse(px + dxs, sy + dys, rx * 0.10, ry * 0.30, 0, 0, TWO);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
/* 脚底往下滴的白色液体 */
function dripWhite(n){
  var fy = footY();
  for (var i = 0; i < n; i++){
    drips.push({
      x: CX + (Math.random() - 0.5) * ballSize * 0.5,
      y: fy + Math.random() * ballSize * 0.12,
      vy: 26 + Math.random() * 58,
      r: 1.4 + Math.random() * 2.0,
      life: 1
    });
  }
  if (drips.length > 26) drips.splice(0, drips.length - 26);
}
function stepDrips(dt){
  for (var i = drips.length - 1; i >= 0; i--){
    var d = drips[i];
    d.life -= dt * 0.85;
    if (d.life <= 0){ drips.splice(i, 1); continue; }
    d.vy += 150 * dt;
    d.y += d.vy * dt;
  }
}
function drawDrips(){
  ctx.fillStyle = '#ffffff';
  for (var i = 0; i < drips.length; i++){
    var d = drips[i];
    ctx.globalAlpha = Math.min(1, d.life * 1.2) * 0.8;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r, d.r * 1.7, 0, 0, TWO);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
/* 地面水迹：随落地次数变宽，带扩散涟漪 */
function drawPuddle(){
  if (puddleWet <= 0.015) return;
  var fy = footY() + ballSize * 0.12;
  var rx = ballSize * (0.62 + 0.40 * puddleWet);
  var ry = rx * 0.30;
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.34 * puddleWet;
  ctx.beginPath();
  ctx.ellipse(CX, fy, rx, ry, 0, 0, TWO);
  ctx.fill();
  ctx.globalAlpha = 0.58 * puddleWet;
  ctx.beginPath();
  ctx.ellipse(CX - rx * 0.18, fy - ry * 0.08, rx * 0.44, ry * 0.56, 0, 0, TWO);
  ctx.fill();
  ctx.globalAlpha = 0.46 * puddleWet;
  ctx.beginPath();
  ctx.ellipse(CX + rx * 0.31, fy + ry * 0.14, rx * 0.30, ry * 0.40, 0, 0, TWO);
  ctx.fill();
  ctx.globalAlpha = 0.55 * puddleWet;
  ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(CX, fy, rx * 0.96, ry * 0.96, 0, 0, TWO);
  ctx.stroke();
  ctx.globalAlpha = 0.30 * puddleWet;
  ctx.strokeStyle = 'rgba(126,182,172,.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(CX, fy, rx * 1.10, ry * 1.10, 0, 0, TWO);
  ctx.stroke();
  /* 溅到地面后残留的水珠 */
  for (var d = 0; d < 4; d++){
    var ddx = [-0.92, 0.88, -0.62, 0.58][d] * rx;
    var ddy = [-0.10, 0.06, 0.30, 0.26][d] * ry;
    ctx.globalAlpha = 0.62 * puddleWet;
    ctx.beginPath();
    ctx.ellipse(CX + ddx, fy + ddy, ballSize * 0.055, ballSize * 0.032, 0, 0, TWO);
    ctx.fill();
  }
  for (var i = 0; i < ripples.length; i++){
    var rp = ripples[i];
    ctx.globalAlpha = 0.34 * rp.life * puddleWet;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(CX, fy, ballSize * (0.62 + rp.r * 1.20), ballSize * (0.62 + rp.r * 1.20) * 0.30, 0, 0, TWO);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function trimParticles(){
  if (particles.length > 80) particles.splice(0, particles.length - 80);
}
/* 钻头破板时喷出的碎屑 */
function drillBurst(){
  if (LOW) return;
  for (var i = 0; i < 18; i++){
    var a = Math.random() * TWO;
    particles.push({
      x: CX + Math.cos(a) * R * 0.2,
      y: CY + R * E,
      vx: (Math.random() - 0.5) * 300,
      vy: -80 - Math.random() * 190,
      life: 1, c: Math.random() < 0.5 ? '#0b8b76' : (Math.random() < 0.6 ? '#ffffff' : '#7fd9c8'),
      r: 1.8 + Math.random() * 2.8
    });
  }
  trimParticles();
}
function trimList(a, max){
  if (a.length > max) a.splice(0, a.length - max);
}
/* 已通过（已路过）的圈直接崩裂：按环形采样生成碎片，径向飞散 */
function shatterRing(r){
  var dy = r.y - by;
  var sy = CY + dy * K;
  var s = clamp(1 - dy * 0.070, 0.42, 1.12);
  var rx = R * s, ry = R * E * s;
  var n = LOW ? 7 : 18;
  for (var i = 0; i < n; i++){
    var a = (i / n) * TWO + Math.random() * 0.14;
    var inner = 0.70 + Math.random() * 0.28;
    var px = CX + Math.sin(a) * rx * inner;
    var py = sy + Math.cos(a) * ry * inner;
    shards.push({
      x: px, y: py,
      vx: Math.sin(a) * (40 + Math.random() * 90) + (Math.random() - 0.5) * 70,
      vy: -30 - Math.random() * 90 + Math.cos(a) * 26,
      w: 7 + Math.random() * 11,
      h: 2.6 + Math.random() * 3.4,
      rot: Math.atan2(Math.cos(a) * ry, Math.sin(a) * rx),
      spin: (Math.random() - 0.5) * 10,
      life: 1,
      c: Math.random() < 0.32 ? '#ffffff' : '#a9cec7'
    });
  }
  trimList(shards, LOW ? 60 : 140);
}
function stepShards(dt){
  for (var i = shards.length - 1; i >= 0; i--){
    var s = shards[i];
    s.life -= dt * 0.85;
    if (s.life <= 0){ shards.splice(i, 1); continue; }
    s.vy += 520 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.rot += s.spin * dt;
  }
}
function stepParticles(dt){
  for (var i = particles.length - 1; i >= 0; i--){
    var p = particles[i];
    p.life -= dt * 1.5;
    if (p.life <= 0){ particles.splice(i, 1); continue; }
    p.vy += 520 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

/* =========================================================
   PART 7 · 渲染
   ========================================================= */
function annulus(cx, cy, rx, ry, ir, a0, a1){
  if (rx <= 0 || ry <= 0) return;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx, ry, 0, PI / 2 - a0, PI / 2 - a1, true);
  ctx.ellipse(cx, cy, rx * ir, ry * ir, 0, PI / 2 - a1, PI / 2 - a0, false);
  ctx.closePath();
}
function drawRing(r){
  if (r.broken) return;
  var dy = r.y - by;
  if (dy < -4.4 || dy > 7.6) return;
  var sy = CY + dy * K;
  var s = clamp(1 - dy * 0.070, 0.42, 1.12);
  var rx = R * s, ry = R * E * s;
  if (sy + ry < -14 || sy - ry > H + 10) return;

  var fade = clamp(1 - Math.max(0, dy) * 0.135, 0.15, 1);
  var th = Math.max(3.5, 10 * s);
  var tower = rot + r.spinA;
  var a0 = r.gapA + tower + r.gapW / 2;
  var a1 = r.gapA + tower + TWO - r.gapW / 2;
  var tint = 0.30 + 0.70 * fade;

  /* 侧面（制造厚度） */
  ctx.globalAlpha = tint;
  annulus(CX, sy + th, rx, ry, 0.70, a0, a1);
  ctx.fillStyle = '#9dc4bd';
  ctx.fill();

  /* 顶面 */
  ctx.fillStyle = 'rgb('
    + Math.round(211 - 35 * fade) + ','
    + Math.round(235 - 19 * fade) + ','
    + Math.round(228 - 20 * fade) + ')';
  annulus(CX, sy, rx, ry, 0.70, a0, a1);
  ctx.fill();
  ctx.strokeStyle = 'rgba(18,160,138,' + (0.10 + 0.30 * fade).toFixed(3) + ')';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  /* 红色危险区块 */
  for (var i = 0; i < r.red.length; i++){
    var z = r.red[i];
    var z0 = z.a0 + tower, z1 = z0 + z.w;
    annulus(CX, sy + th, rx, ry, 0.70, z0, z1);
    ctx.fillStyle = 'rgba(139,44,32,.72)';
    ctx.fill();
    annulus(CX, sy, rx, ry, 0.70, z0, z1);
    ctx.fillStyle = 'rgba(217,74,56,' + (0.74 + 0.24 * fade).toFixed(3) + ')';
    ctx.fill();
    ctx.strokeStyle = 'rgba(160,44,32,' + (0.35 + 0.5 * fade).toFixed(3) + ')';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  /* 缺口边缘高光 */
  ctx.globalAlpha = tint * 0.9;
  ctx.strokeStyle = 'rgba(11,139,118,' + (0.10 + 0.32 * fade).toFixed(3) + ')';
  ctx.lineWidth = 1.4;
  var e1 = r.gapA + tower + r.gapW / 2;
  var e2 = r.gapA + tower - r.gapW / 2;
  ctx.beginPath();
  ctx.moveTo(CX + Math.sin(e1) * rx * 0.70, sy + Math.cos(e1) * ry * 0.70);
  ctx.lineTo(CX + Math.sin(e1) * rx, sy + Math.cos(e1) * ry);
  ctx.moveTo(CX + Math.sin(e2) * rx * 0.70, sy + Math.cos(e2) * ry * 0.70);
  ctx.lineTo(CX + Math.sin(e2) * rx, sy + Math.cos(e2) * ry);
  ctx.stroke();

  /* 跳板道具：钻头（青）/ 弹簧（橙） */
  for (var m = 0; m < r.items.length; m++){
    var it = r.items[m];
    var ia = it.a + tower;
    var ix = CX + Math.sin(ia) * rx * 0.85;
    var iy = sy + Math.cos(ia) * ry * 0.85;
    var ir = Math.max(5, 8.5 * s);
    ctx.globalAlpha = tint;
    ctx.beginPath();
    ctx.arc(ix, iy, ir, 0, TWO);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = it.t === 'drill' ? '#0b8b76' : '#d9822b';
    ctx.stroke();
    ctx.globalAlpha = tint * 0.95;
    ctx.fillStyle = it.t === 'drill' ? '#0b8b76' : '#d9822b';
    ctx.font = '700 ' + (ir * 1.25).toFixed(1) + 'px ui-monospace,Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(it.t === 'drill' ? '▼' : '↑', ix, iy + ir * 0.06);
  }
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';

  ctx.globalAlpha = 1;
}
/* 崩裂后的环形碎片 */
function drawShards(){
  for (var i = 0; i < shards.length; i++){
    var s = shards[i];
    var w = s.w * (0.4 + 0.6 * s.life);
    ctx.save();
    ctx.globalAlpha = Math.min(1, s.life * 1.4);
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);
    ctx.fillStyle = s.c;
    ctx.fillRect(-w / 2, -s.h / 2, w, s.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
function makeBg(){
  bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.30, 8, W * 0.5, H * 0.30, Math.max(W, H) * 0.92);
  bgGrad.addColorStop(0, '#fbfdfc');
  bgGrad.addColorStop(0.55, '#f1f8f6');
  bgGrad.addColorStop(1, '#e2efeb');
}
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (!bgGrad) makeBg();
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (!LOW && shake > 0.4){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  for (var i = rings.length - 1; i >= 0; i--) drawRing(rings[i]);
  drawTrailPuddles();
  drawPuddle();
  for (var p = 0; p < particles.length; p++){
    var pt = particles[p];
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillStyle = pt.c;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.r, 0, TWO);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawDrips();

  drawShards();

  if (pierce > 0){
    var bxx = CX, byy = CY + R * E * 0.92 - ballSize * 0.86;
    ctx.globalAlpha = 0.95;
    ctx.font = '700 11px ui-monospace,Consolas,monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,.92)';
    ctx.strokeText('▼ ×' + pierce, bxx, byy);
    ctx.fillStyle = '#0b8b76';
    ctx.fillText('▼ ×' + pierce, bxx, byy);
    ctx.textAlign = 'start';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  positionBall(performance.now());
}
function positionBall(now){
  var hover = (state === 'countdown') ? Math.sin(now * 0.005) * 4 : 0;
  var x = CX;
  var y = CY + R * E * 0.92 + hover;
  var sqNow = (state === 'dead') ? Math.max(sq, 0.42) : sq;
  var sx = 1 + 0.32 * sqNow;
  var sy = 1 - 0.24 * sqNow;
  if (state === 'playing'){
    var stretch = Math.max(0, vy - 1.5) * 0.048;
    sy += Math.min(0.22, stretch);
    sx -= Math.min(0.10, stretch * 0.45);
  }
  var px = (x - ballSize / 2).toFixed(2);
  var py = (y - ballSize / 2).toFixed(2);
  var tf = LOW
    ? 'translate3d(' + px + 'px,' + py + 'px,0)'
    : 'translate3d(' + px + 'px,' + py + 'px,0) scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
  if (tf !== lastBallTf){ lastBallTf = tf; ballWrap.style.transform = tf; }
}

/* =========================================================
   PART 8 · 主循环
   ========================================================= */
function tick(dt){
  if (state === 'playing'){
    spinT += dt;

    if (keyDir) rot += keyDir * 3.4 * dt;
    if (rotV){
      rot += rotV * dt;
      rotV *= Math.exp(-2.6 * dt);
      if (Math.abs(rotV) < 0.02) rotV = 0;
    }
    rot = wrapPi(rot);

    vy += G * dt;
    if (vy > VMAX) vy = VMAX;
    var prevY = by;
    by += vy * dt;

    var guard = 0;
    while (guard++ < 4){
      var r = ringByIndex(depth);
      if (!r) break;
      if (!(prevY < r.y && by >= r.y)) break;
      prevY = r.y;
      resolveCross(r);
      if (state !== 'playing') break;
      if (by < r.y) break;
    }
  }

  if (shake > 0) shake = Math.max(0, shake - dt * 26);
  if (state === 'playing'){
    sqV += (-170 * sq - 13 * sqV) * dt;
    sq += sqV * dt;
    if (sq > 1.15){ sq = 1.15; sqV = 0; }
    if (sq < -0.5){ sq = -0.5; sqV = 0; }
  } else if (sq > 0){
    sq = Math.max(0, sq - dt * 5.2);
  }
  for (var ri = ripples.length - 1; ri >= 0; ri--){
    var rp = ripples[ri];
    rp.life -= dt * 1.9;
    rp.r += dt * 1.25;
    if (rp.life <= 0) ripples.splice(ri, 1);
  }
  stepShards(dt);
  stepParticles(dt);
  stepDrips(dt);
  if (comboEl.textContent !== String(combo)) comboEl.textContent = combo;
  var on = combo > 1;
  if (on !== comboOn){ comboOn = on; comboStat.classList.toggle('on', on); }
}
function loop(ts){
  if (!running) return;
  raf = requestAnimationFrame(loop);
  var dt = lastT ? Math.min((ts - lastT) / 1000, 0.05) : 0.016;
  lastT = ts;
  tick(dt);
  draw();
}
function startLoop(){
  if (running) return;
  running = true;
  lastT = 0;
  raf = requestAnimationFrame(loop);
}
function stopLoop(){
  running = false;
  if (raf) cancelAnimationFrame(raf);
  raf = 0;
}

/* =========================================================
   PART 9 · 流程
   ========================================================= */
function resetRun(){
  depth = 0; combo = 0; maxCombo = 0;
  by = -1.4; vy = 0; rot = 0; rotV = 0; spinT = 0;
  rings = []; genTo = 0;
  particles.length = 0;
  shards.length = 0;
  sq = 0; sqV = 0; shake = 0;
  puddleWet = 0; ripples.length = 0; puddles.length = 0; drips.length = 0;
  pierce = 0;
  syncPierce();
  newRec = false;
  ensureRings();
  depthEl.textContent = '0';
  comboEl.textContent = '0';
  bestEl.textContent = best;
  comboStat.classList.remove('on');
  hintBar.classList.remove('show');
}
function showStart(){
  state = 'menu';
  stopLoop();
  var it = currentItem();
  ovPanel.innerHTML = ''
    + '<div class="kicker">' + esc(t('readyKicker')) + '</div>'
    + '<div class="ovTitle">' + esc(t('readyTitle')) + '</div>'

    + '<div class="ovName">' + esc(it ? it.name : '') + '</div>'
    + '<div class="ovSub">' + esc(t('readySub')) + '</div>'
    + '<div class="ovBest">' + esc(tf(t('readyBest'), { n: best })) + '</div>'
    + '<div class="ovRow">'
    + '<button class="btnGhost" data-act="pick">' + esc(t('pick')) + '</button>'
    + '<button class="btnMain" data-act="start">' + esc(t('start')) + '</button>'
    + '</div>'
    + '<div class="ovHint">' + esc(t('readyHint')) + '</div>'
    + (FALLBACK ? '<div class="ovNote">' + esc(t('fallback')) + '</div>' : '');

  draw();
}
function hideOverlay(){
  overlay.classList.remove('show');
}
function startRun(){
  clearTimeout(deadTimer);
  cdToken++;
  resetRun();
  hideOverlay();
  refreshBall();
  state = 'countdown';
  startLoop();

  var tok = cdToken;
  var seq = ['3', '2', '1', t('go')];
  var idx = 0;
  countdownEl.classList.add('show');

  function step(){
    if (tok !== cdToken) return;
    if (idx >= seq.length){
      countdownEl.classList.remove('show');
      state = 'playing';
      if (!hintBar.textContent) hintBar.textContent = t('hint');
      hintBar.classList.add('show');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(function(){ hintBar.classList.remove('show'); }, 4200);
      return;
    }
    countdownEl.textContent = seq[idx];
    countdownEl.classList.remove('pop');
    void countdownEl.offsetWidth;
    countdownEl.classList.add('pop');
    sfxTick(idx);
    idx++;
    setTimeout(step, idx >= seq.length ? 400 : 600);
  }
  step();
}
function pauseGame(){
  if (state !== 'playing') return;
  state = 'paused';
  stopLoop();
  showPause();
}
function resumeGame(){
  if (state !== 'paused') return;
  hideOverlay();
  state = 'playing';
  lastT = 0;
  startLoop();
}

/* =========================================================
   PART 11 · 输入
   ========================================================= */
var drag = null, keyDir = 0;
frameEl.addEventListener('pointerdown', function(e){
  if (state !== 'playing') return;
  if (drag) return;
  drag = { id: e.pointerId, lastX: e.clientX, lastT: performance.now(), moved: false };
  try { frameEl.setPointerCapture(e.pointerId); } catch (err) {}
  hintBar.classList.remove('show');
});
frameEl.addEventListener('pointermove', function(e){
  if (!drag || e.pointerId !== drag.id) return;
  e.preventDefault();
  var now = performance.now();
  var dt = Math.max(1, now - drag.lastT) / 1000;
  var dx = e.clientX - drag.lastX;
  drag.lastX = e.clientX;
  drag.lastT = now;
  if (!dx) return;
  var dA = dx / R;
  rot += dA;
  rotV = clamp(dA / dt, -12, 12);
  drag.moved = true;
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  var idle = performance.now() - drag.lastT;
  drag = null;
  if (idle > 90) rotV = 0;
}
frameEl.addEventListener('pointerup', endDrag);
frameEl.addEventListener('pointercancel', endDrag);

document.addEventListener('keydown', function(e){
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight'){
    if (state !== 'playing') return;
    e.preventDefault();
    keyDir = (k === 'ArrowLeft') ? -1 : 1;
    hintBar.classList.remove('show');
  } else if (k === 'p' || k === 'P' || k === 'Escape'){
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  } else if (k === 'r' || k === 'R'){
    if (state === 'playing' || state === 'paused' || state === 'dead') startRun();
  }
});
document.addEventListener('keyup', function(e){
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') keyDir = 0;
});
btnPause.addEventListener('click', function(){
  if (state === 'playing') pauseGame();
  else if (state === 'paused') resumeGame();
});

/* =========================================================
   PART 12 · 尺寸 / 生命周期
   ========================================================= */
function resize(){
  var r = frameEl.getBoundingClientRect();
  W = Math.max(1, Math.round(r.width));
  H = Math.max(1, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W * 0.5;
  R = Math.min(W * 0.37, H * 0.25);
  K = clamp(H * 0.195, 66, 156);
  CY = H * 0.30;
  bgGrad = null;
  computeBallSize();
  draw();
}
if (window.ResizeObserver){
  new ResizeObserver(function(){ resize(); }).observe(frameEl);
} else {
  window.addEventListener('resize', resize);
}
window.addEventListener('orientationchange', function(){ setTimeout(resize, 120); });

document.addEventListener('visibilitychange', function(){
  if (document.hidden){
    if (state === 'playing') pauseGame();
    stopLoop();
  } else if (state === 'playing'){
    startLoop();
  }
});
window.addEventListener('pagehide', function(){ persist(); });

/* =========================================================
   PART 13 · 启动
   ========================================================= */
function boot(){
  var b1 = document.querySelector('.brand');
  if (b1) b1.innerHTML = esc(t('brand1')) + '<b>' + esc(t('brand2')) + '</b>';
  $('lblDepth').textContent = t('depth');
  $('lblBest').textContent = t('best');
  $('lblCombo').textContent = t('combo');
  $('pkKicker').textContent = t('pickKicker');
  $('pkTitle').textContent = t('pickTitle');
  pkInput.placeholder = t('pickPh');
  $('pkBack').textContent = t('pickBack');
  $('pkOk').textContent = t('pickOk');
  document.title = t('readyTitle') + ' · Helix Banny';

  bestEl.textContent = best;
  refreshBall();
  resetRun();
  resize();
  showStart();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
