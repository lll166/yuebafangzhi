<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>月巴记忆</title>
<style>
  :root{
    --paper:#F5F0E6; --paper2:#E8E1D1; --ink:#2B2723; --ink2:#6E6459;
    --accent:#D25B45; --ok:#5D8F78; --warn:#B8912F;
    --line:rgba(43,39,35,.30);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink);}
  body{font-family:"SF Mono","Cascadia Mono",Consolas,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:manipulation;overscroll-behavior:none;}
  /* 试卷纸点状纹理（纯 CSS，零图片） */
  body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:radial-gradient(rgba(43,39,35,.055) 1px,transparent 1px);
    background-size:8px 8px;}
  #stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));}
  #wrap{display:flex;flex-direction:column;gap:8px;width:min(96vw,460px);height:100%;max-height:780px;}

  /* 切角（借 snake.html 手法：单层 clip-path 小切角） */
  .cut{clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);}
  .cutL{clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);}
  /* 双层切角面板：外层当墨线，内层当纸面 */
  .panel{background:var(--ink);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);padding:2px;}
  .panel>.pin{background:var(--paper2);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

  /* ---------- 顶部 HUD（借 snake.html 同构：品牌 + 数据片 + 暂停） ---------- */
  #topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0;flex:0 0 auto;height:36px;padding:0 2px;}
  .brand{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:900;letter-spacing:2px;white-space:nowrap;}
  .brand .bpre{font-style:normal;color:var(--accent);}
  .stats{display:flex;align-items:stretch;gap:4px;margin-left:auto;flex:0 0 auto;}
  .stat{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:2px 7px;background:var(--paper2);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);}
  .stat span{font-size:8px;font-weight:800;letter-spacing:1.2px;color:var(--ink2);}
  .stat b{font-size:13px;line-height:1;text-align:right;font-variant-numeric:tabular-nums;}
  .stat b em{font-style:normal;color:var(--ink2);font-size:10px;}
  #btnPause{width:32px;height:32px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    background:var(--paper2);border:0;cursor:pointer;font:inherit;font-weight:900;color:var(--ink);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  #btnPause:active{transform:translate(1px,1px);}
  body.narrow .brand .bpre{display:none;}
  body.narrow .stat span{letter-spacing:.4px;}
  body.narrow .stat{padding:2px 5px;}

  /* ---------- 考官席 ---------- */
  #examiner{flex:0 0 auto;display:flex;align-items:stretch;gap:8px;height:64px;}
  #examiner .pin{flex-direction:row;align-items:stretch;gap:8px;padding:4px 6px;}
  #exAvatar{flex:0 0 56px;display:flex;align-items:center;justify-content:center;}
  #exAvatar img,#exAvatar .fb{width:44px;height:44px;object-fit:contain;image-rendering:pixelated;
    background:#FBFAF6;border:2px solid var(--ink);}
  #exAvatar .fb{display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:var(--ink);background:var(--fbc,#9e9e9e);}
  #exMain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;padding:2px 0;}
  #exName{font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--ink2);}
  #exBubble{position:relative;flex:1 1 auto;min-height:0;background:var(--paper2);border:2px solid var(--ink);
    padding:3px 8px;font-size:12px;font-weight:700;line-height:1.35;display:flex;align-items:center;}
  #exBubble::before{content:'';position:absolute;left:-7px;top:14px;width:8px;height:8px;background:var(--paper2);
    border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);}

  /* ---------- 卡盘 ---------- */
  #boardPanel{flex:1 1 auto;min-height:0;}
  #board{margin:auto;display:grid;gap:6px;--cs:72px;}
  .card{position:relative;border:0;background:transparent;padding:0;cursor:pointer;font:inherit;
    width:var(--cs);height:var(--cs);}
  .cflip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .25s ease-out;}
  .card.open .cflip{transform:rotateY(180deg);}
  .cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;}
  .ccover{background:var(--ink);
    background-image:repeating-linear-gradient(45deg,rgba(245,240,230,.13) 0 2px,transparent 2px 8px);
    display:flex;align-items:center;justify-content:center;}
  .ccover b{color:var(--paper);font-size:calc(var(--cs)*.22);letter-spacing:2px;font-weight:900;opacity:.85;}
  .cback{background:#FBFAF6;border:2px solid var(--ink);transform:rotateY(180deg);
    display:flex;align-items:center;justify-content:center;padding:3px;}
  .cback img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
  /* 兜底块：图鉴主色都是浅色系，字用墨色才看得清 */
  .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:calc(var(--cs)*.32);color:var(--ink);background:var(--fbc,#9e9e9e);}

  /* ---------- 底部 ---------- */
  #botbar{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;}
  .seg{display:flex;gap:4px;}
  .btn{flex:1 1 0;min-width:0;height:30px;display:flex;align-items:center;justify-content:center;gap:3px;
    background:var(--paper2);border:2px solid var(--ink);color:var(--ink);cursor:pointer;font:inherit;
    font-size:11px;font-weight:800;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%);}
  .btn:active{transform:translate(1px,1px);}
  .btn.on{background:var(--ink);color:var(--paper);}
  .btn.wide{flex:0 0 auto;padding:0 14px;}

  /* ---------- M2：判定 / 惩罚 / 结算 ---------- */
  #boardPanel .pin{position:relative;}
  .card.done{cursor:default;transform:translateY(2px);}
  .card.done .cback::after{content:'✓';position:absolute;right:3px;bottom:3px;width:34%;height:34%;
    display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--paper);
    font-weight:900;font-size:calc(var(--cs)*.15);transform:rotate(-12deg);
    box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent);}
  .bstamp{position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;
    width:72px;height:72px;margin:-36px 0 0 -36px;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:var(--paper);font-size:36px;font-weight:900;transform:rotate(-12deg);
    box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--accent);
    clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px);
    animation:stampIn .5s ease-out;}
  @keyframes stampIn{0%{transform:scale(2.2) rotate(8deg);opacity:0}
    55%{transform:scale(.92) rotate(-14deg);opacity:.95}
    75%{transform:scale(1.05) rotate(-11deg)}
    100%{transform:scale(1) rotate(-12deg);opacity:.92}}
  .splat{position:absolute;z-index:5;pointer-events:none;background:var(--ink);
    border-radius:46% 54% 52% 48%/52% 46% 54% 48%;
    animation:splatIn 2s ease-in forwards;}
  @keyframes splatIn{0%{transform:scale(.15);opacity:0}14%{transform:scale(1.08);opacity:.94}
    26%{transform:scale(1)}80%{opacity:.94}100%{opacity:0}}
  @keyframes exshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}
    50%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
  #examiner.shake .pin{animation:exshake .5s;}
  .fullOv{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
    background:rgba(43,39,35,.62);}
  .fullOv.show{display:flex;}
  #introCard,#settleCard{width:min(88vw,320px);padding:2px;}
  #introCard .pin,#settleCard .pin{padding:14px 12px;gap:8px;align-items:center;}
  #introAvatar{width:56px;height:56px;display:flex;align-items:center;justify-content:center;}
  #introAvatar img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;
    background:#FBFAF6;border:2px solid var(--ink);}
  #introAvatar .fb{width:48px;height:48px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:22px;color:var(--ink);background:var(--fbc,#9e9e9e);border:2px solid var(--ink);}
  #introName{font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--ink2);}
  #introText,#settleQuote{font-size:12px;font-weight:700;line-height:1.5;text-align:center;}
  .introBtns,.settleBtns{display:flex;gap:6px;width:100%;}
  #settleStamp{padding:4px 10px;border:3px solid currentColor;color:var(--ok);
    font-size:22px;font-weight:900;letter-spacing:6px;text-indent:6px;transform:rotate(-6deg);}
  #settleStamp.bad{color:var(--accent);}
  #settleRecord{display:none;color:var(--accent);font-weight:900;font-size:12px;letter-spacing:2px;}
  #settleRecord.show{display:block;animation:recIn .4s ease-out;}
  @keyframes recIn{0%{transform:scale(1.8) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
  #settleLines{width:100%;display:flex;flex-direction:column;gap:3px;}
  #settleLines .row{display:flex;justify-content:space-between;font-size:11px;font-weight:700;}
  #settleLines .row span{color:var(--ink2);}
  #settleLines .row b{font-variant-numeric:tabular-nums;}
  #settleDex{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%;}
  #settleDex .mini{width:26px;height:26px;background:#FBFAF6;border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #settleDex .mini img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
  #settleDex .mini .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:12px;color:var(--ink);background:var(--fbc,#9e9e9e);}
  #tomatoFlick{display:none;position:relative;width:36px;height:36px;margin:0 auto;}
  #tomatoFlick.show{display:block;animation:flick 1.1s ease-in .3s forwards;}
  #tomatoFlick::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--accent);
    box-shadow:inset -5px -5px 0 rgba(43,39,35,.22);}
  #tomatoFlick::after{content:'';position:absolute;top:1px;left:14px;width:8px;height:7px;background:var(--ok);
    clip-path:polygon(0 100%,50% 0,100% 100%);}
  @keyframes flick{0%{transform:translate(0,0) rotate(0)}20%{transform:translate(10px,-8px) rotate(24deg)}
    100%{transform:translate(170px,-54px) rotate(330deg);opacity:0}}

  /* ---------- M3：围观干扰 / 当堂重考 / 考官生气 / 罚抄橡皮 ---------- */
  #exAvatar{position:relative;}
  #examiner.angry #exAvatar img{filter:sepia(1) saturate(2.8) hue-rotate(-45deg) brightness(.92);}
  #examiner.angry #exAvatar::after{content:'怒';position:absolute;right:-6px;top:-6px;width:18px;height:18px;
    background:var(--accent);color:var(--paper);font-size:11px;font-weight:900;
    display:flex;align-items:center;justify-content:center;transform:rotate(12deg);
    box-shadow:0 0 0 2px var(--paper);}
  #examiner.angry .pin{animation:exshake .45s ease-in-out 2;}
  .crowd{position:absolute;left:0;right:0;height:50px;display:flex;gap:5px;align-items:center;
    z-index:6;pointer-events:none;animation:crowdPass 1.5s ease-in-out forwards;}
  @keyframes crowdPass{0%{transform:translateX(-115%)}100%{transform:translateX(115%)}}
  .crowd span{width:44px;height:44px;flex:0 0 auto;background:#FBFAF6;border:2px solid var(--ink);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .crowd span img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;}
  .crowd span .fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;color:var(--ink);background:var(--fbc,#9e9e9e);}
  .eraser{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
    background:rgba(43,39,35,.45);}
  #erCard{width:min(78vw,220px);padding:2px;}
  #erCard .pin{padding:10px;gap:6px;align-items:center;}
  #erCard h4{font-size:12px;font-weight:900;letter-spacing:2px;}
  #erBtn{width:88px;height:52px;background:var(--paper2);border:3px solid var(--ink);cursor:pointer;
    font:inherit;font-weight:900;letter-spacing:3px;font-size:16px;color:var(--ink2);
    clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);}
  #erBtn:active{transform:translate(2px,2px);}
  .erDots{display:flex;gap:4px;}
  .erDots i{width:10px;height:10px;background:var(--paper);border:2px solid var(--ink);}
  .erDots i.on{background:var(--accent);}
  #erCard p{font-size:9px;color:var(--ink2);}

  /* ---------- 暂停遮罩（M2 起同时冻结倒计时与输入） ---------- */
  #pauseOv{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    background:rgba(43,39,35,.55);}
  #pauseOv.show{display:flex;}
  #pauseCard{width:min(78vw,240px);text-align:center;padding:2px;}
  #pauseCard .pin{padding:16px 12px;gap:10px;align-items:center;}
  #pauseCard h3{font-size:15px;letter-spacing:4px;}
  #pauseCard p{font-size:10px;color:var(--ink2);}
  #btnResume{width:100%;height:32px;}

  @media (prefers-reduced-motion:reduce){
    .cflip{transition:none;}
    .bstamp,.splat,.crowd,#examiner.shake .pin,#examiner.angry .pin,#tomatoFlick.show,#settleRecord.show{animation:none!important;}
  }
  /* 父页下发的低功耗（M4 名册桥），效果同上 */
  body.lowpower .cflip{transition:none;}
  body.lowpower .bstamp,body.lowpower .splat,body.lowpower .crowd,
  body.lowpower #examiner.shake .pin,body.lowpower #examiner.angry .pin,
  body.lowpower #tomatoFlick.show,body.lowpower #settleRecord.show{animation:none!important;}
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">

    <!-- 顶部 HUD -->
    <header id="topbar">
      <b class="brand"><i class="bpre">MEM·</i>月巴记忆</b>
      <div class="stats">
        <div class="stat"><span>PAIRS</span><b id="stPairs">0<em>/8</em></b></div>
        <div class="stat"><span id="stResLabel">STEPS</span><b id="stRes">20</b></div>
        <div class="stat"><span>COMBO</span><b id="stCombo">×0</b></div>
        <div class="stat"><span>BEST</span><b id="stBest">--</b></div>
      </div>
      <button id="btnPause" type="button" aria-label="暂停">❚❚</button>
    </header>

    <!-- 考官席 -->
    <section id="examiner" class="panel" aria-label="考官席">
      <div class="pin">
        <div id="exAvatar"><img id="exImg" alt="考官月巴"></div>
        <div id="exMain">
          <div id="exName">监考 · WINK月巴</div>
          <div id="exBubble">番茄，认得这些月巴吗？两张一样的配一对——配错了，可要受罚的哦～</div>
        </div>
      </div>
    </section>

    <!-- 卡盘 -->
    <main id="boardPanel" class="panel">
      <div class="pin"><div id="board"></div></div>
    </main>

    <!-- 底部：考级 / 模式 / 重开 -->
    <footer id="botbar">
      <div class="seg" id="segDiff"></div>
      <div class="seg">
        <div class="seg" id="segMode" style="flex:1;"></div>
        <button class="btn wide" id="btnRestart" type="button">↻ 重开</button>
      </div>
    </footer>

  </div>
</div>

<!-- 暂停遮罩（M2 起同时冻结倒计时与输入） -->
<div id="pauseOv">
  <div id="pauseCard" class="panel"><div class="pin">
    <h3>暂停中</h3>
    <p>月巴考官在等你翻牌……</p>
    <button class="btn on" id="btnResume" type="button">▶ 继续考试</button>
  </div></div>
</div>

<!-- 开场白（每存档一次，可跳过） -->
<div id="introOv" class="fullOv">
  <div id="introCard" class="panel"><div class="pin">
    <div id="introAvatar"></div>
    <div id="introName">监考 · WINK月巴</div>
    <div id="introText"></div>
    <div class="introBtns">
      <button class="btn" id="btnIntroSkip" type="button">跳过</button>
      <button class="btn on" id="btnIntroNext" type="button">继续 ▶</button>
    </div>
  </div></div>
</div>

<!-- 结算：合格成绩单 / 不合格弹脑门 -->
<div id="settleOv" class="fullOv">
  <div id="settleCard" class="panel"><div class="pin">
    <div id="settleStamp">合格</div>
    <div id="settleRecord">★ 新纪录 ★</div>
    <div id="tomatoFlick"></div>
    <div id="settleLines"></div>
    <div id="settleDex"></div>
    <div id="settleQuote"></div>
    <div class="settleBtns">
      <button class="btn on" id="btnAgain" type="button">↻ 再考一次</button>
      <button class="btn" id="btnSettleBack" type="button">返回</button>
    </div>
  </div></div>
</div>

<script>
'use strict';
/* ============================================================
   月巴记忆 M5：上线版
   - M1 试卷纸骨架 / M2 核心玩法 / M3 惩罚完整 / M4 首页接入
   - M5：四语（zh/en/ja/ko，照 snake.html 的 TXT/t() 口径）
   调试：?nofetch=1 强制所有立绘走「加载失败」分支（断网验收用）
   ============================================================ */

const $=function(s){ return document.querySelector(s); };
const SAVE_KEY='yueba-memory-v1';

/* 考级四档：cols×rows 盘面；steps/time 为资源基准。
   M3 调参：限时高档位收紧（60/85/110/135），约 11s/对，仍是宽松通关预算 */
const DIFFS=[
  {key:'quiz', name:'随堂小考', cols:4, rows:3, pairs:6,  steps:15, time:60},
  {key:'unit', name:'单元测验', cols:4, rows:4, pairs:8,  steps:20, time:85},
  {key:'mid',  name:'期中考试', cols:5, rows:4, pairs:10, steps:26, time:110},
  {key:'final',name:'期末大考', cols:6, rows:4, pairs:12, steps:32, time:135},
];
const MODES=[
  {key:'step', stat:'STEPS'},
  {key:'time', stat:'TIME'},
];
const EXAMINER_ID='mb_xin'; /* 考官：wink月巴（codex 同款） */

/* ---------- 多语言（照 snake.html 的 TXT/t() 口径：zh 兜底；
   语言解析：?lang= → 主存档只读 lang → 浏览器语言；父页名册可再覆盖） ---------- */
const TXT={
  zh:{
    docTitle:'月巴记忆', brand:'月巴记忆', exName:'监考 · WINK月巴',
    restart:'↻ 重开', again:'↻ 再考一次', back:'返回',
    skip:'跳过', next:'继续 ▶', startExam:'开考！▶', resume:'▶ 继续考试',
    pauseAria:'暂停', pauseTitle:'暂停中', pauseSub:'月巴考官在等你翻牌……',
    stampOk:'合格', stampBad:'不合格', record:'★ 新纪录 ★',
    rExam:'考级', rStepsLeft:'剩余步数', rTimeLeft:'剩余用时', rCombo:'最大连击', rPenalty:'受罚',
    unitStep:' 步', unitSec:' 秒', unitTimes:' 次',
    erTitle:'罚抄 ×5！', erBtn:'擦', erHint:'快点擦掉，不然墨渍干透（{n} 秒）',
    cardAria:'卡牌',
    d_quiz:'随堂小考', d_unit:'单元测验', d_mid:'期中考试', d_final:'期末大考',
    m_step:'限步', m_time:'限时',

function artOf(id){
  if(POOL){ const p=POOL[id]; return p?{url:p.url,color:p.color,name:p.name||id}:null; }
  const e=DEX_ART[id];
  return e?{url:e[0],color:e[1],name:e[2]||id}:null;
}
/* 卡池来源：父页名册（已解锁过滤）优先；离线/独立打开回退内置 DEX_ART 全量 */
function poolEntries(){
  if(POOL){
    return Object.keys(POOL).map(function(id){ return {id:id,url:POOL[id].url,color:POOL[id].color,name:POOL[id].name}; });
  }
  return Object.keys(DEX_ART).map(function(id){ const e=DEX_ART[id]; return {id:id,url:e[0],color:e[1],name:e[2]||id}; });
}
/* 兜底块：主色 + 名字首字（图没了游戏照样能玩） */
function fbHTML(a){
  return '<div class="fb" style="--fbc:'+((a&&a.color)||'#9e9e9e')+'">'+fallbackChar(a?a.name:'')+'</div>';
}
/* 往 el 里放立绘：img 失败重试一次 → 仍失败换兜底块；nofetch 直接全员兜底 */
function mountArt(el,id){
  const a=artOf(id);
  if(!a||a.url===''||NOFETCH){ el.innerHTML=fbHTML(a); return; }
  el.innerHTML='';
  const img=document.createElement('img');
  img.alt=a.name; img.loading='lazy'; img.decoding='async';
  let retried=false;
  img.onerror=function(){
    if(!retried){ retried=true; setTimeout(function(){ img.src=a.url; },300); return; }
    el.innerHTML=fbHTML(a);
  };
  img.src=a.url;
  el.appendChild(img);
}

/* ---------- 音效（WebAudio 零素材；muted 只读主存档，M4 起由父页桥覆盖） ---------- */
const SOUND=(function(){
  let ctx=null, muted=false;
  try{
    const main=JSON.parse(localStorage.getItem('idle-yueba-save-v2')||'null');
    if(main&&main.muted) muted=true;               /* 只读，绝不写主存档 */
  }catch(e){}
  function ac(){
    if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(ctx&&ctx.state==='suspended'){ const p=ctx.resume(); if(p&&p.catch) p.catch(function(){}); }
    return ctx;
  }
  function tone(f,dur,type,vol,at){
    const c=ac(); if(!c||muted) return;
    const t=c.currentTime+(at||0);
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.05,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t+dur+.02);
  }
  return {
    setMuted:function(v){ muted=!!v; },            /* M4 桥接入口 */
    get muted(){ return muted; },
    flip:function(){ tone(660,.05,'square',.03); },
    match:function(){ tone(523,.09,'square',.05); tone(784,.12,'square',.05,.09); },
    wrong:function(){ tone(196,.2,'sawtooth',.06); },
    stamp:function(){ tone(98,.09,'square',.08); },
    win:function(){ [523,659,784,1046].forEach(function(f,i){ tone(f,.12,'square',.05,i*.11); }); },
    lose:function(){ [330,247,175].forEach(function(f,i){ tone(f,.16,'sawtooth',.05,i*.14); }); },
    reshuffle:function(){ tone(220,.08,'square',.06); tone(180,.08,'square',.06,.09); }
  };
})();

/* ---------- 台词池：已并入 TXT（zh/en/ja/ko），line() 按当前语言取 ---------- */
function rand(a){ return a[(Math.random()*a.length)|0]; }

/* ---------- 状态 ---------- */
let diff=DIFFS[0], mode=MODES[0];
if(DIFFS.some(function(d){ return d.key===SAVE.settings.diff; })) diff=DIFFS.filter(function(d){ return d.key===SAVE.settings.diff; })[0];
if(MODES.some(function(m){ return m.key===SAVE.settings.mode; })) mode=MODES.filter(function(m){ return m.key===SAVE.settings.mode; })[0];
let deck=[];        /* [{id,uid}] 两两成对后洗牌 */
let st=null;        /* {phase,res,matched,combo,maxCombo,penalties,first,lock} */
let paused=false, introOpen=false, tickTimer=null;
const REDUCED=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let LOWP=false;                   /* 父页下发的低功耗开关（M4 名册桥） */
function lockMs(){ return (REDUCED||LOWP)?450:1000; }   /* 惩罚演出锁输入时长 */
function eraserMs(){ return (REDUCED||LOWP)?1200:2500; }

function saveStats(){
  SAVE.stats=SAVE.stats||{clears:0,fails:0,penalties:0,maxCombo:0};
  return SAVE.stats;
}

/* ---------- HUD ---------- */
function fmtBest(){
  const b=SAVE.best&&SAVE.best[mode.key]&&SAVE.best[mode.key][diff.key];
  return (b==null)?'--':String(b);
}
function updateHUD(){
  if(!st) return;
  $('#stPairs').innerHTML=st.matched+'<em>/'+diff.pairs+'</em>';
  $('#stResLabel').textContent=mode.stat;
  $('#stRes').textContent=String(Math.max(0,st.res));
  $('#stCombo').textContent='×'+st.combo;
  $('#stBest').textContent=fmtBest();
}
function setBubble(t){ $('#exBubble').textContent=t; }
function shakeExaminer(){
  const ex=$('#examiner');
  ex.classList.remove('shake'); void ex.offsetWidth; ex.classList.add('shake');
}

/* ---------- 卡盘 ---------- */
function buildDeck(){
  const pool=shuffle(poolEntries().filter(function(t){ return !!t.url; }).map(function(t){ return t.id; })).slice(0,diff.pairs);
  deck=[];
  pool.forEach(function(id,idx){
    deck.push({id:id,uid:idx+'a'},{id:id,uid:idx+'b'});
  });
  shuffle(deck);
}
function renderBoard(){
  const bd=$('#board');
  bd.style.gridTemplateColumns='repeat('+diff.cols+',var(--cs))';
  bd.innerHTML='';
  deck.forEach(function(c){
    const card=document.createElement('button');
    card.type='button'; card.className='card'; card.dataset.uid=c.uid; card.dataset.id=c.id;
    card.setAttribute('aria-label',t('cardAria'));
    card.innerHTML='<div class="cflip"><div class="cface ccover"><b>？？</b></div><div class="cface cback"></div></div>';
    mountArt(card.querySelector('.cback'),c.id);
    card.addEventListener('click',function(){ onCard(card); });
    bd.appendChild(card);
  });
  layoutBoard();
}
/* 盘面自适应：在 boardPanel 可用区内取「整卡」尺寸，避免半张卡被裁 */
function layoutBoard(){
  const panel=$('#boardPanel .pin');
  const gap=6;
  const availW=Math.max(80,panel.clientWidth-16), availH=Math.max(80,panel.clientHeight-16);
  const cs=Math.floor(Math.min((availW-gap*(diff.cols-1))/diff.cols,(availH-gap*(diff.rows-1))/diff.rows));
  $('#board').style.setProperty('--cs',Math.max(40,cs)+'px');
}

/* ---------- 一局 ---------- */
function stopTick(){ if(tickTimer){ clearInterval(tickTimer); tickTimer=null; } }
function startTick(){
  stopTick();
  if(mode.key!=='time') return;
  tickTimer=setInterval(function(){
    if(paused||introOpen||!st||st.phase!=='play') return;
    st.res--; updateHUD();
    if(st.res<=0) lose();
  },1000);
}
function newRound(){
  hideOv('#settleOv');
  clearFx();
  $('#examiner').classList.remove('angry');
  st={phase:'play',res:(mode.key==='step')?diff.steps:diff.time,
      matched:0,combo:0,maxCombo:0,penalties:0,wrongStreak:0,first:null,lock:false};
  buildDeck(); renderBoard(); updateHUD(); startTick();
  setBubble(rand(line('start')));
}

/* ---------- 翻牌与判定 ---------- */
function onCard(card){
  if(!st||st.phase!=='play'||st.lock||paused||introOpen) return;
  if(card.classList.contains('open')||card.classList.contains('done')) return;
  SOUND.flip();
  card.classList.add('open');
  if(!st.first){ st.first=card; return; }
  const a=st.first,b=card;
  st.first=null; st.lock=true;
  setTimeout(function(){ judge(a,b); },260);     /* 等翻牌动画转到正面 */
}
function judge(a,b){
  if(mode.key==='step') st.res--;                /* 每翻一对扣 1 步（成败都算） */
  if(a.dataset.id===b.dataset.id){
    a.classList.add('done'); b.classList.add('done');
    st.matched++; st.combo++;
    st.maxCombo=Math.max(st.maxCombo,st.combo);
    if(st.wrongStreak>0){
      st.wrongStreak=0;
      const wasAngry=$('#examiner').classList.contains('angry');
      $('#examiner').classList.remove('angry');
      if(wasAngry) setBubble(rand(line('calm')));
    }
    SOUND.match(); updateHUD();
    if(st.matched>=diff.pairs){ win(); return; }
    if(st.res<=0){ lose(); return; }             /* 还有牌没配但步数已尽 */
    st.lock=false;
  }else{
    penalty(a,b);
  }
}

/* ---------- 惩罚：答错必罚（台词 + ✗章 + 代价 + 随机小惩罚 / 连错×3 当堂重考） ---------- */
function penalty(a,b){
  st.penalties++; st.combo=0; st.wrongStreak++;
  const big=(st.wrongStreak%3===0);              /* 连错 ×3 → 当堂重考 */
  if(mode.key==='step') st.res-=1; else st.res-=3;   /* 代价：在翻牌消耗之外额外扣 */
  setBubble(rand(big?line('angry'):line('mock')));
  shakeExaminer();
  SOUND.wrong();
  boardStamp();
  setTimeout(function(){ SOUND.stamp(); },140);
  [splat,crowdPenalty,eraserPenalty][(Math.random()*3)|0]();
  updateHUD();
  setTimeout(function(){
    a.classList.remove('open'); b.classList.remove('open');
    if(big){
      reshuffleUnmatched();                      /* 大惩罚：未配对牌全部洗牌重盖 */
      $('#examiner').classList.add('angry');     /* 生气状态：配对成功才平息 */
      SOUND.reshuffle();
    }
    if(st.res<=0){ lose(); return; }
    st.lock=false;
  },lockMs());
}
/* 未配对的牌：id 集合不变，位置重新洗（已配对的牌不动） */
function reshuffleUnmatched(){
  const unmatched=Array.prototype.slice.call(document.querySelectorAll('.card:not(.done)'));
  const ids=shuffle(unmatched.map(function(c){ return c.dataset.id; }));
  unmatched.forEach(function(c,i){
    if(c.dataset.id===ids[i]) return;
    c.dataset.id=ids[i];
    mountArt(c.querySelector('.cback'),ids[i]);
  });
}
function clearFx(){
  const pin=$('#boardPanel .pin');
  ['bstamp','splat','crowd','eraser'].forEach(function(cls){
    Array.prototype.forEach.call(pin.querySelectorAll('.'+cls),function(n){ n.remove(); });
  });
}
function boardStamp(){
  const s=document.createElement('div');
  s.className='bstamp'; s.textContent='✗';
  $('#boardPanel .pin').appendChild(s);
  setTimeout(function(){ s.remove(); },900);
}
function splat(){
  const pin=$('#boardPanel .pin');
  const d=document.createElement('div');
  d.className='splat';
  const w=pin.clientWidth,h=pin.clientHeight;
  d.style.width=Math.round(w*.42)+'px';
  d.style.height=Math.round(w*.42)+'px';
  d.style.left=Math.round(w*(.12+Math.random()*.34))+'px';
  d.style.top=Math.round(h*(.14+Math.random()*.4))+'px';
  pin.appendChild(d);
  setTimeout(function(){ d.remove(); },2100);    /* 墨渍自己淡出（约 2s），锁输入只 1s */
}
/* 围观干扰：一排月巴立绘横幅从卡盘前掠过 1.5s，掩护牌面 */
function crowdPenalty(){
  const pin=$('#boardPanel .pin');
  const ids=shuffle(poolEntries().filter(function(t){ return !!t.url; }).map(function(t){ return t.id; })).slice(0,7);
  const cr=document.createElement('div');
  cr.className='crowd';
  cr.style.top=Math.round(18+Math.random()*42)+'%';
  cr.innerHTML=ids.map(function(id){
    const a=artOf(id);
    return '<span>'+(a&&a.url
      ?'<img src="'+a.url+'" alt="">'
      :'<div class="fb" style="--fbc:'+((a&&a.color)||'#9e9e9e')+'">'+fallbackChar(a?a.name:'')+'</div>')+'</span>';
  }).join('');
  pin.appendChild(cr);
  setTimeout(function(){ cr.remove(); },1600);
}
/* 罚抄橡皮：点 5 下立即继续；不点 2.5s 后自动擦完（低功耗 1.2s） */
function eraserPenalty(){
  const pin=$('#boardPanel .pin');
  if(pin.querySelector('.eraser')) return;
  const ov=document.createElement('div');
  ov.className='eraser';
  ov.innerHTML='<div id="erCard" class="panel"><div class="pin">'
    +'<h4>'+t('erTitle')+'</h4>'
    +'<button type="button" id="erBtn">'+t('erBtn')+'</button>'
    +'<div class="erDots"><i></i><i></i><i></i><i></i><i></i></div>'
    +'<p>'+tf('erHint',{n:Math.round(eraserMs()/100)/10})+'</p>'
    +'</div></div>';
  pin.appendChild(ov);
  let taps=0;
  const dots=ov.querySelectorAll('.erDots i');
  const done=function(){ if(ov.parentNode) ov.remove(); };
  ov.querySelector('#erBtn').addEventListener('click',function(){
    taps++; SOUND.flip();
    if(dots[taps-1]) dots[taps-1].classList.add('on');
    if(taps>=5) done();
  });
  setTimeout(done,eraserMs());
}

/* ---------- 结算 ---------- */
function row(k,v){ return '<div class="row"><span>'+k+'</span><b>'+v+'</b></div>'; }
function showSettle(ok){
  st.phase='settle'; stopTick();
  /* 记录：BEST=剩余资源（步/秒），越大越好 */
  const stats=saveStats();
  let rec=false;
  if(ok){
    const bm=SAVE.best[mode.key]||(SAVE.best[mode.key]={});
    const prev=bm[diff.key];
    if(prev==null||st.res>prev){ bm[diff.key]=st.res; rec=true; }
  }
  stats[ok?'clears':'fails']++;
  stats.penalties+=st.penalties;
  stats.maxCombo=Math.max(stats.maxCombo||0,st.maxCombo);
  persist();
  /* 面板 */
  const stamp=$('#settleStamp');
  stamp.textContent=ok?t('stampOk'):t('stampBad');
  stamp.classList.toggle('bad',!ok);
  $('#settleRecord').textContent=t('record');
  $('#settleRecord').classList.toggle('show',rec);
  $('#tomatoFlick').classList.toggle('show',!ok);
  $('#settleLines').innerHTML=
    row(t('rExam'),t('d_'+diff.key)+' · '+t('m_'+mode.key))
    +row(t(mode.key==='step'?'rStepsLeft':'rTimeLeft'),
      Math.max(0,st.res)+(mode.key==='step'?t('unitStep'):t('unitSec')))
    +row(t('rCombo'),'×'+st.maxCombo)
    +row(t('rPenalty'),st.penalties+t('unitTimes'));
  const dex=$('#settleDex'); dex.innerHTML='';
  deck.filter(function(c,i){ return deck.findIndex(function(x){ return x.id===c.id; })===i; })
    .forEach(function(c){ const m=document.createElement('div'); m.className='mini'; mountArt(m,c.id); dex.appendChild(m); });
  $('#settleQuote').textContent=rand(ok?line('win'):line('lose'));
  setBubble(rand(ok?line('win'):line('lose')));
  (ok?SOUND.win:SOUND.lose)();
  updateHUD();
  $('#settleOv').classList.add('show');
}
function win(){ showSettle(true); }
function lose(){ showSettle(false); }

/* ---------- 分段按钮 ---------- */
function renderSegs(){
  const sd=$('#segDiff'); sd.innerHTML='';
  DIFFS.forEach(function(d){
    const b=document.createElement('button');
    b.type='button'; b.className='btn'+(d.key===diff.key?' on':''); b.textContent=t('d_'+d.key);
    b.addEventListener('click',function(){
      if(diff.key===d.key) return;
      diff=d; SAVE.settings.diff=d.key; persist();
      renderSegs(); newRound();
    });
    sd.appendChild(b);
  });
  const sm=$('#segMode'); sm.innerHTML='';
  MODES.forEach(function(m){
    const b=document.createElement('button');
    b.type='button'; b.className='btn'+(m.key===mode.key?' on':''); b.textContent=t('m_'+m.key);
    b.addEventListener('click',function(){
      if(mode.key===m.key) return;
      mode=m; SAVE.settings.mode=m.key; persist();
      renderSegs(); newRound();
    });
    sm.appendChild(b);
  });
}

/* ---------- 开场白（每存档一次，可跳过） ---------- */
let introStep=0;
function showIntro(){
  introOpen=true; introStep=0;
  renderIntro();
  $('#introOv').classList.add('show');
}
function renderIntro(){
  const pool=line('intro');
  $('#introText').textContent=pool[introStep]||'';
  $('#btnIntroNext').textContent=(introStep>=pool.length-1)?t('startExam'):t('next');
}
function introNext(){
  SOUND.flip();
  if(introStep>=line('intro').length-1){ finishIntro(); return; }
  introStep++; renderIntro();
}
function finishIntro(){
  introOpen=false;
  SAVE.introSeen=true; persist();
  $('#introOv').classList.remove('show');
  setBubble(rand(line('start')));
}

/* ---------- 暂停与浮层按钮 ---------- */
function hideOv(sel){ $(sel).classList.remove('show'); }
function setPaused(p){ paused=!!p; $('#pauseOv').classList.toggle('show',paused); }
$('#btnPause').addEventListener('click',function(){ setPaused(true); });
$('#btnResume').addEventListener('click',function(){ setPaused(false); });
$('#btnAgain').addEventListener('click',function(){ newRound(); });
$('#btnRestart').addEventListener('click',function(){ newRound(); });
$('#btnSettleBack').addEventListener('click',function(){ hideOv('#settleOv'); });
$('#btnIntroNext').addEventListener('click',introNext);
$('#btnIntroSkip').addEventListener('click',function(){ SOUND.flip(); finishIntro(); });

/* ---------- 考官头像 ---------- */
function renderExaminer(){
  mountArt($('#exAvatar'),EXAMINER_ID);
}

/* ---------- 父页名册桥（M4：iframe 内由首页下发已解锁名册/静音/低功耗/语言） ---------- */
let POOL=null;    /* {id:{url,color,name}}；null=离线模式，用内置 DEX_ART 全量 */
const IN_FRAME=(function(){ try{ return !!(window.parent&&window.parent!==window); }catch(e){ return false; } })();
window.addEventListener('message',function(e){
  const d=e&&e.data;
  if(!d||d.type!=='yueba-memory-roster') return;
  const list=Array.isArray(d.list)?d.list:[];
  const map={};
  list.forEach(function(t){
    if(!t||!t.id||!t.art) return;
    map[t.id]={url:t.art,color:t.color||'#9e9e9e',name:t.name||t.id};
  });
  if(Object.keys(map).length<6) return;          /* 名册太小（不足一局），继续用 DEX_ART */
  POOL=map;
  SOUND.setMuted(!!d.muted);
  LOWP=!!d.lowPower;
  document.body.classList.toggle('lowpower',LOWP);
  if(d.lang&&TXT[String(d.lang).toLowerCase()]){
    LANG=String(d.lang).toLowerCase();
    applyTexts();                                /* 父页语言变化：刷新全部静态文案 */
    setBubble(rand(line('start')));
  }
  if(st&&st.phase==='play') newRound();          /* 开局时名册迟到：按已解锁池重发牌 */
});

/* ---------- 启动 ---------- */
/* 静态文案按当前语言刷新（启动与父页改语言时调用） */
function applyTexts(){
  document.title=t('docTitle');
  $('.brand').innerHTML='<i class="bpre">MEM·</i>'+t('brand');
  $('#exName').textContent=t('exName');
  $('#introName').textContent=t('exName');
  $('#btnRestart').textContent=t('restart');
  $('#btnAgain').textContent=t('again');
  $('#btnSettleBack').textContent=t('back');
  $('#btnIntroSkip').textContent=t('skip');
  $('#btnResume').textContent=t('resume');
  $('#btnPause').setAttribute('aria-label',t('pauseAria'));
  $('#pauseCard h3').textContent=t('pauseTitle');
  $('#pauseCard p').textContent=t('pauseSub');
  renderSegs();
  if(introOpen) renderIntro();
}
function applyNarrow(){ document.body.classList.toggle('narrow',window.innerWidth<=360); }
window.addEventListener('resize',function(){ applyNarrow(); layoutBoard(); });
window.addEventListener('orientationchange',function(){ setTimeout(layoutBoard,150); });
applyNarrow();
applyTexts();
renderExaminer();
mountArt($('#introAvatar'),EXAMINER_ID);
newRound();
if(!SAVE.introSeen) showIntro();
/* 名册请求放最后：监听已注册、盘面已就绪，父页名册到达后自动重发牌 */
if(IN_FRAME){ try{ window.parent.postMessage({type:'yueba-memory-ready'},'*'); }catch(e){} }
/* 只读调试快照（控制台/验收脚本用，不影响玩法） */
window.__MEM=function(){
  return {inFrame:IN_FRAME,rostered:!!POOL,pool:Object.keys(POOL||{}).length,
    dex:Object.keys(DEX_ART).length,muted:!!SOUND.muted,lowPower:LOWP,lang:LANG,
    phase:st?st.phase:'',pairs:diff.pairs,diff:diff.key,mode:mode.key};
};
</script>
</body>
