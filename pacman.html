  /* =========================================================
     5. 核心玩法（M2）：固定步长、输入缓存、吃籽、月巴 AI、
        碰撞掉命、过关、计分、暂停
     ========================================================= */
  var STEP = 1 / 120;
  var DIR_UP = {x:0,y:-1}, DIR_DOWN = {x:0,y:1}, DIR_LEFT = {x:-1,y:0}, DIR_RIGHT = {x:1,y:0}, DIR_NONE = {x:0,y:0};
  var KEY_DIR = {arrowup:DIR_UP, w:DIR_UP, arrowdown:DIR_DOWN, s:DIR_DOWN,
                 arrowleft:DIR_LEFT, a:DIR_LEFT, arrowright:DIR_RIGHT, d:DIR_RIGHT};
  /* 散开 7s → 追击 20s → 散开 7s → 追击 20s → 散开 5s → 追击常驻 */
  var PHASES = [['scatter',7],['chase',20],['scatter',7],['chase',20],['scatter',5],['chase',1e9]];
  var CORNERS = [{x:1,y:1},{x:COLS-2,y:1},{x:1,y:ROWS-2},{x:COLS-2,y:ROWS-2}];
  var EXIT = {x:9, y:8};

  var pellets = [];
  var pelletsLeft = 0;
  var score = 0, lives = 3, night = 1;
  var readyT = 0, deadT = 0, clearT = 0;
  var phaseIdx = 0, phaseT = 0;
  var lastReadyN = -1;
  var player = null;
  var ghosts = [];
  var rafId = 0, lastT = 0, acc = 0;
  var rngSeed = 20261031;

  /* M3：辣番茄 / 榨干 / 糖霜番茄 / 粒子 / 音效 / 台词 */
  var POWER_BASE = 200, POWER_CAP = 3200;
  var powerT = 0, powerChain = 0, powerMax = 0;
  var pelletsTotal = 0;
  var bonus = null, bonusUsed = false;
  var particles = [];
  var animT = 0;
  var sayCd = 0, nearT = 8;
  var lastLine = {};
  var gSayIdx = -1, gSayT = 0, gSayCd = 0;
  var audioCtx = null, quiet = false;
  /* M6-A：飘字 / 吃籽微缩 / 反吃冲击环 / 撞墙节流 */
  var FX = {txtLife:.7, txtLift:.9, ringLife:.35, popLife:.12, bumpCd:.35,
            hitStop:.06, hurtStop:.09,
            /* M6-B：转弯侧倾 / 出窝弹跳 / 起步倾斜 / 隧道残影 */
            tiltLife:.16, tiltMax:.07, bounceLife:.34, bounceJump:.35,
            leanLife:.18, leanMax:.10, trailGap:.06, trailLife:.24, trailMax:4,
            /* M6-C：过关点灯 */
            lampGap:.22, lampLit:.30};
  var popTexts = [], pops = [], rings = [], lastBumpT = -1;
  /* M6-P1：命中定格 / GO! 扩散环 / 死亡演出 */
  var hitStop = 0, goT = 0, deathFx = null;
  /* P3：过关扫描 / 落脚尘点 */
  var clearFx = null, dustT = 0;
  /* M6-C5：四颗南瓜糖的位置（自左向右）、点灯计时、已撒火星的盏数 */
  var POWER_POS = [], lampT = 0, lampSparks = 0;
  /* M6-C6：酸番茄氛围的 class 状态缓存，避免每帧写 DOM */
  var sourOn = false, sourHurry = false;
  /* M4：本局榨干数（夜记）、当前夜掉命数（毫发无伤成就） */
  var runGhosts = 0, nightHits = 0;

  /* 番茄改为「长按才走」：按住方向键才推进，松手立即停在原地。
     dir 保留（便于半格内反向与到达格中心后继续转向），移动由 hold 门控。 */
  var holdKeys = {}, holdOrder = [];
  /* 屏幕方向键：按一下等同长按（锁定该方向持续走），再点同一方向或换方向才改变 */
  var padDir = '';
  function dropHold(k){
    if(!holdKeys[k]) return;
    delete holdKeys[k];
    for(var i = holdOrder.length - 1; i >= 0; i--){
      if(holdOrder[i] === k){ holdOrder.splice(i, 1); break; }
    }
  }
  function clearPadLatch(){
    if(padDir){ dropHold('pad-' + padDir); padDir = ''; }
    var bs = document.querySelectorAll('#pad .pbtn.on');
    for(var i = 0; i < bs.length; i++) bs[i].classList.remove('on');
  }
  function setPadDir(dir){
    if(padDir === dir){ clearPadLatch(); syncHold(); return; }   /* 再点一下 = 停 */
    clearPadLatch();
    padDir = dir;
    var key = 'pad-' + dir;
    holdKeys[key] = KEY_DIR['arrow' + dir];
    holdOrder.push(key);
    var b = document.querySelector('#pad .pbtn[data-dir="' + dir + '"]');
    if(b) b.classList.add('on');
    syncHold();
  }
  function syncHold(){
    if(!player) return;
    var k = holdOrder.length ? holdOrder[holdOrder.length - 1] : '';
    var was = !!player.hold;
    player.want = k ? holdKeys[k] : DIR_NONE;
    player.hold = !!k;
    /* M6-B5：刚按下的那一帧记一次起步倾斜（松手即停，所以每次起步都会触发） */
    if(!was && player.hold && player.want.x){
      player.leanT = FX.leanLife;
      player.leanSign = player.want.x > 0 ? 1 : -1;
    }
  }
  function releaseHeld(){
    holdKeys = {}; holdOrder.length = 0;
    if(player){ player.hold = false; player.want = DIR_NONE; }
    clearPadLatch();
  }

  function setMazeForNight(){
    var m = MAZES[(night - 1) % MAZES.length] || MAZES[0];
    if(m === MAZE) return;
    MAZE = m;
    fieldCache.key = ''; fieldCache.dist = null;
  }

  function rnd(){
    rngSeed = (rngSeed * 1103515245 + 12345) % 2147483648;
    return rngSeed / 2147483648;
  }

  /* 第 10 夜起：每关把 4 颗南瓜糖重新随机撒到可走的籽位上（总数不变，位置不再固定） */
  function scatterPower(){
    var cells = [], olds = [], x, y, i;
    for(y = 0; y < ROWS; y++){
      for(x = 0; x < COLS; x++){
        var v = pellets[y][x];
        if(v === 2) olds.push([x, y]);
        else if(v === 1 && !(x === 9 && y === 8)
                && Math.abs(x - START.x) + Math.abs(y - START.y) >= 4) cells.push([x, y]);
      }
    }
    if(cells.length < 4) return;              /* 迷宫异常：保持原来的四角 */
    for(i = 0; i < olds.length; i++) pellets[olds[i][1]][olds[i][0]] = 1;
    for(i = cells.length - 1; i > 0; i--){    /* Fisher–Yates 洗牌 */
      var j = Math.floor(rnd() * (i + 1)), tmp = cells[i]; cells[i] = cells[j]; cells[j] = tmp;
    }
    /* 先挑彼此隔得开的，避免四颗糖挤成一堆 */
    var picks = [];
    for(i = 0; i < cells.length && picks.length < 4; i++){
      var c = cells[i], ok = true;
      for(var k = 0; k < picks.length; k++){
        if(Math.abs(c[0] - picks[k][0]) + Math.abs(c[1] - picks[k][1]) < 5){ ok = false; break; }
      }
      if(ok) picks.push(c);
    }
    if(picks.length < 4){                     /* 实在找不到就按洗牌顺序补满 */
      picks = [];
      for(i = 0; i < cells.length && picks.length < 4; i++) picks.push(cells[i]);
    }
    for(i = 0; i < picks.length; i++) pellets[picks[i][1]][picks[i][0]] = 2;
  }

  function resetPellets(){
    pellets = []; pelletsLeft = 0;
    for(var y = 0; y < ROWS; y++){
      var row = [];
      for(var x = 0; x < COLS; x++){
        var ch = MAZE[y].charAt(x);
        var v = (ch === '.') ? 1 : (ch === 'o' ? 2 : 0);
        if(v) pelletsLeft++;
        row.push(v);
      }
      pellets.push(row);
    }
    if(night >= 10) scatterPower();
    pelletsTotal = pelletsLeft;
    bonus = null; bonusUsed = false;
    /* M6-C5：缓存四颗南瓜糖的位置（不管第几夜、随机还是固定），按 x 自左向右排序 */
    POWER_POS = [];
    for(var py = 0; py < ROWS; py++){
      for(var px = 0; px < COLS; px++){
        if(pellets[py][px] === 2) POWER_POS.push({x:px, y:py});
      }
    }
    POWER_POS.sort(function(a, b){ return a.x - b.x; });
  }

  function ghostSpeed(g){
    if(g && g.mode === 'dried') return 0;
    if(g && g.mode === 'eaten') return 11;
    if(g && g.mode === 'flee') return 3.8;
    /* 第 10 夜后难度不再上涨 */
    var n = Math.min(night, 10);
    var v = Math.min(7.2, 5.6 + (n - 1) * 0.35);
    if(g && g.idx === 4) v = Math.min(7.45, v + 0.25);
    return v;
  }

  function makeGhosts(){
    ghosts = [];
    /* 第 3 夜起万圣月巴加入（第 5 只），出窝间隔随夜数收紧 */
    var count = night >= 3 ? Math.min(CAST.length, 5) : 4;
    var gap = Math.max(1.1, 2.0 - (Math.min(night, 10) - 1) * 0.09);
    /* 除万圣月巴外，立绘从图鉴已解锁月巴里随机取；id/ring 仍是行为含义 */
    var faces = pickFaces(Math.min(4, count));
    for(var i = 0; i < count; i++){
      var pos = GHOSTS[i] || GHOSTS[0];
      var face = (i === 4) ? CAST[4].id : faces[i];
      ensureFace(face);
      ghosts.push({
        idx:i, id:CAST[i].id, ring:CAST[i].ring, face:face,
        x:pos.x, y:pos.y,
        dir:DIR_NONE, want:DIR_NONE,
        ghost:true, mode:'house', t:1.0 + i * gap,
        speed:ghostSpeed({idx:i}),
        /* M6-B：朝向 / 上一次真实方向 / 转弯侧倾 / 出窝弹跳 / 隧道残影 */
        facing:1, pdir:null, tiltT:0, tiltSign:1, popT:0, trails:[], trT:0
      });
    }
  }

  function resetBoard(){
    player = {x:START.x, y:START.y, dir:DIR_NONE, want:DIR_NONE, hold:false, speed:6.2, ghost:false,
              facing:1, pdir:null, tiltT:0, tiltSign:1, leanT:0, leanSign:0, popT:0, trails:[]};
    clearPadLatch();   /* 重生后停下：屏幕方向键的锁定不带到下一命 */
    syncHold();   /* 掉命/过关后若玩家仍按着方向键，直接恢复移动 */
    powerT = 0; powerMax = 0; powerChain = 0;
    makeGhosts();
    phaseIdx = 0; phaseT = 0;
  }

  function isAtCenter(e){
    return Math.abs(e.x - Math.round(e.x)) < 1e-6 && Math.abs(e.y - Math.round(e.y)) < 1e-6;
  }

  function canDir(cx, cy, d, isGhost){
    if(!d || (!d.x && !d.y)) return false;
    var ch = tileChar(cx + d.x, cy + d.y);
    if(ch === '#') return false;
    if(ch === 'H') return !!isGhost;
    return true;
  }

  function nextCenterDist(e){
    if(e.dir.x > 0) return Math.ceil(e.x + 1e-6) - e.x;
    if(e.dir.x < 0) return e.x - Math.floor(e.x - 1e-6);
    if(e.dir.y > 0) return Math.ceil(e.y + 1e-6) - e.y;
    if(e.dir.y < 0) return e.y - Math.floor(e.y - 1e-6);
    return 0;
  }

  /* 岔路口转向容忍：番茄离格心 TURN_EPS 格内就能提前转，刚过格心 TURN_BACK 格内会吸附回中心。
     只对玩家生效，月巴仍严格在格心选向，避免 AI 行为漂移。 */
  var TURN_EPS = 0.20, TURN_BACK = 0.12;

  function tryTurnAtJunction(e){
    if(e.ghost) return false;
    if(!e.want || (!e.want.x && !e.want.y)) return false;
    if(!e.dir.x && !e.dir.y) return false;
    if(e.want.x === e.dir.x && e.want.y === e.dir.y) return false;
    if(e.want.x === -e.dir.x && e.want.y === -e.dir.y) return false;   /* 反向已在开头处理 */

    var cx = Math.round(e.x), cy = Math.round(e.y);
    /* 垂直于前进方向的那一维必须已经在格线上，斜走不处理 */
    if(e.dir.x ? Math.abs(e.y - cy) > 1e-9 : Math.abs(e.x - cx) > 1e-9) return false;

    var ahead = nextCenterDist(e);
    var tx, ty;
    if(ahead <= TURN_EPS){
      tx = e.x + e.dir.x * ahead;
      ty = e.y + e.dir.y * ahead;
    }else if(ahead >= 1 - TURN_BACK){
      var back = 1 - ahead;             /* 刚过中心多少，往回收这一点 */
      tx = e.x - e.dir.x * back;
      ty = e.y - e.dir.y * back;
    }else{
      return false;
    }
    if(tx < 0) tx += COLS; else if(tx >= COLS) tx -= COLS;
    if(!canDir(Math.round(tx), Math.round(ty), e.want, false)) return false;
    e.x = tx; e.y = ty;
    e.dir = e.want;
    return true;
  }

  function moveEntity(e, dt, decide){
    var left = e.speed * dt, guard = 0;
    if((e.dir.x || e.dir.y) && e.want && e.want.x === -e.dir.x && e.want.y === -e.dir.y){
      e.dir = e.want;
    }
    while(left > 1e-9 && guard++ < 12){
      var cx = Math.round(e.x), cy = Math.round(e.y);
      if(isAtCenter(e)){
        e.x = cx; e.y = cy;
        /* 月巴的选向必须在「跨过格中心」时进行，而不是每帧开头；
           否则整步落点几乎不可能正好停在中心，月巴会卡在走廊里 */
        if(decide) decide(e, cx, cy);
        if(e.want && canDir(cx, cy, e.want, e.ghost)) e.dir = e.want;
        if(!canDir(cx, cy, e.dir, e.ghost)){
          /* 玩家顶着墙按方向：停在格心时轻推一下棋盘（节流 0.35s） */
          if(!e.ghost && e.want && (e.want.x || e.want.y) && !canDir(cx, cy, e.want, e.ghost)) wallBump(e.want);
          e.dir = DIR_NONE;
          break;
        }
      }else if(!e.ghost){
        /* 差一点点也能转：提前 / 刚过一点都吸附到格心再转向 */
        tryTurnAtJunction(e);
      }
      if(!e.dir.x && !e.dir.y) break;
      var d = nextCenterDist(e);
      if(d <= 1e-9) d = 1;
      var take = Math.min(left, d);
      e.x += e.dir.x * take;
      e.y += e.dir.y * take;
      left -= take;
      if(e.x < 0) e.x += COLS;
      else if(e.x >= COLS) e.x -= COLS;
    }
  }

  function ghostTarget(g){
    if(g.mode === 'eaten') return {x:9, y:10};       /* 被榨干后回窝 */
    if(g.mode === 'exit') return EXIT;
    if(g.mode === 'flee') return CORNERS[g.idx % CORNERS.length]; /* flee 实际走随机，这里只作保底 */
    if(g.mode === 'scatter') return CORNERS[g.idx % CORNERS.length];
    var px = player.x, py = player.y;
    /* 万圣月巴：番茄当前格 ±2 随机器偏移，每 4 秒刷新一次 */
    if(g.idx === 4){
      var seed = Math.floor(animT / 4);
      return {x:px + ((seed * 7 + 3) % 5) - 2, y:py + ((seed * 13 + 1) % 5) - 2};
    }
    if(g.idx === 0) return {x:px, y:py};
    if(g.idx === 1) return {x:px + player.dir.x * 4, y:py + player.dir.y * 4};
    if(g.idx === 2) return {x:COLS - 1 - px, y:ROWS - 1 - py};
    var dx = px - g.x, dy = py - g.y;
    if(dx * dx + dy * dy < 64){
      return {x:px < COLS / 2 ? COLS - 2 : 0, y:py < ROWS / 2 ? ROWS - 2 : 0};
    }
    return CORNERS[g.idx % CORNERS.length];
  }

  /* ---- 距离场：从目标格 BFS 出全图步数 ----
     纯贪心曼哈顿距离在迷宫里会绕圈（月巴会在走廊里来回撞），
     改用 BFS 步数选向，保证月巴真的会朝番茄走过来。 */
  var fieldCache = {key:'', dist:null};

  function walkable(x, y){
    if(y < 0 || y >= ROWS) return false;
    if(x < 0 || x >= COLS){
      if(y !== 10) return false;
      x = (x + COLS) % COLS;
    }
    return MAZE[y].charAt(x) !== '#';
  }

  function snapTarget(tx, ty){
    tx = Math.round(tx); ty = Math.round(ty);
    if(tx < 0) tx = 0; else if(tx > COLS - 1) tx = COLS - 1;
    if(ty < 0) ty = 0; else if(ty > ROWS - 1) ty = ROWS - 1;
    if(walkable(tx, ty)) return {x:tx, y:ty};
    for(var r = 1; r < 8; r++){
      for(var dy = -r; dy <= r; dy++){
        for(var dx = -r; dx <= r; dx++){
          if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
          if(walkable(tx + dx, ty + dy)) return {x:tx + dx, y:ty + dy};
        }
      }
    }
    return {x:tx, y:ty};
  }

  function distField(tx, ty){
    var t = snapTarget(tx, ty);
    var key = t.x + ',' + t.y;
    if(fieldCache.key === key) return fieldCache.dist;
    var dist = new Array(ROWS * COLS);
    for(var i = 0; i < dist.length; i++) dist[i] = 1e9;
    var q = [t.y * COLS + t.x], head = 0;
    dist[t.y * COLS + t.x] = 0;
    var d4 = [[0,-1],[-1,0],[0,1],[1,0]];
    while(head < q.length){
      var cur = q[head++], cy = Math.floor(cur / COLS), cx = cur % COLS;
      for(var k = 0; k < 4; k++){
        var nx = cx + d4[k][0], ny = cy + d4[k][1];
        if(ny < 0 || ny >= ROWS) continue;
        if(nx < 0 || nx >= COLS){
          if(ny !== 10) continue;
          nx = (nx + COLS) % COLS;
        }
        if(!walkable(nx, ny)) continue;
        var ni = ny * COLS + nx;
        if(dist[ni] <= dist[cur] + 1) continue;
        dist[ni] = dist[cur] + 1;
        q.push(ni);
      }
    }
    fieldCache = {key:key, dist:dist};
    return dist;
  }

  function ghostDecide(g, cx, cy){
    /* 到达出口格即进入当前相位，不需要在整步末尾正好落在中心 */
    if(g.mode === 'exit' && cx === EXIT.x && cy === EXIT.y){
      g.mode = (powerT > 0) ? 'flee' : curPhase();
      g.dir = DIR_NONE; g.want = DIR_NONE;
    }
    /* 被榨干后回到窝中心，等 reviveDelay() 后再出窝；等待期间仍画成一双眼睛 */
    if(g.mode === 'eaten' && cx === 9 && cy === 10){
      g.mode = 'house'; g.t = reviveDelay(); g.reviving = true;
      g.dir = DIR_NONE; g.want = DIR_NONE;
      return;
    }
    var dirs = [DIR_UP, DIR_LEFT, DIR_DOWN, DIR_RIGHT];
    var back = (g.dir.x || g.dir.y) ? {x:-g.dir.x, y:-g.dir.y} : DIR_NONE;
    var target = ghostTarget(g);

    /* 辣番茄：路口随机逃窜，越乱越好抓 */
    if(g.mode === 'flee'){
      var pf = [];
      for(var q = 0; q < 4; q++){
        var df = dirs[q];
        if(!canDir(cx, cy, df, true)) continue;
        if(back.x === df.x && back.y === df.y) continue;
        pf.push(df);
      }
      if(pf.length){ g.want = pf[Math.floor(rnd() * pf.length)]; return; }
    }

    if(g.idx === 3 && g.mode === 'chase' && rnd() < .35){
      var picks = [];
      for(var p = 0; p < 4; p++){
        var dp = dirs[p];
        if(!canDir(cx, cy, dp, true)) continue;
        if(back.x === dp.x && back.y === dp.y) continue;
        picks.push(dp);
      }
      if(picks.length){ g.want = picks[Math.floor(rnd() * picks.length)]; return; }
    }

    var field = distField(target.x, target.y);
    var best = null, bestD = 1e9;
    for(var i = 0; i < 4; i++){
      var d = dirs[i];
      if(!canDir(cx, cy, d, true)) continue;
      if(back.x === d.x && back.y === d.y) continue;
      var nx = cx + d.x, ny = cy + d.y;
      if(nx < 0) nx += COLS; else if(nx >= COLS) nx -= COLS;
      var dd = field[ny * COLS + nx];
      if(dd < bestD){ bestD = dd; best = d; }
    }
    if(!best && (back.x || back.y)) best = back;
    if(best) g.want = best;
  }

  function curPhase(){ return PHASES[phaseIdx][0]; }

  function updatePhase(dt){
    if(powerT > 0) return;              /* 辣番茄期间暂停散开/追击节奏 */
    if(phaseIdx >= PHASES.length - 1) return;
    phaseT += dt;
    if(phaseT < PHASES[phaseIdx][1]) return;
    phaseT = 0;
    phaseIdx++;
    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      if(g.mode !== 'chase' && g.mode !== 'scatter') continue;
      g.mode = curPhase();
      if(g.dir.x || g.dir.y){ g.dir = {x:-g.dir.x, y:-g.dir.y}; g.want = g.dir; }
    }
  }

  /* 计分入口：每跨过 10,000 分加 1 条命，上限 5 */
  function addScore(v, gx, gy, color){
    if(!v) return;
    var before = Math.floor(score / 10000);
    score += v;
    popScore(typeof gx === 'number' ? gx : (player ? player.x : 0),
             typeof gy === 'number' ? gy : (player ? player.y : 0), v, color);
    var after = Math.floor(score / 10000);
    if(after > before && lives < 5){
      lives = Math.min(5, lives + (after - before));
      updateHUD();
      if(!quiet) sfx('tick');
    }
    checkAch();
  }

  function eatPellets(){
    var cx = Math.round(player.x), cy = Math.round(player.y);
    if(cy < 0 || cy >= ROWS || cx < 0 || cx >= COLS) return;
    var v = pellets[cy][cx];
    if(!v) return;
    pellets[cy][cx] = 0;
    pelletsLeft--;
    if(v === 2){
      addScore(50, cx, cy);
      startPower();
    }else{
      save.stats.pellets++;
      addScore(10, cx, cy);
      /* 被吃掉的籽在原位缩成一个小点 */
      if(pops.length >= 8) pops.shift();
      pops.push({gx:cx, gy:cy, t:FX.popLife, max:FX.popLife});
    }
    paintPellets();
    updateHUD();
    if(pelletsLeft <= 0) levelClear();
  }

  function checkCollision(){
    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      if(g.mode === 'house' || g.mode === 'eaten' || g.mode === 'dried') continue;
      var dx = g.x - player.x, dy = g.y - player.y;
      if(dx > COLS / 2) dx -= COLS; else if(dx < -COLS / 2) dx += COLS;
      if(dx * dx + dy * dy < 0.55 * 0.55){
        if(g.mode === 'flee'){ eatGhost(g); continue; }
        hurt(g); return;
      }
    }
  }

  /* =========================================================
     M3：辣番茄 · 反吃 · 糖霜番茄 · 粒子 · 音效 · 台词
     ========================================================= */
  function curTheme(){ return activeTheme(); }
  function lpMode(){ return document.body.classList.contains('lp'); }

  /* M6-C6：辣番茄氛围——只在开关变化时改 DOM 类，不逐帧写样式 */
  function syncSour(){
    var on = powerT > 0 && state === 'play';
    var hurry = on && powerT < 1.5;
    if(on !== sourOn){ sourOn = on; $('frame').classList.toggle('sour', on); }
    if(hurry !== sourHurry){ sourHurry = hurry; $('frame').classList.toggle('sourHurry', hurry); }
  }

  /* 榨干后回窝的复活等待：第 1 夜不回窝（就地变成眼睛，不再复活）；第 2–3 夜 6 秒，
     第 4–6 夜 5 秒，第 7 夜起逐夜变快，第 10 夜起固定 2 秒 */
  function reviveDelay(){
    if(night <= 1) return 0;            /* 第 1 夜不会走到这里：被榨干后留在原地，见 eatGhost */
    if(night <= 3) return 6;
    if(night <= 6) return 5;
    if(night >= 10) return 2;
    return 4 - (night - 7) * (2 / 3);   /* 7 夜 4s · 8 夜 3.3s · 9 夜 2.7s · 10 夜 2s */
  }

  function powerDur(){
    if(night <= 2) return 8;
    if(night <= 5) return 6;
    return 5;
  }

  /* 吃到南瓜糖：番茄变辣，所有在外月巴强制掉头进入逃跑 */
  function startPower(){
    powerT = powerDur();
    powerMax = powerT;
    powerChain = 0;
    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      if(g.mode !== 'chase' && g.mode !== 'scatter') continue;
      g.mode = 'flee';
      if(g.dir.x || g.dir.y){ g.dir = {x:-g.dir.x, y:-g.dir.y}; g.want = g.dir; }
    }
    burst(player.x, player.y, 16, curTheme().accent2);
    sfx('power');
    say('power', true);
    ghostSay(0, 'flee', true);
  }

  function endPower(){
    powerT = 0; powerMax = 0; powerChain = 0;
    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      if(g.mode === 'flee'){ g.mode = curPhase(); }
    }
  }

  /* 榨干：200 / 400 / 800 / 1600 / 3200，一次辣番茄内递增 */
  function eatGhost(g){
    var th = curTheme();
    var val = Math.min(POWER_CAP, POWER_BASE * Math.pow(2, powerChain));
    powerChain++;
    addScore(val, g.x, g.y, th.accent2);
    if(powerChain >= 2) popTag(player.x, player.y, '×' + powerChain, powerChain >= 4 ? th.text : th.accent2);
    /* N2：反吃吸入——月巴被抽向番茄再消失 */
    g.inhaleT = .18; g.inhaleMax = .18;
    g.inhaleX = g.x; g.inhaleY = g.y;
    g.inhaleToX = player.x; g.inhaleToY = player.y;
    /* N1：命中定格 */
    if(!quiet && !lpMode() && !reduceMotion) hitStop = FX.hitStop;
    runGhosts++;
    save.stats.ghosts++;
    if(powerChain > (save.stats.maxCombo || 0)) save.stats.maxCombo = powerChain;
    if(night <= 1){
      /* 第 1 夜：榨干后化成一双小眼睛留在原地，本夜不再复活 */
      g.mode = 'dried';
      g.dir = DIR_NONE;
      g.want = DIR_NONE;
    }else{
      g.mode = 'eaten';
      /* 保留当前方向：月巴只在格心选向，半格清空方向会让它永远卡在原地不动 */
      g.want = g.dir;
    }
    g.speed = ghostSpeed(g);
    /* N3：连吃阶梯——环色递进、粒子 14/22/30/38、连吃时棋盘轻顶一下 */
    var rc = powerChain >= 4 ? th.text : (powerChain >= 3 ? th.tomato : th.accent2);
    burst(g.x, g.y, powerChain >= 2 ? Math.min(38, 14 + (powerChain - 1) * 8) : 14, rc);
    ringAt(g.x, g.y, rc);
    if(powerChain >= 2 && powerChain < 4) punch();
    whiteFlash();
    sfx('ghost');
    ghostSay(g.idx, 'eaten', true);
    if(powerChain === 4){
      addScore(1000);
      shake();
      say('combo', true);
    }
    updateHUD();
  }

  /* ---- 糖霜番茄：吃掉一半籽后中央出现 6 秒 ---- */
  function maybeSpawnBonus(){
    if(bonusUsed || bonus || pelletsTotal <= 0) return;
    if(pelletsLeft > Math.ceil(pelletsTotal * .55)) return;
    bonusUsed = true;
    bonus = {x:9, y:8, t:6, max:6};
    sfx('bonus');
  }

  function updateBonus(dt){
    maybeSpawnBonus();
    if(!bonus) return;
    bonus.t -= dt;
    if(bonus.t <= 0){ bonus = null; return; }
    if(Math.abs(player.x - bonus.x) < .6 && Math.abs(player.y - bonus.y) < .6){
      addScore(300, bonus.x, bonus.y, curTheme().tomato);
      bonus = null;
      updateHUD();
      burst(9, 8, 18, curTheme().tomato);
      sfx('bonus');
      say('bonus', true);
    }
  }

  /* P3-N4：落脚尘点——走动时在脚边撒两粒短命灰尘 */
  function puffDust(e){
    var th = curTheme();
    var cx = (e.x + .5) * tile, cy = (e.y + .5) * tile + tile * .40;
    for(var i = 0; i < 2; i++){
      if(particles.length >= 48) particles.shift();
      var a = rnd() * Math.PI * 2;
      var v = (.22 + rnd() * .5) * tile;
      var life = .26 + rnd() * .16;
      particles.push({
        x:cx + (rnd() - .5) * tile * .34, y:cy,
        vx:Math.cos(a) * v, vy:-Math.abs(Math.sin(a)) * tile * .22,
        life:life, max:life, c:hexA(th.dim, .75), r:Math.max(1, tile * .045)
      });
    }
  }

  /* ---- 粒子池（上限 48，低功耗减半） ---- */
  function burst(gx, gy, n, color){
    if(lpMode()) n = Math.min(n, 6);
    var cx = (gx + .5) * tile, cy = (gy + .5) * tile;
    for(var i = 0; i < n; i++){
      if(particles.length >= 48) particles.shift();
      var a = rnd() * Math.PI * 2, v = (.5 + rnd() * 1.7) * tile;
      var life = .45 + rnd() * .35;
      particles.push({
        x:cx, y:cy,
        vx:Math.cos(a) * v, vy:Math.sin(a) * v - tile * .5,
        life:life, max:life,
        c:color, r:Math.max(1.2, tile * .085)
      });
    }
  }
  function updateParticles(dt){
    for(var i = particles.length - 1; i >= 0; i--){
      var p = particles[i];
      p.life -= dt;
      if(p.life <= 0){ particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += tile * 2.4 * dt;
    }
  }
  function drawParticles(){
    for(var i = 0; i < particles.length; i++){
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---- M6-A：飘字 / 吃籽微缩 / 反吃冲击环 / 撞墙轻推 / 受击红闪 ---- */
  function pushPop(o){
    if(popTexts.length >= 8) popTexts.shift();
    popTexts.push(o);
  }
  function popScore(gx, gy, v, color){
    if(quiet || !v) return;
    if(v === 10){
      /* 0.2 秒内的 10 分飘字直接累加，连吃籽不刷屏 */
      for(var i = 0; i < popTexts.length; i++){
        var p = popTexts[i];
        if(p.kind === 'p' && p.max - p.t < .2){
          p.v += v;
          p.txt = '+' + p.v;
          p.gx = gx; p.gy = gy;
          p.t = p.max;
          return;
        }
      }
    }
    pushPop({gx:gx, gy:gy, v:v, txt:'+' + v, kind: v === 10 ? 'p' : 'o',
             t:FX.txtLife, max:FX.txtLife, color:color || curTheme().accent2, big:false});
  }
  function popTag(gx, gy, txt, color){
    if(quiet) return;
    pushPop({gx:gx, gy:gy, txt:txt, kind:'t', t:.55, max:.55,
             color:color || curTheme().accent2, big:true});
  }
  function ringAt(gx, gy, color){
    if(quiet || reduceMotion) return;
    if(rings.length >= 4) rings.shift();
    rings.push({gx:gx, gy:gy, r0:.3, r1:2.0, c:color || curTheme().accent2,
                t:FX.ringLife, max:FX.ringLife});
  }
  function whiteFlash(){
    if(quiet || reduceMotion || lpMode()) return;
    var el = $('flash');
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
  }
  function hurtFlash(){
    if(quiet || reduceMotion) return;
    var el = $('hurtFx');
    el.classList.remove('on');
    void el.offsetWidth;
    el.classList.add('on');
  }
  function wallBump(d){
    if(quiet || reduceMotion || lpMode() || !d) return;
    if(lastBumpT >= 0 && animT - lastBumpT < FX.bumpCd) return;
    lastBumpT = animT;
    var el = $('cv');
    el.style.setProperty('--bx', (-d.x * 1.5) + 'px');
    el.style.setProperty('--by', (-d.y * 1.5) + 'px');
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  /* N3：连吃时棋盘极轻微顶一下，强化"咬进去"的手感 */
  function punch(){
    if(quiet || reduceMotion || lpMode()) return;
    var el = $('cv');
    el.classList.remove('punch');
    void el.offsetWidth;
    el.classList.add('punch');
  }
  /* N9：3-2-1 结束后的 GO! 扩散字幕 */
  function setGo(){
    var el = $('cdown');
    if(!el) return;
    el.textContent = (I18N[lang].go || 'GO') + '!';
    el.classList.add('show');
    el.classList.remove('pop');
    void el.offsetWidth;
    el.classList.add('pop');
    goT = .5;
    if(!reduceMotion && !lpMode()){
      if(rings.length >= 4) rings.shift();
      rings.push({gx:player.x, gy:player.y, r0:.4, r1:3.4, c:curTheme().accent2, t:.45, max:.45});
    }
  }

  function drawPops(th){
    if(!pops.length || quiet || lpMode() || reduceMotion) return;
    for(var i = 0; i < pops.length; i++){
      var p = pops[i], k = 1 - p.t / p.max;
      var cx = (p.gx + .5) * tile, cy = (p.gy + .5) * tile;
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = th.pellet;
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(.4, tile * .17 * (1 - k * .76)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawRings(){
    if(!rings.length) return;
    for(var i = 0; i < rings.length; i++){
      var r = rings[i], k = 1 - r.t / r.max;
      var rad = Math.max(1, tile * (r.r0 + (r.r1 - r.r0) * k));
      ctx.globalAlpha = (1 - k) * .8;
      ctx.strokeStyle = r.c;
      ctx.lineWidth = 3 + (.6 - 3) * k;
      ctx.beginPath();
      ctx.arc((r.gx + .5) * tile, (r.gy + .5) * tile, rad, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawPopTexts(){
    if(!popTexts.length) return;
    var calm = lpMode() || reduceMotion;
    for(var i = 0; i < popTexts.length; i++){
      var p = popTexts[i], k = 1 - p.t / p.max;
      var size = Math.max(10, tile * (p.big ? 1.05 : .62));
      var cx = (p.gx + .5) * tile, cy = (p.gy + .5) * tile;
      var lift = calm ? 0 : FX.txtLift * tile * k;
      var a = k > .6 ? 1 - (k - .6) / .4 : 1;
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = '900 ' + Math.round(size) + 'px "SF Mono",Consolas,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, size * .14);
      ctx.strokeStyle = 'rgba(11,7,20,.85)';
      ctx.strokeText(p.txt, cx, cy - lift);
      ctx.fillStyle = p.color;
      ctx.fillText(p.txt, cx, cy - lift);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  function updateFx(dt){
    for(var i = popTexts.length - 1; i >= 0; i--){
      popTexts[i].t -= dt;
      if(popTexts[i].t <= 0) popTexts.splice(i, 1);
    }
    for(i = pops.length - 1; i >= 0; i--){
      pops[i].t -= dt;
      if(pops[i].t <= 0) pops.splice(i, 1);
    }
    for(i = rings.length - 1; i >= 0; i--){
      rings[i].t -= dt;
      if(rings[i].t <= 0) rings.splice(i, 1);
    }
  }

  function shake(){
    if(lpMode() || reduceMotion) return;
    var el = $('cv');
    el.classList.remove('shake');
    void el.offsetWidth;
    el.classList.add('shake');
  }

  /* ---- 音效：WebAudio 振荡器，零资源 ---- */
  function ac(){
    if(quiet) return null;
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      try{ audioCtx = new AC(); }catch(e){ audioCtx = null; return null; }
    }
    if(audioCtx.state === 'suspended'){ try{ audioCtx.resume(); }catch(e){} }
    return audioCtx;
  }
  function audio(){
    if(!save.ui.sfx) return null;
    return ac();
  }
  function tone(freq, dur, type, gain){
    var ac = audio();
    if(!ac) return;
    try{
      var o = ac.createOscillator(), g = ac.createGain();
      var t0 = ac.currentTime;
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain || .05, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + dur + .03);
    }catch(e){}
  }
  function sfx(name){
    if(quiet || !save.ui.sfx) return;
    switch(name){
      case 'power':
        tone(480, .16, 'triangle', .08);
        setTimeout(function(){ tone(740, .22, 'triangle', .06); }, 90);
        break;
      case 'ghost':
        tone(880, .08, 'square', .05);
        setTimeout(function(){ tone(1180, .12, 'square', .045); }, 70);
        break;
      case 'bonus':
        tone(660, .09, 'triangle', .06);
        setTimeout(function(){ tone(880, .09, 'triangle', .055); }, 80);
        setTimeout(function(){ tone(1100, .14, 'triangle', .05); }, 160);
        break;
      case 'death':
        tone(420, .16, 'sawtooth', .06);
        setTimeout(function(){ tone(320, .18, 'sawtooth', .055); }, 140);
        setTimeout(function(){ tone(220, .30, 'sawtooth', .05); }, 300);
        break;
      case 'clear':
        tone(520, .12, 'triangle', .055);
        setTimeout(function(){ tone(660, .12, 'triangle', .055); }, 110);
        setTimeout(function(){ tone(780, .12, 'triangle', .055); }, 220);
        setTimeout(function(){ tone(1040, .26, 'triangle', .05); }, 330);
        break;
      case 'tick':
        tone(700, .07, 'triangle', .05);
        break;
      case 'ach':
        tone(880, .09, 'triangle', .05);
        setTimeout(function(){ tone(1174, .16, 'triangle', .05); }, 100);
        break;
    }
  }

  /* ---- 8-bit 背景音乐：万圣节追逐曲（A 小调，16 分音符网格，64 步循环） ---- */
  var BGM_LEVEL = .9;
  var BGM_BPM = 148;
  var BGM_MEL = [
    /* 第 1 小节 · Am：上行分解 */
    69,0,72,0, 76,0,72,0, 69,0,72,0, 77,0,76,0,
    /* 第 2 小节 · E7：月巴围上来的紧张感 */
    68,0,71,0, 76,0,80,0, 76,0,71,0, 68,0,71,0,
    /* 第 3 小节 · Dm：再爬一次高音 */
    74,0,77,0, 81,0,77,0, 74,0,77,0, 81,0,77,0,
    /* 第 4 小节 · E7：半音下行，咬回开头 */
    76,0,74,0, 72,0,71,0, 68,0,71,0, 76,0,80,0
  ];
  var BGM_BASS = [
    45,0,0,0, 40,0,0,0, 45,0,0,0, 48,0,0,0,
    40,0,0,0, 47,0,0,0, 40,0,0,0, 44,0,0,0,
    38,0,0,0, 45,0,0,0, 38,0,0,0, 41,0,0,0,
    40,0,0,0, 47,0,0,0, 40,0,0,0, 47,0,0,0
  ];
  var BGM = {on:false, step:0, nextAt:0, timer:0, gain:null};

  function midiHz(n){ return 440 * Math.pow(2, (n - 69) / 12); }
  function bgmBus(){
    var a = ac();
    if(!a) return null;
    if(!BGM.gain){
      var g = a.createGain(), lp = a.createBiquadFilter();
      g.gain.value = .0001;
      lp.type = 'lowpass'; lp.frequency.value = 2200; lp.Q.value = .7;
      g.connect(lp); lp.connect(a.destination);
      BGM.gain = g;
    }
    return BGM.gain;
  }
  function bgmTone(midi, when, dur, type, vol){
    var a = audioCtx;
    if(!a || !BGM.gain) return;
    try{
      var o = a.createOscillator(), g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(midiHz(midi), when);
      g.gain.setValueAtTime(.0001, when);
      g.gain.linearRampToValueAtTime(vol, when + .006);
      g.gain.setValueAtTime(vol, when + Math.max(.02, dur - .03));
      g.gain.exponentialRampToValueAtTime(.0001, when + dur);
      o.connect(g); g.connect(BGM.gain);
      o.onended = function(){ try{ o.disconnect(); g.disconnect(); }catch(e){} };
      o.start(when); o.stop(when + dur + .02);
    }catch(e){}
  }
  function bgmSchedule(step, when, sd){
    var m = BGM_MEL[step], b = BGM_BASS[step];
    if(m) bgmTone(m, when, sd * 1.6, 'square', .032);
    if(b) bgmTone(b, when, sd * 3.3, 'triangle', .030);
  }
  function bgmKick(){
    var a = audioCtx;
    if(!a || !BGM.on) return;
    /* 辣番茄时间：曲子加速，追逐感更急 */
    var sd = 60 / (BGM_BPM * (powerT > 0 ? 1.18 : 1)) / 4;
    if(BGM.nextAt < a.currentTime) BGM.nextAt = a.currentTime + .02;
    while(BGM.nextAt < a.currentTime + .18){
      bgmSchedule(BGM.step, BGM.nextAt, sd);
      BGM.step = (BGM.step + 1) % 64;
      BGM.nextAt += sd;
    }
  }
  function bgmStart(){
    if(BGM.on || quiet || !save.ui.music) return;
    var bus = bgmBus();
    if(!bus) return;
    BGM.on = true;
    BGM.step = 0;
    BGM.nextAt = audioCtx.currentTime + .12;
    try{
      bus.gain.cancelScheduledValues(audioCtx.currentTime);
      bus.gain.setValueAtTime(.0001, audioCtx.currentTime);
      bus.gain.linearRampToValueAtTime(BGM_LEVEL, audioCtx.currentTime + .35);
    }catch(e){}
    BGM.timer = setInterval(bgmKick, 60);
    bgmKick();
  }
  /* 淡出并把播放位置归零，下一局从头开始 */
  function bgmStop(){
    if(!BGM.on) return;
    BGM.on = false;
    BGM.step = 0;
    if(BGM.timer){ clearInterval(BGM.timer); BGM.timer = 0; }
    var a = audioCtx;
    if(a && BGM.gain){
      try{
        BGM.gain.gain.cancelScheduledValues(a.currentTime);
        BGM.gain.gain.setValueAtTime(BGM.gain.gain.value, a.currentTime);
        BGM.gain.gain.linearRampToValueAtTime(.0001, a.currentTime + .22);
      }catch(e){}
    }
  }

  /* ---- 台词双通道：番茄常驻位 + 月巴跟头气泡 ---- */
  function pickLine(kind){
    var pool = (I18N[lang].lines && I18N[lang].lines[kind]) || [];
    if(!pool.length) return '';
    var i = Math.floor(rnd() * pool.length);
    if(pool.length > 1 && pool[i] === lastLine[kind]) i = (i + 1) % pool.length;
    lastLine[kind] = pool[i];
    return pool[i];
  }

  function say(kind, force){
    if(!save.ui.dlg) return;
    if(sayCd > 0 && !force) return;
    var line = pickLine(kind);
    if(!line) return;
    setSay(line);
    sayCd = 5.5;
    save.stats.talks++;
    checkAch();
  }

  function ghostSay(idx, kind, force){
    if(!save.ui.dlg) return;
    if(idx < 0 || idx >= CAST.length) return;
    if(!force && (gSayT > 0 || gSayCd > 0)) return;
    var line = pickLine(kind);
    if(!line) return;
    var gs = $('gSay');
    gs.textContent = line;
    /* M6-D5：气泡每次重播 3px 上浮；低功耗 / 减动效直接淡入 */
    gs.classList.remove('on');
    void gs.offsetWidth;
    gs.classList.add('on');
    gSayIdx = idx;
    gSayT = 2.2;
    gSayCd = 7 + rnd() * 3;
    save.stats.talks++;
    checkAch();
  }

  function hideGSay(){
    gSayIdx = -1; gSayT = 0;
    $('gSay').classList.remove('on');
  }

  function updateSay(dt){
    if(sayCd > 0) sayCd -= dt;
    if(nearT > 0) nearT -= dt;
    if(gSayCd > 0) gSayCd -= dt;
    if(gSayT > 0){
      gSayT -= dt;
      if(gSayT <= 0) hideGSay();
    }
  }

  /* 月巴贴近时随机搭话 */
  function tryNearSay(){
    if(nearT > 0 || !save.ui.dlg) return;
    var best = -1, bd = 3.2 * 3.2;
    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      if(g.mode !== 'chase' && g.mode !== 'scatter') continue;
      var dx = g.x - player.x, dy = g.y - player.y;
      if(dx * dx + dy * dy < bd){ bd = dx * dx + dy * dy; best = i; }
    }
    if(best < 0) return;
    ghostSay(best, 'near');
    nearT = 9 + rnd() * 6;
  }

  function resetFx(){
    powerT = 0; powerMax = 0; powerChain = 0;
    particles.length = 0;
    popTexts.length = 0; pops.length = 0; rings.length = 0;
    lastBumpT = -1;
    hitStop = 0; deathFx = null;
    clearFx = null; dustT = 0;
    for(var ti = 0; ti < ghosts.length; ti++){ if(ghosts[ti].trails) ghosts[ti].trails.length = 0; }
    if(goT > 0){ goT = 0; hideCountdown(); }
    $('flash').classList.remove('on');
    $('hurtFx').classList.remove('on');
    lampT = 0; lampSparks = 0;
    syncSour();
    sayCd = 0; nearT = 8; gSayCd = 0;
    hideGSay();
  }

  function update(dt){
    animT += dt;
    updateParticles(dt);
    updateFx(dt);
    updateSay(dt);
    /* N9：GO! 扩散字幕，0.5 秒后收起 */
    if(goT > 0){ goT -= dt; if(goT <= 0) hideCountdown(); }
    if(state === 'clear'){
      if(clearFx) clearFx.t += dt;
      lampT += dt;
      /* 每盏点亮到一半时在灯顶撒 3 颗火星（低功耗 / 减动效 / 自检都不撒） */
      if(!quiet && !lpMode() && !reduceMotion){
        while(lampSparks < POWER_POS.length &&
              lampT >= lampSparks * FX.lampGap + FX.lampLit * .55){
          var lampP = POWER_POS[lampSparks];
          burst(lampP.x, lampP.y - .22, 3, curTheme().accent2);
          lampSparks++;
        }
      }
      clearT -= dt;
      if(clearT <= 0) advanceNight();
      return;
    }
    if(state === 'dead'){
      if(deathFx){
        deathFx.t += dt;
        /* 摊平落地那一刻抖一点灰 */
        if(!deathFx.landed && deathFx.t >= .68){
          deathFx.landed = true;
          burst(deathFx.px + deathFx.wx * .16, deathFx.py + deathFx.wy * .16, 6, curTheme().tomato);
        }
      }
      deadT -= dt;
      if(deadT <= 0) respawn();
      return;
    }
    if(state !== 'play') return;

    if(readyT > 0){
      readyT -= dt;
      var n = Math.ceil(readyT);
      if(n !== lastReadyN){
        lastReadyN = n;
        if(n > 0) setCountdown(Math.min(3, n));   /* 开局 3-2-1 大字压在迷宫中心 */
      }
      if(readyT > 0) return;
      if(quiet) hideCountdown(); else setGo();
      $('chipEm').textContent = I18N[lang].go || '';
      readyT = 0;
    }

    if(powerT > 0){
      powerT -= dt;
      if(powerT <= 0) endPower();
    }
    updateBonus(dt);
    updatePhase(dt);
    /* 长按才走：没有按住方向时番茄停在原地 */
    if(player.hold && (player.want.x || player.want.y)) moveEntity(player, dt);
    markFacing(player);
    decayFace(player, dt);
    /* N4：走动时落脚扬尘（约每 0.18s 一次；低功耗 / 减动效不撒） */
    if(player.hold && (player.want.x || player.want.y) && !lpMode() && !reduceMotion){
      dustT -= dt;
      if(dustT <= 0){ dustT = .18; puffDust(player); }
    }else{
      dustT = 0;
    }
    eatPellets();
    if(state !== 'play') return;

    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      decayFace(g, dt);
      if(g.inhaleT > 0) g.inhaleT = Math.max(0, g.inhaleT - dt);
      if(g.mode === 'house'){
        g.t -= dt;
        if(g.t <= 0){ g.mode = 'exit'; g.reviving = false; g.popT = FX.bounceLife; }   /* B2：出窝弹一下 */
        continue;
      }
      if(g.mode === 'dried') continue;      /* 第 1 夜：眼睛就地不动，不复活 */
      g.speed = ghostSpeed(g);
      moveEntity(g, dt, ghostDecide);
      markFacing(g);
      sampleTrail(g, dt);
    }
    checkCollision();
    if(state === 'play') tryNearSay();
  }

  function startLoop(){
    if(rafId) return;
    lastT = 0; acc = 0;
    rafId = requestAnimationFrame(tick);
  }
  function stopLoop(){
    if(rafId){ cancelAnimationFrame(rafId); rafId = 0; }
    lastT = 0; acc = 0;
  }
  function tick(t){
    if(state !== 'play' && state !== 'dead' && state !== 'clear'){ stopLoop(); return; }
    rafId = requestAnimationFrame(tick);
    if(!lastT){ lastT = t; return; }
    var dt = (t - lastT) / 1000;
    lastT = t;
    if(dt > 0.25) dt = 0.25;
    /* N1：命中定格——几十毫秒内推进停住，只重绘 */
    if(hitStop > 0){ hitStop -= dt; draw(); return; }
    acc += dt;
    var steps = 0;
    while(acc >= STEP && steps < 4){ update(STEP); acc -= STEP; steps++; }
    if(steps >= 4) acc = 0;
    draw();
  }

  /* M6-D1：生命逐颗渲染；掉一条命时让那一颗裂开，.36s 后移除 */
  var livesShown = -1;
  function lifeIcon(){
    var i = document.createElement('i');
    i.textContent = '🍅';
    return i;
  }
  function renderLives(){
    var box = $('livesIcons');
    if(!box) return;
    var n = lives > 0 ? lives : 0;
    if(livesShown < 0 || n > livesShown){
      /* 首次 / 加命：清掉还没飘完的碎屑，再补齐到 n 颗 */
      var old = box.querySelectorAll('i.crack');
      for(var i = 0; i < old.length; i++){ if(old[i].parentNode) old[i].parentNode.removeChild(old[i]); }
      for(var j = box.children.length; j < n; j++) box.appendChild(lifeIcon());
    } else if(n < livesShown){
      var cut = livesShown - n;
      while(cut-- > 0){
        var last = box.lastElementChild;
        if(!last) break;
        if(last.classList.contains('crack')){
          if(last.parentNode) last.parentNode.removeChild(last);
          continue;
        }
        last.classList.add('crack');
        (function(el){
          setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 360);
        })(last);
      }
    }
    livesShown = n;
  }

  function updateHUD(){
    $('hudScore').textContent = score;
    $('hudNight').textContent = night;
    renderLives();
    /* P2-N7：只剩一条命时，屏幕边缘开始心跳 */
    document.body.classList.toggle('lowhp', lives === 1);
  }

  function chipText(){
    return (I18N[lang].chip || '夜 {n}').replace('{n}', night);
  }
  function updateNightChip(){
    $('nightChipT').textContent = chipText();
    $('nightChip').classList.add('show');
  }
  /* M6-D4：夜数翻页——重播一次自下 6px 淡入（低功耗 / 减动效不做） */
  function flipNight(el){
    if(!el || lpMode() || reduceMotion) return;
    el.classList.remove('flip');
    void el.offsetWidth;
    el.classList.add('flip');
  }

  function levelClear(){
    addScore(1000 * night, player.x, player.y, curTheme().accent2);
    if(nightHits === 0) unlock('nohit');
    save.stats.nights++;
    checkAch();
    updateHUD();
    state = 'clear';
    clearT = 1.4;
    clearFx = {t:0, dur:1.4};
    lampT = 0; lampSparks = 0;
    $('chipEm').textContent = I18N[lang].clear || '';
    bgmStop();
    sfx('clear');
    say('clear', true);
  }

  function advanceNight(){
    night++;
    nightHits = 0;
    setMazeForNight();
    buildStatic();
    resetPellets();
    resetBoard();
    resetFx();
    paintPellets();
    updateHUD();
    updateNightChip();
    flipNight($('hudNight'));
    flipNight($('nightChipT'));
    checkAch();
    $('chipEm').textContent = I18N[lang].preparing || '';
    state = 'play';
    readyT = 2.0;
    lastReadyN = -1;
    bgmStart();
    startLoop();
    draw();
  }

  function hurt(g){
    if(state !== 'play' || readyT > 0) return;
    lives--;
    nightHits++;
    powerT = 0; powerMax = 0; powerChain = 0;
    updateHUD();
    bgmStop();
    sfx('death');
    hurtFlash();
    say('death', true);
    if(lives <= 0){ gameOver(); return; }
    /* P1：死亡演出——番茄被月巴按在墙上挤三下，最后摊平躺地 */
    var wd = deathWallDir(g);
    var calm = quiet || reduceMotion || lpMode();
    deathFx = {
      t:0, dur: calm ? .9 : 1.25, calm: calm, landed:false,
      idx: g ? g.idx : -1,
      gid: g ? (g.face || g.id) : '',
      ring: g ? g.ring : curTheme().accent2,
      px: player.x, py: player.y, wx: wd.x, wy: wd.y
    };
    if(!calm) hitStop = FX.hurtStop;
    state = 'dead';
    deadT = deathFx.dur;
    $('chipEm').textContent = I18N[lang].preparing || '';
  }

  /* 就死的墙：优先取「被撞飞方向」上的邻格；附近没贴墙就沿离心方向假想一堵 */
  function deathWallDir(g){
    var cx = Math.round(player.x), cy = Math.round(player.y);
    var vx = 1, vy = 0;
    if(g){
      vx = player.x - g.x; vy = player.y - g.y;
      var len = Math.sqrt(vx * vx + vy * vy) || 1;
      vx /= len; vy /= len;
    }
    var ds = [{x:-1,y:0},{x:1,y:0},{x:0,y:-1},{x:0,y:1}];
    var best = null, bd = -.35;
    for(var i = 0; i < ds.length; i++){
      var d = ds[i];
      if(tileChar(cx + d.x, cy + d.y) !== '#') continue;
      var dot = d.x * vx + d.y * vy;
      if(dot > bd){ bd = dot; best = d; }
    }
    if(best) return {x:best.x, y:best.y};
    return Math.abs(vx) >= Math.abs(vy)
      ? {x: vx >= 0 ? 1 : -1, y:0}
      : {x:0, y: vy >= 0 ? 1 : -1};
  }

  function respawn(){
    resetBoard();
    resetFx();
    readyT = 1.8;
    lastReadyN = -1;
    state = 'play';
    bgmStart();
    updateNightChip();
    $('chipEm').textContent = I18N[lang].preparing || '';
  }

  /* M6-D2：结算三行数字滚动——一次性 rAF，.6s 缓出，结束即停 */
  var countRaf = 0;
  function stopCountUp(){
    if(countRaf){ cancelAnimationFrame(countRaf); countRaf = 0; }
  }
  function countUpRows(rows, dur){
    stopCountUp();
    var i;
    if(quiet || lpMode() || reduceMotion){
      for(i = 0; i < rows.length; i++) rows[i].el.textContent = rows[i].to;
      return;
    }
    var t0 = (window.performance && performance.now) ? performance.now() : +new Date();
    for(i = 0; i < rows.length; i++) rows[i].el.textContent = 0;
    function step(now){
      var k = Math.min(1, (now - t0) / (dur * 1000));
      var e = 1 - Math.pow(1 - k, 3);
      for(var j = 0; j < rows.length; j++){
        rows[j].el.textContent = k >= 1 ? rows[j].to : Math.round(rows[j].to * e);
      }
      countRaf = k < 1 ? requestAnimationFrame(step) : 0;
    }
    countRaf = requestAnimationFrame(step);
  }

  function gameOver(){
    state = 'over';
    stopLoop();
    bgmStop();
    var isBest = score > (save.best || 0);
    if(isBest) save.best = score;
    if(night > (save.bestNight || 0)) save.bestNight = night;
    save.stats.plays++;
    checkAch();
    writeSave();
    countUpRows([
      {el: $('overScore'), to: score},
      {el: $('overNight'), to: night},
      {el: $('overGhosts'), to: runGhosts}
    ], .6);
    /* P3-N12：破纪录时点亮星芒（每次结算重播一次） */
    var tag = $('newBestTag');
    tag.classList.remove('star');
    void tag.offsetWidth;
    tag.style.display = isBest ? 'block' : 'none';
    if(isBest) tag.classList.add('star');
    $('over').classList.add('show');
    $('bestVal').textContent = save.best || 0;
    draw();
  }

  /* =========================================================
     6. 状态与界面
     ========================================================= */
  function showTitle(){
    stopLoop();
    stopCountUp();
    bgmStop();
    state = 'title';
    releaseHeld();
    hideCountdown();
    $('cv').classList.remove('dim');
    $('title').classList.add('show');
    $('pause').classList.remove('show');
    $('over').classList.remove('show');
    $('newBestTag').classList.remove('star');
    $('nightChip').classList.remove('show');
    score = 0; lives = 3; night = 1;
    runGhosts = 0; nightHits = 0;
    setMazeForNight();
    resetPellets();
    resetBoard();
    resetFx();
    buildStatic();
    paintPellets();
    updateHUD();
    $('bestVal').textContent = save.best || 0;
    setSay('');
    draw();
  }

  function beginRun(){
    stopCountUp();
    score = 0; lives = 3; night = 1;
    runGhosts = 0; nightHits = 0;
    setMazeForNight();
    resetPellets();
    resetBoard();
    resetFx();
    buildStatic();
    paintPellets();
    updateHUD();
    $('title').classList.remove('show');
    $('pause').classList.remove('show');
    $('over').classList.remove('show');
    updateNightChip();
    $('chipEm').textContent = I18N[lang].preparing || '';
    state = 'play';
    readyT = 3.0; deadT = 0; clearT = 0; lastReadyN = -1;
    say('start', true);
    bgmStart();
    startLoop();
    draw();
  }

  function pauseGame(){
    if(state !== 'play') return;
    state = 'pause';
    bgmStop();
    releaseHeld();
    renderSkins();
    $('cv').classList.add('dim');
    $('pause').classList.add('show');
    stopLoop();
  }
  function resumeGame(){
    if(state !== 'pause') return;
    state = 'play';
    $('pause').classList.remove('show');
    $('cv').classList.remove('dim');
    bgmStart();
    startLoop();
  }

  function bind(){

      else if(state === 'pause') resumeGame();

    $('themes').addEventListener('click', function(e){

      setLang(b.getAttribute('data-lang'));

    $('chkLight').addEventListener('change', function(){

    $('skinList').addEventListener('click', onSkinClick);
    $('skinListTitle').addEventListener('click', onSkinClick);

    $('btnOverAch').addEventListener('click', showAch);

    $('chkDlg').addEventListener('change', function(){
      save.ui.dlg = this.checked;

    $('chkSfx').addEventListener('change', function(){

    });

    document.addEventListener('keydown', function(e){
      var k = (e.key || '').toLowerCase();
      if($('ach').classList.contains('show')){
        if(k === 'escape' || k === 'enter' || k === ' '){ e.preventDefault(); hideAch(); }
        return;
      }
      var d = KEY_DIR[k];
      if(d){
        e.preventDefault();
        if(state === 'title') beginRun();
        if(state === 'over') return;
        if(state === 'pause') resumeGame();
        clearPadLatch();   /* 改用键盘时取消屏幕方向键的锁定 */
        if(!holdKeys[k]){ holdKeys[k] = d; holdOrder.push(k); }
        syncHold();
        return;
      }
      if(k === 'escape'){
        if(state === 'play') pauseGame();
        else if(state === 'pause') resumeGame();
      }else if(k === 'enter'){
        if(state === 'title' || state === 'over') beginRun();
        else if(state === 'pause') resumeGame();
      }
    });

    /* 松手即停：移除这个方向；若手上还按着别的方向，就继续那个方向 */
    document.addEventListener('keyup', function(e){
      var k = (e.key || '').toLowerCase();
      if(!holdKeys[k]) return;
      delete holdKeys[k];
      for(var i = holdOrder.length - 1; i >= 0; i--){
        if(holdOrder[i] === k){ holdOrder.splice(i, 1); break; }
      }
      syncHold();
    });

    /* 手机：按住屏幕并滑动定方向，手指抬起立即停 */
    var touchId = null, tx0 = 0, ty0 = 0;
    $('frame').addEventListener('touchstart', function(e){
      var t = e.touches[0];
      if(!t || touchId !== null) return;
      touchId = t.identifier; tx0 = t.clientX; ty0 = t.clientY;
      if(state === 'title') beginRun();
      if(state === 'pause') resumeGame();
      clearPadLatch();   /* 改用滑动手势时取消锁定 */
      if(player){ player.hold = true; player.want = DIR_NONE; }
    }, {passive:true});
    $('frame').addEventListener('touchmove', function(e){
      if(touchId === null) return;
      var t = null, j;
      for(j = 0; j < e.touches.length; j++){
        if(e.touches[j].identifier === touchId){ t = e.touches[j]; break; }
      }
      if(!t) return;
      var dx = t.clientX - tx0, dy = t.clientY - ty0;
      if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      var d = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? DIR_RIGHT : DIR_LEFT)
        : (dy > 0 ? DIR_DOWN : DIR_UP);
      if(player){ player.want = d; player.hold = true; }
    }, {passive:true});
    function endTouch(){
      touchId = null;
      if(player){ player.hold = false; player.want = DIR_NONE; }
    }
    $('frame').addEventListener('touchend', endTouch, {passive:true});
    $('frame').addEventListener('touchcancel', endTouch, {passive:true});

    /* 虚拟方向键：点一下即锁定该方向持续前进（等同长按），再点同一方向停下 */
    $('pad').addEventListener('pointerdown', function(e){
      var b = e.target.closest ? e.target.closest('.pbtn') : null;
      if(!b) return;
      e.preventDefault();
      var dir = b.getAttribute('data-dir');
      if(dir) setPadDir(dir);
    });

    document.addEventListener('visibilitychange', function(){
      if(document.hidden && state === 'play') pauseGame();
    });

    var rt = null;
    function onViewport(){
      if(rt) clearTimeout(rt);
      rt = setTimeout(function(){ syncTouchUI(); layout(); }, 120);
    }
    window.addEventListener('resize', onViewport);
    window.addEventListener('orientationchange', onViewport);
  }

  /* =========================================================
     6. 自检（?selftest=1）
     ========================================================= */
  function selftest(){
    var errs = [], i, j;
    quiet = true;

    /* M4：三张迷宫都要 21×19、左右对称、连通、恰好 4 颗南瓜糖 */
    var pcnt = 0, power = 0, mzLog = [];
    for(var mi = 0; mi < MAZES.length; mi++){
      MAZE = MAZES[mi]; fieldCache.key = ''; fieldCache.dist = null;
      var mc = 0, mp = 0;
      if(MAZE.length !== ROWS) errs.push('maze ' + mi + ' row count ' + MAZE.length);
      for(i = 0; i < MAZE.length; i++){
        if(MAZE[i].length !== COLS) errs.push('maze ' + mi + ' row ' + i + ' length ' + MAZE[i].length);
        if(MAZE[i] !== MAZE[i].split('').reverse().join('')) errs.push('maze ' + mi + ' row ' + i + ' not symmetric');
      }
      var seen = {};
      var q = [[START.x, START.y]];
      seen[START.y * COLS + START.x] = 1;
      while(q.length){
        var cur = q.shift();
        var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
        for(i = 0; i < 4; i++){
          var nx = cur[0] + dirs[i][0], ny = cur[1] + dirs[i][1];
          if(ny === 10 && (nx < 0 || nx >= COLS)){ nx = (nx + COLS) % COLS; }
          if(nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
          var ch = tileChar(nx, ny);
          if(ch === '#' || ch === 'H' || ch === ' ') continue;
          var key = ny * COLS + nx;
          if(seen[key]) continue;
          seen[key] = 1;
          q.push([nx, ny]);
        }
      }
      for(i = 0; i < ROWS; i++){
        for(j = 0; j < COLS; j++){
          var c = MAZE[i].charAt(j);
          if(c === '.'){ mc++; if(!seen[i * COLS + j]) errs.push('maze ' + mi + ' unreachable pellet ' + j + ',' + i); }
          if(c === 'o'){ mp++; if(!seen[i * COLS + j]) errs.push('maze ' + mi + ' unreachable power ' + j + ',' + i); }
        }
      }
      if(mp !== 4) errs.push('maze ' + mi + ' power pellets ' + mp);
      if(mc < 100) errs.push('maze ' + mi + ' too few pellets ' + mc);
      mzLog.push(mc + '/' + mp);
      if(mi === 0){ pcnt = mc; power = mp; }
    }

    /* M4：夜数 → 迷宫轮换（第 1–3 夜换图，第 4 夜回到第一张） */
    night = 1; MAZE = MAZES[0]; setMazeForNight();
    if(MAZE !== MAZES[0]) errs.push('night 1 maze');
    night = 3; setMazeForNight();
    if(MAZE !== MAZES[2]) errs.push('night 3 maze');
    night = 4; setMazeForNight();
    if(MAZE !== MAZES[0]) errs.push('night 4 maze did not wrap');
    night = 1; setMazeForNight();
    if(MAZE !== MAZES[0]) errs.push('night reset maze');

    /* 第 10 夜起：南瓜糖随机布置，数量仍是 4 颗、且不落在出生点上 */
    night = 10; setMazeForNight(); resetPellets();
    var rp = [], rpc = 0;
    for(i = 0; i < ROWS; i++){
      for(j = 0; j < COLS; j++){
        if(pellets[i][j] === 2){ rpc++; rp.push(j + ',' + i); }
      }
    }
    if(rpc !== 4) errs.push('random power count ' + rpc);
    if(rp.join(';') === '1,3;17,3;1,17;17,17;') errs.push('random power did not move');
    if(pellets[START.y][START.x] === 2) errs.push('random power on start');
    night = 1; setMazeForNight(); resetPellets();

    /* M4：第 3 夜第 5 只万圣月巴；速度 +0.25；目标 ±2 偏移 */
    resetPellets(); resetBoard();
    score = 0; lives = 3; night = 3; readyT = 0; deadT = 0; clearT = 0; state = 'play';
    makeGhosts();
    if(ghosts.length !== 5) errs.push('night 3 ghost count ' + ghosts.length);
    if(ghosts[4] && ghosts[4].id !== 'mb_wansheng') errs.push('5th ghost id ' + (ghosts[4] && ghosts[4].id));
    if(ghosts[4] && !(ghosts[4].speed >= ghosts[0].speed + .2)) errs.push('wansheng speed');
    player.x = 9; player.y = 10;
    var wt = ghostTarget(ghosts[4]);
    if(Math.abs(wt.x - 9) > 2 || Math.abs(wt.y - 10) > 2) errs.push('wansheng target ' + wt.x + ',' + wt.y);

    /* M4：第 10 夜后难度封顶 */
    night = 10; var s10 = ghostSpeed();
    night = 14; if(ghostSpeed() !== s10) errs.push('difficulty kept rising after night 10');

    /* M4：每 10,000 分加 1 命，上限 5 */
    night = 1; score = 0; lives = 3;
    addScore(9999);
    if(lives !== 3) errs.push('extra life too early');
    addScore(1);
    if(lives !== 4) errs.push('extra life not granted');
    addScore(50000);
    if(lives !== 5) errs.push('extra life cap ' + lives);
    score = 0;

    /* M4：成就判定（quiet 只改内存） */
    night = 3;
    delete save.ach.first; delete save.ach.night3; delete save.ach.nohit;
    save.stats.plays = Math.max(1, save.stats.plays);
    checkAch();
    if(!save.ach.first) errs.push('ach first not unlocked');
    if(!save.ach.night3) errs.push('ach night3 not unlocked');
    night = 5; nightHits = 0; levelClear();
    if(!save.ach.nohit) errs.push('ach nohit not unlocked');

    /* M4：所有配色（含浅色 day）的按钮文字对比度 ≥ 4.5:1 */
    var paletteIds = THEME_ORDER.concat(['day']);
    for(i = 0; i < paletteIds.length; i++){
      var thx = THEMES[paletteIds[i]];
      var onc = onAccentColor(thx.accent, thx.accent2);
      if(Math.min(contrastRatio(onc, thx.accent), contrastRatio(onc, thx.accent2)) < 4.5)
        errs.push('theme contrast ' + paletteIds[i]);
    }

    /* 浅色开关：切换后 data-light / CSS 变量 / 开关状态都要跟上 */
    var wasLight = save.light;
    save.light = true; applyTheme(save.theme);
    if(document.documentElement.getAttribute('data-light') !== '1') errs.push('light flag not applied');
    if(curTheme().bg !== THEMES.day.bg) errs.push('light palette not active');
    if(!$('chkLight').checked) errs.push('light switch not synced');
    draw();
    save.light = wasLight; applyTheme(save.theme);
    try{ renderAch(); showAch(); hideAch(); }catch(e){ errs.push('ach ui threw: ' + e.message); }

    /* M6-B：朝向翻转 / 转弯侧倾 / 出窝弹跳 / 隧道残影 */
    var fe = {x:1, y:10, dir:{x:1,y:0}, pdir:null, facing:1, tiltT:0, tiltSign:1, popT:0, trails:[], trT:0};
    markFacing(fe);
    if(fe.facing !== 1) errs.push('facing right not set');
    fe.dir = {x:-1,y:0}; markFacing(fe);
    if(fe.facing !== -1) errs.push('facing flip failed');
    if(fe.tiltT !== 0) errs.push('reverse should not tilt');
    fe.dir = {x:0,y:1}; markFacing(fe);
    if(!(fe.tiltT > 0)) errs.push('turn tilt not armed');
    if(!lpMode() && !reduceMotion && tiltAngle(fe) === 0) errs.push('tilt angle is zero');
    decayFace(fe, .5);
    if(fe.tiltT !== 0) errs.push('tilt not decayed');
    if(!lpMode() && !reduceMotion){
      var ban = bounceAnim({sx:1, sy:1, lift:0}, {popT:FX.bounceLife * .5});
      if(!(ban.lift < 0)) errs.push('bounce lift missing');
    }
    sampleTrail(fe, .1);
    if(quiet && fe.trails.length) errs.push('trail should stay off in selftest');

    /* M6-C：墙边层已烘好；南瓜糖坐标缓存为 4 颗且自左向右；点灯能在过关时长内走完 */
    night = 1; setMazeForNight(); resetPellets();
    if(!wallEdgeCv) errs.push('wall edge layer missing');
    if(POWER_POS.length !== 4) errs.push('power pos cached ' + POWER_POS.length);
    for(i = 1; i < POWER_POS.length; i++){
      if(POWER_POS[i].x < POWER_POS[i - 1].x) errs.push('power pos not left-to-right');
    }
    if(POWER_POS.length === 4 && POWER_POS[0].x === POWER_POS[3].x) errs.push('power pos share same column');
    if(!((POWER_POS.length - 1) * FX.lampGap + FX.lampLit < 1.4)) errs.push('lamp timing exceeds clearT');

    night = 1; state = 'play';

    /* M2 行为自检：玩家静止，月巴应出窝并至少追到一次 */
    resetPellets(); resetBoard();
    score = 0; lives = 3; night = 1; readyT = 0; deadT = 0; clearT = 0;
    state = 'play';
    console.log('[pacman selftest] faces=' + ghosts.map(function(g){ return g.face; }).join(',') +
                ' rings=' + ghosts.map(function(g){ return g.ring; }).join(','));
    var out = 0, hits = 0, prevLives = 3, steps = 0;
    for(steps = 0; steps < 40 * 120; steps++){
      update(1 / 120);
      if(state === 'over') break;
      for(var k = 0; k < ghosts.length; k++){
        if(ghosts[k].mode !== 'house' && ghosts[k].mode !== 'exit'){ out++; break; }
      }
      if(lives !== prevLives){ hits += prevLives - lives; prevLives = lives; break; }
    }
    console.log('[pacman selftest] sim steps=' + steps + ' ghostsOut=' + out + ' hits=' + hits);
    if(out < 120) errs.push('ghosts never left the den');
    if(hits < 1) errs.push('no collision in 40s idle sim');

    /* 掉命重生：月巴应回窝、番茄回出生点 */
    resetPellets(); resetBoard();
    score = 0; lives = 3; night = 1; readyT = 0; deadT = 0; clearT = 0; state = 'play';
    ghosts[0].mode = 'chase';
    ghosts[0].x = player.x; ghosts[0].y = player.y;
    update(1 / 120);
    if(state !== 'dead') errs.push('collision did not kill');
    if(lives !== 2) errs.push('lives not decremented');
    for(i = 0; i < 120; i++) update(1 / 120);
    if(state !== 'play') errs.push('respawn failed');
    if(Math.abs(player.x - START.x) > 1e-6 || Math.abs(player.y - START.y) > 1e-6) errs.push('player not back at start');
    for(i = 0; i < ghosts.length; i++){
      if(ghosts[i].mode !== 'house'){ errs.push('ghost not back in den'); break; }
    }

    /* 过关：吃光籽 → clear → 下一夜并重新铺籽 */
    resetPellets(); resetBoard();
    score = 0; lives = 3; night = 1; readyT = 0; deadT = 0; clearT = 0; state = 'play';
    pellets[START.y][START.x] = 1;
    pelletsLeft = 1;
    update(1 / 120);
    if(state !== 'clear') errs.push('level clear not triggered');
    for(i = 0; i < 200; i++) update(1 / 120);
    if(night !== 2) errs.push('night did not advance (' + night + ')');
    if(pelletsLeft < 100) errs.push('pellets not refilled');

    /* M3：南瓜糖 → 全体 flee；榨干 200/400/800/1600 + 连吃 1000，且不掉命 */
    resetPellets(); resetBoard(); resetFx();
    score = 0; lives = 3; night = 1; readyT = 0; deadT = 0; clearT = 0; state = 'play';
    pellets[START.y][START.x] = 0;
    pelletsLeft--;
    for(i = 0; i < ghosts.length; i++){ ghosts[i].mode = 'chase'; ghosts[i].t = 0; }
    startPower();
    if(powerT <= 0) errs.push('power not started');
    for(i = 0; i < ghosts.length; i++){
      if(ghosts[i].mode !== 'flee'){ errs.push('ghost ' + i + ' not fleeing'); break; }
    }

    var s0 = score;
    ghosts[0].x = player.x; ghosts[0].y = player.y;
    update(1 / 120);
    if(lives !== 3) errs.push('flee collision killed player');
    if(score - s0 !== 200) errs.push('1st ghost score ' + (score - s0));
    if(ghosts[0].mode !== 'dried') errs.push('night1 not dried in place: ' + ghosts[0].mode);
    /* 第 1 夜被榨干：小眼睛就地不动、不复活、也不再伤到番茄 */
    var dx0 = ghosts[0].x, dy0 = ghosts[0].y;
    for(i = 1; i < ghosts.length; i++){ ghosts[i].x = 9; ghosts[i].y = 8; }
    for(i = 0; i < 60; i++) update(1 / 120);
    if(ghosts[0].x !== dx0 || ghosts[0].y !== dy0) errs.push('night1 dried ghost moved');
    if(ghosts[0].mode !== 'dried') errs.push('night1 dried ghost revived');
    if(lives !== 3) errs.push('night1 dried ghost hurt player');

    s0 = score;
    ghosts[1].x = player.x; ghosts[1].y = player.y;
    update(1 / 120);
    if(score - s0 !== 400) errs.push('2nd ghost score ' + (score - s0));

    s0 = score;
    ghosts[2].x = player.x; ghosts[2].y = player.y;
    update(1 / 120);
    if(score - s0 !== 800) errs.push('3rd ghost score ' + (score - s0));

    s0 = score;
    ghosts[3].x = player.x; ghosts[3].y = player.y;
    update(1 / 120);
    if(score - s0 !== 2600) errs.push('4th ghost score ' + (score - s0));

    /* 辣番茄结束：flee 回到当前相位（先把月巴挪开，免得贴着番茄被再吃或反杀） */
    for(i = 0; i < ghosts.length; i++){ ghosts[i].x = 9; ghosts[i].y = 8; }
    ghosts[0].mode = 'flee';
    powerT = 0.004;
    update(1 / 120);
    if(ghosts[0].mode === 'flee') errs.push('flee not cleared after power ends');

    /* 复活等待曲线：1 夜不回窝；2–3 夜 6s；4–6 夜 5s；7 夜 4s；10 夜起 2s */
    var nSave = night;
    var curve = {1:0, 2:6, 3:6, 4:5, 6:5, 7:4, 10:2, 14:2};
    for(var kn in curve){
      night = +kn;
      if(Math.abs(reviveDelay() - curve[kn]) > 1e-6) errs.push('reviveDelay night ' + kn + ' = ' + reviveDelay().toFixed(2));
    }
    ghosts[0].mode = 'eaten'; ghosts[0].x = 9; ghosts[0].y = 10;
    night = 2;
    ghostDecide(ghosts[0], 9, 10);
    if(ghosts[0].mode !== 'house') errs.push('night2 revive mode ' + ghosts[0].mode);
    if(Math.abs(ghosts[0].t - 6) > 1e-6) errs.push('night2 revive delay ' + ghosts[0].t);
    night = nSave;

    /* 完整复活流程：被榨干 → 自己走回窝 → 等 reviveDelay → 出窝 → 恢复相位
       其它月巴钉在窝里、番茄不动，确保只观察 0 号月巴这一条路径 */
    resetPellets(); resetBoard(); resetFx();
    score = 0; lives = 3; night = 3; readyT = 0; deadT = 0; clearT = 0;
    powerT = 0; powerMax = 0; powerChain = 0; state = 'play';
    for(i = 1; i < ghosts.length; i++){ ghosts[i].mode = 'house'; ghosts[i].t = 1e9; }
    var g0 = ghosts[0];
    /* 真实场景：碰撞发生在半格位置。eatGhost 若把方向清零，月巴不在格心就永远选不了向、卡在原地 */
    var md = canDir(START.x, START.y, DIR_LEFT, true) ? DIR_LEFT :
             (canDir(START.x, START.y, DIR_RIGHT, true) ? DIR_RIGHT :
             (canDir(START.x, START.y, DIR_UP, true) ? DIR_UP : DIR_DOWN));
    g0.x = START.x - md.x * 0.3; g0.y = START.y - md.y * 0.3;
    g0.dir = md; g0.want = DIR_NONE; g0.mode = 'flee';
    eatGhost(g0);
    if(!g0.dir.x && !g0.dir.y) errs.push('eatGhost cleared dir');
    var tDen = -1, tExit = -1, tOut = -1, waitWant = reviveDelay();
    for(var s2 = 0; s2 < 120 * 30; s2++){
      update(1 / 120);
      if(tExit >= 0 && (g0.mode === 'chase' || g0.mode === 'scatter' || g0.mode === 'flee')){ tOut = s2; break; }
      if(tDen < 0 && g0.mode === 'house'){ tDen = s2; if(!g0.reviving) errs.push('revive: reviving flag missing'); }
      else if(tDen >= 0 && tExit < 0 && g0.mode === 'exit'){ tExit = s2; }
    }
    if(tDen < 0) errs.push('revive: never reached den');
    else if(tExit < 0) errs.push('revive: stuck in den t=' + g0.t.toFixed(2));
    else if(tOut < 0) errs.push('revive: stuck at exit door');
    else{
      var wait = (tExit - tDen) / 120;
      if(Math.abs(wait - waitWant) > 0.05) errs.push('revive wait ' + wait.toFixed(2) + ' want ' + waitWant);
    }

    /* 岔路口转向容忍：离格心 0.18 格时按垂直方向也应转过去并吸附到中心 */
    var jx = -1, jy = -1;
    for(var yy = 1; yy < ROWS - 1 && jx < 0; yy++){
      for(var xx = 1; xx < COLS - 1; xx++){
        if(walkable(xx, yy) && walkable(xx, yy - 1) && walkable(xx - 1, yy)){ jx = xx; jy = yy; break; }
      }
    }
    if(jx < 0){ errs.push('no junction for turn test'); }
    else{
      player.x = jx - 0.18; player.y = jy;
      player.dir = {x:1, y:0}; player.want = {x:0, y:-1};
      moveEntity(player, 1 / 120);
      if(!(player.dir.y === -1 && player.dir.x === 0)) errs.push('junction turn failed @' + jx + ',' + jy);
      if(Math.abs(player.x - jx) > 1e-6) errs.push('junction turn snap x=' + player.x);
      player.dir = DIR_NONE; player.want = DIR_NONE;
    }

    /* 糖霜番茄：吃掉一半籽后出现，吃到 +300 */
    resetPellets(); resetBoard(); resetFx();
    score = 0; lives = 3; night = 1; readyT = 0; state = 'play';
    pellets[START.y][START.x] = 0;
    pelletsLeft = Math.floor(pelletsTotal * .5);
    updateBonus(1 / 120);
    if(!bonus) errs.push('bonus not spawned');
    player.x = 9; player.y = 8;
    s0 = score;
    updateBonus(1 / 120);
    if(score - s0 !== 300) errs.push('bonus score ' + (score - s0));
    if(bonus) errs.push('bonus not consumed');

    /* 视觉回归：把 M3 的绘制路径都走一遍（光晕 / flee 描边 / 眼睛 / 粒子 / 糖霜番茄 / 气泡） */
    try{
      resetPellets(); resetBoard(); resetFx();
      score = 0; lives = 3; night = 1; readyT = 0; state = 'play';
      startPower();
      burst(player.x, player.y, 10, '#FFD166');
      updateParticles(1 / 120);
      /* M6-A 绘制路径：飘字 / 吃籽微缩 / 冲击环 */
      popTexts.push({gx:9, gy:8, v:10, txt:'+10', kind:'p', t:FX.txtLife, max:FX.txtLife, color:'#FFD166', big:false});
      popTexts.push({gx:9, gy:8, txt:'×4', kind:'t', t:.55, max:.55, color:'#FFFFFF', big:true});
      pops.push({gx:9, gy:8, t:FX.popLife, max:FX.popLife});
      rings.push({gx:9, gy:8, r0:.3, r1:2.0, c:'#FFD166', t:FX.ringLife, max:FX.ringLife});
      updateFx(1 / 120);
      bonus = {x:9, y:8, t:3, max:3};
      ghosts[0].mode = 'flee';
      ghosts[1].mode = 'eaten';
      draw();
      /* P1 绘制路径：死亡演出（挤压中 / 摊平后） */
      hurt(ghosts[2]);
      if(!deathFx) errs.push('deathFx not created');
      else{
        deathFx.calm = false;
        deathFx.t = .30; draw();
        deathFx.t = .80; draw();
        if(!(deathFx.wx || deathFx.wy)) errs.push('death wall dir empty');
      }
      /* P2 绘制路径：辣番茄时间环 / 糖霜倒计时 / 隧道预警 / 低血量心跳 */
      state = 'play'; deathFx = null;
      player.x = .5; player.y = 10;
      powerT = 6.5; powerMax = 8;
      lives = 1; updateHUD();
      if(!document.body.classList.contains('lowhp')) errs.push('lowhp class missing');
      draw();
      /* P3 绘制路径：窝里打盹 Zzz / 过关扫描光带 / 落脚尘点 */
      ghosts[3].mode = 'house'; ghosts[3].x = 9; ghosts[3].y = 9;
      puffDust(player);
      clearFx = {t:.6, dur:1.4};
      draw();
      clearFx = null;
    }catch(e){ errs.push('draw threw: ' + e.message); }

    showTitle();

    console.log('[pacman selftest] pellets=' + pcnt + ' power=' + power + ' mazes=' + mzLog.join('|')
      + ' theme=' + save.theme + ' light=' + (save.light ? 1 : 0) + ' lang=' + lang);
    console.log(errs.length ? '[pacman selftest] FAIL: ' + errs.join('; ') : '[pacman selftest] OK');
  }

  /* =========================================================
     7. 启动
     ========================================================= */
  resetPellets();
  resetBoard();
  applyTheme(save.theme);
  applyLang();
  $('chkDlg').checked = !!save.ui.dlg;
  $('chkSfx').checked = !!save.ui.sfx;
  $('chkMusic').checked = !!save.ui.music;
  if(save.ui.dlg){ $('dlgBar').classList.remove('off'); }else{ $('dlgBar').classList.add('off'); }
  if(mainSave.lowPower || reduceMotion){ document.body.classList.add('lp'); }
  loadSprites();
  syncTouchUI();
  layout();
  bind();
  showTitle();
  if(window.__pmIntroStart) window.__pmIntroStart('pacman-intro.html?lang=' + encodeURIComponent(lang));
  if(new URLSearchParams(location.search).get('selftest') === '1') selftest();
})();
</script>
