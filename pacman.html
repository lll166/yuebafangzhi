<!DOCTYPE html>
<html lang="zh-CN" data-theme="pumpkin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0714">
<title>月巴追茄 · 万圣夜</title>
<style>
  :root{
    --bg:#0B0714; --bg2:#151021;
    --wall:#241736; --wall2:#3A2755;
    --line:rgba(255,170,120,.22); --line2:rgba(255,170,120,.5);
    --text:#F2ECFF; --dim:#9C90B8;
    --accent:#FF8A3D; --accent2:#FFD166;
    --pellet:#F1D9A8; --power:#FFA94D; --tomato:#E5484D;
    --good:#7BD389; --danger:#E5484D;
    --onAccent:#190B04;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);}
  body{font-family:"SF Mono","Cascadia Mono",Consolas,system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;overscroll-behavior:none;}
  /* 夜色、雾与月亮：全部静态渐变，不做逐帧滤镜 */
  body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(46% 34% at 78% 8%,rgba(255,209,102,.10),transparent 70%),
      radial-gradient(70% 54% at 50% 44%,rgba(255,138,61,.055),transparent 72%),
      radial-gradient(120% 82% at 50% 8%,transparent 44%,rgba(0,0,0,.62) 100%);}
  body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:42%;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(255,138,61,.045));
    animation:fog 9s ease-in-out infinite alternate;}
  @keyframes fog{from{opacity:.55}to{opacity:1}}
  body.lp::after{animation:none;opacity:.7}
  @media (prefers-reduced-motion: reduce){body::after{animation:none}}

  #stage{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));}
  #wrap{display:flex;flex-direction:column;gap:8px;width:min(460px,100%);height:100%;justify-content:center;}

  /* ---------- 顶部 HUD ---------- */
  #topbar{display:flex;align-items:center;gap:6px;height:34px;flex:0 0 auto;}
  .brand{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:13px;font-weight:900;letter-spacing:3px;}
  .brand .bpre{font-style:normal;margin-right:4px;}
  .brand span{color:var(--accent2);}
  .stats{display:flex;align-items:center;gap:5px;margin-left:auto;flex:0 0 auto;}
  .stat{display:flex;align-items:baseline;gap:4px;padding:4px 6px;height:28px;
    border:1px solid var(--line);border-left:2px solid var(--line2);
    background:linear-gradient(180deg,rgba(21,16,33,.88),rgba(11,7,20,.94));
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  .stat span{font-size:8px;font-weight:800;letter-spacing:1.2px;color:var(--dim);}
  .stat b{display:inline-block;min-width:18px;font-size:13px;text-align:right;color:var(--accent2);
    font-variant-numeric:tabular-nums;}
  #hudLives{display:flex;align-items:center;gap:2px;font-size:11px;line-height:1;padding:4px 6px;color:var(--tomato);}
  #btnPause{flex:0 0 auto;width:32px;height:28px;font-size:11px;color:var(--accent2);cursor:pointer;
    border:1px solid var(--line);background:linear-gradient(180deg,rgba(21,16,33,.92),rgba(11,7,20,.95));
    clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%);}
  #btnPause:active{transform:translateY(1px)}

  /* ---------- 迷宫 ---------- */
  #frame{position:relative;flex:0 0 auto;margin:0 auto;line-height:0;}
  #cv{display:block;border-radius:8px;
    box-shadow:0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.55),inset 0 0 40px rgba(0,0,0,.4);}
  .corner{position:absolute;width:12px;height:12px;pointer-events:none;opacity:.85;}
  .corner::before,.corner::after{content:'';position:absolute;background:var(--accent);}
  .corner::before{width:12px;height:2px;}
  .corner::after{width:2px;height:12px;}
  .corner.tl{left:-2px;top:-2px}
  .corner.tr{right:-2px;top:-2px;transform:scaleX(-1)}
  .corner.bl{left:-2px;bottom:-2px;transform:scaleY(-1)}
  .corner.br{right:-2px;bottom:-2px;transform:scale(-1,-1)}

  #nightChip{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;
    display:none;align-items:center;gap:7px;padding:4px 10px;line-height:1;
    border:1px solid var(--line2);border-left:2px solid var(--accent);
    background:rgba(11,7,20,.82);border-radius:2px;
    font-size:10px;font-weight:900;letter-spacing:2px;color:var(--accent2);pointer-events:none;}
  #nightChip.show{display:flex}
  #nightChip em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:1px;color:var(--dim);}

  /* 开局 3-2-1 倒计时：压在迷宫正中，够大才看得见 */
  #cdown{position:absolute;left:50%;top:50%;z-index:6;display:none;pointer-events:none;
    transform:translate(-50%,-50%);font-size:clamp(52px,20vmin,92px);line-height:1;
    font-weight:900;letter-spacing:2px;color:var(--accent2);font-variant-numeric:tabular-nums;
    text-shadow:0 0 22px rgba(255,138,61,.65),0 0 46px rgba(255,138,61,.28),0 8px 26px rgba(0,0,0,.85);
    -webkit-text-stroke:2px rgba(11,7,20,.55);}
  #cdown.show{display:block}
  #cdown.pop{animation:cdpop .5s cubic-bezier(.2,1.5,.4,1)}
  @keyframes cdpop{
    0%{transform:translate(-50%,-50%) scale(.42);opacity:0;}
    62%{transform:translate(-50%,-50%) scale(1.16);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
  }
  body.lp #cdown.pop,body.lp #cdown{animation:none;transform:translate(-50%,-50%);}
  @media (prefers-reduced-motion: reduce){
    #cdown.pop{animation:none}
  }

  /* ---------- 台词常驻位（固定高度，不塌陷） ---------- */
  #dlgBar{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:8px;
    padding:6px 8px;border:1px solid var(--line);border-radius:8px;
    background:linear-gradient(180deg,rgba(21,16,33,.82),rgba(11,7,20,.9));}
  .ava{flex:0 0 auto;width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;
    border:1px solid var(--line2);background:radial-gradient(circle at 50% 40%,#2A1020,#12060C);
    box-shadow:0 0 12px rgba(229,72,77,.18);}
  .ava img{width:100%;height:100%;object-fit:cover;display:block;}
  .ava .fb{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:16px;}
  .ava.none img{display:none}
  .ava.none .fb{display:flex}
  .say{flex:1 1 auto;min-width:0;font-size:11.5px;line-height:1.5;color:var(--text);
    padding:0 10px;border-left:2px solid var(--accent);max-height:40px;overflow:hidden;}
  #sayTxt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  #dlgBar.off .say{opacity:.18;border-left-color:var(--line2)}

  /* ---------- 底部操作条 ---------- */
  #bottombar{flex:0 0 auto;height:22px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 2px;font-size:9px;letter-spacing:1px;color:var(--dim);}
  #tip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- 手机 / 平板：屏幕虚拟方向键 ---------- */
  #pad{display:none;flex:0 0 auto;margin:2px auto 0;grid-template-columns:repeat(3,46px);
    grid-template-rows:repeat(3,46px);gap:4px;
    grid-template-areas:". up ." "left . right" ". down .";}
  body.touch #pad{display:grid;}
  .pbtn{display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;
    font-size:15px;line-height:1;font-weight:900;color:var(--accent2);cursor:pointer;
    border:1px solid var(--line2);border-radius:10px;
    background:linear-gradient(180deg,rgba(36,23,54,.92),rgba(11,7,20,.95));
    box-shadow:0 2px 0 rgba(0,0,0,.45);}
  .pbtn:active,.pbtn.on{transform:translateY(1px);color:var(--onAccent);background:var(--accent);
    border-color:var(--accent);box-shadow:none;}
  .pbtn[data-dir="up"]{grid-area:up}
  .pbtn[data-dir="left"]{grid-area:left}
  .pbtn[data-dir="right"]{grid-area:right}
  .pbtn[data-dir="down"]{grid-area:down}
  /* 横屏时棋盘左右留白宽，方向键浮在左侧空白里，不挤占棋盘高度 */
  body.padFloat #pad{position:fixed;left:calc(10px + env(safe-area-inset-left));top:50%;
    transform:translateY(-50%);z-index:5;margin:0;opacity:.94;}

  /* ---------- 叠层：标题 / 暂停 ---------- */
  .overlay{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;
    overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    background:radial-gradient(80% 60% at 50% 40%,rgba(11,7,20,.72),rgba(5,3,9,.92));}
  .overlay.show{display:flex;}
  .panel{width:min(340px,100%);padding:22px 20px 18px;position:relative;margin:auto;
    background:linear-gradient(180deg,rgba(24,18,38,.98),rgba(11,7,20,.99));
    border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.65);}
  .panel::after{content:'';position:absolute;inset:7px;border:1px solid rgba(255,255,255,.035);border-radius:9px;pointer-events:none;}
  .kicker{font-size:9px;font-weight:900;letter-spacing:4px;color:var(--accent);opacity:.9;}
  h1{font-size:27px;font-weight:900;letter-spacing:6px;margin:7px 0 4px;color:var(--accent2);}
  .sub{font-size:11px;line-height:1.6;color:var(--dim);letter-spacing:.3px;}
  .bestRow{display:flex;align-items:baseline;gap:8px;margin:13px 0 12px;padding:8px 10px;
    border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.18);
    font-size:9px;letter-spacing:1.5px;color:var(--dim);}
  .bestRow b{margin-left:auto;font-size:17px;color:var(--accent2);font-variant-numeric:tabular-nums;}
  .themes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
  .thm{display:flex;align-items:center;gap:7px;padding:7px 8px;font-size:10px;font-weight:800;letter-spacing:1px;
    color:var(--dim);cursor:pointer;border:1px solid var(--line);border-radius:4px;
    background:rgba(0,0,0,.18);transition:color .15s,border-color .15s;text-align:left;}
  .thm i{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.14) inset;}
  .thm.on{color:var(--text);border-color:var(--accent);background:rgba(255,138,61,.10);}
  /* 暂停页：番茄皮肤切换 */
  .skinHead{font-size:9px;font-weight:900;letter-spacing:1.5px;color:var(--dim);margin:2px 0 6px;}
  .skins{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
  .skinBtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 4px;cursor:pointer;
    font-size:9px;font-weight:800;letter-spacing:.5px;line-height:1.2;text-align:center;color:var(--dim);
    border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.18);
    transition:color .15s,border-color .15s;}
  .skinPic{position:relative;width:26px;height:26px;border-radius:50%;overflow:hidden;display:block;
    border:1px solid var(--line2);background:rgba(0,0,0,.25);}
  /* 未选中的皮肤只做轻度灰化：压太狠会让主体看起来比选中的小，破坏「三个一样大」的观感 */
  .skinPic img{width:100%;height:100%;object-fit:cover;display:block;
    filter:grayscale(1) brightness(.82);transition:filter .15s;}
  .skinBtn small{font-size:8px;font-weight:700;letter-spacing:0;opacity:.8;}
  .skinBtn.on{color:var(--text);border-color:var(--accent);background:rgba(255,138,61,.10);}
  .skinBtn.on .skinPic img{filter:none;}
  .skinBtn.lock{cursor:not-allowed;}
  .skinBtn.lock .skinPic img{filter:grayscale(1) brightness(.5);}
  .primary{width:100%;height:46px;margin-top:2px;font-size:14px;font-weight:900;letter-spacing:5px;
    color:var(--onAccent);cursor:pointer;border:0;border-radius:6px;
    background:linear-gradient(180deg,var(--accent2),var(--accent));
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);}
  .primary:active{transform:translateY(1px);filter:brightness(.94)}
  .ghostBtn{width:100%;height:40px;margin-top:8px;font-size:11px;font-weight:800;letter-spacing:2px;
    color:var(--accent2);cursor:pointer;border:1px solid var(--line2);border-radius:4px;
    background:rgba(0,0,0,.2);}
  .ghostBtn:active{transform:translateY(1px)}
  .swRow{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:10px;letter-spacing:1px;color:var(--dim);cursor:pointer;}
  .swRow input{appearance:none;width:32px;height:18px;border-radius:9px;border:1px solid var(--line2);
    background:rgba(0,0,0,.35);position:relative;cursor:pointer;transition:background .18s;}
  .swRow input::after{content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;
    background:var(--dim);transition:transform .18s,background .18s;}
  .swRow input:checked{background:rgba(255,138,61,.28);border-color:var(--accent);}
  .swRow input:checked::after{transform:translateX(14px);background:var(--accent2);}
  .hint{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);
    font-size:9px;line-height:1.7;letter-spacing:.6px;color:var(--dim);}
  .hint b{color:var(--accent2);font-weight:800;}
  html[lang="ko"] .hint{word-break:keep-all;}

  /* ---------- 语言切换 ---------- */
  .accRow{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:10px;letter-spacing:1px;color:var(--dim);}
  .accRow span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .miniBtn{flex:0 0 auto;height:24px;padding:0 9px;font-size:9px;font-weight:800;letter-spacing:1px;
    color:var(--accent2);cursor:pointer;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.2);}
  .miniBtn:active{transform:translateY(1px)}
  .langBtn{min-width:30px;padding:0 7px;letter-spacing:.5px;}
  .langBtn.on{color:var(--onAccent);background:var(--accent);border-color:var(--accent);}

  /* ---------- 成就层 ---------- */
  .achHead{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px;
    font-size:9px;letter-spacing:1.5px;color:var(--dim);}
  .achHead b{margin-left:auto;font-size:13px;color:var(--accent2);font-variant-numeric:tabular-nums;}
  .achList{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;padding:6px 1px;}
  .achRow{display:flex;align-items:flex-start;gap:8px;padding:7px 9px;font-size:10.5px;letter-spacing:.6px;
    border:1px solid var(--line);border-radius:5px;background:rgba(0,0,0,.18);color:var(--dim);}
  .achRow i{font-style:normal;flex:0 0 auto;line-height:1.35;color:var(--line2);}
  .achTxt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .achTxt>span{line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .achTxt em{font-style:normal;font-size:9px;line-height:1.45;letter-spacing:.2px;color:var(--dim);
    overflow-wrap:break-word;word-break:normal;}
  .achRow b{flex:0 0 auto;line-height:1.35;font-size:8.5px;font-weight:800;letter-spacing:1px;color:var(--dim);}
  html[lang="ko"] .achTxt em{word-break:keep-all;}
  .achRow.on{color:var(--text);border-color:var(--accent);}
  .achRow.on i{color:var(--accent2);}
  .achRow.on b{color:var(--good);}
  #achToast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:40;
    transform:translate(-50%,-8px);padding:7px 14px;font-size:10px;font-weight:800;letter-spacing:1px;
    color:var(--accent2);background:rgba(11,7,20,.94);border:1px solid var(--accent);border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis;}
  #achToast.on{opacity:1;transform:translate(-50%,0)}

  /* ---------- 月巴跟头气泡 ---------- */
  #gSay{position:absolute;left:0;top:0;transform:translate(-50%,-100%);max-width:150px;
    padding:3px 7px;font-size:9.5px;line-height:1.4;letter-spacing:.3px;color:var(--text);
    background:linear-gradient(180deg,rgba(24,18,38,.96),rgba(11,7,20,.96));
    border:1px solid var(--line2);border-radius:7px;pointer-events:none;opacity:0;
    transition:opacity .18s;white-space:normal;text-align:center;z-index:3;}
  #gSay.on{opacity:1}
  #gSay::after{content:'';position:absolute;left:50%;bottom:-5px;width:8px;height:8px;
    margin-left:-4px;background:rgba(11,7,20,.96);border-right:1px solid var(--line2);
    border-bottom:1px solid var(--line2);transform:rotate(45deg);}

  /* ---------- M6-A：反吃白闪 / 受击红闪 / 撞墙轻推 ---------- */
  #flash{position:fixed;inset:0;z-index:25;pointer-events:none;background:#fff;opacity:0;}
  #flash.on{animation:pmFlash .15s ease-out}
  @keyframes pmFlash{0%{opacity:.18}100%{opacity:0}}
  #hurtFx{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse 76% 70% at 50% 50%,transparent 50%,rgba(229,72,77,.6) 100%);}
  #hurtFx.on{animation:pmHurt .35s ease-out}
  @keyframes pmHurt{0%{opacity:.5}100%{opacity:0}}
  body.lp #hurtFx.on{animation:pmHurtLow .18s ease-out}
  @keyframes pmHurtLow{0%{opacity:.18}100%{opacity:0}}
  body.lp #flash.on{animation:none}
  #cv.bump{animation:pmBump .12s linear}
  @keyframes pmBump{0%,100%{transform:translate(0,0)}
    35%{transform:translate(var(--bx,0px),var(--by,0px))}}
  body.lp #cv.bump{animation:none}
  #cv.punch{animation:pmPunch .18s ease-out}
  @keyframes pmPunch{0%{transform:scale(1.006)}100%{transform:scale(1)}}
  body.lp #cv.punch{animation:none}

  /* ---------- 轻震（低功耗 / 减动效时关闭） ---------- */
  #cv.shake{animation:pmShake .22s linear}
  @keyframes pmShake{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}
    50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(0,0)}}
  body.lp #cv.shake{animation:none}

  @media (prefers-reduced-motion: reduce){
    #cv.shake,#cv.bump,#cv.punch,#flash.on{animation:none}
    #hurtFx.on{animation:none}
  }

  /* ---------- P2：低血量心跳（静态渐变 + 只动 opacity） ---------- */
  #lowHp{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse 88% 84% at 50% 50%,transparent 50%,rgba(229,72,77,.85) 100%);}
  body.lowhp #lowHp{animation:pmBeat 1.15s ease-in-out infinite}
  @keyframes pmBeat{0%{opacity:.09}12%{opacity:.30}26%{opacity:.13}40%{opacity:.26}100%{opacity:.09}}
  body.lp #lowHp{animation:none;opacity:.16}
  @media (prefers-reduced-motion: reduce){
    #lowHp{animation:none !important;opacity:.14}
  }

  /* ---------- P3：新纪录星芒（结算页） ---------- */
  #newBestTag{position:relative}
  #newBestTag.star{color:var(--accent2);
    text-shadow:0 0 12px rgba(255,209,102,.55),0 0 30px rgba(255,138,61,.3);
    animation:pmBestPop .85s cubic-bezier(.2,1.5,.4,1) 1 both;}
  @keyframes pmBestPop{0%{transform:scale(.72);opacity:0}62%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
  #newBestTag.star::before,#newBestTag.star::after{content:'✦';position:absolute;top:50%;font-size:13px;
    animation:pmTwinkle 1.4s ease-in-out infinite;}
  #newBestTag.star::before{left:4px}
  #newBestTag.star::after{right:4px;animation-delay:.35s}
  @keyframes pmTwinkle{
    0%,100%{opacity:.22;transform:translateY(-50%) scale(.7) rotate(0deg)}
    50%{opacity:1;transform:translateY(-50%) scale(1.15) rotate(22deg)}
  }
  @media (prefers-reduced-motion: reduce){
    #newBestTag.star,#newBestTag.star::before,#newBestTag.star::after{animation:none}
    #newBestTag.star::before,#newBestTag.star::after{transform:translateY(-50%);opacity:.8}
  }
  body.lp #newBestTag.star,body.lp #newBestTag.star::before,body.lp #newBestTag.star::after{animation:none}

  .fly:nth-child(1){left:12%;top:66%;--dx:16px;--dy:-20px;--d:11s;animation-delay:0s,-.4s}
  .fly:nth-child(2){left:31%;top:38%;--dx:-14px;--dy:-26px;--d:13s;animation-delay:-2.5s,-1.6s}

  .fly:nth-child(5){left:82%;top:34%;--dx:-12px;--dy:18px;--d:10s;animation-delay:-5.2s,-.9s}

<div id="introWrap">
  <iframe id="introFrame" title="月巴追茄 · 开场"></iframe>

  <button id="introFallback" type="button">直接进入 ›</button>

<script>
/* 开场页接口协议（pacman-intro.html）
   iframe → 父页：pacman-intro-ready（首帧已绘制，可淡入）
                  pacman-intro-done （用户已进入，父页淡出并移除）
   父页 → iframe：pacman-intro-close（强制关闭，兜底按钮使用） */
(function(){
  var wrap=document.getElementById('introWrap');
  var frame=document.getElementById('introFrame');
  var fallback=document.getElementById('introFallback');
  var ready=false, closed=false, started=false;
  function close(){
    if(closed) return;
    closed=true;
    try{ frame.contentWindow.postMessage({type:'pacman-intro-close'}, '*'); }catch(err){}
    wrap.classList.add('out');
    setTimeout(function(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); },470);
  }
  function start(src){
    if(started || closed || !src) return;
    started=true;
    frame.src=src;
    setTimeout(function(){ if(!ready && !closed) wrap.classList.add('slow'); },4200);
  }
  window.__pmIntroStart=start;
  window.__pmIntroActive=function(){ return !closed; };
  window.addEventListener('message',function(e){
    if(!frame || e.source!==frame.contentWindow) return;
    var d=e.data||{};
    if(d.type==='pacman-intro-ready'){ ready=true; wrap.classList.add('ready'); }
    else if(d.type==='pacman-intro-done'){ close(); }
  });
  frame.addEventListener('error',function(){
    wrap.classList.add('slow');
    setTimeout(function(){ if(!ready) close(); },1200);   /* 开场页加载失败：别把游戏挡在黑屏后面 */
  });
  /* iframe load 兜底：即使 postMessage 被环境拦截（部分 WebView / file://），也解除遮罩显示开场页 */
  frame.addEventListener('load',function(){
    if(!started) return;   /* 初始 about:blank 的那次 load 不算 */
    ready=true; wrap.classList.add('ready');
  });
  fallback.addEventListener('click',close);
})();
</script>

  /* 已解锁月巴的立绘池：只读主存档 collection / collection2 / collection3 的键。
     圆圈颜色依旧代表行动模式，只有立绘换脸，所以行为与难度不受影响。 */
  var facePool = null;
  function unlockedFaces(){
    if(facePool) return facePool;
    var seen = {}, pool = [];
    ['collection', 'collection2', 'collection3'].forEach(function(k){
      var c = mainSave[k];
      if(!c || typeof c !== 'object') return;
      for(var id in c){
        if(seen[id] || !DEX_ART[id]) continue;      /* 只取有外链立绘的 */
        if(id === CAST[4].id) continue;             /* 万圣月巴立绘固定，不参与随机 */
        var e = c[id];
        var n = (typeof e === 'number') ? e : (e && typeof e === 'object' ? (+e.count || 0) : 0);
        if(!(n > 0)) continue;
        seen[id] = 1;
        pool.push(id);
      }
    });
    facePool = pool;
    return pool;
  }

  /* 本夜四只追兵的随机立绘（洗牌后取前 n 个；池子不够就循环复用）。
     同一夜内保持稳定：掉命重生不换脸，进下一夜才重摇。 */
  var runFaces = null, runFacesNight = 0;
  function pickFaces(n){
    if(runFaces && runFacesNight === night) return runFaces;
    var pool = unlockedFaces().slice();
    for(var j = pool.length - 1; j > 0; j--){
      var k = Math.floor(Math.random() * (j + 1)), t = pool[j];   /* 真随机：每次进夜都可能换脸 */
      pool[j] = pool[k]; pool[k] = t;
    }
    var out = [];
    for(var i = 0; i < n; i++){
      /* 没有图鉴数据（独立打开 / 全部未解锁）：回退到原本的四只 */
      out.push(pool.length ? pool[i % pool.length] : CAST[i].id);
    }
    runFaces = out; runFacesNight = night;
    return out;
  }

  function readMain(){

  function defaultSave(){

      ach:{}, ui:{dpad:true, dlg:true, sfx:true, music:true, tips:true}

  function normalizeSave(raw){
    var d = defaultSave(), s = (raw && typeof raw === 'object') ? raw : {};
    if(THEMES[s.theme]) d.theme = s.theme;
    if(typeof s.light === 'boolean') d.light = s.light;
    d.best = (typeof s.best === 'number' && isFinite(s.best) && s.best >= 0) ? Math.floor(s.best) : 0;
    d.bestNight = (typeof s.bestNight === 'number' && isFinite(s.bestNight)) ? Math.max(0, Math.floor(s.bestNight)) : 0;
    for(var si = 0; si < SKINS.length; si++){ if(SKINS[si].id === s.skin){ d.skin = s.skin; break; } }
    if(s.stats && typeof s.stats === 'object'){
      ['plays','nights','pellets','ghosts','maxCombo','talks'].forEach(function(k){
        var v = s.stats[k];
        d.stats[k] = (typeof v === 'number' && isFinite(v) && v >= 0) ? Math.floor(v) : 0;
      });
    }
    if(s.ach && typeof s.ach === 'object') d.ach = s.ach;

  /* ---- 番茄皮肤 ---- */
  function skinOf(id){
    for(var i = 0; i < SKINS.length; i++){ if(SKINS[i].id === id) return SKINS[i]; }

  /* 立绘 id → 皮肤（只有番茄皮肤走「统一大小」的烘焙） */
  function skinByFace(id){

    return null;

  /* 缩略图 / 头像用的倍数：把主体拉回与画布一致的占比 */
  function skinZoom(s){
    var b = s.box || [0, 0, 1, 1];
    var m = Math.max(b[2] - b[0], b[3] - b[1]);

  function skinUnlocked(s){ return !s.need || !!save.ach[s.need]; }

  /* ---- 主色文本对比度守卫（WCAG 4.5:1） ---- */
  function hexToRgb(h){
    h = String(h || '').replace('#', '');
    if(h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    if(!/^[0-9a-fA-F]{6}$/.test(h)) h = 'FF8A3D';
    var n = parseInt(h, 16);
    return {r:(n >> 16) & 255, g:(n >> 8) & 255, b:n & 255};
  }
  function relLum(hex){
    var c = hexToRgb(hex);
    function ch(v){ v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }
    return .2126 * ch(c.r) + .7152 * ch(c.g) + .0722 * ch(c.b);
  }
  function contrastRatio(a, b){
    var la = relLum(a), lb = relLum(b);
    return (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05);
  }
  function onAccentColor(accent, accent2){
    var dark = '#190B04', light = '#FFF8F0';
    var cd = Math.min(contrastRatio(dark, accent), contrastRatio(dark, accent2 || accent));
    var cl = Math.min(contrastRatio(light, accent), contrastRatio(light, accent2 || accent));
    return cl > cd ? light : dark;
  }
  function activeTheme(){
    return THEMES[save.light ? 'day' : save.theme] || THEMES.pumpkin;
  }

  function applyTheme(id){
    save.theme = THEMES[id] ? id : 'pumpkin';
    var th = activeTheme();
    var root = document.documentElement;
    for(var k in th){
      if(k === 'name') continue;
      root.style.setProperty('--' + k, th[k]);
    }
    root.style.setProperty('--onAccent', onAccentColor(th.accent, th.accent2));
    root.setAttribute('data-theme', save.theme);
    root.setAttribute('data-light', save.light ? '1' : '0');
    var mc = document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute('content', th.bg);
    var lc = $('chkLight');
    if(lc) lc.checked = !!save.light;
    renderThemes();
    buildStatic();
    draw();
  }

  function renderThemes(){

  /* =========================================================
     3. 迷宫绘制
     ========================================================= */
  var cv = $('cv'), ctx = cv.getContext('2d');
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var tile = 18, boardW = 0, boardH = 0;
  var wallCv = null, wallEdgeCv = null, pelletCv = null;
  var sprites = {};
  var state = 'title';

  window.__pmState = function(){ return state; };

  function tileChar(x, y){
    if(y < 0 || y >= ROWS || x < 0 || x >= COLS){
      if(y === 10) return ' ';          /* 隧道两侧 */
      return '#';
    }
    return MAZE[y].charAt(x);
  }

  /* 手机 / 平板才显示屏幕方向键；横屏（棋盘左右留白宽）时浮在左侧 */
  function syncTouchUI(){
    var coarse = !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches);
    document.body.classList.toggle('touch', coarse);
    document.body.classList.toggle('padFloat', coarse && window.innerWidth > window.innerHeight);
    return coarse;
  }

  function layout(){
    var top = $('topbar').offsetHeight || 34;
    var dlg = $('dlgBar').offsetHeight || 52;
    var bot = $('bottombar').offsetHeight || 22;
    /* 竖屏方向键在正常流里，要连间距一起扣掉；横屏是浮层，不占位 */
    var inFlow = document.body.classList.contains('touch') && !document.body.classList.contains('padFloat');
    var pad = inFlow ? ($('pad').offsetHeight || 0) + 8 : 0;
    var gaps = 8 * (pad ? 4 : 3);
    var stagePad = 20;
    var availH = window.innerHeight - top - dlg - bot - pad - gaps - stagePad;
    var availW = $('wrap').clientWidth || (window.innerWidth - 24);
    var maxW = Math.min(availW, 460);
    tile = Math.max(12, Math.floor(Math.min(maxW / COLS, availH / ROWS)));
    boardW = tile * COLS;
    boardH = tile * ROWS;
    cv.style.width = boardW + 'px';
    cv.style.height = boardH + 'px';
    cv.width = Math.round(boardW * dpr);
    cv.height = Math.round(boardH * dpr);
    buildStatic();
    draw();
  }

  function roundRectPath(c, x, y, w, h, r){
    if(c.roundRect){ c.beginPath(); c.roundRect(x, y, w, h, r); return; }
    var rr = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + rr, y);
    c.lineTo(x + w - rr, y);
    c.quadraticCurveTo(x + w, y, x + w, y + rr);
    c.lineTo(x + w, y + h - rr);
    c.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    c.lineTo(x + rr, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - rr);
    c.lineTo(x, y + rr);
    c.quadraticCurveTo(x, y, x + rr, y);
    c.closePath();
  }

  function buildStatic(){
    if(!boardW || !boardH) return;
    var th = curTheme();

    /* 墙面层 */
    wallCv = document.createElement('canvas');
    wallCv.width = Math.round(boardW * dpr);
    wallCv.height = Math.round(boardH * dpr);
    var wc = wallCv.getContext('2d');
    wc.setTransform(dpr, 0, 0, dpr, 0, 0);
    wc.fillStyle = th.wall;
    for(var y = 0; y < ROWS; y++){
      for(var x = 0; x < COLS; x++){
        if(tileChar(x, y) !== '#') continue;
        roundRectPath(wc, x * tile - 0.5, y * tile - 0.5, tile + 1, tile + 1, Math.max(2, tile * 0.16));
        wc.fill();
      }
    }
    /* 墙面顶部暖光 + 底部压暗，一次性烘进静态层 */
    wc.globalCompositeOperation = 'source-atop';
    var g = wc.createLinearGradient(0, 0, 0, boardH);
    g.addColorStop(0, 'rgba(255,190,130,.10)');
    g.addColorStop(.55, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.22)');
    wc.fillStyle = g;
    wc.fillRect(0, 0, boardW, boardH);
    wc.globalCompositeOperation = 'source-over';

    /* 豆层：只在尺寸变化与吃到籽时重绘 */
    ensurePelletCanvas();
    paintPellets();
    buildWallEdge();
  }

  /* M6-C1：单独烘一层 1px 墙边（只画墙格与非墙格交界），供 draw 里叠呼吸 */
  function buildWallEdge(){
    wallEdgeCv = document.createElement('canvas');
    wallEdgeCv.width = Math.round(boardW * dpr);
    wallEdgeCv.height = Math.round(boardH * dpr);
    var ec = wallEdgeCv.getContext('2d');
    ec.setTransform(dpr, 0, 0, dpr, 0, 0);
    var th = curTheme();
    ec.strokeStyle = hexA(th.accent2, .9);
    ec.lineWidth = Math.max(1, Math.min(1.8, tile * .08));
    ec.lineCap = 'butt';
    ec.beginPath();
    for(var y = 0; y < ROWS; y++){
      for(var x = 0; x < COLS; x++){
        if(tileChar(x, y) !== '#') continue;
        var x0 = x * tile, y0 = y * tile;
        if(tileChar(x, y - 1) !== '#'){ ec.moveTo(x0, y0); ec.lineTo(x0 + tile, y0); }
        if(tileChar(x, y + 1) !== '#'){ ec.moveTo(x0, y0 + tile); ec.lineTo(x0 + tile, y0 + tile); }
        if(tileChar(x - 1, y) !== '#'){ ec.moveTo(x0, y0); ec.lineTo(x0, y0 + tile); }
        if(tileChar(x + 1, y) !== '#'){ ec.moveTo(x0 + tile, y0); ec.lineTo(x0 + tile, y0 + tile); }
      }
    }
    ec.stroke();
  }

  function ensurePelletCanvas(){
    var w = Math.round(boardW * dpr), h = Math.round(boardH * dpr);
    if(pelletCv && pelletCv.width === w && pelletCv.height === h) return;
    pelletCv = document.createElement('canvas');
    pelletCv.width = w;
    pelletCv.height = h;
  }

  function paintPellets(){
    if(!pelletCv) return;
    var th = curTheme();
    var pc = pelletCv.getContext('2d');
    pc.setTransform(dpr, 0, 0, dpr, 0, 0);
    pc.clearRect(0, 0, boardW, boardH);

    for(var y = 0; y < ROWS; y++){
      for(var x = 0; x < COLS; x++){
        var cx = (x + .5) * tile, cy = (y + .5) * tile;
        if(tileChar(x, y) === ' '){
          pc.fillStyle = 'rgba(255,190,120,.045)';
          pc.fillRect(x * tile, y * tile, tile, tile);
          continue;
        }
        var v = pellets[y] ? pellets[y][x] : 0;
        if(!v) continue;
        if(v === 1){
          pc.fillStyle = th.pellet;
          pc.globalAlpha = .9;
          pc.beginPath();
          pc.arc(cx, cy, Math.max(1.4, tile * .105), 0, Math.PI * 2);
          pc.fill();
          pc.globalAlpha = 1;
        }else{
          var rg = pc.createRadialGradient(cx, cy, 0, cx, cy, tile * .34);
          rg.addColorStop(0, hexA(th.power, .95));
          rg.addColorStop(.55, hexA(th.power, .55));
          rg.addColorStop(1, hexA(th.power, 0));
          pc.fillStyle = rg;
          pc.beginPath();
          pc.arc(cx, cy, tile * .34, 0, Math.PI * 2);
          pc.fill();
          pc.fillStyle = th.power;
          pc.beginPath();
          pc.arc(cx, cy, tile * .21, 0, Math.PI * 2);
          pc.fill();
        }
      }
    }

    /* 窝门 */
    var gateX = 9 * tile, gateY = 9 * tile;
    pc.fillStyle = th.accent2;
    pc.globalAlpha = .8;
    pc.fillRect(gateX + tile * .12, gateY + tile * .42, tile * .76, Math.max(1.5, tile * .11));
    pc.globalAlpha = 1;
  }

  function hexA(hex, a){
    var h = hex.replace('#', '');
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  function draw(){
    if(!boardW || !boardH || !wallCv) return;
    var th = curTheme();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, boardW, boardH);

    /* 迷宫底色 */
    var bg = ctx.createRadialGradient(boardW / 2, boardH * .42, tile, boardW / 2, boardH * .42, boardH * .78);
    bg.addColorStop(0, hexA(th.bg2, .96));
    bg.addColorStop(1, hexA(th.bg, .99));
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, boardW, boardH);

    ctx.drawImage(wallCv, 0, 0, boardW, boardH);
    /* M6-C1：墙边随呼吸微微起伏（低功耗固定 .06） */
    if(wallEdgeCv){
      ctx.globalAlpha = lpMode() ? .06 : .05 + .04 * Math.sin(animT * .9);
      ctx.drawImage(wallEdgeCv, 0, 0, boardW, boardH);
      ctx.globalAlpha = 1;
    }
    if(pelletCv) ctx.drawImage(pelletCv, 0, 0, boardW, boardH);
    drawPops(th);

    if(bonus) drawBonus(th);
    /* 最后 1.5 秒光晕闪烁 */
    var flashOn = !(powerT > 0 && powerT < 1.5 && Math.floor(powerT * 8) % 2 === 0);
    /* 死亡演出期间：番茄与被按住的月巴改由 drawDeath 绘制 */
    var dying = state === 'dead' && deathFx;
    if(player && !dying){
      if(powerT > 0 && flashOn) drawGlow((player.x + .5) * tile, (player.y + .5) * tile, th);
      var pMove = !!(player.hold && (player.want.x || player.want.y));
      var sk = curSkin();
      var pa = bounceAnim(animScale('player', pMove, 0), player);
      /* 省电/减少动效下 animScale 直接返回 null：不能再往 null 上挂旋转/翻转字段 */
      if(pa){
        pa.rot = tiltAngle(player) + leanAngle(player);
        pa.flip = player.facing || 1;
      }
      drawSprite(sk.face, player.x, player.y, th.tomato, 1.35 * (sk.zoom || 1), false, false, pa);
      if(powerT > 0) drawPowerRing(th);
    }
    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      if(dying && i === deathFx.idx) continue;
      var eyes = g.mode === 'eaten' || g.mode === 'dried' || !!g.reviving;
      /* 反吃吸入：0.18 秒缩向番茄 */
      if(g.inhaleT > 0){
        var ik = 1 - g.inhaleT / g.inhaleMax;
        ctx.globalAlpha = Math.max(0, 1 - ik * .85);
        drawSprite(g.face || g.id, g.inhaleX + (g.inhaleToX - g.inhaleX) * ik,
                   g.inhaleY + (g.inhaleToY - g.inhaleY) * ik, g.ring,
                   1.35 * (1 - ik * .78), false, false, null);
        ctx.globalAlpha = 1;
        continue;
      }
      /* 第 1 夜被榨干的小眼睛就地不动，所以不给它跳动动画 */
      var ga = g.mode === 'dried' ? null : animScale('ghost', true, i);
      if(ga){
        ga.rot = tiltAngle(g);
        ga.flip = g.facing || 1;
        bounceAnim(ga, g);
      }
      if(g.trails && g.trails.length) drawTrails(g);
      drawSprite(g.face || g.id, g.x, g.y, g.ring, 1.35, g.mode === 'flee', eyes, ga);
      /* P3-N13：窝里待命的月巴打盹 Zzz */
      if(g.mode === 'house') drawNapZ(g);
    }
    drawParticles();
    drawDeath();
    drawTunnelHints(th);
    drawClearScan(th);
    drawClearLamps(th);
    drawRings();
    drawPopTexts();
    placeGSay();
    syncSour();
  }

  /* M6-P1：死亡演出——月巴把番茄按在墙上挤三下（Q弹），随后摊平躺地不动 */
  function drawDeath(){
    var d = deathFx;
    if(!d) return;
    var th = curTheme();
    var t = d.t;
    var nx = d.wx, ny = d.wy;
    var horiz = Math.abs(nx) >= Math.abs(ny);
    /* 三次挤压：0.10s 开始，0.68s 结束 */
    var sq = 0;
    if(!d.calm && t >= .10 && t < .68) sq = Math.abs(Math.sin((t - .10) / .58 * Math.PI * 3));
    var sx = 1, sy = 1, lift = 0, gsx = 1, gsy = 1;
    if(d.calm || t >= .68){
      /* 摊平：横向摊开、纵向压扁、贴到地面 */
      var e = d.calm ? 1 : 1 - Math.pow(1 - Math.min(1, (t - .68) / .20), 3);
      sx = 1 + .18 * e;
      sy = 1 - .48 * e;
      lift = tile * .11 * e;
      gsx = 1 + .04 * e;
    }else if(horiz){
      sx = 1 - .22 * sq; sy = 1 + .11 * sq;
      gsx = 1 + .10 * sq; gsy = 1 - .07 * sq;
    }else{
      sy = 1 - .22 * sq; sx = 1 + .11 * sq;
      gsy = 1 + .10 * sq; gsx = 1 - .07 * sq;
    }
    /* 番茄沿墙面法线往里顶；月巴在身后同步压进去 */
    var pin = .14 + sq * .05;
    var px = d.px + nx * pin, py = d.py + ny * pin;
    var off = -.68 + sq * .14 + (d.calm || t >= .68 ? .12 : 0);
    drawSprite(d.gid, d.px + nx * off, d.py + ny * off, d.ring, 1.35, false, false,
               {sx:gsx, sy:gsy, lift:0});
    var sk = curSkin();
    drawSprite(sk.face, px, py, th.tomato, 1.35 * (sk.zoom || 1), false, false,
               {sx:sx, sy:sy, lift:lift});
  }

  /* 辣番茄：番茄外圈烛黄光晕 + 轻微脉冲 */
  function drawGlow(cx, cy, th){
    var pulse = 1 + Math.sin(animT * 9) * .07;
    var r = tile * 1.25 * pulse;
    var rg = ctx.createRadialGradient(cx, cy, tile * .18, cx, cy, r);
    rg.addColorStop(0, hexA(th.accent2, .5));
    rg.addColorStop(.45, hexA(th.accent2, .18));
    rg.addColorStop(1, hexA(th.accent2, 0));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  /* 糖霜番茄：白色糖霜 + 冷光 */
  function drawBonus(th){
    var cx = (bonus.x + .5) * tile, cy = (bonus.y + .5) * tile;
    var pulse = 1 + Math.sin(animT * 6) * .08;
    var r = tile * .56 * pulse;
    var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.2);
    rg.addColorStop(0, hexA(th.accent2, .5));
    rg.addColorStop(1, hexA(th.accent2, 0));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = th.tomato;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.88)';
    ctx.beginPath();
    ctx.arc(cx - r * .30, cy - r * .26, r * .28, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx + r * .34, cy + r * .12, r * .17, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = th.good;
    ctx.beginPath();
    ctx.ellipse(cx, cy - r * .84, r * .34, r * .16, 0, 0, Math.PI * 2);
    ctx.fill();

    /* P2-N6：倒计时细弧；最后 1.5 秒闪一下提醒要消失了 */
    var bt = bonus.max || 0;
    if(bt > 0){
      var k = Math.max(0, Math.min(1, bonus.t / bt));
      ctx.globalAlpha = bonus.t < 1.5 ? .3 + .6 * Math.abs(Math.sin(animT * 9)) : .8;
      ctx.strokeStyle = th.accent2;
      ctx.lineWidth = Math.max(1.4, tile * .06);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(cx, cy, tile * .72, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  /* P2-N5：辣番茄剩余时间环，从 12 点走满一圈后结束 */
  function drawPowerRing(th){
    if(powerMax <= 0 || !player) return;
    var k = Math.max(0, Math.min(1, powerT / powerMax));
    var cx = (player.x + .5) * tile, cy = (player.y + .5) * tile;
    var r = tile * .88;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.globalAlpha = .20;
    ctx.strokeStyle = th.accent2;
    ctx.lineWidth = Math.max(1.4, tile * .06);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = powerT < 1.5 ? .35 + .55 * Math.abs(Math.sin(animT * 9)) : .9;
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.stroke();
    ctx.restore();
  }

  /* P2-N8：隧道边缘预警——贴近左右出口时，在对应边界亮起箭头 */
  function drawTunnelHints(th){
    hintTunnel(player);
    for(var i = 0; i < ghosts.length; i++){
      var g = ghosts[i];
      if(g.mode === 'house' || g.mode === 'dried') continue;
      hintTunnel(g);
    }
    function hintTunnel(e){
      if(!e || Math.abs(e.y - 10) > .6) return;
      var left = e.x < COLS / 2;
      var dist = left ? e.x : COLS - 1 - e.x;
      if(dist > 2.4) return;
      var k = 1 - Math.max(0, dist) / 2.4;
      var rowY = (10 + .5) * tile;
      var dir = left ? -1 : 1;
      var edge = left ? 0 : boardW;
      var span = tile * 3.2;
      var lg = ctx.createLinearGradient(edge, 0, edge - dir * span, 0);
      lg.addColorStop(0, hexA(th.accent2, .5 * k + .12));
      lg.addColorStop(1, hexA(th.accent2, 0));
      ctx.fillStyle = lg;
      ctx.fillRect(left ? 0 : boardW - span, rowY - tile, span, tile * 2);
      var pulse = (reduceMotion || lpMode()) ? 0 : (Math.sin(animT * 6) * .5 + .5);
      ctx.globalAlpha = .25 + .5 * k;
      ctx.fillStyle = th.accent2;
      for(var n = 0; n < 2; n++){
        var ax = edge + dir * (tile * (.7 + n * .5) + pulse * tile * .26);
        ctx.beginPath();
        ctx.moveTo(ax, rowY);
        ctx.lineTo(ax - dir * tile * .32, rowY - tile * .40);
        ctx.lineTo(ax - dir * tile * .32, rowY + tile * .40);
        ctx.closePath();
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  /* P3-N13：窝里打盹——头顶缓缓飘起的 Zzz */
  function drawNapZ(g){
    var th = curTheme();
    var calm = lpMode() || reduceMotion;
    var cx = (g.x + .5) * tile, cy = (g.y + .5) * tile - tile * .62;
    ctx.save();
    ctx.textAlign = 'center';
    for(var n = 0; n < 2; n++){
      var ph = calm ? 0 : (animT * .5 + n * .5) % 1;
      ctx.globalAlpha = calm ? (.5 - n * .16) : Math.max(0, (1 - ph) * .7);
      ctx.fillStyle = th.accent2;
      ctx.font = '900 ' + Math.round(tile * (.36 - n * .08)) + 'px "SF Mono",Consolas,sans-serif';
      ctx.fillText('Z', cx + tile * (.20 + n * .10), cy - ph * tile * .7 - n * tile * .26);
    }
    ctx.restore();
  }

  /* M6-B4：隧道段的半透明残影（最多 4 层，越旧越淡） */
  function drawTrails(g){
    if(!g.trails || !g.trails.length) return;
    var size = tile * 1.35 * .44;
    var col = faceColor(g.face || g.id, g.ring);
    for(var i = g.trails.length - 1; i >= 0; i--){
      var t = g.trails[i];
      if(t.x < -1 || t.x > COLS) continue;        /* 环绕那一帧不画跨越半屏的影子 */
      var k = Math.max(0, t.t / FX.trailLife);
      ctx.fillStyle = hexA(col, .10 * k / (i + 1));
      ctx.beginPath();
      ctx.arc((t.x + .5) * tile, (t.y + .5) * tile, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* P3-N10：过关扫描——1.4 秒内一道光带自左向右扫过整块迷宫 */
  function drawClearScan(th){
    if(!clearFx || lpMode() || reduceMotion) return;
    var k = Math.max(0, Math.min(1, clearFx.t / clearFx.dur));
    var x = (k * 1.14 - .07) * boardW;
    var band = tile * 3.2;
    var lg = ctx.createLinearGradient(x - band, 0, x + band * .16, 0);
    lg.addColorStop(0, hexA(th.accent2, 0));
    lg.addColorStop(.72, hexA(th.accent2, .15));
    lg.addColorStop(1, hexA(th.accent2, .32));
    ctx.fillStyle = lg;
    ctx.fillRect(x - band, 0, band * 1.16, boardH);
    ctx.fillStyle = hexA(th.accent2, .5);
    ctx.fillRect(x, 0, Math.max(1, tile * .06), boardH);
  }

  /* M6-C5：过关点灯——四颗南瓜糖的位置自左向右依次亮起，约 1.2 秒走完 */
  function drawClearLamps(th){
    if(state !== 'clear' || !POWER_POS.length) return;
    var calm = lpMode() || reduceMotion;
    for(var i = 0; i < POWER_POS.length; i++){
      var p = POWER_POS[i];
      var t = lampT - i * FX.lampGap;
      if(t <= 0) continue;
      var k = Math.min(1, t / FX.lampLit);
      var e = 1 - Math.pow(1 - k, 3);
      var cx = (p.x + .5) * tile, cy = (p.y + .5) * tile;
      var pulse = calm ? 0 : (Math.sin(animT * 5 + i * .8) * .5 + .5);
      var r = tile * (.30 + .06 * pulse) * (.62 + .38 * e);
      /* 光晕 */
      var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, tile * 1.5);
      rg.addColorStop(0, hexA(th.accent2, .5 * e));
      rg.addColorStop(.42, hexA(th.accent2, .2 * e));
      rg.addColorStop(1, hexA(th.accent2, 0));
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(cx, cy, tile * 1.5, 0, Math.PI * 2);
      ctx.fill();
      /* 灯芯 */
      ctx.globalAlpha = e;
      ctx.fillStyle = th.accent2;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,250,224,.85)';
      ctx.beginPath();
      ctx.arc(cx, cy, r * .45, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  /* 月巴跟头气泡定位（#gSay 位于 #frame 内，坐标即棋盘像素） */
  function placeGSay(){
    if(gSayIdx < 0) return;
    var g = ghosts[gSayIdx];
    if(!g){ hideGSay(); return; }
    var el = $('gSay');
    el.style.left = Math.round((g.x + .5) * tile) + 'px';
    el.style.top = Math.round((g.y + .5) * tile - tile * .70) + 'px';
  }

  /* Q 弹动效参数：底部挤压、空中回弹 + 起跳位移；低功耗 / 减弱动效时返回 null */
  function animScale(kind, moving, phase){
    if(reduceMotion || lpMode()) return null;
    var t = animT, ph = phase * 1.7;
    if(kind === 'player'){
      /* 走动时小碎跳，站定时慢慢呼吸 */
      var u = Math.abs(Math.sin(t * (moving ? 8.4 : 2.6) + ph));
      var sq = (1 - u) * (moving ? .085 : .045);
      return {sx:1 + sq, sy:1 - sq * 1.35, lift:-u * tile * (moving ? .16 : .05)};
    }
    var u2 = Math.abs(Math.sin(t * 4.6 + ph));
    var sq2 = (1 - u2) * .10;
    return {sx:1 + sq2, sy:1 - sq2 * 1.3, lift:-u2 * tile * .20};
  }

  /* ---- M6-B：朝向翻转 / 转弯侧倾 / 出窝弹跳 / 起步倾斜 / 隧道残影 ---- */
  /* 只在真实方向变化时记一次：反向（cross=0）不侧倾，只翻朝向 */
  function markFacing(e){
    var d = e.dir;
    if(!d || (!d.x && !d.y)) return;             /* 停住时保留上一次方向 */
    if(e.pdir && (e.pdir.x !== d.x || e.pdir.y !== d.y)){
      var cross = e.pdir.x * d.y - e.pdir.y * d.x;
      if(cross){ e.tiltT = FX.tiltLife; e.tiltSign = cross > 0 ? 1 : -1; }
    }
    e.pdir = {x:d.x, y:d.y};
    if(d.x) e.facing = d.x > 0 ? 1 : -1;
  }

  function decayFace(e, dt){
    if(e.tiltT > 0) e.tiltT = Math.max(0, e.tiltT - dt);
    if(e.leanT > 0) e.leanT = Math.max(0, e.leanT - dt);
    if(e.popT > 0) e.popT = Math.max(0, e.popT - dt);
    if(e.trails && e.trails.length){
      for(var i = e.trails.length - 1; i >= 0; i--){
        e.trails[i].t -= dt;
        if(e.trails[i].t <= 0) e.trails.splice(i, 1);
      }
    }
  }

  function tiltAngle(e){
    if(!e || lpMode() || reduceMotion || !(e.tiltT > 0)) return 0;
    return (e.tiltSign || 1) * FX.tiltMax * (e.tiltT / FX.tiltLife);
  }

  function leanAngle(e){
    if(!e || lpMode() || reduceMotion || !(e.leanT > 0)) return 0;
    return (e.leanSign || 0) * FX.leanMax * (e.leanT / FX.leanLife);
  }

  /* 出窝弹跳：挤压 + 弹起，直接改 animScale 的返回值 */
  function bounceAnim(an, e){
    if(!an || !e || !(e.popT > 0) || lpMode() || reduceMotion) return an;
    var s = Math.sin(Math.PI * (1 - e.popT / FX.bounceLife));
    an.sx *= 1 + .10 * s;
    an.sy *= 1 - .18 * s;
    an.lift -= tile * FX.bounceJump * s;
    return an;
  }

  /* 隧道段每 0.06s 采样一层残影（克制档最多 4 层） */
  function sampleTrail(g, dt){
    if(quiet || lpMode() || reduceMotion) return;
    if(Math.abs(g.x - 9) <= 6.5) return;          /* 只在左右两端走廊留影 */
    if(!g.trails) g.trails = [];
    g.trT -= dt;
    if(g.trT > 0) return;
    g.trT = FX.trailGap;
    g.trails.unshift({x:g.x, y:g.y, t:FX.trailLife});
    if(g.trails.length > FX.trailMax) g.trails.pop();
  }

  function faceColor(id, fallback){
    var d = DEX_ART[id];
    return (d && d[1]) || fallback;
  }

  function drawSprite(id, gx, gy, ring, scale, flee, eaten, anim){
    var th = curTheme();
    var cx = (gx + .5) * tile, cy = (gy + .5) * tile;
    var size = tile * (scale || 1.35);
    var lift = anim ? anim.lift : 0;
    ensureFace(id);

    /* 落地阴影：起跳时缩小变淡，落回时最实 */
    var k = anim ? Math.max(.55, 1 + lift / (tile * .55)) : 1;
    ctx.fillStyle = 'rgba(0,0,0,' + (.34 * k).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(cx, cy + size * .40, size * .30 * k, size * .10 * k, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy + lift);
    if(anim && anim.rot) ctx.rotate(anim.rot);
    if(anim) ctx.scale(anim.sx, anim.sy);

    /* 被榨干：只剩一双眼睛飘回窝 */
    if(eaten){
      ctx.fillStyle = hexA(th.text, .92);
      var er = size * .085;
      ctx.beginPath();
      ctx.arc(-size * .17, -size * .04, er, 0, Math.PI * 2);
      ctx.arc(size * .17, -size * .04, er, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }

    var sp = sprites[id];
    if(flee){
      ctx.save();
      if(!lpMode()) ctx.filter = 'grayscale(.85) brightness(1.35)';
      ctx.save();                                   /* 只在立绘上翻转，圆环与「!」保持正向 */
      if(anim && anim.flip < 0) ctx.scale(-1, 1);
      if(sp && sp.ready){
        ctx.drawImage(sp.c, -size / 2, -size / 2, size, size);
      }else{
        drawFallback(0, 0, size * .46, faceColor(id, ring));
      }
      ctx.restore();
      ctx.restore();

      /* 高对比描边 + 头顶「!」 */
      ctx.lineWidth = Math.max(1.1, tile * .085);
      ctx.strokeStyle = hexA(th.text, .85);
      ctx.beginPath();
      ctx.arc(0, 0, size * .455, 0, Math.PI * 2);
      ctx.stroke();

      ctx.font = '900 ' + Math.round(size * .62) + 'px "SF Mono",Consolas,sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, size * .09);
      ctx.strokeStyle = 'rgba(11,7,20,.9)';
      ctx.strokeText('!', 0, -size * .78);
      ctx.fillStyle = th.accent2;
      ctx.fillText('!', 0, -size * .78);
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.restore();
      return;
    }

    ctx.save();                                     /* 只在立绘上翻转，圆环保持正向 */
    if(anim && anim.flip < 0) ctx.scale(-1, 1);
    if(sp && sp.ready){
      ctx.drawImage(sp.c, -size / 2, -size / 2, size, size);
    }else{
      drawFallback(0, 0, size * .46, faceColor(id, ring));
    }
    ctx.restore();

    /* 行为圆环：颜色代表行动模式，跟着角色一起弹，不随立绘更换 */
    if(ring){
      ctx.lineWidth = Math.max(1.2, size * .033);
      ctx.strokeStyle = ring;
      ctx.beginPath();
      ctx.arc(0, 0, size * .455, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFallback(cx, cy, r, color){
    /* 立绘加载失败时的程序化月巴/番茄 */
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(11,7,20,.85)';
    ctx.beginPath();
    ctx.arc(cx - r * .34, cy - r * .10, r * .11, 0, Math.PI * 2);
    ctx.arc(cx + r * .34, cy - r * .10, r * .11, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function loadSprites(){
    ensureFace(curSkinFace());   /* 月巴立绘按需加载，见 makeGhosts 里的 ensureFace */
  }

  /* 立绘按需加载 + 224px 圆裁切缓存；同一个 id 只请求一次 */
  function ensureFace(id){
    if(!id || sprites[id]) return;
    var url = ART_SRC[id] || (DEX_ART[id] && DEX_ART[id][0]);
    if(!url){ sprites[id] = {ready:false, c:null}; return; }
    var skin = skinByFace(id);
    sprites[id] = {ready:false, c:null, loading:true};
    var img = new Image();
    img.decoding = 'async';
    img.onload = function(){
      sprites[id] = bakeSprite(img, skin ? skin.box : null, skin ? SKIN_FILL : 0);
      if(id === curSkinFace()){
        $('avaImg').src = url;
        if(skin) $('avaImg').style.transform = 'scale(' + skinZoom(skin).toFixed(3) + ')';
        $('ava').classList.remove('none');
      }
      draw();
    };
    img.onerror = function(){
      sprites[id] = {ready:false, c:null};
      if(id === curSkinFace()) $('ava').classList.add('none');
      draw();
    };
    img.src = url;
  }

  /* 烘焙：默认整图 cover 裁到圆心；给了 box 时按「主体包围盒」缩放，
     让不同留白的立绘在圆里显示成同样大小（fill = 主体目标边长） */
  function bakeSprite(img, box, fill){
    var S = 224;
    var c = document.createElement('canvas');
    c.width = S; c.height = S;
    var g = c.getContext('2d');
    g.beginPath();
    g.arc(S / 2, S / 2, S / 2 - 4, 0, Math.PI * 2);
    g.closePath();
    g.save();
    g.clip();
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    var l = 0, t = 0, r = 1, b = 1;
    if(box){ l = box[0]; t = box[1]; r = box[2]; b = box[3]; }
    /* 取主体长边当基准，等比缩放并把主体中心压在圆心；无 box 时退回整图 cover */
    var k = box ? (fill || S) / Math.max((r - l) * iw, (b - t) * ih) : Math.max(S / iw, S / ih);
    var dw = iw * k, dh = ih * k;
    g.drawImage(img, S / 2 - (l + r) / 2 * iw * k, S / 2 - (t + b) / 2 * ih * k, dw, dh);
    g.restore();
    return {ready:true, c:c};
  }

  /* =========================================================
     4. 台词（M1 仅占位，M3 接入完整双通道系统）

  function setSay(text){

    $('dlgBar').classList.remove('off');

    el.textContent = t;

    ava.classList.add('bop');
  }

  /* 居中大字倒计时（3-2-1）：每换一个数就重播一次弹入 */
