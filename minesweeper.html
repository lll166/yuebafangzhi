<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7efe2">
<title>月巴大扫除 · 扫月巴</title>
<style>
  :root{
    --bg:#f7efe2; --bg2:#fdf9f1; --panel:#fffaf2; --panel2:#f4e8d5;
    --line:rgba(92,66,40,.16); --line2:rgba(150,102,46,.42);
    --text:#3b2a1b; --dim:#8a7157;
    --accent:#b9741f; --accent2:#8f5310;
    --tomato:#cf4430; --tomato2:#b23522;
    --moss:#6c8b4f; --ink:#fff8ec;
    --safeB:env(safe-area-inset-bottom,0px);
    --safeT:env(safe-area-inset-top,0px);
    --mono:"SF Mono","Cascadia Mono",Consolas,ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    overflow:hidden;color:var(--text);font-family:var(--mono);letter-spacing:.02em;
    background:
      radial-gradient(58% 34% at 16% -4%,rgba(226,166,86,.26),transparent 72%),
      radial-gradient(110% 70% at 50% 112%,rgba(120,88,54,.16),transparent 62%),
      linear-gradient(160deg,var(--bg2) 0%,var(--bg) 58%,#f1e5d1 100%);
    overscroll-behavior:contain;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background:
      repeating-linear-gradient(0deg,rgba(92,66,40,.026) 0 1px,transparent 1px 4px),
      repeating-linear-gradient(90deg,rgba(92,66,40,.022) 0 1px,transparent 1px 5px);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(120% 86% at 50% 16%,transparent 50%,rgba(87,62,37,.16) 100%);
  }
  /* 踩雷：屏幕边缘一次红色渐晕 */
  body.lostfx::after{z-index:25;
    background:radial-gradient(120% 92% at 50% 50%,transparent 40%,rgba(178,53,34,.34) 100%);
    animation:lostVig .9s ease-out both}
  @keyframes lostVig{0%{opacity:0}18%{opacity:1}100%{opacity:0}}
  /* 失败：一颗番茄从爆点被顺走，飞向右上角 */
  .lost-tom{position:fixed;z-index:27;width:18px;height:18px;margin:-9px 0 0 -9px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 34% 30%,#ff9a80,#e0523d 72%);
    box-shadow:inset -2px -2px 3px rgba(120,20,10,.28),0 2px 6px rgba(90,60,30,.3);
    animation:tomStolen .72s cubic-bezier(.4,0,.7,1) both}
  @keyframes tomStolen{
    0%{opacity:1;transform:translate(0,0) scale(1) rotate(0)}
    42%{opacity:1;transform:translate(calc(var(--tx) * .45),calc(var(--ty) * .45 - 46px)) scale(1.06) rotate(180deg)}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.32) rotate(520deg)}}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  #app{
    position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto;
    display:flex;flex-direction:column;padding:0 14px;
  }
  /* 对局中：桌面端放宽容器，让大扫除棋盘用足屏幕 */
  body.playing #app{max-width:min(96vw,1040px)}
  body.playing #top{width:100%;max-width:720px;margin:0 auto}
  /* ---------- 顶栏 ---------- */
  #top{flex:none;padding-top:calc(12px + var(--safeT))}
  .brandrow{display:flex;align-items:flex-end;gap:10px;padding:0 2px 10px}
  .brand{flex:1 1 auto;min-width:0}
  .kicker{font-size:8px;font-weight:900;letter-spacing:4px;color:var(--accent);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand h1{
    font-family:ui-serif,"Songti SC","SimSun",Georgia,serif;
    font-size:23px;line-height:1.15;letter-spacing:2px;font-weight:800;color:var(--text);
    margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand h1 em{font-style:normal;font-size:10px;letter-spacing:2px;color:var(--dim);margin-left:6px}
  .hbtns{display:flex;gap:6px;flex:none}
  .iconbtn{
    min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;
    font-size:14px;line-height:1;color:var(--accent2);
    border:1px solid var(--line);border-left:2px solid var(--line2);
    background:linear-gradient(180deg,#fffaf2,#f5ebda);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%);
  }
  .iconbtn b{font-size:8px;font-weight:800;letter-spacing:.4px;color:var(--dim);font-variant-numeric:tabular-nums}
  .iconbtn:active{transform:scale(.95)}
  /* HUD 芯片 */
  .hud{display:grid;grid-template-columns:1fr 1fr 1fr 40px;gap:5px;margin-bottom:12px}
  .chip{
    display:flex;flex-direction:column;gap:2px;justify-content:center;min-width:0;min-height:44px;
    padding:6px 8px;border:1px solid var(--line);border-left:2px solid var(--line2);
    background:linear-gradient(180deg,#fffaf2,#f7eedf);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
  }
  .chip i{font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:1.2px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip b{font-size:13px;font-weight:900;color:var(--accent2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip.pause{
    align-items:center;padding:0;font-size:12px;color:var(--accent2);
    opacity:.55;
  }
  .chip.hint{align-items:flex-start;text-align:left;cursor:pointer}
  .chip.hint:active{transform:scale(.96)}
  .chip.hint.b0{opacity:.45}
  .chip.hint.b0 b{color:var(--dim)}
  /* HUD 数值变化：翻牌 / 按钮反馈 */
  .chip b.fx-down{animation:hudDrop .28s cubic-bezier(.2,1.4,.4,1) both;color:var(--tomato2)}
  .chip b.fx-up{animation:hudRise .28s cubic-bezier(.2,1.4,.4,1) both;color:var(--moss)}
  #btnHint.fx-tap{animation:hintTap .2s ease both}
  #btnHint.fx-empty{animation:hintEmpty .32s ease 2}
  @keyframes hudDrop{0%{opacity:0;transform:translateY(-70%)}
    60%{opacity:1;transform:translateY(8%)}100%{opacity:1;transform:none}}
  @keyframes hudRise{0%{opacity:0;transform:translateY(70%)}
    60%{opacity:1;transform:translateY(-8%)}100%{opacity:1;transform:none}}
  @keyframes hintTap{0%,100%{transform:none}45%{transform:scale(.93)}}
  @keyframes hintEmpty{0%,100%{transform:none}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
  /* 计时：整秒轻脉冲；超标准时间转琥珀并缓慢呼吸 */
  .chip b.fx-tick{animation:numTick .2s cubic-bezier(.2,1.4,.4,1) both}
  .chip b.over{color:var(--tomato2);animation:timeBreath 2s ease-in-out .2s infinite}
  @keyframes numTick{0%,100%{transform:none}45%{transform:scale(1.08)}}
  @keyframes timeBreath{0%,100%{opacity:1}50%{opacity:.62}}
  /* 成就计数：解锁时从下弹入 */
  #achTopCount.fx-up{animation:hudRise .28s cubic-bezier(.2,1.4,.4,1) both;color:var(--moss)}
  /* ---------- 主滚动区 ---------- */
  .main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    padding:0 2px calc(22px + var(--safeB));touch-action:pan-y}
  .main::-webkit-scrollbar{width:4px}
  .main::-webkit-scrollbar-thumb{background:rgba(92,66,40,.22)}
  /* 首屏故事 */
  .hero{
    position:relative;padding:15px 16px 16px;margin-bottom:14px;
    border:1px solid var(--line);border-radius:3px;
    background:linear-gradient(160deg,#fffcf6,#f6ead8);
    box-shadow:inset 0 0 34px rgba(233,162,74,.08),0 12px 30px rgba(90,60,30,.13);
  }
  .hero::before{content:"";position:absolute;inset:6px;pointer-events:none;opacity:.5;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/13px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left top/2px 13px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/13px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/2px 13px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/13px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/2px 13px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/13px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/2px 13px no-repeat;
  }
  .heroTop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .heroIco{
    width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:22px;
    border:1px solid var(--line);border-left:2px solid var(--line2);
    background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.95),rgba(246,222,186,.55) 70%);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
    filter:drop-shadow(0 4px 10px rgba(120,88,54,.24));
  }
  .heroTag{font-size:8px;font-weight:900;letter-spacing:2.4px;color:var(--accent);opacity:.85}
  .heroSub{font-family:ui-serif,"Songti SC","SimSun",Georgia,serif;font-size:15px;font-weight:800;letter-spacing:1px;margin-top:3px;color:var(--text)}
  .story{font-size:10.5px;line-height:1.8;color:#5c4630;letter-spacing:.04em}
  .story p+p{margin-top:3px}
  .story .tomatoWord{color:var(--tomato2);font-weight:800}
  /* 分区标题 */
  .shead{display:flex;align-items:center;gap:8px;margin:0 2px 8px}
  .shead b{font-size:10px;font-weight:900;letter-spacing:2px;color:var(--text)}
  .shead span{font-size:8px;letter-spacing:1px;color:var(--dim);white-space:nowrap}
  .shead::after{content:"";flex:1;height:1px;background:var(--line)}
  /* 难度卡 */
  .diffs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .diff{
    position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:58px;padding:10px 12px;
    text-align:left;border:1px solid var(--line);border-left:2px solid var(--line2);
    background:linear-gradient(180deg,#fffdf8,#f8efe0);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
    transition:background .15s,transform .12s;
  }
  .diff:active{transform:scale(.985)}
  .diff:active .dico{animation:icoPop .2s cubic-bezier(.2,1.5,.4,1) both}
  @media (hover:hover){
    .diff:hover{transform:translateY(-2px)}
    .diff:hover .dico{transform:rotate(-3deg)}
    .daily:not(.done):hover{transform:translateY(-2px)}
    .daily:not(.done):hover .dico{transform:rotate(-3deg)}
    /* 棋盘 hover：未开格给落点提示，数字格给邻格预判，封条模式给盖章预览 */
    #board .cell:not(.open):not(.mine){cursor:crosshair}
    #board .cell:not(.open):not(.mine):hover{transform:translateY(-1px);
      background:linear-gradient(180deg,#fff6e4,#efdcbe)}
    #board .cell.nbr{box-shadow:inset 0 0 0 1px rgba(185,116,31,.6),
      inset 0 0 0 4px rgba(233,162,74,.12)}
    body.sealing #board .cell:not(.open):not(.mine):hover{
      outline:2px dashed rgba(178,136,20,.75);outline-offset:-3px}
  }
  @keyframes icoPop{0%{transform:none}40%{transform:scale(1.15) rotate(-4deg)}70%{transform:scale(.94)}100%{transform:none}}
  .diff .dico{
    width:36px;height:36px;flex:none;display:grid;place-items:center;font-size:17px;
    border:1px solid var(--line);background:rgba(255,255,255,.55);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%);
    transition:transform .16s ease;
  }
  .diff .dmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  .diff .dname{font-size:13px;font-weight:900;letter-spacing:1px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .diff .dmeta{font-size:9px;letter-spacing:.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .diff .dright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
  .diff .dstars{font-size:10px;letter-spacing:1px;color:var(--accent2);font-variant-numeric:tabular-nums}
  .diff .dstars s{text-decoration:none;color:rgba(59,42,27,.18)}
  .diff .dbest{font-size:8.5px;letter-spacing:.4px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .diff .dwins{font-size:7.5px;letter-spacing:.3px;color:rgba(138,113,87,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
  .diff .dcoin{
    display:inline-block;padding:1px 5px;font-size:7.5px;font-weight:900;letter-spacing:.3px;
    font-style:normal;color:var(--accent2);border:1px solid rgba(185,116,31,.38);
    background:rgba(233,162,74,.14);font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .diff.easy{border-left-color:rgba(108,139,79,.72)}
  .diff.normal{border-left-color:rgba(185,116,31,.78)}
  .diff.hard{border-left-color:rgba(207,68,48,.68)}
  /* 每日卡 */
  .daily{
    position:relative;display:flex;align-items:center;gap:11px;width:100%;min-height:60px;padding:11px 12px;
    border:1px solid rgba(207,68,48,.34);border-left:2px solid var(--tomato);
    background:linear-gradient(160deg,#fff5ee,#fbe7da);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);
    transition:background .15s,transform .12s,filter .3s,opacity .3s;
  }
  .daily:active{transform:scale(.985)}
  .daily .dico{width:36px;height:36px;flex:none;display:grid;place-items:center;font-size:17px;
    border:1px solid rgba(207,68,48,.3);background:rgba(255,255,255,.5);transition:transform .16s ease}
  .daily:not(.done) .dico{animation:tomatoBreath 4s ease-in-out infinite}
  @keyframes tomatoBreath{0%,100%{transform:none}50%{transform:scale(1.09)}}
  .daily .dico.fx-lock{animation:lockShake .42s ease both, lockFlash .42s ease both}
  @keyframes lockShake{0%,100%{transform:none}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}
    55%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}}
  @keyframes lockFlash{0%,100%{filter:none}30%{filter:brightness(1.55) saturate(.35)}}
  .daily .dmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
  .daily .dname{font-size:13px;font-weight:900;letter-spacing:1px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .daily .dsub{font-size:9px;line-height:1.4;color:#82563f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .daily .dright{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .daily .ddate{font-size:8px;letter-spacing:.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .daily .dstate{font-size:8px;font-weight:900;letter-spacing:.5px;color:var(--tomato2)}
  .daily .dbest{font-size:8px;letter-spacing:.4px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .daily .dbest s{text-decoration:none;color:rgba(59,42,27,.18)}
  .daily .dbest:empty{display:none}
  /* 今日已完成：整卡灰化并锁定 */
  .daily.done{filter:grayscale(1);opacity:.8;cursor:not-allowed;
    border-left-color:#8e7f6c;background:linear-gradient(160deg,#f3eee6,#e7dfd2)}
  .daily.done:active{transform:none}
  .daily.done .dico{color:#7d7061;border-color:rgba(92,66,40,.26);background:rgba(255,255,255,.35)}
  .daily.done .dname{color:#5f5346}
  .daily.done .dsub{color:#7a6a57}
  .daily.done .dstate{color:#6f6252}
  /* 规则 */
  .rules{margin-top:14px;padding:11px 12px;border:1px solid var(--line);
    background:linear-gradient(180deg,#fffcf5,#f7eddd);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%)}
  .rules .rtitle{display:flex;align-items:center;gap:6px;font-size:9px;font-weight:900;letter-spacing:2px;color:var(--accent);margin-bottom:8px}
  .rules .rtitle::after{content:"";flex:1;height:1px;background:var(--line)}
  .rule{display:flex;gap:8px;font-size:9.5px;line-height:1.65;color:#5c4630;letter-spacing:.02em}
  .rule+.rule{margin-top:5px}
  .rule i{flex:none;font-style:normal;font-size:11px;line-height:1.5;width:14px;text-align:center}
  /* ---------- 棋盘视图 ---------- */
  #menuView.hide{display:none}
  #gameView{display:none;flex:1;min-height:0;flex-direction:column;align-items:center;gap:9px;
    padding:0 0 calc(12px + var(--safeB));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  #gameView.show{display:flex}
  .gbar{display:flex;align-items:center;gap:7px;width:100%;padding:0 2px}
  .gbtn{flex:none;min-height:44px;padding:0 10px;font-size:10px;font-weight:900;letter-spacing:.6px;
    color:var(--accent2);border:1px solid var(--line);border-left:2px solid var(--line2);
    background:linear-gradient(180deg,#fffaf2,#f5ebda);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%)}
  .gbtn:active{transform:scale(.96)}
  .gbtn.mode{display:flex;align-items:center;justify-content:center;gap:3px;padding:0 6px;min-width:44px}
  .gbtn.mode.seal{border-left-color:rgba(178,136,20,.9);color:#6f5109;
    background:linear-gradient(180deg,#fffaeb,#f7ecc8)}
  /* 模式切换：图标整圈翻转 */
  #modeIco{display:inline-block;transform-origin:50% 55%}
  #modeIco.fx-flip{animation:modeFlip .3s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes modeFlip{0%{transform:rotate(0) scale(1)}
    48%{transform:rotate(180deg) scale(.82)}100%{transform:rotate(360deg) scale(1)}}
  .ginfo{flex:1;min-width:0;text-align:center;font-size:8.5px;letter-spacing:.4px;color:var(--dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
  #boardWrap{width:100%;display:flex;justify-content:center;
    transition:filter .16s ease,transform .16s ease}
  body.paused #boardWrap{filter:blur(2px) brightness(.88);transform:scale(.985)}
  #board{
    --cols:9;--rows:9;--ar:1;--fs:12px;
    position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:2px;
    width:min(100%,calc((100vh - 260px) * var(--ar)));aspect-ratio:var(--ar);padding:6px;
    border:1px solid var(--line2);
    background:linear-gradient(160deg,#f3e4cb,#e9d3b1);
    box-shadow:0 10px 26px rgba(90,60,30,.18),inset 0 0 24px rgba(120,88,54,.08);
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;
  }
  #board::before{content:"";position:absolute;inset:3px;pointer-events:none;opacity:.55;z-index:2;
    background:
      linear-gradient(var(--accent),var(--accent)) left top/11px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left top/2px 11px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/11px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right top/2px 11px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/11px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) left bottom/2px 11px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/11px 2px no-repeat,
      linear-gradient(var(--accent),var(--accent)) right bottom/2px 11px no-repeat}
  /* 开局入场：棋盘轻压一下，四角框线亮一次 */
  #board.fx-in{animation:boardIn .22s cubic-bezier(.2,1,.4,1) both}
  #board.fx-in::before{animation:cornerFlash .22s ease both}
  @keyframes boardIn{0%{opacity:0;transform:scale(.96)}100%{opacity:1;transform:none}}
  @keyframes cornerFlash{0%{opacity:0}45%{opacity:1}100%{opacity:.55}}
  /* 转屏重绘：透明度回弹，掩盖整盘重排 */
  #board.fx-turn{animation:boardTurn .16s ease both}
  @keyframes boardTurn{0%{opacity:.45}100%{opacity:1}}
  .cell{
    position:relative;display:grid;place-items:center;width:100%;min-width:0;aspect-ratio:1;padding:0;
    font-family:var(--mono);font-size:var(--fs,12px);font-weight:900;line-height:1;
    border:1px solid rgba(92,66,40,.2);border-radius:2px;color:transparent;
    background:linear-gradient(180deg,#f5e7cf,#e9d4b2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 1px rgba(90,60,30,.10);
    transition:transform .09s,background .09s;
  }

  .cell:nth-child(7n+4):not(.open):not(.mine)::after{display:none}

  .cell .num.q{animation:none}

    color:#3b2a1b;font-size:calc(var(--fs,12px) * 1.18)}
  .cell.boom{background:linear-gradient(180deg,#e0523d,#c23a26);border-color:#a52c1c;color:#fff8ec;
    animation:wig .3s ease 2}
  .cell.seal{background:repeating-linear-gradient(45deg,#f2c41a 0 5px,#1e1809 5px 10px);
    border-color:#120d05;
    box-shadow:inset 0 0 0 1px rgba(255,238,150,.34),inset 0 0 5px rgba(0,0,0,.32),0 1px 2px rgba(0,0,0,.24);
    transform-origin:var(--sx,50%) var(--sy,50%)}
  /* 只有新贴上的封条才播盖章；转屏重建时不挂 fx-stamp */

  /* 封住的格子偶尔抖一下：里面有东西想出来。
     不按是否有雷筛选，所有封条一视同仁，避免变成提示 */

    0%,100%{transform:translate(0,0) rotate(0) scale(1)}
    16%{transform:translate(-1px,0) rotate(-.7deg) scale(1.02)}
    34%{transform:translate(1px,0) rotate(.6deg) scale(1.03)}
    52%{transform:translate(-.8px,0) rotate(-.4deg) scale(1.02)}
    70%{transform:translate(.6px,0) rotate(.3deg) scale(1.01)}
  }
  .cell.fx-peel{animation:peel .14s ease both}
  .cell.seal::before{content:"封";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);
    width:54%;height:54%;display:grid;place-items:center;border-radius:2px;

    background:#171106;

  .cell.seal::after{display:none}
  /* chord 提示：静态描边，只有刚变成可 chord 的格子脉冲一次 */
  .cell.chordready::after{content:"";position:absolute;inset:2px;pointer-events:none;
    border:2px solid rgba(185,116,31,.5);opacity:.72}
  .cell.chordready{cursor:pointer}
  .cell.chordready.fresh::after{animation:chordPulse .6s ease both}
  @keyframes chordPulse{0%{opacity:0}35%{opacity:1}100%{opacity:.72}}
  /* chord 成功闪一下 / 封条数不匹配时左右抖 */
  .cell.fx-chain{animation:chainFlash .3s ease both}
  @keyframes chainFlash{0%{filter:brightness(1)}35%{filter:brightness(1.22)}100%{filter:brightness(1)}}
  .cell.fx-shake{animation:cellShake .22s ease 2}
  @keyframes cellShake{0%,100%{transform:none}30%{transform:translateX(-2px)}70%{transform:translateX(2px)}}
  /* 封条模式：棋盘外框浮一层警戒黄 */
  body.sealing #board::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:5;
    box-shadow:inset 0 0 0 2px rgba(200,158,26,.42),inset 0 0 22px rgba(200,158,26,.12);
    animation:sealEdge .18s ease both}
  @keyframes sealEdge{from{opacity:0}to{opacity:1}}
  /* 偷番茄的月巴立绘 */
  .cell .thf{width:100%;height:100%;object-fit:contain;padding:1px;box-sizing:border-box;
    pointer-events:none;display:block;animation:pop .18s ease both;
    filter:drop-shadow(0 1px 1px rgba(90,60,30,.28))}
  .cell.boom .thf{filter:drop-shadow(0 1px 2px rgba(60,20,10,.34))}
  /* 失败演出：全场偷茄月巴 Q 弹跳，偷到番茄的那只得意地摇 */
  #board.lost{animation:boardHop .34s ease-out both}

  #board.lost .cell.boom .thf{transform-origin:50% 92%;

  @keyframes thiefJump{
    0%{transform:translateY(0) scale(1,1)}
    16%{transform:translateY(-18%) scale(.9,1.14)}
    32%{transform:translateY(0) scale(1.12,.88)}
    46%{transform:translateY(-9%) scale(.95,1.06)}
    60%{transform:translateY(0) scale(1.05,.96)}
    74%{transform:translateY(-4%) scale(.98,1.03)}

  @keyframes thiefProud{
    0%{transform:rotate(0) scale(1,1)}
    12%{transform:rotate(-10deg) scale(.94,1.08)}
    26%{transform:rotate(8deg) scale(1.08,.93)}
    40%{transform:rotate(-8deg) scale(.96,1.05)}
    54%{transform:rotate(6deg) scale(1.06,.95)}
    68%{transform:rotate(-4deg) scale(.99,1.02)}
    82%{transform:rotate(2deg) scale(1.01,.99)}
    100%{transform:rotate(0) scale(1,1)}}
  @keyframes boardHop{0%,100%{transform:none}30%{transform:translateY(2px) scale(.996,1.004)}

  @keyframes lootBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(7deg)}}

    mask:radial-gradient(circle,transparent 56%,#000 58%);
    animation:lpFill .35s linear forwards}
  @keyframes lpFill{from{--lp:0}to{--lp:1}}
  /* 不支持 @property 的旧内核：退化为 350ms 旋转扫描线，仍然给出进度感 */
  #board .cell .fx-lp.fallback{
    background:linear-gradient(90deg,transparent 0 50%,rgba(185,116,31,.88) 50% 100%);
    animation:lpSpin .35s linear forwards}
  @keyframes lpSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  /* 首开落墨：一圈纸纤维 */
  #board .fx-ink{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:6}
  #board .fx-ink i{position:absolute;left:0;top:0;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;

  @keyframes inkFly{
    0%{transform:translate(0,0) scale(1);opacity:.9}
    100%{transform:translate(var(--dx),var(--dy)) scale(.35);opacity:0}}
  /* 敲一敲：尘环 + 棋盘轻晃 */
  #board .fx-knock{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:7}
  #board .fx-knock i{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
    border:1px solid rgba(185,116,31,.65);background:rgba(255,244,214,.18);
    animation:knockRing .55s ease-out both}
  @keyframes knockRing{
    0%{transform:scale(.4);opacity:.9}
    100%{transform:scale(4.6);opacity:0}}
  #board.fx-tilt{animation:boardTilt .28s ease-out both}

    30%{transform:rotate(1.2deg) translateY(1px)}70%{transform:rotate(-.6deg)}}

  #board .fx-spot{position:absolute;pointer-events:none;z-index:4;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle,rgba(255,240,196,.92),

  @keyframes spotIn{0%{opacity:0}22%{opacity:1}70%{opacity:.8}100%{opacity:0}}
  /* 零区清扫波：一个覆盖层从点击点向外扫开，不逐格加类 */
  #board .fx-flood{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:3}
  #board .fx-flood i{position:absolute;left:0;top:0;border-radius:50%;

    100%{opacity:0;transform:translate(-50%,-50%) scale(1.75)}}
  /* 胜利：棋盘中央清扫印章 */
  #board .fx-clean{position:absolute;left:50%;top:50%;z-index:8;width:34%;aspect-ratio:1;
    transform:translate(-50%,-50%);pointer-events:none;display:grid;place-items:center;
    border:2px solid rgba(185,116,31,.55);border-radius:50%;
    background:radial-gradient(circle,rgba(255,252,240,.88),rgba(255,244,220,.3) 68%,transparent);
    box-shadow:0 0 0 4px rgba(255,250,240,.35),0 0 18px rgba(233,162,74,.35);
    animation:cleanStamp .42s cubic-bezier(.2,1.5,.4,1) both}
  #board .fx-clean b{font-size:calc(var(--fs,12px) * 2.2);font-weight:900;color:var(--accent2);opacity:.86}
  @keyframes cleanStamp{
    0%{opacity:0;transform:translate(-50%,-50%) scale(1.6) rotate(-8deg)}
    55%{opacity:1;transform:translate(-50%,-50%) scale(.96) rotate(2deg)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
  /* 自检面板 */
  #selfTest{position:fixed;left:8px;bottom:8px;z-index:40;max-width:min(78vw,320px);max-height:46vh;
    overflow:auto;padding:8px 10px;font:10px/1.5 ui-monospace,Consolas,monospace;color:#3b2a1b;
    background:rgba(255,250,242,.96);border:1px solid var(--line2);border-left:3px solid var(--accent);
    box-shadow:0 8px 22px rgba(90,60,30,.22);display:none}
  #selfTest.show{display:block}
  #selfTest b{display:block;margin-bottom:4px;font-size:10px;letter-spacing:1px}

  /* 低功耗 / 减少动态 */
  body.lowpower *,body.lowpower *::before,body.lowpower *::after{
    animation:none!important;transition:none!important;filter:none!important;box-shadow:none!important}

</style>

function daySeed(key){
  let h=2166136261>>>0;
  const s=String(key)+'|banny-sweeper';
  for(let i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=Math.imul(h,16777619)>>>0;
  }
  return h>>>0;
}

    totalWins:0,totalHits:0,totalHints:0,ach:{},

let S=defSave();
function loadSave(){
  try{
    const raw=localStorage.getItem(SKEY);
    if(!raw) return;
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object') return;
    if(d.stats&&typeof d.stats==='object'){
      DIFFS.forEach(function(cfg){
        const s=d.stats[cfg.id];
        if(!s||typeof s!=='object') return;
        const dst=S.stats[cfg.id];
        dst.plays=Math.max(0,parseInt(s.plays,10)||0);
        dst.wins=Math.max(0,parseInt(s.wins,10)||0);
        dst.bestMs=Math.max(0,parseInt(s.bestMs,10)||0);
        dst.bestStars=Math.max(0,Math.min(3,parseInt(s.bestStars,10)||0));
      });
    }
    if(d.daily&&typeof d.daily==='object'){
      const q=d.daily;
      S.daily.key=typeof q.key==='string'?q.key:'';
      S.daily.done=!!q.done;
      S.daily.bestMs=Math.max(0,parseInt(q.bestMs,10)||0);
      S.daily.bestStars=Math.max(0,Math.min(3,parseInt(q.bestStars,10)||0));
      S.daily.rewarded=!!q.rewarded;
      S.daily.streak=Math.max(0,parseInt(q.streak,10)||0);
      S.daily.lastKey=typeof q.lastKey==='string'?q.lastKey:'';
      if(typeof q.reset==='string') S.daily.reset=q.reset;
    }
    S.totalWins=Math.max(0,parseInt(d.totalWins,10)||0);
    S.totalHits=Math.max(0,parseInt(d.totalHits,10)||0);
    S.totalHints=Math.max(0,parseInt(d.totalHints,10)||0);
    S.ach=(d.ach&&typeof d.ach==='object')?d.ach:{};
    if(typeof d.muted==='boolean') S.muted=d.muted;

  }catch(e){ S=defSave(); }
}

/* ================= 音效（极简，M1 只保留点击） ================= */
let AC=null;
function tone(freq,dur,vol){
  if(S.muted) return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx) return;
    if(!AC) AC=new Ctx();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    const now=AC.currentTime;
    o.type='sine';o.frequency.setValueAtTime(freq,now);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(vol||0.04,now+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,now+(dur||0.06));
    o.connect(g);g.connect(AC.destination);
    o.start(now);o.stop(now+(dur||0.06)+0.02);
    o.onended=function(){ try{o.disconnect();g.disconnect();}catch(e){} };
  }catch(e){}
}

/* 翻到偷茄月巴：番茄汁粒子（≤12 颗，纯 CSS 动画，700ms 后移除） */
function splashAt(i){
  if(fxOff()) return;
  const el=G.cells[i],board=$('board');
  if(!el||!board) return;
  const b=board.getBoundingClientRect(),r=el.getBoundingClientRect();
  if(!b.width||!b.height) return;
  const wrap=document.createElement('div');
  wrap.className='splat';
  wrap.style.left=((r.left-b.left+r.width/2)/b.width*100).toFixed(2)+'%';
  wrap.style.top=((r.top-b.top+r.height/2)/b.height*100).toFixed(2)+'%';
  for(let k=0;k<12;k++){
    const d=document.createElement('i');
    const a=(Math.PI*2*k/12)+Math.random()*0.35;
    const dist=16+Math.random()*26;
    d.style.setProperty('--dx',(Math.cos(a)*dist).toFixed(1)+'px');
    d.style.setProperty('--dy',(Math.sin(a)*dist).toFixed(1)+'px');
    d.style.animationDelay=(Math.random()*40).toFixed(0)+'ms';
    wrap.appendChild(d);
  }
  board.appendChild(wrap);
  setTimeout(function(){ if(wrap.parentNode) wrap.parentNode.removeChild(wrap); },700);
}

/* 一次性触发 CSS 动画：移除 → 回流 → 重新添加，结束自动清理 */
function retrig(el,cls,ms){
  if(!el||!el.classList||typeof el.classList.add!=='function') return;
  el.classList.remove(cls);
  void (el.offsetWidth||0);
  el.classList.add(cls);
  setTimeout(function(){ if(el.classList) el.classList.remove(cls); },ms||300);
}
function bumpFx(el,cls,ms){

function trySealWiggle(){
  if(fxOff()||G.test||!G.active||G.paused||G.over) return;
  if(typeof document!=='undefined'&&document.hidden) return;

  for(let i=0;i<G.cells.length;i++){
    if(G.seal[i]&&!G.open[i]&&i!==lastWiggleIdx) pool.push(i);
  }
  if(!pool.length){
    for(let i=0;i<G.cells.length;i++) if(G.seal[i]&&!G.open[i]) pool.push(i);
  }
  if(!pool.length) return;
  const i=pool[(Math.random()*pool.length)|0];
  const el=G.cells[i];
  if(!el||!el.classList) return;
  /* 刚盖章或正在撕封条时不抢动画 */
  if(el.classList.contains('fx-stamp')||el.classList.contains('fx-peel')) return;
  lastWiggleIdx=i;
  el.classList.remove('fx-wiggle');
  void (el.offsetWidth||0);
  el.classList.add('fx-wiggle');
  setTimeout(function(){ if(el.classList) el.classList.remove('fx-wiggle'); },380);
}

const $=function(id){ return document.getElementById(id); };
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtMs(ms){
  const n=Math.max(0,Math.round((ms||0)/1000));
  const m=Math.floor(n/60),s=n%60;
  return m+':'+(s<10?'0':'')+s;
}
function starHTML(n){
  n=Math.max(0,Math.min(3,n||0));
  return '★'.repeat(n)+'<s>'+'★'.repeat(3-n)+'</s>';
}
/* 结算用：三颗星逐个弹出 */
function starHTMLAnimated(n){
  n=Math.max(0,Math.min(3,n||0));
  let out='';
  for(let k=0;k<3;k++){
    out+='<i class="'+(k<n?'on':'off')+'" style="--i:'+k+'">★</i>';

/* 结算金币：数字从 0 滚到目标值，图标同步弹一下；低功耗直接落值 */
function countUpCoin(target,ms){
  const el=$('resCoin');
  if(!el) return;
  const n=Math.max(0,target|0);
  if(fxOff()||typeof requestAnimationFrame!=='function'){
    el.textContent=t('rewardLine',{n:n});
    return;
  }
  retrig(el,'fx-coin',520);
  const dur=ms||600,t0=Date.now();
  const step=function(){
    const p=Math.min(1,(Date.now()-t0)/dur);
    const v=Math.round(n*(p<1?1-Math.pow(1-p,2.2):1));
    el.textContent=t('rewardLine',{n:v});
    if(p<1) requestAnimationFrame(step);
    else el.textContent=t('rewardLine',{n:n});
  };
  requestAnimationFrame(step);
}
let toastT=null;
function toast(msg,kind){
  const el=$('toast'); if(!el) return;
  el.textContent=msg;
  el.classList.remove('ach');
  void (el.offsetWidth||0);
  if(kind==='ach') el.classList.add('ach');
  el.classList.add('show');
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(function(){ el.classList.remove('show','ach'); },2000);
}

/* ================= 棋盘引擎（M2） ================= */
const G={
  active:false,cfg:null,daily:false,rows:0,cols:0,mines:0,rot:0,
  mine:[],num:[],open:[],seal:[],cells:[],face:[],hitFace:-1,
  placed:false,placedMines:0,revealed:0,seed:0,
  elapsed:0,timerOn:false,timerTs:0,tickId:null,
  paused:false,over:false,won:false,runId:0,rewardEligible:false,
  hintsLeft:3,hintsUsed:0,sealsPlaced:0,stars:0,newBest:false,
  test:false,mode:'open'
};
let rewardTimer=null;
/* chord 提示：只给“本轮新可 chord”的格子播一次脉冲 */
let chordReadyPrev={};
/* 零区清扫波限流，避免 chord/每日预翻连续触发 */
let lastFloodTs=0;
/* 桌面端 hover 预判：当前高亮的邻格与悬停格 */
let hoverNbrs=[],hoverIdx=-1;
/* 封条偶尔抖动：低频、单格，避免整盘躁动 */
let sealWiggleTimer=null,lastWiggleIdx=-1;
/* 旧内核不支持 @property 时，长按环走旋转扫描降级 */
const LP_ANIM=(function(){
  try{
    return !!(window.CSS&&CSS.registerProperty&&
      (!CSS.supports||CSS.supports('background','conic-gradient(red,blue)')));
  }catch(e){ return false; }
})();

function mulberry32(a){
  return function(){
    a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}

function neighbors(i){
  const r=(i/G.cols)|0,c=i%G.cols,out=[];
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    if(!dr&&!dc) continue;
    const rr=r+dr,cc=c+dc;
    if(rr>=0&&rr<G.rows&&cc>=0&&cc<G.cols) out.push(rr*G.cols+cc);
  }
  return out;
}

function placeMines(firstIndex){
  const N=G.rows*G.cols;
  const ban=new Array(N);
  const fr=(firstIndex/G.cols)|0,fc=firstIndex%G.cols;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
    const rr=fr+dr,cc=fc+dc;
    if(rr>=0&&rr<G.rows&&cc>=0&&cc<G.cols) ban[rr*G.cols+cc]=1;
  }
  const pool=[];
  for(let i=0;i<N;i++) if(!ban[i]) pool.push(i);
  const rnd=mulberry32(G.seed);
  for(let i=pool.length-1;i>0;i--){
    const j=(rnd()*(i+1))|0;
    const tmp=pool[i];pool[i]=pool[j];pool[j]=tmp;
  }
  const m=Math.min(G.mines,pool.length);
  for(let i=0;i<m;i++) G.mine[pool[i]]=true;
  G.placedMines=m;
  /* 每只偷番茄的月巴随机分配一位月巴立绘；每日局种子固定，同一天形态一致 */
  const frnd=mulberry32((G.seed^0xb4a7c0de)>>>0);
  G.face=[];
  for(let i=0;i<N;i++) G.face.push(G.mine[i]?((frnd()*THIEVES.length)|0):-1);
  for(let i=0;i<N;i++){
    if(G.mine[i]){ G.num[i]=0; continue; }
    const nb=neighbors(i);
    let n=0;
    for(let k=0;k<nb.length;k++) if(G.mine[nb[k]]) n++;
    G.num[i]=n;
  }
}

function buildBoardDOM(){
  const board=$('board');
  board.style.setProperty('--cols',G.cols);
  board.style.setProperty('--rows',G.rows);
  board.style.setProperty('--ar',(G.cols/G.rows).toFixed(4));
  board.innerHTML='';
  G.cells=[];
  const frag=document.createDocumentFragment();
  for(let i=0;i<G.rows*G.cols;i++){
    const c=document.createElement('button');
    c.type='button';
    c.className='cell';
    c.setAttribute('data-i',i);
    frag.appendChild(c);
    G.cells.push(c);
  }
  board.appendChild(frag);
  fitCellFont();
}

function fitCellFont(){
  if(!G.cells.length) return;
  const w=G.cells[0].getBoundingClientRect().width;
  if(!w) return;
  const fs=Math.max(7,Math.min(24,w*0.62));
  $('board').style.setProperty('--fs',fs.toFixed(1)+'px');
}

/* 按可用宽高实测棋盘尺寸：桌面端放大，竖屏也能整盘放下 */
function fitBoard(){
  if(!G.active) return;
  const bv=$('gameView'),wrap=$('boardWrap'),board=$('board'),bar=document.querySelector('#gameView .gbar'),hint=$('gameHint');
  if(!bv||!wrap||!board) return;
  const cs=getComputedStyle(bv);
  const gap=parseFloat(cs.rowGap)||9;
  const padT=parseFloat(cs.paddingTop)||0;
  const padB=parseFloat(cs.paddingBottom)||0;
  const barH=bar?bar.getBoundingClientRect().height:0;
  const hintH=hint?hint.getBoundingClientRect().height:0;
  const availW=wrap.clientWidth;
  const availH=bv.clientHeight-padT-padB-barH-hintH-gap*2;
  if(!(availW>0)||!(availH>0)) return;
  const ar=G.cols/G.rows;
  const w=Math.min(availW,availH*ar);
  if(!(w>0)) return;
  board.style.width=Math.max(100,Math.floor(w))+'px';
  fitCellFont();
}

/* 大扫除整盘顺时针转 90°（可连续转）：数据重排，数字由 DOM 正立绘制
   旧坐标 (r,c) → 新坐标 (c, R-1-r)；新棋盘为 C 行 × R 列 */
function rotateBoard(turns){
  if(!G.active||!G.rows||!G.cols) return;
  const times=((turns%4)+4)%4;
  if(!times) return;
  const N=G.rows*G.cols;
  for(let t=0;t<times;t++){
    const R=G.rows,C=G.cols;
    const mine=[],num=[],open=[],seal=[],face=[];
    for(let r=0;r<R;r++){
      for(let c=0;c<C;c++){
        const from=r*C+c,to=c*R+(R-1-r);
        mine[to]=G.mine[from];
        num[to]=G.num[from];
        open[to]=G.open[from];
        seal[to]=G.seal[from];
        face[to]=G.face[from];
      }
    }
    G.mine=mine;G.num=num;G.open=open;G.seal=seal;G.face=face;
    G.rows=C;G.cols=R;
  }
  buildBoardDOM();
  clearHoverNbrs();
  for(let i=0;i<N;i++){
    if(G.open[i]){
      if(G.mine[i]) paintThief(i,false);
      else paintCell(i,0,true);
    }else if(G.seal[i]){
      paintCellSeal(i);
    }
  }
  fitBoard();
  chordReadyPrev={};
  updateChordReady(true);
  updateHud();
}

/* 设备/窗口转向后，让大扫除棋盘顺时针跟随到目标方向 */
function syncOrientation(){
  if(!G.active||!G.cfg||G.cfg.id!=='hard'||G.over) return false;
  const want=desiredRot(G.cfg);
  if(G.rot===want) return false;
  rotateBoard((want-G.rot+4)%4);
  G.rot=want;
  /* 整盘重排后用一次透明度回弹掩盖跳变 */
  if(!fxOff()) retrig($('board'),'fx-turn',170);
  $('gameInfo').textContent=t('gameInfo',{name:t(G.cfg.name),r:G.rows,c:G.cols,m:G.mines});
  return true;
}

function paintCell(i,delay,quiet){
  const el=G.cells[i];
  if(!el) return;
  const n=G.num[i];
  el.classList.add('open');
  el.classList.remove('nbr');
  /* 只有真正翻开的格子才挂 fx-open；转屏重建时 quiet 摘掉，避免整盘重播 flip */
  if(quiet){ el.classList.remove('fx-open'); }
  else{
    el.classList.add('fx-open');
    /* flip 播完就摘掉，否则后续 fx-chain/fx-shake 结束后会二次触发翻格 */
    setTimeout(function(){ if(el.classList) el.classList.remove('fx-open'); },(delay||0)+260);
  }
  /* 数字单独一层，落墨时只弹数字不动格背；重绘时 quiet 不重播 */
  if(typeof el.innerHTML==='string'){
    el.innerHTML=n>0?('<span class="num'+(quiet?' q':'')+'">'+n+'</span>'):'';
    /* 数字跟随零区涟漪一起错峰落墨 */
    const sp=(n>0&&typeof el.querySelector==='function')?el.querySelector('.num'):null;
    if(sp&&sp.style) sp.style.animationDelay=delay?delay+'ms':'';
  }else{
    el.textContent=n>0?String(n):'';
  }
  if(n>0) el.classList.add('n'+n);
  /* 延迟写到 --fd，只服务 .cell.open.fx-open；不再写行内 animation-delay，
     否则后续 fx-chain / fx-shake 会被上一轮的涟漪延迟拖慢 */
  if(el.style&&el.style.setProperty){
    el.style.setProperty('--fd',delay?delay+'ms':'0ms');
    el.style.animationDelay='';
  }
}

/* ---------- 封条 / 模式 / chord ---------- */
function countSeals(){
  let n=0;
  for(let i=0;i<G.seal.length;i++) if(G.seal[i]) n++;
  return n;
}
function paintCellSeal(i,animate){
  const el=G.cells[i];
  if(!el) return;
  el.classList.remove('nbr');
  el.classList.toggle('seal',!!G.seal[i]);
  if(!G.seal[i]){
    if(el.__stampT){ clearTimeout(el.__stampT); el.__stampT=null; }
    el.classList.remove('fx-stamp');
    return;
  }
  /* 只有新贴上的封条才播盖章；转屏重建 / 预翻不传 animate */
  if(!animate) return;
  el.classList.remove('fx-stamp');
  void (el.offsetWidth||0);
  el.classList.add('fx-stamp');
  /* 盖章播完就摘类，避免常驻类挡住后续的环境抖动 */
  if(el.__stampT) clearTimeout(el.__stampT);
  el.__stampT=setTimeout(function(){
    el.__stampT=null;
    if(el.classList) el.classList.remove('fx-stamp');
  },520);
}
function toggleSeal(i,ox,oy){
  if(!G.active||G.over||G.paused) return;
  if(i<0||i>=G.cells.length) return;
  if(G.open[i]) return;
  G.seal[i]=!G.seal[i];
  const el=G.cells[i];
  if(G.seal[i]&&el&&el.style&&el.style.setProperty){
    /* 盖章从手指落点砸下 */
    el.style.setProperty('--sx',(ox==null?50:ox).toFixed(1)+'%');
    el.style.setProperty('--sy',(oy==null?50:oy).toFixed(1)+'%');
    el.style.setProperty('--d','0ms');
  }
  paintCellSeal(i,true);
  if(G.seal[i]){ G.sealsPlaced++; tone(180,0.09,0.05); }
  else{
    if(el&&el.classList&&typeof el.classList.add==='function'){
      el.classList.add('fx-peel');
      setTimeout(function(){ if(el.classList) el.classList.remove('fx-peel'); },160);
    }
    tone(320,0.05,0.035);
  }
  startTimer();
  updateHud();
  updateChordReady();
}
function setMode(m){
  const was=G.mode;
  G.mode=m==='seal'?'seal':'open';
  const b=$('btnMode');
  b.classList.toggle('seal',G.mode==='seal');
  $('modeIco').textContent=G.mode==='seal'?'🩹':'🧹';
  $('modeTxt').textContent=t(G.mode==='seal'?'modeSeal':'modeOpen');
  if(was!==G.mode&&!fxOff()) retrig($('modeIco'),'fx-flip',300);
  /* 贴封条模式：棋盘描一圈暗红细边，提示点击会封格 */
  if(document.body&&document.body.classList){
    document.body.classList.toggle('sealing',G.mode==='seal');
  }
}
function countSealsAround(i){
  const nb=neighbors(i);
  let n=0;
  for(let k=0;k<nb.length;k++) if(G.seal[nb[k]]&&!G.open[nb[k]]) n++;
  return n;
}
function updateChordReady(quiet){
  const next={};
  for(let i=0;i<G.cells.length;i++){
    const el=G.cells[i];
    if(!el) continue;
    const ready=!!(!G.over&&G.open[i]&&G.num[i]>0&&countSealsAround(i)===G.num[i]);
    if(ready) next[i]=1;
    el.classList.toggle('chordready',ready);
    if(!ready){ el.classList.remove('fresh'); continue; }
    /* 只给本轮新可 chord 的格子播一次脉冲，避免几十格永久呼吸 */
    if(!quiet&&!chordReadyPrev[i]){
      el.classList.add('fresh');
      (function(node){
        setTimeout(function(){ if(node&&node.classList) node.classList.remove('fresh'); },650);
      })(el);
    }
  }
  chordReadyPrev=next;
}
function sealAllMines(){
  let n=0;
  for(let i=0;i<G.mine.length;i++){
    if(G.mine[i]&&!G.seal[i]){
      G.seal[i]=true;
      /* 胜利封场：从左上到右下逐格落下 */
      const el=G.cells[i];
      if(el&&el.style&&el.style.setProperty) el.style.setProperty('--d',Math.min(n*5,200)+'ms');
      paintCellSeal(i,true);
      n++;
    }
  }
  updateHud();
}
function chord(i){
  if(!G.active||G.over||G.paused) return;
  if(!G.open[i]||!(G.num[i]>0)) return;
  const around=countSealsAround(i);
  if(around!==G.num[i]){
    /* 封条数对不上：已经贴过封条才抖一下，避免查看数字也被抖 */
    if(around>0){
      retrig(G.cells[i],'fx-shake',440);
      tone(140,0.08,0.04);
    }
    return;
  }
  startTimer();
  const nb=neighbors(i);
  for(let k=0;k<nb.length;k++){
    const q=nb[k];
    if(G.open[q]||G.seal[q]) continue;
    if(G.mine[q]){ sfxClick(); hitMine(q); return; }
  }
  sfxClick();
  /* 连锁成立：源格先闪一下，邻格跟着涟漪翻开 */
  retrig(G.cells[i],'fx-chain',320);
  for(let k=0;k<nb.length;k++){
    const q=nb[k];
    if(G.open[q]||G.seal[q]) continue;
    revealCell(q);
    if(G.over) return;
  }
}

let hudBugsPrev=null,hudHintsPrev=null,hudTickPrev=0;
function updateHud(){
  const total=G.placed?G.placedMines:G.mines;
  const bugs=String(Math.max(0,total-countSeals()));
  const bugsEl=$('hudBugs');
  if(bugsEl&&bugsEl.textContent!==bugs){
    if(hudBugsPrev!=null&&parseInt(bugs,10)<parseInt(hudBugsPrev,10)) bumpFx(bugsEl,'fx-down',320);
    else if(hudBugsPrev!=null) bumpFx(bugsEl,'fx-up',320);
    bugsEl.textContent=bugs;
  }
  hudBugsPrev=bugs;
  $('hudTime').textContent=fmtMs(G.elapsed);
  const hints=String(G.hintsLeft);
  const hintsEl=$('hudHints');
  if(hintsEl&&hintsEl.textContent!==hints){
    if(hudHintsPrev!=null&&G.hintsLeft<parseInt(hudHintsPrev,10)) bumpFx(hintsEl,'fx-down',320);
    hintsEl.textContent=hints;
  }
  hudHintsPrev=hints;
  $('btnHint').classList.toggle('b0',G.active&&G.hintsLeft<=0);
}

/* 计时 HUD：只在整秒变化时轻脉冲；超过标准时间后转琥珀并缓慢呼吸 */
function syncTimerHud(){
  const el=$('hudTime');
  if(!el) return;
  const txt=fmtMs(G.elapsed);
  if(el.textContent!==txt) el.textContent=txt;
  const sec=Math.round(G.elapsed/1000);
  if(sec!==hudTickPrev){
    hudTickPrev=sec;
    if(!fxOff()) retrig(el,'fx-tick',220);
  }
  if(el.classList){
    const std=((G.cfg&&G.cfg.std)||0)*1000;
    if(std>0&&G.elapsed>std) el.classList.add('over');
    else el.classList.remove('over');
  }
}

function startTimer(){
  if(G.timerOn||G.over) return;
  G.timerOn=true;G.timerTs=Date.now();
  if(G.tickId) clearInterval(G.tickId);
  G.tickId=setInterval(function(){
    if(!G.timerOn||G.paused||G.over) return;
    G.elapsed+=Date.now()-G.timerTs;
    G.timerTs=Date.now();
    syncTimerHud();
  },250);
}

function freezeTimer(){
  if(!G.timerOn) return;
  G.elapsed+=Date.now()-G.timerTs;
  G.timerOn=false;
  if(G.tickId){ clearInterval(G.tickId); G.tickId=null; }
  syncTimerHud();
}

function revealCell(i){
  /* 广度优先：按离起点的层数错峰翻开，零区向外一圈圈荡开 */
  const queue=[i],dep=[];
  dep[i]=0;
  let head=0,opened=0,maxD=0;
  while(head<queue.length){
    const k=queue[head++];
    if(G.open[k]||G.mine[k]||G.seal[k]) continue;
    G.open[k]=true;G.revealed++;
    const d=dep[k]||0;
    if(d>maxD) maxD=d;
    opened++;
    paintCell(k,d?Math.min(d*14,220):0);
    if(G.num[k]===0){
      const nb=neighbors(k);
      for(let q=0;q<nb.length;q++){
        const n=nb[q];
        if(!G.open[n]&&!G.mine[n]&&!G.seal[n]&&dep[n]===undefined){ dep[n]=d+1; queue.push(n); }
      }
    }
  }
  /* 大范围扩散时补一层可见的清扫波；小范围不开，避免每一下都晃 */
  if(opened>12) floodSweep(i,maxD);
  updateHud();
  checkWin();
  updateChordReady();
}

function calcStars(ms,hints){
  const std=((G.cfg&&G.cfg.std)||0)*1000;
  const fast=std>0&&ms<=std;
  const noHint=hints===0;
  if(noHint&&fast) return 3;
  if(noHint||fast) return 2;
  return 1;
}

function recordWin(stars){
  const ms=G.elapsed;
  S.totalWins++;
  if(G.daily){
    const key=todayKey();
    if(S.daily.key!==key){
      S.daily={key:key,done:false,bestMs:0,bestStars:0,rewarded:false,
        streak:Math.max(0,parseInt(S.daily.streak,10)||0),
        lastKey:typeof S.daily.lastKey==='string'?S.daily.lastKey:''};
    }
    if(!S.daily.done){
      if(S.daily.lastKey===yesterdayKey()) S.daily.streak=Math.max(1,(S.daily.streak||0)+1);
      /* 同一天重打（奖励重置后可发生）：连击不变，不清零也不重复 +1 */
      else if(S.daily.lastKey!==key) S.daily.streak=1;
      S.daily.lastKey=key;
    }
    S.daily.done=true;
    if(!S.daily.bestMs||ms<S.daily.bestMs) S.daily.bestMs=ms;
    if(stars>S.daily.bestStars) S.daily.bestStars=stars;
  }else{
    const st=S.stats[G.cfg.id];
    if(st){
      st.wins++;
      if(!st.bestMs||ms<st.bestMs) st.bestMs=ms;
      if(stars>st.bestStars) st.bestStars=stars;
    }
  }
  saveGame();
}

function unlockAch(id){
  if(S.ach&&S.ach[id]) return false;
  if(!S.ach) S.ach={};
  S.ach[id]=true;
  return true;
}
function refreshAchCount(){
  const s=achCount()+'/'+ACH_LIST.length;
  $('achCount').textContent=s;
  $('achTopCount').textContent=s;
}
function checkAchievements(won){
  if(!won) return;
  const got=[];
  const add=function(id){ if(unlockAch(id)) got.push(achData(id)[0]); };
  const cfg=G.cfg||{};
  if(S.totalWins>=1) add('ms_first');
  if(S.totalWins>=10) add('ms_ten');
  if(cfg.id==='hard') add('ms_hard');
  if(G.hintsUsed===0) add('ms_perfect');
  if(cfg.id==='easy'&&G.elapsed<=15000) add('ms_speed');
  if(G.sealsPlaced===0) add('ms_noseal');
  if(S.daily.streak>=7) add('ms_daily7');
  if(S.stats.easy.wins>0&&S.stats.normal.wins>0&&S.stats.hard.wins>0) add('ms_all');
  if(!got.length) return;
  saveGame();
  refreshAchCount();
  toast(t('achUnlocked',{name:got.join(' · ')}),'ach');
  retrig($('btnAch'),'fx-shake',420);
  retrig($('achTopCount'),'fx-up',320);
  tone(990,0.12,0.05);
}

function checkWin(){
  if(G.over) return;
  if(G.revealed>=G.rows*G.cols-G.placedMines){
    G.over=true;G.won=true;
    stopSealWiggle();
    /* 自检模式：只判定胜负，不写存档、不弹层、不发声 */
    if(G.test) return;
    freezeTimer();
    G.stars=calcStars(G.elapsed,G.hintsUsed);
    let prevBest=0;
    if(G.daily) prevBest=(S.daily.key===todayKey())?S.daily.bestMs:0;
    else prevBest=S.stats[G.cfg.id]?S.stats[G.cfg.id].bestMs:0;
    recordWin(G.stars);
    G.newBest=!prevBest||G.elapsed<prevBest;
    /* 金币只发给「今日大扫除」的每日首通，普通三档通关不发 */
    G.rewardEligible=(window.parent!==window)&&G.daily&&!S.daily.rewarded;
    sealAllMines();
    cleanStamp();
    winSweep();
    sfxWin();
    vibrate(20);
    checkAchievements(true);
    const rid=G.runId;
    setTimeout(function(){ if(G.active&&G.runId===rid) showResult(true); },fxOff()?260:520);
  }
}

function requestDailyReward(){
  const rid=G.runId;
  try{ window.parent.postMessage({type:'yueba-minesweeper-daily'},'*'); }catch(e){}
  if(rewardTimer) clearTimeout(rewardTimer);
  rewardTimer=setTimeout(function(){
    rewardTimer=null;
    if(G.runId!==rid||!G.over||!G.won) return;
    $('resCoin').textContent=t('rewardTimeout');
    retrig($('resCoin'),'fx-shake',360);
  },2500);
}

/* 敲一敲：只翻开安全格，绝不翻出月巴；无安全格可用时不消耗次数 */
function useHint(){
  if(!G.active||G.over||G.paused) return;
  if(G.hintsLeft<=0){ bumpFx($('btnHint'),'fx-empty',640); toast(t('hintNoneLeft')); return; }
  const N=G.rows*G.cols;
  if(!G.placed){
    const start=(Math.random()*N)|0;
    G.seed=(Date.now()^0x9e3779b9)>>>0;
    placeMines(start);
    G.placed=true;
    updateHud();
  }
  const safe=[];
  for(let i=0;i<N;i++){ if(!G.mine[i]&&!G.open[i]) safe.push(i); }
  if(!safe.length){ bumpFx($('btnHint'),'fx-empty',640); toast(t('hintNone')); return; }
  const pick=safe[(Math.random()*safe.length)|0];
  if(G.seal[pick]){ G.seal[pick]=false; paintCellSeal(pick); }
  G.hintsLeft--;G.hintsUsed++;S.totalHints++;
  startTimer();
  tone(760,0.07,0.05);
  bumpFx($('btnHint'),'fx-tap',220);
  knockAt(pick);
  updateHud();
  revealCell(pick);
  spotAt(pick);
  updateChordReady();
}

/* 把一只偷番茄的月巴画到格子上；图片加载失败时退回图标 */
function paintThief(i,boom){
  const el=G.cells[i];
  if(!el) return;
  el.classList.remove('chordready');
  el.classList.add('mine');
  if(boom) el.classList.add('boom','open');
  const th=THIEVES[G.face[i]>=0?G.face[i]:0]||THIEVES[0];
  if(el.setAttribute) el.setAttribute('aria-label',th[0]);
  if(typeof el.appendChild!=='function'){ el.textContent='🥷'; return; }
  el.textContent='';
  const img=document.createElement('img');
  img.className='thf';
  img.src=PICGO+th[1];
  img.alt=th[0];
  img.draggable=false;
  img.decoding='async';
  img.onerror=function(){
    if(img.parentNode) img.parentNode.removeChild(img);
    el.textContent='🥷';
  };
  el.appendChild(img);
}

function addLoot(i){
  const el=G.cells[i];
  if(!el||typeof el.appendChild!=='function') return;
  if(typeof el.querySelector==='function'&&el.querySelector('.loot')) return;
  const t=document.createElement('i');
  t.className='loot';
  t.textContent='🍅';
  el.appendChild(t);
}

/* 失败：一颗番茄从爆点被顺走，飞向右上角的剩余小偷计数 */
function stealTomatoFly(i){
  if(fxOff()||G.test) return;
  const el=G.cells[i],target=$('hudBugs');
  if(!el||!target||typeof el.getBoundingClientRect!=='function'||
     typeof target.getBoundingClientRect!=='function') return;
  const r=el.getBoundingClientRect(),tr=target.getBoundingClientRect();
  if(!r.width||!r.height||!tr.width) return;
  const sx=r.left+r.width/2,sy=r.top+r.height/2;
  const d=document.createElement('div');
  d.className='lost-tom';
  d.style.left=sx.toFixed(1)+'px';
  d.style.top=sy.toFixed(1)+'px';
  d.style.setProperty('--tx',(tr.left+tr.width/2-sx).toFixed(1)+'px');
  d.style.setProperty('--ty',(tr.top+tr.height/2-sy).toFixed(1)+'px');
  document.body.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },800);
}

function hitMine(i){
  paintThief(i,true);
  addLoot(i);
  G.hitFace=G.face[i]>=0?G.face[i]:0;
  for(let k=0;k<G.cells.length;k++){
    const c=G.cells[k];
    if(c) c.classList.remove('chordready');
  }
  G.revealed++;
  G.over=true;
  stopSealWiggle();
  if(G.test) return;
  freezeTimer();
  splashAt(i);
  stealTomatoFly(i);
  /* 屏幕边缘一次红色渐晕，始终定时移除，低功耗下不加 */
  if(!fxOff()&&document.body&&document.body.classList){
    document.body.classList.add('lostfx');
    setTimeout(function(){ if(document.body&&document.body.classList) document.body.classList.remove('lostfx'); },900);
  }
  sfxLose();
  vibrate(30);
  let stagger=0;
  for(let k=0;k<G.mine.length;k++){
    if(!G.mine[k]||k===i) continue;
    const e=G.cells[k];
    if(e){
      e.classList.remove('seal');
      paintThief(k,false);
      /* 每只月巴错开一点起跳，跳成一串 Q 弹的波浪 */
      if(e.style&&e.style.setProperty) e.style.setProperty('--d',(stagger++%7)*45+'ms');
    }
  }
  const bd=$('board');
  if(bd) bd.classList.add('lost');
  const rid=G.runId;
  const wait=fxOff()?360:1500;
  setTimeout(function(){ if(G.active&&G.runId===rid) showResult(false); },wait);
}

function onCell(i){
  if(!G.active||G.over||G.paused) return;
  if(G.open[i]) return;
  if(G.seal[i]) return;
  const first=!G.placed;
  if(!G.placed){
    G.seed=(Date.now()^0x9e3779b9)>>>0;
    placeMines(i);
    G.placed=true;
    updateHud();
  }
  startTimer();
  sfxClick();
  if(G.mine[i]){ hitMine(i); return; }
  if(G.open[i]) return;
  vibrate(6);
  revealCell(i);
  if(first) inkAt(i);
}

function showResult(won){
  G.won=won;
  const th=THIEVES[G.hitFace>=0?G.hitFace:0]||THIEVES[0];
  $('resTitle').textContent=t(won?'winTitle':'loseTitle');
  $('resSub').textContent=t(won?'winSub':'loseSub',{time:fmtMs(G.elapsed),name:th[0]});
  $('resAgain').textContent=t('again');
  $('resBack').textContent=t('backTitle');
  /* 每日挑战通关后当天锁定，不再提供“再来一局” */
  $('resAgain').style.display=(won&&G.daily)?'none':'';
  $('resBoard').style.display=won?'':'none';

  /* 失败时把偷走番茄的那只月巴亮出来 */
  const thEl=$('resThief');
  if(!won){
    thEl.innerHTML='<img src="'+PICGO+th[1]+'" alt="'+esc(th[0])+'"><b>'
      +esc(t('loseThief',{name:th[0]}))+'</b>';
    thEl.classList.add('show');
    const im=thEl.querySelector('img');
    if(im) im.onerror=function(){ im.style.display='none'; };
  }else{
    thEl.innerHTML='';
    thEl.classList.remove('show');
  }

  const starEl=$('resStars'), statEl=$('resStats');
  if(won){
    starEl.innerHTML=starHTMLAnimated(G.stars);
    const bestMs=G.daily?S.daily.bestMs:(S.stats[G.cfg.id]?S.stats[G.cfg.id].bestMs:0);
    let html=esc(t('resLine',{time:fmtMs(G.elapsed),hints:G.hintsUsed}));
    if(bestMs>0){
      html+='<br>'+(G.newBest
        ?'<span class="newbest">'+esc(t('resNewBest',{best:fmtMs(bestMs)}))+'</span>'
        :esc(t('resBest',{best:fmtMs(bestMs)})));
    }
    statEl.innerHTML=html;
  }else{
    starEl.innerHTML='';
    statEl.textContent=t('resLine',{time:fmtMs(G.elapsed),hints:G.hintsUsed});
  }

  /* 胜利：三颗番茄依次落位；失败不显示 */
  const tomEl=$('resToms');
  if(won){
    tomEl.innerHTML='<i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>';
    tomEl.classList.add('show');
  }else{
    tomEl.innerHTML='';
    tomEl.classList.remove('show');
  }

  const coin=$('resCoin');
  coin.textContent='';
  /* 金币仅发给每日大扫除首通；普通三档不显示任何金币 */
  if(won&&G.daily){
    if(G.rewardEligible){
      coin.textContent=t('rewardPending');
      requestDailyReward();
    }else if(window.parent===window){
      coin.textContent=t('rewardStandalone');
    }else{
      coin.textContent=t('rewardClaimed');
    }
  }
  $('resultModal').classList.add('show');
  /* 胜利才上报排行榜；失败只看不上报 */
  if(won) boardMaybeSubmit();
}

function startGame(cfg,opts){
  if(!cfg) return;
  const o=opts||{};
  /* 今日挑战已完成：当天不再开放 */
  if(o.daily&&S.daily.key===todayKey()&&S.daily.done){ toast(t('dailyDone')); return; }
  G.active=true;G.cfg=cfg;G.daily=!!o.daily;
  G.rows=cfg.rows;G.cols=cfg.cols;G.mines=cfg.mines;G.rot=0;
  G.mine=[];G.num=[];G.open=[];G.seal=[];G.cells=[];G.face=[];G.hitFace=-1;
  G.placed=false;G.placedMines=0;G.revealed=0;G.seed=0;
  G.elapsed=0;G.timerOn=false;G.timerTs=0;
  if(G.tickId){ clearInterval(G.tickId); G.tickId=null; }
  G.paused=false;G.over=false;G.won=false;G.rewardEligible=false;
  G.hintsLeft=3;G.hintsUsed=0;G.sealsPlaced=0;G.stars=0;G.newBest=false;
  G.runId++;
  clearLongPress();
  clearBoardFx();
  chordReadyPrev={};
  lastFloodTs=0;
  hudBugsPrev=null;hudHintsPrev=null;hudTickPrev=0;
  if(document.body&&document.body.classList) document.body.classList.remove('lostfx','paused');
  const ht0=$('hudTime');
  if(ht0&&ht0.classList) ht0.classList.remove('over','fx-tick');
  setMode('open');
  if(rewardTimer){ clearTimeout(rewardTimer); rewardTimer=null; }
  $('resCoin').textContent='';
  $('resStars').textContent='';
  $('resToms').textContent='';
  $('resToms').classList.remove('show');
  $('resStats').textContent='';
  $('resThief').textContent='';
  $('resThief').classList.remove('show');
  $('board').classList.remove('lost');
  $('resultModal').classList.remove('show');
  $('pauseModal').classList.remove('show');
  $('menuView').classList.add('hide');
  $('gameView').classList.add('show');
  $('gameView').scrollTop=0;
  $('gameHint').textContent=t('gameHint');
  buildBoardDOM();
  /* 手机竖屏：大扫除整盘顺时针转 90°，让 30 列收成竖向 30 行 */
  const wantRot=desiredRot(cfg);
  if(wantRot){ rotateBoard(wantRot); G.rot=wantRot; }
  $('gameInfo').textContent=t('gameInfo',{name:t(cfg.name),r:G.rows,c:G.cols,m:G.mines});

  if(G.daily){
    /* 每日局：按日期种子固定布雷，中心 3×3 预先翻开；预翻不计时 */
    G.seed=daySeed(todayKey());
    const center=(G.rows>>1)*G.cols+(G.cols>>1);
    placeMines(center);
    G.placed=true;
    const cr=(center/G.cols)|0,cc0=center%G.cols;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const rr=cr+dr,cc=cc0+dc;
      if(rr<0||rr>=G.rows||cc<0||cc>=G.cols) continue;
      revealCell(rr*G.cols+cc);
    }
    G.elapsed=0;
  }else{
    const st=S.stats[cfg.id];
    if(st){ st.plays++; saveGame(); }
  }
  document.body.classList.add('playing');
  fitBoard();
  updateHud();
  /* 开局入场：整盘轻压 + 四角框线亮一下 */
  if(!fxOff()) retrig($('board'),'fx-in',240);
  scheduleSealWiggle();
}

function pauseGame(){
  if(!G.active||G.over||G.paused) return;
  G.paused=true;
  freezeTimer();
  stopSealWiggle();
  if(document.body&&document.body.classList) document.body.classList.add('paused');
  $('pauseModal').classList.add('show');
}

function resumeGame(){
  if(!G.active||G.over||!G.paused) return;
  G.paused=false;
  if(document.body&&document.body.classList) document.body.classList.remove('paused');
  $('pauseModal').classList.remove('show');
  startTimer();
  scheduleSealWiggle();
}

/* 结算退场：面板 150ms 缩放淡出后再切菜单；防止连点重复触发 */
let resultLeaving=false;
function leaveResult(){
  if(resultLeaving) return;
  boardPendingSend=null;                        // 离开结算就不再补发成绩
  if($('nickModal').classList.contains('show')) closeNick();
  const m=$('resultModal');
  if(!m||!m.classList||!m.classList.contains('show')||fxOff()){ backToMenu(); return; }

  const panel=m.querySelector?m.querySelector('.resPanel'):null;
  const rid=G.runId;
  if(panel&&panel.classList) retrig(panel,'fx-out',160);
  setTimeout(function(){
    resultLeaving=false;
    if(G.runId!==rid) return;
    backToMenu();
  },150);
}

  $('resCoin').textContent='';
  $('resStars').textContent='';
  $('resToms').textContent='';

const LP_MS=350;
let lpTimer=null,lpFired=false,lpIndex=-1,lpX=0,lpY=0,lpSx=50,lpSy=50,lpRingEl=null;
/* 手指落点在格子里的百分比坐标，供盖章与进度环定位 */
function pointInCellPct(el,cx,cy){
  if(!el||typeof el.getBoundingClientRect!=='function') return null;
  const r=el.getBoundingClientRect();
  if(!r.width||!r.height) return null;
  return {x:(cx-r.left)/r.width*100,y:(cy-r.top)/r.height*100};
}
function hideLpRing(){
  if(lpRingEl&&lpRingEl.parentNode) lpRingEl.parentNode.removeChild(lpRingEl);
  lpRingEl=null;
}
/* 长按进度环：在格子上画一圈 350ms 填满的油渍 */
function showLpRing(i){
  hideLpRing();
  if(fxOff()||G.test) return;
  const el=G.cells[i];
  if(!el||typeof el.appendChild!=='function') return;
  const ring=document.createElement('span');
  ring.className='fx-lp' + (LP_ANIM?'':' fallback');
  el.appendChild(ring);
  lpRingEl=ring;
}
function clearLongPress(){
  if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; }
  hideLpRing();
  lpIndex=-1;
}
function cellIndexFromEvent(e){
  const el=(e.target&&e.target.closest)?e.target.closest('.cell'):null;
  if(!el) return -1;
  return parseInt(el.getAttribute('data-i'),10);
}
/* 桌面端 hover 预判：悬停数字格时给 8 邻格描一圈淡琥珀 */
function clearHoverNbrs(){
  for(let k=0;k<hoverNbrs.length;k++){
    const el=hoverNbrs[k];
    if(el&&el.classList) el.classList.remove('nbr');
  }
  hoverNbrs=[];hoverIdx=-1;
}
function setHoverNbrs(i){
  if(i===hoverIdx) return;
  clearHoverNbrs();
  if(i<0||i>=G.cells.length) return;
  hoverIdx=i;
  if(!G.open[i]||!(G.num[i]>0)) return;
  const nb=neighbors(i);
  for(let k=0;k<nb.length;k++){
    const el=G.cells[nb[k]];
    if(el&&el.classList){ el.classList.add('nbr'); hoverNbrs.push(el); }
  }
}
$('board').addEventListener('pointerover',function(e){
  if(e.pointerType&&e.pointerType!=='mouse') return;
  setHoverNbrs(cellIndexFromEvent(e));
});
$('board').addEventListener('pointerleave',clearHoverNbrs);
$('board').addEventListener('pointerdown',function(e){
  if(e.button===2) return;                 /* 右键交给 contextmenu */
  const i=cellIndexFromEvent(e);
  if(i<0) return;
  clearLongPress();
  lpFired=false;lpIndex=i;lpX=e.clientX;lpY=e.clientY;
  const pct=pointInCellPct(G.cells[i],e.clientX,e.clientY);
  lpSx=pct?pct.x:50;lpSy=pct?pct.y:50;
  if(!G.open[i]) showLpRing(i);
  lpTimer=setTimeout(function(){
    lpTimer=null;
    if(lpIndex<0) return;
    if(!G.active||G.over||G.paused) return;
    const k=lpIndex;
    lpIndex=-1;
    if(G.open[k]) return;
    lpFired=true;
    hideLpRing();
    toggleSeal(k,lpSx,lpSy);
  },LP_MS);
});
$('board').addEventListener('pointermove',function(e){
  if(!lpTimer) return;
  if(Math.abs(e.clientX-lpX)>10||Math.abs(e.clientY-lpY)>10) clearLongPress();
});

  const i=cellIndexFromEvent(e);
  if(i<0) return;

/* ================= 云端排行榜（复用 yueba-sync Worker 的 /board 接口） =================
   · 不做账号：客户端生成匿名 uid 存 localStorage，昵称玩家自取（12 字以内）
   · 普通三档 → 总榜（day='all'）；每日局 → 日榜（day=当日），同一天全世界同一张棋盘
   · 成绩无防伪，仅靠服务端时间范围校验兜底 */
const BOARD_API='https://yueba-sync.yueba.workers.dev';
const BOARD_UID_KEY='yueba-ms-board-uid';
const BOARD_NAME_KEY='yueba-ms-board-name';
const BOARD_TABS=[
  {id:'easy',label:'boardTabEasy'},
  {id:'normal',label:'boardTabNormal'},
  {id:'hard',label:'boardTabHard'},
  {id:'daily',label:'boardTabDaily'}
];
let boardPendingSend=null;
let boardCur='daily';
let boardSeq=0;

function boardUid(){
  let u='';
  try{ u=localStorage.getItem(BOARD_UID_KEY)||''; }catch(e){}
  if(!/^[A-Za-z0-9_-]{8,64}$/.test(u)){
    const r=new Uint8Array(8);
    (window.crypto||window.msCrypto).getRandomValues(r);
    u=[].map.call(r,function(b){ return (b|0).toString(16).padStart(2,'0'); }).join('');
    try{ localStorage.setItem(BOARD_UID_KEY,u); }catch(e){}
  }
  return u;
}
function boardName(){
  let n='';
  try{ n=localStorage.getItem(BOARD_NAME_KEY)||''; }catch(e){}
  return n;
}
function boardSetName(n){
  try{ localStorage.setItem(BOARD_NAME_KEY,n); }catch(e){}
}
function fmtSec(sec){
  const s=Math.max(0,sec|0), m=(s/60)|0;
  return m+':'+((s%60)<10?'0':'')+(s%60);
}
function boardDayOf(tab){ return tab==='daily'?todayKey():'all'; }

async function boardPost(scope,sec,name){
  const r=await fetch(BOARD_API+'/board',{
    method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({day:scope.day,diff:scope.diff,uid:boardUid(),name:name,time:sec})
  });
  if(!r.ok) throw new Error('board_http_'+r.status);
  const j=await r.json();
  return j&&j.rank;
}

/* 通关后调用：上报成绩；首次没有昵称先弹取名框，取完再报 */

  const scope={day:G.daily?todayKey():'all',diff:G.daily?'daily':G.cfg.id};
  const send=function(){
    boardPost(scope,sec,boardName()).then(function(rank){
      if(!rank||!G.active||!G.over||!G.won) return;
      const st=$('resStats');
      if(st) st.innerHTML+='<br><b style="color:var(--accent2)">'+esc(t('boardRank',{n:rank}))+'</b>';
    }).catch(function(){ /* 静默失败：排行榜不可用不影响结算 */ });
  };
  if(!boardName()){ boardPendingSend=send; openNick(); }
  else send();
}

/* ================= 自检（?selftest=1） ================= */
/* 用临时棋盘跑真实逻辑，跑完恢复 G；不写存档、不弹层 */
function msScratch(rows,cols,mines,seed,center,fn){
  const bak={rows:G.rows,cols:G.cols,mines:G.mines,seed:G.seed,mine:G.mine,num:G.num,
    open:G.open,seal:G.seal,cells:G.cells,face:G.face,hitFace:G.hitFace,revealed:G.revealed,placedMines:G.placedMines,
    active:G.active,over:G.over,won:G.won,elapsed:G.elapsed,timerOn:G.timerOn,paused:G.paused,
    runId:G.runId,hintsLeft:G.hintsLeft,hintsUsed:G.hintsUsed,stars:G.stars,newBest:G.newBest,
    cfg:G.cfg,daily:G.daily,test:G.test};
  const N=rows*cols;
  G.rows=rows;G.cols=cols;G.mines=mines;G.seed=seed;
  G.mine=[];G.num=[];G.open=[];G.seal=[];G.cells=[];G.face=[];G.hitFace=-1;
  for(let i=0;i<N;i++){
    G.mine.push(false);G.num.push(0);G.open.push(false);G.seal.push(false);
    G.cells.push({classList:{add:function(){},remove:function(){},toggle:function(){}},
      style:{setProperty:function(){}},textContent:''});
  }
  G.revealed=0;G.placedMines=0;
  G.active=false;G.over=false;G.won=false;G.elapsed=0;G.timerOn=false;G.paused=false;
  G.runId=-1;G.hintsLeft=3;G.hintsUsed=0;G.stars=0;G.newBest=false;G.test=true;
  placeMines(center);
  try{ return fn(); }
  finally{ Object.assign(G,bak); }
}
function countMines(){
  let n=0;
  for(let i=0;i<G.mine.length;i++) if(G.mine[i]) n++;
  return n;
}
function runSelfTest(){
  const rows=[];
  function ok(name,fn){
    try{ const r=fn(); rows.push({name:name,pass:r===true}); }
    catch(e){ rows.push({name:name,pass:false,msg:String(e&&e.message||e)}); }
  }
  ok('偷茄月巴数量（三档 × 100 种子）',function(){
    for(let d=0;d<DIFFS.length;d++){
      const cfg=DIFFS[d];
      for(let k=0;k<100;k++){
        const csv=msScratch(cfg.rows,cfg.cols,cfg.mines,(k*2654435761+d*97)>>>0,
          (k*37+d*11)%(cfg.rows*cfg.cols),function(){ return countMines()+':'+G.placedMines; });
        const p=csv.split(':');
        if(parseInt(p[0],10)!==cfg.mines||parseInt(p[1],10)!==cfg.mines) return false;
      }
    }
    return true;
  });
  ok('首开 3×3 无偷茄月巴',function(){
    for(let k=0;k<30;k++){
      const cfg=DIFFS[k%DIFFS.length];
      const center=((cfg.rows>>1)*cfg.cols+(cfg.cols>>1));
      const bad=msScratch(cfg.rows,cfg.cols,cfg.mines,(k*40503+17)>>>0,center,function(){
        const cr=(center/G.cols)|0,cc=center%G.cols;
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const rr=cr+dr,c2=cc+dc;
          if(rr<0||rr>=G.rows||c2<0||c2>=G.cols) continue;
          if(G.mine[rr*G.cols+c2]) return 1;
        }
        return 0;
      });
      if(bad) return false;
    }
    return true;
  });
  ok('数字 = 相邻偷茄月巴数',function(){
    return msScratch(16,16,40,12345,120,function(){
      for(let i=0;i<G.rows*G.cols;i++){
        if(G.mine[i]) continue;
        const nb=neighbors(i);
        let n=0;
        for(let q=0;q<nb.length;q++) if(G.mine[nb[q]]) n++;
        if(G.num[i]!==n) return false;
      }
      return true;
    });
  });
  ok('0 格扩散且不翻出月巴',function(){
    return msScratch(9,9,10,777,40,function(){
      let start=-1;
      for(let i=0;i<81;i++) if(!G.mine[i]&&G.num[i]===0){ start=i; break; }
      if(start<0) return false;
      revealCell(start);
      if(G.revealed<2) return false;
      for(let i=0;i<81;i++) if(G.open[i]&&G.mine[i]) return false;
      return true;
    });
  });
  ok('全开为胜 / 少一格未胜',function(){
    const win=msScratch(9,9,10,2024,40,function(){
      for(let i=0;i<81;i++) if(!G.mine[i]) revealCell(i);
      return G.won===true&&G.over===true;
    });
    if(!win) return false;
    return msScratch(9,9,10,2024,40,function(){
      let omit=-1;
      for(let i=0;i<81;i++) if(!G.mine[i]&&G.num[i]>0){ omit=i; break; }
      if(omit<0) return false;
      for(let i=0;i<81;i++) if(!G.mine[i]&&i!==omit) revealCell(i);
      return G.won===false&&G.over===false;
    });
  });
  ok('翻到月巴立即结束（一命）',function(){
    return msScratch(9,9,10,99,40,function(){
      let m=-1;
      for(let i=0;i<81;i++) if(G.mine[i]){ m=i; break; }
      if(m<0) return false;
      hitMine(m);
      return G.over===true&&G.won===false;
    });
  });
  ok('每日同日期同盘 / 跨日不同',function(){
    const sig=function(key){
      return msScratch(9,9,10,daySeed(key),40,function(){
        let s='';
        for(let i=0;i<81;i++) s+=G.mine[i]?'1':'0';
        return s;
      });
    };
    const a=sig('2026-10-25'),b=sig('2026-10-25'),c=sig('2026-10-26');
    return a===b&&a!==c;
  });
  ok('存档写入 / 读取 / 损坏重建',function(){
    const bak=JSON.stringify(S);
    let raw=null;
    try{ raw=localStorage.getItem(SKEY); }catch(e){ return false; }
    try{
      saveGame();
      const d=JSON.parse(localStorage.getItem(SKEY));
      if(!d||!d.stats||typeof d.stats.easy.plays!=='number') return false;
      localStorage.setItem(SKEY,'{broken');
      loadSave();
      return !!S.stats&&!!S.stats.easy;
    }catch(e){ return false; }
    finally{
      S=JSON.parse(bak);
      try{ if(raw==null) localStorage.removeItem(SKEY); else localStorage.setItem(SKEY,raw); }catch(e){}
    }
  });

  const pass=rows.filter(function(r){ return r.pass; }).length;
  const box=document.createElement('div');
  box.id='selfTest';
  box.className='show';
  box.innerHTML='<b>SELF-TEST '+pass+'/'+rows.length+'</b>'
    +rows.map(function(r,i){
      return '<div class="'+(r.pass?'p':'f')+'">'+(r.pass?'PASS':'FAIL')+' '+(i+1)+'. '
        +esc(r.name)+(r.msg?' — '+esc(r.msg):'')+'</div>';
    }).join('');
  document.body.appendChild(box);
  console.log('[self-test] '+pass+'/'+rows.length);
  rows.forEach(function(r,i){
    console.log((r.pass?'PASS ':'FAIL ')+(i+1)+'. '+r.name+(r.msg?' — '+r.msg:''));
  });
}
if(new URLSearchParams(location.search).get('selftest')==='1') runSelfTest();

renderAll();
saveGame();
})();
